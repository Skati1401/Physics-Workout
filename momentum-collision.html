<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Momentum Animation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1f5;
    --bg-grid:rgba(29,41,61,0.055);
    --panel:#ffffff;
    --panel-border:#d7dce4;
    --ink:#182233;
    --ink-soft:#4c5668;
    --ink-faint:#8993a5;
    --accent:#d9720c;
    --accent-soft:#fdead2;
    --good:#15803d;
    --good-soft:#dcf5e3;
    --bad:#c0311a;
    --bad-soft:#fbe1db;
    --shadow:0 10px 26px -14px rgba(24,34,51,0.28);

    --motion:#2158d1;      --motion-soft:#dfe8fc;
    --elastic:#0c8a76;     --elastic-soft:#d6f3ee;
    --momentum:#b8267a;    --momentum-soft:#fbdeee;
    --newton:#3d3aa8;      --newton-soft:#e3e2f8;
    --moments:#6d3bce;     --moments-soft:#e9e0fb;
    --units:#96660b;       --units-soft:#f6e8ca;

    --font-display:'Big Shoulders',system-ui,sans-serif;
    --font-body:'IBM Plex Sans',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12161f; --bg-grid:rgba(255,255,255,0.045);
      --panel:#1b212e; --panel-border:#2c3444;
      --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;
      --accent:#ff9a3d; --accent-soft:#3a2712;
      --good:#4ade80; --good-soft:#123321;
      --bad:#f27159; --bad-soft:#3a1712;
      --shadow:0 14px 30px -14px rgba(0,0,0,0.55);
      --motion:#7da3ff; --motion-soft:#1a2440;
      --elastic:#4fd6bd; --elastic-soft:#0f2e29;
      --momentum:#ef83bd; --momentum-soft:#3a1c2c;
      --newton:#9d9af0; --newton-soft:#242259;
      --moments:#b393f5; --moments-soft:#2a2148;
      --units:#e0b64a; --units-soft:#332a10;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12161f; --bg-grid:rgba(255,255,255,0.045);
    --panel:#1b212e; --panel-border:#2c3444;
    --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;
    --accent:#ff9a3d; --accent-soft:#3a2712;
    --good:#4ade80; --good-soft:#123321;
    --bad:#f27159; --bad-soft:#3a1712;
    --shadow:0 14px 30px -14px rgba(0,0,0,0.55);
    --motion:#7da3ff; --motion-soft:#1a2440;
    --elastic:#4fd6bd; --elastic-soft:#0f2e29;
    --momentum:#ef83bd; --momentum-soft:#3a1c2c;
    --newton:#9d9af0; --newton-soft:#242259;
    --moments:#b393f5; --moments-soft:#2a2148;
    --units:#e0b64a; --units-soft:#332a10;
    color-scheme:dark;
  }

  :root{--c:var(--momentum);--cs:var(--momentum-soft);}

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      linear-gradient(var(--bg-grid) 1px,transparent 1px) 0 0/100% 34px,
      linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px) 0 0/34px 100%,
      var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  [hidden]{display:none!important;}
  button{font:inherit;color:inherit;}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;}

  .page{max-width:1400px;margin-inline:auto;padding-inline:20px;padding-block:12px 40px;}
  h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:0.2px;text-wrap:balance;margin:0;}
  p{margin:0;line-height:1.55;}

  .home-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-bottom:4px;font:600 13px var(--font-mono);color:var(--ink-soft);text-decoration:none;}
  .home-link:hover{color:var(--accent);}
  .page-head{margin-bottom:12px;}
  .eyebrow{font-family:var(--font-mono);font-size:11.5px;color:var(--accent);font-weight:600;margin-bottom:6px;}
  .page-head h1{font-size:clamp(28px,5vw,38px);color:var(--ink);}

  .card{background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;box-shadow:var(--shadow);}
  .btn{
    font-family:var(--font-body);font-weight:600;font-size:13.5px;color:var(--ink);
    background:var(--panel);border:1px solid var(--panel-border);border-radius:9px;
    padding:9px 15px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  }
  .btn:hover{border-color:var(--ink-faint);}
  .btn:disabled{opacity:.45;cursor:default;}
  .btn-primary{background:var(--ink);border-color:var(--ink);color:var(--bg);}
  .btn-primary:hover{opacity:.88;border-color:var(--ink);}
  .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);}
  .btn-group{display:flex;flex-wrap:wrap;gap:10px;}

  /* picture on the left; controls, readings and working on the right */
  .stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);gap:18px 24px;align-items:start;padding:18px;}
  @media (max-width:860px){ .stage{grid-template-columns:minmax(0,1fr);} }
  /* the picture shrinks on short screens so the whole box fits in the window */
  .view{display:block;width:100%;height:auto;max-height:max(260px,calc(100vh - 290px));}
  .embed .view{max-height:460px;}
  .under{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;margin-top:12px;}
  .under .btn-group{flex:0 1 auto;}
  .mass{flex:1 1 220px;min-width:0;}
  .sliders{flex:1 1 100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px 24px;}
  .eq .why{font-family:var(--font-body);font-size:11.5px;color:var(--ink-faint);margin-left:.8em;}
  .view text{font-family:var(--font-mono);}
  .side{display:flex;flex-direction:column;gap:12px;min-width:0;}
  .lab{display:flex;justify-content:space-between;font:12.5px var(--font-mono);color:var(--ink-soft);margin-bottom:6px;}
  .lab output{color:var(--ink);font-weight:600;}
  input[type=range]{width:100%;accent-color:var(--c);min-height:28px;}
  .seg{display:flex;flex-wrap:wrap;gap:6px;}
  .seg button{font:12.5px var(--font-mono);padding:8px 12px;min-height:44px;border:1px solid var(--panel-border);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer;}
  .seg button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--panel);}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px;}
  .stat strong{white-space:nowrap;}
  .stat{border:1px solid var(--panel-border);border-radius:8px;padding:5px 8px;}
  .stat small{display:block;font:10.5px var(--font-mono);color:var(--ink-faint);}
  .stat strong{font:600 15px var(--font-mono);color:var(--ink);}
  .stat.up strong{color:var(--accent);}
  .note{font-size:15px;line-height:1.5;color:var(--ink);padding:10px 12px;border-radius:8px;background:var(--bg);min-height:4.6em;}

  details.working summary{cursor:pointer;font:600 13px var(--font-mono);color:var(--c);min-height:44px;display:flex;align-items:center;}
  .eq{font-family:var(--font-mono);font-size:14px;line-height:1.75;padding:8px 12px;border-left:3px solid var(--c);background:var(--cs);border-radius:6px;color:var(--ink);}
  .eq b{color:var(--c);}
  .eqg{display:grid;grid-template-columns:auto auto minmax(0,1fr);column-gap:.45em;row-gap:.2em;align-items:center}
  .eqg-l{justify-self:end;text-align:right}
  .eqg-m{justify-self:center}
  .eqg-r{justify-self:start;min-width:0}
  .eqg-full{grid-column:1/-1}
  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1.25;}
  .frac>span{padding:0 .25em;white-space:nowrap;}
  .frac>span:first-child{border-bottom:1.5px solid currentColor;}
  @media (max-width:560px){ .stage{padding:12px;} .eq{font-size:12.5px;padding:6px 8px;} }

  /* inside a workout tab (skydiver.html?embed): no page heading, no outer margins */
  .embed body{background:transparent;}
  .embed .page{padding:0;max-width:none;}
  .embed .home-link,.embed .page-head{display:none;}
  .hint{font-size:13px;color:var(--ink-soft);}
  .embed .view{max-height:none;}
  @media (min-width:861px){ .stage{grid-template-columns:minmax(0,1fr) minmax(300px,470px);} }
</style>
</head>
<body>
<div class="page" id="page">
  <a class="home-link" href="index.html">&larr; Home</a>
  <header class="page-head">
    <div class="eyebrow">Animations &middot; forces &middot; TA = Triple Award only</div>
    <h1>Momentum in a Collision</h1>
  </header>

  <section class="card stage">
    <div>
      <svg class="view" id="mo-svg" viewBox="0 12 560 136" role="img" aria-label="Two trolleys colliding"></svg>
      <div class="under">
        <div class="btn-group">
          <button class="btn btn-primary" id="mo-go" data-action="mo-go" type="button">&#9654; Go</button>
          <button class="btn" data-action="mo-reset" type="button">&#8634; Reset</button>
          <button class="btn" id="slow" type="button" aria-pressed="false">Slow motion</button>
        </div>
        <div class="sliders">
          <div><label class="lab" for="mo-ma"><span>Mass of trolley 1, m<sub>1</sub></span> <output id="mo-mao"></output></label><input type="range" id="mo-ma" min="1" max="5" step="0.5" value="2"></div>
          <div><label class="lab" for="mo-mb"><span>Mass of trolley 2, m<sub>2</sub></span> <output id="mo-mbo"></output></label><input type="range" id="mo-mb" min="1" max="5" step="0.5" value="1"></div>
          <div><label class="lab" for="mo-u"><span>Velocity of trolley 1, u<sub>1</sub></span> <output id="mo-uo"></output></label><input type="range" id="mo-u" min="1" max="6" step="0.5" value="3"></div>
          <div><label class="lab" for="mo-u2"><span>Velocity of trolley 2, u<sub>2</sub></span> <output id="mo-u2o"></output></label><input type="range" id="mo-u2" min="-3" max="3" step="0.5" value="0"></div>
        </div>
      </div>
    </div>
    <div class="side">
      <div><div class="lab">Collision</div><div class="seg" id="mo-mode"><button type="button" data-k="stick" aria-pressed="true">Stick together</button><button type="button" data-k="bounce" aria-pressed="false">Bounce apart</button></div></div>
      <p class="note" id="mo-note" aria-live="polite"></p>
      <p class="hint">Right is positive: a velocity to the left is negative.</p>
      <details class="working" id="working">
        <summary>Show working</summary>
        <div class="eq" id="mo-eq"></div>
      </details>
    </div>
  </section>
</div>
<script>
(function(){
  // This page is the one copy of this animation. On its own it is the lesson version;
  // with ?embed it drops its heading so a workout tab can show it in a frame, and it tells that page its height.
  var EMBED = /[?&]embed\b/.test(location.search);
  if(EMBED){
    document.documentElement.classList.add('embed');
    var wk=document.getElementById('working'); if(wk) wk.open = true;
    var page = document.getElementById('page');
    var sendHeight = function(){ try{ parent.postMessage({animHeight: Math.ceil(page.getBoundingClientRect().height)}, '*'); }catch(e){} };
    if(window.ResizeObserver) new ResizeObserver(sendHeight).observe(page);
    window.addEventListener('load', sendHeight);
  }
  function $(sel){ return document.querySelector(sel); }
  function bindRange(id, fn){ var el=$('#'+id); el.addEventListener('input', fn); return el; }
  function onAction(name, fn){ var b=$('[data-action="'+name+'"]'); if(b) b.addEventListener('click', fn); }
  var REDUCED_MOTION=false;   // runs start only when pressed and always end, so they play even with reduced motion on
  // Slow motion: every run multiplies its time step by SPEED()
  function SPEED(){ var b=document.getElementById('slow'); return b && b.getAttribute('aria-pressed')==='true' ? 0.3 : 1; }
  (function(){ var b=document.getElementById('slow'); if(b) b.addEventListener('click',function(){ b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed')!=='true')); }); })();
  function num(n, dp){   // round, drop trailing zeros, group thousands with a space from 10 000
    var f = Math.pow(10, dp||0), r = Math.round(n*f)/f, t = String(r);
    if(Math.abs(r)>=10000) t = t.replace(/\B(?=(\d{3})+(?!\d))/g,' ');
    return t;
  }
  function FR(t){
    return String(t).replace(/(\d) (?=\d{3}\b)/g,'$1 ')
      .replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g,'<span class="frac"><span>$1</span><span>$2</span></span>');
  }
  function arrowHead(id, col){ return '<marker id="'+id+'" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="'+col+'"/></marker>'; }
  function alignEquals(el){
    if(el.querySelector('.eqg')) return;
    var rows = el.innerHTML.split(/<br\s*\/?>/i).map(function(line){
      var i = line.indexOf(' = ');
      if(i<0) return '<span class="eqg-full">'+line+'</span>';
      return '<span class="eqg-l">'+line.slice(0,i)+'</span><span class="eqg-m">=</span><span class="eqg-r">'+line.slice(i+3)+'</span>';
    });
    el.innerHTML = '<div class="eqg">'+rows.join('')+'</div>';
  }
  function watchEquals(sel){ Array.prototype.forEach.call(document.querySelectorAll(sel), function(el){ alignEquals(el); new MutationObserver(function(){ alignEquals(el); }).observe(el, {childList:true}); }); }

  /* ---- momentum: trolley 1 hits trolley 2 (which may already be moving); stick together or bounce apart ---- */
  function initMomentumSim(){
    var maIn=bindRange('mo-ma',reset), uIn=bindRange('mo-u',reset), mbIn=bindRange('mo-mb',reset), u2In=bindRange('mo-u2',reset), mode='stick';
    var PXM=34, X0=20, GAP=3, LEFT=10, RIGHT=550, t=0, running=false, last=0, raf=0, modeEl=$('#mo-mode');
    modeEl.addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return; mode=b.dataset.k;
      Array.prototype.forEach.call(modeEl.children,function(x){ x.setAttribute('aria-pressed',String(x===b)); }); reset(); });
    function ma(){return +maIn.value;} function mb(){return +mbIn.value;} function u(){return +uIn.value;} function u2(){return +u2In.value;}
    function meets(){ return u()>u2(); }   // trolley 1 must be catching trolley 2
    function after(){   // velocities just after the collision (right is positive)
      var M=ma()+mb();
      if(mode==='stick'){ var v=(ma()*u()+mb()*u2())/M; return {va:v, vb:v}; }
      // bounce apart: a perfectly elastic collision, so no kinetic energy is lost
      return {va:((ma()-mb())*u()+2*mb()*u2())/M, vb:((mb()-ma())*u2()+2*ma()*u())/M};
    }
    function wOf(m){ return 46+m*12; }
    function tHit(){ return meets() ? GAP/(u()-u2()) : Infinity; }
    function state(tt){   // trolley 1's front edge and trolley 2's back edge, in metres from trolley 1's start
      var th=tHit();
      if(tt<=th) return {a:u()*tt, b:GAP+u2()*tt, va:u(), vb:u2(), hit:false};
      var v=after(), dt=tt-th, x=u()*th; return {a:x+v.va*dt, b:x+v.vb*dt, va:v.va, vb:v.vb, hit:true};
    }
    function px(st){ var wa=wOf(ma()); return {xa:X0+wa+st.a*PXM, xb:X0+wa+st.b*PXM}; }
    function offScreen(st){ var p=px(st); return p.xa-wOf(ma())<LEFT || p.xb+wOf(mb())>RIGHT || p.xa>RIGHT || p.xb<LEFT; }
    function endT(){   // stop when a trolley reaches the edge, or 2.5 s after the collision
      var lim=Math.min(8, isFinite(tHit()) ? tHit()+2.5 : 3);
      for(var tt=0; tt<lim; tt+=0.01){ if(offScreen(state(tt))) return Math.max(0, tt-0.01); }
      return lim;
    }
    function draw(){
      var st=state(t), wa=wOf(ma()), wb=wOf(mb()), p=px(st);
      var g='<defs>'+arrowHead('mo-h','var(--momentum)')+'</defs>';
      g+='<line x1="10" x2="550" y1="112" y2="112" stroke="var(--ink-soft)" stroke-width="3"/>';
      function trolley(x0,w,label,fill){ return '<rect x="'+x0+'" y="72" width="'+w+'" height="30" rx="5" fill="'+fill+'" stroke="var(--momentum)" stroke-width="2.5"/><circle cx="'+(x0+9)+'" cy="106" r="6" fill="var(--panel)" stroke="var(--ink)" stroke-width="2.5"/><circle cx="'+(x0+w-9)+'" cy="106" r="6" fill="var(--panel)" stroke="var(--ink)" stroke-width="2.5"/><text x="'+(x0+w/2)+'" y="92" text-anchor="middle" font-size="12.5" fill="var(--ink)">'+label[1]+'</text><text x="'+(x0+w/2)+'" y="66" text-anchor="middle" font-size="13" font-weight="600" fill="var(--momentum)">'+label[0]+'</text>'; }
      g+=trolley(p.xa-wa,wa,['1',ma()+' kg'],'var(--momentum-soft)');
      g+=trolley(p.xb,wb,['2',mb()+' kg'],'var(--panel)');
      function vel(x,v){ if(Math.abs(v)<0.005) return ''; var L=(10+Math.abs(v)*12)*(v<0?-1:1); x=Math.min(Math.max(x,14-Math.min(0,L)),546-Math.max(0,L)); return '<line x1="'+x+'" x2="'+(x+L)+'" y1="40" y2="40" stroke="var(--momentum)" stroke-width="4" marker-end="url(#mo-h)"/><text x="'+(x+L/2)+'" y="30" text-anchor="middle" font-size="12" fill="var(--momentum)">'+num(Math.abs(v),2)+' m/s</text>'; }
      if(st.hit && mode==='stick') g+=vel((p.xa-wa+p.xb+wb)/2, st.va);
      else { g+=vel(p.xa-wa/2, st.va); g+=vel(p.xb+wb/2, st.vb); }
      var before = u2()===0 ? 'Before: trolley 2 is at rest' : 'Before: trolley 2 moves '+(u2()<0?'left':'right')+' at '+num(Math.abs(u2()),2)+' m/s';
      var lab = !meets() ? 'Trolley 2 moves away at least as fast as trolley 1, so they never meet' : (!st.hit ? before : (mode==='stick' ? 'After: they move off together' : 'After: they bounce apart'));
      g+='<text x="10" y="140" font-size="11.5" fill="var(--ink-faint)">'+lab+'</text>';
      $('#mo-svg').innerHTML=g;
    }
    function sv(v){ return v<0?'(−'+num(-v,2)+')':num(v,2); }
    function sn(v){ return v<0?'−'+num(-v,2):num(v,2); }   // a real minus sign
    // v after the collision stays hidden until the run ends, so students can predict it first
    function eq(done){
      $('#mo-mao').textContent=ma()+' kg'; $('#mo-uo').textContent=u()+' m/s'; $('#mo-mbo').textContent=mb()+' kg';
      $('#mo-u2o').textContent=(u2()<0?'−'+num(-u2(),2):num(u2(),2))+' m/s'+(u2()<0?' (left)':(u2()>0?' (right)':''));
      if(!meets()){ $('#mo-eq').innerHTML='Trolley 1 never catches trolley 2, so there is no collision.'; return; }
      var p=ma()*u()+mb()*u2(), v=after(), M=ma()+mb();
      var lhs=ma()+' × '+u()+' + '+mb()+' × '+sv(u2());
      if(mode==='stick')
        $('#mo-eq').innerHTML=FR('total momentum before = total momentum after<br>m<sub>1</sub>u<sub>1</sub> + m<sub>2</sub>u<sub>2</sub> = (m<sub>1</sub> + m<sub>2</sub>)v<br>'+lhs+' = ('+ma()+' + '+mb()+') × v<br>'+sn(p)+' = '+num(M,2)+' × v<br>v = [['+sn(p)+'|'+num(M,2)+']]<br>v = <b>'+(done?sn(v.va):'?')+' m/s</b>');
      else if(!done)
        $('#mo-eq').innerHTML=FR('total momentum before = total momentum after<br>m<sub>1</sub>u<sub>1</sub> + m<sub>2</sub>u<sub>2</sub> = m<sub>1</sub>v<sub>1</sub> + m<sub>2</sub>v<sub>2</sub><br>'+lhs+' = '+ma()+' × v<sub>1</sub> + '+mb()+' × v<sub>2</sub><br><b>'+sn(p)+' kg m/s</b> = '+ma()+' × v<sub>1</sub> + '+mb()+' × v<sub>2</sub><br><span class="why" style="margin-left:0">Press Go to find v<sub>1</sub> and v<sub>2</sub></span>');
      else
        $('#mo-eq').innerHTML=FR('total momentum before = total momentum after<br>m<sub>1</sub>u<sub>1</sub> + m<sub>2</sub>u<sub>2</sub> = m<sub>1</sub>v<sub>1</sub> + m<sub>2</sub>v<sub>2</sub><br>'+lhs+' = '+ma()+' × '+sv(v.va)+' + '+mb()+' × '+sv(v.vb)+'<br><b>'+sn(p)+' kg m/s</b> = <b>'+sn(ma()*v.va+mb()*v.vb)+' kg m/s</b><br><span class="why" style="margin-left:0">v<sub>1</sub> and v<sub>2</sub> assume a perfectly elastic bounce: no kinetic energy is lost</span>');
    }
    function stop(){ running=false; cancelAnimationFrame(raf); setGo(); }
    function setGo(){ $('#mo-go').innerHTML = running ? '&#10074;&#10074; Pause' : (t>0 && t<endT() ? '&#9654; Play' : '&#9654; Go'); }
    function reset(){ stop(); t=0; $('#mo-note').textContent = meets() ? 'Press Go to roll trolley 1 into trolley 2.' : 'Trolley 2 is moving away at least as fast as trolley 1, so they never meet. Make u₁ bigger or u₂ smaller.'; eq(); draw(); setGo(); }
    function finish(){ running=false; cancelAnimationFrame(raf); t=endT(); draw(); setGo(); eq(true); var v=after();
      if(!meets()) return;
      $('#mo-note').textContent = mode==='stick'
        ? 'Total momentum after = ('+ma()+' + '+mb()+') × '+sv(v.va)+' = '+sn(ma()*u()+mb()*u2())+' kg m/s, the same as before.'
        : 'Total momentum after = '+sn(ma()*v.va+mb()*v.vb)+' kg m/s, the same as before. Velocity to the left counts as negative, so a trolley moving left has negative momentum.'; }
    function frame(now){ if(!running) return; t+=Math.min(0.05,(now-last)/1000)*SPEED(); last=now;
      if(t>=endT()){ finish(); return; } draw(); raf=requestAnimationFrame(frame); }
    onAction('mo-go',function(){ if(running){ stop(); return; } if(t===0 || t>=endT()){ t=0; if(meets()) $('#mo-note').textContent='Watch the velocity arrows before and after the collision.'; } running=true; last=performance.now(); setGo(); raf=requestAnimationFrame(frame); });
    onAction('mo-reset',reset);
    reset();
  }

  watchEquals('.eq');
  initMomentumSim();
})();
</script>
</body>
</html>
