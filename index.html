<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physics Workout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1f5;
    --bg-grid:rgba(29,41,61,0.055);
    --panel:#ffffff;
    --panel-border:#d7dce4;
    --ink:#182233;
    --ink-soft:#4c5668;
    --ink-faint:#8993a5;
    --accent:#d9720c;
    --accent-soft:#fdead2;
    --good:#15803d;
    --good-soft:#dcf5e3;
    --bad:#c0311a;
    --bad-soft:#fbe1db;
    --shadow:0 10px 26px -14px rgba(24,34,51,0.28);

    --forces:#c2560c;      --forces-soft:#fbe4cd;
    --thermal:#c0311a;     --thermal-soft:#fbe1db;
    --matter:#2158d1;      --matter-soft:#dfe8fc;

    --font-display:'Big Shoulders',system-ui,sans-serif;
    --font-body:'IBM Plex Sans',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12161f; --bg-grid:rgba(255,255,255,0.045);
      --panel:#1b212e; --panel-border:#2c3444;
      --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;
      --accent:#ff9a3d; --accent-soft:#3a2712;
      --good:#4ade80; --good-soft:#123321;
      --bad:#f27159; --bad-soft:#3a1712;
      --shadow:0 14px 30px -14px rgba(0,0,0,0.55);
      --forces:#ff9f5c; --forces-soft:#3a2413;
      --thermal:#f27159; --thermal-soft:#3a1712;
      --matter:#7da3ff; --matter-soft:#1a2440;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12161f; --bg-grid:rgba(255,255,255,0.045);
    --panel:#1b212e; --panel-border:#2c3444;
    --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;
    --accent:#ff9a3d; --accent-soft:#3a2712;
    --good:#4ade80; --good-soft:#123321;
    --bad:#f27159; --bad-soft:#3a1712;
    --shadow:0 14px 30px -14px rgba(0,0,0,0.55);
    --forces:#ff9f5c; --forces-soft:#3a2413;
    --thermal:#f27159; --thermal-soft:#3a1712;
    --matter:#7da3ff; --matter-soft:#1a2440;
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      linear-gradient(var(--bg-grid) 1px,transparent 1px) 0 0/100% 34px,
      linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px) 0 0/34px 100%,
      var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  .page{max-width:1400px;margin-inline:auto;padding-inline:20px;padding-block:28px 60px;}
  h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:0.2px;text-wrap:balance;margin:0;}
  p{margin:0;line-height:1.55;}

  .page-head{margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid var(--panel-border);}
  .eyebrow{
    font-family:var(--font-mono);font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;
    color:var(--accent);font-weight:600;margin-bottom:6px;
  }
  .page-head h1{font-size:clamp(32px,6vw,44px);color:var(--ink);}

  .launch{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;}
  .door{
    --c:var(--accent); --c-soft:var(--accent-soft);
    display:flex;flex-direction:column;justify-content:flex-end;gap:8px;min-height:220px;
    padding:24px;border-radius:16px;text-decoration:none;color:var(--ink);
    background:var(--panel);border:1px solid var(--panel-border);border-top:6px solid var(--c);box-shadow:var(--shadow);
    transition:transform .15s ease-out;
  }
  .door[data-cat="ks3"]{--c:var(--thermal);--c-soft:var(--thermal-soft);}
  .door[data-cat="igcse"]{--c:var(--matter);--c-soft:var(--matter-soft);}
  .door:hover{border-color:var(--c);}
  .door:focus-visible{outline:3px solid var(--c);outline-offset:3px;}
  @media (prefers-reduced-motion: no-preference){ .door:hover{transform:translateY(-3px);} }
  .door-label{font-family:var(--font-display);font-weight:800;font-size:clamp(48px,12vw,64px);line-height:1;color:var(--c);}
  .door-sub{color:var(--ink-soft);font-size:15px;}
  .door .go{font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--c);margin-top:6px;}
</style>
</head>
<body>
<div class="page">
  <header class="page-head">
    <div class="eyebrow">Physics revision</div>
    <h1>Physics Workout</h1>
  </header>

  <nav class="launch" aria-label="Choose your course">
    <a class="door" data-cat="ks3" href="year-9.html">
      <span class="door-label">Year 9</span>
      <span class="door-sub">KS3 physics workouts</span>
      <span class="go">Start &rarr;</span>
    </a>
    <a class="door" data-cat="igcse" href="igcse.html">
      <span class="door-label">IGCSE</span>
      <span class="door-sub">Edexcel IGCSE Physics &middot; Years 10 and 11</span>
      <span class="go">Start &rarr;</span>
    </a>
  </nav>
</div>
</body>
</html>
