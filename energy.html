<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Energy Workout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
.home-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-bottom:4px;font:600 13px 'IBM Plex Mono',ui-monospace,monospace;color:var(--ink-soft);text-decoration:none}
.home-link:hover{color:var(--accent)}
.home-link:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
:root{
  --bg:#ECF0F4; --bg-grid:rgba(31,64,104,.07); --panel:#FFFFFF; --panel-2:#F4F7FA; --panel-border:#C7D1DC;
  --ink:#0F1B2A; --ink-soft:#394A5D; --ink-faint:#66768A;
  --accent:#1F5FD9; --accent-soft:#E0EAFC;
  --good:#157A43; --good-soft:#DCF3E4; --bad:#B8322A; --bad-soft:#FBE2DF;
  --grav:#2F63C9; --grav-soft:#E0E9FA;
  --kin:#C2560C; --kin-soft:#FBE4CD;
  --therm:#B8322A; --therm-soft:#FBE2DF;
  --elec:#7A3FC4; --elec-soft:#EEE3FB;
  --rad:#0B7F7F; --rad-soft:#D6F0EF;
  --snd:#A07A00; --snd-soft:#F7EDC8;
  --shadow:0 1px 0 rgba(15,27,42,.05),0 8px 20px -12px rgba(15,27,42,.28);
  --f-head:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1520; --bg-grid:rgba(160,190,230,.06); --panel:#152131; --panel-2:#1B2A3D; --panel-border:#2B3D54;
    --ink:#E7EEF6; --ink-soft:#B0BECE; --ink-faint:#8191A5;
    --accent:#74A3FF; --accent-soft:#1B2D52;
    --good:#58CC8D; --good-soft:#14352A; --bad:#FF8A80; --bad-soft:#402023;
    --grav:#86A9FF; --grav-soft:#1A2B55;
    --kin:#FF9F5C; --kin-soft:#3A2413;
    --therm:#FF8A80; --therm-soft:#402023;
    --elec:#C29BFF; --elec-soft:#2E1F4A;
    --rad:#4FCBC8; --rad-soft:#113B3B;
    --snd:#E8C04A; --snd-soft:#3A3010;
    --shadow:0 1px 0 rgba(0,0,0,.4),0 8px 20px -12px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1520; --bg-grid:rgba(160,190,230,.06); --panel:#152131; --panel-2:#1B2A3D; --panel-border:#2B3D54;
  --ink:#E7EEF6; --ink-soft:#B0BECE; --ink-faint:#8191A5;
  --accent:#74A3FF; --accent-soft:#1B2D52;
  --good:#58CC8D; --good-soft:#14352A; --bad:#FF8A80; --bad-soft:#402023;
  --grav:#86A9FF; --grav-soft:#1A2B55;
  --kin:#FF9F5C; --kin-soft:#3A2413;
  --therm:#FF8A80; --therm-soft:#402023;
  --elec:#C29BFF; --elec-soft:#2E1F4A;
  --rad:#4FCBC8; --rad-soft:#113B3B;
  --snd:#E8C04A; --snd-soft:#3A3010;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 8px 20px -12px rgba(0,0,0,.7);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{
  background-color:var(--bg); color:var(--ink);
  background-image:linear-gradient(var(--bg-grid) 1px,transparent 1px),linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px);
  background-size:28px 28px;
  font:15px/1.5 var(--f-body);
}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.page{max-width:1400px;margin-inline:auto;padding:22px 16px 64px}

/* ---------- header and tabs ---------- */
.page-head{margin-bottom:16px}
.eyebrow{font:500 12px var(--f-mono);letter-spacing:0;color:var(--ink-faint);margin:0 0 4px}
h1{font:800 clamp(34px,8vw,58px)/.92 var(--f-head);letter-spacing:0;margin:0 0 12px;text-wrap:balance}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 18px}
.tab-btn[data-ta]::after{content:"TA";font:600 9.5px var(--f-mono);letter-spacing:.5px;margin-left:5px;padding:1px 4px;border-radius:4px;border:1px solid currentColor;opacity:.75;vertical-align:1px}
.spec b.ta{color:var(--accent);border-color:var(--accent)}
.tab-btn{
  font:500 12.5px var(--f-mono);padding:8px 11px 7px;border:1px solid var(--panel-border);border-top:3px solid var(--grp,var(--ink-faint));
  border-radius:6px;background:var(--panel);color:var(--ink-soft);cursor:pointer;
}
.tab-btn:hover{color:var(--ink);background:var(--panel-2)}
.tab-btn.is-active{background:var(--ink);color:var(--bg);border-color:var(--ink);border-top-color:var(--grp,var(--ink))}
.tab-btn[data-grp="b"]{--grp:var(--accent)}

/* ---------- panels and activity cards ---------- */
.panel-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:12px}
.panel-head h2{font:800 32px/1 var(--f-head);margin:0;letter-spacing:0;}
.spec{display:flex;flex-wrap:wrap;gap:5px;font:500 11.5px var(--f-mono);color:var(--ink-soft)}
.spec b{font-weight:500;background:var(--panel);border:1px solid var(--panel-border);border-radius:4px;padding:1px 6px}
.act{background:var(--panel);border:1px solid var(--panel-border);border-radius:10px;padding:16px 18px 18px;margin-bottom:18px;box-shadow:var(--shadow)}
.act-title{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font:800 24px/1.05 var(--f-head);letter-spacing:0;margin:0 0 8px}
.kind{font:500 10.5px var(--f-mono);letter-spacing:0;padding:3px 7px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.act-intro{margin:0 0 12px;color:var(--ink-soft)}
.act-body{display:flex;flex-direction:column;gap:12px;min-width:0}
.sub{font:500 11.5px var(--f-mono);letter-spacing:0;color:var(--ink-faint);margin:2px 0 -4px}
.note{font-size:13px;color:var(--ink-soft);margin:0}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.btn{font:500 13px var(--f-body);padding:7px 14px;border:1px solid var(--panel-border);border-radius:6px;background:var(--panel-2);cursor:pointer}
.btn:hover{border-color:var(--ink-faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0D1520}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0D1520}}
.fb{font-size:13.5px;color:var(--ink-soft)}
.fb.good{color:var(--good);font-weight:600} .fb.bad{color:var(--bad)}
.score{font:500 12.5px var(--f-mono);color:var(--ink-soft)}

/* ---------- chips, blanks, bins ---------- */
.chip,.sort-item{
  display:inline-flex;align-items:center;padding:6px 10px;border:1px solid var(--panel-border);border-radius:6px;background:var(--panel);
  font:500 13px/1.3 var(--f-body);cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;box-shadow:0 1px 0 var(--panel-border);
}
.chip.is-selected,.sort-item.is-selected{outline:2px solid var(--accent);outline-offset:1px}
.chip.is-dragging,.sort-item.is-dragging,.is-dragging{opacity:.35}
.drag-ghost{position:fixed;z-index:9999;pointer-events:none;margin:0;box-shadow:0 10px 22px -8px rgba(0,0,0,.45);opacity:.95;cursor:grabbing}
.chip-pool,.sort-pool{display:flex;flex-wrap:wrap;gap:8px;padding:10px;min-height:52px;border:1px dashed var(--panel-border);border-radius:8px;background:var(--panel-2)}
.pool-label{font:500 11px var(--f-mono);letter-spacing:0;color:var(--ink-faint);margin-bottom:-6px}
.chip.is-placed{cursor:pointer;box-shadow:none}
.slot.is-correct .chip{background:var(--good-soft);border-color:var(--good);color:var(--good);cursor:default}
.slot.is-wrong .chip{background:var(--bad-soft);border-color:var(--bad);animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.cloze{line-height:2.6;font-size:15.5px}
.blank{display:inline-flex;align-items:center;justify-content:center;min-width:112px;min-height:32px;padding:1px 3px;margin:0 2px;vertical-align:middle;background:var(--panel-2);border-bottom:2px dashed var(--ink-faint);border-radius:4px;line-height:1.2}
.blank.is-over{background:var(--accent-soft)}
.blank.is-correct{border-bottom-color:var(--good)}
.table-scroll{overflow-x:auto;border:1px solid var(--panel-border);border-radius:8px}
table.units{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
table.units th{font:500 11px var(--f-mono);letter-spacing:0;text-align:left;padding:9px 10px;background:var(--panel-2);border-bottom:1px solid var(--panel-border);color:var(--ink-soft)}
table.units td{padding:6px 8px;border-bottom:1px solid var(--panel-border);height:48px;vertical-align:middle}
table.units tr:last-child td{border-bottom:0}
table.units td.given{font-weight:600;padding-left:10px;background:var(--accent-soft);color:var(--ink)}
table.units .blank{width:100%;min-width:100px;margin:0}
.bins{display:grid;gap:12px}
.bins-2{grid-template-columns:repeat(2,minmax(0,1fr))} .bins-3{grid-template-columns:repeat(3,minmax(0,1fr))} .bins-4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:640px){.bins-3,.bins-4{grid-template-columns:minmax(0,1fr)}}
.bin{border:2px solid var(--cat);background:var(--cat-soft);border-radius:8px;display:flex;flex-direction:column;min-height:130px}
.bin-head{padding:8px 10px 4px;display:flex;flex-direction:column;gap:1px}
.bin-head strong{font:800 20px/1 var(--f-head);letter-spacing:0;color:var(--cat)}
.bin-head span{font-size:12px;color:var(--ink-soft)}
.bin-body{display:flex;flex-direction:column;gap:6px;padding:6px 8px 10px;flex:1}
.sort-item{min-height:44px;width:100%;cursor:grab}
.sort-pool .sort-item{width:auto}
.sort-item.is-correct{background:var(--good-soft);border-color:var(--good);color:var(--good);cursor:default}
.sort-item.is-wrong{background:var(--bad-soft);border-color:var(--bad);animation:shake .4s}

/* ---------- match, reorder, memory ---------- */
.match-grid{position:relative;display:grid;grid-template-columns:1fr 1fr;column-gap:44px;row-gap:0}
@media (max-width:520px){.match-grid{column-gap:28px}}
.match-col{display:flex;flex-direction:column;gap:10px;min-width:0}
.match-col h4{margin:0;font:500 11px var(--f-mono);letter-spacing:0;color:var(--ink-faint)}
.match-card{padding:9px 11px;border:1px solid var(--panel-border);border-radius:6px;background:var(--panel);font-size:13.5px;line-height:1.35;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none;display:flex;align-items:center;box-shadow:0 1px 0 var(--panel-border)}
.match-card.is-selected{outline:2px solid var(--accent)}
.match-card.is-linked{border-color:var(--accent);background:var(--accent-soft)}
.match-card.is-correct{border-color:var(--good);background:var(--good-soft);color:var(--good);cursor:default}
.match-card.is-wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .4s}
.match-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.match-lines line{stroke:var(--accent);stroke-width:2.5;stroke-linecap:round}
.match-lines line.ok{stroke:var(--good)} .match-lines line.no{stroke:var(--bad)}
.reorder{display:flex;flex-direction:column;gap:8px;padding:0;margin:0;list-style:none}
.reorder-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--panel-border);border-radius:6px;background:var(--panel);box-shadow:0 1px 0 var(--panel-border)}
.reorder-row.is-correct{background:var(--good-soft);border-color:var(--good)}
.reorder-grip{font:500 14px var(--f-mono);color:var(--ink-faint);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;padding:4px 6px}
.reorder-text{flex:1;min-width:0;font-size:14px}
.reorder-pos{font:500 11px var(--f-mono);color:var(--ink-faint);width:16px}
.mv{display:flex;flex-direction:column;gap:2px}
.mv button{border:1px solid var(--panel-border);background:var(--panel-2);border-radius:4px;font-size:10px;line-height:1;padding:3px 7px;cursor:pointer}
.mem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.mem-card{perspective:700px;border:0;background:none;padding:0;cursor:pointer;min-height:92px}
.mem-inner{position:relative;width:100%;height:100%;min-height:92px;transition:transform .45s;transform-style:preserve-3d}
.mem-card.is-flipped .mem-inner,.mem-card.is-matched .mem-inner{transform:rotateY(180deg)}
.mem-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-size:12.5px;line-height:1.3}
.mem-front{background:repeating-linear-gradient(135deg,var(--accent-soft) 0 8px,var(--panel-2) 8px 16px);border:1px solid var(--panel-border);color:var(--accent);font:800 26px var(--f-head)}
.mem-back{transform:rotateY(180deg);background:var(--panel);border:2px solid var(--accent);font-weight:500;color:var(--ink)}
.mem-back.is-term{font:800 17px/1.1 var(--f-head);letter-spacing:0;}
.mem-card.is-matched .mem-back{border-color:var(--good);background:var(--good-soft);color:var(--good);animation:pop .4s}
@keyframes pop{50%{transform:rotateY(180deg) scale(1.06)}}

/* ---------- predict, spot the error, calc ---------- */
.pred-q{font-weight:600;margin:0}
.pred-opts{display:flex;flex-direction:column;gap:8px}
.pred-opt{text-align:left;padding:10px 12px;border:1px solid var(--panel-border);border-radius:6px;background:var(--panel);cursor:pointer;line-height:1.35}
.pred-opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.pred-opt:disabled{cursor:default;color:var(--ink)}
.pred-opt.is-chosen{border-width:2px}
.pred-opt.is-right{background:var(--good-soft);border-color:var(--good)}
.pred-opt.is-wrong{background:var(--bad-soft);border-color:var(--bad)}
.pred-out{border-top:2px solid var(--accent);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.pred-out p{margin:0}
.vbars{display:flex;flex-direction:column;gap:7px}
.vbar{display:grid;grid-template-columns:minmax(90px,150px) 1fr;gap:10px;align-items:center;font-size:12.5px}
.vtrack{height:20px;background:var(--panel-2);border:1px solid var(--panel-border);border-radius:4px;overflow:hidden}
.vfill{height:100%;width:0;background:var(--c,var(--accent));display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font:500 11px var(--f-mono);color:#fff;white-space:nowrap;min-width:max-content;transition:width .9s cubic-bezier(.2,.7,.2,1)}
.go .vfill{width:var(--w)}
.viz{width:100%;max-width:420px;height:auto;display:block}
.viz .arr{transform-box:fill-box;transform-origin:center;transform:scale(0);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.go .viz .arr{transform:scale(1)}


.graph-line-drop::before{content:'';position:absolute;left:-26px;top:-26px;width:52px;height:52px;border-radius:50%}
.err-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:12px;align-items:start}
.err-block{display:flex;flex-direction:column;gap:6px;padding:12px;border:1px solid var(--panel-border);border-radius:8px;background:var(--panel-2)}
.err-scn{margin:0 0 4px;font-size:14px}
.err-line{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;text-align:left;padding:6px 10px;border:1px solid var(--panel-border);border-radius:6px;background:var(--panel);color:var(--ink);cursor:pointer;font:500 15px var(--f-mono);line-height:1.4}
.err-line:hover:not(:disabled){border-color:var(--accent)}
.err-line:disabled{cursor:default;opacity:1}
.err-num{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:600 12px var(--f-mono);color:var(--ink-soft);background:var(--panel-2);border:1px solid var(--panel-border)}
.err-line.is-ok{border-color:var(--good);background:var(--good-soft)}
.err-line.is-bad{border-color:var(--bad);background:var(--bad-soft)}
.err-fb{font-size:13.5px;min-height:20px;margin:2px 0 0}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1.25}
.frac>span{padding:0 .25em;white-space:nowrap}
.frac>span:first-child{border-bottom:1.5px solid currentColor}
.err-fix .fix-line{display:block;padding:4px 0}
.err-fix{margin:6px 0 0;padding:8px 10px;border-left:3px solid var(--good);background:var(--panel);font:500 14px/1.6 var(--f-mono)}
.calc-inputs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:12px 18px;align-items:start}
.calc-input-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:10px 12px;border:1px solid var(--panel-border);border-radius:8px;background:var(--panel-2)}
@media (max-width:560px){.calc-input-row{grid-template-columns:minmax(0,1fr)}}
.calc-input-label{font-size:14px}
.calc-input-wrap{display:flex;align-items:center;gap:8px}
.calc-num-input{width:130px;padding:7px 9px;border:1px solid var(--panel-border);border-radius:6px;background:var(--panel);font:500 14px var(--f-mono);color:var(--ink)}
.calc-num-input:disabled{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.calc-num-input.is-wrong{border-color:var(--bad);background:var(--bad-soft)}
.calc-input-unit{font:500 13px var(--f-mono);color:var(--ink-soft);white-space:nowrap}
.calc-fb{grid-column:1/-1;font-size:13px;min-height:0}
.calc-fb:empty{display:none}
.calc-fb.good{color:var(--good);font-weight:600} .calc-fb.bad{color:var(--bad)}
.calc-working{grid-column:1/-1;font-size:13px}
.calc-working-head{color:var(--accent);font:500 13px var(--f-mono);margin-bottom:4px}
.calc-working{animation:cwin .4s ease}@keyframes cwin{from{opacity:0}}
details summary{cursor:pointer;color:var(--accent);font-weight:500;list-style:none;font-size:13px}
details summary::-webkit-details-marker{display:none}
details summary::before{content:'+';display:inline-block;width:16px;font:500 14px var(--f-mono)}
details[open] summary::before{content:'\2212'}
details>div{margin-top:6px;padding:8px 10px;background:var(--panel-2);border-radius:6px;font-family:var(--f-mono);font-size:12.5px;line-height:1.55}

/* ---------- simulations ---------- */
.sim{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:720px){.sim{grid-template-columns:minmax(0,1fr)}}
.sim-view{min-width:0;display:flex;flex-direction:column;gap:12px}
.sim.sim-small{grid-template-columns:minmax(0,var(--simw,340px)) minmax(0,1fr)}
.sim.sim-small .sim-view{max-width:var(--simw,340px);width:100%;justify-self:center}
@media (max-width:720px){.sim.sim-small{grid-template-columns:minmax(0,1fr)}}
.act-pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px;align-items:start;margin-bottom:18px}
.act-pair>.act{margin-bottom:0}
/* a slider explore inside a pair: picture above its controls */
.act-pair .sim,.act-pair .sim.sim-small{grid-template-columns:minmax(0,1fr)}
.act-pair .sim .sim-view{max-width:var(--simw,340px);justify-self:center;width:100%}
.ctl{display:flex;flex-direction:column;gap:12px;min-width:0}
.ctl-row{display:flex;flex-direction:column;gap:3px}
.ctl-row label{display:flex;justify-content:space-between;gap:8px;font:500 12px var(--f-mono);color:var(--ink-soft)}
.ctl-row output{color:var(--ink);font-weight:500}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:500 12.5px var(--f-body);padding:6px 10px;border:1px solid var(--panel-border);border-radius:6px;background:var(--panel-2);cursor:pointer}
.seg button.is-on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.eq{font:500 14px/1.5 var(--f-mono);padding:10px 12px;border-radius:6px;background:var(--panel-2);border-left:4px solid var(--accent);overflow-wrap:anywhere}
.eqg{display:grid;grid-template-columns:auto auto minmax(0,1fr);column-gap:.45em;row-gap:.2em;align-items:center}
.eqg-l{justify-self:end;text-align:right}
.eqg-m{justify-self:center}

<script>
  // Visit counter (GoatCounter: no cookies, no personal data). Skipped when a page is embedded in a workout, so a visit counts once.
  // pwCountTab(tab, label): counts each workout tab once per visit as a GoatCounter event (path "page#tab"), skipped in frames the same way.
  (function(){
    var off = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var seen = {}, queue = [];
    function send(e){ try { window.goatcounter.count(e); } catch (x) {} }
    window.pwCountTab = function(tab, label){
      if (off || !tab || seen[tab]) return;
      seen[tab] = 1;
      var page = (location.pathname.split('/').pop() || 'index').replace(/\.html$/, '');
      var e = { path: page + '#' + tab, title: (label || tab) + ' \u00b7 ' + document.title, event: true };
      if (window.goatcounter && window.goatcounter.count) send(e); else queue.push(e);
    };
    if (off) return;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://gc.zgo.at/count.js';
    s.setAttribute('data-goatcounter', 'https://physics-workout.goatcounter.com/count');
    s.onload = function(){ var q = queue; queue = []; q.forEach(send); };
    document.head.appendChild(s);
  })();
</script>

<script>
(function(){
'use strict';
/* ================= helpers ================= */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const mk=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
// Write a fraction as [[top|bottom]] in any text that goes through FR(); it is drawn stacked.
const FR=t=>String(t).replace(/(\d) (?=\d{3}\b)/g,'$1\u00a0').replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g,'<span class="frac"><span>$1</span><span>$2</span></span>');
const fmt=(n,dp)=>{const t=Number(n).toLocaleString('en-GB',{maximumFractionDigits:dp==null?2:dp});return Math.abs(n)<10000?t.replace(/,/g,''):t.replace(/,/g,'\u2009');};
const REDUCED=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const numClose=(v,a)=>Math.abs(v-a)<=(a===0?0.05:Math.abs(a)*0.02);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const raf=f=>requestAnimationFrame(f);

const STORE_KEY='y9-energy-v1',OLD_STORE_KEY='y9-energy-v0';
const TAB_IDS=['overview','stores','pathways','conserve','heating','work','power','efficiency','sankey','paying'];
let activeTab='overview';
const reflowers=[];

function act(panel,kind,title,intro){
  const a=mk('article','act');
  a.innerHTML='<h3 class="act-title"><span class="kind">'+kind+'</span><span>'+title+'</span></h3>'+(intro?'<p class="act-intro">'+FR(intro)+'</p>':'');
  const body=mk('div','act-body');a.appendChild(body);
  $('#panel-'+panel+' .acts').appendChild(a);
  return body;
}
function bar(parent,buttons){
  const b=mk('div','bar');
  buttons.forEach(x=>{const btn=mk('button','btn'+(x.primary?' primary':''),x.label);btn.type='button';btn.addEventListener('click',x.fn);b.appendChild(btn);});
  const msg=mk('span','fb');msg.setAttribute('aria-live','polite');b.appendChild(msg);
  parent.appendChild(b);
  return {el:b,msg:msg,say:(t,cls)=>{msg.textContent=t;msg.className='fb'+(cls?' '+cls:'');}};
}

/* ================= saved answers and tab progress =================
   Every graded activity registers with track() and gives getState / setState / isDone.
   Answers are kept in this browser only (localStorage, every call in try/catch), so a reload keeps them.
   A tab gets a tick once all its graded activities are complete, and the header shows how many tabs are done. */
const games=[];
function track(host,g){
  const p=host&&host.closest('.panel');
  g.host=host;g.tab=p?p.id.slice(6):'';
  g.key=g.tab+'-'+games.filter(x=>x.tab===g.tab).length;
  games.push(g);return g;
}
let saveTimer=null,saveReady=false;
function writeSave(){
  if(!saveReady)return;
  const v={};games.forEach(g=>{try{v[g.key]=g.getState();}catch(e){}});
  try{localStorage.setItem(STORE_KEY,JSON.stringify({tab:activeTab,v:v}));}catch(e){}
}
// Saves wait a second, so wrong answers have bounced back to the pool first.
function saveSoon(){if(!saveReady)return;clearTimeout(saveTimer);saveTimer=setTimeout(writeSave,1000);raf(()=>showProgress(true));}
// An activity hidden inside its tab (e.g. one for a method type that is not chosen) does not count.
function shown(g){let e=g.host;while(e&&!(e.classList&&e.classList.contains('panel'))){if(e.hidden)return false;e=e.parentElement;}return true;}
function tabDone(t){const gs=games.filter(g=>g.tab===t&&shown(g));return gs.length>0&&gs.every(g=>{try{return g.isDone();}catch(e){return false;}});}
function showProgress(animate){
  const graded=TAB_IDS.filter(t=>games.some(g=>g.tab===t));
  let n=0;
  graded.forEach(t=>{
    const d=tabDone(t),btn=document.getElementById('tab-'+t);if(d)n++;
    if(!btn)return;
    let tk=btn.querySelector('.tab-tick');
    if(d&&!tk){tk=mk('span','tab-tick','<span aria-hidden="true">✓</span><span class="sr-only"> (done)</span>');btn.appendChild(tk);if(animate)tk.classList.add('pop-in');}
    if(!d&&tk)tk.remove();
    btn.classList.toggle('is-done',d);
  });
  let pill=document.getElementById('tabs-done');
  if(!pill){const eb=$('.page-head .eyebrow');if(!eb||!graded.length)return;pill=mk('span','tabs-done');pill.id='tabs-done';pill.setAttribute('aria-live','polite');eb.parentNode.appendChild(pill);}
  const txt=n+' of '+graded.length+' tabs done';
  if(pill.textContent!==txt){
    const up=n>(+pill.dataset.n||0);pill.textContent=txt;pill.dataset.n=n;
    if(animate&&up){pill.classList.remove('pulse');void pill.offsetWidth;pill.classList.add('pulse');}
  }
  pill.classList.toggle('all-done',n===graded.length);
}
['click','input','pointerup'].forEach(t=>document.addEventListener(t,saveSoon));
window.addEventListener('pagehide',()=>{clearTimeout(saveTimer);writeSave();});

function focusKey(){

}

/* ================= drag engine (pointer events, mouse + touch) ================= */
function hitEl(ev,selector){
  const t=document.elementFromPoint(ev.clientX,ev.clientY);
  return t?t.closest(selector):null;
}
function makeDraggable(node,o){
  o=o||{};
  node.style.touchAction='none';
  if(o.onClick){
    if(!node.hasAttribute('tabindex'))node.tabIndex=0;
    if(node.tagName!=='BUTTON'&&!node.getAttribute('role'))node.setAttribute('role','button');
    node.addEventListener('keydown',function(e){
      if((e.key==='Enter'||e.key===' ')&&e.target===node&&(!o.enabled||o.enabled())){e.preventDefault();e.stopPropagation();o.onClick(e);}
    });
  }
  node.addEventListener('pointerdown',function(e){
    if(e.button!==undefined&&e.button!==0)return;
    if(o.enabled&&!o.enabled())return;
    const sx=e.clientX,sy=e.clientY,id=e.pointerId,r=node.getBoundingClientRect();
    let dragging=false,g=null;
    const move=function(ev){
      if(ev.pointerId!==id)return;
      if(!dragging&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>6){
        dragging=true;
        g=node.cloneNode(true);g.removeAttribute('id');g.classList.remove('is-dragging');g.classList.add('drag-ghost');
        g.style.width=r.width+'px';g.style.left=r.left+'px';g.style.top=r.top+'px';
        document.body.appendChild(g);node.classList.add('is-dragging');
        if(o.onStart)o.onStart(ev);
      }
      if(dragging){g.style.transform='translate('+(ev.clientX-sx)+'px,'+(ev.clientY-sy)+'px)';if(o.onMove)o.onMove(ev);ev.preventDefault();}
    };
    const up=function(ev){
      if(ev.pointerId!==id)return;
      document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);
      if(g)g.remove();
      node.classList.remove('is-dragging');
      if(dragging){if(o.onEnd)o.onEnd(ev,ev.type==='pointercancel');}
      else if(ev.type==='pointerup'&&o.onClick){o.onClick(ev);}
    };
    document.addEventListener('pointermove',move,{passive:false});
    document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
  });
}

/* ================= blank / slot game (cloze, units table, graph labels) ================= */
function createBlankGame(cfg){
  const slots=cfg.slots,pool=cfg.pool,chipMap={},slotMap={};
  cfg.chips.forEach(c=>chipMap[c.id]=c);
  slots.forEach(s=>slotMap[s.id]=s);
  let order=shuffle(cfg.chips.map(c=>c.id));
  let placed={},locked={},selected=null;
  slots.forEach(s=>{
    s.el.dataset.slotId=s.id;s.el.classList.add('slot','is-empty');
    s.el.addEventListener('click',function(e){
      if(e.target.closest('.chip'))return;
      if(selected&&!locked[s.id])place(selected,s.id);
    });
    keyActivate(s.el,function(){
      if(locked[s.id])return;
      if(selected)place(selected,s.id);else if(placed[s.id])unplace(s.id);
    },s.label||'Gap');
  });
  function say(t,c){if(cfg.msg)cfg.msg.say(t,c);}
  function chipEl(c,inSlot){
    const e=mk('span','chip'+(inSlot?' is-placed':''));
    e.innerHTML=inSlot&&cfg.slotText?cfg.slotText(c):c.text;
    if(inSlot&&cfg.placedClass)e.classList.add(cfg.placedClass);
    e.dataset.chip=c.id;return e;
  }
  // palette: chips stay in the bank and are copied into gaps, so one chip can fill several gaps
  function place(chipId,slotId){
    if(!cfg.palette)Object.keys(placed).forEach(k=>{if(placed[k]===chipId)delete placed[k];});
    placed[slotId]=chipId;selected=null;render();
  }
  function unplace(slotId){if(!locked[slotId]){delete placed[slotId];render();}}
  function slotAt(ev){
    const t=hitEl(ev,'.slot');
    if(t&&slotMap[t.dataset.slotId]&&slotMap[t.dataset.slotId].el===t)return slotMap[t.dataset.slotId];
    return null;
  }
  let fresh={};
  const root=pool.closest('.act')||document;
  function render(){
    const fk=focusKey();
    pool.innerHTML='';
    const used=new Set(Object.keys(placed).map(k=>placed[k]));
    order.filter(id=>cfg.palette||!used.has(id)).forEach(id=>{
      const e=chipEl(chipMap[id],false);
      if(selected===id)e.classList.add('is-selected');
      pool.appendChild(e);
      makeDraggable(e,{
        onEnd:function(ev){const s=slotAt(ev);if(s&&!locked[s.id])place(id,s.id);else render();},
        onClick:function(){selected=selected===id?null:id;render();}
      });
    });
    slots.forEach(s=>{
      const old=s.el.querySelector('.chip');if(old)old.remove();
      s.el.classList.toggle('is-empty',!placed[s.id]);
      s.el.classList.toggle('is-correct',!!locked[s.id]);
      s.el.classList.toggle('pop',!!fresh[s.id]);
      s.el.classList.remove('is-wrong');
      if(placed[s.id]){
        const e=chipEl(chipMap[placed[s.id]],true);s.el.appendChild(e);
        if(!locked[s.id]){
          makeDraggable(e,{
            onEnd:function(ev){
              const t=slotAt(ev),cid=placed[s.id];
              if(t&&t.id!==s.id&&!locked[t.id]){delete placed[s.id];place(cid,t.id);}
              else{delete placed[s.id];render();}
            },
            onClick:function(){unplace(s.id);}
          });
        }
      }
    });
    if(cfg.score)cfg.score.textContent=Object.keys(locked).length+' / '+slots.length+' correct';
    if(cfg.onRender)cfg.onRender();
    fresh={};refocus(root,fk);
  }
  function check(){
    const wrong=[];let empty=0,newRight=0;
    slots.forEach(s=>{
      if(locked[s.id])return;
      const cid=placed[s.id];
      if(!cid){empty++;return;}
      if(cfg.isCorrect(chipMap[cid],s)){locked[s.id]=true;fresh[s.id]=true;newRight++;}else wrong.push(s.id);
    });
    render();
    wrong.forEach(id=>{slotMap[id].el.classList.add('is-wrong');});
    const done=Object.keys(locked).length;
    if(done===slots.length){say('All '+slots.length+' correct. Well done.','good');celebrate(cfg.score);}
    else if(wrong.length)say(wrong.length+' in the wrong place. They will pop back so you can try again.'+(empty?' '+empty+' still empty.':''),'bad');
    else say(empty+' still to fill.','');
    if(wrong.length)setTimeout(()=>{wrong.forEach(id=>{if(!locked[id])delete placed[id];});render();},850);
  }
  function reset(){placed={};locked={};selected=null;order=shuffle(cfg.chips.map(c=>c.id));say('','');render();}
  render();
  return track(pool,{check:check,reset:reset,render:render,
    getState:()=>({o:order,p:placed,l:Object.keys(locked)}),
    setState:s=>{
      if(Array.isArray(s.o)&&s.o.length===order.length&&s.o.every(id=>chipMap[id]))order=s.o.slice();
      placed={};locked={};selected=null;
      Object.keys(s.p||{}).forEach(k=>{if(slotMap[k]&&chipMap[s.p[k]])placed[k]=s.p[k];});
      (s.l||[]).forEach(k=>{if(placed[k]&&cfg.isCorrect(chipMap[placed[k]],slotMap[k]))locked[k]=true;});
      render();
      if(Object.keys(locked).length===slots.length)say('All '+slots.length+' correct. Well done.','good');
    },
    isDone:()=>Object.keys(locked).length===slots.length});
}

/* ================= sort into bins ================= */
function createSortGame(cfg){
  const host=cfg.host,items=cfg.items,cats=cfg.cats,itemMap={};
  items.forEach(i=>itemMap[i.id]=i);
  const binsEl=mk('div','bins bins-'+cats.length);
  const poolLabel=mk('div','pool-label','Cards to sort');
  const poolEl=mk('div','sort-pool');
  host.appendChild(binsEl);host.appendChild(poolLabel);host.appendChild(poolEl);
  let where={},locked={},selected=null,order;
  const b=bar(host,[{label:'Check',primary:true,fn:check},{label:'Shuffle again',fn:reset}]);
  const score=mk('span','score');b.el.insertBefore(score,b.msg);
  let fresh={};
  function itemEl(i){const e=mk('div','sort-item',i.text);e.dataset.item=i.id;if(locked[i.id])e.classList.add('is-correct');if(fresh[i.id])e.classList.add('pop');return e;}
  function drop(id,ev){
    const bin=hitEl(ev,'.bin');
    if(bin&&binsEl.contains(bin))where[id]=bin.dataset.cat;
    else if(hitEl(ev,'.sort-pool')===poolEl)where[id]='pool';
    selected=null;render();
  }
  function render(){
    const fk=focusKey();
    binsEl.innerHTML='';
    cats.forEach(c=>{
      const bin=mk('div','bin');bin.dataset.cat=c.id;
      bin.style.setProperty('--cat','var('+c.color+')');bin.style.setProperty('--cat-soft','var('+c.soft+')');
      bin.innerHTML='<div class="bin-head"><strong>'+c.label+'</strong>'+(c.hint?'<span>'+c.hint+'</span>':'')+'</div>';
      const body=mk('div','bin-body');bin.appendChild(body);
      order.filter(id=>where[id]===c.id).forEach(id=>{
        const e=itemEl(itemMap[id]);body.appendChild(e);
        if(!locked[id])makeDraggable(e,{onEnd:ev=>drop(id,ev),onClick:()=>{where[id]='pool';render();}});
      });
      bin.addEventListener('click',ev=>{if(selected&&!ev.target.closest('.sort-item')){where[selected]=c.id;selected=null;render();}});
      keyActivate(bin,()=>{if(selected){where[selected]=c.id;selected=null;render();}},c.label+' bin');
      binsEl.appendChild(bin);
    });
    poolEl.innerHTML='';
    order.filter(id=>where[id]==='pool').forEach(id=>{
      const e=itemEl(itemMap[id]);if(selected===id)e.classList.add('is-selected');poolEl.appendChild(e);
      makeDraggable(e,{onEnd:ev=>drop(id,ev),onClick:()=>{selected=selected===id?null:id;render();}});
    });
    score.textContent=Object.keys(locked).length+' / '+items.length+' correct';
    fresh={};refocus(host,fk);
  }
  function check(){
    const wrong=[];let inPool=0;
    items.forEach(i=>{
      if(locked[i.id])return;
      if(where[i.id]==='pool'){inPool++;return;}
      if(where[i.id]===i.cat){locked[i.id]=true;fresh[i.id]=true;}else wrong.push(i.id);
    });
    render();
    wrong.forEach(id=>{const e=binsEl.querySelector('[data-item="'+id+'"]');if(e)e.classList.add('is-wrong');});
    if(Object.keys(locked).length===items.length){b.say('All correct. Well done.','good');celebrate(score);}
    else if(wrong.length)b.say(wrong.length+' in the wrong bin. They will go back to the pool.'+(inPool?' '+inPool+' not sorted yet.':''),'bad');
    else b.say(inPool+' cards still to sort.','');
    if(wrong.length)setTimeout(()=>{wrong.forEach(id=>{if(!locked[id])where[id]='pool';});render();},850);
  }
  function reset(){where={};locked={};selected=null;items.forEach(i=>where[i.id]='pool');order=shuffle(items.map(i=>i.id));b.say('','');render();}
  reset();
  return track(host,{reset:reset,
    getState:()=>({o:order,w:where,l:Object.keys(locked)}),
    setState:s=>{
      if(Array.isArray(s.o)&&s.o.length===items.length&&s.o.every(id=>itemMap[id]))order=s.o.slice();
      where={};locked={};selected=null;
      items.forEach(i=>{const w=s.w&&s.w[i.id];where[i.id]=cats.some(c=>c.id===w)?w:'pool';});
      (s.l||[]).forEach(id=>{if(itemMap[id]&&where[id]===itemMap[id].cat)locked[id]=true;});
      render();
      if(Object.keys(locked).length===items.length)b.say('All correct. Well done.','good');
    },
    isDone:()=>Object.keys(locked).length===items.length});
}

/* ================= match (lines between two columns) ================= */
function createMatchGame(cfg){
  const host=cfg.host,pairs=cfg.pairs;
  const grid=mk('div','match-grid'+(cfg.narrowLeft?' narrow-left':''));
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('class','match-lines');
  const colL=mk('div','match-col'),colR=mk('div','match-col');
  grid.appendChild(svg);grid.appendChild(colL);grid.appendChild(colR);host.appendChild(grid);
  let L,R,link,locked,sel,wrongSet={},fresh={};
  const b=bar(host,[{label:'Check matches',primary:true,fn:check},{label:'Shuffle again',fn:reset}]);
  const score=mk('span','score');b.el.insertBefore(score,b.msg);
  function card(side,id){
    const p=pairs.find(x=>x.id===id);
    const e=mk('div','match-card',side==='L'?p.l:p.r);e.dataset.side=side;e.dataset.id=id;
    const linked=side==='L'?link[id]!==undefined:Object.values(link).indexOf(id)>=0;
    if(linked)e.classList.add('is-linked');
    const lid=side==='L'?id:Object.keys(link).find(k=>link[k]===id);
    if(lid!==undefined&&locked[lid]){e.classList.remove('is-linked');e.classList.add('is-correct');if(fresh[lid])e.classList.add('pop');}
    if(lid!==undefined&&wrongSet[lid])e.classList.add('is-wrong');
    if(sel&&sel.side===side&&sel.id===id)e.classList.add('is-selected');
    if(!(lid!==undefined&&locked[lid])){
      makeDraggable(e,{
        onEnd:function(ev){const t=hitEl(ev,'.match-card');if(t&&grid.contains(t)&&t.dataset.side!==side)pairUp(side,id,t.dataset.side,t.dataset.id);render();},
        onClick:function(){
          if(linked){unlink(side,id);sel=null;render();return;}
          if(sel&&sel.side!==side){pairUp(sel.side,sel.id,side,id);sel=null;}
          else sel=(sel&&sel.side===side&&sel.id===id)?null:{side:side,id:id};
          render();
        }
      });
    }
    return e;
  }
  function pairUp(s1,i1,s2,i2){
    const l=s1==='L'?i1:i2,r=s1==='L'?i2:i1;
    Object.keys(link).forEach(k=>{if(k===l||link[k]===r)delete link[k];});
    link[l]=r;sel=null;
  }
  function unlink(side,id){
    Object.keys(link).forEach(k=>{if((side==='L'&&k===id)||(side==='R'&&link[k]===id))delete link[k];});
  }
  function render(){
    const fk=focusKey();
    colL.innerHTML='<h4>'+cfg.leftTitle+'</h4>';colR.innerHTML='<h4>'+cfg.rightTitle+'</h4>';
    L.forEach(id=>colL.appendChild(card('L',id)));R.forEach(id=>colR.appendChild(card('R',id)));
    score.textContent=Object.keys(locked).length+' / '+pairs.length+' matched';
    fresh={};refocus(grid,fk);
    raf(reflow);
  }
  function reflow(){
    if(!grid.offsetParent)return;
    const cards=$$('.match-card',grid);
    cards.forEach(c=>c.style.minHeight='');
    let mx=0;cards.forEach(c=>{mx=Math.max(mx,c.getBoundingClientRect().height);});
    cards.forEach(c=>c.style.minHeight=Math.ceil(mx)+'px');
    const gr=grid.getBoundingClientRect();
    svg.setAttribute('viewBox','0 0 '+gr.width+' '+gr.height);
    svg.innerHTML='';
    Object.keys(link).forEach(l=>{
      const a=$('.match-card[data-side="L"][data-id="'+l+'"]',grid),c=$('.match-card[data-side="R"][data-id="'+link[l]+'"]',grid);
      if(!a||!c)return;
      const ra=a.getBoundingClientRect(),rc=c.getBoundingClientRect();
      const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
      ln.setAttribute('x1',ra.right-gr.left);ln.setAttribute('y1',ra.top-gr.top+ra.height/2);
      ln.setAttribute('x2',rc.left-gr.left);ln.setAttribute('y2',rc.top-gr.top+rc.height/2);
      if(locked[l])ln.setAttribute('class','ok');else if(wrongSet[l])ln.setAttribute('class','no');
      svg.appendChild(ln);
    });
  }
  function check(){
    const wrong=[];let unpaired=0;
    pairs.forEach(p=>{if(locked[p.id])return;if(link[p.id]===undefined){unpaired++;return;}if(link[p.id]===p.id){locked[p.id]=true;fresh[p.id]=true;}else wrong.push(p.id);});
    wrongSet={};wrong.forEach(id=>wrongSet[id]=true);
    render();
    if(Object.keys(locked).length===pairs.length){b.say('All pairs correct. Well done.','good');celebrate(score);}
    else if(wrong.length)b.say(wrong.length+' pair'+(wrong.length>1?'s are':' is')+' wrong. They will come apart so you can try again.'+(unpaired?' '+unpaired+' not paired yet.':''),'bad');
    else b.say(unpaired+' still to pair.','');
    if(wrong.length)setTimeout(()=>{wrong.forEach(id=>{if(!locked[id])delete link[id];});wrongSet={};render();},900);
  }
  function reset(){L=shuffle(pairs.map(p=>p.id));R=shuffle(pairs.map(p=>p.id));link={};locked={};sel=null;wrongSet={};b.say('','');render();}
  window.addEventListener('resize',()=>raf(reflow));
  reset();
  const ok=a=>Array.isArray(a)&&a.length===pairs.length&&pairs.every(p=>a.indexOf(p.id)>=0);
  return track(host,{reflow:reflow,reset:reset,
    getState:()=>({L:L,R:R,k:link,l:Object.keys(locked)}),
    setState:s=>{
      if(ok(s.L))L=s.L.slice();if(ok(s.R))R=s.R.slice();
      link={};locked={};sel=null;wrongSet={};
      const used={};
      Object.keys(s.k||{}).forEach(l=>{const r=s.k[l];if(pairs.some(p=>p.id===l)&&pairs.some(p=>p.id===r)&&!used[r]){link[l]=r;used[r]=1;}});
      (s.l||[]).forEach(id=>{if(link[id]===id)locked[id]=true;});
      render();
      if(Object.keys(locked).length===pairs.length)b.say('All pairs correct. Well done.','good');
    },
    isDone:()=>Object.keys(locked).length===pairs.length});
}

/* ================= flip-card memory ================= */
function createMemoryGame(cfg){
  const host=cfg.host,pairs=cfg.pairs;
  const grid=mk('div','mem-grid');host.appendChild(grid);
  const b=bar(host,[{label:'Shuffle again',fn:reset}]);
  const counter=mk('span','score');b.el.insertBefore(counter,b.msg);
  let cards,first,busy,flips,matched;
  function reset(){
    const deck=[];pairs.forEach(p=>{deck.push({key:p.id,text:p.a,kind:'a'});deck.push({key:p.id,text:p.b,kind:'b'});});
    cards=shuffle(deck);first=null;busy=false;flips=0;matched=0;b.say('','');
    grid.innerHTML='';
    cards.forEach((c,i)=>{
      const btn=mk('button','mem-card');btn.type='button';btn.setAttribute('aria-label','Card '+(i+1));
      btn.innerHTML='<div class="mem-inner"><div class="mem-face mem-front" aria-hidden="true">?</div><div class="mem-face mem-back'+(c.kind==='a'?' is-term':'')+'">'+c.text+'</div></div>';
      btn.addEventListener('click',()=>flip(i,btn));
      btn.dataset.key=c.key;c.btn=btn;grid.appendChild(btn);
    });
    counter.textContent='Flips: 0';
  }
  function flip(i,btn){
    if(busy||btn.classList.contains('is-flipped')||btn.classList.contains('is-matched'))return;
    btn.classList.add('is-flipped');flips++;counter.textContent='Flips: '+flips;
    if(first===null){first=i;return;}
    const a=cards[first],c=cards[i];
    if(a.key===c.key&&a.kind!==c.kind){
      a.btn.classList.add('is-matched');c.btn.classList.add('is-matched');matched++;first=null;
      if(matched===pairs.length)b.say('All '+pairs.length+' pairs found in '+flips+' flips. The best possible is '+pairs.length*2+'.','good');
    }else{
      busy=true;const f=first;first=null;
      setTimeout(()=>{cards[f].btn.classList.remove('is-flipped');c.btn.classList.remove('is-flipped');busy=false;},800);
    }
  }
  reset();
  return {reset:reset};
}

/* ================= type-the-number ================= */
let calcN=0;
function createCalc(cfg){
  const host=cfg.host,qs=cfg.questions,id='calc'+(++calcN);
  const wrap=mk('div','calc-inputs');host.appendChild(wrap);
  qs.forEach((q,i)=>{
    const row=mk('div','calc-input-row');
    row.innerHTML='<div class="calc-input-label"><label for="'+id+'-'+i+'">'+q.q+'</label></div>'+
      '<div class="calc-input-wrap"><input class="calc-num-input" id="'+id+'-'+i+'" type="text" inputmode="'+(q.answer<0?'text':'decimal')+'" autocomplete="off" spellcheck="false"><span class="calc-input-unit">'+q.unit+'</span></div>'+
      '<div class="calc-fb" aria-live="polite"></div>'+
      '<div class="calc-working" hidden><div class="calc-working-head">Working</div><div class="cw">'+FR(q.working)+'</div></div>';
    wrap.appendChild(row);
  });
  const b=bar(host,[{label:'Check answers',primary:true,fn:check},{label:'Clear',fn:reset}]);
  function check(){
    let ok=0,blank=0,bad=0;
    qs.forEach((q,i)=>{
      const inp=$('#'+id+'-'+i),fb=inp.closest('.calc-input-row').querySelector('.calc-fb');
      if(inp.disabled){ok++;return;}
      const raw=inp.value.trim();
      if(raw===''){blank++;fb.textContent='';fb.className='calc-fb';return;}
      const clean=raw.replace(/[\u2212\u2013]/g,'-').replace(/[\s,\u2009]/g,'').replace(/[\u00D7x]10\^?(-?\d+)/i,'e$1');
      const v=/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(clean)?parseFloat(clean):NaN;
      if(isFinite(v)&&numClose(v,q.answer)){inp.disabled=true;inp.classList.add('pop');inp.classList.remove('is-wrong');fb.textContent='Correct.';fb.className='calc-fb good';ok++;}
      else{bad++;inp.classList.add('is-wrong');inp.closest('.calc-input-row').querySelector('.calc-working').hidden=false;fb.textContent=q.hint||'Not quite. Check the rearrangement and the units, then try again.';fb.className='calc-fb bad';}
    });
    if(ok===qs.length){b.say('All '+qs.length+' correct.','good');celebrate(b.msg);}
    else b.say(ok+' of '+qs.length+' correct'+(blank?', '+blank+' left blank':'')+'.',bad?'bad':'');
  }
  function reset(){
    qs.forEach((q,i)=>{const inp=$('#'+id+'-'+i);inp.value='';inp.disabled=false;inp.classList.remove('is-wrong');const fb=inp.closest('.calc-input-row').querySelector('.calc-fb');fb.textContent='';fb.className='calc-fb';inp.closest('.calc-input-row').querySelector('.calc-working').hidden=true;});
    b.say('','');
  }
  const inp=i=>document.getElementById(id+'-'+i);
  return track(host,{reset:reset,
    getState:()=>({v:qs.map((q,i)=>inp(i).value),ok:qs.map((q,i)=>inp(i).disabled)}),
    setState:s=>{
      reset();
      qs.forEach((q,i)=>{
        const e=inp(i),v=s.v&&s.v[i];if(typeof v!=='string')return;
        e.value=v;
        if(s.ok&&s.ok[i]){e.disabled=true;const fb=e.closest('.calc-input-row').querySelector('.calc-fb');fb.textContent='Correct.';fb.className='calc-fb good';}
      });
      if(qs.every((q,i)=>inp(i).disabled))b.say('All '+qs.length+' correct.','good');
    },
    isDone:()=>qs.every((q,i)=>inp(i).disabled)});
}

/* ================= reorder (live reorder + up/down buttons) ================= */
function createReorder(cfg){
  const host=cfg.host,steps=cfg.steps,map={};
  steps.forEach(s=>map[s.id]=s);
  const list=mk('ol','reorder');host.appendChild(list);
  const b=bar(host,[{label:'Check order',primary:true,fn:check},{label:'Shuffle again',fn:reset}]);
  let order,rows={},done=false;
  const valid=o=>cfg.constraints.filter(c=>o.indexOf(c[0])<o.indexOf(c[1])).length;
  function build(){
    list.innerHTML='';rows={};
    steps.forEach(s=>{
      const li=mk('li','reorder-row');li.dataset.id=s.id;
      li.innerHTML='<span class="reorder-pos"></span><span class="reorder-grip" aria-hidden="true">≡</span><span class="reorder-text">'+FR(s.text)+'</span><span class="mv"><button type="button" aria-label="Move up">▲</button><button type="button" aria-label="Move down">▼</button></span>';
      const btns=li.querySelectorAll('.mv button');
      btns[0].addEventListener('click',()=>move(s.id,-1));btns[1].addEventListener('click',()=>move(s.id,1));
      makeDraggable(li.querySelector('.reorder-grip'),{
        enabled:()=>!done,
        onMove:function(ev){
          const others=order.filter(x=>x!==s.id);
          const idx=others.filter(x=>{const r=rows[x].getBoundingClientRect();return r.top+r.height/2<ev.clientY;}).length;
          const next=others.slice();next.splice(idx,0,s.id);
          if(next.join()!==order.join()){order=next;sync();}
        },
        onEnd:function(){sync();}
      });
      // dim the whole row while its grip is dragged
      rows[s.id]=li;list.appendChild(li);
    });
    sync();
  }
  function sync(){order.forEach((id,i)=>{list.appendChild(rows[id]);rows[id].querySelector('.reorder-pos').textContent=i+1;});}
  function move(id,d){if(done)return;const i=order.indexOf(id),j=i+d;if(j<0||j>=order.length)return;order.splice(i,1);order.splice(j,0,id);sync();}
  function check(){
    if(done)return;
    const n=valid(order),t=cfg.constraints.length;
    if(n===t){done=true;Object.keys(rows).forEach(k=>rows[k].classList.add('is-correct','pop'));b.say('Correct order. '+(cfg.why||''),'good');}
    else b.say(n+' of '+t+' sequence checks passed. Think about what must happen before what, then try again.','bad');
  }
  function reset(){
    done=false;let o;
    do{o=shuffle(steps.map(s=>s.id));}while(valid(o)===cfg.constraints.length);
    order=o;b.say('','');build();
  }
  reset();
  return track(host,{reset:reset,
    getState:()=>({o:order,d:done}),
    setState:s=>{
      if(!(Array.isArray(s.o)&&s.o.length===steps.length&&s.o.every(id=>map[id])))return;
      order=s.o.slice();done=!!s.d&&valid(order)===cfg.constraints.length;b.say('','');build();
      if(done){Object.keys(rows).forEach(k=>rows[k].classList.add('is-correct'));b.say('Correct order. '+(cfg.why||''),'good');}
    },
    isDone:()=>done});
}

function createPredict(cfg){
  const host=cfg.host;
  host.appendChild(mk('p','pred-q',cfg.q));
  if(cfg.pre)host.appendChild(mk('div','',cfg.pre));
  const opts=mk('div','pred-opts');host.appendChild(opts);
  const out=mk('div','pred-out');out.hidden=true;host.appendChild(out);
  const b=bar(host,[{label:'Try again',fn:reset}]);b.el.hidden=true;
  let order,tries=0,picks=[],final=false;
  function render(){
    opts.innerHTML='';
    order.forEach(i=>{
      const o=cfg.options[i];
      const btn=mk('button','pred-opt',o.text);btn.type='button';
      btn.addEventListener('click',()=>choose(i));
      btn.dataset.i=i;opts.appendChild(btn);
    });
  }
  // A first wrong answer lights up only that option and explains why it is wrong; the student tries again.
  // The right answer is shown once they find it, or after a second wrong answer.
  function choose(i){
    if(final)return;
    const o=cfg.options[i];picks.push(i);
    if(!o.correct&&tries===0){
      tries++;
      const btn=$$('.pred-opt',opts).find(x=>+x.dataset.i===i);
      btn.disabled=true;btn.classList.add('is-chosen','is-wrong');
      out.innerHTML='<p><strong>Not quite.</strong> '+FR(o.why)+' Try another answer.</p>';
      out.hidden=false;out.classList.remove('go');
      return;
    }
    $$('.pred-opt',opts).forEach(btn=>{
      btn.disabled=true;const k=cfg.options[btn.dataset.i];
      if(k.correct){btn.classList.add('is-right');if(+btn.dataset.i===i)btn.classList.add('pop');}
      if(+btn.dataset.i===i){btn.classList.add('is-chosen');if(!k.correct)btn.classList.add('is-wrong');}
    });
    final=true;
    const right=cfg.options.find(x=>x.correct);
    out.innerHTML='<p><strong>'+(o.correct?'That is right.':'Not quite.')+'</strong> '+FR(o.correct?cfg.explain:o.why+' '+cfg.explain)+'</p>'+(cfg.reveal||'');
    out.hidden=false;out.classList.remove('go');b.el.hidden=false;
    raf(()=>raf(()=>out.classList.add('go')));
  }
  function reset(){picks=[];final=false;tries=0;order=shuffle(cfg.options.map((o,i)=>i));out.hidden=true;out.classList.remove('go');b.el.hidden=true;render();}
  reset();
  return track(host,{reset:reset,
    getState:()=>({o:order,p:picks}),
    setState:s=>{
      reset();
      if(Array.isArray(s.o)&&s.o.length===order.length&&cfg.options.every((x,i)=>s.o.indexOf(i)>=0)){order=s.o.slice();render();}
      (s.p||[]).forEach(i=>{if(cfg.options[i])choose(i);});
    },
    isDone:()=>final});
}

/* ================= spot the error ================= */
function createSpot(cfg){
  // cfg.lines: one step per line. cfg.wrong: index of the one wrong step (never the first line).
  // Steps after the wrong one are worked correctly from it, so only the mistake itself is wrong.
  // Write a fraction as [[top|bottom]]; it is drawn stacked, and read aloud as "top over bottom".
  const nb=t=>t.replace(/(\d) (?=\d{3}\b)/g,'$1 ');   // keep "15 000" on one line
  const html=FR;
  const said=t=>t.replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g,'($1) over ($2)');
  cfg.host.classList.add('err-grid');
  let picks=[],found=false;
  const blk=mk('div','err-block');cfg.host.appendChild(blk);
  blk.appendChild(mk('p','err-scn',nb(cfg.scenario)));
  const btns=cfg.lines.map((t,i)=>{
    const btn=mk('button','err-line','<span class="err-num" aria-hidden="true">'+(i+1)+'</span><span aria-hidden="true">'+html(t)+'</span>');
    btn.type='button';btn.setAttribute('aria-label','Line '+(i+1)+': '+said(t));
    btn.addEventListener('click',()=>pick(i,btn));
    blk.appendChild(btn);return btn;
  });
  const fb=mk('p','err-fb');fb.setAttribute('aria-live','polite');blk.appendChild(fb);
  const reset=()=>{btns.forEach(x=>{x.disabled=false;x.classList.remove('is-ok','is-bad','shake');});fb.textContent='Click the line that contains the mistake.';picks=[];found=false;};
  function pick(i,btn){
    if(found)return;
    picks.push(i);
    if(i===cfg.wrong){
      found=true;
      btn.classList.add('is-bad');btns.forEach(x=>x.disabled=true);
      fb.innerHTML='<strong style="color:var(--bad)">Found it: line '+(i+1)+'.</strong> '+html(cfg.explain)+
        '<span class="err-fix" style="display:block">'+cfg.fix.map(f=>'<span class="fix-line">'+html(f)+'</span>').join('')+'</span>';
    }else{
      btn.classList.add('is-ok');
      fb.innerHTML='<strong style="color:var(--good)">Line '+(i+1)+' is fine.</strong> '+
        (i>cfg.wrong?'It is worked correctly from the line above. The mistake is earlier.':'Keep looking.');
    }
  }
  bar(blk,[{label:'Try Again',fn:reset}]);
  reset();
  return track(cfg.host,{reset:reset,
    getState:()=>({p:picks}),
    setState:s=>{reset();(s.p||[]).forEach(i=>{if(btns[i])pick(i,btns[i]);});},
    isDone:()=>found});
}

/* ================= Sankey diagrams drawn to scale ================= */
// flows[0] is the useful output (straight on); the rest are wasted and bend downwards.
function sankeySVG(o){
  const W=o.W||460,H=o.H||270,s=o.scale,x0=14,xs=o.split||150,top=24,yEnd=H-26,r=12,gap=7;
  const total=o.flows.reduce((a,f)=>a+f.v,0),win=Math.max(2,total*s);
  let svg='<svg class="diagram sankey" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(o.label||'Sankey diagram')+'">';
  svg+='<path d="M'+x0+','+top+' L'+(xs+0.5)+','+top+' L'+(xs+0.5)+','+(top+win)+' L'+x0+','+(top+win)+' L'+(x0+14)+','+(top+win/2)+' Z" fill="'+o.inColor+'" opacity=".9"/>';
  const anchors={in:{x:(x0+xs)/2+6,y:top+win/2}};
  let y=top;const bands=o.flows.map(f=>{const w=Math.max(2,f.v*s);const b={f:f,ya:y,yb:y+w,w:w};y+=w;return b;});
  const u=bands[0],hx=W-44;
  svg+='<path d="M'+xs+','+u.ya+' L'+hx+','+u.ya+' L'+hx+','+(u.ya-7)+' L'+(W-12)+','+((u.ya+u.yb)/2)+' L'+hx+','+(u.yb+7)+' L'+hx+','+u.yb+' L'+xs+','+u.yb+' Z" fill="'+u.f.c+'" opacity=".9"/>';
  anchors[u.f.id]={x:hx-50,y:(u.ya+u.yb)/2};
  let prevOuter=xs+r-gap;
  for(let i=bands.length-1;i>=1;i--){
    const b=bands[i],R=r+b.w,xc=Math.max(xs+10,prevOuter+gap-r),ox=xc+R,ix=xc+r,hy=yEnd-14;
    svg+='<path d="M'+xs+','+b.ya+' L'+xc+','+b.ya+' A'+R+','+R+' 0 0 1 '+ox+','+(b.ya+R)+' L'+ox+','+hy+' L'+(ox+7)+','+hy+' L'+((ox+ix)/2)+','+yEnd+' L'+(ix-7)+','+hy+' L'+ix+','+hy+' L'+ix+','+(b.ya+R)+' A'+r+','+r+' 0 0 0 '+xc+','+b.yb+' L'+xs+','+b.yb+' Z" fill="'+b.f.c+'" opacity=".9"/>';
    anchors[b.f.id]={x:(ox+ix)/2,y:Math.max(b.ya+R+18,hy-(o.flows.length-i)*46)};
    prevOuter=ox;
  }
  svg+=(o.extra||'')+'</svg>';
  const pct={};Object.keys(anchors).forEach(k=>pct[k]={x:anchors[k].x/W*100,y:anchors[k].y/H*100});
  return {svg:svg,pct:pct};
}

  const K={none:0,some:0.08,lots:0.25},RUN=12,OMEGA=2*Math.PI/3;
  let fr='some',t=0,running=false,slow=false,last=0,done=false;
  seg(byId('sk-seg'),[{key:'none',label:'None'},{key:'some',label:'Some'},{key:'lots',label:'Lots'}],'some',k=>{fr=k;reset();});
  function state(tt){
    const M=1000*Math.exp(-K[fr]*tt),th=OMEGA*tt,c2=Math.cos(th)**2;
    const G=Math.round(M*c2),Kk=Math.round(M*(1-c2)),T=1000-G-Kk;
    const X=Math.sqrt(M*c2/1000)*(Math.cos(th)>=0?1:-1);
    return {G:G,K:Kk,T:T,X:X,dG:-Math.sin(2*th)};
  }
  function draw(){
    const s=state(t),px=180+150*s.X,py=190-150*s.X*s.X,ang=Math.atan(-2*s.X)*180/Math.PI;
    byId('sk-man').setAttribute('transform','translate('+px.toFixed(1)+' '+(py-2).toFixed(1)+') rotate('+ang.toFixed(1)+')');
    const v={g:s.G,k:s.K,t:s.T,tot:1000};
    Object.keys(v).forEach(k=>{byId('sk-v-'+k).textContent=v[k]+' J';byId('sk-f-'+k).style.transform='scaleX('+(v[k]/1000)+')';});
    byId('sk-eq').innerHTML='total = gravitational + kinetic + thermal<br>total = '+s.G+' + '+s.K+' + '+s.T+'<br>total = <b>1000 J</b>';
    let n;
    if(done){
      n=fr==='none'?'After '+RUN+' s Ali still rises back to the starting height. With no friction, no energy is dissipated: it just moves between his gravitational potential and kinetic stores.'
        :'After '+RUN+' s Ali only reaches '+Math.round(1000*Math.exp(-K[fr]*RUN)/10)+'% of the starting height. The energy is not destroyed: '+s.T+' J is now in the thermal store of the ramp and the air, and the total is still 1000 J.';
    }else if(t===0)n='Ali is at rest at the top. All 1000 J is in his gravitational potential store.';
    else n=(s.dG<0?'Going down: energy moves from the gravitational potential store to the kinetic store.':'Going up: energy moves from the kinetic store back to the gravitational potential store.')+(fr==='none'?'':' Friction also transfers energy by heating to the thermal store of the surroundings.');
    byId('sk-note').textContent=n;
  }
  function frame(ts){
    if(!running)return;
    const dt=Math.min(0.05,(ts-last)/1000);last=ts;
    t=Math.min(RUN,t+dt*(slow?0.3:1));
    if(t>=RUN){running=false;done=true;byId('sk-go').textContent='Go again';}
    draw();
    if(running)raf(frame);
  }
  function go(){if(running){running=false;byId('sk-go').textContent='Go';return;}if(done){t=0;done=false;}running=true;byId('sk-go').textContent='Pause';last=performance.now();raf(frame);}
  function reset(){running=false;done=false;t=0;byId('sk-go').textContent='Go';draw();}
  byId('sk-go').addEventListener('click',go);
  byId('sk-reset').addEventListener('click',reset);
  byId('sk-slow').addEventListener('click',()=>{slow=!slow;byId('sk-slow').setAttribute('aria-pressed',slow?'true':'false');byId('sk-slow').classList.toggle('is-on',slow);});
  reset();

  createReorder({

  });

  createPredict({

    q:'The ball only bounces back up to 1.5 m. Why does it not reach 2.0 m?',
    options:[

      {text:'Some energy is transferred by heating and by sound',correct:true},
      {text:'Gravity pulls harder on the ball on the way back up',why:'The pull of gravity on the ball is the same going up and coming down.'},
      {text:'Its gravitational store has been used up by the fall',why:'The store empties as it falls, but the energy is not used up. Most of it comes back as it rises.'}
    ],
    explain:'In the bounce, some energy is transferred by heating (the ball and the floor warm up slightly) and by sound. Less energy is left to go back into the gravitational potential store, so the ball rises less high. The total energy is unchanged.',
    reveal:barsHTML([{l:'Gravitational store at 2.0 m',v:1,t:'20 J',c:COL.g},{l:'Gravitational store at 1.5 m',v:.75,t:'15 J',c:COL.g},{l:'Dissipated by heating and sound',v:.25,t:'5 J',c:COL.t}])
  });
  createPredict({
    host:act('conserve','Predict','No friction at all','Imagine a perfectly smooth ramp with no air resistance.'),
    q:'A skater starts at rest 3 m up one side of a smooth half-pipe. How high up the other side does she go?',
    options:[
      {text:'Higher than 3 m, because she is fastest at the bottom',why:'Her speed at the bottom comes from her gravitational potential store. She cannot end up with more energy than she started with.'},
      {text:'Exactly 3 m, the same height she started from',correct:true},
      {text:'Less than 3 m, because energy is used at the bottom',why:'With no friction nothing is dissipated, so no energy leaves her stores.'},
      {text:'Less than 3 m, because she still has kinetic energy',why:'At her highest point she stops for a moment, so her kinetic store is empty there.'}
    ],
    explain:'With no friction, energy only moves between her gravitational potential and kinetic stores. At the highest point on the other side her kinetic store is empty again, so all the energy is back in her gravitational potential store: the same height, 3 m.',
    reveal:barsHTML([{l:'Start, 3 m: gravitational',v:1,t:'1500 J',c:COL.g},{l:'Bottom: kinetic',v:1,t:'1500 J',c:COL.k},{l:'Other side, 3 m: gravitational',v:1,t:'1500 J',c:COL.g}])
  });
  createCalc({
    host:act('conserve','Calculate','Energy in, energy out','Energy is conserved: the total energy out is always the same as the energy in.'),
    questions:[
      {q:'A television is supplied with 400 J. It gives out 120 J of light and 30 J of sound. The rest heats the surroundings. The energy transferred by heating is',unit:'J',answer:250,working:'energy in = light + sound + heating<br>400 = 120 + 30 + heating<br>400 = 150 + heating<br>heating = 400 − 150<br>heating = 250 J'},
      {q:'A ball rolls down a slope from rest. At the bottom it has 56 J in its kinetic store, and 4 J was transferred by heating on the way down. The energy it lost from its gravitational potential store is',unit:'J',answer:60,working:'gravitational store lost = kinetic + heating<br>gravitational store lost = 56 + 4<br>gravitational store lost = 60 J'}
    ]

// Two Predict activities in a row sit side by side (they stack again on narrow screens).
function pairPredicts(){
  const isPred=a=>a&&a.classList.contains('act')&&(($('.kind',a)||{}).textContent==='Predict');
  $$('.acts').forEach(list=>{
    Array.from(list.children).forEach(a=>{
      if(!isPred(a)||!a.parentNode||a.parentNode!==list)return;
      const b=a.nextElementSibling;if(!isPred(b))return;
      const pair=mk('div','act-pair');list.insertBefore(pair,a);pair.appendChild(a);pair.appendChild(b);
    });
  });
}

/* ---- slider explores: one layout, and the = signs lined up ---- */
// Picture on the left with its sliders underneath; choice buttons, Go, the working and notes on the right.
function stackSliders(cardSel, colCls, rowSel, segSel){
  Array.prototype.forEach.call(document.querySelectorAll(cardSel), function(card){
    var cols = Array.prototype.slice.call(card.children); if(cols.length!==2) return;
    var left = cols[0], right = cols[1];
    if(!left.classList.contains(colCls)){ var w=document.createElement('div'); w.className=colCls; card.insertBefore(w,left); w.appendChild(left); left=w; }
    Array.prototype.forEach.call(right.querySelectorAll(rowSel), function(r){ if(r.querySelector('input[type=range]')) left.appendChild(r); });
    Array.prototype.slice.call(left.querySelectorAll(rowSel)).reverse().forEach(function(r){ if(r.querySelector(segSel)) right.insertBefore(r, right.firstChild); });
  });
}
// Size the picture so the left column (picture + sliders) ends about where the right column ends:
// less empty space under the working. Wide screens only; phones stack the two columns anyway.
function balanceSims(cardSel, rowSel, segSel){
  var cards = Array.prototype.slice.call(document.querySelectorAll(cardSel));
  function fit(card){
    var left = card.children[0], right = card.children[1], pic = left && left.firstElementChild;
    if(!pic || !right) return;
    if(window.innerWidth <= 860){ card.style.gridTemplateColumns=''; card.style.removeProperty('--simw'); card.dataset.fitW=''; return; }
    var W = card.clientWidth; if(!W || card.dataset.fitW == W) return;   // hidden, or already fitted at this width
    for(var pass=0; pass<2; pass++){
      var pr = pic.getBoundingClientRect(); if(!pr.width || !pr.height) return;
      var cs = getComputedStyle(card), inner = W - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - (parseFloat(cs.columnGap)||16);
      var rest = left.getBoundingClientRect().height - pr.height, want = right.getBoundingClientRect().height - rest;
      var x = Math.max(inner*(parseFloat(card.dataset.minw)||0.32), Math.min(inner*0.6, Math.max(160, want) * pr.width/pr.height));
      card.style.gridTemplateColumns = Math.round(x)+'px minmax(0,1fr)'; card.style.setProperty('--simw', Math.round(x)+'px');
      // still much taller on the left? move sliders up to the right column, after its choice buttons
      var rows = Array.prototype.filter.call(left.querySelectorAll(rowSel), function(r){ return r.querySelector('input[type=range]'); });
      while(rows.length>0 && left.getBoundingClientRect().height - right.getBoundingClientRect().height > 60){
        var r = rows.pop(), segs = Array.prototype.filter.call(right.children, function(c){ return c.matches(segSel) || (c.matches(rowSel) && c.querySelector(segSel)); });
        var after = segs.length ? segs[segs.length-1].nextSibling : right.firstChild;
        var moved = Array.prototype.filter.call(right.children, function(c){ return c.dataset.movedSlider; });
        right.insertBefore(r, moved.length ? moved[0] : after); r.dataset.movedSlider = '1';
      }
    }
    card.dataset.fitW = W;
  }
  var ro = window.ResizeObserver ? new ResizeObserver(function(es){ es.forEach(function(e){ fit(e.target); }); }) : null;
  cards.forEach(function(c){ if(ro) ro.observe(c); fit(c); });
  window.addEventListener('resize', function(){ cards.forEach(fit); });
}
// Each line of a working readout becomes left | = | right, so the = signs sit under each other.
function alignEquals(el){
  if(el.querySelector('.eqg')) return;
  var rows = el.innerHTML.split(/<br\s*\/?>/i).map(function(line){
    var i = line.indexOf(' = ');
    if(i<0) return '<span class="eqg-full">'+line+'</span>';
    return '<span class="eqg-l">'+line.slice(0,i)+'</span><span class="eqg-m">=</span><span class="eqg-r">'+line.slice(i+3)+'</span>';
  });
  el.innerHTML = '<div class="eqg">'+rows.join('')+'</div>';
}
function watchEquals(sel){
  Array.prototype.forEach.call(document.querySelectorAll(sel), function(el){
    alignEquals(el);
    new MutationObserver(function(){ alignEquals(el); }).observe(el, {childList:true});
  });
}

watchEquals('.eq, .cw');
balanceSims('.sim:not(.act-pair .sim)','.ctl-row','.seg');

function pairByTitle(t1,t2){
  const find=t=>$$('.act').find(a=>$('.act-title',a).textContent.endsWith(t));
  const a=find(t1),b=find(t2);if(!a||!b)return;

}
function applyTabUI(tab){
  TAB_IDS.forEach(id=>{const p=byId('panel-'+id);if(p)p.hidden=(id!==tab);});
  $$('.tab-btn').forEach(b=>{const on=b.dataset.tab===tab;b.classList.toggle('is-active',on);b.setAttribute('aria-selected',on?'true':'false');b.tabIndex=on?0:-1;});
  activeTab=tab;
  try{const b=byId('tab-'+tab),r=b&&b.parentNode;if(r&&r.scrollWidth>r.clientWidth)r.scrollLeft=b.offsetLeft-r.offsetLeft-32;}catch(e){}
  reflowers.forEach(f=>{try{f(tab);}catch(e){console.error(e);}});
  try{history.replaceState(null,'','#'+tab);}catch(e){}
  writeSave();
  try{const b=byId('tab-'+tab);window.pwCountTab&&pwCountTab(tab,b&&b.firstChild?b.firstChild.textContent.trim():tab);}catch(e){}
}
$$('.tab-btn').forEach(b=>b.addEventListener('click',()=>applyTabUI(b.dataset.tab)));
byId('tab-overview').parentNode.addEventListener('keydown',e=>{
  if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;
  const i=TAB_IDS.indexOf(activeTab),n=(i+(e.key==='ArrowRight'?1:-1)+TAB_IDS.length)%TAB_IDS.length;
  applyTabUI(TAB_IDS[n]);byId('tab-'+TAB_IDS[n]).focus();
});
// The open tab is remembered in this browser only, so a reload returns to it.
// Answers and the open tab are remembered in this browser only, so a reload keeps them.
// OLD_STORE_KEY held only the open tab; it is read once so a returning student lands on the same tab.
function readSaved(){
  for(const k of [STORE_KEY,OLD_STORE_KEY]){
    try{const s=JSON.parse(localStorage.getItem(k)||'null');if(s&&typeof s==='object')return s;}catch(e){}
  }
  return {};
}
function start(data){
  const v=(data&&data.v)||{};
  games.forEach(g=>{if(v[g.key]&&typeof v[g.key]==='object'){try{g.setState(v[g.key]);}catch(e){console.error(e);}}});
  saveReady=true;showProgress(false);
  let t=data&&data.tab;
  if(!t){try{t=location.hash.slice(1);}catch(e){}}
  if(TAB_IDS.indexOf(t)<0)t='overview';
  applyTabUI(t);
}
start(readSaved());
})();
