  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      linear-gradient(var(--bg-grid) 1px,transparent 1px) 0 0/100% 34px,
      linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px) 0 0/34px 100%,
      var(--bg);

  }

  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;}

  .page{max-width:1400px;margin-inline:auto;padding-inline:20px;padding-block:12px 40px;}
  h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:0.2px;text-wrap:balance;margin:0;}
  p{margin:0;line-height:1.55;}

  .home-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-bottom:4px;font:600 13px var(--font-mono);color:var(--ink-soft);text-decoration:none;}
  .home-link:hover{color:var(--accent);}
  .page-head{margin-bottom:12px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px;}
  .eyebrow{font-family:var(--font-mono);font-size:11.5px;color:var(--accent);font-weight:600;margin-bottom:6px;}
  .page-head h1{font-size:clamp(28px,5vw,38px);color:var(--ink);}

  .card{background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;box-shadow:var(--shadow);}
  .btn{
    font-family:var(--font-body);font-weight:600;font-size:13.5px;color:var(--ink);
    background:var(--panel);border:1px solid var(--panel-border);border-radius:9px;
    padding:9px 15px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  }
  .btn:hover{border-color:var(--ink-faint);}
  .btn:disabled{opacity:.45;cursor:default;}
  .btn-primary{background:var(--ink);border-color:var(--ink);color:var(--bg);}
  .btn-primary:hover{opacity:.88;border-color:var(--ink);}
  .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);}
  .btn-group{display:flex;flex-wrap:wrap;gap:10px;}
  /* button rows fill their width (Alex, 2 Nov 2026) */
  .btn-group>.btn,.exp-btns>.btn{flex:1 1 0;min-width:max-content;justify-content:center;}
  .seg:not(.tabs){display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,96px),1fr));}
  .seg:not(.tabs)>button{padding-inline:4px;white-space:nowrap;}

  @media (max-width:860px){ .stage{grid-template-columns:minmax(0,1fr);} }

  .view text{font-family:var(--font-mono);}
  .under{display:flex;flex-direction:column;gap:12px;margin-top:12px;}
  .sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px 24px;}
  .side{display:flex;flex-direction:column;gap:12px;min-width:0;}
  .lab{display:block;font:12.5px var(--font-mono);color:var(--ink-soft);margin-bottom:6px;}
  .lab output{color:var(--ink);font-weight:600;white-space:nowrap;margin-left:6px;}

  .seg{display:flex;flex-wrap:wrap;gap:6px;}
  .seg button{font:12.5px var(--font-mono);padding:8px 11px;min-height:44px;border:1px solid var(--panel-border);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer;}

  .seg.tabs button:last-child{border-radius:0 8px 8px 0;}
  .cgrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center;}
  .rowlab{font:11.5px var(--font-mono);color:var(--ink-faint);}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px;}
  .stat{border:1px solid var(--panel-border);border-radius:8px;padding:5px 8px;display:flex;flex-direction:column;justify-content:space-between;}
  .stat small{display:block;font:10.5px var(--font-mono);color:var(--ink-faint);}
  .stat strong{font:600 15px var(--font-mono);color:var(--ink);white-space:nowrap;}
  .stat.hi strong{color:var(--topic);}

  .eq{font-family:var(--font-mono);font-size:14px;line-height:1.75;padding:8px 12px;border-left:3px solid var(--topic);background:var(--topic-soft);border-radius:6px;color:var(--ink);}

  .eq + .eq{margin-top:8px;}
  .eqnote{font-size:13.5px;color:var(--ink-soft);margin-top:8px;}
  .eqg{display:grid;grid-template-columns:auto auto minmax(0,1fr);column-gap:.45em;row-gap:.2em;align-items:center}
  .eqg-l{justify-self:end;text-align:right}
  .eqg-m{justify-self:center}
  .eqg-r{justify-self:start;min-width:0}
  .eqg-full{grid-column:1/-1}

  .frac>span{padding:0 .25em;white-space:nowrap;}

  /* ===== Experiment kit (tools/experiment-kit/kit.css) ===== */

  .view.dragging,.view.dragging *{cursor:grabbing;}
  .view:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px;}

  /* ===== end of Experiment kit ===== */

  .expl p{font-size:13.5px;color:var(--ink-soft);margin:0 0 8px;line-height:1.5;}
  .expl b{color:var(--topic);}
  .cgrid>[hidden]{display:none!important;}

  /* measure mode (?show=measure): the practical page's Do Experiment tab. Nothing is read for the student. */
  .meas-off{display:none !important;}
  /* inside a workout tab (?embed): no page heading, no outer margins */
  .embed body{background:transparent;}
  .embed .page{padding:0;max-width:none;display:flow-root;}
  .embed .home-link,.embed .page-head{display:none;}
  .embed .view{max-height:460px;}
  .view.tall,.embed .view.tall{max-height:none;}
  .side>.seg.tabs{align-self:flex-start;}
  .head-line{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;}
  .page-head{display:block;}
  .pick{cursor:pointer;} .pick.off{cursor:default;} .pick:focus{outline:none;} .pick .ring{stroke:transparent;} .pick:focus-visible .ring{stroke:var(--accent);}
  .stats.four{grid-template-columns:repeat(4,minmax(0,1fr));} @media (max-width:560px){ .stats.four{grid-template-columns:repeat(2,minmax(0,1fr));} }
  .view{touch-action:pan-y;}
  .view.scrub{cursor:ew-resize;}
  #hc-jump button,#hc-sub button{white-space:normal;line-height:1.2;}

<script>
  // Visit counter (GoatCounter: no cookies, no personal data). Skipped when a page is embedded in a workout, so a visit counts once.
  // pwCountTab(tab, label): counts each workout tab once per visit as a GoatCounter event (path "page#tab"), skipped in frames the same way.
  (function(){
    var off = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var seen = {}, queue = [];
    function send(e){ try { window.goatcounter.count(e); } catch (x) {} }
    window.pwCountTab = function(tab, label){
      if (off || !tab || seen[tab]) return;
      seen[tab] = 1;
      var page = (location.pathname.split('/').pop() || 'index').replace(/\.html$/, '');
      var e = { path: page + '#' + tab, title: (label || tab) + ' \u00b7 ' + document.title, event: true };
      if (window.goatcounter && window.goatcounter.count) send(e); else queue.push(e);
    };
    if (off) return;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://gc.zgo.at/count.js';
    s.setAttribute('data-goatcounter', 'https://physics-workout.goatcounter.com/count');
    s.onload = function(){ var q = queue; queue = []; q.forEach(send); };
    document.head.appendChild(s);
  })();
</script>

<script>
  // Draft tags and Alex's reviewer button (tools/review/drafts.py writes this block; edit tools/review/snippet.html, then run drafts.py sync).
  // A page is Draft while its row in tools/REVIEW.md is not ✅: <meta name="pw-draft"> on the page, data-draft on its list cards.
  // ?reviewer (once, on any page) turns on reviewer mode in this browser; ?reviewer=off turns it off.
  (function(){
    var on = false, embed = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var m = /[?&]reviewer(?:=([^&]*))?/.exec(location.search);
    on = !!m && m[1] !== 'off';
    try {
      if (m) { if (m[1] === 'off') localStorage.removeItem('pw-reviewer'); else localStorage.setItem('pw-reviewer', '1'); }
      else on = localStorage.getItem('pw-reviewer') === '1';
    } catch (e) {}
    var CSS = '.pw-draft{display:inline-block;vertical-align:middle;margin-left:10px;font:600 11.5px/1.4 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:0;color:var(--bad,#b42318);border:1px dashed currentColor;border-radius:5px;padding:1px 7px;white-space:nowrap}'
      + '.act-top .pw-draft{margin-left:auto;flex:none}.act-top .pw-draft~.cp-tag,.act-top .pw-draft~.ta-tag{margin-left:0}'
      + 'a[data-draft]{position:relative}.pw-draft.pw-corner{position:absolute;top:10px;right:10px;margin:0;background:var(--panel,#fff)}'
      + '.pw-check{display:inline-block;vertical-align:middle;margin-left:8px;font:600 13px/1.4 "IBM Plex Sans",system-ui,sans-serif;color:#fff;background:#1a7f37;border-radius:6px;padding:4px 10px;text-decoration:none;white-space:nowrap}'
      + '.pw-check:hover{background:#116329}.pw-check:focus-visible{outline:2px solid #1a7f37;outline-offset:2px}'
      + '.pw-reviewer{position:fixed;left:10px;bottom:10px;z-index:9999;font:500 12px/1.4 "IBM Plex Mono",ui-monospace,monospace;background:#1d2433;color:#fff;border-radius:6px;padding:4px 9px;opacity:.85}'
      + '.pw-reviewer a{color:#ffc83d}';
    function tag(){ var t = document.createElement('span'); t.className = 'pw-draft'; t.title = 'Not yet checked'; t.textContent = 'Draft'; return t; }
    function go(){
      var st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st);
      var meta = document.querySelector('meta[name="pw-draft"]'), h1 = document.querySelector('h1');
      if (meta && h1 && !embed) {
        h1.appendChild(tag());
        if (on) {
          var page = meta.getAttribute('content'), b = document.createElement('a');
          b.className = 'pw-check'; b.target = '_blank'; b.rel = 'noopener'; b.textContent = '✓ Checked';
          b.title = 'Opens a GitHub issue. Submit it and the Draft tag goes in a minute or two.';
          b.href = 'https://github.com/Skati1401/Physics-Workout/issues/new?title=' + encodeURIComponent('Checked: ' + page)
            + '&body=' + encodeURIComponent('Submit this issue to mark `' + page + '` as checked. The Draft tag goes in a minute or two, and the issue closes itself.');
          h1.appendChild(b);
        }
      }
      document.querySelectorAll('a[data-draft]').forEach(function(a){
        if (a.querySelector('.pw-draft')) return;
        var t = tag(), top = a.querySelector('.act-top');
        if (top) top.insertBefore(t, top.querySelector('.cp-tag,.ta-tag'));
        else { t.className += ' pw-corner'; a.appendChild(t); }
      });

/* ================= Experiment kit (copy this block into an animation page's <script>) =================
   The reusable parts of an animation's Experiment mode, taken from animations/hookes-law.html:
   - expRun():     the run itself: step the independent variable up one interval at a time, then
                   (optionally) back down again, measuring at every step
   - expReading(): a reading with a small, fixed pattern of reading error, rounded to the instrument's
                   resolution, that never goes the wrong way
   - expTable():   the results table (sticky header, newest row highlighted, a column per run)
   - expCross(), expRing(), expKey(): SVG marks for plotted readings (× first run, ○ return run)
   The page keeps its own picture, physics, graph axes and notes. See tools/experiment-kit/README.md.
   Plain ES5 so it can sit inside any animation page's IIFE. */

// A fixed pattern of reading errors, in units of the instrument's resolution. Fixed (not random) so a
// teacher sees the same results as the class, and a re-run gives the same table.
var EXP_ERR = [0, 1, -1, 0, 2, -1, 1, -2, 0, 1, -1, 0, 1, -1, 2, 0, -1, 1, 0, -2, 1];
function expErr(i){ return EXP_ERR[((i % EXP_ERR.length) + EXP_ERR.length) % EXP_ERR.length]; }

// What the student reads off the instrument.
//   trueVal  the value the physics gives at this step
//   prevVal  the reading taken at the step before (or the start value)
//   res      the instrument's resolution (0.1 cm ruler, 0.05 mm vernier, 0.01 A ammeter, 1° protractor)
//   i        the step number (picks the error from the pattern)
//   scale    how big the error is, in resolutions (default 1; 0.5 for a fine instrument)
// The error is never more than a quarter of the change since the last reading, so a reading never
// goes the wrong way (an extension never falls as the load rises, a current never drops as V rises).
function expReading(trueVal, prevVal, res, i, scale){
  var gap = Math.abs(trueVal - prevVal);
  var err = i > 0 ? expErr(i) * Math.min(res * (scale == null ? 1 : scale), gap / 4) : 0;
  var r = Math.round((trueVal + err) / res) * res;
  var dp = Math.max(0, Math.ceil(-Math.log10(res) - 1e-9));
  return +r.toFixed(dp);
}

// The run. cfg = {
//   start: 0,                 value of the independent variable before the first step
//   max: 10,                  last value of the first run (the run stops there)
//   step: 1,                  the interval (the page can change it with setStep, which resets the run)
//   reverse: true,            allow a return run (unloading, turning the voltage back down)
//   measure: function(v, phase, prevReading){ return reading },   phase is 'up' or 'down'
//   onChange: function(run, what){}  what is 'up', 'down' or 'reset'
// }
// run.up and run.down are arrays of {v, r}. run.phase is 'up' until the first step back, then 'down'.
function expRun(cfg){
  var run = { up: [], down: [], phase: 'up', value: cfg.start || 0, peak: cfg.start || 0, step: cfg.step || 1 };
  var r6 = function(x){ return Math.round(x * 1e6) / 1e6; };
  run.upDone = function(){ return run.phase === 'down' || run.peak >= cfg.max - 1e-9; };
  run.downDone = function(){ return run.phase === 'down' && run.value <= (cfg.start || 0) + 1e-9; };
  run.last = function(){ var a = run.phase === 'down' && run.down.length ? run.down : run.up; return a[a.length - 1] || null; };
  run.stepUp = function(){
    if(run.phase !== 'up' || run.upDone()) return false;
    var prev = run.up.length ? run.up[run.up.length - 1].r : null;
    var v = r6(Math.min(cfg.max, run.value + run.step));
    run.value = run.peak = v;
    run.up.push({ v: v, r: cfg.measure(v, 'up', prev) });
    if(cfg.onChange) cfg.onChange(run, 'up');
    return true;
  };
  run.stepDown = function(){
    if(!cfg.reverse || run.value <= (cfg.start || 0) + 1e-9 || !run.up.length) return false;
    run.phase = 'down';
    var prev = run.down.length ? run.down[run.down.length - 1].r : run.up[run.up.length - 1].r;
    var v = r6(Math.max(cfg.start || 0, run.value - run.step));
    run.value = v;
    run.down.push({ v: v, r: cfg.measure(v, 'down', prev) });
    if(cfg.onChange) cfg.onChange(run, 'down');
    return true;
  };
  run.reset = function(){ run.up = []; run.down = []; run.phase = 'up'; run.value = run.peak = cfg.start || 0; if(cfg.onChange) cfg.onChange(run, 'reset'); };
  run.setStep = function(s){ run.step = s; run.reset(); };
  return run;
}

// The results table. cols = [{label:'Load (N)', key:'v', dp:0}, {label:'Extension loading (cm)', key:'up', dp:1}, ...]
// rows = [{v:1, up:1.6, down:''}, ...]. newKey/newV highlight the reading just taken (fades in).
// Wrap it in .rtable-wrap so a long table scrolls under its sticky header.
function expTable(el, cols, rows, newV){
  var fmt = function(x, dp){ return (x === '' || x == null) ? '' : (+x).toFixed(dp || 0); };
  var h = '<table class="rtable"><thead><tr>' + cols.map(function(c){ return '<th>' + c.label + '</th>'; }).join('') + '</tr></thead><tbody>';
  rows.forEach(function(row){
    h += '<tr' + (newV != null && row.v === newV ? ' class="new"' : '') + '>' + cols.map(function(c){ return '<td>' + fmt(row[c.key], c.dp) + '</td>'; }).join('') + '</tr>';
  });
  el.innerHTML = h + '</tbody></table>';
}

// Plotted readings, as SVG strings. Size 5 suits a 300px-wide graph.
function expCross(cx, cy, s){ s = s || 5; return '<path d="M' + (cx - s) + ',' + (cy - s) + ' L' + (cx + s) + ',' + (cy + s) + ' M' + (cx + s) + ',' + (cy - s) + ' L' + (cx - s) + ',' + (cy + s) + '" stroke="var(--ink)" stroke-width="2"/>'; }
function expRing(cx, cy, r){ return '<circle cx="' + cx + '" cy="' + cy + '" r="' + (r || 4.5) + '" fill="none" stroke="var(--accent)" stroke-width="2"/>'; }
// A two-line key in the bottom-right corner of a graph: expKey(rightX, bottomY, 'loading', 'unloading')
function expKey(x, y, upLabel, downLabel){
  return '<text x="' + x + '" y="' + (y - 14) + '" text-anchor="end" font-size="10.5" fill="var(--ink)">× ' + upLabel + '</text>' +
         '<text x="' + x + '" y="' + y + '" text-anchor="end" font-size="10.5" fill="var(--accent)">○ ' + downLabel + '</text>';
}

    g+=tube(cx-22,96,cx-12,gz-22,3.2,'var(--glass)','#fff');

    g+=thermo(cx+8,198,108,s.yMin,14,s.yMax,T,{step:5,num:10,fs:11.5,from:s.yMin+5,w:6.4});
    g+=glass(cx,gz-5,58,7,146);
    g+='<path d="M'+(cx-76)+','+gz+' A76,9 0 0 0 '+(cx+76)+','+gz+'" fill="none" stroke="var(--steel)" stroke-width="4"/>'+
       tube(cx-71,gz+3,cx-88,BENCH-2,4.5,'var(--steel)','var(--steel-hi)')+tube(cx+71,gz+3,cx+88,BENCH-2,4.5,'var(--steel)','var(--steel-hi)');
    g+=stopwatch(8,16,mmss(xt));
    g+=txt(52,128,'stirring',{a:'end',fs:12.5})+txt(52,142,'rod',{a:'end',fs:12.5})+ln(55,132,cx-21,120,'var(--ink-faint)',1);
    g+=txt(46,196,'water',{a:'end',fs:12.5})+txt(46,210,'bath',{a:'end',fs:12.5})+ln(49,200,cx-56,200,'var(--ink-faint)',1);
    g+=txt(208,126,f>=1?'water':f>0?'ice and':'crushed',{fs:12.5})+txt(208,140,f>=1?'':f>0?'water':'ice',{fs:12.5})+ln(205,134,cx+30,190,'var(--ink-faint)',1);
    g+=txt(208,272,'Bunsen',{fs:12.5})+txt(208,286,'burner',{fs:12.5});
    return g;
  }
  // Experiment, stearic acid: a boiling tube of molten acid cooling, stood in a beaker
  function appAcid(){
    var s=S(), t=Math.min(xt,s.xMax), f=t<s.p0?0:t<s.p1?(t-s.p0)/(s.p1-s.p0):1, T=measT(), cx=124, yb=BENCH-8, g='', top=232, bot=yb-6;
    g+=bench()+ell(cx+4,BENCH-1,60,5,'#000',' opacity=".1"');
    var tubeP=function(y1,fill,x){ return '<path d="M'+(cx-15)+','+f1(y1)+' L'+(cx-15)+','+(bot-15)+' A15,15 0 0 0 '+(cx+15)+','+(bot-15)+' L'+(cx+15)+','+f1(y1)+' z" fill="'+fill+'"'+(x||'')+'/>'; };
    g+=tubeP(top,'var(--wax)',' opacity=".55"');
    if(f>0) g+='<clipPath id="hc-fz"><rect x="'+(cx-16)+'" y="'+f1(bot-(bot-top)*f)+'" width="32" height="'+f1((bot-top)*f+2)+'"/></clipPath><g clip-path="url(#hc-fz)">'+tubeP(top,'var(--wax)')+tubeP(top,'var(--wax-s)',' opacity=".55"')+'</g>';
    g+=thermo(cx,bot-22,118,s.yMin,18,s.yMax,T,{step:5,num:10,fs:11.5,from:s.yMin,w:6.4});
    g+='<path d="M'+(cx-15)+',124 L'+(cx-15)+','+(bot-15)+' A15,15 0 0 0 '+(cx+15)+','+(bot-15)+' L'+(cx+15)+',124" fill="none" stroke="var(--glass)" stroke-width="2.4"/>'+ell(cx,124,16.5,3.4,'none',' stroke="var(--glass)" stroke-width="2.2"')+ln(cx-10,134,cx-10,bot-18,'#fff',2.2,' stroke-linecap="round" opacity=".55"');
    g+=glass(cx,yb,50,7,yb-76);
    g+=stopwatch(8,16,mmss(xt));
    g+=txt(52,150,'boiling',{a:'end',fs:12.5})+txt(52,164,'tube',{a:'end',fs:12.5})+ln(55,154,cx-17,160,'var(--ink-faint)',1);
    g+=txt(200,226,'stearic acid:',{fs:12.5})+txt(200,240,f>=1?'solid':f>0?'liquid and solid':'liquid',{fs:12.5,c:'var(--ink)'})+ln(197,236,cx+13,250,'var(--ink-faint)',1);
    g+=txt(46,292,'beaker',{a:'end',fs:12.5})+ln(49,288,cx-49,288,'var(--ink-faint)',1);
    return g;
  }

  // ---- the particle model's frame and caption ----
  var CAP={s:['Solid','var(--solid)','regular pattern, vibrating','about fixed positions'], m:['Melting','var(--ink)','some particles break free:','solid and liquid together'], l:['Liquid','var(--liquid)','close together, moving','around each other'],
           b:['Boiling','var(--ink)','some particles escape:','liquid and gas together'], g:['Gas','var(--gas)','far apart, moving quickly','in all directions']};
  function modelE(){ return exp() ? S().E(Math.min(xt,S().xMax)) : E; }
  function panelPt(L){ var x=L.P.x, y=L.P.y, w=300*L.P.k, h=w, c=CAP[stageOf(modelE())], g='';
    g+=txt(x+w/2,y-12,'Particle model',{a:'middle',fs:13.5,c:'var(--ink)',w:600});
    g+=rect(x,y,w,h,'var(--bg)',' rx="5"')+pl([[x+2,y+2],[x+2,y+h-2],[x+w-2,y+h-2],[x+w-2,y+2]],'var(--ink-faint)',2.2);
    g+=txt(x+w/2,y+h+22,c[0],{a:'middle',fs:15,c:c[1],w:700})+txt(x+w/2,y+h+40,c[2],{a:'middle',fs:12.5})+txt(x+w/2,y+h+56,c[3],{a:'middle',fs:12.5});
    return g; }
  function drawPt(){ if(MEAS){ if(gPt.firstChild) gPt.innerHTML=''; return; }
    var L=lay(), k=L.P.k, s='', r=(7*k).toFixed(1);
    sim.P.forEach(function(p){ if(p.out) return; s+='<circle cx="'+(L.P.x+p.x*k).toFixed(1)+'" cy="'+(L.P.y+p.y*k).toFixed(1)+'" r="'+r+'" fill="var(--'+(p.mode==='s'?'solid':p.mode==='l'?'liquid':'gas')+')"/>'; });
    gPt.innerHTML=s; }

  // ---- the graphs ----
  var PTS=[[0,-40],[2,0],[8,0],[18,100],[27,100],[30,140]], SEGC=['var(--solid)','var(--ink)','var(--liquid)','var(--ink)','var(--gas)'];
  var SEGL=[['solid',2.6,-30,'start'],['melting',5,13,'middle'],['liquid',14.4,44,'start'],['boiling',22.5,113,'middle'],['gas',27.6,128,'end']];
  function graphE(G){
    var A=plotAxes(G,{xMin:0,xMax:30,yMin:-50,yMax:150,xTicks:[0,5,10,15,20,25,30],yTicks:[-40,0,50,100],xLabel:'Time (minutes)',yLabel:'Temperature (°C)'}), s=A.s, tm=E*0.3, i;
    for(i=0;i<5;i++) s+=ln(A.gx(PTS[i][0]),A.gy(PTS[i][1]),A.gx(PTS[i+1][0]),A.gy(PTS[i+1][1]),SEGC[i],3.2,' stroke-linecap="round"');
    for(i=0;i<5;i++) if(E>0 && tm>=PTS[i][0]-1e-9) s+=txt(A.gx(SEGL[i][1]),A.gy(SEGL[i][2]),SEGL[i][0],{a:SEGL[i][3],fs:12.5,c:SEGC[i],w:600,halo:1});
    s+='<circle cx="'+f1(A.gx(tm))+'" cy="'+f1(A.gy(Tof(E)))+'" r="7.5" fill="var(--accent)" stroke="var(--panel)" stroke-width="2"/>';
    GA=A; return s;
  }
  function graphX(G){
    var s_=S(), A=plotAxes(G,{xMin:0,xMax:s_.xMax,yMin:s_.yMin,yMax:s_.yMax,xTicks:[0,2,4,6,8,10,12,14,16],yTicks:s_.yTicks,xLabel:'Time (minutes)',yLabel:'Temperature (°C)'}), s=A.s;
    if(xDone()){
      var p=[]; for(var t=0;t<=s_.xMax+1e-9;t+=0.1) p.push([A.gx(t),A.gy(s_.T(t))]);
      s+=pl(p,'var(--accent)',2.5,' stroke-dasharray="8 6" opacity=".85"');
      s+=txt(A.gx((s_.p0+s_.p1)/2),A.gy(s_.mp)+(sub==='ice'?-12:22),(sub==='ice'?'melting point ':'freezing point ')+s_.mp+' °C',{a:'middle',fs:13,c:'var(--accent)',w:600,halo:1});
    }
    reads.forEach(function(r){ s+=expCross(A.gx(r.t),A.gy(r.T),5.5); });
    return s;
  }
  // measure mode: a large stopwatch and the close-up of the thermometer, where the particle model and the graph were
  function measPanel(L){ var M=L.M, g='';
    g+=stopwatch(M.x+8,M.y+6,mmss(xt),1.7)+txt(M.x+150,M.y+50,'min:s',{fs:12.5});
    g+=txt(M.x+74,M.y+112,'Close-up of the thermometer (°C)',{a:'middle',fs:13,c:'var(--ink)',w:600});
    g+=thermoClose(M.x-6,M.y+124,160,198,measT(),'hc');
    return g; }

  // ---- notes ----
  var NOTE={
    s:'<b>Solid warming.</b> The particles vibrate faster about their fixed positions. Their kinetic energy increases, so the temperature rises.',
    m:'<b>Melting at 0 °C.</b> The energy supplied is used to break the bonds that hold the particles in fixed positions. Their kinetic energy does not change, so the temperature stays constant until all the ice has melted.',
    l:'<b>Liquid warming.</b> The particles move around each other faster. Their kinetic energy increases, so the temperature rises.',
    b:'<b>Boiling at 100 °C.</b> The energy supplied is used to separate the particles completely, against the forces between them. Their kinetic energy does not change, so the temperature stays constant until all the water has boiled.',
    g:'<b>Gas warming.</b> The particles are far apart and move quickly in all directions. Heating makes them move faster, so the temperature rises again.'};
  function note(){
    var ice=sub==='ice', last=reads[reads.length-1], n;
    if(MEAS){
      if(auto) return ice ? 'Heating and stirring…' : 'Cooling…';
      var rd='Read the thermometer in the close-up, to the nearest 0.5 °C, and write the temperature ';
      if(xt===0) return (ice ? 'The beaker of crushed ice stands in a water bath. ' : 'The stearic acid has been melted. It now cools in its boiling tube. ')+rd+'at 0 minutes in your table. Then press <b>'+(ice?'Heat for 1 minute':'Wait 1 minute')+'</b>'+(ice?', and keep stirring.':'.');
      return 'The stopwatch reads '+Math.round(xt)+' minute'+(Math.round(xt)===1?'':'s')+'. '+rd+'in your table. '+(xDone()?'That was the last reading.':'Then '+(ice?'heat for 1 minute more.':'wait 1 minute more.'));
    }
    if(!exp()){
      if(E===0 && !auto) return 'Ice at −40 °C is heated at a steady rate. Press <b>Play</b>, or drag the dot along the graph (or move the Time slider) forwards and backwards. The particles show what is happening to the substance.';
      return NOTE[stageOf(E)]+(E>=95?' The gas escapes from under the lid.':'');
    }
    if(reads.length<=1 && xt===0) n='Experiment: choose the substance and how often to read the thermometer, then press <b>Start</b> to start the stopwatch. '+(ice?'The ice is heated in a beaker of hot water and stirred all the time.':'The stearic acid has been melted; it now cools in its boiling tube.');
    else if(!xDone()) n='Reading at '+sgn(last.t)+' min: '+sgn(last.T)+' °C. '+(ice?'Keep stirring, and keep the thermometer off the bottom of the beaker.':'Keep the thermometer in the middle of the acid.');
    else if(ice) n='Run complete. The temperature rose to 0 °C, then stayed at 0 °C from about 2 to 8 minutes while the ice melted: the energy supplied was breaking the forces between the particles, not raising the temperature. Once all the ice had melted, the temperature rose again.';
    else n='Run complete. The temperature fell to 69 °C, then stayed at 69 °C from about 2.5 to 9.5 minutes while the acid froze: the energy released as the particles settled into fixed positions replaced the energy lost to the surroundings, so the temperature did not fall. Once it was all solid, it cooled again.';
    if(xDone() && iv===2) n+=' With readings only every 2 minutes, the corners of the flat part are hard to place: a shorter interval shows them better.';
    return n;
  }

  // ---- drawing and wiring ----
  function draw(){
    var L=lay(), ex=exp(), s='<g transform="translate('+L.ax+',0)">'+(ex ? (sub==='ice'?appIce():appAcid()) : appHot())+'</g>';
    if(MEAS) s+=measPanel(L); else s+=panelPt(L)+(ex?graphX(L.G):graphE(L.G));
    var vb='0 0 '+L.W+' '+L.H; if(svg.getAttribute('viewBox')!==vb) svg.setAttribute('viewBox',vb);
    svg.classList.toggle('tall',!!L.tall); svg.classList.toggle('scrub',!ex);
    gMain.innerHTML=s;
    noteEl.innerHTML=note();
    var last=reads[reads.length-1];
    statsEl.innerHTML = ex ? stat('Time',sgn(xt)+' min')+stat('Last reading',last?sgn(last.T)+' °C':'–',true) : stat('Time',sgn(E*0.3)+' min')+stat('Temperature',sn(Tof(E),0)+' °C',true);
    $('#hc-eo').textContent=sgn(E*0.3)+' min';
    if(ex && !MEAS){
      tableEl.innerHTML='<table class="rtable"><thead><tr><th>Time (min)</th><th>Temperature (°C)</th></tr></thead><tbody>'+reads.map(function(r,i){ return '<tr'+(newRow&&i===reads.length-1?' class="new"':'')+'><td>'+sgn(r.t)+'</td><td>'+sgn(r.T)+'</td></tr>'; }).join('')+'</tbody></table>';
      if(newRow){ $('#hc-tablewrap').scrollTop=$('#hc-tablewrap').scrollHeight; } newRow=false;
    }
    playBtn.innerHTML = MEAS ? '&#9654; '+(sub==='ice'?'Heat for 1 minute':'Wait 1 minute') : auto ? '&#10074;&#10074; Pause' : ex ? '&#9654; Start' : '&#9654; Play';
    playBtn.disabled = MEAS && (auto || xDone());
    svg.setAttribute('aria-label', MEAS ? (sub==='ice'?'A beaker of crushed ice with a thermometer and a stirring rod, in a water bath over a Bunsen burner. ':'A boiling tube of stearic acid with a thermometer, cooling. ')+'A stopwatch and a close-up of the thermometer are beside it.'
      : ex ? (sub==='ice'?'A beaker of crushed ice with a thermometer and a stirring rod, in a water bath over a Bunsen burner':'A boiling tube of stearic acid with a thermometer, cooling')+', a model of its particles, and the graph of temperature against time with each reading plotted as a cross.'
      : 'A beaker of ice on a hot plate with a thermometer, a model of its particles, and the heating curve: temperature against time, flat while the ice melts at 0 °C and while the water boils at 100 °C. Drag the dot on the graph to move through time.');
  }
  function setRows(){ var ex=exp();
    $('#hc-jlab').hidden=$('#hc-jump').hidden=ex; $('#hc-slab').hidden=$('#hc-sub').hidden=!ex; $('#hc-ilab').hidden=$('#hc-int').hidden=!ex;
    $('#hc-tablewrap').hidden=!ex; $('#hc-sliders').hidden=ex; slowBtn.hidden=false; }
  function scrubTo(v){ E=clamp(Math.round(v*2)/2,0,100); slid.value=E; auto=false; sim.setE(E); jumpSeg.pick(null); draw(); drawPt(); }
  slid.addEventListener('input', function(){ scrubTo(+slid.value); });
  // drag the dot (or press anywhere on the graph) to move through time; the Time slider does the same from the keyboard
  svg.addEventListener('pointerdown', function(e){
    if(exp()) return; var q=vpt(svg,e), G=lay().G;
    if(q.x<G.x-14 || q.x>G.x+G.w+14 || q.y<G.y-10 || q.y>G.y+G.h+10) return;
    dragging=true; try{ svg.setPointerCapture(e.pointerId); }catch(_){} scrubTo((q.x-G.x)/G.w*100); e.preventDefault();
  });
  svg.addEventListener('pointermove', function(e){ if(dragging){ var q=vpt(svg,e), G=lay().G; scrubTo((q.x-G.x)/G.w*100); } });
  ['pointerup','pointercancel'].forEach(function(n){ svg.addEventListener(n, function(){ dragging=false; }); });

  playBtn.addEventListener('click', function(){
    simPaused=false; jumpSeg.pick(null);
    if(MEAS){ if(auto || xDone()) return; mTarget=Math.min(S().xMax,Math.round(xt)+1); auto=true; draw(); return; }
    if(auto){ auto=false; draw(); return; }
    if(exp()){ if(xDone()) xReset(); }
    else if(E>=100){ E=0; slid.value=0; sim.setE(0); }
    auto=true; draw();
  });
  resetBtn.addEventListener('click', function(){ jumpSeg.pick(null); if(exp()) xReset(); else { E=0; slid.value=0; auto=false; sim.setE(0); } draw(); drawPt(); });
  slowBtn.addEventListener('click', function(){ slowBtn.setAttribute('aria-pressed', String(!slowOn())); });
  expBtn.addEventListener('click', function(){ expBtn.setAttribute('aria-pressed', String(!exp())); auto=false; if(exp()) xReset(); else { E=0; slid.value=0; sim.setE(0); } setRows(); draw(); drawPt(); });

  var last=performance.now();
  function frame(now){
    var real=Math.min(0.1,(now-last)/1000), dt=real*(slowOn()?0.3:1), moved=false; last=now;
    if(auto){
      moved=true;
      if(exp()){
        xt=Math.min(MEAS?mTarget:S().xMax, xt+dt*0.8);
        // a reading each time the stopwatch passes the next interval
        while(reads.length && reads[reads.length-1].t+iv<=xt+1e-9){ takeReading(+(reads[reads.length-1].t+iv).toFixed(2)); newRow=true; }
        if(xDone() || (MEAS && xt>=mTarget-1e-9)) auto=false;
        sim.setE(S().E(Math.min(xt,S().xMax)));
      } else { E=Math.min(100,E+dt*6); slid.value=E; if(E>=100) auto=false; sim.setE(E); }
    }
    if(!simPaused){ sim.step(); drawPt(); }
    if(moved) draw();
    else if(!simPaused && !exp() && (stageOf(E)==='b' || stageOf(E)==='g') && E>0) draw();   // bubbles and steam keep moving
    requestAnimationFrame(frame);
  }
  var wasNarrow=narrow(); window.addEventListener('resize', function(){ if(narrow()!==wasNarrow){ wasNarrow=narrow(); draw(); drawPt(); } });

  if(MEAS) xReset();
  setRows(); if(MEAS){ $('#hc-jlab').hidden=$('#hc-jump').hidden=true; }
  sim.setE(MEAS?S().E(0):0); draw(); drawPt();
  requestAnimationFrame(frame);

})();
</script><script id="choice-kit-js">
/* Choice kit (12 Nov 2026): the same block on every animation page. See tools/ANIMATION-STYLE.md, "Choices".
   A group of choices with one chosen gets a track round it (class pick); a .to-q button opens the questions from Explore. */
(function(){
  function on(b){ return b.getAttribute('aria-pressed')==='true' || b.classList.contains('is-on'); }
  function each(sel, fn){ Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }
  function mark(s){
    if(!s.classList.contains('pick')){
      var n=0; Array.prototype.forEach.call(s.children, function(b){ if(b.tagName==='BUTTON' && on(b)) n++; });
      if(n===1) s.classList.add('pick');
    }
    if(s.classList.contains('pick') && !s.hasAttribute('data-fit')){
      var d=getComputedStyle(s).display;
      if(d!=='none'){ s.setAttribute('data-fit','1'); if(d.indexOf('flex')>=0) s.classList.add('fit'); }
    }
  }
  each('.seg:not(.tabs):not(.mode):not(.apps)', function(s){
    mark(s);
    if(window.MutationObserver) new MutationObserver(function(){ mark(s); }).observe(s, {childList:true, subtree:true, attributes:true, attributeFilter:['aria-pressed','class']});
  });
  // Choice rows: wrap each .rowlab and the control after it in a .cgroup (label above, groups side by side).
  // A group is hidden when everything in it is hidden, so pages that hide a row's label and control still work.
  function shown(e){ return !e.hidden && e.style.display!=='none'; }
  each('.cgrid:not(.kit)', function(g){
    var kids=Array.prototype.slice.call(g.children), groups=[];
    for(var i=0;i<kids.length;i++){
      var w=document.createElement('div'); w.className='cgroup';
      g.insertBefore(w, kids[i]); w.appendChild(kids[i]);
      if(kids[i].classList.contains('rowlab') && kids[i+1]){ w.appendChild(kids[i+1]); i++; }
      groups.push(w);
    }
    g.classList.add('kit'); if(groups.length===1) g.classList.add('one');
    groups.forEach(function(w){
      function sync(){ var any=false; Array.prototype.forEach.call(w.children, function(c){ if(shown(c)) any=true; }); w.hidden=!any; }
      sync();
      if(window.MutationObserver) Array.prototype.forEach.call(w.children, function(c){ new MutationObserver(sync).observe(c, {attributes:true, attributeFilter:['hidden','style']}); });
    });
  });
  each('.to-q[data-mode]', function(b){
    var seg=document.getElementById(b.getAttribute('data-mode')); if(!seg) return;
    var bs=seg.querySelectorAll('button');
    function sync(){ b.hidden=!on(bs[0]) || !seg.getClientRects().length; }   // hidden too when the page hides its mode switch (e.g. at a level with no questions)
    b.addEventListener('click', function(){ bs[1].click(); bs[1].focus(); });
    if(window.MutationObserver) new MutationObserver(sync).observe(seg, {subtree:true, attributes:true, attributeFilter:['aria-pressed']});
    document.addEventListener('click', function(){ setTimeout(sync, 0); });
    sync(); setTimeout(sync, 0);
  });
})();
</script>
