<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Level and IB Animations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1f5;
    --bg-grid:rgba(29,41,61,0.055);
    --panel:#ffffff;
    --panel-border:#d7dce4;
    --ink:#182233;
    --ink-soft:#4c5668;
    --ink-faint:#8993a5;
    --accent:#d9720c;
    --accent-soft:#fdead2;
    --good:#15803d;
    --good-soft:#dcf5e3;
    --bad:#c0311a;
    --bad-soft:#fbe1db;
    --shadow:0 10px 26px -14px rgba(24,34,51,0.28);

    --forces:#c2560c;      --forces-soft:#fbe4cd;
    --thermal:#c0311a;     --thermal-soft:#fbe1db;
    --matter:#2158d1;      --matter-soft:#dfe8fc;
    --quantum:#6d38d6;     --quantum-soft:#ece4fc;

    --font-display:'Big Shoulders',system-ui,sans-serif;
    --font-body:'IBM Plex Sans',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12161f; --bg-grid:rgba(255,255,255,0.045);
      --panel:#1b212e; --panel-border:#2c3444;
      --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;
      --accent:#ff9a3d; --accent-soft:#3a2712;
      --good:#4ade80; --good-soft:#123321;
      --bad:#f27159; --bad-soft:#3a1712;
      --shadow:0 14px 30px -14px rgba(0,0,0,0.55);
      --forces:#ff9f5c; --forces-soft:#3a2413;
      --thermal:#f27159; --thermal-soft:#3a1712;
      --matter:#7da3ff; --matter-soft:#1a2440;
      --quantum:#b392ff; --quantum-soft:#2a1f45;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12161f; --bg-grid:rgba(255,255,255,0.045);
    --panel:#1b212e; --panel-border:#2c3444;
    --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;
    --accent:#ff9a3d; --accent-soft:#3a2712;
    --good:#4ade80; --good-soft:#123321;
    --bad:#f27159; --bad-soft:#3a1712;
    --shadow:0 14px 30px -14px rgba(0,0,0,0.55);
    --forces:#ff9f5c; --forces-soft:#3a2413;
    --thermal:#f27159; --thermal-soft:#3a1712;
    --matter:#7da3ff; --matter-soft:#1a2440;
      --quantum:#b392ff; --quantum-soft:#2a1f45;
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      linear-gradient(var(--bg-grid) 1px,transparent 1px) 0 0/100% 34px,
      linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px) 0 0/34px 100%,
      var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  .page{max-width:1400px;margin-inline:auto;padding-inline:20px;padding-block:28px 60px;}
  h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:0.2px;text-wrap:balance;margin:0;}
  p{margin:0;line-height:1.55;}

  .page-head{margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid var(--panel-border);}
  .eyebrow{
    font-family:var(--font-mono);font-size:11.5px;letter-spacing:0;
    color:var(--accent);font-weight:600;margin-bottom:6px;
  }
  .page-head h1{font-size:clamp(32px,6vw,44px);color:var(--ink);}

  .anim-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px;}
  .anim-card{
    display:flex;flex-direction:column;gap:6px;padding:16px 18px;border-radius:14px;text-decoration:none;color:var(--ink);
    background:var(--panel);border:1px solid var(--panel-border);border-top:5px solid var(--forces);box-shadow:var(--shadow);
    transition:transform .15s ease-out;
  }
  .anim-card:hover{border-color:var(--forces);}
  .anim-card:focus-visible{outline:3px solid var(--forces);outline-offset:3px;}
  @media (prefers-reduced-motion: no-preference){ .anim-card:hover{transform:translateY(-3px);} }
  .anim-card svg{width:100%;max-width:260px;height:auto;}
  .anim-card{--c:var(--forces);--c-soft:var(--forces-soft);}
  .anim-card[data-cat="matter"]{--c:var(--matter);--c-soft:var(--matter-soft);border-top-color:var(--matter);}
  .anim-card[data-cat="matter"]:hover{border-color:var(--matter);}
  .anim-card[data-cat="quantum"]{--c:var(--quantum);--c-soft:var(--quantum-soft);border-top-color:var(--quantum);}
  .anim-card[data-cat="quantum"]:hover{border-color:var(--quantum);}
  .anim-card h3{font-size:24px;}
  .anim-card p{color:var(--ink-soft);font-size:14.5px;}
  .anim-floor{fill:var(--bg);stroke:var(--ink-faint);stroke-width:2;stroke-linejoin:round;}
  .anim-block{fill:var(--forces-soft);stroke:var(--forces);stroke-width:2;stroke-linejoin:round;}
  .home-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-bottom:4px;font:600 13px var(--font-mono);color:var(--ink-soft);text-decoration:none}
  .home-link:hover{color:var(--accent)}
  .home-link:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
</style>
<script>
  // Visit counter (GoatCounter: no cookies, no personal data). Skipped when a page is embedded in a workout, so a visit counts once.
  (function(){
    if (/[?&]embed\b/.test(location.search) || window.self !== window.top) return;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://gc.zgo.at/count.js';
    s.setAttribute('data-goatcounter', 'https://physics-workout.goatcounter.com/count');
    document.head.appendChild(s);
  })();
</script>
</head>
<body>
<div class="page">
  <a class="home-link" href="../index.html">&larr; Physics Workout</a>
  <header class="page-head">
    <div class="eyebrow">Teaching animations &middot; A Level and IB Physics</div>
    <h1>A Level and IB Animations</h1>
  </header>

  <div class="anim-grid">
    <a class="anim-card" data-cat="quantum" href="photoelectric.html">
      <svg viewBox="0 0 260 70" aria-hidden="true"><rect x="10" y="8" width="110" height="54" rx="16" fill="none" stroke="var(--ink-soft)" stroke-width="2.5"/><path d="M26 18 Q20 35 26 52" fill="none" stroke="var(--ink-faint)" stroke-width="5" stroke-linecap="round"/><line x1="108" y1="22" x2="108" y2="48" stroke="var(--ink-faint)" stroke-width="4" stroke-linecap="round"/><path d="M60 14 q2,-4 4,0 t4,0 t4,0" fill="none" stroke="var(--c)" stroke-width="2"/><circle cx="48" cy="32" r="3.5" fill="var(--c)"/><circle cx="70" cy="40" r="3.5" fill="var(--c)"/><circle cx="90" cy="30" r="3.5" fill="var(--c)"/><path d="M150 62 H250 M200 6 V62" fill="none" stroke="var(--ink-faint)" stroke-width="2"/><path d="M150 62 H168 Q190 22 230 16 L250 15" fill="none" stroke="var(--c)" stroke-width="3"/></svg>
      <h3>Photoelectric Effect</h3>
      <p>Light on a metal plate: threshold frequency, E<sub>max</sub> = hf &minus; &Phi;, and the stopping voltage on the current&ndash;voltage graph (IB E.2).</p>
    </a>
  </div>
</div>
</body>
</html>
