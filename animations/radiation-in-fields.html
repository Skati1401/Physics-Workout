    --bg:#eef1f5; --bg-grid:rgba(29,41,61,0.055);

    --ink:#182233; --ink-soft:#4c5668; --ink-faint:#8993a5;

  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12161f; --bg-grid:rgba(255,255,255,0.045);
      --panel:#1b212e; --panel-border:#2c3444;
      --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;

      --bad:#f27159; --bad-soft:#3a1712;
      --shadow:0 14px 30px -14px rgba(0,0,0,0.55);
      --topic:#a3d65c; --topic-soft:#1f2e12;
      --alpha:#ff7a7a; --beta:#7da3ff; --gamma:#c39bff;
      --lead:#a7aebb; --alu:#7d8592;
      /* solid kit colours */ --glass:#7f97ad; --glass-in:#202938; --thermo:#dfe6ee; --thread:#e5392f; --steel:#8f9db3; --steel-hi:#dfe5ee; --steel-sh:#566179; --wood-f:#8a6a43; --wood-t:#a8855a; --wood-s:#644b2d; --case:#56617a; 
    color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12161f; --bg-grid:rgba(255,255,255,0.045);
    --panel:#1b212e; --panel-border:#2c3444;
    --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;
    --accent:#ff9a3d; --accent-soft:#3a2712;
    --good:#4ade80; --good-soft:#123321;
    --bad:#f27159; --bad-soft:#3a1712;
    --shadow:0 14px 30px -14px rgba(0,0,0,0.55);
    --topic:#a3d65c; --topic-soft:#1f2e12;
    --alpha:#ff7a7a; --beta:#7da3ff; --gamma:#c39bff;

    /* solid kit colours */ --glass:#7f97ad; --glass-in:#202938; --thermo:#dfe6ee; --thread:#e5392f; --steel:#8f9db3; --steel-hi:#dfe5ee; --steel-sh:#566179; --wood-f:#8a6a43; --wood-t:#a8855a; --wood-s:#644b2d; --case:#56617a;

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      linear-gradient(var(--bg-grid) 1px,transparent 1px) 0 0/100% 34px,

  @media (max-width:860px){ .stage{grid-template-columns:minmax(0,1fr);} }
  .view{display:block;width:100%;height:auto;max-height:max(260px,calc(100vh - 300px));}

  .under{display:flex;flex-direction:column;gap:12px;margin-top:12px;}
  .sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px 24px;}
  .side{display:flex;flex-direction:column;gap:12px;min-width:0;}
  .lab{display:block;font:12.5px var(--font-mono);color:var(--ink-soft);margin-bottom:6px;}
  .lab output{color:var(--ink);font-weight:600;white-space:nowrap;margin-left:6px;}
  input[type=range]{width:100%;accent-color:var(--topic);min-height:28px;}
  .seg{display:flex;flex-wrap:wrap;gap:6px;}
  .seg button{font:12.5px var(--font-mono);padding:8px 11px;min-height:44px;border:1px solid var(--panel-border);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer;}
  .seg button[aria-pressed="true"]{background:var(--topic);border-color:var(--topic);color:var(--panel);}
  .seg button:disabled{opacity:.45;cursor:default;}
  .seg.tabs{gap:0;flex-wrap:nowrap;}
  .seg.tabs button{white-space:nowrap;border-radius:0;margin-left:-1px;}
  .seg.tabs button:first-child{border-radius:8px 0 0 8px;margin-left:0;}
  .seg.tabs button:last-child{border-radius:0 8px 8px 0;}
  .cgrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center;}
  .rowlab{font:11.5px var(--font-mono);color:var(--ink-faint);}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px;}
  .stat{border:1px solid var(--panel-border);border-radius:8px;padding:5px 8px;display:flex;flex-direction:column;justify-content:space-between;}
  .stat small{display:block;font:10.5px var(--font-mono);color:var(--ink-faint);}
  .stat strong{font:600 15px var(--font-mono);color:var(--ink);white-space:nowrap;}
  .stat.hi strong{color:var(--topic);}
  .note{font-size:15px;line-height:1.5;color:var(--ink);padding:10px 12px;border-radius:8px;background:var(--bg);min-height:4.6em;}
  .note b{color:var(--topic);} .note b.bad{color:var(--bad);}
  @media (max-height:700px) and (min-width:861px){ .side{gap:9px;} .side .seg:not(.mode) button{min-height:38px;padding-block:5px;} .note{font-size:14px;line-height:1.45;padding:8px 11px;min-height:0;} }
  .ta{color:var(--alpha);font-weight:600;} .tb{color:var(--beta);font-weight:600;} .tg{color:var(--gamma);font-weight:600;}

  details.working summary{cursor:pointer;font:600 13px var(--font-mono);color:var(--topic);min-height:44px;display:flex;align-items:center;}
  .eq{font-family:var(--font-mono);font-size:14px;line-height:1.75;padding:8px 12px;border-left:3px solid var(--topic);background:var(--topic-soft);border-radius:6px;color:var(--ink);}
  .eq b{color:var(--topic);}
  .eq + .eq{margin-top:8px;}
  .eqnote{font-size:13.5px;color:var(--ink-soft);margin-top:8px;}
  .eqg{display:grid;grid-template-columns:auto auto minmax(0,1fr);column-gap:.45em;row-gap:.2em;align-items:center}
  .eqg-l{justify-self:end;text-align:right}
  .eqg-m{justify-self:center}
  .eqg-r{justify-self:start;min-width:0}
  .eqg-full{grid-column:1/-1}
  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1.25;}
  .frac>span{padding:0 .25em;white-space:nowrap;}
  .frac>span:first-child{border-bottom:1.5px solid currentColor;}
  @media (max-width:560px){ .stage{padding:12px;} .view{max-height:none;} .eq{font-size:12px;padding:6px 8px;} .note{font-size:14px;} }

  /* ===== Experiment kit (tools/experiment-kit/kit.css) ===== */
  .exp-btns{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;}
  .rtable{width:100%;border-collapse:collapse;font:12.5px var(--font-mono);}
  .rtable th{position:sticky;top:0;background:var(--panel);font-weight:600;font-size:11px;color:var(--ink-faint);text-align:right;padding:4px 6px;border-bottom:1px solid var(--panel-border);}
  .rtable td{text-align:right;padding:3px 6px;border-bottom:1px solid var(--panel-border);color:var(--ink);}
  .rtable tr.new td{background:var(--cs, var(--accent-soft));}
  .rtable-wrap{max-height:150px;overflow:auto;border:1px solid var(--panel-border);border-radius:8px;}
  @media (prefers-reduced-motion: no-preference){ .rtable tr.new td{animation:rowin .35s ease-out;} }
  @keyframes rowin{from{opacity:0}to{opacity:1}}
  /* ===== end of Experiment kit ===== */

  /* inside a workout tab (?embed): no page heading, no outer margins */
  .embed body{background:transparent;}
  .embed .page{padding:0;max-width:none;display:flow-root;}
  .embed .home-link,.embed .page-head{display:none;}
  .embed .view{max-height:460px;}

  .stage.predict .ex-only{display:none!important;} .stage:not(.predict) .pq-only{display:none!important;}
  .pick{cursor:pointer;} .pick:focus{outline:none;} .pick .ring{stroke:transparent;} .pick:focus-visible .ring{stroke:var(--accent);}
  .pick.locked{cursor:default;}
</style>

<script>
  // Visit counter (GoatCounter: no cookies, no personal data). Skipped when a page is embedded in a workout, so a visit counts once.
  // pwCountTab(tab, label): counts each workout tab once per visit as a GoatCounter event (path "page#tab"), skipped in frames the same way.
  (function(){
    var off = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var seen = {}, queue = [];
    function send(e){ try { window.goatcounter.count(e); } catch (x) {} }
    window.pwCountTab = function(tab, label){
      if (off || !tab || seen[tab]) return;
      seen[tab] = 1;
      var page = (location.pathname.split('/').pop() || 'index').replace(/\.html$/, '');
      var e = { path: page + '#' + tab, title: (label || tab) + ' · ' + document.title, event: true };
      if (window.goatcounter && window.goatcounter.count) send(e); else queue.push(e);
    };
    if (off) return;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://gc.zgo.at/count.js';
    s.setAttribute('data-goatcounter', 'https://physics-workout.goatcounter.com/count');
    s.onload = function(){ var q = queue; queue = []; q.forEach(send); };
    document.head.appendChild(s);
  })();
</script>

<script>
  // Draft tags and Alex's reviewer button (tools/review/drafts.py writes this block; edit tools/review/snippet.html, then run drafts.py sync).
  // A page is Draft while its row in tools/REVIEW.md is not ✅: <meta name="pw-draft"> on the page, data-draft on its list cards.
  // ?reviewer (once, on any page) turns on reviewer mode in this browser; ?reviewer=off turns it off.
  (function(){
    var on = false, embed = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var m = /[?&]reviewer(?:=([^&]*))?/.exec(location.search);
    on = !!m && m[1] !== 'off';
    try {
      if (m) { if (m[1] === 'off') localStorage.removeItem('pw-reviewer'); else localStorage.setItem('pw-reviewer', '1'); }
      else on = localStorage.getItem('pw-reviewer') === '1';
    } catch (e) {}
    var CSS = '.pw-draft{display:inline-block;vertical-align:middle;margin-left:10px;font:600 11.5px/1.4 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:0;color:var(--bad,#b42318);border:1px dashed currentColor;border-radius:5px;padding:1px 7px;white-space:nowrap}'
      + '.act-top .pw-draft{margin-left:auto;flex:none}.act-top .pw-draft~.cp-tag,.act-top .pw-draft~.ta-tag{margin-left:0}'
      + 'a[data-draft]{position:relative}.pw-draft.pw-corner{position:absolute;top:10px;right:10px;margin:0;background:var(--panel,#fff)}'
      + '.pw-check{display:inline-block;vertical-align:middle;margin-left:8px;font:600 13px/1.4 "IBM Plex Sans",system-ui,sans-serif;color:#fff;background:#1a7f37;border-radius:6px;padding:4px 10px;text-decoration:none;white-space:nowrap}'
      + '.pw-check:hover{background:#116329}.pw-check:focus-visible{outline:2px solid #1a7f37;outline-offset:2px}'
      + '.pw-reviewer{position:fixed;left:10px;bottom:10px;z-index:9999;font:500 12px/1.4 "IBM Plex Mono",ui-monospace,monospace;background:#1d2433;color:#fff;border-radius:6px;padding:4px 9px;opacity:.85}'
      + '.pw-reviewer a{color:#ffc83d}';
    function tag(){ var t = document.createElement('span'); t.className = 'pw-draft'; t.title = 'Not yet checked'; t.textContent = 'Draft'; return t; }
    function go(){
      var st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st);
      var meta = document.querySelector('meta[name="pw-draft"]'), h1 = document.querySelector('h1');
      if (meta && h1 && !embed) {
        h1.appendChild(tag());
        if (on) {
          var page = meta.getAttribute('content'), b = document.createElement('a');
          b.className = 'pw-check'; b.target = '_blank'; b.rel = 'noopener'; b.textContent = '✓ Checked';
          b.title = 'Opens a GitHub issue. Submit it and the Draft tag goes in a minute or two.';
          b.href = 'https://github.com/Skati1401/Physics-Workout/issues/new?title=' + encodeURIComponent('Checked: ' + page)
            + '&body=' + encodeURIComponent('Submit this issue to mark `' + page + '` as checked. The Draft tag goes in a minute or two, and the issue closes itself.');
          h1.appendChild(b);
        }
      }
      document.querySelectorAll('a[data-draft]').forEach(function(a){
        if (a.querySelector('.pw-draft')) return;
        var t = tag(), top = a.querySelector('.act-top');
        if (top) top.insertBefore(t, top.querySelector('.cp-tag,.ta-tag'));
        else { t.className += ' pw-corner'; a.appendChild(t); }
      });
      // No tag on a unit or theme heading (Alex, 12 Nov 2026): only the pages and their cards.
      if (on && !embed) {
        // Carry ?reviewer in every link to another page of the site, so reviewer mode survives
        // browsers that clear site storage (school Chromebooks) and pages cached from before.
        var carry = function(a){
          try {
            var u = new URL(a.href, location.href);
            if (u.origin !== location.origin || !/(\.html|\/)$/.test(u.pathname) || u.searchParams.has('reviewer')) return;
            u.searchParams.set('reviewer', ''); a.href = u.href.replace('reviewer=', 'reviewer');
          } catch (e) {}
        };
        document.querySelectorAll('a[href]').forEach(carry);
        ['click', 'auxclick', 'contextmenu'].forEach(function(ev){
          document.addEventListener(ev, function(e){ var a = e.target.closest && e.target.closest('a[href]'); if (a) carry(a); }, true);
        });
        var r = document.createElement('div'); r.className = 'pw-reviewer';
        r.innerHTML = 'Reviewer mode · <a href="' + location.pathname + '?reviewer=off">turn off</a>';
        document.body.appendChild(r);
      }
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
  })();
</script>

<body>
<div class="page" id="page">
  <a class="home-link" href="igcse.html">&larr; IGCSE animations</a>
  <header class="page-head">
    <div>
      <div class="eyebrow">Animations &middot; radioactivity</div>
      <h1>Alpha, Beta and Gamma in Fields</h1>
    </div>
    <div class="seg tabs" id="rf-level" role="group" aria-label="Level"><button type="button" data-v="ks4" aria-pressed="true">IGCSE</button><button type="button" data-v="ial" aria-pressed="false">IAL</button><button type="button" data-v="ib" aria-pressed="false">IB</button></div>
  </header>

  <section class="card stage">
    <div>
      <svg class="view" id="rf-svg" viewBox="0 0 600 300" role="group" aria-label="Alpha, beta and gamma radiation from a source in a lead block pass through a magnetic or electric field. Alpha and beta bend opposite ways; gamma goes straight on. In Questions, the lettered paths are buttons."><g id="rf-main"></g><g id="rf-picks"></g></svg>
      <div class="under">
        <div class="btn-group">
          <button class="btn btn-primary" id="rf-play" type="button">&#9654; Fire</button>
          <button class="btn pq-only" id="rf-newq" type="button">New question</button>
          <button class="btn ex-only" id="rf-reset" type="button">&#8634; Reset</button>
          <button class="btn" id="rf-slow" type="button" aria-pressed="false">Slow motion</button>
          <button class="btn ex-only" id="rf-true" type="button" aria-pressed="false" title="Draw the alpha path at its real curvature (it is drawn 20 times more curved otherwise)">True scale for &alpha;</button>
          <button class="btn to-q" type="button" data-mode="rf-mode" hidden>Try the questions &rarr;</button>
        </div>
        <div class="sliders ex-only">
          <div><label class="lab" for="rf-s"><span id="rf-sl">Magnetic flux density, B</span> <output id="rf-so"></output></label><input type="range" id="rf-s" min="0.02" max="0.3" step="0.01" value="0.1"></div>
        </div>
      </div>

      var topPos = field==='etop';
      for(var ex=FX0+30; ex<FX1; ex+=60){ var y1=topPos?PY0+14:PY1-14, y2=topPos?PY1-14:PY0+14;
        g+=ln(ex, y1, ex, y2, 'var(--ink-faint)', 1, ' stroke-dasharray="2 5"');
        var ay=topPos?y2:y2; g+='<path d="M'+(ex-4)+','+(ay+(topPos?-7:7))+' L'+ex+','+ay+' L'+(ex+4)+','+(ay+(topPos?-7:7))+'" fill="none" stroke="var(--ink-faint)" stroke-width="1.2"/>';
      }
      // the two plates, drawn solid: + red, − blue
      [[PY0-9, topPos], [PY1, !topPos]].forEach(function(pl){
        g+=box(FX0, pl[0], FX1-FX0, 9, 6, -4, pl[1]?'var(--alpha)':'var(--beta)');
        g+=txt(FX1+12, pl[0]+10, pl[1]?'+':'−', {fs:17, w:600, c:pl[1]?'var(--alpha)':'var(--beta)'});
      });
      g+=txt(FX0, 292, (q ? 'electric field between the plates' : sn(V()/1000,0)+' kV across plates 5.5 cm apart'), {fs:11.5, c:'var(--ink)'});
    }
    // source in a lead block with a narrow slit, drawn solid
    g+=box(8, 118, 52, 64, 7, -5, 'var(--lead)');
    g+=rect(22, SRC_Y-5, 38, 10, 'var(--panel)')+rect(22, SRC_Y-5, 38, 2.5, '#000', ' opacity=".25"')+pg([[60,SRC_Y-5],[67,SRC_Y-10],[67,SRC_Y],[60,SRC_Y+5]], 'var(--panel)', ' opacity=".55"');
    g+='<circle cx="27" cy="'+SRC_Y+'" r="4.6" fill="var(--accent)"/>'+txt(37, 104, 'source', {a:'middle', fs:11.5, c:'var(--ink)'});
    g+=txt(34, 198, 'lead block', {a:'middle', fs:11.5});
    g+=txt(FX1, 11, 'in a vacuum', {a:'end', fs:11.5});
    // a question: the beam as far as the field, and the question in clear space under the source
    if(q){
      if(q.kind===1 && !started){ var bc=col(q.rad);
        g+=ln(62, SRC_Y, FX0-9, SRC_Y, bc, 2.6)+pg([[FX0,SRC_Y],[FX0-11,SRC_Y-5],[FX0-11,SRC_Y+5]], bc);
        g+=txt(106, SRC_Y-9, RAD[q.rad].sym, {a:'middle', fs:13, w:600, c:bc, halo:1}); }
      var ql=wrapLines(q.text, 20), yq=222;
      ql.forEach(function(L_, i){ g+=txt(6, yq+i*14.5, L_, {fs:11.5, c:'var(--ink)', w:i?400:600}); });
      if(q.done) g+=txt(6, yq+ql.length*14.5+6, (q.ok?'✓ ':'✗ ')+'It is '+q.ans+'.', {fs:13.5, w:700, c:q.ok?'var(--good)':'var(--bad)'});
    }
    // paths travelled so far, then the particles
    Object.keys(PATHS).forEach(function(k){
      var P=PATHS[k], n=Math.floor(P.reach); if(n<1) return;
      var pts=P.pts.slice(0,n+1).map(function(q_){ return q_[0].toFixed(1)+','+q_[1].toFixed(1); }).join(' ');
      g+='<polyline points="'+pts+'" fill="none" stroke="'+col(k[0])+'" stroke-width="'+(k[0]==='b'&&bps().length>1?1.3:2.2)+'" opacity="0.55"/>';
    });
    parts.forEach(function(p){ var P=PATHS[p.k], xy=at(P,p.s);
      g+='<circle cx="'+xy[0].toFixed(1)+'" cy="'+xy[1].toFixed(1)+'" r="'+(p.k==='a'?4.4:(p.k==='g'?2.8:2.6))+'" fill="'+col(p.k[0])+'"/>';
    });
    // labels at the ends of the finished paths
    function endLabel(k, s){ var P=PATHS[k]; if(!P || P.reach<P.pts.length-1.5) return; var e=P.pts[P.pts.length-1];
      var x=Math.min(588, Math.max(70, e[0]-6)), y=Math.min(282, Math.max(30, e[1]+(e[1]<150?14:-6)));
      if(q && q.kind===2){ var m_=P.pts[Math.max(0, P.pts.length-14)]; x=m_[0]; y=m_[1]+(k==='a' ? -8 : 17); }
      g+=txt(x, y, s, {a:'end', fs:13, w:600, c:col(k[0]), halo:1}); }
    endLabel('a', magnetic() && !trueScale() ? 'α (bend × 20)' : 'α');
    endLabel('g', 'γ');
    endLabel('b'+(bps().length-1), 'β');
    if(running && slowOn()) g+=txt(592, 26, 'slow motion', {a:'end', fs:12, c:'var(--accent)'});
    mainG.innerHTML=g;
    readings();
  }

  // ---- Questions: a question is dealt in the diagram, the student clicks a lettered path, then Go fires the beam.
  // Two kinds, from the 4PH1 charged-particle questions (a shaded field region, the field given in words, and the
  // alpha / beta / gamma paths question): 1 one kind of radiation reaches the field: which way does it go?
  // 2 the three paths are drawn: which one is the alpha (or beta, or gamma)?  The picture stays as dealt.
  var RAD={a:{sym:'α', name:'alpha particles'}, b:{sym:'β⁻', name:'beta particles'}, g:{sym:'γ', name:'gamma rays'}};
  var lastQ='', right=0, tried=0, EX=null;
  function setRad(o){ ['a','b','g'].forEach(function(k){ $('#rf-rad [data-v="'+k+'"]').setAttribute('aria-pressed', String(!!o[k])); }); }
  function dirOf(rad, f){                                   // which way a path bends: 'up', 'down' or 'straight'
    if(rad==='g' || f==='none') return 'straight';
    var aUp = f==='min' || f==='ebot';                      // alpha: up when the field is into the page, or the + plate is below
    return (rad==='a') === aUp ? 'up' : 'down';
  }
  function newQ(){
    var fs=ks5() ? ['min','mout','etop','ebot'] : ['min','mout'], q, key;
    do{ q={kind:Math.random()<0.5?1:2, field:fs[Math.floor(Math.random()*fs.length)], rad:'abg'.charAt(Math.floor(Math.random()*3))}; key=q.kind+q.field+q.rad; } while(key===lastQ);
    lastQ=key; q.pick=null; q.done=false; q.locked=false; Q=q;
    stop(); started=false; t=0; spawn=0; parts=[];
    lastMag=0.1; lastV=200; showField(q.field);
    setRad(q.kind===1 ? (function(){ var o={}; o[q.rad]=1; return o; })() : {a:1, b:1, g:1});
    build();
    if(q.kind===1){
      q.ans={up:'A', straight:'B', down:'C'}[dirOf(q.rad, q.field)];
      q.text='Which way do the '+RAD[q.rad].name+' go in the field? Click A, B or C.';
    } else {
      // letter the three finished paths from the top of the picture down
      var ks=['a','g','b0'].sort(function(m,n){ return endY(m)-endY(n); });
      q.paths={}; ks.forEach(function(k,i){ q.paths['ABC'.charAt(i)]=k; if(k.charAt(0)===q.rad) q.ans='ABC'.charAt(i); });
      q.text='Which path do the '+RAD[q.rad].name+' take? Click A, B or C.';
    }
    drawPicks(); draw();
  }
  function endY(k){ var P=PATHS[k].pts; return P[P.length-1][1]; }
  function pickBody(k, body, lx, ly){
    var q=Q, st = q.done ? (k===q.ans ? 'good' : (k===q.pick ? 'bad' : '')) : (k===q.pick ? 'on' : '');
    var c = st==='good' ? 'var(--good)' : st==='bad' ? 'var(--bad)' : st==='on' ? 'var(--accent)' : 'var(--ink)';
    return '<g class="pick'+(q.locked?' locked':'')+'" data-pick="'+k+'" tabindex="0" role="button" aria-label="Path '+k+(k===q.pick?', your choice':'')+(q.done && k===q.ans?', the right answer':'')+'" style="color:'+c+'">'+body+
      '<circle class="ring" cx="'+f1(lx)+'" cy="'+f1(ly)+'" r="14" fill="none" stroke-width="3"/>'+
      '<circle cx="'+f1(lx)+'" cy="'+f1(ly)+'" r="10.5" fill="'+(st?c:'var(--panel)')+'" stroke="'+c+'" stroke-width="1.6"/>'+
      txt(lx, ly+4.6, k, {a:'middle', fs:13, w:700, c:st?'var(--panel)':'var(--ink)'})+
      (q.done && st ? txt(lx+15, ly+5.5, st==='good'?'✓':'✗', {fs:16, w:700, c:c, halo:1}) : '')+'</g>';
  }
  function drawPicks(){
    var q=MODE==='predict' ? Q : null, g='';
    if(!q){ picksG.innerHTML=''; return; }
    if(q.kind===1){
      // three dashed paths from where the beam meets the field: A curves up, B goes straight on, C curves down
      [['A',-1],['B',0],['C',1]].forEach(function(o){
        var R=190, pts=[], u, th=0, x=FX0, y=SRC_Y;
        for(u=0;u<=150;u+=6){ th=o[1]*u/R; x=FX0+(o[1]?R*Math.sin(u/R):u); y=SRC_Y+o[1]*R*(1-Math.cos(u/R)); pts.push([x,y]); }
        var c=Math.cos(th), sn_=Math.sin(th);
        var body='<polyline points="'+pts.map(function(p){ return f1(p[0])+','+f1(p[1]); }).join(' ')+'" fill="none" stroke="transparent" stroke-width="18"/>'+
          '<polyline points="'+pts.map(function(p){ return f1(p[0])+','+f1(p[1]); }).join(' ')+'" fill="none" stroke="currentColor" stroke-width="2.2" stroke-dasharray="7 5" opacity="'+(q.locked?0.45:1)+'"/>'+
          '<path d="M'+f1(x+c*11)+','+f1(y+sn_*11)+' L'+f1(x-sn_*5.5)+','+f1(y+c*5.5)+' L'+f1(x+sn_*5.5)+','+f1(y-c*5.5)+' z" fill="currentColor" opacity="'+(q.locked?0.45:1)+'"/>';
        g+=pickBody(o[0], body, x+c*27, y+sn_*27);
      });
    } else {
      // where each letter goes: just past the end of its path, moved apart when two paths end close together
      var pos=['A','B','C'].map(function(L_){ var P=PATHS[q.paths[L_]].pts, e=P[P.length-1];
        var lx=e[0]+16, ly=Math.max(28, Math.min(274, e[1]));
        if(e[1]<20 || e[1]>280) lx=e[0]+22;
        return {L:L_, e:e, lx:Math.min(580, lx), ly:ly}; });
      for(var pass=0; pass<4; pass++) for(var i=1;i<3;i++){ var a=pos[i-1], b=pos[i];
        if(Math.abs(a.lx-b.lx)<28 && b.ly-a.ly<27){ var mid=(a.ly+b.ly)/2; a.ly=mid-13.5; b.ly=mid+13.5; } }
      pos.forEach(function(o){ o.ly=Math.max(16, Math.min(284, o.ly)); });
      pos.forEach(function(o){
        var L_=o.L, P=PATHS[q.paths[L_]].pts, e=o.e, str=P.map(function(p){ return f1(p[0])+','+f1(p[1]); }).join(' '), lx=o.lx, ly=o.ly;
        var body='<polyline points="'+str+'" fill="none" stroke="transparent" stroke-width="16"/>'+
          '<polyline points="'+str+'" fill="none" stroke="'+(q.pick===L_ || (q.done && q.ans===L_) ? 'currentColor' : 'var(--ink-soft)')+'" stroke-width="'+(q.pick===L_?3:2)+'" opacity="'+(q.locked?0.3:1)+'"/>'+
          (Math.abs(ly-e[1])>3 ? ln(e[0], e[1], lx-9, ly, 'var(--ink-faint)', 1) : '');
        g+=pickBody(L_, body, lx, ly);
      });
    }
    setKeepFocus(picksG, g);
  }
  onPick(svg, function(k){ if(MODE!=='predict' || !Q || Q.locked) return; Q.pick=k; drawPicks(); draw(); });
  function explain(q){
    var d=dirOf(q.rad, q.field), mag=q.field==='min'||q.field==='mout', e;
    var A='<span class="ta">Alpha</span>', Bt='<span class="tb">Beta</span>', G='<span class="tg">Gamma</span>';
    if(q.kind===1){
      if(q.rad==='g') e=G+' rays have no charge, so the field puts no force on them: they go <b>straight on</b>.';
      else if(mag) e = q.rad==='a' ? A+' particles are positive, so they are a current in the direction they move. Fleming’s left-hand rule gives a force <b>'+d+'</b> the page.'
                                 : Bt+' particles are negative, so they are a current the opposite way to their motion. Fleming’s left-hand rule gives a force <b>'+d+'</b> the page, the opposite way to alpha.';
      else e = q.rad==='a' ? A+' particles are positive, so they are pulled towards the − plate: they bend <b>'+d+'</b>.' : Bt+' particles are negative, so they are pulled towards the + plate: they bend <b>'+d+'</b>.';
    } else {
      e=G+' has no charge, so its path is the straight one. '+A+' and '+Bt.toLowerCase().replace('beta','beta')+' have opposite charges, so they bend opposite ways: alpha '+dirOf('a',q.field)+', beta '+dirOf('b',q.field)+' ('+(mag?'Fleming’s left-hand rule':'alpha towards the − plate, beta towards the + plate')+'). Beta is far lighter, so its path curves much more.';
    }
    return e;
  }

  var lastNote='';
  function readings(){
    var mag=magnetic(), ele=electric();
    $('#rf-so').textContent = mag ? B().toFixed(2)+' T' : (ele ? sn(V()/1000,0)+' kV' : '');
    if(!ks5()) $('#rf-so').textContent = '';
    var aDir='straight', bDir='straight';
    if(mag){ aDir = field==='min' ? 'up' : 'down'; bDir = field==='min' ? 'down' : 'up'; }
    if(ele){ aDir = field==='etop' ? 'down' : 'up'; bDir = field==='etop' ? 'up' : 'down'; }
    if(ele && V()===0){ aDir='straight'; bDir='straight'; }
    $('#rf-sa').textContent = on('a') ? aDir : '–';
    $('#rf-sb').textContent = on('b') ? bDir : '–';
    $('#rf-sg').textContent = on('g') ? 'straight' : '–';
    $('#rf-sfl').textContent = mag ? 'B' : (ele ? 'E' : 'Field');
    $('#rf-sf').textContent = mag ? B().toFixed(2)+' T' : (ele ? (Ef()/1e6).toFixed(2)+' MV/m' : 'none');
    if(!ks5()){ $('#rf-sfl').textContent='Field'; $('#rf-sf').textContent = mag ? (field==='min'?'into page':'out of page') : (ele ? (field==='etop'?'+ on top':'+ below') : 'none'); }

    var w1='', w2='', w3='';
    if(mag){
      var rA=A_P/(B()*A_Q), rB=B_TYP/(B()*E);
      w1='r = [[p|BQ]]<br>α: r = [['+sci(A_P,3)+'|'+B().toFixed(2)+' × '+sci(A_Q,2)+']]<br>α: r = <b>'+sig(rA,3)+' m</b>';
      w2='β with p = '+sci(B_TYP,2)+' kg m s⁻¹:<br>r = [['+sci(B_TYP,2)+'|'+B().toFixed(2)+' × '+sci(E,2)+']]<br>r = <b>'+sig(rB,3)+' m</b>';
      w3='The α path is about '+Math.round(rA/rB)+' times less curved than this β path: α has a much bigger momentum. '+(trueScale()?'':'The α path is drawn 20 times more curved than it really is, so you can see which way it bends. ')+'β particles have a range of energies, so they spread into a fan: the slowest bend most. The force is at right angles to the motion, so it never changes the speed.';
    } else if(ele){
      var e=Ef();
      w1='E = [[V|d]]<br>E = [['+grp(V())+'|'+PLATE_D.toFixed(3)+']]<br>E = <b>'+sci(e,3)+' V m⁻¹</b>';
      w2='F = EQ<br>α: F = '+sci(e,3)+' × '+sci(A_Q,2)+' = <b>'+sci(e*A_Q,3)+' N</b><br>β: F = '+sci(e,3)+' × '+sci(E,2)+' = <b>'+sci(e*E,3)+' N</b>';
      w3='The force on α is twice the force on β, but α has about 7300 times the mass and far more momentum, so it bends less. α is attracted to the − plate and β to the + plate. Slow β particles bend so much that they hit the plate.';
    } else {
      w1='No field, so no force on any of them: all three go straight on.';
    }
    if(!ks5()){
      if(mag||ele){
        w1='α: charge +2, mass 4 (a helium nucleus)<br>β⁻: charge −1, mass about [[1|1840]] (an electron)<br>γ: no charge, no mass (an electromagnetic wave)';
        w2='';
        w3='Opposite charges, so α and β bend opposite ways. β is much lighter, so it bends much more than α'+(mag?' (the α path here is drawn 20 times more curved than it really is, so you can see which way it goes)':'')+'. γ has no charge, so the field has no effect on it.';
      } else { w1='No field, so no force on any of them: all three go straight on.'; w2=''; w3=''; }
    } else w3+=(w3?' ':'')+'On screen every particle moves at the same speed; really β particles are about 15 times faster than α.';
    $('#rf-eq1').innerHTML=FR(w1); $('#rf-eq2').innerHTML=FR(w2); $('#rf-eq2').hidden=!w2; $('#rf-eq3').textContent=w3;

    var note;
    if(MODE==='predict' && Q){
      var q=Q, sc=tried ? ' <b>'+right+' of '+tried+' right.</b>' : '';
      if(q.done) note=(q.ok ? '<b>Right: '+q.ans+'.</b> ' : '<b class="bad">Not quite: it is '+q.ans+'.</b> ')+explain(q)+sc+' Press <b>New question</b>.';
      else if(running) note='Watch where the radiation goes in the field.';
      else if(q.pick) note=q.text.replace(' Click A, B or C.','')+' You chose <b>'+q.pick+'</b>. Press <b>Go</b> to fire the beam, or click another path.';
      else note='<b>'+q.text.replace(' Click A, B or C.','')+'</b> Click one of the lettered paths in the picture, then press <b>Go</b>.'+(q.kind===2 && magnetic() ? ' (The alpha path is drawn 20 times more curved than it really is.)' : '');
      if(note!==lastNote){ $('#rf-note').innerHTML=note; lastNote=note; }
      playBtn.innerHTML = running ? '&#10074;&#10074; Pause' : '&#9654; Go';
      playBtn.disabled = !q.pick || q.done;
      return;
    }
    playBtn.disabled=false;
    if(!on('a')&&!on('b')&&!on('g')) note='Choose at least one kind of radiation.';
    else if(!started) note='The source is in a lead block with a narrow slit, so the radiation comes out as a thin beam. Choose a field and press <b>Fire</b>.';
    else if(mag) note='Moving charges in a magnetic field feel a force at right angles to their motion (Fleming’s left-hand rule; β⁻ is a current the opposite way). <span class="ta">α</span> (+2e) bends '+aDir+', <span class="tb">β</span> (−e) bends '+bDir+'. <span class="tg">γ</span> has no charge, so it goes straight on.';
    else if(ele) note=V()===0?'No voltage, so no field between the plates: nothing bends.':'The electric field pushes positive charges towards the − plate: <span class="ta">α</span> bends '+aDir+'. <span class="tb">β</span> is negative, so it bends '+bDir+', towards the + plate. <span class="tg">γ</span> has no charge and goes straight on.';
    else note='No field: alpha, beta and gamma all go straight on, so you cannot tell them apart this way.';
    if(started && !running && t>0) note=(t>=emitT() && !parts.length ? 'Done. ' : 'Paused. ')+note;
    if(note!==lastNote){ $('#rf-note').innerHTML=note; lastNote=note; }
    playBtn.innerHTML = running ? '&#10074;&#10074; Pause' : (started && t>=emitT() && !parts.length ? '&#8634; Fire again' : (started ? '&#9654; Play' : '&#9654; Fire'));
  }

  function stop(){ running=false; cancelAnimationFrame(raf); }
  function frame(now){
    if(!running) return;
    var real=Math.min(0.05,(now-last)/1000); last=now;
    if(step(real*(slowOn()?0.3:1))){ stop(); if(MODE==='predict' && Q && !Q.done){ Q.done=true; Q.ok=Q.pick===Q.ans; tried++; if(Q.ok) right++; drawPicks(); } }
    draw(); if(running) raf=requestAnimationFrame(frame);
  }
  function run(){
    if(started && t>=emitT() && !parts.length){ t=0; spawn=0; }
    if(MODE==='predict' && Q){ if(!Q.pick || Q.done) return; if(!Q.locked){ Q.locked=true; drawPicks(); } }
    started=true; running=true; last=performance.now(); raf=requestAnimationFrame(frame); draw();
  }
  function reset(){ if(MODE==='predict'){ newQ(); return; } stop(); started=false; t=0; spawn=0; parts=[]; build(); drawPicks(); draw(); }

  playBtn.addEventListener('click', function(){ if(running){ stop(); draw(); } else run(); });
  slowBtn.addEventListener('click', function(){ slowBtn.setAttribute('aria-pressed', String(!slowOn())); draw(); });
  trueBtn.addEventListener('click', function(){ trueBtn.setAttribute('aria-pressed', String(!trueScale())); var keep=started; reset(); });
  $('#rf-reset').addEventListener('click', reset);
  // changing the field strength redraws the paths straight away (the stream carries on along the new paths)
  sIn.addEventListener('input', function(){
    if(magnetic()) lastMag=+sIn.value; else lastV=+sIn.value;
    var reach={}; Object.keys(PATHS).forEach(function(k){ reach[k]=PATHS[k].reach; });
    build(); parts=parts.filter(function(p){ return PATHS[p.k] && p.s<PATHS[p.k].pts.length-1; });
    Object.keys(PATHS).forEach(function(k){ PATHS[k].reach=Math.min(reach[k]||0, PATHS[k].pts.length-1); });
    draw();
  });

  levelSeg=segGroup($('#rf-level'), function(){ setupSlider(); reset(); });
  var modeSeg=segGroup($('#rf-mode'), function(v){ setMode(v); });
  function setMode(v){
    if(v===MODE) return;
    if(v==='predict') EX={field:field, mag:lastMag, volt:lastV, rad:{a:on('a'), b:on('b'), g:on('g')}};
    MODE=v; $('.stage').classList.toggle('predict', v==='predict');
    if(v==='predict'){ right=0; tried=0; newQ(); }
    else { Q=null; lastNote=''; if(EX){ setRad(EX.rad); lastMag=EX.mag; lastV=EX.volt; showField(EX.field); } reset(); }
  }
  $('#rf-newq').addEventListener('click', newQ);
  watchEquals($('#rf-eq1')); watchEquals($('#rf-eq2'));
  if(PW_LEVEL==='ial'||PW_LEVEL==='ib') levelSeg.pick(PW_LEVEL);   // IAL and IB show the same deeper view
  setupSlider(); reset();
  if(/[?&]show=predict\b/.test(location.search)){ modeSeg.pick('predict'); setMode('predict'); }
})();
</script><script id="choice-kit-js">
/* Choice kit (12 Nov 2026): the same block on every animation page. See tools/ANIMATION-STYLE.md, "Choices".
   A group of choices with one chosen gets a track round it (class pick); a .to-q button opens the questions from Explore. */
(function(){
  function on(b){ return b.getAttribute('aria-pressed')==='true' || b.classList.contains('is-on'); }
  function each(sel, fn){ Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }
  function mark(s){
    if(!s.classList.contains('pick')){
      var n=0; Array.prototype.forEach.call(s.children, function(b){ if(b.tagName==='BUTTON' && on(b)) n++; });
      if(n===1) s.classList.add('pick');
    }
    if(s.classList.contains('pick') && !s.hasAttribute('data-fit')){
      var d=getComputedStyle(s).display;
      if(d!=='none'){ s.setAttribute('data-fit','1'); if(d.indexOf('flex')>=0) s.classList.add('fit'); }
    }
  }
  each('.seg:not(.tabs):not(.mode):not(.apps)', function(s){
    mark(s);
    if(window.MutationObserver) new MutationObserver(function(){ mark(s); }).observe(s, {childList:true, subtree:true, attributes:true, attributeFilter:['aria-pressed','class']});
  });
  // Choice rows: wrap each .rowlab and the control after it in a .cgroup (label above, groups side by side).
  // A group is hidden when everything in it is hidden, so pages that hide a row's label and control still work.
  function shown(e){ return !e.hidden && e.style.display!=='none'; }
  each('.cgrid:not(.kit)', function(g){
    var kids=Array.prototype.slice.call(g.children), groups=[];
    for(var i=0;i<kids.length;i++){
      var w=document.createElement('div'); w.className='cgroup';
      g.insertBefore(w, kids[i]); w.appendChild(kids[i]);
      if(kids[i].classList.contains('rowlab') && kids[i+1]){ w.appendChild(kids[i+1]); i++; }
      groups.push(w);
    }
    g.classList.add('kit'); if(groups.length===1) g.classList.add('one');
    groups.forEach(function(w){
      function sync(){ var any=false; Array.prototype.forEach.call(w.children, function(c){ if(shown(c)) any=true; }); w.hidden=!any; }
      sync();
      if(window.MutationObserver) Array.prototype.forEach.call(w.children, function(c){ new MutationObserver(sync).observe(c, {attributes:true, attributeFilter:['hidden','style']}); });
    });
  });
  each('.to-q[data-mode]', function(b){
    var seg=document.getElementById(b.getAttribute('data-mode')); if(!seg) return;
    var bs=seg.querySelectorAll('button');
    function sync(){ b.hidden=!on(bs[0]) || !seg.getClientRects().length; }   // hidden too when the page hides its mode switch (e.g. at a level with no questions)
    b.addEventListener('click', function(){ bs[1].click(); bs[1].focus(); });
    if(window.MutationObserver) new MutationObserver(sync).observe(seg, {subtree:true, attributes:true, attributeFilter:['aria-pressed']});
    document.addEventListener('click', function(){ setTimeout(sync, 0); });
    sync(); setTimeout(sync, 0);
  });
})();
</script>
