<style>

    --steel:#66748c; --steel-hi:#c3ccda; --steel-sh:#3f4a5e; --wood-f:#c99e6a; --wood-t:#e3c08f; --wood-s:#9c7444; --brass:#c9a13b; --brass-hi:#f0d78a; --copper:#b8651b; --copper-hi:#e6a25c;

  @media (prefers-color-scheme: dark){

      --panel:#1b212e; --panel-border:#2c3444;
      --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;

      --steel:#8f9db3; --steel-hi:#dfe5ee; --steel-sh:#566179; --wood-f:#8a6a43; --wood-t:#a8855a; --wood-s:#644b2d; --brass:#b8943a; --brass-hi:#e8cf86; --copper:#f0a35e; --copper-hi:#ffd0a0;

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      linear-gradient(var(--bg-grid) 1px,transparent 1px) 0 0/100% 34px,
      linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px) 0 0/34px 100%,
      var(--bg);
    color:var(--ink); font-family:var(--font-body); font-size:14px; -webkit-font-smoothing:antialiased;
  }
  [hidden]{display:none!important;}
  button{font:inherit;color:inherit;}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;}

  .page{max-width:1400px;margin-inline:auto;padding-inline:20px;padding-block:12px 40px;}
  h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:0.2px;text-wrap:balance;margin:0;}
  p{margin:0;line-height:1.55;}

  .home-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-bottom:4px;font:600 13px var(--font-mono);color:var(--ink-soft);text-decoration:none;}
  .home-link:hover{color:var(--accent);}
  .page-head{margin-bottom:12px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px;}
  .eyebrow{font-family:var(--font-mono);font-size:11.5px;color:var(--accent);font-weight:600;margin-bottom:6px;}
  .page-head h1{font-size:clamp(28px,5vw,38px);color:var(--ink);}

  .card{background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;box-shadow:var(--shadow);}
  .btn{
    font-family:var(--font-body);font-weight:600;font-size:13.5px;color:var(--ink);
    background:var(--panel);border:1px solid var(--panel-border);border-radius:9px;
    padding:9px 15px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  }
  .btn:hover{border-color:var(--ink-faint);}
  .btn:disabled{opacity:.45;cursor:default;}
  .btn-primary{background:var(--ink);border-color:var(--ink);color:var(--bg);}
  .btn-primary:hover{opacity:.88;border-color:var(--ink);}
  .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);}
  .btn-group{display:flex;flex-wrap:wrap;gap:10px;}
  /* button rows fill their width (Alex, 2 Nov 2026) */
  .btn-group>.btn,.exp-btns>.btn{flex:1 1 0;min-width:max-content;justify-content:center;}
  .seg:not(.tabs){display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,96px),1fr));}
  .seg:not(.tabs)>button{padding-inline:4px;white-space:nowrap;}

  /* picture on the left with its buttons under it; choices, readings and working on the right */
  .stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,410px);gap:18px 24px;align-items:start;padding:18px;}
  @media (max-width:860px){ .stage{grid-template-columns:minmax(0,1fr);} }
  .view{display:block;width:100%;height:auto;max-height:max(260px,calc(100vh - 335px));touch-action:pan-y;}
  .view.tall,.embed .view.tall{max-height:none;}
  .view text{font-family:var(--font-mono);}
  .under{display:flex;flex-direction:column;gap:12px;margin-top:12px;}
  .sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px 24px;}
  .side{display:flex;flex-direction:column;gap:12px;min-width:0;}
  .lab{display:block;font:12.5px var(--font-mono);color:var(--ink-soft);margin-bottom:6px;}
  .lab output{color:var(--ink);font-weight:600;white-space:nowrap;margin-left:6px;}
  input[type=range]{width:100%;accent-color:var(--topic);min-height:28px;}
  .seg{display:flex;flex-wrap:wrap;gap:6px;}
  .seg button{font:12.5px var(--font-mono);padding:8px 11px;min-height:44px;border:1px solid var(--panel-border);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer;}
  .seg button[aria-pressed="true"]{background:var(--topic);border-color:var(--topic);color:var(--panel);}
  .seg button:disabled{opacity:.45;cursor:default;}
  .seg.tabs{gap:0;flex-wrap:nowrap;}
  .seg.tabs button{white-space:nowrap;border-radius:0;margin-left:-1px;}
  .seg.tabs button:first-child{border-radius:8px 0 0 8px;margin-left:0;}
  .seg.tabs button:last-child{border-radius:0 8px 8px 0;}
  .cgrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center;}
  .rowlab{font:11.5px var(--font-mono);color:var(--ink-faint);}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px;}
  .stat{border:1px solid var(--panel-border);border-radius:8px;padding:5px 8px;display:flex;flex-direction:column;justify-content:space-between;}
  .stat small{display:block;font:10.5px var(--font-mono);color:var(--ink-faint);}
  .stat strong{font:600 15px var(--font-mono);color:var(--ink);white-space:nowrap;}
  .stat.hi strong{color:var(--topic);}
  .note{font-size:15px;line-height:1.5;color:var(--ink);padding:10px 12px;border-radius:8px;background:var(--bg);min-height:4.6em;}

  details.working summary{cursor:pointer;font:600 13px var(--font-mono);color:var(--topic);min-height:44px;display:flex;align-items:center;}
  .eq{font-family:var(--font-mono);font-size:14px;line-height:1.75;padding:8px 12px;border-left:3px solid var(--topic);background:var(--topic-soft);border-radius:6px;color:var(--ink);}
  .eq b{color:var(--topic);}
  .eq + .eq{margin-top:8px;}
  .eqnote{font-size:13.5px;color:var(--ink-soft);margin-top:8px;}
  .eqg{display:grid;grid-template-columns:auto auto minmax(0,1fr);column-gap:.45em;row-gap:.2em;align-items:center}
  .eqg-l{justify-self:end;text-align:right}
  .eqg-m{justify-self:center}
  .eqg-r{justify-self:start;min-width:0}
  .eqg-full{grid-column:1/-1}
  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1.25;}
  .frac>span{padding:0 .25em;white-space:nowrap;}
  .frac>span:first-child{border-bottom:1.5px solid currentColor;}
  @media (max-width:560px){ .stage{padding:12px;} .view{max-height:none;} .eq{font-size:12px;padding:6px 8px;} .note{font-size:14px;} }

  /* ===== Experiment kit (tools/experiment-kit/kit.css) ===== */
  .exp-btns{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;}
  .view.dragging,.view.dragging *{cursor:grabbing;}

  .rtable{width:100%;border-collapse:collapse;font:12.5px var(--font-mono);}
  .rtable th{position:sticky;top:0;background:var(--panel);font-weight:600;font-size:11px;color:var(--ink-faint);text-align:right;padding:4px 6px;border-bottom:1px solid var(--panel-border);}

  .guess-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
  .guess-row input{width:110px;min-height:44px;font:600 15px var(--font-mono);padding:6px 8px;border:1px solid var(--panel-border);border-radius:8px;background:var(--panel);color:var(--ink);}
  .guess-row .unit{font:13px var(--font-mono);color:var(--ink-soft);}
  .gfb{font-size:14px;margin-top:6px;min-height:1.4em;}
  .gfb.ok{color:var(--good);font-weight:600;} .gfb.no{color:var(--bad);font-weight:600;}
  .seg button sub,.stat sub{font-size:.75em;}
  .cgrid>[hidden]{display:none!important;}

  #sp-pre,#sp-jump{display:flex;flex-wrap:nowrap;}
  #sp-pre>button,#sp-jump>button{flex:1 1 auto;padding-inline:6px;}
  @media (max-width:560px){ #sp-pre,#sp-jump{flex-wrap:wrap;} }
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{display:inline-flex;align-items:center;gap:8px;flex:1 1 auto;min-height:44px;padding:6px 12px;border:1px dashed var(--ink-faint);border-radius:8px;background:var(--panel);color:var(--ink);font:12.5px var(--font-mono);cursor:grab;touch-action:none;user-select:none;}
  .chip[aria-pressed="true"]{border-style:solid;border-color:var(--topic);background:var(--topic-soft);}
  .chip-m{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.8px solid var(--ink);font-weight:700;font-size:12px;}
  .ghost{position:fixed;left:0;top:0;z-index:20;pointer-events:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);background:var(--panel);display:grid;place-items:center;font:700 14px var(--font-mono);color:var(--ink);box-shadow:var(--shadow);}
  #sp-sliders{grid-template-columns:repeat(auto-fit,minmax(min(100%,132px),1fr));column-gap:14px;}

  /* the places a meter can go, on the circuit diagram */
  .pick{cursor:pointer;}
  .pick:focus{outline:none;}
  .pick:focus-visible .ring{stroke:var(--accent);stroke-width:3;}
  .toprow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;}
  @media (max-height:640px) and (min-width:861px){ .seg button,.chip{min-height:38px;} .side{gap:9px;} .note{min-height:0;} }

  /* inside a workout tab (?embed): no page heading, no outer margins */
  .embed body{background:transparent;}
  .embed .page{padding:0;max-width:none;display:flow-root;}
  .embed .home-link,.embed .page-head{display:none;}
  .embed .view{max-height:460px;}

<script>
  // Visit counter (GoatCounter: no cookies, no personal data). Skipped when a page is embedded in a workout, so a visit counts once.
  // pwCountTab(tab, label): counts each workout tab once per visit as a GoatCounter event (path "page#tab"), skipped in frames the same way.
  (function(){
    var off = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var seen = {}, queue = [];
    function send(e){ try { window.goatcounter.count(e); } catch (x) {} }
    window.pwCountTab = function(tab, label){
      if (off || !tab || seen[tab]) return;
      seen[tab] = 1;
      var page = (location.pathname.split('/').pop() || 'index').replace(/\.html$/, '');
      var e = { path: page + '#' + tab, title: (label || tab) + ' · ' + document.title, event: true };
      if (window.goatcounter && window.goatcounter.count) send(e); else queue.push(e);
    };
    if (off) return;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://gc.zgo.at/count.js';
    s.setAttribute('data-goatcounter', 'https://physics-workout.goatcounter.com/count');
    s.onload = function(){ var q = queue; queue = []; q.forEach(send); };
    document.head.appendChild(s);
  })();
</script>

<script>
  // Draft tags and Alex's reviewer button (tools/review/drafts.py writes this block; edit tools/review/snippet.html, then run drafts.py sync).
  // A page is Draft while its row in tools/REVIEW.md is not ✅: <meta name="pw-draft"> on the page, data-draft on its list cards.
  // ?reviewer (once, on any page) turns on reviewer mode in this browser; ?reviewer=off turns it off.
  (function(){
    var on = false, embed = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var m = /[?&]reviewer(?:=([^&]*))?/.exec(location.search);
    on = !!m && m[1] !== 'off';
    try {
      if (m) { if (m[1] === 'off') localStorage.removeItem('pw-reviewer'); else localStorage.setItem('pw-reviewer', '1'); }
      else on = localStorage.getItem('pw-reviewer') === '1';
    } catch (e) {}
    var CSS = '.pw-draft{display:inline-block;vertical-align:middle;margin-left:10px;font:600 11.5px/1.4 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:0;color:var(--bad,#b42318);border:1px dashed currentColor;border-radius:5px;padding:1px 7px;white-space:nowrap}'
      + '.act-top .pw-draft{margin-left:auto;flex:none}.act-top .pw-draft~.cp-tag,.act-top .pw-draft~.ta-tag{margin-left:0}'
      + 'a[data-draft]{position:relative}.pw-draft.pw-corner{position:absolute;top:10px;right:10px;margin:0;background:var(--panel,#fff)}'
      + 'summary .pw-draft{margin-left:0;flex:none}'
      + '.pw-check{display:inline-block;vertical-align:middle;margin-left:8px;font:600 13px/1.4 "IBM Plex Sans",system-ui,sans-serif;color:#fff;background:#1a7f37;border-radius:6px;padding:4px 10px;text-decoration:none;white-space:nowrap}'
      + '.pw-check:hover{background:#116329}.pw-check:focus-visible{outline:2px solid #1a7f37;outline-offset:2px}'
      + '.pw-reviewer{position:fixed;left:10px;bottom:10px;z-index:9999;font:500 12px/1.4 "IBM Plex Mono",ui-monospace,monospace;background:#1d2433;color:#fff;border-radius:6px;padding:4px 9px;opacity:.85}'
      + '.pw-reviewer a{color:#ffc83d}';
    function tag(){ var t = document.createElement('span'); t.className = 'pw-draft'; t.title = 'Not yet checked'; t.textContent = 'Draft'; return t; }
    function go(){
      var st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st);
      var meta = document.querySelector('meta[name="pw-draft"]'), h1 = document.querySelector('h1');
      if (meta && h1 && !embed) {
        h1.appendChild(tag());
        if (on) {
          var page = meta.getAttribute('content'), b = document.createElement('a');
          b.className = 'pw-check'; b.target = '_blank'; b.rel = 'noopener'; b.textContent = '✓ Checked';
          b.title = 'Opens a GitHub issue. Submit it and the Draft tag goes in a minute or two.';
          b.href = 'https://github.com/Skati1401/Physics-Workout/issues/new?title=' + encodeURIComponent('Checked: ' + page)
            + '&body=' + encodeURIComponent('Submit this issue to mark `' + page + '` as checked. The Draft tag goes in a minute or two, and the issue closes itself.');
          h1.appendChild(b);
        }
      }
      document.querySelectorAll('a[data-draft]').forEach(function(a){
        if (a.querySelector('.pw-draft')) return;
        var t = tag(), top = a.querySelector('.act-top');
        if (top) top.insertBefore(t, top.querySelector('.cp-tag,.ta-tag'));
        else { t.className += ' pw-corner'; a.appendChild(t); }
      });
      document.querySelectorAll('details.unit').forEach(function(d){
        var s = d.querySelector('summary');
        if (!s || s.querySelector('.pw-draft') || !d.querySelector('a[data-draft]')) return;
        var h2 = s.querySelector('h2'); if (h2) h2.parentNode.insertBefore(tag(), h2.nextSibling); else s.appendChild(tag());
      });
      if (on && !embed) {
        // Carry ?reviewer in every link to another page of the site, so reviewer mode survives
        // browsers that clear site storage (school Chromebooks) and pages cached from before.
        var carry = function(a){
          try {
            var u = new URL(a.href, location.href);
            if (u.origin !== location.origin || !/(\.html|\/)$/.test(u.pathname) || u.searchParams.has('reviewer')) return;
            u.searchParams.set('reviewer', ''); a.href = u.href.replace('reviewer=', 'reviewer');
          } catch (e) {}
        };
        document.querySelectorAll('a[href]').forEach(carry);
        ['click', 'auxclick', 'contextmenu'].forEach(function(ev){
          document.addEventListener(ev, function(e){ var a = e.target.closest && e.target.closest('a[href]'); if (a) carry(a); }, true);
        });
        var r = document.createElement('div'); r.className = 'pw-reviewer';
        r.innerHTML = 'Reviewer mode · <a href="' + location.pathname + '?reviewer=off">turn off</a>';
        document.body.appendChild(r);
      }
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
  })();
</script>

<body>
<div class="page" id="page">
  <a class="home-link" href="igcse.html">&larr; IGCSE animations</a>
  <header class="page-head">
    <div>
      <div class="eyebrow" id="sp-eye">Animations &middot; electricity</div>
      <h1>Series and Parallel Circuits</h1>
    </div>
    <div class="seg tabs" id="sp-level" role="group" aria-label="Level"><button type="button" data-v="igcse" aria-pressed="true">IGCSE</button><button type="button" data-v="ial" aria-pressed="false">IAL</button><button type="button" data-v="ib" aria-pressed="false">IB</button></div>
  </header>

  <section class="card stage">
    <div>
      <svg class="view" id="sp-svg" viewBox="0 0 860 350" aria-label="A circuit built on the bench with a power supply and resistors, beside its circuit diagram. Dashed circles on the diagram are places where an ammeter or a voltmeter can go"></svg>
      <div class="under">
        <div class="btn-group">
          <button class="btn btn-primary" id="sp-play" type="button">&#9654; Play</button>
          <button class="btn" id="sp-new" type="button" hidden>New task</button>
          <button class="btn" id="sp-reset" type="button">&#8634; Reset</button>
          <button class="btn" id="sp-slow" type="button" aria-pressed="false">Slow motion</button>
        </div>
        <div class="sliders" id="sp-sliders">
          <div><label class="lab" for="sp-v">Supply<output id="sp-vo"></output></label><input type="range" id="sp-v" min="1" max="12" step="0.5" value="10"></div>
          <div><label class="lab" for="sp-r1">R<sub>1</sub><output id="sp-r1o"></output></label><input type="range" id="sp-r1" min="1" max="50" step="1" value="5"></div>
          <div><label class="lab" for="sp-r2">R<sub>2</sub><output id="sp-r2o"></output></label><input type="range" id="sp-r2" min="1" max="50" step="1" value="5"></div>
          <div id="sp-r3box"><label class="lab" for="sp-r3">R<sub>3</sub><output id="sp-r3o"></output></label><input type="range" id="sp-r3" min="1" max="50" step="1" value="10"></div>
          <div id="sp-rvbox"><label class="lab" for="sp-rv">Voltmeter, R<sub>V</sub><output id="sp-rvo"></output></label><input type="range" id="sp-rv" min="1" max="6" step="0.05" value="1.3"></div>
        </div>
      </div>
    </div>
    <div class="side">
      <div class="toprow">
        <div class="seg tabs" id="sp-tab" role="group" aria-label="Explore or build"><button type="button" data-v="explore" aria-pressed="true">Explore</button><button type="button" data-v="build" aria-pressed="false">Build</button></div>
        <div class="seg tabs" id="sp-ideal" role="group" aria-label="Ideal or real meters"><button type="button" data-v="ideal" aria-pressed="true">Ideal meters</button><button type="button" data-v="real" aria-pressed="false">Real meters</button></div>
      </div>
      <div class="cgrid">
        <span class="rowlab" id="sp-plab">Circuit</span>
        <div class="seg" id="sp-pre"><button type="button" data-v="series" aria-pressed="true">Series</button><button type="button" data-v="parallel" aria-pressed="false">Parallel</button><button type="button" data-v="combined" aria-pressed="false">Combined</button></div>
        <span class="rowlab">Meters</span>
        <div class="chips" id="sp-chips"><button type="button" class="chip" data-m="A" aria-pressed="false"><span class="chip-m">A</span> Ammeter</button><button type="button" class="chip" data-m="V" aria-pressed="false"><span class="chip-m">V</span> Voltmeter</button></div>
        <span class="rowlab" id="sp-jlab">Jump to</span>
        <div class="seg" id="sp-jump"></div>
      </div>
      <p class="note" id="sp-note" aria-live="polite"></p>
      <div class="stats" id="sp-stats"></div>
      <details class="working" id="sp-working">
        <summary>Show working</summary>
        <div class="eq" id="sp-eq1"></div>
        <div class="eq" id="sp-eq2"></div>
        <p class="eqnote" id="sp-eq3"></p>
      </details>
    </div>
  </section>
</div>
<script>
// Which list this page was opened from: ?level=igcse, ial or ib sets the back link (and, on two-level pages, the starting level).
var PW_LEVEL=(location.search.match(/[?&]level=(igcse|ial|ib)\b/)||[])[1]||(/[?&]from=alevel\b/.test(location.search)?'ial':'');
(function(){
  var hl=document.querySelector('.home-link'); if(!hl) return;
  var lv=PW_LEVEL;
  if(!lv && /ial\.html/.test(hl.getAttribute('href'))){ try{ if(localStorage.getItem('pw-symbols')==='ib') lv='ib'; }catch(e){} }
  var L={igcse:['igcse.html','IGCSE animations'],ial:['ial.html','IAL animations'],ib:['ib.html','IB animations']}[lv];
  if(L){ hl.href=L[0]; hl.innerHTML='&larr; '+L[1]; }
})();
(function(){
  // This page is the one copy of this animation. With ?embed it drops its heading so a workout tab
  // can show it in a frame, and it tells that page its height.
  var EMBED = /[?&]embed\b/.test(location.search);
  if(EMBED){
    document.documentElement.classList.add('embed');
    Array.prototype.forEach.call(document.querySelectorAll('details.working'), function(d){ d.open = true; });
    var page = document.getElementById('page');
    var sendHeight = function(){ try{ parent.postMessage({animHeight: Math.ceil(page.getBoundingClientRect().height)}, '*'); }catch(e){} };
    if(window.ResizeObserver) new ResizeObserver(sendHeight).observe(page);
    window.addEventListener('load', sendHeight);
  }
  function $(sel){ return document.querySelector(sel); }
  var SUP = {'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
  function sci(x, dp){   // 4.97 × 10⁻¹⁹
    if(x===0) return '0';
    var e = Math.floor(Math.log10(Math.abs(x))), m = x/Math.pow(10,e);
    if(+Math.abs(m).toFixed(dp)>=10){ m/=10; e++; }
    return sn(m,dp)+' × 10'+String(e).replace(/./g,function(c){ return SUP[c]; });
  }
  function sn(x, dp){ var t = Math.abs(x).toFixed(dp); return (x<0 && +t!==0 ? '−' : '')+t; }   // real minus sign
  function sig(x, n){   // n significant figures, as text, real minus sign
    if(x===0) return '0';
    x=+x.toPrecision(n); if(x===0) return '0';
    var dp = Math.max(0, n-1-Math.floor(Math.log10(Math.abs(x))));
    return sn(x, dp);
  }
  function grp(t){ return String(t).replace(/\B(?=(\d{3})+(?!\d))/g,' '); }   // 12 345
  function FR(t){
    return String(t).replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g,'<span class="frac"><span>$1</span><span>$2</span></span>');
  }
  // Each line of a working readout becomes left | = | right, so the = signs sit under each other.
  function alignEquals(el){
    if(el.querySelector('.eqg')) return;
    var rows = el.innerHTML.split(/<br\s*\/?>/i).map(function(line){
      var i = line.indexOf(' = ');
      if(i<0) return '<span class="eqg-full">'+line+'</span>';
      return '<span class="eqg-l">'+line.slice(0,i)+'</span><span class="eqg-m">=</span><span class="eqg-r">'+line.slice(i+3)+'</span>';
    });
    el.innerHTML = '<div class="eqg">'+rows.join('')+'</div>';
  }
  function watchEquals(el){ alignEquals(el); new MutationObserver(function(){ alignEquals(el); }).observe(el, {childList:true}); }
  // a row of choice buttons that behaves like a radio group
  function segGroup(el, onPick){
    el.addEventListener('click', function(e){ var b=e.target.closest('button'); if(!b||b.disabled) return; pick(b.dataset.v); onPick(b.dataset.v); });
    function pick(v){ Array.prototype.forEach.call(el.querySelectorAll('button'), function(x){ x.setAttribute('aria-pressed', String(x.dataset.v===v)); }); }
    function value(){ var b=el.querySelector('[aria-pressed="true"]'); return b?b.dataset.v:null; }
    return {pick:pick, value:value};
  }
  function pressed(b){ return b.getAttribute('aria-pressed')==='true'; }
  // ---- solid kit (the same block is in roller-coaster-energy.html, heat-transfer.html, density.html and liquid-pressure.html) ----
  function f1(n){ return (+n).toFixed(1); }
  function pts(list){ return list.map(function(p){ return f1(p[0])+','+f1(p[1]); }).join(' '); }
  function pl(list,col,w,extra){ return '<polyline points="'+pts(list)+'" fill="none" stroke="'+col+'" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round"'+(extra||'')+'/>'; }
  function pg(list,fill,extra){ return '<polygon points="'+pts(list)+'" fill="'+fill+'"'+(extra||'')+'/>'; }
  function ln(x1,y1,x2,y2,col,w,extra){ return '<line x1="'+f1(x1)+'" y1="'+f1(y1)+'" x2="'+f1(x2)+'" y2="'+f1(y2)+'" stroke="'+col+'" stroke-width="'+(w||1)+'"'+(extra||'')+'/>'; }
  function rect(x,y,w,h,fill,extra){ return '<rect x="'+f1(x)+'" y="'+f1(y)+'" width="'+f1(Math.max(0,w))+'" height="'+f1(Math.max(0,h))+'" fill="'+fill+'"'+(extra||'')+'/>'; }
  // text in clear space: halo:1 gives it a panel-coloured edge so a line passing behind never cuts a letter
  function txt(x,y,s,o){ o=o||{}; return '<text x="'+f1(x)+'" y="'+f1(y)+'"'+(o.a?' text-anchor="'+o.a+'"':'')+' font-size="'+(o.fs||12)+'" fill="'+(o.c||'var(--ink-soft)')+'"'+(o.w?' font-weight="'+o.w+'"':'')+(o.halo?' paint-order="stroke" stroke="var(--panel)" stroke-width="4" stroke-linejoin="round"':'')+(o.x||'')+'>'+s+'</text>'; }
  // a solid block: front face at (x, y), w wide and h tall, going back by (dx, dy). Lit top, plain front, darker side.
  function box(x,y,w,h,dx,dy,col,o){ o=o||{};
    return pg([[x,y],[x+w,y],[x+w+dx,y+dy],[x+dx,y+dy]],o.top||col)+(o.top?'':pg([[x,y],[x+w,y],[x+w+dx,y+dy],[x+dx,y+dy]],'#fff',' opacity=".38"'))+
      pg([[x+w,y],[x+w+dx,y+dy],[x+w+dx,y+h+dy],[x+w,y+h]],o.side||col)+(o.side?'':pg([[x+w,y],[x+w+dx,y+dy],[x+w+dx,y+h+dy],[x+w,y+h]],'#000',' opacity=".28"'))+
      rect(x,y,w,h,col); }
  // a round bar or post: a dark core with a lighter streak along it
  function tube(x1,y1,x2,y2,w,col,hi){ var L=Math.hypot(x2-x1,y2-y1)||1, nx=-(y2-y1)/L*w*0.22, ny=(x2-x1)/L*w*0.22; if(ny>0){ nx=-nx; ny=-ny; }
    return ln(x1,y1,x2,y2,col,w,' stroke-linecap="round"')+ln(x1+nx,y1+ny,x2+nx,y2+ny,hi,Math.max(0.8,w*0.3),' stroke-linecap="round"'); }
  function wrapLines(s,n){ var out=[], cur=''; String(s).split(' ').forEach(function(w){ if(cur && (cur+' '+w).length>n){ out.push(cur); cur=w; } else cur=cur?cur+' '+w:w; }); if(cur) out.push(cur); return out; }
  function onPick(svg, fn){
    svg.addEventListener('click', function(e){ var t=e.target.closest('.pick'); if(t){ fn(t.getAttribute('data-pick')); } });
    svg.addEventListener('keydown', function(e){ if(e.key!=='Enter' && e.key!==' ') return; var t=e.target.closest('.pick'); if(t){ e.preventDefault(); fn(t.getAttribute('data-pick')); } });
  }
  function setKeepFocus(el, html){ var f=document.activeElement, k=f && el.contains(f) ? f.getAttribute('data-pick') : null; el.innerHTML=html;
    if(k!==null){ var n=el.querySelector('.pick[data-pick="'+k+'"]'); if(n && n.focus) n.focus(); } }
  function ell(cx,cy,rx,ry,fill,extra){ return '<ellipse cx="'+f1(cx)+'" cy="'+f1(cy)+'" rx="'+f1(rx)+'" ry="'+f1(ry)+'" fill="'+fill+'"'+(extra||'')+'/>'; }
  // a solid arrow from (x1, y1) to its tip at (x2, y2)
  function arrow(x1,y1,x2,y2,col,w,extra){ var a=Math.atan2(y2-y1,x2-x1), s=w*2.2, bx=x2-Math.cos(a)*s*1.5, by=y2-Math.sin(a)*s*1.5;
    return '<g'+(extra||'')+'>'+ln(x1,y1,bx,by,col,w)+'<path d="M'+f1(x2)+','+f1(y2)+' L'+f1(bx-Math.sin(a)*s)+','+f1(by+Math.cos(a)*s)+' L'+f1(bx+Math.sin(a)*s)+','+f1(by-Math.cos(a)*s)+' z" fill="'+col+'"/></g>'; }
  // an upright cylinder (a can, a beaker of liquid): top ellipse at yt, bottom at yb. o.top fills the top; o.hi adds a streak of light.
  function cyl(cx,yt,yb,rx,ry,fill,o){ o=o||{};
    return '<path d="M'+f1(cx-rx)+','+f1(yt)+' L'+f1(cx-rx)+','+f1(yb)+' A'+f1(rx)+','+f1(ry)+' 0 0 0 '+f1(cx+rx)+','+f1(yb)+' L'+f1(cx+rx)+','+f1(yt)+' z" fill="'+fill+'"'+(o.extra||'')+'/>'+
      '<path d="M'+f1(cx+rx*0.45)+','+f1(yt)+' L'+f1(cx+rx*0.45)+','+f1(yb+ry*0.85)+' A'+f1(rx)+','+f1(ry)+' 0 0 0 '+f1(cx+rx)+','+f1(yb)+' L'+f1(cx+rx)+','+f1(yt)+' z" fill="#000" opacity="'+(o.shade==null?0.16:o.shade)+'"/>'+
      (o.hi?ln(cx-rx*0.62,yt+ry+4,cx-rx*0.62,yb-2,o.hi,Math.max(1.6,rx*0.11),' stroke-linecap="round" opacity="'+(o.hiop||0.7)+'"'):'')+
      ell(cx,yt,rx,ry,o.top||fill,o.topx||'')+(o.top?'':ell(cx,yt,rx,ry,'#fff',' opacity=".3"')); }
  // a glass thermometer standing upright: bulb at (x, yb); the scale runs from t0 at y0 up to t1 at y1, and the thread stands at T.
  // o.step: a tick every so many degrees; o.num: a number every so many; o.side: numbers on the right (1) or the left (-1); o.from: first tick;
  // o.nobulb: the bulb is out of sight, inside a can or a cube
  function thermo(x,yb,y0,t0,y1,t1,T,o){ o=o||{};
    var w=o.w||7, yT=y1-9, sc=(y1-y0)/(t1-t0), yy=function(t){ return y0+(t-t0)*sc; }, side=o.side||1, fs=o.fs||11, g='', t;
    g+=rect(x-w/2,yT,w,yb-yT,'var(--thermo)',' rx="'+f1(w/2)+'" stroke="var(--ink-faint)" stroke-width="1"');
    g+=ln(x,yb,x,yy(Math.max(t0-4,Math.min(t1+2,T))),'var(--thread)',w*0.36,' stroke-linecap="round"');
    if(!o.nobulb) g+='<circle cx="'+f1(x)+'" cy="'+f1(yb)+'" r="'+f1(w*0.9)+'" fill="var(--thread)" stroke="var(--ink-faint)" stroke-width="0.8"/>'+ell(x-w*0.3,yb-w*0.3,w*0.22,w*0.22,'#fff',' opacity=".7"');
    for(t=(o.from==null?t0:o.from); t<=t1+1e-9; t+=(o.step||10)){ var big=!(Math.round(t)%(o.num||20));
      g+=ln(x+side*w/2,yy(t),x+side*(w/2+(big?7:4)),yy(t),'var(--ink-soft)',big?1.3:0.9);
      if(big && !o.nonum) g+=txt(x+side*(w/2+10),yy(t)+fs*0.36,String(Math.round(t)),{a:side>0?'start':'end',fs:fs,c:'var(--ink)'}); }
    return g; }
  // a stopwatch showing s (for example 1:37)
  function stopwatch(x,y,s,k){ k=k||1; var w=78*k, h=40*k;
    return rect(x+w/2-7*k,y-7*k,14*k,9*k,'var(--steel-sh,#3f4a5e)',' rx="2"')+rect(x,y,w,h,'var(--case,#3f4a5e)',' rx="'+f1(9*k)+'"')+rect(x+2,y+2,w-4,h*0.4,'#fff',' rx="'+f1(8*k)+'" opacity=".12"')+
      rect(x+7*k,y+8*k,w-14*k,h-16*k,'var(--panel)',' rx="3"')+txt(x+w/2,y+h/2+5.5*k,s,{a:'middle',fs:15*k,c:'var(--ink)',w:600}); }
  // ---- end of solid kit ----
  // ---- instrument kit (the same block is in resistivity.html, internal-resistance.html, photoelectric.html and electron-diffraction.html) ----
  // Bench instruments drawn straight on for pictures of circuits: a digital meter, a supply, leads that hang, current arrows.
  // It needs the solid kit above (pg, pl, ln, rect, txt, ell). tri and flowMarks are the 3D kit's (dc-motor.html), flowPath is electromagnets.html's.
  // a solid arrowhead with its tip at (x, y), pointing along ang (degrees, screen)
  function tri(x,y,ang,size,col,extra){ return '<path d="M0,0 L'+(-size*1.7).toFixed(1)+','+(size*0.8).toFixed(1)+' L'+(-size*1.7).toFixed(1)+','+(-size*0.8).toFixed(1)+' z" transform="translate('+x.toFixed(1)+','+y.toFixed(1)+') rotate('+ang.toFixed(1)+')" fill="'+col+'"'+(extra||'')+'/>'; }
  // small arrowheads that travel along a wire the way the (conventional) current flows; pts are screen points
  function flowMarks(pts, phase, gap, size){
    var g='', d=[], tot=0, i;
    for(i=1;i<pts.length;i++){ var l=Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]); d.push(l); tot+=l; }
    for(var s=((phase%gap)+gap)%gap; s<tot; s+=gap){
      var acc=0; for(i=0;i<d.length;i++){ if(s<=acc+d[i]) break; acc+=d[i]; }
      if(i>=d.length || d[i]<0.5) continue;
      var u=(s-acc)/d[i], a=pts[i], b=pts[i+1];
      g+=tri(a[0]+(b[0]-a[0])*u+0, a[1]+(b[1]-a[1])*u+0, Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI, size, 'var(--cur)', ' stroke="var(--panel)" stroke-width="0.8" stroke-linejoin="round"');
    }
    return g;
  }
  function pathLen(p){ var t=0; for(var j=1;j<p.length;j++) t+=Math.hypot(p[j][0]-p[j-1][0],p[j][1]-p[j-1][1]); return t; }
  // A path is a list of pieces [points, visible]: the current arrows are drawn on the visible pieces only (not inside a meter or a cell),
  // in step along the whole path. back turns the current round.
  function flowPath(pieces, phase, gap, size, back){
    var g='', list=pieces, acc=0;
    pieces.forEach(function(p){ p.len=pathLen(p[0]); });
    if(back) list=pieces.slice().reverse();
    list.forEach(function(p){ var q=back?p[0].slice().reverse():p[0]; if(p[1]) g+=flowMarks(q, phase-acc, gap, size); acc+=p.len; });
    return g;
  }
  // points along a lead that hangs from a to b: its middle hangs sag below the straight line
  function hang(a,b,sag,n){ n=n||14; var c=[(a[0]+b[0])/2,(a[1]+b[1])/2+2*sag], out=[];
    for(var i=0;i<=n;i++){ var t=i/n, u=1-t; out.push([u*u*a[0]+2*u*t*c[0]+t*t*b[0], u*u*a[1]+2*u*t*c[1]+t*t*b[1]]); } return out; }
  // points along a curved lead from a to b, pulled towards c1 then c2
  function bez(a,c1,c2,b,n){ n=n||20; var out=[];
    for(var i=0;i<=n;i++){ var t=i/n, u=1-t, k0=u*u*u, k1=3*u*u*t, k2=3*u*t*t, k3=t*t*t; out.push([k0*a[0]+k1*c1[0]+k2*c2[0]+k3*b[0], k0*a[1]+k1*c1[1]+k2*c2[1]+k3*b[1]]); } return out; }
  // an insulated lead with a streak of light along it
  function lead(list,col,w){ w=w||3.4; return pl(list,col||'var(--lead)',w)+pl(list.map(function(q){ return [q[0]-0.5,q[1]-0.8]; }),'var(--lead-hi)',Math.max(0.9,w*0.3),' opacity=".85"'); }
  // a bare metal wire or rod with a streak of light
  function rod(list,col,hi,w){ return pl(list,col,w)+pl(list.map(function(q){ return [q[0]-0.3,q[1]-w*0.22]; }),hi,Math.max(0.7,w*0.3),' opacity=".9"'); }
  // the soft shadow an object throws on the bench: under its base, which runs from x to x + w at height y
  function shadow(x,y,w,h){ return ell(x+w/2+5,y+1,w/2+7,h||4.5,'#000',' opacity=".09"'); }
  // a terminal: a brass stud, or a coloured socket
  function stud(x,y,col){ return '<circle cx="'+f1(x)+'" cy="'+f1(y)+'" r="3.6" fill="'+(col||'var(--brass)')+'" stroke="var(--case-s)" stroke-width="0.8"/><circle cx="'+f1(x-0.9)+'" cy="'+f1(y-1)+'" r="1.1" fill="#fff" opacity=".6"/>'; }
  // the case of an instrument that faces you: a front, a lit top and a darker right-hand side
  function icase(x,t,w,h,o){ o=o||{}; var ex=10, ey=-9;
    return pg([[x+3,t+6],[x+3+ex,t+ey],[x+w+ex,t+ey],[x+w-3,t+6]],o.top||'var(--case-t)')+
      pg([[x+w-6,t+3],[x+w+ex,t+ey],[x+w+ex,t+h+ey-4],[x+w-6,t+h-3]],o.side||'var(--case-s)')+
      rect(x,t,w,h,o.front||'var(--case-f)',' rx="7" stroke="'+(o.side||'var(--case-s)')+'" stroke-width="1.2"'); }
  // A digital meter with a terminal on each side. M = {cx, top, w, h}. dmmGeom gives where the leads plug in (l and r).
  // o.text is the reading on the display and o.unit comes after it; o.letter is printed on the case (A, V, μA); o.tl and o.tr colour the terminals.
  // M.posts = [x1, x2] puts the two terminals on top of the case instead, at those x positions (a supply that stands under what it feeds).
  function dmmGeom(M){ var x=M.cx-M.w/2, y=M.top+M.h*0.7;
    return M.posts ? {l:[M.posts[0],M.top-14], r:[M.posts[1],M.top-14], x:x, base:M.top+M.h} : {l:[x-10,y], r:[x+M.w+13,y-3], x:x, base:M.top+M.h}; }
  function dmm(M,o){ o=o||{}; var x=M.cx-M.w/2, t=M.top, w=M.w, h=M.h, T=dmmGeom(M), lh=Math.round(h*0.42), g='';
    g+=shadow(x,t+h,w);
    if(M.posts){ g+=icase(x,t,w,h,o); [[T.l,o.tl||'var(--plug-r)'],[T.r,o.tr||'var(--plug-k)']].forEach(function(e){

   The reusable parts of an animation's Experiment mode, taken from animations/hookes-law.html:
   - expRun():     the run itself: step the independent variable up one interval at a time, then
                   (optionally) back down again, measuring at every step
   - expReading(): a reading with a small, fixed pattern of reading error, rounded to the instrument's
                   resolution, that never goes the wrong way
   - expTable():   the results table (sticky header, newest row highlighted, a column per run)
   - expCross(), expRing(), expKey(): SVG marks for plotted readings (× first run, ○ return run)
   The page keeps its own picture, physics, graph axes and notes. See tools/experiment-kit/README.md.
   Plain ES5 so it can sit inside any animation page's IIFE. */

// A fixed pattern of reading errors, in units of the instrument's resolution. Fixed (not random) so a
// teacher sees the same results as the class, and a re-run gives the same table.
var EXP_ERR = [0, 1, -1, 0, 2, -1, 1, -2, 0, 1, -1, 0, 1, -1, 2, 0, -1, 1, 0, -2, 1];
function expErr(i){ return EXP_ERR[((i % EXP_ERR.length) + EXP_ERR.length) % EXP_ERR.length]; }

// What the student reads off the instrument.
//   trueVal  the value the physics gives at this step
//   prevVal  the reading taken at the step before (or the start value)
//   res      the instrument's resolution (0.1 cm ruler, 0.05 mm vernier, 0.01 A ammeter, 1° protractor)
//   i        the step number (picks the error from the pattern)
//   scale    how big the error is, in resolutions (default 1; 0.5 for a fine instrument)
// The error is never more than a quarter of the change since the last reading, so a reading never
// goes the wrong way (an extension never falls as the load rises, a current never drops as V rises).
function expReading(trueVal, prevVal, res, i, scale){
  var gap = Math.abs(trueVal - prevVal);
  var err = i > 0 ? expErr(i) * Math.min(res * (scale == null ? 1 : scale), gap / 4) : 0;
  var r = Math.round((trueVal + err) / res) * res;
  var dp = Math.max(0, Math.ceil(-Math.log10(res) - 1e-9));
  return +r.toFixed(dp);
}

// The run. cfg = {
//   start: 0,                 value of the independent variable before the first step
//   max: 10,                  last value of the first run (the run stops there)
//   step: 1,                  the interval (the page can change it with setStep, which resets the run)
//   reverse: true,            allow a return run (unloading, turning the voltage back down)
//   measure: function(v, phase, prevReading){ return reading },   phase is 'up' or 'down'
//   onChange: function(run, what){}  what is 'up', 'down' or 'reset'
// }
// run.up and run.down are arrays of {v, r}. run.phase is 'up' until the first step back, then 'down'.
function expRun(cfg){
  var run = { up: [], down: [], phase: 'up', value: cfg.start || 0, peak: cfg.start || 0, step: cfg.step || 1 };
  var r6 = function(x){ return Math.round(x * 1e6) / 1e6; };
  run.upDone = function(){ return run.phase === 'down' || run.peak >= cfg.max - 1e-9; };
  run.downDone = function(){ return run.phase === 'down' && run.value <= (cfg.start || 0) + 1e-9; };
  run.last = function(){ var a = run.phase === 'down' && run.down.length ? run.down : run.up; return a[a.length - 1] || null; };
  run.stepUp = function(){
    if(run.phase !== 'up' || run.upDone()) return false;
    var prev = run.up.length ? run.up[run.up.length - 1].r : null;
    var v = r6(Math.min(cfg.max, run.value + run.step));
    run.value = run.peak = v;
    run.up.push({ v: v, r: cfg.measure(v, 'up', prev) });
    if(cfg.onChange) cfg.onChange(run, 'up');
    return true;
  };
  run.stepDown = function(){
    if(!cfg.reverse || run.value <= (cfg.start || 0) + 1e-9 || !run.up.length) return false;
    run.phase = 'down';
    var prev = run.down.length ? run.down[run.down.length - 1].r : run.up[run.up.length - 1].r;
    var v = r6(Math.max(cfg.start || 0, run.value - run.step));
    run.value = v;
    run.down.push({ v: v, r: cfg.measure(v, 'down', prev) });
    if(cfg.onChange) cfg.onChange(run, 'down');
    return true;
  };
  run.reset = function(){ run.up = []; run.down = []; run.phase = 'up'; run.value = run.peak = cfg.start || 0; if(cfg.onChange) cfg.onChange(run, 'reset'); };
  run.setStep = function(s){ run.step = s; run.reset(); };
  return run;
}

// rows = [{v:1, up:1.6, down:''}, ...]. newKey/newV highlight the reading just taken (fades in).
// Wrap it in .rtable-wrap so a long table scrolls under its sticky header.
function expTable(el, cols, rows, newV){
  var fmt = function(x, dp){ return (x === '' || x == null) ? '' : (+x).toFixed(dp || 0); };
  var h = '<table class="rtable"><thead><tr>' + cols.map(function(c){ return '<th>' + c.label + '</th>'; }).join('') + '</tr></thead><tbody>';

  function lampGlow(S){ var r=rVal('r1'), P0=Math.pow(solve(false).cur.R1,2)*r, P1=Math.pow(S.cur.R1,2)*r; return P1<P0*0.01 ? 0 : Math.min(1, 0.6*P1/P0); }
  function draw(){
    LY=sizeView(svg,{VW:860,VH:350},{VW:430,VH:694});
    var tall=LY.VW===430, TB=tall?{x:2,y:6,sx:1.04,sy:1.1}:{x:8,y:18,sx:1.12,sy:1.1}, TD=tall?{x:28,y:322,sx:1,sy:1}:{x:496,y:8,sx:0.9,sy:0.9};
    var P=pre(), bd=build(), on=!bd || B.on, S=solve(true);
    var st={placed:placed, slots:true, dist:dist, text:{}, glow:{}, hi:{}, psu: on ? S.pot.P.toFixed(1)+' V' : 'off', name:label, slotName:what, pot:S.pot};
    if(on){ st.cur=S.cur; Object.keys(placed).forEach(function(id){ var r=reading(id,S); st.text[id] = placed[id]==='A' ? fmtA(r) : fmtV(r); }); }
    if(bd){ st.kind=function(e){ return e.id==='R1' ? 'lamp' : e.kind; }; if(on) st.glow.R1=lampGlow(S);
      if(B.res){ (B.res.bad||[]).forEach(function(id){ st.hi[id]='var(--bad)'; }); (B.res.good||[]).forEach(function(id){ st.hi[id]='var(--good)'; }); } }
    var D=kDiagram(P,st,TD), cc=kMap(TD,[P.cell.x,P.cell.y]);
    var g=arrowDefs()+kBench(P,st,TB)+D.g+txt(cc[0]-20,cc[1]+4,Vs().toFixed(1)+' V',{a:'end',fs:11.5,c:'var(--ink)'});
    g+=txt(TB.x,12,'Built on the bench',{fs:12})+txt(TD.x-(tall?6:0),TD.y+(tall?12:5),'Circuit diagram',{fs:12});
    g+= bd ? taskPic(tall) : bars(S,tall);
    if(running && slowOn()) g+=txt(tall?426:472, 12, 'slow motion', {a:'end', fs:12, c:'var(--accent)'});
    live.innerHTML=g;
    if(D.slots!==slotsHtml){ setKeepFocus(slotsG, D.slots); slotsHtml=D.slots; }
    readings(S);
  }

  // ---- readings, working, note
  var lastNote='', msg='';
  function readings(S){
    var K=ks5(), bd=build(), kind=preSeg.value(), V=Vs(), r1=rVal('r1'), r2=rVal('r2'), r3=rVal('r3'), I0=solve(false);
    $('#sp-vo').textContent=V.toFixed(1)+' V'; $('#sp-r1o').textContent=r1+' Ω'; $('#sp-r2o').textContent=r2+' Ω'; $('#sp-r3o').textContent=r3+' Ω';
    $('#sp-rvo').textContent=grp(sig(RV(),2))+' Ω';
    if(bd) $('#sp-stats').innerHTML=stat('Task', String(B.n))+stat('Right first time', B.right+' of '+B.tried, true);
    else $('#sp-stats').innerHTML=stat('Total R', sig(V/I0.I,3)+' Ω')+stat('Supply current', fmtA(I0.I), true);

    var w1='', w2='', w3='', I=I0.I;
    if(kind==='series'){
      w1='R = R₁ + R₂<br>R = '+r1+' + '+r2+'<br>R = '+(r1+r2)+' Ω<br>V = I × R<br>'+V.toFixed(1)+' = I × '+(r1+r2)+'<br>I = [['+V.toFixed(1)+'|'+(r1+r2)+']]<br>I = <b>'+sig(I,3)+' A</b>';
      w2='V₁ = I × R₁<br>V₁ = '+sig(I,4)+' × '+r1+'<br>V₁ = <b>'+sig(I*r1,3)+' V</b><br>V₂ = I × R₂<br>V₂ = '+sig(I,4)+' × '+r2+'<br>V₂ = <b>'+sig(I*r2,3)+' V</b>';
      w3='Same current everywhere in a series circuit; the p.d.s add up to the supply: '+sig(I*r1,3)+' + '+sig(I*r2,3)+' = '+V.toFixed(1)+' V.';
    } else if(kind==='parallel'){
      if(K) w1='[[1|R]] = [[1|R₁]] + [[1|R₂]]<br>[[1|R]] = [[1|'+r1+']] + [[1|'+r2+']]<br>[[1|R]] = '+sig(1/r1+1/r2,4)+'<br>R = <b>'+sig(1/(1/r1+1/r2),3)+' Ω</b>';
      w2='V = I₁ × R₁<br>'+V.toFixed(1)+' = I₁ × '+r1+'<br>I₁ = [['+V.toFixed(1)+'|'+r1+']]<br>I₁ = '+sig(V/r1,3)+' A<br>V = I₂ × R₂<br>'+V.toFixed(1)+' = I₂ × '+r2+'<br>I₂ = [['+V.toFixed(1)+'|'+r2+']]<br>I₂ = '+sig(V/r2,3)+' A<br>I = I₁ + I₂<br>I = '+sig(V/r1,3)+' + '+sig(V/r2,3)+'<br>I = <b>'+sig(V/r1+V/r2,3)+' A</b>';
      w3='Each branch has the full supply p.d. across it ('+V.toFixed(1)+' V). The currents in the branches add up to the current from the supply: charge is conserved at a junction.';
    } else {
      var r23=1/(1/r2+1/r3), Rt=r1+r23, It=V/Rt, V1=It*r1, V23=V-V1;
      w1='[[1|R₂₃]] = [[1|R₂]] + [[1|R₃]]<br>[[1|R₂₃]] = [[1|'+r2+']] + [[1|'+r3+']]<br>R₂₃ = '+sig(r23,4)+' Ω<br>R = R₁ + R₂₃<br>R = '+r1+' + '+sig(r23,4)+'<br>R = <b>'+sig(Rt,3)+' Ω</b>';
      w2='V = I × R<br>'+V.toFixed(1)+' = I × '+sig(Rt,4)+'<br>I = [['+V.toFixed(1)+'|'+sig(Rt,4)+']]<br>I = <b>'+sig(It,3)+' A</b><br>V₁ = I × R₁<br>V₁ = '+sig(It,4)+' × '+r1+'<br>V₁ = '+sig(V1,3)+' V<br>V₂₃ = V − V₁<br>V₂₃ = '+V.toFixed(1)+' − '+sig(V1,4)+'<br>V₂₃ = <b>'+sig(V23,3)+' V</b>';
      w3='R₂ and R₃ share the same p.d. ('+sig(V23,3)+' V); their currents, '+sig(V23/r2,3)+' A and '+sig(V23/r3,3)+' A, add up to the '+sig(It,3)+' A through R₁.';
    }
    var F = bd ? null : kFault(pre(), placed, S, what, FMT, notes());
    // real meters: what each one reads, against the ideal value
    if(real() && Object.keys(placed).length && !F){
      var lines=Object.keys(placed).map(function(id){ var s=kVslot(pre(),id), whatM = s ? 'voltmeter across '+(s.of==='cell'?'the supply':'R'+SUB[s.of.slice(1)]) : 'ammeter';
        return whatM+' reads '+(s?fmtV(reading(id,S)):fmtA(reading(id,S)))+' (ideal '+(s?fmtV(reading(id,I0)):fmtA(reading(id,I0)))+')'; });
      w3='Real meters: '+lines.join('; ')+'. '+w3;
      var vs=Object.keys(placed).filter(function(id){ return id.charAt(0)==='v' && id!=='vC'; });
      if(kind==='series' && vs.length===1 && Object.keys(placed).length===1){
        var Rk=rVal(vs[0]==='vR1'?'r1':'r2'), Ro=vs[0]==='vR1'?r2:r1, Rp=Rk*RV()/(Rk+RV()), k=vs[0].slice(2);
        w2='[[1|R′]] = [[1|R'+SUB[k]+']] + [[1|R<sub>V</sub>]]<br>[[1|R′]] = [[1|'+Rk+']] + [[1|'+sig(RV(),3)+']]<br>R′ = '+sig(Rp,4)+' Ω<br>V'+SUB[k]+' = [[R′|R′ + '+(k==='1'?'R₂':'R₁')+']] × V<br>V'+SUB[k]+' = [['+sig(Rp,4)+'|'+sig(Rp,4)+' + '+Ro+']] × '+V.toFixed(1)+'<br>V'+SUB[k]+' = <b>'+sig(V*Rp/(Rp+Ro),3)+' V</b>';
      }
    }
    $('#sp-eq1').innerHTML=FR(w1); $('#sp-eq1').hidden=!w1; $('#sp-eq2').innerHTML=FR(w2); $('#sp-eq3').innerHTML=FR(w3);

    var note=msg;
    if(bd){
      if(B.res) note=(B.res.ok?'✓ ':'✗ ')+B.res.html+(B.res.ok ? ' Press <b>New task</b>.' : B.res.kind==='missing' ? '' : ' Move the meter, then press <b>Go</b> again.');
      else if(!note) note='<b>Task '+B.n+'.</b> '+B.task.text+' Pick a meter (or drag it) and press a dashed circle on the circuit diagram; press a meter to take it out. Then press <b>Go</b>.';
    } else if(!note){
      if(F) note=F.html+(real() ? ' (Real meters: the ammeter is 0.5 Ω, the voltmeter '+grp(sig(RV(),2))+' Ω.)' : '');
      else if(!Object.keys(placed).length) note='Drag an <b>ammeter</b> or a <b>voltmeter</b> onto a dashed circle on the circuit diagram, or pick one and then press a circle. It is wired into the circuit on the bench.';
      else if(kind==='series') note='In series the <b>same current</b> passes through every part, and the supply p.d. is <b>shared</b>: the bigger resistor gets the bigger share.';
      else if(kind==='parallel') note='In parallel each branch gets the <b>full supply p.d.</b>, and the branch currents <b>add up</b> to the current from the supply: as much current leaves a junction as arrives.';
      else note='R₁ carries all the current, which then splits between R₂ and R₃. R₂ and R₃ have the same p.d. across them.';
      if(!F && real() && Object.keys(placed).length) note='Real meters change what they measure: the voltmeter (R<sub>V</sub> = '+sig(RV(),2)+' Ω) takes some current, the ammeter (0.5 Ω) takes some p.d. The working compares them with ideal meters.';
    }
    if(note!==lastNote){ $('#sp-note').innerHTML=FR(note); lastNote=note; }
    playBtn.innerHTML = bd && !B.on ? '&#9654; Go' : running ? '&#10074;&#10074; Pause' : '&#9654; Play';
  }

  // ---- placing meters: drag a chip onto a slot, or pick a chip then press a slot; press a meter to take it out
  function metersChanged(){ msg=''; jumpSeg.pick(null); if(build() && B.on){ B.on=false; B.res=null; stop(); } else if(build()) B.res=null; draw(); }
  var input=kInput(svg, $('#sp-chips'), function(id, m, dropped){
    if(placed[id] && !dropped){ delete placed[id]; metersChanged(); return; }
    if(!m){ msg='Pick an ammeter or a voltmeter first, or drag one here.'; draw(); return; }
    placed[id]=m; metersChanged();
  });

  // ---- motion: the current arrows move at a speed in proportion to the current in each wire
  function frame(now){
    var real_=Math.min(0.05,(now-last)/1000); last=now;
    if(running){ runFor+=real_; if(runFor>=RUN_MAX) running=false; }
    var dt=real_*(slowOn()?0.3:1), S=solve(true), iref=Vs()/10;
    Object.keys(S.cur).forEach(function(id){ dist[id]=(dist[id]||0)+Math.max(-320,Math.min(320,70*S.cur[id]/iref))*dt; });
    draw();
    if(running) raf=requestAnimationFrame(frame);
  }
  function stop(){ running=false; cancelAnimationFrame(raf); }
  function play(){ running=true; runFor=0; last=performance.now(); cancelAnimationFrame(raf); raf=requestAnimationFrame(frame); }

  // ---- Build: deal a task, the student puts the meters in, Go switches on and marks it
  function tasks(){ return TASKS.filter(function(t){ return ks5() || !t.ks5; }); }
  function deal(){
    var list=tasks(); B.i=(B.i+1)%list.length; B.n++; B.task=list[B.i];
    B.vals={V:[6,12,9][B.n%3], r1:10, r2:[20,5][B.n%2], r3:20}; if(B.task.pre==='combined') B.vals.r2=10;
    preSeg.pick(B.task.pre); placed={}; Object.keys(B.task.init||{}).forEach(function(k){ placed[k]=B.task.init[k]; });
    B.on=false; B.res=null; B.counted=false; dist={}; msg=''; stop(); input.clear(); setRows(); lastNote=''; draw();
  }
  function go(){
    B.on=true; B.res=kMark(pre(), B.task, placed, solve(true), what, FMT, notes());
    if(!B.counted && B.res.kind!=='missing'){ B.counted=true; B.tried++; if(B.res.ok) B.right++; }
    lastNote=''; play();
  }
  function setTab(){
    stop(); placed={}; dist={}; msg=''; jumpSeg.pick(null); input.clear();
    if(build()){ B.i=-1; B.n=0; B.tried=0; B.right=0; deal(); }
    else { setRows(); lastNote=''; draw(); }
  }

  // ---- fixed points
  function setJumps(){
    var js=[['all','All meters'],['std','5 Ω + 5 Ω']];
    if(ks5()) js.push(['rv','R<sub>V</sub> = 20 Ω']);
    jumpEl.innerHTML=js.map(function(j){ return '<button type="button" data-v="'+j[0]+'" aria-pressed="false">'+j[1]+'</button>'; }).join('');
  }
  function jumpTo(v){
    msg='';
    if(v==='all'){ placed={}; pre().edges.forEach(function(e){ if(e.slot) placed[e.id]='A'; }); pre().vslots.forEach(function(s){ placed[s.id]='V'; }); }
    else { preSeg.pick('series'); vIn.value=10; r1In.value=5; r2In.value=5; placed={vR2:'V'}; dist={};
      if(v==='rv'){ idealSeg.pick('real'); rvIn.value=Math.log10(20); } else idealSeg.pick('ideal'); setRows(); }
    lastNote=''; draw();
  }
  function setRows(){
    var K=ks5(), bd=build(), kind=preSeg.value(), lv=levelSeg.value();
    $('#sp-pre [data-v="combined"]').hidden=!K;
    $('#sp-plab').hidden=$('#sp-pre').hidden=bd;
    $('#sp-ideal').hidden=!K || bd;
    $('#sp-jlab').hidden=jumpEl.hidden=bd;
    $('#sp-sliders').hidden=bd; $('#sp-working').hidden=bd; newBtn.hidden=!bd;
    $('#sp-r3box').hidden=kind!=='combined';
    $('#sp-rvbox').hidden=!real();
    $('#sp-eye').innerHTML = lv==='igcse' ? 'Animations &middot; electricity &middot; IGCSE 2.7&ndash;2.19' : lv==='ib' ? 'Animations &middot; B.5 current and circuits' : 'Animations &middot; electric circuits &middot; IAL 67, 68';
  }
  function setLevel(){
    if(!ks5()){ idealSeg.pick('ideal'); if(!build() && preSeg.value()==='combined'){ preSeg.pick('series'); placed={}; } }
    setJumps();
    if(build()){ B.i=-1; B.n=0; B.tried=0; B.right=0; deal(); } else { setRows(); lastNote=''; draw(); }
  }

  playBtn.addEventListener('click', function(){ if(build() && !B.on){ go(); return; } if(running){ stop(); draw(); } else play(); });
  newBtn.addEventListener('click', deal);
  slowBtn.addEventListener('click', function(){ slowBtn.setAttribute('aria-pressed', String(!slowOn())); draw(); });
  $('#sp-reset').addEventListener('click', function(){
    stop(); dist={}; msg=''; input.clear(); lastNote='';
    if(build()){ placed={}; Object.keys(B.task.init||{}).forEach(function(k){ placed[k]=B.task.init[k]; }); B.on=false; B.res=null; draw(); return; }
    placed={}; vIn.value=10; r1In.value=5; r2In.value=5; r3In.value=10; jumpSeg.pick(null); draw(); });
  [vIn,r1In,r2In,r3In,rvIn].forEach(function(el){ el.addEventListener('input', function(){ jumpSeg.pick(null); msg=''; draw(); }); });

  watchEquals($('#sp-eq1')); watchEquals($('#sp-eq2'));
  if(/[?&]show=build\b/.test(location.search)) tabSeg.pick('build');
  setLevel();
  if(build() && !B.task) deal();
  // redraw when the picture changes between its wide and its tall shape
  if(window.ResizeObserver) new ResizeObserver(function(){ var w=svg.getBoundingClientRect().width; if(LY && (w>0 && w<520)!==svg.classList.contains('tall')) draw(); }).observe(svg);

})();
</script>
