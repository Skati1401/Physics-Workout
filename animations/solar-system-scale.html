<style>
  :root{
    --bg:#eef1f5; --bg-grid:rgba(29,41,61,0.055);
    --panel:#ffffff; --panel-border:#d7dce4;
    --ink:#182233; --ink-soft:#4c5668; --ink-faint:#8993a5;
    --accent:#d9720c; --accent-soft:#fdead2;
    --good:#15803d; --good-soft:#dcf5e3;
    --bad:#c0311a; --bad-soft:#fbe1db;
    --shadow:0 10px 26px -14px rgba(24,34,51,0.28);
    --topic:#7a3fc4;   --topic-soft:#eee3fb;
    --grav:#2f63c9;    --grav-soft:#e0e9fa;
    --steel:#66748c; --steel-hi:#c3ccda; --steel-sh:#3f4a5e; --rail:#2c3648;
    --deck-t:#d3d9e3; --deck-f:#a3adbf; --deck-s:#7f8a9f;
    --ground-t:#d5e6c8; --ground-f:#a4bf90; --ground-s:#86a374;
    --car-f:#7a3fc4; --car-t:#b792ee; --car-s:#552a8f; --skin:#f0c7a3; --hair:#3b2a1e; --shirt:#f2b01e;
    --kin:#c2560c;     --kin-soft:#fbe4cd;
    --therm:#b8322a;   --therm-soft:#fbe2df;
    --font-display:'Big Shoulders',system-ui,sans-serif;
    --font-body:'IBM Plex Sans',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12161f; --bg-grid:rgba(255,255,255,0.045);
      --panel:#1b212e; --panel-border:#2c3444;
      --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;
      --accent:#ff9a3d; --accent-soft:#3a2712;
      --good:#4ade80; --good-soft:#123321;
      --bad:#f27159; --bad-soft:#3a1712;
      --shadow:0 14px 30px -14px rgba(0,0,0,0.55);
      --topic:#c29bff; --topic-soft:#2e1f4a;
      --grav:#86a9ff; --grav-soft:#1a2b55; --kin:#ff9f5c; --kin-soft:#3a2413; --therm:#ff8a80; --therm-soft:#402023;
      --steel:#8f9db3; --steel-hi:#dfe5ee; --steel-sh:#566179; --rail:#c3ccda;
      --deck-t:#7d899e; --deck-f:#5c677c; --deck-s:#434d60;
      --ground-t:#3f5a3a; --ground-f:#2c4229; --ground-s:#22331f;
      --car-f:#9b6be6; --car-t:#cdb2ff; --car-s:#6a3fb5; --skin:#f0c7a3; --hair:#2a1d14; --shirt:#f2b01e;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12161f; --bg-grid:rgba(255,255,255,0.045);
    --panel:#1b212e; --panel-border:#2c3444;
    --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;
    --accent:#ff9a3d; --accent-soft:#3a2712;
    --good:#4ade80; --good-soft:#123321;
    --bad:#f27159; --bad-soft:#3a1712;
    --shadow:0 14px 30px -14px rgba(0,0,0,0.55);
    --topic:#c29bff; --topic-soft:#2e1f4a;
    --grav:#86a9ff; --grav-soft:#1a2b55; --kin:#ff9f5c; --kin-soft:#3a2413; --therm:#ff8a80; --therm-soft:#402023;
    --steel:#8f9db3; --steel-hi:#dfe5ee; --steel-sh:#566179; --rail:#c3ccda;
    --deck-t:#7d899e; --deck-f:#5c677c; --deck-s:#434d60;
    --ground-t:#3f5a3a; --ground-f:#2c4229; --ground-s:#22331f;
    --car-f:#9b6be6; --car-t:#cdb2ff; --car-s:#6a3fb5; --skin:#f0c7a3; --hair:#2a1d14; --shirt:#f2b01e;
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      linear-gradient(var(--bg-grid) 1px,transparent 1px) 0 0/100% 34px,
      linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px) 0 0/34px 100%,
      var(--bg);
    color:var(--ink); font-family:var(--font-body); font-size:14px; -webkit-font-smoothing:antialiased;
  }
  [hidden]{display:none!important;}
  button{font:inherit;color:inherit;}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;}

  .page{max-width:1400px;margin-inline:auto;padding-inline:20px;padding-block:12px 40px;}
  h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:0.2px;text-wrap:balance;margin:0;}
  p{margin:0;line-height:1.55;}

  .home-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-bottom:4px;font:600 13px var(--font-mono);color:var(--ink-soft);text-decoration:none;}
  .home-link:hover{color:var(--accent);}
  .page-head{margin-bottom:12px;}
  .eyebrow{font-family:var(--font-mono);font-size:11.5px;color:var(--accent);font-weight:600;margin-bottom:6px;}
  .page-head h1{font-size:clamp(28px,5vw,38px);color:var(--ink);}

  .card{background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;box-shadow:var(--shadow);}
  .btn{
    font-family:var(--font-body);font-weight:600;font-size:13.5px;color:var(--ink);
    background:var(--panel);border:1px solid var(--panel-border);border-radius:9px;
    padding:9px 15px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  }
  .btn:hover{border-color:var(--ink-faint);}
  .btn:disabled{opacity:.45;cursor:default;}
  .btn-primary{background:var(--ink);border-color:var(--ink);color:var(--bg);}
  .btn-primary:hover{opacity:.88;border-color:var(--ink);}
  .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);}
  .btn-group{display:flex;flex-wrap:wrap;gap:10px;}

  /* picture on the left; controls, readings and working on the right */
  .stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);gap:18px 24px;align-items:start;padding:18px;}
  @media (max-width:860px){ .stage{grid-template-columns:minmax(0,1fr);} }
  .view-wrap{position:relative;}
  .view{display:block;width:100%;height:auto;max-height:max(260px,calc(100vh - 290px));touch-action:pan-y;}
  .view-wrap canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  .embed .view{max-height:460px;}
  .under{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;margin-top:12px;}
  .under .btn-group{flex:0 1 auto;}
  .sliders{flex:1 1 300px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px 16px;min-width:0;}
  .view text{font-family:var(--font-mono);}
  .side{display:flex;flex-direction:column;gap:12px;min-width:0;}
  .lab{display:flex;justify-content:space-between;gap:8px;font:12.5px var(--font-mono);color:var(--ink-soft);margin-bottom:6px;}
  .lab output{color:var(--ink);font-weight:600;}
  input[type=range]{width:100%;accent-color:var(--topic);min-height:28px;}
  .seg{display:flex;flex-wrap:wrap;gap:6px;}
  .seg button{font:12.5px var(--font-mono);padding:8px 12px;min-height:44px;border:1px solid var(--panel-border);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer;}
  .seg button[aria-pressed="true"]{background:var(--topic);border-color:var(--topic);color:var(--panel);}
  .seg button:disabled{opacity:.45;cursor:default;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px;}
  .stat{border:1px solid var(--panel-border);border-radius:8px;padding:5px 8px;display:flex;flex-direction:column;justify-content:space-between;}
  .stat small{display:block;font:10.5px var(--font-mono);color:var(--ink-faint);}
  .stat strong{font:600 15px var(--font-mono);color:var(--ink);white-space:nowrap;}
  .stat.hi strong{color:var(--accent);}
  .note{font-size:15px;line-height:1.5;color:var(--ink);padding:10px 12px;border-radius:8px;background:var(--bg);min-height:4.6em;}
  .note b{color:var(--topic);}
  .hint{font-size:12.5px;color:var(--ink-soft);}

  details.working summary{cursor:pointer;font:600 13px var(--font-mono);color:var(--topic);min-height:44px;display:flex;align-items:center;}
  .eq{font-family:var(--font-mono);font-size:14px;line-height:1.75;padding:8px 12px;border-left:3px solid var(--topic);background:var(--topic-soft);border-radius:6px;color:var(--ink);}
  .eq b{color:var(--topic);}
  .eqg{display:grid;grid-template-columns:auto auto minmax(0,1fr);column-gap:.45em;row-gap:.2em;align-items:center}
  .eqg-l{justify-self:end;text-align:right}
  .eqg-m{justify-self:center}
  .eqg-r{justify-self:start;min-width:0}
  .eqg-full{grid-column:1/-1}
  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1.25;}
  .frac>span{padding:0 .25em;white-space:nowrap;}
  .frac>span:first-child{border-bottom:1.5px solid currentColor;}
  /* drag the hill tops up and down to set h1 and h2 */
  .grab{cursor:grab;touch-action:none;}
  .dragme{cursor:grab;}
  .dragme:focus{outline:none;}
  .dragme:focus-visible .focus-ring{stroke:var(--accent);stroke-width:3;}
  @media (max-width:560px){ .stage{padding:12px;} .eq{font-size:12.5px;padding:6px 8px;} .note{font-size:14px;} }

  .over{margin-top:8px;}
  .seg.tabs{gap:0;flex-wrap:nowrap;}
  .seg.tabs button{border-radius:0;margin-left:-1px;font-weight:600;}
  .seg.tabs button:first-child{border-radius:8px 0 0 8px;margin-left:0;}
  .seg.tabs button:last-child{border-radius:0 8px 8px 0;}
  /* things to click in the picture (Predict) */
  .pick{cursor:pointer;}
  .pick:focus{outline:none;}
  .pick .ring{stroke:transparent;}
  .pick:focus-visible .ring{stroke:var(--accent);}

  .embed body{background:transparent;}
  .embed .page{padding:0;max-width:none;display:flow-root;}
  .embed .home-link,.embed .page-head{display:none;}
  .embed .hint{display:none;}
  .view{max-height:max(240px,calc(100vh - 300px));}
  .view.tall,.embed .view.tall{max-height:none;}
  .rowlab{font:12.5px var(--font-mono);color:var(--ink-soft);margin-bottom:4px;}
  .pick .ring{fill:transparent;stroke:transparent;stroke-width:3;}
  .pick:focus-visible .ring{stroke:#ffb347;}
  .pick:hover .slot{stroke:#ffffff;}
  .pick.is-chosen .slot{stroke:#ffb347;stroke-dasharray:none;stroke-width:3;}
  .note small{display:block;font:11.5px var(--font-mono);color:var(--ink-faint);margin-bottom:2px;}
  .why{margin:0;padding-left:1.3em;line-height:1.55;font-size:14px;}
  .why li+li{margin-top:3px;}
  .opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;}
  .opts button{font:13.5px/1.3 var(--font-body);text-align:left;padding:8px 11px;min-height:44px;border:1px solid var(--panel-border);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer;}
  .opts button:hover:not(:disabled){border-color:var(--ink-faint);}
  .opts button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);}
  .opts button.ok{border-color:var(--good);background:var(--good-soft);}
  .opts button.no{border-color:var(--bad);background:var(--bad-soft);}
  .opts button:disabled{cursor:default;}
  .ans{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .ans label{font:12.5px var(--font-mono);color:var(--ink-soft);}
  .ans input{font:600 16px var(--font-mono);width:9em;padding:8px 10px;min-height:44px;border:1px solid var(--panel-border);border-radius:8px;background:var(--panel);color:var(--ink);}
  .ans input.ok{border-color:var(--good);background:var(--good-soft);}
  .ans input.no{border-color:var(--bad);background:var(--bad-soft);}
  .ans .unit{font:600 14px var(--font-mono);color:var(--ink-soft);}
  @media (max-height:700px){ .note{font-size:14px;min-height:4em;} }
  .side .sliders{flex:none;}
  /* Scale of the Solar System */
  :root{ --topic:#7a3fc4; --topic-soft:#eee3fb; }
  .cmp{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);gap:6px 8px;align-items:center;}
  .cmp label{font:12.5px var(--font-mono);color:var(--ink-soft);}
  .cmp select{font:13.5px var(--font-body);min-height:40px;padding:6px 8px;border:1px solid var(--panel-border);border-radius:8px;background:var(--panel);color:var(--ink);min-width:0;}
  .cmp .a{color:#c2560c;font-weight:700;} .cmp .b{color:#0f7a8a;font-weight:700;}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .cmp .a{color:#ff9f5c;} :root:not([data-theme="light"]) .cmp .b{color:#5fd3e3;} }
  :root[data-theme="dark"] .cmp .a{color:#ff9f5c;} :root[data-theme="dark"] .cmp .b{color:#5fd3e3;}
  #ss-calc{font-size:13.5px;line-height:1.6;}
  #ss-calc .eqg{row-gap:.1em;}
  .side .cgrid{margin:0;}
</style>
<style id="choice-kit">
/* Choice kit (12 Nov 2026): the same block on every animation page. See tools/ANIMATION-STYLE.md, "Choices". */
.seg.pick{background:var(--bg);box-shadow:inset 0 0 0 1px var(--panel-border);border-radius:8px;}
.seg.pick.fit{width:fit-content;max-width:100%;}
.seg.pick>button:not([aria-pressed="true"]):not(.is-on){background:transparent;border-color:transparent;}
.seg.pick>button:not([aria-pressed="true"]):not(.is-on):not(:disabled):hover{background:var(--panel);border-color:var(--panel-border);}
.seg.mode{display:flex;flex-wrap:nowrap;align-self:stretch;flex-grow:1;background:var(--bg);box-shadow:0 0 0 1px var(--panel-border);border-radius:11px;padding:3px;gap:3px;}
.seg.mode>button:nth-child(n){flex:1 1 0;min-height:38px;margin-left:0;padding:6px 12px;border-radius:8px;white-space:nowrap;font:600 14.5px var(--font-body,inherit);}
.seg.mode>button:nth-child(n):not([aria-pressed="true"]){background:transparent;border-color:transparent;color:var(--ink);}
.seg.mode>button:nth-child(n):not([aria-pressed="true"]):hover{background:var(--panel);border-color:var(--panel-border);}
.seg.mode>button:nth-child(n)[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel);}
/* Choice rows (13 Nov 2026, Alex): in a .cgrid the label sits above its group, each group is only as wide as its
   buttons, and short groups share a row, as on dc-motor.html. The script wraps each label and its control in a .cgroup. */
.cgrid.kit{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-start;}
.cgrid.kit>.cgroup{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;max-width:100%;}
/* a row of one group (e.g. Graph under the picture) keeps its label beside it, to save height */
.cgrid.kit.one>.cgroup{flex-direction:row;align-items:center;gap:10px;}
.cgrid.kit>.cgroup[hidden]{display:none;}
.cgrid.kit>.cgroup>.rowlab{font:12.5px var(--font-mono,ui-monospace,monospace);color:var(--ink-soft);}
.cgrid.kit>.cgroup>.seg{display:flex;flex-wrap:wrap;max-width:100%;}
.cgrid.kit>.cgroup>.seg>button{flex:0 1 auto;}
.to-q[hidden]{display:none!important;}
.to-q:nth-child(n){border-style:dashed;border-color:var(--ink);font-weight:600;}
</style>
<script>
  // Visit counter (GoatCounter: no cookies, no personal data). Skipped when a page is embedded in a workout, so a visit counts once.
  // pwCountTab(tab, label): counts each workout tab once per visit as a GoatCounter event (path "page#tab"), skipped in frames the same way.
  (function(){
    var off = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var seen = {}, queue = [];
    function send(e){ try { window.goatcounter.count(e); } catch (x) {} }
    window.pwCountTab = function(tab, label){
      if (off || !tab || seen[tab]) return;
      seen[tab] = 1;
      var page = (location.pathname.split('/').pop() || 'index').replace(/\.html$/, '');
      var e = { path: page + '#' + tab, title: (label || tab) + ' \u00b7 ' + document.title, event: true };
      if (window.goatcounter && window.goatcounter.count) send(e); else queue.push(e);
    };
    if (off) return;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://gc.zgo.at/count.js';
    s.setAttribute('data-goatcounter', 'https://physics-workout.goatcounter.com/count');
    s.onload = function(){ var q = queue; queue = []; q.forEach(send); };
    document.head.appendChild(s);
  })();
</script>
<!-- pw-review -->
<script>
  // Draft tags and Alex's reviewer button (tools/review/drafts.py writes this block; edit tools/review/snippet.html, then run drafts.py sync).
  // A page is Draft while its row in tools/REVIEW.md is not ✅: <meta name="pw-draft"> on the page, data-draft on its list cards.
  // ?reviewer (once, on any page) turns on reviewer mode in this browser; ?reviewer=off turns it off.
  (function(){
    var on = false, embed = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var m = /[?&]reviewer(?:=([^&]*))?/.exec(location.search);
    on = !!m && m[1] !== 'off';
    try {
      if (m) { if (m[1] === 'off') localStorage.removeItem('pw-reviewer'); else localStorage.setItem('pw-reviewer', '1'); }
      else on = localStorage.getItem('pw-reviewer') === '1';
    } catch (e) {}
    var CSS = '.pw-draft{display:inline-block;vertical-align:middle;margin-left:10px;font:600 11.5px/1.4 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:0;color:var(--bad,#b42318);border:1px dashed currentColor;border-radius:5px;padding:1px 7px;white-space:nowrap}'
      + '.act-top .pw-draft{margin-left:auto;flex:none}.act-top .pw-draft~.cp-tag,.act-top .pw-draft~.ta-tag{margin-left:0}'
      + 'a[data-draft]{position:relative}.pw-draft.pw-corner{position:absolute;top:10px;right:10px;margin:0;background:var(--panel,#fff)}'
      + '.pw-check{display:inline-block;vertical-align:middle;margin-left:8px;font:600 13px/1.4 "IBM Plex Sans",system-ui,sans-serif;color:#fff;background:#1a7f37;border-radius:6px;padding:4px 10px;text-decoration:none;white-space:nowrap}'
      + '.pw-check:hover{background:#116329}.pw-check:focus-visible{outline:2px solid #1a7f37;outline-offset:2px}'
      + '.pw-reviewer{position:fixed;left:10px;bottom:10px;z-index:9999;font:500 12px/1.4 "IBM Plex Mono",ui-monospace,monospace;background:#1d2433;color:#fff;border-radius:6px;padding:4px 9px;opacity:.85}'
      + '.pw-reviewer a{color:#ffc83d}';
    function tag(){ var t = document.createElement('span'); t.className = 'pw-draft'; t.title = 'Not yet checked'; t.textContent = 'Draft'; return t; }
    function go(){
      var st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st);
      var meta = document.querySelector('meta[name="pw-draft"]'), h1 = document.querySelector('h1');
      if (meta && h1 && !embed) {
        h1.appendChild(tag());
        if (on) {
          var page = meta.getAttribute('content'), b = document.createElement('a');
          b.className = 'pw-check'; b.target = '_blank'; b.rel = 'noopener'; b.textContent = '✓ Checked';
          b.title = 'Opens a GitHub issue. Submit it and the Draft tag goes in a minute or two.';
          b.href = 'https://github.com/Skati1401/Physics-Workout/issues/new?title=' + encodeURIComponent('Checked: ' + page)
            + '&body=' + encodeURIComponent('Submit this issue to mark `' + page + '` as checked. The Draft tag goes in a minute or two, and the issue closes itself.');
          h1.appendChild(b);
        }
      }
      document.querySelectorAll('a[data-draft]').forEach(function(a){
        if (a.querySelector('.pw-draft')) return;
        var t = tag(), top = a.querySelector('.act-top');
        if (top) top.insertBefore(t, top.querySelector('.cp-tag,.ta-tag'));
        else { t.className += ' pw-corner'; a.appendChild(t); }
      });
      // No tag on a unit or theme heading (Alex, 12 Nov 2026): only the pages and their cards.
      if (on && !embed) {
        // Carry ?reviewer in every link to another page of the site, so reviewer mode survives
        // browsers that clear site storage (school Chromebooks) and pages cached from before.
        var carry = function(a){
          try {
            var u = new URL(a.href, location.href);
            if (u.origin !== location.origin || !/(\.html|\/)$/.test(u.pathname) || u.searchParams.has('reviewer')) return;
            u.searchParams.set('reviewer', ''); a.href = u.href.replace('reviewer=', 'reviewer');
          } catch (e) {}
        };
        document.querySelectorAll('a[href]').forEach(carry);
        ['click', 'auxclick', 'contextmenu'].forEach(function(ev){

var SK=(function(){

  $('ss-q').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return; qty=b.getAttribute('data-v'); setSeg('ss-q',qty);
    if(qty==='r'){ if(B[A].r===null) A=3; if(B[Bi].r===null) Bi=9; if(A===Bi) Bi=A===9?3:9; }
    sel(); draw();
  });
  $('ss-a').addEventListener('change',function(){ A=+this.value; draw(); });
  $('ss-b').addEventListener('change',function(){ Bi=+this.value; draw(); });
  $('ss-swap').addEventListener('click',function(){ var t=A; A=Bi; Bi=t; sel(); draw(); });
  $('ss-reset').addEventListener('click',function(){ A=3; Bi=9; qty='d'; view='size'; zoom='all'; next='A'; setSeg('ss-q','d'); setSeg('ss-view','size'); setSeg('ss-zoom','all'); zoomShow(); sel(); draw(); });

  // ---------- Questions ----------
  // Four kinds, 8 a round, in the style of 8Ld: a ratio as 1 : n, one size as a percentage of another,
  // a size or distance in the 1 : 350 000 000 model (all typed), and click the planet that fits a comparison.
  function shuffle(x){ x=x.slice(); for(var i=x.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=x[i]; x[i]=x[j]; x[j]=t; } return x; }
  function rnd(a){ return a[Math.floor(Math.random()*a.length)]; }
  var PAIRS_R=[[3,9],[3,8],[3,6],[3,7],[5,3],[1,3],[4,3],[1,6],[5,6],[2,8],[1,9],[3,0]];
  var PAIRS_P=[[5,3],[1,3],[4,3],[2,3],[3,9],[3,6],[9,6],[8,7],[1,5]];
  var CLICK=[
    {i:6,t:'about 11 times as wide as the Earth'},{i:7,t:'about 9½ times as wide as the Earth (without its rings)'},
    {i:5,t:'about half as wide as the Earth'},{i:1,t:'about 38% as wide as the Earth'},
    {i:4,t:'about a quarter as wide as the Earth'},{i:2,t:'about 95% as wide as the Earth'}
  ];
  var deck=[], qn=0, right=0;
  function newDeck(){
    var r=shuffle(PAIRS_R), p=shuffle(PAIRS_P), c=shuffle([0,1,2,3,4,5]);
    deck=shuffle([{kind:'ratio',pr:r[0]},{kind:'ratio',pr:r[1]},{kind:'pct',pr:p[0]},{kind:'pct',pr:p[1]},
      {kind:'model',what:'size'},{kind:'model',what:'dist'},{kind:'click',c:c[0]},{kind:'click',c:c[1]}]);
  }
  function head(){ return '<small>Question '+(qn+1)+' of '+deck.length+' &middot; '+right+' right so far</small>'; }
  function deal(){
    if(qn>=deck.length){ newDeck(); qn=0; right=0; }
    Q=JSON.parse(JSON.stringify(deck[qn])); Q.chosen=null; Q.done=false;
    $('ss-ans').hidden=true; $('ss-in').value=''; $('ss-in').className=''; $('ss-calc').innerHTML=''; $('ss-calc').hidden=true;
    view='size';
    if(Q.kind==='ratio'){
      var a=B[Q.pr[0]], b=B[Q.pr[1]]; Q.n=b.d/a.d; Q.ans=rd(Q.n,1); Q.tol=0.051;
      Q.prompt='The diameter of '+the(a.n)+' is '+sp(a.d)+' km. The diameter of '+the(b.n)+' is '+sp(b.d)+' km. Write the ratio of their diameters, '+a.n+' : '+b.n+', in the form <b>1 : n</b>. What is n, to 1 decimal place?';
      $('ss-in-lab').textContent='1 :'; $('ss-unit').textContent='';
    }else if(Q.kind==='pct'){
      var a2=B[Q.pr[0]], b2=B[Q.pr[1]]; Q.p=a2.d/b2.d*100; Q.ans=Math.round(Q.p); Q.tol=0.51;
      Q.prompt='The diameter of '+the(a2.n)+' is '+sp(a2.d)+' km. The diameter of '+the(b2.n)+' is '+sp(b2.d)+' km. What is '+poss(a2.n)+' diameter as a <b>percentage</b> of '+poss(b2.n)+'? Give it to the nearest whole number.';
      $('ss-in-lab').textContent='Your answer'; $('ss-unit').textContent='%';
    }else if(Q.kind==='model'){
      view='model'; zoom=rnd(['all','inner']);
      if(Q.what==='size'){
        Q.i=rnd([1,2,3,5,6,7,8,9]); var bb=B[Q.i]; Q.ans=rd(modelCm(Q.i),1); Q.tol=Math.max(0.051,Q.ans*0.02);
        Q.prompt='In the model, everything is 350 000 000 times smaller. '+bb.n+' is '+sp(bb.d)+' km across. How big is '+bb.n+' in the model, in <b>cm</b>? Give it to 1 decimal place. (1 km = 100 000 cm)';
        $('ss-unit').textContent='cm';
      }else{
        Q.i=rnd([1,2,3,5,6]); var bd=B[Q.i]; Q.ans=Math.round(modelM(Q.i)); Q.tol=Math.max(1.5,Q.ans*0.02);
        Q.prompt='In the model, everything is 350 000 000 times smaller. '+bd.n+' is '+sp(bd.r)+' million km from the Sun. How far is it from the Sun in the model, in <b>metres</b>? Give it to the nearest metre. (1 million km = 1 000 000 000 m)';
        $('ss-unit').textContent='m';
      }
      $('ss-in-lab').textContent='Your answer';
    }else{
      Q.ans=CLICK[Q.c].i;
      Q.prompt='Click the body that is <b>'+CLICK[Q.c].t+'</b>, then press Go.';
    }
    $('ss-ans').hidden=Q.kind==='click';
    $('ss-note').innerHTML=head()+Q.prompt;
    $('ss-go').disabled=Q.kind==='click'; $('ss-go').hidden=false; $('ss-new').textContent='New question';
    draw();
  }
  $('ss-in').addEventListener('keydown',function(e){ if(e.key==='Enter') $('ss-go').click(); });
  $('ss-go').addEventListener('click',function(){
    if(!Q || Q.done) return;
    var ok, w;
    if(Q.kind==='click'){
      if(Q.chosen==null) return;
      ok=Q.chosen===Q.ans; var c=B[Q.ans], ch=B[Q.chosen];
      w=(ok?'':'That is '+the(ch.n)+': '+sp(ch.d)+' km across, '+sp(sig(ch.d/B[3].d,2))+' times the Earth’s diameter. ')
        +'It is '+the(c.n)+': '+sp(c.d)+' km across.'+eq([['[['+c.n+'|Earth]]','[['+sp(c.d)+'|'+sp(12742)+']]'],['',sp(sig(c.d/12742,3))+(c.d>12742?' (so '+sp(sig(c.d/12742,3))+' times as wide)':' = '+sp(sig(c.d/12742*100,3))+'%')]]);
    }else{
      var v=parseFloat(String($('ss-in').value).replace(',','.'));
      if(isNaN(v)){ $('ss-note').innerHTML=head()+Q.prompt+'<br><i>Type a number first.</i>'; return; }
      ok=Math.abs(v-Q.ans)<=Q.tol; $('ss-in').className=ok?'ok':'no';
      if(Q.kind==='ratio'){ var a=B[Q.pr[0]], b=B[Q.pr[1]];
        w='Divide both numbers by the smaller one, '+sp(a.d)+':'+eq([[a.n+' : '+b.n,sp(a.d)+' : '+sp(b.d)],['','[['+sp(a.d)+'|'+sp(a.d)+']] : [['+sp(b.d)+'|'+sp(a.d)+']]'],['','1 : '+sp(rd(Q.n,3))],['','1 : '+sp(Q.ans)+' (to 1 decimal place)']]); }
      else if(Q.kind==='pct'){ var a2=B[Q.pr[0]], b2=B[Q.pr[1]];
        w=eq([['percentage','[['+sp(a2.d)+'|'+sp(b2.d)+']] × 100'],['',sp(rd(a2.d/b2.d,4))+' × 100'],['',sp(rd(Q.p,1))+'%'],['',sp(Q.ans)+'% (to the nearest whole number)']]); }
      else if(Q.what==='size'){ var bb=B[Q.i];
        w=eq([['model size','[[real size|350 000 000]]'],['','[['+sp(bb.d*100000)+' cm|350 000 000]]'],['',sp(rd(modelCm(Q.i),2))+' cm'],['',sp(Q.ans)+' cm (to 1 decimal place)']])+'About the size of '+bb.like+'.'; }
      else { var bd=B[Q.i];
        w=eq([['model distance','[[real distance|350 000 000]]'],['','[['+sp(bd.r*1e9)+' m|350 000 000]]'],['',sp(Q.ans)+' m']])+'Walking that far takes about '+walk(Q.ans)+'.'; }
      if(!ok) w='The answer is '+(Q.kind==='ratio'?'1 : ':'')+sp(Q.ans)+(Q.kind==='pct'?'%':Q.kind==='model'?(Q.what==='size'?' cm':' m'):'')+'. '+w;
    }
    Q.done=true; if(ok) right++;
    $('ss-go').disabled=true;
    draw();
    if(Q.kind==='click'){
      var mk='';
      [Q.chosen,Q.ans].forEach(function(i,j){ if(j===1 && ok) return; var p=POS[i], R=Math.max(p.r,7)+7, col=(i===Q.ans)?'#4ade80':'#f27159';
        var q=NP(p.x,CL); mk+='<circle cx="'+f(q[0])+'" cy="'+f(q[1])+'" r="'+f(R)+'" fill="none" stroke="'+col+'" stroke-width="3"/>'+SK.txt(q[0]+R*0.75+4,q[1]-R*0.75,i===Q.ans?'✓':'✗',{fs:16,w:700,col:col}); });
      picks.innerHTML=mk;
    }
    $('ss-note').innerHTML=head()+(ok?'<b>✓ Right.</b> ':'<b>✗ Not quite.</b> ')+w;
    qn++; $('ss-new').textContent=qn>=deck.length?'Start again':'Next question';
  });
  $('ss-new').addEventListener('click',function(){ if(Q && !Q.done) qn++; deal(); });

  function setMode(m){
    mode=m;
    Array.prototype.forEach.call($('ss-mode').children,function(b){ b.setAttribute('aria-pressed',b.getAttribute('data-v')===m?'true':'false'); });
    var q=m==='predict';
    ['ss-swap','ss-reset','ss-cmp'].forEach(function(id){ $(id).hidden=q; }); grp('ss-view',q); grp('ss-q',q);
    $('ss-go').hidden=!q; $('ss-new').hidden=!q; $('ss-calc').hidden=q;
    zoomShow();
    if(q){ if(!deck.length) newDeck(); deal(); }
    else{ Q=null; $('ss-ans').hidden=true; view=$('ss-view').querySelector('[aria-pressed="true"]').getAttribute('data-v'); zoom=$('ss-zoom').querySelector('[aria-pressed="true"]').getAttribute('data-v'); zoomShow(); draw(); }
  }
  $('ss-mode').addEventListener('click',function(e){ var b=e.target.closest('button'); if(b) setMode(b.getAttribute('data-v')); });

  window.addEventListener('resize',layout);
  sel(); zoomShow(); layout();
  if(/[?&]show=predict\b/.test(location.search)) setMode('predict');
})();
</script>
<script id="choice-kit-js">
/* Choice kit (12 Nov 2026): the same block on every animation page. See tools/ANIMATION-STYLE.md, "Choices".
   A group of choices with one chosen gets a track round it (class pick); a .to-q button opens the questions from Explore. */
(function(){
  function on(b){ return b.getAttribute('aria-pressed')==='true' || b.classList.contains('is-on'); }
  function each(sel, fn){ Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }
  function mark(s){
    if(!s.classList.contains('pick')){
      var n=0; Array.prototype.forEach.call(s.children, function(b){ if(b.tagName==='BUTTON' && on(b)) n++; });
      if(n===1) s.classList.add('pick');
    }
    if(s.classList.contains('pick') && !s.hasAttribute('data-fit')){
      var d=getComputedStyle(s).display;
      if(d!=='none'){ s.setAttribute('data-fit','1'); if(d.indexOf('flex')>=0) s.classList.add('fit'); }
    }
  }
  each('.seg:not(.tabs):not(.mode):not(.apps)', function(s){
    mark(s);
    if(window.MutationObserver) new MutationObserver(function(){ mark(s); }).observe(s, {childList:true, subtree:true, attributes:true, attributeFilter:['aria-pressed','class']});
  });
  // Choice rows: wrap each .rowlab and the control after it in a .cgroup (label above, groups side by side).
  // A group is hidden when everything in it is hidden, so pages that hide a row's label and control still work.
  function shown(e){ return !e.hidden && e.style.display!=='none'; }
  each('.cgrid:not(.kit)', function(g){
    var kids=Array.prototype.slice.call(g.children), groups=[];
    for(var i=0;i<kids.length;i++){
      var w=document.createElement('div'); w.className='cgroup';
      g.insertBefore(w, kids[i]); w.appendChild(kids[i]);
      if(kids[i].classList.contains('rowlab') && kids[i+1]){ w.appendChild(kids[i+1]); i++; }
      groups.push(w);
    }
    g.classList.add('kit'); if(groups.length===1) g.classList.add('one');
    groups.forEach(function(w){
      function sync(){ var any=false; Array.prototype.forEach.call(w.children, function(c){ if(shown(c)) any=true; }); w.hidden=!any; }
      sync();
      if(window.MutationObserver) Array.prototype.forEach.call(w.children, function(c){ new MutationObserver(sync).observe(c, {attributes:true, attributeFilter:['hidden','style']}); });
    });
  });
  each('.to-q[data-mode]', function(b){
    var seg=document.getElementById(b.getAttribute('data-mode')); if(!seg) return;
    var bs=seg.querySelectorAll('button');
    function sync(){ b.hidden=!on(bs[0]) || !seg.getClientRects().length; }   // hidden too when the page hides its mode switch (e.g. at a level with no questions)
    b.addEventListener('click', function(){ bs[1].click(); bs[1].focus(); });
    if(window.MutationObserver) new MutationObserver(sync).observe(seg, {subtree:true, attributes:true, attributeFilter:['aria-pressed']});
    document.addEventListener('click', function(){ setTimeout(sync, 0); });
    sync(); setTimeout(sync, 0);
  });
})();
</script>
