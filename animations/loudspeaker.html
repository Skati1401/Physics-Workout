<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loudspeaker Animation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1f5; --bg-grid:rgba(29,41,61,0.055);
    --panel:#ffffff; --panel-border:#d7dce4;
    --ink:#182233; --ink-soft:#4c5668; --ink-faint:#8993a5;
    --accent:#d9720c; --accent-soft:#fdead2;
    --good:#15803d; --good-soft:#dcf5e3;
    --bad:#c0311a; --bad-soft:#fbe1db;
    --shadow:0 10px 26px -14px rgba(24,34,51,0.28);
    --topic:#0f7a86;   --topic-soft:#d6f1f3;
    --north:#d23b3b;   --north-soft:#fbdede;
    --south:#2f62d6;   --south-soft:#dde7fb;
    --copper:#b8651b;  --filing:#3b4352;
    --core:#7d8796;    --core-soft:#e3e6eb;
    --font-display:'Big Shoulders',system-ui,sans-serif;
    --font-body:'IBM Plex Sans',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12161f; --bg-grid:rgba(255,255,255,0.045);
      --panel:#1b212e; --panel-border:#2c3444;
      --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;
      --accent:#ff9a3d; --accent-soft:#3a2712;
      --good:#4ade80; --good-soft:#123321;
      --bad:#f27159; --bad-soft:#3a1712;
      --shadow:0 14px 30px -14px rgba(0,0,0,0.55);
      --topic:#4fd1dc; --topic-soft:#123236;
      --north:#ff7a7a; --north-soft:#3d1a1a;
      --south:#7da3ff; --south-soft:#1a2440;
      --copper:#f0a35e; --filing:#c3cad6; --core:#9aa4b5; --core-soft:#2a313d;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12161f; --bg-grid:rgba(255,255,255,0.045);
    --panel:#1b212e; --panel-border:#2c3444;
    --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;
    --accent:#ff9a3d; --accent-soft:#3a2712;
    --good:#4ade80; --good-soft:#123321;
    --bad:#f27159; --bad-soft:#3a1712;
    --shadow:0 14px 30px -14px rgba(0,0,0,0.55);
    --topic:#4fd1dc; --topic-soft:#123236;
    --north:#ff7a7a; --north-soft:#3d1a1a;
    --south:#7da3ff; --south-soft:#1a2440;
    --copper:#f0a35e; --filing:#c3cad6; --core:#9aa4b5; --core-soft:#2a313d;
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      linear-gradient(var(--bg-grid) 1px,transparent 1px) 0 0/100% 34px,
      linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px) 0 0/34px 100%,
      var(--bg);
    color:var(--ink); font-family:var(--font-body); font-size:14px; -webkit-font-smoothing:antialiased;
  }
  [hidden]{display:none!important;}
  button{font:inherit;color:inherit;}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;}

  .page{max-width:1400px;margin-inline:auto;padding-inline:20px;padding-block:12px 40px;}
  h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:0.2px;text-wrap:balance;margin:0;}
  p{margin:0;line-height:1.55;}

  .home-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-bottom:4px;font:600 13px var(--font-mono);color:var(--ink-soft);text-decoration:none;}
  .home-link:hover{color:var(--accent);}
  .page-head{margin-bottom:12px;}
  .eyebrow{font-family:var(--font-mono);font-size:11.5px;color:var(--accent);font-weight:600;margin-bottom:6px;}
  .page-head h1{font-size:clamp(28px,5vw,38px);color:var(--ink);}

  .card{background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;box-shadow:var(--shadow);}
  .btn{
    font-family:var(--font-body);font-weight:600;font-size:13.5px;color:var(--ink);
    background:var(--panel);border:1px solid var(--panel-border);border-radius:9px;
    padding:9px 15px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  }
  .btn:hover{border-color:var(--ink-faint);}
  .btn:disabled{opacity:.45;cursor:default;}
  .btn-primary{background:var(--ink);border-color:var(--ink);color:var(--bg);}
  .btn-primary:hover{opacity:.88;border-color:var(--ink);}
  .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);}
  .btn-group{display:flex;flex-wrap:wrap;gap:10px;}

  /* picture on the left; controls, readings and working on the right */
  .stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);gap:18px 24px;align-items:start;padding:18px;}
  @media (max-width:860px){ .stage{grid-template-columns:minmax(0,1fr);} }
  .view-wrap{position:relative;}
  .view{display:block;width:100%;height:auto;max-height:max(260px,calc(100vh - 290px));touch-action:pan-y;}
  .view-wrap canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  .embed .view{max-height:460px;}
  .under{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;margin-top:12px;}
  .under .btn-group{flex:0 1 auto;}
  .sliders{flex:1 1 300px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px 20px;min-width:0;}
  .view text{font-family:var(--font-mono);}
  .side{display:flex;flex-direction:column;gap:12px;min-width:0;}
  .lab{display:flex;justify-content:space-between;gap:8px;font:12.5px var(--font-mono);color:var(--ink-soft);margin-bottom:6px;}
  .lab output{color:var(--ink);font-weight:600;}
  input[type=range]{width:100%;accent-color:var(--topic);min-height:28px;}
  .seg{display:flex;flex-wrap:wrap;gap:6px;}
  .seg button{font:12.5px var(--font-mono);padding:8px 12px;min-height:44px;border:1px solid var(--panel-border);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer;}
  .seg button[aria-pressed="true"]{background:var(--topic);border-color:var(--topic);color:var(--panel);}
  .seg button:disabled{opacity:.45;cursor:default;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px;}
  .stat{border:1px solid var(--panel-border);border-radius:8px;padding:5px 8px;}
  .stat small{display:block;font:10.5px var(--font-mono);color:var(--ink-faint);}
  .stat strong{font:600 15px var(--font-mono);color:var(--ink);white-space:nowrap;}
  .stat.hi strong{color:var(--accent);}
  .note{font-size:15px;line-height:1.5;color:var(--ink);padding:10px 12px;border-radius:8px;background:var(--bg);min-height:4.6em;}
  .note b{color:var(--topic);}
  .hint{font-size:12.5px;color:var(--ink-soft);}

  details.working summary{cursor:pointer;font:600 13px var(--font-mono);color:var(--topic);min-height:44px;display:flex;align-items:center;}
  .eq{font-family:var(--font-mono);font-size:14px;line-height:1.75;padding:8px 12px;border-left:3px solid var(--topic);background:var(--topic-soft);border-radius:6px;color:var(--ink);}
  .eq b{color:var(--topic);}
  .eqg{display:grid;grid-template-columns:auto auto minmax(0,1fr);column-gap:.45em;row-gap:.2em;align-items:center}
  .eqg-l{justify-self:end;text-align:right}
  .eqg-m{justify-self:center}
  .eqg-r{justify-self:start;min-width:0}
  .eqg-full{grid-column:1/-1}
  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1.25;}
  .frac>span{padding:0 .25em;white-space:nowrap;}
  .frac>span:first-child{border-bottom:1.5px solid currentColor;}
  .dragme{cursor:grab;}
  .dragme:focus{outline:none;}
  .dragme:focus-visible .focus-ring{stroke:var(--accent);stroke-width:3;}
  @media (max-width:560px){ .stage{padding:12px;} .eq{font-size:12.5px;padding:6px 8px;} .note{font-size:14px;} }

  .embed body{background:transparent;}
  .embed .page{padding:0;max-width:none;display:flow-root;}
  .embed .home-link,.embed .page-head{display:none;}
  .embed .hint{display:none;}

  .view{max-height:max(240px,calc(100vh - 330px));}
  .under .sliders{flex-basis:100%;}
</style>
<script>
  // Visit counter (GoatCounter: no cookies, no personal data). Skipped when a page is embedded in a workout, so a visit counts once.
  // pwCountTab(tab, label): counts each workout tab once per visit as a GoatCounter event (path "page#tab"), skipped in frames the same way.
  (function(){
    var off = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var seen = {}, queue = [];
    function send(e){ try { window.goatcounter.count(e); } catch (x) {} }
    window.pwCountTab = function(tab, label){
      if (off || !tab || seen[tab]) return;
      seen[tab] = 1;
      var page = (location.pathname.split('/').pop() || 'index').replace(/\.html$/, '');
      var e = { path: page + '#' + tab, title: (label || tab) + ' \u00b7 ' + document.title, event: true };
      if (window.goatcounter && window.goatcounter.count) send(e); else queue.push(e);
    };
    if (off) return;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://gc.zgo.at/count.js';
    s.setAttribute('data-goatcounter', 'https://physics-workout.goatcounter.com/count');
    s.onload = function(){ var q = queue; queue = []; q.forEach(send); };
    document.head.appendChild(s);
  })();
</script>
</head>
<body>
<div class="page" id="page">
  <a class="home-link" href="igcse.html">&larr; IGCSE animations</a>
  <header class="page-head">
    <div class="eyebrow">Animations &middot; magnetism</div>
    <h1>How a Loudspeaker Works</h1>
  </header>
  <section class="card stage">
    <div>
      <svg class="view" id="ls-svg" viewBox="0 0 640 320" role="img" aria-label="A loudspeaker cut in half: a magnet, a coil fixed to a cone, and the air in front of the cone"></svg>
      <div class="under">
        <div class="btn-group">
          <button class="btn btn-primary" id="ls-play" type="button">&#9654; Switch on</button>
          <button class="btn" id="ls-reset" type="button">&#8634; Reset</button>
          <button class="btn" id="ls-slow" type="button" aria-pressed="false">Slow motion</button>
        </div>
        <div class="sliders">
          <div><label class="lab" for="ls-i"><span>Size of current</span> <output id="ls-io"></output></label><input type="range" id="ls-i" min="1" max="3" step="1" value="2"></div>
          <div><label class="lab" for="ls-f"><span>Frequency of current</span> <output id="ls-fo"></output></label><input type="range" id="ls-f" min="0.5" max="2" step="0.25" value="1"></div>
          <div><label class="lab" for="ls-b"><span>Strength of magnet</span> <output id="ls-bo"></output></label><input type="range" id="ls-b" min="1" max="3" step="1" value="2"></div>
        </div>
      </div>
    </div>
    <div class="side">
      <div>
        <div class="lab">Supply to the coil</div>
        <div class="seg" id="ls-sup"><button type="button" data-v="ac" aria-pressed="true">a.c. from the amplifier</button><button type="button" data-v="dc" aria-pressed="false">Battery (d.c.)</button></div>
      </div>
      <div>
        <div class="lab">Jump to a point</div>
        <div class="seg" id="ls-points"><button type="button" data-v="0.25" aria-pressed="false">Current one way</button><button type="button" data-v="0.5" aria-pressed="false">Current zero</button><button type="button" data-v="0.75" aria-pressed="false">Current the other way</button></div>
      </div>
      <p class="note" id="ls-note" aria-live="polite"></p>
      <div class="stats">
        <div class="stat"><small>Current now</small><strong id="ls-sc">0 A</strong></div>
        <div class="stat"><small>Force on coil</small><strong id="ls-sf">none</strong></div>
        <div class="stat"><small>Cone</small><strong id="ls-sk">still</strong></div>
        <div class="stat hi"><small>Sound frequency</small><strong id="ls-sh">&ndash;</strong></div>
      </div>
      <details class="working">
        <summary>Show the left-hand rule</summary>
        <div class="eq" id="ls-eq"></div>
      </details>
    </div>
  </section>

</div>
<script>
(function(){
  // loudspeaker.html is the one copy of this animation.
  var EMBED = /[?&]embed\b/.test(location.search);
  if(EMBED){
    document.documentElement.classList.add('embed');
    var wk = document.querySelector('details.working'); if(wk) wk.open = true;
    var page = document.getElementById('page');
    var sendHeight = function(){ try{ parent.postMessage({animHeight: Math.ceil(page.getBoundingClientRect().height)}, '*'); }catch(e){} };
    if(window.ResizeObserver) new ResizeObserver(sendHeight).observe(page);
    window.addEventListener('load', sendHeight);
  }
  function $(sel){ return document.querySelector(sel); }
  function num(n, dp){   // round, drop trailing zeros, group thousands with a space from 10 000
    var f = Math.pow(10, dp||0), r = Math.round(n*f)/f, t = String(Math.abs(r));
    if(Math.abs(r)>=10000) t = t.replace(/\B(?=(\d{3})+(?!\d))/g,' ');
    return (r<0?'−':'')+t;
  }
  function FR(t){
    return String(t).replace(/(\d) (?=\d{3}\b)/g,'$1 ')
      .replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g,'<span class="frac"><span>$1</span><span>$2</span></span>');
  }
  function arrowHead(id, col){ return '<marker id="'+id+'" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="'+col+'"/></marker>'; }
  function alignEquals(el){
    if(el.querySelector('.eqg')) return;
    var rows = el.innerHTML.split(/<br\s*\/?>/i).map(function(line){
      var i = line.indexOf(' = ');
      if(i<0) return '<span class="eqg-full">'+line+'</span>';
      return '<span class="eqg-l">'+line.slice(0,i)+'</span><span class="eqg-m">=</span><span class="eqg-r">'+line.slice(i+3)+'</span>';
    });
    el.innerHTML = '<div class="eqg">'+rows.join('')+'</div>';
  }
  function watchEquals(el){ if(!el) return; alignEquals(el); new MutationObserver(function(){ alignEquals(el); }).observe(el, {childList:true}); }
  function pressed(b){ return b.getAttribute('aria-pressed')==='true'; }
  function toggle(b){ b.setAttribute('aria-pressed', String(!pressed(b))); }
  // a row of choice buttons that behaves like a radio group
  function segGroup(el, onPick){
    el.addEventListener('click', function(e){ var b=e.target.closest('button'); if(!b||b.disabled) return; pick(b.dataset.v); onPick(b.dataset.v); });
    function pick(v){ Array.prototype.forEach.call(el.querySelectorAll('button'), function(x){ x.setAttribute('aria-pressed', String(x.dataset.v===v)); }); }
    function value(){ var b=el.querySelector('[aria-pressed="true"]'); return b?b.dataset.v:null; }
    return {pick:pick, value:value};
  }
  // a pole of a magnet: coloured block with its letter
  function poleRect(x,y,w,h,pole,fs){
    var c = pole==='N' ? 'north' : 'south';
    return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="var(--'+c+'-soft)" stroke="var(--'+c+')" stroke-width="2"/>'+
      '<text x="'+(x+w/2)+'" y="'+(y+h/2+(fs||16)*0.36)+'" text-anchor="middle" font-size="'+(fs||16)+'" font-weight="600" fill="var(--'+c+')">'+pole+'</text>';
  }
  // a wire seen end-on: dot = current out of the page, cross = into the page
  function wireEnd(x,y,r,dir,col){
    var g='<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="var(--panel)" stroke="'+(col||'var(--copper)')+'" stroke-width="3"/>';
    if(dir>0) g+='<circle cx="'+x+'" cy="'+y+'" r="'+(r*0.28)+'" fill="var(--ink)"/>';
    else if(dir<0){ var d=r*0.55; g+='<path d="M'+(x-d)+','+(y-d)+' L'+(x+d)+','+(y+d)+' M'+(x+d)+','+(y-d)+' L'+(x-d)+','+(y+d)+'" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>'; }
    return g;
  }
  function line(x1,y1,x2,y2,col,w,extra){ return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+col+'" stroke-width="'+(w||2)+'"'+(extra||'')+'/>'; }
  function txt(x,y,s,o){ o=o||{}; return '<text x="'+x+'" y="'+y+'"'+(o.a?' text-anchor="'+o.a+'"':'')+' font-size="'+(o.fs||11.5)+'" fill="'+(o.c||'var(--ink-soft)')+'"'+(o.w?' font-weight="'+o.w+'"':'')+'>'+s+'</text>'; }
  // pointer position in SVG user units
  function svgPoint(svg, e){ var r=svg.getBoundingClientRect(), vb=svg.viewBox.baseVal; return {x:vb.x+(e.clientX-r.left)/r.width*vb.width, y:vb.y+(e.clientY-r.top)/r.height*vb.height}; }

  var svg=$('#ls-svg'), playBtn=$('#ls-play'), slowBtn=$('#ls-slow'), iIn=$('#ls-i'), fIn=$('#ls-f'), bIn=$('#ls-b'), ptsEl=$('#ls-points');
  var TMAX=6, t=0, running=false, raf=0, last=0, VW=150;   // VW: speed of the sound wave across the picture (px/s)
  var sup=segGroup($('#ls-sup'), changed);
  [iIn,fIn,bIn].forEach(function(x){ x.addEventListener('input', changed); });
  var SIZE=['','small','medium','large'], STR=['','weak','medium','strong'];

  // Slowed right down: real sounds are 20 Hz to 20 000 Hz.
  // Current I > 0 means out of the page at the top of the coil (dot), into the page at the bottom (cross).
  // The centre pole is N and the rim is S, so the field crosses the gap: up at the top, down at the bottom.
  // Left-hand rule: I > 0 gives a force to the LEFT (cone pulled in); I < 0 pushes it out.
  function ac(){ return sup.value()==='ac'; }
  function f(){ return +fIn.value; }
  function Ipk(){ return 0.5*(+iIn.value); }
  function I(tt){ if(tt<=0) return 0; return ac()?Ipk()*Math.sin(2*Math.PI*f()*tt):Ipk()*(1-Math.exp(-tt/0.08)); }
  function B(){ return +bIn.value; }
  function Fk(tt){ return I(tt)*B()/2; }                   // force on the coil, F = BIL in proportion (medium magnet: same size as the current)
  function cone(tt){ return -9*Fk(tt); }                     // cone position (px): follows the force
  function src(tt){ return ac()?cone(tt):-12*Ipk()*B()/2*Math.exp(-Math.pow((tt-0.2)/0.09,2)); }  // what the air sees: d.c. gives one click
  function done(){ return t>=TMAX-1e-9; }
  function on(){ return t>0||running; }
  function arrowLine(x1,y1,x2,y2,col,w,id){ return line(x1,y1,x2,y2,col,w,' marker-end="url(#'+id+')"'); }

  // the air in front of the cone: each particle copies the cone's motion a little later
  function air(x0){
    var g='';
    for(var x=x0;x<=626;x+=13){ var lag=(x-x0+20)/VW, s=on()&&t>lag?src(t-lag):0;
      for(var y=36;y<=286;y+=20){ var jit=((x*7+y*13)%9)-4; g+='<circle cx="'+(x+s*0.9+jit*0.4).toFixed(1)+'" cy="'+(y+((x+y)%3)*3)+'" r="2.6" fill="var(--ink-faint)"/>'; } }
    return g+txt((x0+626)/2,20,'air in front of the cone',{a:'middle'});
  }
  function fieldW(){ return 0.8+0.5*B(); }                  // a stronger magnet: bolder field lines

  function draw2d(cur,dx,cs){
    var g='<defs>'+arrowHead('ls-ba','var(--topic)')+arrowHead('ls-fa','var(--accent)')+'</defs>';
    // magnet, cut in half: S back plate and rims, N centre pole
    g+=poleRect(30,62,26,196,'S',13);
    g+='<rect x="56" y="62" width="96" height="30" fill="var(--south-soft)" stroke="var(--south)" stroke-width="2"/><rect x="56" y="228" width="96" height="30" fill="var(--south-soft)" stroke="var(--south)" stroke-width="2"/>';
    g+=txt(104,82,'S',{a:'middle',fs:13,c:'var(--south)',w:600})+txt(104,248,'S',{a:'middle',fs:13,c:'var(--south)',w:600});
    g+=poleRect(56,136,84,48,'N',16);
    // field across the gaps: up at the top, down at the bottom
    [80,104,128].forEach(function(x){ g+=arrowLine(x,132,x,98,'var(--topic)',fieldW(),'ls-ba')+arrowLine(x,188,x,222,'var(--topic)',fieldW(),'ls-ba'); });
    // coil former (a tube) and cone, moving together
    g+='<g transform="translate('+dx.toFixed(2)+',0)">';
    g+='<rect x="86" y="106" width="76" height="6" fill="var(--panel-border)"/><rect x="86" y="208" width="76" height="6" fill="var(--panel-border)"/>';
    for(var k=0;k<3;k++){ g+=wireEnd(96+k*20,120,8,cs,'var(--copper)')+wireEnd(96+k*20,200,8,-cs,'var(--copper)'); }
    g+='<path d="M162,106 L262,34 L262,286 L162,214 Z" fill="var(--accent-soft)" fill-opacity="0.55" stroke="var(--ink-soft)" stroke-width="2.5" stroke-linejoin="round"/>';
    if(Math.abs(cur)>0.03){ var L=22+20*Math.abs(cur)*B()/2/2.25, d=cur>0?-1:1; g+=arrowLine(212,160,212+d*L,160,'var(--accent)',4,'ls-fa')+txt(212+d*L/2,148,'F',{a:'middle',c:'var(--accent)',w:600}); }
    g+='</g>';
    // the basket that holds the cone (does not move)
    g+='<path d="M152,94 L262,24 M152,226 L262,296" stroke="var(--ink-faint)" stroke-width="1.5" stroke-dasharray="4 4"/>';
    g+=txt(96,284,'coil',{a:'middle',c:'var(--copper)'})+txt(212,312,'cone',{a:'middle'});
    return g+air(290);
  }

  function draw(){
    var cur=on()?I(t):0, dx=on()?cone(t):0, cs=Math.abs(cur)<0.03?0:(cur>0?1:-1);
    svg.innerHTML=draw2d(cur,dx,cs);
    $('#ls-bo').textContent=STR[B()];

    $('#ls-io').textContent=SIZE[+iIn.value]; $('#ls-fo').textContent=num(f(),2)+' Hz (slowed)';
    $('#ls-sc').textContent=(cs<0?'−':'')+num(Math.abs(cur),2)+' A';
    $('#ls-sf').textContent=cs===0?'none':(cs>0?'left':'right');
    var v=on()?(cone(t+0.01)-cone(t-0.01)):0;
    $('#ls-sk').textContent=!on()?'still':(Math.abs(v)<0.04?(Math.abs(dx)>1?(dx<0?'held in':'held out'):'still'):(v<0?'← in':'out →'));
    $('#ls-sh').textContent=ac()?num(f(),2)+' Hz':'no sound';
    var e;
    if(cs===0) e='No current, so no force on the coil.';
    else e='First finger (field): across the gap, from N (centre) to S (rim): up at the top of the coil<br>Second finger (current): '+(cs>0?'out of':'into')+' the page at the top of the coil<br>Thumb (force): to the <b>'+(cs>0?'left':'right')+'</b>, so the cone is '+(cs>0?'pulled in':'pushed out')+'<br>At the bottom of the coil the field and the current are both reversed, so the force is the same way.';
    $('#ls-eq').innerHTML=e;
    var n;
    if(!on()) n=ac()?'Press <b>Switch on</b>. The amplifier sends an <b>alternating current</b> through the coil, which sits in the field of a permanent magnet.':'Press <b>Switch on</b> to connect a battery to the coil instead.';
    else if(!ac()) n=t<0.8?'The steady current gives a force one way, so the cone moves in once and the air hears a single <b>click</b>.':'The current is steady, so the force stays the same and the cone just stays where it is. No vibration, no sound: a loudspeaker needs <b>a.c.</b>';
    else if(done()) n='A bigger current or a stronger magnet gives a bigger force, so the cone moves further: a <b>louder</b> sound. A higher frequency current makes the cone vibrate faster: a <b>higher pitch</b>. The sound has the same frequency as the current.';
    else if(cs===0) n='The current is passing through zero, so for an instant there is <b>no force</b> on the coil.';
    else n='The current in the coil is in the magnet’s field, so the coil feels a force (the motor effect). The current keeps <b>reversing</b>, so the force reverses and the cone moves in and out, squashing and stretching the air into a <b>sound wave</b>.';
    $('#ls-note').innerHTML=n;
    playBtn.innerHTML=running?'&#10074;&#10074; Pause':(done()?'&#9654; Play again':(t>0?'&#9654; Play':'&#9654; Switch on'));
    Array.prototype.forEach.call(ptsEl.children,function(x){ x.disabled=!ac(); });
  }
  function rate(){ return pressed(slowBtn)?0.3:1; }
  function stop(){ running=false; cancelAnimationFrame(raf); }
  function frame(now){ if(!running) return; t=Math.min(TMAX,t+Math.min(0.05,(now-last)/1000)*rate()); last=now;
    if(done()) stop(); draw(); if(running) raf=requestAnimationFrame(frame); }
  function mark(v){ Array.prototype.forEach.call(ptsEl.children,function(x){ x.setAttribute('aria-pressed', String(x.dataset.v===v)); }); }
  function reset(){ stop(); t=0; mark(''); draw(); }
  function changed(){ reset(); }
  playBtn.addEventListener('click',function(){ mark(''); if(running){ stop(); draw(); return; } if(done()) reset(); running=true; last=performance.now(); raf=requestAnimationFrame(frame); draw(); });
  ptsEl.addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b||b.disabled) return; reset(); t=(2+(+b.dataset.v))/f(); mark(b.dataset.v); draw(); });
  slowBtn.addEventListener('click',function(){ toggle(slowBtn); });
  $('#ls-reset').addEventListener('click',reset);
  reset();

})();
</script>
</body>
</html>
