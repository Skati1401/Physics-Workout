  .stat{border:1px solid var(--panel-border);border-radius:8px;padding:5px 8px;display:flex;flex-direction:column;justify-content:space-between;}
  .stat small{display:block;font:10.5px var(--font-mono);color:var(--ink-faint);}
  .stat strong{font:600 14.5px var(--font-mono);color:var(--ink);white-space:nowrap;}

  @media (max-height:700px) and (min-width:861px){ .side{gap:7px;} .side .seg button{min-height:34px;padding-block:4px;} .note{font-size:13.5px;line-height:1.38;padding:7px 10px;min-height:150px;} .side .lab{margin-bottom:3px;} details.working summary{min-height:32px;} }


  /* binding-energy.html: the nuclide symbols, the marker on the curve and the four readings */

  .nu{white-space:nowrap;}

  .view{touch-action:pan-y;}
  .view .be-mark{cursor:grab;outline:none;}
  .view .be-mark:focus-visible .ring{stroke:var(--accent);stroke-width:3.5;}

  .stats{grid-template-columns:repeat(4,minmax(100px,1fr));max-width:600px;}
  .note{min-height:150px;}
  @media (max-width:560px){ .stats{grid-template-columns:1fr 1fr;} .stats .stat.hi{grid-column:auto;} }

  .embed body{background:transparent;}

<script>
  // Visit counter (GoatCounter: no cookies, no personal data). Skipped when a page is embedded in a workout, so a visit counts once.
  // pwCountTab(tab, label): counts each workout tab once per visit as a GoatCounter event (path "page#tab"), skipped in frames the same way.
  (function(){
    var off = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var seen = {}, queue = [];
    function send(e){ try { window.goatcounter.count(e); } catch (x) {} }
    window.pwCountTab = function(tab, label){
      if (off || !tab || seen[tab]) return;
      seen[tab] = 1;
      var page = (location.pathname.split('/').pop() || 'index').replace(/\.html$/, '');
      var e = { path: page + '#' + tab, title: (label || tab) + ' \u00b7 ' + document.title, event: true };
      if (window.goatcounter && window.goatcounter.count) send(e); else queue.push(e);
    };
    if (off) return;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://gc.zgo.at/count.js';
    s.setAttribute('data-goatcounter', 'https://physics-workout.goatcounter.com/count');
    s.onload = function(){ var q = queue; queue = []; q.forEach(send); };
    document.head.appendChild(s);
  })();
</script>

<script>
  // Draft tags and Alex's reviewer button (tools/review/drafts.py writes this block; edit tools/review/snippet.html, then run drafts.py sync).
  // A page is Draft while its row in tools/REVIEW.md is not ✅: <meta name="pw-draft"> on the page, data-draft on its list cards.
  // ?reviewer (once, on any page) turns on reviewer mode in this browser; ?reviewer=off turns it off.
  (function(){
    var on = false, embed = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var m = /[?&]reviewer(?:=([^&]*))?/.exec(location.search);
    on = !!m && m[1] !== 'off';
    try {
      if (m) { if (m[1] === 'off') localStorage.removeItem('pw-reviewer'); else localStorage.setItem('pw-reviewer', '1'); }
      else on = localStorage.getItem('pw-reviewer') === '1';
    } catch (e) {}
    var CSS = '.pw-draft{display:inline-block;vertical-align:middle;margin-left:10px;font:600 11.5px/1.4 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:0;color:var(--bad,#b42318);border:1px dashed currentColor;border-radius:5px;padding:1px 7px;white-space:nowrap}'
      + '.act-top .pw-draft{margin-left:auto;flex:none}.act-top .pw-draft~.cp-tag,.act-top .pw-draft~.ta-tag{margin-left:0}'
      + 'a[data-draft]{position:relative}.pw-draft.pw-corner{position:absolute;top:10px;right:10px;margin:0;background:var(--panel,#fff)}'
      + '.pw-check{display:inline-block;vertical-align:middle;margin-left:8px;font:600 13px/1.4 "IBM Plex Sans",system-ui,sans-serif;color:#fff;background:#1a7f37;border-radius:6px;padding:4px 10px;text-decoration:none;white-space:nowrap}'
      + '.pw-check:hover{background:#116329}.pw-check:focus-visible{outline:2px solid #1a7f37;outline-offset:2px}'
      + '.pw-reviewer{position:fixed;left:10px;bottom:10px;z-index:9999;font:500 12px/1.4 "IBM Plex Mono",ui-monospace,monospace;background:#1d2433;color:#fff;border-radius:6px;padding:4px 9px;opacity:.85}'
      + '.pw-reviewer a{color:#ffc83d}';
    function tag(){ var t = document.createElement('span'); t.className = 'pw-draft'; t.title = 'Not yet checked'; t.textContent = 'Draft'; return t; }
    function go(){
      var st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st);
      var meta = document.querySelector('meta[name="pw-draft"]'), h1 = document.querySelector('h1');
      if (meta && h1 && !embed) {
        h1.appendChild(tag());
        if (on) {
          var page = meta.getAttribute('content'), b = document.createElement('a');
          b.className = 'pw-check'; b.target = '_blank'; b.rel = 'noopener'; b.textContent = '✓ Checked';
          b.title = 'Opens a GitHub issue. Submit it and the Draft tag goes in a minute or two.';
          b.href = 'https://github.com/Skati1401/Physics-Workout/issues/new?title=' + encodeURIComponent('Checked: ' + page)
            + '&body=' + encodeURIComponent('Submit this issue to mark `' + page + '` as checked. The Draft tag goes in a minute or two, and the issue closes itself.');
          h1.appendChild(b);
        }
      }
      document.querySelectorAll('a[data-draft]').forEach(function(a){
        if (a.querySelector('.pw-draft')) return;
        var t = tag(), top = a.querySelector('.act-top');
        if (top) top.insertBefore(t, top.querySelector('.cp-tag,.ta-tag'));
        else { t.className += ' pw-corner'; a.appendChild(t); }
      });
      // No tag on a unit or theme heading (Alex, 12 Nov 2026): only the pages and their cards.
      if (on && !embed) {
        // Carry ?reviewer in every link to another page of the site, so reviewer mode survives
        // browsers that clear site storage (school Chromebooks) and pages cached from before.
        var carry = function(a){
          try {
            var u = new URL(a.href, location.href);
            if (u.origin !== location.origin || !/(\.html|\/)$/.test(u.pathname) || u.searchParams.has('reviewer')) return;
            u.searchParams.set('reviewer', ''); a.href = u.href.replace('reviewer=', 'reviewer');
          } catch (e) {}
        };
        document.querySelectorAll('a[href]').forEach(carry);
        ['click', 'auxclick', 'contextmenu'].forEach(function(ev){
          document.addEventListener(ev, function(e){ var a = e.target.closest && e.target.closest('a[href]'); if (a) carry(a); }, true);
        });
        var r = document.createElement('div'); r.className = 'pw-reviewer';
        r.innerHTML = 'Reviewer mode · <a href="' + location.pathname + '?reviewer=off">turn off</a>';
        document.body.appendChild(r);
      }
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
  })();
</script>

<div class="page" id="page">
  <a class="home-link" href="ial.html">&larr; IAL animations</a>

    <div class="titleblock">

    </div>

  <section class="card stage">

          <div class="stat"><small id="be-s2l"></small><strong id="be-s2">&ndash;</strong></div>

          <div class="stat hi"><small id="be-s4l"></small><strong id="be-s4">&ndash;</strong></div>

<script>

var PW_LEVEL=(location.search.match(/[?&]level=(igcse|ial|ib)\b/)||[])[1]||(/[?&]from=alevel\b/.test(location.search)?'ial':'');
(function(){

(function(){
  // binding-energy.html is the one copy of this animation (TODO.md 9g). This is the Fable half: the pictures and an
  // Explore view. The questions are the second half; they drive the page through window.BE (see the end of this script).
  //
  // The model. Every number comes from one table of atomic masses (RAW, in u). A nucleus's mass is its atomic mass less
  // its electrons, kept as a whole number of millionths of u, so every sum in the working can be checked by hand:
  //   mass defect  dm = Z x 1.007276 + N x 1.008665 - mass of nucleus
  //   binding energy = dm x (the energy of 1 u)   and the curve is binding energy / A.
  // The energy of 1 u is the level's own: IB 931.5 MeV (data booklet); IAL 933.75 MeV, which is what the data sheet's
  // rounded constants give (1.66e-27 kg x (3.00e8)^2 / 1.60e-13 J), so the IAL working ends on the reading shown.
  // The energy of a reaction is (mass before - mass after) x that, and equals the rise in total binding energy exactly,
  // so "from the masses" and "from the curve" in the working always agree.
  // The fission products are real, neutron-rich nuclei, so they lie a little under the line through the stable nuclei.
  // With ?embed the page drops its heading so a workout tab can show it in a frame, and tells that page its height.
  var EMBED = /[?&]embed\b/.test(location.search);

    if(window.ResizeObserver) new ResizeObserver(sendHeight).observe(page);

  }
  function $(s){ return document.querySelector(s); }
  function each(list,f){ Array.prototype.forEach.call(list,f); }
  function pressed(b){ return b.getAttribute('aria-pressed')==='true'; }
  function toggle(b){ b.setAttribute('aria-pressed', String(!pressed(b))); }
  function segGroup(el, onPick){
    el.addEventListener('click', function(e){ var b=e.target.closest('button'); if(!b||b.disabled) return; pick(b.dataset.v); onPick(b.dataset.v); });
    function pick(v){ each(el.querySelectorAll('button'), function(x){ x.setAttribute('aria-pressed', String(x.dataset.v===String(v))); }); }
    function value(){ var b=el.querySelector('[aria-pressed="true"]'); return b?b.dataset.v:null; }

  }
  function FR(t){
    return String(t).replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g,'<span class="frac"><span>$1</span><span>$2</span></span>');
  }
  // Each line of a working readout becomes left | = | right, so the = signs sit under each other.
  function alignEquals(el){
    if(el.querySelector('.eqg')) return;

  function watchEquals(el){ alignEquals(el); new MutationObserver(function(){ alignEquals(el); }).observe(el, {childList:true}); }

  // ---- solid kit (master: tools/solid-kit/kit.js; copied by tools/kits.py, do not edit here) ----
  function f1(n){ return (+n).toFixed(1); }
  function pts(list){ return list.map(function(p){ return f1(p[0])+','+f1(p[1]); }).join(' '); }
  function pl(list,col,w,extra){ return '<polyline points="'+pts(list)+'" fill="none" stroke="'+col+'" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round"'+(extra||'')+'/>'; }
  function pg(list,fill,extra){ return '<polygon points="'+pts(list)+'" fill="'+fill+'"'+(extra||'')+'/>'; }
  function ln(x1,y1,x2,y2,col,w,extra){ return '<line x1="'+f1(x1)+'" y1="'+f1(y1)+'" x2="'+f1(x2)+'" y2="'+f1(y2)+'" stroke="'+col+'" stroke-width="'+(w||1)+'"'+(extra||'')+'/>'; }

  // a solid block: front face at (x, y), w wide and h tall, going back by (dx, dy). Lit top, plain front, darker side.
  function box(x,y,w,h,dx,dy,col,o){ o=o||{};
    return pg([[x,y],[x+w,y],[x+w+dx,y+dy],[x+dx,y+dy]],o.top||col)+(o.top?'':pg([[x,y],[x+w,y],[x+w+dx,y+dy],[x+dx,y+dy]],'#fff',' opacity=".38"'))+
      pg([[x+w,y],[x+w+dx,y+dy],[x+w+dx,y+h+dy],[x+w,y+h]],o.side||col)+(o.side?'':pg([[x+w,y],[x+w+dx,y+dy],[x+w+dx,y+h+dy],[x+w,y+h]],'#000',' opacity=".28"'))+
      rect(x,y,w,h,col); }
  // a round bar or post: a dark core with a lighter streak along it
  function tube(x1,y1,x2,y2,w,col,hi){ var L=Math.hypot(x2-x1,y2-y1)||1, nx=-(y2-y1)/L*w*0.22, ny=(x2-x1)/L*w*0.22; if(ny>0){ nx=-nx; ny=-ny; }
    return ln(x1,y1,x2,y2,col,w,' stroke-linecap="round"')+ln(x1+nx,y1+ny,x2+nx,y2+ny,hi,Math.max(0.8,w*0.3),' stroke-linecap="round"'); }
  function wrapLines(s,n){ var out=[], cur=''; String(s).split(' ').forEach(function(w){ if(cur && (cur+' '+w).length>n){ out.push(cur); cur=w; } else cur=cur?cur+' '+w:w; }); if(cur) out.push(cur); return out; }
  function onPick(svg, fn){
    svg.addEventListener('click', function(e){ var t=e.target.closest('.pick'); if(t){ fn(t.getAttribute('data-pick')); } });
    svg.addEventListener('keydown', function(e){ if(e.key!=='Enter' && e.key!==' ') return; var t=e.target.closest('.pick'); if(t){ e.preventDefault(); fn(t.getAttribute('data-pick')); } });
  }
  function setKeepFocus(el, html){ var f=document.activeElement, k=f && el.contains(f) ? f.getAttribute('data-pick') : null; el.innerHTML=html;

  function ell(cx,cy,rx,ry,fill,extra){ return '<ellipse cx="'+f1(cx)+'" cy="'+f1(cy)+'" rx="'+f1(rx)+'" ry="'+f1(ry)+'" fill="'+fill+'"'+(extra||'')+'/>'; }
  // a solid arrow from (x1, y1) to its tip at (x2, y2)
  function arrow(x1,y1,x2,y2,col,w,extra){ var a=Math.atan2(y2-y1,x2-x1), s=w*2.2, bx=x2-Math.cos(a)*s*1.5, by=y2-Math.sin(a)*s*1.5;
    return '<g'+(extra||'')+'>'+ln(x1,y1,bx,by,col,w)+'<path d="M'+f1(x2)+','+f1(y2)+' L'+f1(bx-Math.sin(a)*s)+','+f1(by+Math.cos(a)*s)+' L'+f1(bx+Math.sin(a)*s)+','+f1(by-Math.cos(a)*s)+' z" fill="'+col+'"/></g>'; }
  // an upright cylinder (a can, a beaker of liquid): top ellipse at yt, bottom at yb. o.top fills the top; o.hi adds a streak of light.
  function cyl(cx,yt,yb,rx,ry,fill,o){ o=o||{};
    return '<path d="M'+f1(cx-rx)+','+f1(yt)+' L'+f1(cx-rx)+','+f1(yb)+' A'+f1(rx)+','+f1(ry)+' 0 0 0 '+f1(cx+rx)+','+f1(yb)+' L'+f1(cx+rx)+','+f1(yt)+' z" fill="'+fill+'"'+(o.extra||'')+'/>'+
      '<path d="M'+f1(cx+rx*0.45)+','+f1(yt)+' L'+f1(cx+rx*0.45)+','+f1(yb+ry*0.85)+' A'+f1(rx)+','+f1(ry)+' 0 0 0 '+f1(cx+rx)+','+f1(yb)+' L'+f1(cx+rx)+','+f1(yt)+' z" fill="#000" opacity="'+(o.shade==null?0.16:o.shade)+'"/>'+
      (o.hi?ln(cx-rx*0.62,yt+ry+4,cx-rx*0.62,yb-2,o.hi,Math.max(1.6,rx*0.11),' stroke-linecap="round" opacity="'+(o.hiop||0.7)+'"'):'')+
      ell(cx,yt,rx,ry,o.top||fill,o.topx||'')+(o.top?'':ell(cx,yt,rx,ry,'#fff',' opacity=".3"')); }
  // a glass thermometer standing upright: bulb at (x, yb); the scale runs from t0 at y0 up to t1 at y1, and the thread stands at T.
  // o.step: a tick every so many degrees; o.num: a number every so many; o.side: numbers on the right (1) or the left (-1); o.from: first tick;
  // o.nobulb: the bulb is out of sight, inside a can or a cube
  function thermo(x,yb,y0,t0,y1,t1,T,o){ o=o||{};
    var w=o.w||7, yT=y1-9, sc=(y1-y0)/(t1-t0), yy=function(t){ return y0+(t-t0)*sc; }, side=o.side||1, fs=o.fs||11, g='', t;
    g+=rect(x-w/2,yT,w,yb-yT,'var(--thermo)',' rx="'+f1(w/2)+'" stroke="var(--ink-faint)" stroke-width="1"');
    g+=ln(x,yb,x,yy(Math.max(t0-4,Math.min(t1+2,T))),'var(--thread)',w*0.36,' stroke-linecap="round"');
    if(!o.nobulb) g+='<circle cx="'+f1(x)+'" cy="'+f1(yb)+'" r="'+f1(w*0.9)+'" fill="var(--thread)" stroke="var(--ink-faint)" stroke-width="0.8"/>'+ell(x-w*0.3,yb-w*0.3,w*0.22,w*0.22,'#fff',' opacity=".7"');
    for(t=(o.from==null?t0:o.from); t<=t1+1e-9; t+=(o.step||10)){ var big=!(Math.round(t)%(o.num||20));
      g+=ln(x+side*w/2,yy(t),x+side*(w/2+(big?7:4)),yy(t),'var(--ink-soft)',big?1.3:0.9);
      if(big && !o.nonum) g+=txt(x+side*(w/2+10),yy(t)+fs*0.36,String(Math.round(t)),{a:side>0?'start':'end',fs:fs,c:'var(--ink)'}); }
    return g; }
  // a stopwatch showing s (for example 1:37)
  function stopwatch(x,y,s,k){ k=k||1; var w=78*k, h=40*k;
    return rect(x+w/2-7*k,y-7*k,14*k,9*k,'var(--steel-sh,#3f4a5e)',' rx="2"')+rect(x,y,w,h,'var(--case,#3f4a5e)',' rx="'+f1(9*k)+'"')+rect(x+2,y+2,w-4,h*0.4,'#fff',' rx="'+f1(8*k)+'" opacity=".12"')+
      rect(x+7*k,y+8*k,w-14*k,h-16*k,'var(--panel)',' rx="3"')+txt(x+w/2,y+h/2+5.5*k,s,{a:'middle',fs:15*k,c:'var(--ink)',w:600}); }
  // ---- end of solid kit ----

  function circ(x,y,r,fill,extra){ return '<circle cx="'+f1(x)+'" cy="'+f1(y)+'" r="'+f1(r)+'" fill="'+fill+'"'+(extra||'')+'/>'; }
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function lerp(a,b,t){ return a+(b-a)*t; }
  function ease(t){ t=clamp(t,0,1); return t*t*(3-2*t); }
  function easeOut(t){ t=clamp(t,0,1); return 1-(1-t)*(1-t); }
  function frac(x){ return x-Math.floor(x); }
  function op(k){ return ' opacity="'+clamp(k,0,1).toFixed(2)+'"'; }

  // ================= the nuclei =================
  var MP=1007276, MN=1008665, ME=548.58;          // proton, neutron and electron, in millionths of u
  // symbol, name, Z, A, atomic mass / u, on the line (1) or off it (0: helium-3 and the neutron-rich fission products)
  var RAW=[
    ['H','hydrogen',1,1,1.007825,1],['H','hydrogen',1,2,2.014102,1],['H','hydrogen',1,3,3.016049,1],['He','helium',2,3,3.016029,0],
    ['He','helium',2,4,4.002603,1],['Li','lithium',3,6,6.015123,1],['Li','lithium',3,7,7.016003,1],['Be','beryllium',4,9,9.012183,1],
    ['B','boron',5,11,11.009305,1],['C','carbon',6,12,12.000000,1],['N','nitrogen',7,14,14.003074,1],['O','oxygen',8,16,15.994915,1],
    ['F','fluorine',9,19,18.998403,1],['Ne','neon',10,20,19.992440,1],['Mg','magnesium',12,24,23.985042,1],['Si','silicon',14,28,27.976927,1],
    ['S','sulfur',16,32,31.972071,1],['Ar','argon',18,40,39.962383,1],['Ti','titanium',22,48,47.947942,1],['Fe','iron',26,56,55.934936,1],
    ['Ni','nickel',28,62,61.928345,1],['Ge','germanium',32,74,73.921178,1],['Kr','krypton',36,84,83.911498,1],['Zr','zirconium',40,90,89.904698,1],
    ['Mo','molybdenum',42,98,97.905405,1],['Pd','palladium',46,106,105.903480,1],['Cd','cadmium',48,112,111.902763,1],['Sn','tin',50,120,119.902202,1],
    ['Xe','xenon',54,132,131.904155,1],['Ba','barium',56,138,137.905247,1],['Nd','neodymium',60,144,143.910093,1],['Sm','samarium',62,152,151.919739,1],
    ['Gd','gadolinium',64,158,157.924112,1],['Er','erbium',68,166,165.930299,1],['Yb','ytterbium',70,174,173.938867,1],['Hf','hafnium',72,180,179.946557,1],
    ['W','tungsten',74,184,183.950933,1],['Pt','platinum',78,195,194.964792,1],['Hg','mercury',80,202,201.970644,1],['Pb','lead',82,208,207.976652,1],
    ['Th','thorium',90,232,232.038054,1],['U','uranium',92,235,235.043930,1],['U','uranium',92,238,238.050788,1],
    ['Kr','krypton',36,92,91.926156,0],['Sr','strontium',38,94,93.915360,0],['Xe','xenon',54,140,139.921640,0],['Ba','barium',56,141,140.914411,0]
  ];
  var NUC={}, LIST=[];
  RAW.forEach(function(r){
    var n={id:r[0]+'-'+r[3], sym:r[0], name:r[1], Z:r[2], A:r[3], N:r[3]-r[2], line:r[5]};
    n.m=Math.round(r[4]*1e6-n.Z*ME); if(n.A===1) n.m=MP;
    n.dm=n.Z*MP+n.N*MN-n.m;

  });
  NUC.n={id:'n', sym:'n', name:'neutron', Z:0, A:1, N:1, m:MN, dm:0, line:0};
  var LINE=LIST.filter(function(n){ return n.line; }).sort(function(a,b){ return a.A-b.A; });
  var levelSeg;
  function lvl(){ return levelSeg ? levelSeg.value() : 'ial'; }
  function ks5(){ return lvl()!=='ks4'; }

  function be(n){ return n.dm*1e-6*uMeV(); }
  function bea(n){ return be(n)/n.A; }
  function curveAt(A){ var i; if(A<=LINE[0].A) return bea(LINE[0]);
    for(i=1;i<LINE.length;i++) if(A<=LINE[i].A){ var a=LINE[i-1], b=LINE[i]; return lerp(bea(a),bea(b),(A-a.A)/(b.A-a.A)); }
    return bea(LINE[LINE.length-1]); }
  function defect(){ return lvl()==='ial' ? 'mass deficit' : 'mass defect'; }

  // ---- the reactions ----
  // in, out: [nucleus, how many]; moves: which marker on the curve goes where; b: the size of a nucleon in the picture

    ba:  {view:'fis', kind:'fis', in:[['U-235',1],['n',1]], out:[['Ba-141',1],['Kr-92',1],['n',3]], moves:[['U-235','Ba-141'],['U-235','Kr-92']], b:4,
          btn:'<sup>235</sup>U &rarr; <sup>141</sup>Ba + <sup>92</sup>Kr'},
    xe:  {view:'fis', kind:'fis', in:[['U-235',1],['n',1]], out:[['Xe-140',1],['Sr-94',1],['n',2]], moves:[['U-235','Xe-140'],['U-235','Sr-94']], b:4,
          btn:'<sup>235</sup>U &rarr; <sup>140</sup>Xe + <sup>94</sup>Sr'},
    fe2: {view:'fis', kind:'split', ks5:1, in:[['Fe-56',1]], out:[['Si-28',2]], moves:[['Fe-56','Si-28']], lab:{'Si-28':'al'}, b:4,
          btn:'<sup>56</sup>Fe &rarr; 2 <sup>28</sup>Si'},
    dt:  {view:'fus', kind:'fus', light:1, in:[['H-2',1],['H-3',1]], out:[['He-4',1],['n',1]], moves:[['H-2','He-4'],['H-3','He-4'],['H-3','n']], b:7,
          btn:'<sup>2</sup>H + <sup>3</sup>H &rarr; <sup>4</sup>He + n'},
    dd:  {view:'fus', kind:'fus', light:1, in:[['H-2',2]], out:[['He-3',1],['n',1]], moves:[['H-2','He-3'],['H-2','n']], b:7,
          btn:'<sup>2</sup>H + <sup>2</sup>H &rarr; <sup>3</sup>He + n'},

  function nuH(n){ return '<span class="nu"><span class="nn"><i>'+n.A+'</i><i>'+n.Z+'</i></span>'+n.sym+'</span>'; }
  function eqH(r){ function side(l){ return l.map(function(p){ return (p[1]>1?p[1]+' ':'')+nuH(NUC[p[0]]); }).join(' + '); } return side(r.in)+' &rarr; '+side(r.out); }

  // ================= drawing the nuclei =================

  function curveLabels(zm){

  // ================= the picture of the nuclei (332 x 236 units) =================
  var CY=112;
  function key(){ return ball(13,14,5,1)+txt(22,18,'proton',{fs:11.5})+ball(84,14,5,0)+txt(93,18,'neutron',{fs:11.5}); }
  function cap(s,k,c){ return '<text x="166" y="230" text-anchor="middle" font-size="11.5" font-weight="600" fill="'+(c||'var(--accent)')+'"'+op(k)+'>'+s+'</text>'; }

  function vArrow(x,y,dx,dy,len,k){ return arrow(x,y,x+dx*len,y+dy*len,'var(--accent)',2.6,op(k)); }

  function stageNuc(){

  var NE=[[212,30],[120,198],[236,202],[92,34]];
  function stageFis(){
    var r=rx(), b=r.b, P=NUC[r.in[0][0]], g=key(), R=rad(P,b), split=r.kind==='split', cx=split?166:150, t0=split?0.3:0.42;

      g+=flash(cx,CY,split?1:seg01(t0,t0+0.2));

  function stageFus(){

  // ================= the readings, the note and the working =================
  function setStat(i,label,html){ $('#be-s'+i+'l').innerHTML=label; $('#be-s'+i).innerHTML=html; }
  function readout(){
    if(!ks5()) return;

  function cap1(t){ return t.charAt(0).toUpperCase()+t.slice(1); }
  function note(){
    var el=$('#be-note'), k5=ks5(), done=phase==='done', t='';
    if(S.view==='nuc'){ var n=nucSel();
      if(n.A===1) t='<b>Hydrogen-1</b> is a single proton. There is nothing to bind, so its binding energy is zero. Drag the nucleus along the curve, or jump to one.';
      else if(!done) t=(/^[aeio]/.test(n.name)?'An':'A')+' <b>'+n.name+'-'+n.A+'</b> nucleus has '+n.Z+(n.Z===1?' proton':' protons')+' and '+n.N+(n.N===1?' neutron':' neutrons')+'. Its mass is less than the mass of the same protons and neutrons when they are separate: the difference is the <b>'+defect()+'</b>, Δm. Drag the nucleus along the curve, then press Pull apart.';
      else t='Energy had to be supplied to separate the nucleus into its protons and neutrons: this is the <b>binding energy</b>, '+mev(be(n))+'. The separate nucleons have more mass than the nucleus, by Δm. Sharing the binding energy between the '+n.A+' nucleons gives '+sig(bea(n),3)+' MeV per nucleon: the greater this is, the more stable the nucleus.'+(n.id==='Fe-56'?' Iron-56 is at the peak of the curve.':'');
    } else { var r=rx(), q=rxQ(r), eq='<span class="rxeq">'+eqH(r)+'</span>';
      if(r.kind==='fis'){ var k=r.out[2][1], kw=k===2?'two':'three';
        if(!k5) t = !done ? '<b>Fission.</b> A uranium-235 nucleus absorbs a neutron and becomes unstable. Press Play.'+eq
          : '<b>Fission.</b> The nucleus has split into two smaller daughter nuclei and '+kw+' neutrons. The total mass is a little less than before: energy has been released, as kinetic energy of the fission products. The daughter nuclei are radioactive.'+eq;
        else t = !done ? '<b>Fission.</b> A uranium-235 nucleus absorbs a neutron, becomes unstable and splits into two smaller nuclei and '+kw+' neutrons. Press Play and watch where the nuclei go on the curve.'+eq
          : 'The two fission products are nearer the peak of the curve: their binding energy per nucleon is greater than uranium-235’s. So the total binding energy has gone up and the total mass has gone down by Δm, and '+mev(q)+' is released as kinetic energy of the products. They have too many neutrons to be stable, so they sit a little under the line and are radioactive.'+eq;
      } else if(r.kind==='fus'){ var h=NUC[r.out[0][0]];
        if(!k5) t = !done ? '<b>Fusion.</b> Two small nuclei of hydrogen, moving at very high speed, collide. Press Play.'+eq
          : '<b>Fusion.</b> The two light nuclei have joined to make a heavier nucleus, '+h.name+'. Mass has been lost and energy has been released. Fission splits one large nucleus into smaller nuclei; fusion joins small nuclei to make a larger one.'+eq;
        else t = !done ? '<b>Fusion.</b> Two light nuclei moving fast enough to get very close, against their electrostatic repulsion, join to make a heavier nucleus. Press Play and watch where the nuclei go on the curve.'+eq
          : h.name.charAt(0).toUpperCase()+h.name.slice(1)+'-'+h.A+' is much higher up the curve than the hydrogen nuclei: the binding energy per nucleon has risen steeply. The total mass has gone down by Δm and '+mev(q)+' is released, shared by only '+sumA(r.in)+' nucleons: more energy per nucleon than fission.'+eq;
      } else if(r.kind==='split'){
        t = !done ? '<b>Would splitting iron release energy?</b> Iron-56 is at the peak of the curve. Press Play to split it into two silicon-28 nuclei.'+eq
          : 'The products are further down the curve: their binding energy per nucleon is less than iron-56’s. The total mass has gone up, so '+mev(q)+' had to be supplied. Fission releases energy only for heavy nuclei, well to the right of the peak.'+eq;
      } else {
        t = !done ? '<b>Would fusing iron release energy?</b> Iron-56 is at the peak of the curve. Press Play to join two iron-56 nuclei.'+eq
          : 'The product is further down the curve: its binding energy per nucleon is less than iron-56’s. The total mass has gone up, so '+mev(q)+' had to be supplied. Fusion releases energy only for light nuclei, to the left of the peak.'+eq;
      }

  // the energy of a mass difference, the way each course does it. dm in millionths of u. Returns lines.
  function energyLines(dm, name){
    var L=[], d=dm*1e-6;
    if(lvl()==='ib'){
      L.push('1 u is 931.5 MeV c<sup>−2</sup>');
      L.push('E = Δm c²');
      L.push('E = '+mu(dm)+' × 931.5');
      L.push('E = <b>'+mev(d*931.5)+'</b>'+(name?' ('+name+')':''));
    } else { var kg=d*1.66e-27, J=kg*9e16;
      L.push('Δm = '+mu(dm)+' × 1.66 × 10<sup>−27</sup>');
      L.push('Δm = '+sci(kg,4)+' kg');
      L.push('ΔE = c²Δm');
      L.push('ΔE = (3.00 × 10<sup>8</sup>)² × '+sci(kg,4));
      L.push('ΔE = '+sci(J,4)+' J');
      L.push('ΔE = [['+sci(J,4)+'|1.60 × 10<sup>−13</sup>]]');
      L.push('ΔE = <b>'+mev(J/1.6e-13)+'</b>'+(name?' ('+name+')':''));
    }
    return L;
  }
  function terms(list,f){ return list.map(function(p){ return (p[1]>1?p[1]+' × ':'')+f(NUC[p[0]]); }).join(' + '); }
  function working(){
    var el=$('#be-eq'), L=[], sum=$('#be-work-sum');
    if(!ks5()){ el.innerHTML=''; return; }
    if(S.view==='nuc'){ var n=nucSel(), parts=n.Z*MP+n.N*MN;
      sum.textContent='Show working: '+defect()+' and binding energy';
      L.push('<b>Masses in u</b>');
      L.push('nucleons = '+n.Z+' × '+mu(MP)+(n.N?' + '+n.N+' × '+mu(MN):''));
      L.push('nucleons = '+mu(parts));
      L.push('nucleus = '+mu(n.m));
      L.push('Δm = '+mu(parts)+' − '+mu(n.m));
      L.push('Δm = '+mu(n.dm)+' u');
      if(n.dm>0){ L=L.concat(energyLines(n.dm,'binding energy'));
        L.push('per nucleon = [['+sig(be(n),4)+'|'+n.A+']]');
        L.push('per nucleon = <b>'+sig(bea(n),3)+' MeV</b>'); }
    } else { var r=rx(), dm=rxDM(r), up=dm>0, mi=sumM(r.in), mo=sumM(r.out), bi=sumBE(r.in), bo=sumBE(r.out);
      sum.textContent='Show working: the energy '+(up?'released':'supplied');
      L.push('<b>From the masses of the nuclei</b>, in u');
      L.push('before = '+terms(r.in,function(n){ return mu(n.m); }));
      if(r.in.length>1||r.in[0][1]>1) L.push('before = '+mu(mi));
      L.push('after = '+terms(r.out,function(n){ return mu(n.m); }));
      if(r.out.length>1||r.out[0][1]>1) L.push('after = '+mu(mo));
      L.push('Δm = '+(up?mu(mi)+' − '+mu(mo):mu(mo)+' − '+mu(mi)));
      L.push('Δm = '+mu(Math.abs(dm))+' u');
      L=L.concat(energyLines(Math.abs(dm),up?'released':'supplied'));
      L.push('<b>From the curve</b>: binding energy is A × binding energy per nucleon, in MeV');
      function bt(list){ var s=list.filter(function(p){ return NUC[p[0]].dm>0; }); return s.map(function(p){ var n=NUC[p[0]]; return (p[1]>1?p[1]+' × ':'')+n.A+' × '+sig(bea(n),4); }).join(' + '); }
      L.push('before = '+bt(r.in));
      L.push('before = '+sig(bi,4));
      L.push('after = '+bt(r.out));
      L.push('after = '+sig(bo,4));
      L.push((up?'released':'supplied')+' = '+(up?sig(bo,4)+' − '+sig(bi,4):sig(bi,4)+' − '+sig(bo,4)));
      L.push((up?'released':'supplied')+' = <b>'+mev(bo-bi)+'</b>');
    }
    el.innerHTML=FR(L.join('<br>'));
  }

  // ================= running it =================
  function goLabel(){ goBtn.innerHTML = phase==='run' ? '&#10074;&#10074; Pause' : (S.view==='nuc' ? '&#9654; Pull apart' : '&#9654; Play'); goBtn.disabled = S.view==='nuc' && nucSel().A===1; }
  function frame(now){
    var dt=Math.min(0.05,(now-last)/1000)*(pressed(slowBtn)?0.3:1); last=now;
    if(phase==='run'){ u=Math.min(1,u+dt/runT()); if(u>=1){ phase='done'; note(); goLabel(); } }
    draw();
    if(phase==='run') raf=requestAnimationFrame(frame);
  }
  function play(){
    if(goBtn.disabled) return;
    if(phase==='run'){ phase='pause'; cancelAnimationFrame(raf); goLabel(); draw(); return; }
    if(phase==='done'||phase==='idle'){ u=0; if(phase==='done'){ phase='idle'; note(); } }
    phase='run'; last=performance.now(); goLabel(); raf=requestAnimationFrame(frame); draw();
  }
  function reset(){ cancelAnimationFrame(raf); phase='idle'; u=0; goLabel(); note(); working(); draw(); }

  // ---- drag the nucleus along the curve (or click the graph); arrow keys when the marker has the focus ----
  function choices(){ return LIST.filter(function(n){ return n.A<=Amax(); }).sort(function(a,b){ return a.A-b.A || bea(a)-bea(b); }); }
  function svgPt(e){ var p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
  function nearest(p){ var best=null, d=1e9; choices().forEach(function(n){ var q=Math.abs(X(n.A)-p.x)+0.35*Math.abs(Y(bea(n))-p.y); if(q<d){ d=q; best=n; } }); return best; }
  function inGraph(p){ return G && p.x>=G.x0-6 && p.x<=G.x1+8 && p.y>=G.y0-8 && p.y<=G.y1+6; }

  // For the second half (the questions): set what is shown, play it, and read what is right.
  //   BE.set({view:'nuc'|'fis'|'fus', nuc:'Fe-56', rx:'ba'|'xe'|'fe2'|'dt'|'dd'|'fefe', zoom:true|false, labels:true|false})

  window.BE={ NUC:NUC, RX:RX, LIST:LIST,
    set:function(o){ o=o||{};
      if(o.nuc && NUC[o.nuc] && o.nuc!=='n') S.nuc=o.nuc;

        +'.teach .side{display:none;}'
        +'.teach .under{display:flex;flex-direction:row;flex-wrap:wrap;margin-top:8px;gap:8px 18px;align-items:flex-end;}'
        +'.teach .under .sliders{flex:1 1 340px;}'
        // small controls: the picture is the display (Alex, 24 Nov 2026: zoomed in on a projector the full-size buttons were huge)
        +'.teach .under .btn{min-height:36px;padding:5px 12px;font-size:14.5px;border-radius:8px;}'
        +'.teach .under .btn-group{gap:6px;}'
        // bigger text that may take two lines ("No / epicycles"), so a group stays narrow (Alex, 24 Nov 2026)
        +'.teach .tk-strip .seg button,.teach .tk-strip .jumprow button{min-height:36px;padding:3px 9px;font-size:14.5px;line-height:1.15;white-space:normal;max-width:calc(10ch + 24px);text-align:center;flex:0 0 auto;}'
        +'.teach .tk-strip .rowlab,.teach .under .lab{font-size:12.5px;margin-bottom:2px;}'
        +'.teach .under input[type=range]{min-height:20px;}'
        +'.tk-strip{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:flex-end;}'
        +'.tk-strip:empty{display:none;}'
        +'.tk-strip>*{margin:0;}'
        +'.tk-pic{position:relative;margin-inline:auto;}'
        +'.tk-on{position:absolute;display:flex;flex-direction:column;gap:4px;padding:3px;border-radius:8px;background:color-mix(in srgb,var(--panel) 80%,transparent);max-width:calc(100% - 12px);}'
        +'.tk-on:empty{display:none;}'
        +'.tk-on.tr{top:6px;right:6px;align-items:flex-end;}.tk-on.tl{top:6px;left:6px;}.tk-on.br{bottom:6px;right:6px;align-items:flex-end;}.tk-on.bl{bottom:6px;left:6px;}'
        +'.tk-on .rowlab{display:none;}'
        +'.tk-on .cgrid.kit,.tk-on .cgrid.kit>.cgroup{gap:0;}'
        +'.tk-on .seg button{min-height:26px;padding:2px 8px;font-size:11.5px;}'
        +'.tk-on .seg{flex-wrap:wrap;justify-content:flex-end;}'
        +'.tk-notes{margin-top:12px;padding:14px;}'
        +'.tk-notes>div{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:10px 18px;align-items:start;}'
        +'.tk-notes .note{min-height:0;}'
        +'.lay-c .stage{grid-template-columns:minmax(0,1fr) 250px;}'
        +'.lay-c .side{display:flex;}'
        +'@media (max-width:860px){ .lay-c .stage{grid-template-columns:minmax(0,1fr);} }';
      document.head.appendChild(st);
    }
    // the title line: back link, title, student version, layout picker
    var home=document.querySelector('.home-link'); if(home && head) head.insertBefore(home, head.firstChild);
    if(o.q && head){ var a=document.createElement('a'); a.className='tk-q'; a.href=o.q.href; a.innerHTML=o.q.label||'Student version with questions &rarr;'; head.appendChild(a); }
    if(o.mode && $(o.mode)) $(o.mode).hidden=true;   // the Choice kit then hides "Try the questions" too
    // Notes: everything left in the side column that is not a choice
    var notes=document.createElement('div'); notes.className='card tk-notes'; notes.hidden=true;
    var inner=document.createElement('div'); notes.appendChild(inner);
    Array.prototype.slice.call(side.children).forEach(function(c){ if(c.id!==o.mode && strip.indexOf(c)<0 && pics.indexOf(c)<0) inner.appendChild(c); });
    stage.parentNode.insertBefore(notes, stage.nextSibling);
    // Notes goes in the main button row: the one with "Try the questions" if there is one (a page may have a hidden Questions row first)
    var tq=under.querySelector('.btn-group .to-q'), bg=tq?tq.parentNode:under.querySelector('.btn-group'), nb=document.createElement('button');
    nb.className='btn'; nb.type='button'; nb.textContent='Notes'; nb.setAttribute('aria-expanded','false');
    var toq=bg.querySelector('.to-q'); bg.insertBefore(nb, toq||null);
    nb.addEventListener('click',function(){ notes.hidden=!notes.hidden; nb.setAttribute('aria-expanded',notes.hidden?'false':'true'); if(!notes.hidden) notes.scrollIntoView({block:'nearest'}); });
    // where the choices go
    var row=document.createElement('div'); row.className='tk-strip'; under.insertBefore(row, under.firstChild);
    var wrap=document.createElement('div'); wrap.className='tk-pic'; svg.parentNode.insertBefore(wrap, svg); wrap.appendChild(svg);
    var on=document.createElement('div'); on.className='tk-on '+(o.pin||'tr'); wrap.appendChild(on);
    function fit(){
      svg.style.maxHeight=''; wrap.style.maxWidth='';
      if(window.innerWidth<=560) return;
      var r=stage.getBoundingClientRect(), sv=svg.getBoundingClientRect(), rest=r.height-sv.height;
      if(L==='c') rest=Math.max(0, left.getBoundingClientRect().height-sv.height)+24;
      var mh=Math.max(260, Math.floor(window.innerHeight-(r.top+window.scrollY)-rest-12));
      svg.style.maxHeight=mh+'px';
      // the box round the picture is only as wide as the picture drawn, so anything laid on a corner stays on it
      var vb=svg.viewBox && svg.viewBox.baseVal;
      if(vb && vb.height) wrap.style.maxWidth=Math.floor(mh*vb.width/vb.height)+'px';
    }
    function layout(x){
      L=x; root.classList.remove('lay-a','lay-b','lay-c'); root.classList.add('lay-'+x);
      var hide=x==='b' && o.pin==='hide';
      if(x==='c'){ strip.concat(pics).forEach(function(e){ side.appendChild(e); }); }
      else{
        strip.forEach(function(e){ row.appendChild(e); });
        pics.forEach(function(e){ (x==='b' && !hide ? on : row).appendChild(e); });
      }
      pics.forEach(function(e){ e.style.display=hide?'none':''; });
      if(lp) Array.prototype.forEach.call(lp.querySelectorAll('button'),function(b){ b.setAttribute('aria-pressed',b.getAttribute('data-l')===x?'true':'false'); });
      if(o.trial){ try{ var u=new URL(location.href); u.searchParams.set('layout',x); history.replaceState(null,'',u.href); }catch(e){} }
      if(o.onLayout) o.onLayout(x);
      fit();
    }
    var lp=null;
    if(o.trial && head){
      lp=document.createElement('div'); lp.className='tk-lay';
      lp.innerHTML='<span id="tk-lay-lab">Layout</span><div class="seg pick fit" role="group" aria-labelledby="tk-lay-lab"><button type="button" data-l="a">A</button><button type="button" data-l="b">B</button><button type="button" data-l="c">C</button></div>';
      head.appendChild(lp);
      lp.addEventListener('click',function(e){ var b=e.target.closest('button'); if(b) layout(b.getAttribute('data-l')); });
    }
    layout((location.search.match(/[?&]layout=([abc])\b/)||[])[1]||o.layout||'b');
    window.addEventListener('resize',fit); window.addEventListener('load',fit); setTimeout(fit,0);
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
    if(window.ResizeObserver) new ResizeObserver(function(){ requestAnimationFrame(fit); }).observe(under);
    return {fit:fit, layout:function(){ return L; }};
  }
  // ---- end of teach kit ----
  teachPage({svg:svg, strip:['be-view-wrap','be-rx-wrap','be-jump-wrap'], q:null});

  var qs=location.search, m;
  if(PW_LEVEL) levelSeg.pick(PW_LEVEL==='igcse'?'ks4':PW_LEVEL);
  if((m=qs.match(/[?&]nuc=([A-Za-z]+-\d+)/)) && NUC[m[1]]) S.nuc=m[1];
  if((m=qs.match(/[?&]rx=(\w+)/)) && RX[m[1]]){ S[RX[m[1]].view]=m[1]; S.view=RX[m[1]].view; }
  if((m=qs.match(/[?&]view=(nuc|fis|fus)\b/))) S.view=m[1];
  if(/[?&]labels\b/.test(qs)) S.labels=true;
  setView(S.view);
  if((m=qs.match(/[?&]zoom=([01])\b/))){ S.zoom=m[1]==='1' && (S.view==='nuc' ? nucSel().A<=20 : !!rx().light); syncUI(); reset(); }
})();
</script>
<script id="choice-kit-js">
/* Choice kit (12 Nov 2026): the same block on every animation page. See tools/ANIMATION-STYLE.md, "Choices".
   A group of choices with one chosen gets a track round it (class pick); a .to-q button opens the questions from Explore. */
(function(){
  function on(b){ return b.getAttribute('aria-pressed')==='true' || b.classList.contains('is-on'); }
  function each(sel, fn){ Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }
  function mark(s){
    if(!s.classList.contains('pick')){
      var n=0; Array.prototype.forEach.call(s.children, function(b){ if(b.tagName==='BUTTON' && on(b)) n++; });
      if(n===1) s.classList.add('pick');
    }
    if(s.classList.contains('pick') && !s.hasAttribute('data-fit')){
      var d=getComputedStyle(s).display;
      if(d!=='none'){ s.setAttribute('data-fit','1'); if(d.indexOf('flex')>=0) s.classList.add('fit'); }
    }
  }
  each('.seg:not(.tabs):not(.mode):not(.apps)', function(s){
    mark(s);
    if(window.MutationObserver) new MutationObserver(function(){ mark(s); }).observe(s, {childList:true, subtree:true, attributes:true, attributeFilter:['aria-pressed','class']});
  });
  // Choice rows: wrap each .rowlab and the control after it in a .cgroup (label above, groups side by side).
  // A group is hidden when everything in it is hidden, so pages that hide a row's label and control still work.
  function shown(e){ return !e.hidden && e.style.display!=='none'; }
  each('.cgrid:not(.kit)', function(g){
    var kids=Array.prototype.slice.call(g.children), groups=[];
    for(var i=0;i<kids.length;i++){
      var w=document.createElement('div'); w.className='cgroup';
      g.insertBefore(w, kids[i]); w.appendChild(kids[i]);
      if(kids[i].classList.contains('rowlab') && kids[i+1]){ w.appendChild(kids[i+1]); i++; }
      groups.push(w);
    }
    g.classList.add('kit'); if(groups.length===1) g.classList.add('one');
    groups.forEach(function(w){
      function sync(){ var any=false; Array.prototype.forEach.call(w.children, function(c){ if(shown(c)) any=true; }); w.hidden=!any; }
      sync();
      if(window.MutationObserver) Array.prototype.forEach.call(w.children, function(c){ new MutationObserver(sync).observe(c, {attributes:true, attributeFilter:['hidden','style']}); });
    });
  });
  each('.to-q[data-mode]', function(b){
    var seg=document.getElementById(b.getAttribute('data-mode')); if(!seg) return;
    var bs=seg.querySelectorAll('button');
    function sync(){ b.hidden=!on(bs[0]) || !seg.getClientRects().length; }   // hidden too when the page hides its mode switch (e.g. at a level with no questions)
    b.addEventListener('click', function(){ bs[1].click(); bs[1].focus(); });
    if(window.MutationObserver) new MutationObserver(sync).observe(seg, {subtree:true, attributes:true, attributeFilter:['aria-pressed']});
    document.addEventListener('click', function(){ setTimeout(sync, 0); });
    sync(); setTimeout(sync, 0);
  });
})();
</script>
