<!doctype html>
<html lang="en">

<title>Simple Harmonic Motion Animation</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%231d2433%27/%3E%3Cpath d=%27M18.5 3 7 18h7.5l-2 11L25 13h-7.5z%27 fill=%27%23ffc83d%27 stroke=%27%23ffe08a%27 stroke-width=%271%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<meta name="description" content="Interactive physics animation for Edexcel IAL (5.5 Oscillations) and IB (C.1). A mass on a spring and a pendulum in simple harmonic motion, with graphs of displacement, velocity and acceleration against time and of the energy, damping, questions on the graphs, and an Experiment mode: time the oscillations and find the stiffness of the spring or g.">

<style>
  :root{
    --bg:#eef1f5; --bg-grid:rgba(29,41,61,0.055);
    --panel:#ffffff; --panel-border:#d7dce4;
    --ink:#182233; --ink-soft:#4c5668; --ink-faint:#8993a5;
    --accent:#d9720c; --accent-soft:#fdead2;
    --good:#15803d; --good-soft:#dcf5e3;
    --bad:#c0311a; --bad-soft:#fbe1db;
    --shadow:0 10px 26px -14px rgba(24,34,51,0.28);
    /* instrument kit colours */ --cur:#7c3aed; --lead:#3a4352; --lead-hi:#7d8899; --lead-v:#8791a3; --case-f:#4a5464; --case-t:#687385; --case-s:#343c4a; --lcd:#d5dec8; --lcd-ink:#1d2a1f; --plug-r:#d94444; --plug-k:#262d3a; --insul:#262d3a;
    --steel:#66748c; --steel-hi:#c3ccda; --steel-sh:#3f4a5e; --wood-f:#c99e6a; --wood-t:#e3c08f; --wood-s:#9c7444; --brass:#c9a13b; --brass-hi:#f0d78a; --copper:#b8651b; --copper-hi:#e6a25c;
    --glass:#9fb4c8; --glass-in:#f4f8fb; --rule-t:#f3e2ab; --rule-f:#d9c27e; --rule-ink:#5b4a1f; --ceramic:#e4e1d3; --thermo:#f3f6fa; --thread:#d7261e; --case:#3f4a5e;
    --topic:#b45309;   --topic-soft:#fdecc8;
    --hot:#dc2626; --xc:#2563eb; --vc:#0f766e; --ac:#d9720c;
    --water:#d6e9fb;   --ice:#ffffff;
    --font-display:'Big Shoulders',system-ui,sans-serif;
    --font-body:'IBM Plex Sans',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12161f; --bg-grid:rgba(255,255,255,0.045);
      --panel:#1b212e; --panel-border:#2c3444;
      --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;
      --accent:#ff9a3d; --accent-soft:#3a2712;
      --good:#4ade80; --good-soft:#123321;
      --bad:#f27159; --bad-soft:#3a1712;
      --shadow:0 14px 30px -14px rgba(0,0,0,0.55);
      /* instrument kit colours */ --cur:#c4a1ff; --lead:#566072; --lead-hi:#8e99ab; --lead-v:#8791a3; --case-f:#667083; --case-t:#8a94a6; --case-s:#4a5364; --lcd:#c6d0b8; --lcd-ink:#172018; --plug-r:#d95252; --plug-k:#0c1017; --insul:#0c1017;
      --steel:#8f9db3; --steel-hi:#dfe5ee; --steel-sh:#566179; --wood-f:#8a6a43; --wood-t:#a8855a; --wood-s:#644b2d; --brass:#b8943a; --brass-hi:#e8cf86; --copper:#f0a35e; --copper-hi:#ffd0a0;
      --glass:#7f97ad; --glass-in:#202938; --rule-t:#d9c88f; --rule-f:#b39f63; --rule-ink:#3d3214; --ceramic:#b9b6a6; --thermo:#dfe6ee; --thread:#e5392f; --case:#56617a;
      --topic:#fbbf24; --topic-soft:#3a2a0c;
      --hot:#f87171; --xc:#7fb0ff; --vc:#2dd4bf; --ac:#ff9a3d;
      --water:#1c3a5a; --ice:#c9d6e6;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12161f; --bg-grid:rgba(255,255,255,0.045);
    --panel:#1b212e; --panel-border:#2c3444;
    --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;
    --accent:#ff9a3d; --accent-soft:#3a2712;
    --good:#4ade80; --good-soft:#123321;
    --bad:#f27159; --bad-soft:#3a1712;
    --shadow:0 14px 30px -14px rgba(0,0,0,0.55);
    /* instrument kit colours */ --cur:#c4a1ff; --lead:#566072; --lead-hi:#8e99ab; --lead-v:#8791a3; --case-f:#667083; --case-t:#8a94a6; --case-s:#4a5364; --lcd:#c6d0b8; --lcd-ink:#172018; --plug-r:#d95252; --plug-k:#0c1017; --insul:#0c1017;
      --steel:#8f9db3; --steel-hi:#dfe5ee; --steel-sh:#566179; --wood-f:#8a6a43; --wood-t:#a8855a; --wood-s:#644b2d; --brass:#b8943a; --brass-hi:#e8cf86; --copper:#f0a35e; --copper-hi:#ffd0a0;
      --glass:#7f97ad; --glass-in:#202938; --rule-t:#d9c88f; --rule-f:#b39f63; --rule-ink:#3d3214; --ceramic:#b9b6a6; --thermo:#dfe6ee; --thread:#e5392f; --case:#56617a;
    --topic:#fbbf24; --topic-soft:#3a2a0c;
      --hot:#f87171; --xc:#7fb0ff; --vc:#2dd4bf; --ac:#ff9a3d;
      --water:#1c3a5a; --ice:#c9d6e6;
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      linear-gradient(var(--bg-grid) 1px,transparent 1px) 0 0/100% 34px,
      linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px) 0 0/34px 100%,
      var(--bg);
    color:var(--ink); font-family:var(--font-body); font-size:14px; -webkit-font-smoothing:antialiased;
  }
  [hidden]{display:none!important;}
  button{font:inherit;color:inherit;}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;}

  .page{max-width:1400px;margin-inline:auto;padding-inline:20px;padding-block:12px 40px;}
  h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:0.2px;text-wrap:balance;margin:0;}
  p{margin:0;line-height:1.55;}

  .home-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-bottom:4px;font:600 13px var(--font-mono);color:var(--ink-soft);text-decoration:none;}
  .home-link:hover{color:var(--accent);}
  .page-head{margin-bottom:12px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px;}
  .eyebrow{font-family:var(--font-mono);font-size:11.5px;color:var(--accent);font-weight:600;margin-bottom:6px;}
  .page-head h1{font-size:clamp(28px,5vw,38px);color:var(--ink);}

  .card{background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;box-shadow:var(--shadow);}
  .btn{
    font-family:var(--font-body);font-weight:600;font-size:13.5px;color:var(--ink);
    background:var(--panel);border:1px solid var(--panel-border);border-radius:9px;
    padding:9px 15px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  }
  .btn:hover{border-color:var(--ink-faint);}
  .btn:disabled{opacity:.45;cursor:default;}
  .btn-primary{background:var(--ink);border-color:var(--ink);color:var(--bg);}
  .btn-primary:hover{opacity:.88;border-color:var(--ink);}
  .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);}
  .btn-group{display:flex;flex-wrap:wrap;gap:10px;}
  /* button rows fill their width (Alex, 2 Nov 2026) */
  .btn-group>.btn,.exp-btns>.btn{flex:1 1 0;min-width:max-content;justify-content:center;}
  .seg:not(.tabs){display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,96px),1fr));}
  .seg:not(.tabs)>button{padding-inline:4px;white-space:nowrap;}

  /* picture on the left with its buttons under it; choices, readings and working on the right */
  .stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,410px);gap:18px 24px;align-items:start;padding:18px;}
  @media (max-width:860px){ .stage{grid-template-columns:minmax(0,1fr);} }
  .view{display:block;width:100%;height:auto;max-height:max(260px,calc(100vh - 335px));touch-action:pan-y;}
  .view.tall,.embed .view.tall{max-height:none;}
  .view text{font-family:var(--font-mono);}
  .under{display:flex;flex-direction:column;gap:12px;margin-top:12px;}
  .sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px 24px;}
  .side{display:flex;flex-direction:column;gap:12px;min-width:0;}
  .lab{display:block;font:12.5px var(--font-mono);color:var(--ink-soft);margin-bottom:6px;}
  .lab output{color:var(--ink);font-weight:600;white-space:nowrap;margin-left:6px;}
  input[type=range]{width:100%;accent-color:var(--topic);min-height:28px;}
  .seg{display:flex;flex-wrap:wrap;gap:6px;}
  .seg button{font:12.5px var(--font-mono);padding:8px 11px;min-height:44px;border:1px solid var(--panel-border);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer;}
  .seg button[aria-pressed="true"]{background:var(--topic);border-color:var(--topic);color:var(--panel);}
  .seg button:disabled{opacity:.45;cursor:default;}
  .seg.tabs{gap:0;flex-wrap:nowrap;}
  .seg.tabs button{white-space:nowrap;border-radius:0;margin-left:-1px;}
  .seg.tabs button:first-child{border-radius:8px 0 0 8px;margin-left:0;}
  .seg.tabs button:last-child{border-radius:0 8px 8px 0;}
  .cgrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center;}
  .rowlab{font:11.5px var(--font-mono);color:var(--ink-faint);}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px;}
  .stat{border:1px solid var(--panel-border);border-radius:8px;padding:5px 8px;display:flex;flex-direction:column;justify-content:space-between;}
  .stat small{display:block;font:10.5px var(--font-mono);color:var(--ink-faint);}
  .stat strong{font:600 15px var(--font-mono);color:var(--ink);white-space:nowrap;}
  .stat.hi strong{color:var(--topic);}
  .note{font-size:15px;line-height:1.5;color:var(--ink);padding:10px 12px;border-radius:8px;background:var(--bg);min-height:4.6em;}
  .note b{color:var(--topic);}

  details.working summary{cursor:pointer;font:600 13px var(--font-mono);color:var(--topic);min-height:44px;display:flex;align-items:center;}
  .eq{font-family:var(--font-mono);font-size:14px;line-height:1.75;padding:8px 12px;border-left:3px solid var(--topic);background:var(--topic-soft);border-radius:6px;color:var(--ink);}
  .eq b{color:var(--topic);}
  .eq + .eq{margin-top:8px;}
  .eqnote{font-size:13.5px;color:var(--ink-soft);margin-top:8px;}
  .eqg{display:grid;grid-template-columns:auto auto minmax(0,1fr);column-gap:.45em;row-gap:.2em;align-items:center}
  .eqg-l{justify-self:end;text-align:right}
  .eqg-m{justify-self:center}
  .eqg-r{justify-self:start;min-width:0}
  .eqg-full{grid-column:1/-1}
  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1.25;}
  .frac>span{padding:0 .25em;white-space:nowrap;}
  .frac>span:first-child{border-bottom:1.5px solid currentColor;}
  @media (max-width:560px){ .stage{padding:12px;} .view{max-height:none;} .eq{font-size:12px;padding:6px 8px;} .note{font-size:14px;} }

  /* ===== Experiment kit (tools/experiment-kit/kit.css) ===== */
  .exp-btns{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;}
  .view.dragging,.view.dragging *{cursor:grabbing;}
  .grab{cursor:grab;}
  .view:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px;}
  .rtable{width:100%;border-collapse:collapse;font:12.5px var(--font-mono);}
  .rtable th{position:sticky;top:0;background:var(--panel);font-weight:600;font-size:11px;color:var(--ink-faint);text-align:right;padding:4px 6px;border-bottom:1px solid var(--panel-border);}
  .rtable td{text-align:right;padding:3px 6px;border-bottom:1px solid var(--panel-border);color:var(--ink);}
  .rtable tr.new td{background:var(--cs, var(--accent-soft));}
  .rtable-wrap{max-height:150px;overflow:auto;border:1px solid var(--panel-border);border-radius:8px;}
  @media (prefers-reduced-motion: no-preference){ .rtable tr.new td{animation:rowin .35s ease-out;} }
  @keyframes rowin{from{opacity:0}to{opacity:1}}
  /* ===== end of Experiment kit ===== */

  /* mystery-beaker answer box */
  .guess{border:1px solid var(--panel-border);border-radius:8px;padding:8px 10px;}
  .guess-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
  .guess-row input{width:110px;min-height:44px;font:600 15px var(--font-mono);padding:6px 8px;border:1px solid var(--panel-border);border-radius:8px;background:var(--panel);color:var(--ink);}
  .guess-row .unit{font:13px var(--font-mono);color:var(--ink-soft);}
  .gfb{font-size:14px;margin-top:6px;min-height:1.4em;}
  .gfb.ok{color:var(--good);font-weight:600;} .gfb.no{color:var(--bad);font-weight:600;}
  .seg button sub,.stat sub{font-size:.75em;}
  .cgrid>[hidden]{display:none!important;}

  /* inside a workout tab (?embed): no page heading, no outer margins */
  .embed body{background:transparent;}
  .embed .page{padding:0;max-width:none;display:flow-root;}
  .embed .home-link,.embed .page-head{display:none;}
  .embed .view{max-height:460px;}

  .toprow{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;}
  .rtw{white-space:nowrap;}
  .rt{display:inline-block;vertical-align:middle;border-top:1.5px solid currentColor;padding:1px .15em 0;line-height:1.2;}
  .rt .frac{margin:0;}
  .view .pick{cursor:pointer;}
  .view .pick:focus{outline:none;}
  .view .pick:focus-visible .ring{stroke:var(--accent);stroke-width:3.2;}
  .view .knob{cursor:grab;}
  .fine{display:flex;flex-wrap:wrap;gap:10px;}
  .fine>.btn{flex:1 1 0;min-width:max-content;justify-content:center;font-family:var(--font-mono);font-size:13px;}
  @media (max-width:560px){ .fine>.btn{flex:1 1 40%;} }
  #sh-sys,#sh-damp,#sh-start,#sh-jump,#sh-graph,#sh-load{display:flex;flex-wrap:wrap;}
  #sh-load>button,#sh-jump>button{padding-inline:8px;}
  #sh-tablewrap{max-height:104px;}
  .stats.six{grid-template-columns:repeat(3,minmax(0,1fr));}
  .stat sub{font-size:.75em;}
  @media (max-width:560px){ .stats.six{grid-template-columns:repeat(2,minmax(0,1fr));} }
  #sh-start>button{padding-inline:6px;min-width:34px;}
  #sh-jump>button:nth-child(n),#sh-sys>button:nth-child(n),#sh-damp>button:nth-child(n){padding-inline:6px;}
  /* this page has three graphs and three rows of choices: a slightly shorter picture and closer rows keep the card on one laptop screen */
  @media (min-width:861px){ .stage{grid-template-columns:minmax(0,1fr) minmax(300px,440px);} .side{gap:10px;} .side .seg:not(.mode) button{min-height:38px;padding-block:5px;} .view{max-height:max(250px,calc(100vh - 343px));} .under{gap:10px;} .under .seg button{min-height:38px;padding-block:5px;}
    #sh-sliders>div{display:flex;align-items:center;gap:10px;} #sh-sliders .lab{margin:0;white-space:nowrap;} #sh-sliders input{flex:1;min-width:60px;} }
  .guess label{font:12.5px var(--font-mono);color:var(--ink-soft);}
  .meas-off{display:none !important;}
  /* a short laptop window: closer rows, shorter buttons and a smaller note, so the card still fits one screen */
  @media (max-height:640px) and (min-width:861px){ .side{gap:8px;} .side .seg button{min-height:36px;padding-block:5px;} .seg.mode>button:nth-child(n){min-height:32px;} .note{font-size:14px;min-height:0;padding:8px 10px;} details.working summary{min-height:36px;} #sh-tablewrap{max-height:84px;} }
  /* Experiment has a table as well, so its rows sit closer and its buttons are shorter */
  @media (min-width:861px){ .side.exp{gap:8px;} .side.exp .seg button{min-height:36px;padding-block:5px;} .side.exp .note{min-height:0;font-size:14px;} }
</style>
<style id="choice-kit">
/* Choice kit (12 Nov 2026): the same block on every animation page. See tools/ANIMATION-STYLE.md, "Choices". */
.seg.pick{background:var(--bg);box-shadow:inset 0 0 0 1px var(--panel-border);border-radius:8px;}
.seg.pick.fit{width:fit-content;max-width:100%;}
.seg.pick>button:not([aria-pressed="true"]):not(.is-on){background:transparent;border-color:transparent;}
.seg.pick>button:not([aria-pressed="true"]):not(.is-on):not(:disabled):hover{background:var(--panel);border-color:var(--panel-border);}
.seg.mode{display:flex;flex-wrap:nowrap;align-self:stretch;flex-grow:1;background:var(--bg);box-shadow:0 0 0 1px var(--panel-border);border-radius:11px;padding:3px;gap:3px;}
.seg.mode>button:nth-child(n){flex:1 1 0;min-height:38px;margin-left:0;padding:6px 12px;border-radius:8px;white-space:nowrap;font:600 14.5px var(--font-body,inherit);}
.seg.mode>button:nth-child(n):not([aria-pressed="true"]){background:transparent;border-color:transparent;color:var(--ink);}
.seg.mode>button:nth-child(n):not([aria-pressed="true"]):hover{background:var(--panel);border-color:var(--panel-border);}
.seg.mode>button:nth-child(n)[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel);}
/* Choice rows (13 Nov 2026, Alex): in a .cgrid the label sits above its group, each group is only as wide as its
   buttons, and short groups share a row, as on dc-motor.html. The script wraps each label and its control in a .cgroup. */
.cgrid.kit{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-start;}
.cgrid.kit>.cgroup{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;max-width:100%;}
/* a row of one group (e.g. Graph under the picture) keeps its label beside it, to save height */
.cgrid.kit.one>.cgroup{flex-direction:row;align-items:center;gap:10px;}
.cgrid.kit>.cgroup[hidden]{display:none;}
.cgrid.kit>.cgroup>.rowlab{font:12.5px var(--font-mono,ui-monospace,monospace);color:var(--ink-soft);}
.cgrid.kit>.cgroup>.seg{display:flex;flex-wrap:wrap;max-width:100%;}
.cgrid.kit>.cgroup>.seg>button{flex:0 1 auto;}
.to-q[hidden]{display:none!important;}
.to-q:nth-child(n){border-style:dashed;border-color:var(--ink);font-weight:600;}
</style>
<script>
  // Visit counter (GoatCounter: no cookies, no personal data). Skipped when a page is embedded in a workout, so a visit counts once.
  // pwCountTab(tab, label): counts each workout tab once per visit as a GoatCounter event (path "page#tab"), skipped in frames the same way.
  (function(){
    var off = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var seen = {}, queue = [];
    function send(e){ try { window.goatcounter.count(e); } catch (x) {} }
    window.pwCountTab = function(tab, label){
      if (off || !tab || seen[tab]) return;
      seen[tab] = 1;
      var page = (location.pathname.split('/').pop() || 'index').replace(/\.html$/, '');
      var e = { path: page + '#' + tab, title: (label || tab) + ' · ' + document.title, event: true };
      if (window.goatcounter && window.goatcounter.count) send(e); else queue.push(e);
    };
    if (off) return;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://gc.zgo.at/count.js';
    s.setAttribute('data-goatcounter', 'https://physics-workout.goatcounter.com/count');
    s.onload = function(){ var q = queue; queue = []; q.forEach(send); };
    document.head.appendChild(s);
  })();
</script>

<script>
  // Draft tags and Alex's reviewer button (tools/review/drafts.py writes this block; edit tools/review/snippet.html, then run drafts.py sync).
  // A page is Draft while its row in tools/REVIEW.md is not ✅: <meta name="pw-draft"> on the page, data-draft on its list cards.
  // ?reviewer (once, on any page) turns on reviewer mode in this browser; ?reviewer=off turns it off.
  (function(){
    var on = false, embed = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var m = /[?&]reviewer(?:=([^&]*))?/.exec(location.search);
    on = !!m && m[1] !== 'off';
    try {
      if (m) { if (m[1] === 'off') localStorage.removeItem('pw-reviewer'); else localStorage.setItem('pw-reviewer', '1'); }
      else on = localStorage.getItem('pw-reviewer') === '1';
    } catch (e) {}
    var CSS = '.pw-draft{display:inline-block;vertical-align:middle;margin-left:10px;font:600 11.5px/1.4 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:0;color:var(--bad,#b42318);border:1px dashed currentColor;border-radius:5px;padding:1px 7px;white-space:nowrap}'

<script>
// Which list this page was opened from: ?level=igcse, ial or ib sets the back link (and, on two-level pages, the starting level).
var PW_LEVEL=(location.search.match(/[?&]level=(igcse|ial|ib)\b/)||[])[1]||(/[?&]from=alevel\b/.test(location.search)?'ial':'');
(function(){
  var hl=document.querySelector('.home-link'); if(!hl) return;

  if(!lv && /ial\.html/.test(hl.getAttribute('href'))){ try{ if(localStorage.getItem('pw-symbols')==='ib') lv='ib'; }catch(e){} }

  if(L){ hl.href=L[0]; hl.innerHTML='&larr; '+L[1]; }
})();
(function(){
  // This page is the one copy of this animation. With ?embed it drops its heading so a workout tab
  // can show it in a frame, and it tells that page its height.
  var EMBED = /[?&]embed\b/.test(location.search);
  if(EMBED){
    document.documentElement.classList.add('embed');
    var page = document.getElementById('page');

    if(window.ResizeObserver) new ResizeObserver(sendHeight).observe(page);
    window.addEventListener('load', sendHeight);
  }
  function $(sel){ return document.querySelector(sel); }
  var SUP = {'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
  function sci(x, dp){   // 4.97 × 10⁻¹⁹
    if(x===0) return '0';
    var e = Math.floor(Math.log10(Math.abs(x))), m = x/Math.pow(10,e);
    if(+Math.abs(m).toFixed(dp)>=10){ m/=10; e++; }
    return sn(m,dp)+' × 10'+String(e).replace(/./g,function(c){ return SUP[c]; });
  }
  function sn(x, dp){ var t = Math.abs(x).toFixed(dp); return (x<0 && +t!==0 ? '−' : '')+t; }   // real minus sign
  function sig(x, n){   // n significant figures, as text, real minus sign
    if(x===0) return '0';
    x=+x.toPrecision(n); if(x===0) return '0';
    var dp = Math.max(0, n-1-Math.floor(Math.log10(Math.abs(x))));
    return sn(x, dp);
  }
  function grp(t){ return String(t).replace(/\B(?=(\d{3})+(?!\d))/g,' '); }   // 12 345
  function FR(t){
    return String(t).replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g,'<span class="frac"><span>$1</span><span>$2</span></span>');
  }
  // Each line of a working readout becomes left | = | right, so the = signs sit under each other.
  function alignEquals(el){
    if(el.querySelector('.eqg')) return;
    var rows = el.innerHTML.split(/<br\s*\/?>/i).map(function(line){
      var i = line.indexOf(' = ');
      if(i<0) return '<span class="eqg-full">'+line+'</span>';
      return '<span class="eqg-l">'+line.slice(0,i)+'</span><span class="eqg-m">=</span><span class="eqg-r">'+line.slice(i+3)+'</span>';
    });
    el.innerHTML = '<div class="eqg">'+rows.join('')+'</div>';
  }
  function watchEquals(el){ alignEquals(el); new MutationObserver(function(){ alignEquals(el); }).observe(el, {childList:true}); }
  // a row of choice buttons that behaves like a radio group
  function segGroup(el, onPick){
    el.addEventListener('click', function(e){ var b=e.target.closest('button'); if(!b||b.disabled) return; pick(b.dataset.v); onPick(b.dataset.v); });
    function pick(v){ Array.prototype.forEach.call(el.querySelectorAll('button'), function(x){ x.setAttribute('aria-pressed', String(x.dataset.v===v)); }); }

  }
  function pressed(b){ return b.getAttribute('aria-pressed')==='true'; }
  // ---- solid kit (the same block is in roller-coaster-energy.html, heat-transfer.html, density.html and liquid-pressure.html) ----
  function f1(n){ return (+n).toFixed(1); }
  function pts(list){ return list.map(function(p){ return f1(p[0])+','+f1(p[1]); }).join(' '); }
  function pl(list,col,w,extra){ return '<polyline points="'+pts(list)+'" fill="none" stroke="'+col+'" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round"'+(extra||'')+'/>'; }
  function pg(list,fill,extra){ return '<polygon points="'+pts(list)+'" fill="'+fill+'"'+(extra||'')+'/>'; }
  function ln(x1,y1,x2,y2,col,w,extra){ return '<line x1="'+f1(x1)+'" y1="'+f1(y1)+'" x2="'+f1(x2)+'" y2="'+f1(y2)+'" stroke="'+col+'" stroke-width="'+(w||1)+'"'+(extra||'')+'/>'; }
  function rect(x,y,w,h,fill,extra){ return '<rect x="'+f1(x)+'" y="'+f1(y)+'" width="'+f1(Math.max(0,w))+'" height="'+f1(Math.max(0,h))+'" fill="'+fill+'"'+(extra||'')+'/>'; }
  // text in clear space: halo:1 gives it a panel-coloured edge so a line passing behind never cuts a letter
  function txt(x,y,s,o){ o=o||{}; return '<text x="'+f1(x)+'" y="'+f1(y)+'"'+(o.a?' text-anchor="'+o.a+'"':'')+' font-size="'+(o.fs||12)+'" fill="'+(o.c||'var(--ink-soft)')+'"'+(o.w?' font-weight="'+o.w+'"':'')+(o.halo?' paint-order="stroke" stroke="var(--panel)" stroke-width="4" stroke-linejoin="round"':'')+(o.x||'')+'>'+s+'</text>'; }
  // a solid block: front face at (x, y), w wide and h tall, going back by (dx, dy). Lit top, plain front, darker side.
  function box(x,y,w,h,dx,dy,col,o){ o=o||{};
    return pg([[x,y],[x+w,y],[x+w+dx,y+dy],[x+dx,y+dy]],o.top||col)+(o.top?'':pg([[x,y],[x+w,y],[x+w+dx,y+dy],[x+dx,y+dy]],'#fff',' opacity=".38"'))+
      pg([[x+w,y],[x+w+dx,y+dy],[x+w+dx,y+h+dy],[x+w,y+h]],o.side||col)+(o.side?'':pg([[x+w,y],[x+w+dx,y+dy],[x+w+dx,y+h+dy],[x+w,y+h]],'#000',' opacity=".28"'))+
      rect(x,y,w,h,col); }
  // a round bar or post: a dark core with a lighter streak along it
  function tube(x1,y1,x2,y2,w,col,hi){ var L=Math.hypot(x2-x1,y2-y1)||1, nx=-(y2-y1)/L*w*0.22, ny=(x2-x1)/L*w*0.22; if(ny>0){ nx=-nx; ny=-ny; }
    return ln(x1,y1,x2,y2,col,w,' stroke-linecap="round"')+ln(x1+nx,y1+ny,x2+nx,y2+ny,hi,Math.max(0.8,w*0.3),' stroke-linecap="round"'); }
  function wrapLines(s,n){ var out=[], cur=''; String(s).split(' ').forEach(function(w){ if(cur && (cur+' '+w).length>n){ out.push(cur); cur=w; } else cur=cur?cur+' '+w:w; }); if(cur) out.push(cur); return out; }
  function onPick(svg, fn){
    svg.addEventListener('click', function(e){ var t=e.target.closest('.pick'); if(t){ fn(t.getAttribute('data-pick')); } });
    svg.addEventListener('keydown', function(e){ if(e.key!=='Enter' && e.key!==' ') return; var t=e.target.closest('.pick'); if(t){ e.preventDefault(); fn(t.getAttribute('data-pick')); } });
  }
  function setKeepFocus(el, html){ var f=document.activeElement, k=f && el.contains(f) ? f.getAttribute('data-pick') : null; el.innerHTML=html;
    if(k!==null){ var n=el.querySelector('.pick[data-pick="'+k+'"]'); if(n && n.focus) n.focus(); } }
  function ell(cx,cy,rx,ry,fill,extra){ return '<ellipse cx="'+f1(cx)+'" cy="'+f1(cy)+'" rx="'+f1(rx)+'" ry="'+f1(ry)+'" fill="'+fill+'"'+(extra||'')+'/>'; }
  // a solid arrow from (x1, y1) to its tip at (x2, y2)
  function arrow(x1,y1,x2,y2,col,w,extra){ var a=Math.atan2(y2-y1,x2-x1), s=w*2.2, bx=x2-Math.cos(a)*s*1.5, by=y2-Math.sin(a)*s*1.5;
    return '<g'+(extra||'')+'>'+ln(x1,y1,bx,by,col,w)+'<path d="M'+f1(x2)+','+f1(y2)+' L'+f1(bx-Math.sin(a)*s)+','+f1(by+Math.cos(a)*s)+' L'+f1(bx+Math.sin(a)*s)+','+f1(by-Math.cos(a)*s)+' z" fill="'+col+'"/></g>'; }
  // an upright cylinder (a can, a beaker of liquid): top ellipse at yt, bottom at yb. o.top fills the top; o.hi adds a streak of light.
  function cyl(cx,yt,yb,rx,ry,fill,o){ o=o||{};
    return '<path d="M'+f1(cx-rx)+','+f1(yt)+' L'+f1(cx-rx)+','+f1(yb)+' A'+f1(rx)+','+f1(ry)+' 0 0 0 '+f1(cx+rx)+','+f1(yb)+' L'+f1(cx+rx)+','+f1(yt)+' z" fill="'+fill+'"'+(o.extra||'')+'/>'+
      '<path d="M'+f1(cx+rx*0.45)+','+f1(yt)+' L'+f1(cx+rx*0.45)+','+f1(yb+ry*0.85)+' A'+f1(rx)+','+f1(ry)+' 0 0 0 '+f1(cx+rx)+','+f1(yb)+' L'+f1(cx+rx)+','+f1(yt)+' z" fill="#000" opacity="'+(o.shade==null?0.16:o.shade)+'"/>'+
      (o.hi?ln(cx-rx*0.62,yt+ry+4,cx-rx*0.62,yb-2,o.hi,Math.max(1.6,rx*0.11),' stroke-linecap="round" opacity="'+(o.hiop||0.7)+'"'):'')+
      ell(cx,yt,rx,ry,o.top||fill,o.topx||'')+(o.top?'':ell(cx,yt,rx,ry,'#fff',' opacity=".3"')); }
  // a glass thermometer standing upright: bulb at (x, yb); the scale runs from t0 at y0 up to t1 at y1, and the thread stands at T.
  // o.step: a tick every so many degrees; o.num: a number every so many; o.side: numbers on the right (1) or the left (-1); o.from: first tick;
  // o.nobulb: the bulb is out of sight, inside a can or a cube
  function thermo(x,yb,y0,t0,y1,t1,T,o){ o=o||{};
    var w=o.w||7, yT=y1-9, sc=(y1-y0)/(t1-t0), yy=function(t){ return y0+(t-t0)*sc; }, side=o.side||1, fs=o.fs||11, g='', t;
    g+=rect(x-w/2,yT,w,yb-yT,'var(--thermo)',' rx="'+f1(w/2)+'" stroke="var(--ink-faint)" stroke-width="1"');
    g+=ln(x,yb,x,yy(Math.max(t0-4,Math.min(t1+2,T))),'var(--thread)',w*0.36,' stroke-linecap="round"');
    if(!o.nobulb) g+='<circle cx="'+f1(x)+'" cy="'+f1(yb)+'" r="'+f1(w*0.9)+'" fill="var(--thread)" stroke="var(--ink-faint)" stroke-width="0.8"/>'+ell(x-w*0.3,yb-w*0.3,w*0.22,w*0.22,'#fff',' opacity=".7"');
    for(t=(o.from==null?t0:o.from); t<=t1+1e-9; t+=(o.step||10)){ var big=!(Math.round(t)%(o.num||20));
      g+=ln(x+side*w/2,yy(t),x+side*(w/2+(big?7:4)),yy(t),'var(--ink-soft)',big?1.3:0.9);
      if(big && !o.nonum) g+=txt(x+side*(w/2+10),yy(t)+fs*0.36,String(Math.round(t)),{a:side>0?'start':'end',fs:fs,c:'var(--ink)'}); }
    return g; }
  // a stopwatch showing s (for example 1:37)
  function stopwatch(x,y,s,k){ k=k||1; var w=78*k, h=40*k;
    return rect(x+w/2-7*k,y-7*k,14*k,9*k,'var(--steel-sh,#3f4a5e)',' rx="2"')+rect(x,y,w,h,'var(--case,#3f4a5e)',' rx="'+f1(9*k)+'"')+rect(x+2,y+2,w-4,h*0.4,'#fff',' rx="'+f1(8*k)+'" opacity=".12"')+
      rect(x+7*k,y+8*k,w-14*k,h-16*k,'var(--panel)',' rx="3"')+txt(x+w/2,y+h/2+5.5*k,s,{a:'middle',fs:15*k,c:'var(--ink)',w:600}); }
  // ---- end of solid kit ----
  // ---- instrument kit (the same block is in resistivity.html, internal-resistance.html, photoelectric.html and electron-diffraction.html) ----
  // Bench instruments drawn straight on for pictures of circuits: a digital meter, a supply, leads that hang, current arrows.
  // It needs the solid kit above (pg, pl, ln, rect, txt, ell). tri and flowMarks are the 3D kit's (dc-motor.html), flowPath is electromagnets.html's.
  // a solid arrowhead with its tip at (x, y), pointing along ang (degrees, screen)
  function tri(x,y,ang,size,col,extra){ return '<path d="M0,0 L'+(-size*1.7).toFixed(1)+','+(size*0.8).toFixed(1)+' L'+(-size*1.7).toFixed(1)+','+(-size*0.8).toFixed(1)+' z" transform="translate('+x.toFixed(1)+','+y.toFixed(1)+') rotate('+ang.toFixed(1)+')" fill="'+col+'"'+(extra||'')+'/>'; }

/* ================= Experiment kit (copy this block into an animation page's <script>) =================
   The reusable parts of an animation's Experiment mode, taken from animations/hookes-law.html:
   - expRun():     the run itself: step the independent variable up one interval at a time, then
                   (optionally) back down again, measuring at every step
   - expReading(): a reading with a small, fixed pattern of reading error, rounded to the instrument's
                   resolution, that never goes the wrong way
   - expTable():   the results table (sticky header, newest row highlighted, a column per run)
   - expCross(), expRing(), expKey(): SVG marks for plotted readings (× first run, ○ return run)
   The page keeps its own picture, physics, graph axes and notes. See tools/experiment-kit/README.md.
   Plain ES5 so it can sit inside any animation page's IIFE. */

// A fixed pattern of reading errors, in units of the instrument's resolution. Fixed (not random) so a
// teacher sees the same results as the class, and a re-run gives the same table.
var EXP_ERR = [0, 1, -1, 0, 2, -1, 1, -2, 0, 1, -1, 0, 1, -1, 2, 0, -1, 1, 0, -2, 1];
function expErr(i){ return EXP_ERR[((i % EXP_ERR.length) + EXP_ERR.length) % EXP_ERR.length]; }

// What the student reads off the instrument.
//   trueVal  the value the physics gives at this step
//   prevVal  the reading taken at the step before (or the start value)
//   res      the instrument's resolution (0.1 cm ruler, 0.05 mm vernier, 0.01 A ammeter, 1° protractor)
//   i        the step number (picks the error from the pattern)
//   scale    how big the error is, in resolutions (default 1; 0.5 for a fine instrument)
// The error is never more than a quarter of the change since the last reading, so a reading never
// goes the wrong way (an extension never falls as the load rises, a current never drops as V rises).
function expReading(trueVal, prevVal, res, i, scale){
  var gap = Math.abs(trueVal - prevVal);
  var err = i > 0 ? expErr(i) * Math.min(res * (scale == null ? 1 : scale), gap / 4) : 0;
  var r = Math.round((trueVal + err) / res) * res;
  var dp = Math.max(0, Math.ceil(-Math.log10(res) - 1e-9));
  return +r.toFixed(dp);
}

// The run. cfg = {
//   start: 0,                 value of the independent variable before the first step
//   max: 10,                  last value of the first run (the run stops there)
//   step: 1,                  the interval (the page can change it with setStep, which resets the run)
//   reverse: true,            allow a return run (unloading, turning the voltage back down)
//   measure: function(v, phase, prevReading){ return reading },   phase is 'up' or 'down'
//   onChange: function(run, what){}  what is 'up', 'down' or 'reset'
// }
// run.up and run.down are arrays of {v, r}. run.phase is 'up' until the first step back, then 'down'.
function expRun(cfg){
  var run = { up: [], down: [], phase: 'up', value: cfg.start || 0, peak: cfg.start || 0, step: cfg.step || 1 };
  var r6 = function(x){ return Math.round(x * 1e6) / 1e6; };
  run.upDone = function(){ return run.phase === 'down' || run.peak >= cfg.max - 1e-9; };
  run.downDone = function(){ return run.phase === 'down' && run.value <= (cfg.start || 0) + 1e-9; };
  run.last = function(){ var a = run.phase === 'down' && run.down.length ? run.down : run.up; return a[a.length - 1] || null; };
  run.stepUp = function(){
    if(run.phase !== 'up' || run.upDone()) return false;
    var prev = run.up.length ? run.up[run.up.length - 1].r : null;
    var v = r6(Math.min(cfg.max, run.value + run.step));
    run.value = run.peak = v;
    run.up.push({ v: v, r: cfg.measure(v, 'up', prev) });
    if(cfg.onChange) cfg.onChange(run, 'up');
    return true;
  };
  run.stepDown = function(){
    if(!cfg.reverse || run.value <= (cfg.start || 0) + 1e-9 || !run.up.length) return false;
    run.phase = 'down';
    var prev = run.down.length ? run.down[run.down.length - 1].r : run.up[run.up.length - 1].r;
    var v = r6(Math.max(cfg.start || 0, run.value - run.step));
    run.value = v;
    run.down.push({ v: v, r: cfg.measure(v, 'down', prev) });
    if(cfg.onChange) cfg.onChange(run, 'down');
    return true;
  };
  run.reset = function(){ run.up = []; run.down = []; run.phase = 'up'; run.value = run.peak = cfg.start || 0; if(cfg.onChange) cfg.onChange(run, 'reset'); };
  run.setStep = function(s){ run.step = s; run.reset(); };
  return run;
}

// The results table. cols = [{label:'Load (N)', key:'v', dp:0}, {label:'Extension loading (cm)', key:'up', dp:1}, ...]
// rows = [{v:1, up:1.6, down:''}, ...]. newKey/newV highlight the reading just taken (fades in).
// Wrap it in .rtable-wrap so a long table scrolls under its sticky header.
function expTable(el, cols, rows, newV){
  var fmt = function(x, dp){ return (x === '' || x == null) ? '' : (+x).toFixed(dp || 0); };
  var h = '<table class="rtable"><thead><tr>' + cols.map(function(c){ return '<th>' + c.label + '</th>'; }).join('') + '</tr></thead><tbody>';
  rows.forEach(function(row){
    h += '<tr' + (newV != null && row.v === newV ? ' class="new"' : '') + '>' + cols.map(function(c){ return '<td>' + fmt(row[c.key], c.dp) + '</td>'; }).join('') + '</tr>';
  });
  el.innerHTML = h + '</tbody></table>';
}

// Plotted readings, as SVG strings. Size 5 suits a 300px-wide graph.
function expCross(cx, cy, s){ s = s || 5; return '<path d="M' + (cx - s) + ',' + (cy - s) + ' L' + (cx + s) + ',' + (cy + s) + ' M' + (cx + s) + ',' + (cy - s) + ' L' + (cx - s) + ',' + (cy + s) + '" stroke="var(--ink)" stroke-width="2"/>'; }
function expRing(cx, cy, r){ return '<circle cx="' + cx + '" cy="' + cy + '" r="' + (r || 4.5) + '" fill="none" stroke="var(--accent)" stroke-width="2"/>'; }
// A two-line key in the bottom-right corner of a graph: expKey(rightX, bottomY, 'loading', 'unloading')
function expKey(x, y, upLabel, downLabel){
  return '<text x="' + x + '" y="' + (y - 14) + '" text-anchor="end" font-size="10.5" fill="var(--ink)">× ' + upLabel + '</text>' +
         '<text x="' + x + '" y="' + y + '" text-anchor="end" font-size="10.5" fill="var(--accent)">○ ' + downLabel + '</text>';
}

  // ===== Simple harmonic motion: a mass on a spring and a simple pendulum (IAL 5.5 Oscillations: 143 the condition F = −kx,
  //       144 a = −ω²x, x = A cos ωt, v = −Aω sin ωt, T = 1/f = 2π/ω, 145 T = 2π√(m/k) and T = 2π√(l/g), 146 and 147 the
  //       displacement–time and velocity–time graphs and their gradients, 150 conservation of energy, damped and undamped;
  //       IB C.1 Simple harmonic motion, with the additional higher level equations marked HL, and C.4's light, critical and heavy damping) =====
  // The model. The displacement x is measured from the equilibrium position: upwards for the mass on the spring, to the right for the
  // pendulum (its displacement along the arc, for small angles). With ω₀ = √(k/m), or √(g/l), and a damping force proportional to the velocity:
  //     x″ = −ω₀²x − 2bx′      with b = ζω₀: ζ = 0 (none), 0.0276 (light: the amplitude halves in 4 oscillations),
  //                            0.11 (IAL "Heavier": it halves in 1), 1 (IB critical) or 2.5 (IB heavy, no oscillation)
  // The page uses the exact solution (stt), so any instant can be jumped to. It starts from rest at +A or −A, or at x = 0 moving in the
  // positive direction with speed Aω₀. E_k = ½mv²; E_p = ½mω₀²x², which for the mass hanging on the spring is the elastic and gravitational
  // potential energy together, measured from the equilibrium position, and for the pendulum is mgh for small angles.
  // The spring's own mass is ignored. The amplitude is never more than the spring's extension at rest, so the spring stays stretched.
  // Experiment: the time for 10 oscillations of five masses (k = 20 N m⁻¹) or five lengths, with a small fixed pattern of timing error;
  // T² against m has gradient 4π²/k, and T² against l has gradient 4π²/g.
  // The question kinds and the wording come from the IAL Past Paper Index and the IB Physics Question Index (18 Nov 2026):
  //   choose the graph that goes with a given graph: v–t from x–t, a–t from v–t, x–t from a–t or from F–t, and the energy–time graphs
  //     (9PH0/02 Jun 2018 Q8 and Jun 2024 Q9; WPH15 Jan 2021 Q9 and Q10, Jun 2024 Q9 and Q10, Oct 2024 Q9 and Q10, Jun 2025 Q9 and Q10;
  //      IB P1 SL May 2017 TZ1 Q13, HL May 2021 TZ1 Q11, SL May 2019 TZ1 Q15, SL May 2024 TZ1 Q14, P1A SL May 2026 TZ2 Q13);
  //   mark an instant on a graph: maximum displacement or zero acceleration on a velocity–time graph (6PH05 Jun 2010 Q18(b)), maximum speed
  //     or maximum acceleration on a displacement–time graph (IB P2 HL Nov 2010 QB1, May 2014 TZ1 Q2(b); P1 HL May 2021 TZ2 Q11, Nov 2022 Q13);
  //   the amplitude and the period read from a displacement–time graph, then v_max = Aω or a_max = ω²A

  // ---- the physics
  // o = {sys, m (kg), k or l and g, A (m), zeta, start}: adds what follows from them
  function mkSys(o){

  // displacement, velocity, acceleration and energies at time t

    if(!Q.counted){ Q.counted=true; Q.tried++; if(Q.ok) Q.right++; } lastNote='';
  }
  function setMark(tm){ Q.mark=Math.max(0,Math.min(Q.W,Math.round(tm/(Q.W/200))*(Q.W/200))); lastNote=''; draw(); }

  // the question's graphs
  function qFrames(){
    var pw=(QG.w-16)/2, ph=TALL?70:62, y1=QG.y+16+84+36;
    return {given:{x:QG.x,y:QG.y+16,w:QG.w,h:84}, opt:[0,1,2,3].map(function(i){ return {x:QG.x+(i%2)*(pw+16),y:y1+Math.floor(i/2)*(ph+28),w:pw,h:ph}; }), big:{x:QG.x,y:QG.y+16,w:QG.w,h:TALL?220:214}};
  }
  function bare(F,signed,name){   // a small graph with no numbers: a time axis, and a zero line in the middle or at the bottom
    var y0=signed?F.y+F.h/2:F.y+F.h;
    return ln(F.x,F.y,F.x,F.y+F.h,'var(--ink-soft)',1.6)+ln(F.x,y0,F.x+F.w,y0,'var(--ink-soft)',1.6)+txt(F.x+F.w+3,y0+4,'t',{fs:12})+(name?txt(F.x+4,F.y-6,name,{fs:12,c:'var(--ink)',w:600}):''); }
  function bareAx(F,signed){ return signed ? {x0:0,x1:4*Math.PI,y0:-1.18,y1:1.18} : {x0:0,x1:4*Math.PI,y0:0,y1:1.3}; }
  function drawPredict(){
    var o=Q.sys, ask=Q.phase==='ask', dn=Q.phase==='done', k=Q.kind, s=stt(o,t), g='', gq='', pk='', yy, FS=qFrames(), F, a, fn, th=o.w0*t, i, tm, col, lab;
    g+=tr(SOX,0,scene(o,s,{arrows:!ask,lab:massLab(o)}));
    yy=QT.y; g+=txt(QT.x,yy,'Question '+Q.n,{fs:13,w:700,c:'var(--topic)'}); yy+=19;
    wrapLines(qText(),QT.n).forEach(function(l){ g+=txt(QT.x,yy,l,{fs:12.5,c:'var(--ink)'}); yy+=16; });
    if(dn){ yy+=6; g+=txt(QT.x,yy,Q.ok?'✓ Correct':'✗ Not quite',{fs:13.5,w:700,c:Q.ok?'var(--good)':'var(--bad)'}); yy+=17;
      wrapLines(Q.short,QT.n).forEach(function(l){ g+=txt(QT.x,yy,l,{fs:12.5,c:'var(--ink)',w:600}); yy+=16; }); }
    if(k==='match'){
      F=FS.given; a=bareAx(F,sgn(Q.given)); fn=shapeOf(Q.given,Q.st);
      gq+=bare(F,true,NM[Q.given])+trace(F,a,fn,0,4*Math.PI,'var(--ink)',2.4);
      if(!ask) gq+=nowLine(F,a,th)+dot(F,a,th,fn(th),'var(--ink)');
      Q.opts.forEach(function(op,i){ var P=FS.opt[i], sg=sgn(Q.target), ax=bareAx(P,sg), f2=shapeOf(op.k,Q.st), sel=Q.pick===i, c=dn?(op.right?'var(--good)':sel?'var(--bad)':'var(--ink-faint)'):sel?'var(--topic)':'var(--ink-soft)', body;
        body=bare(P,sg)+trace(P,ax,f2,0,4*Math.PI,dn&&op.right?'var(--good)':'var(--ink)',dn&&!op.right&&!sel?1.4:2.2,dn&&!op.right&&!sel?' opacity=".5"':'');
        if(!ask && (op.right || sel)) body+=nowLine(P,ax,th);
        lab='<circle class="ring" cx="'+f1(P.x+P.w-11)+'" cy="'+f1(P.y-13)+'" r="11" fill="var(--panel)" stroke="'+c+'" stroke-width="'+(sel||(dn&&op.right)?2.4:1.4)+'"/>'+txt(P.x+P.w-11,P.y-8.5,op.L,{a:'middle',fs:13,w:700,c:dn?c:sel?'var(--topic)':'var(--ink)'});
        if(ask) pk+='<g class="pick" data-pick="o:'+i+'" tabindex="0" role="button" aria-pressed="'+sel+'" aria-label="Graph '+op.L+'"><rect x="'+f1(P.x-4)+'" y="'+f1(P.y-26)+'" width="'+f1(P.w+8)+'" height="'+f1(P.h+32)+'" rx="6" fill="transparent" stroke="'+(sel?'var(--topic)':'none')+'" stroke-width="1.6"/>'+lab+'</g>';
        else body+=lab;
        gq+=body; });
    } else {
      F=FS.big;
      if(k==='mark'){ a=bareAx(F,true); a.x1=o.w0*Q.W; fn=shapeOf(Q.given,Q.st);
        if(dn){ for(i=0;i<=400;i++){ tm=Q.W*i/400; if(markOk(tm)) gq+=rect(gx(F,a,o.w0*tm)-0.5,F.y,F.w/400+1,F.h,'var(--good)',' opacity=".16"'); } }
        gq+=bare(F,true,NM[Q.given])+trace(F,a,fn,0,a.x1,'var(--ink)',2.4);
        if(!ask) gq+=nowLine(F,a,th)+dot(F,a,th,fn(th),'var(--ink)');
        col=dn?(Q.ok?'var(--good)':'var(--bad)'):'var(--topic)';
        if(Q.mark!=null && !ask) gq+=crossAt(gx(F,a,o.w0*Q.mark),gy(F,a,fn(o.w0*Q.mark)),col);
        if(ask) pk='<g class="pick" data-pick="plot" tabindex="0" role="slider" aria-label="The instant you mark. Click on the graph, or use the arrow keys to move the cross." aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+(Q.mark==null?0:Math.round(100*Q.mark/Q.W))+'" aria-valuetext="'+(Q.mark==null?'no cross yet':Math.round(100*Q.mark/Q.W)+' percent of the way along the time axis')+'">'+
          '<rect class="ring" x="'+f1(F.x)+'" y="'+f1(F.y)+'" width="'+f1(F.w)+'" height="'+f1(F.h)+'" fill="transparent" stroke="var(--topic)" stroke-width="1.4" stroke-dasharray="5 4"/>'+
          (Q.mark!=null?crossAt(gx(F,a,o.w0*Q.mark),gy(F,a,fn(o.w0*Q.mark)),'var(--topic)'):txt(F.x+F.w/2,F.y+F.h+16,'click on the graph to mark the instant',{a:'middle',fs:12,c:'var(--topic)'}))+'</g>';
      } else {
        a={x0:0,x1:Q.W,xs:Q.ts,y0:-Q.M,y1:Q.M,ys:Q.M/(k==='read'?(Q.M===50?5:4):2)};
        gq+=frameG(F,a,{xnum:true,xskip:k==='read'?2:0,yskip:k==='read'?(Q.M===50?0:2):2,dpx:k==='read'?1:dpOf(Q.ts),dpy:0,xl:'time t / s',title:'displacement x / '+o.xn,tleft:1});
        if(k==='read'){ gq+=trace(F,a,function(u){ return stt(o,u).x*o.xf; },0,Q.W,'var(--xc)',2.4); if(!ask) gq+=nowLine(F,a,t)+dot(F,a,t,s.x*o.xf,'var(--xc)'); }
        else { gq+=trace(F,a,function(u){ return stt(Q.before,u).x*Q.before.xf; },0,Q.W,ask?'var(--xc)':'var(--ink-faint)',ask?2.4:1.6,ask?'':' stroke-dasharray="5 4"');
          if(!ask) gq+=trace(F,a,function(u){ return stt(Q.after,u).x*Q.after.xf; },0,t,'var(--xc)',2.6)+dot(F,a,t,s.x*o.xf,'var(--xc)');
          if(dn) gq+=txt(F.x+F.w,F.y-7,'dashed: before',{a:'end',fs:12,c:'var(--ink-faint)'}); }
      }
    }
    live.innerHTML=g+gq;
    if(pk!==picksHtml){ setKeepFocus(picksG, pk); picksHtml=pk; }
  }
  function crossAt(px,py,col,sz){ sz=sz||7; return '<path d="M'+f1(px-sz)+','+f1(py-sz)+' L'+f1(px+sz)+','+f1(py+sz)+' M'+f1(px+sz)+','+f1(py-sz)+' L'+f1(px-sz)+','+f1(py+sz)+'" stroke="'+col+'" stroke-width="2.8" stroke-linecap="round" fill="none"/>'; }

  function draw(){
    layout();
    if(predict()) drawPredict(); else if(exp()) drawExp(); else drawExplore();
    if(!predict() && picksHtml!==''){ picksG.innerHTML=''; picksHtml=''; }
    readings();
  }

  // ---- motion
  function frame(now){
    var real=Math.min(0.05,(now-last)/1000), dt, o; last=now; dt=real*(slowOn() && !exp() ? 0.3 : 1);
    if(predict()){ if(Q.phase==='run') qStep(dt); }
    else if(exp()){ if(E.run) expStep(real); }
    else if(running){ o=cur(); t+=dt;
      if(t>=o.W*PAGES){ t=o.W*PAGES; running=false; ended=true; lastNote=''; }
      else if(o.zeta && stt(o,t).E<1e-5*o.E0){ running=false; ended=true; lastNote=''; } }
    draw();
    if(running || E.run || (predict() && Q.phase==='run')) raf=requestAnimationFrame(frame);
  }
  function loop(){ cancelAnimationFrame(raf); last=performance.now(); raf=requestAnimationFrame(frame); }
  function stop(){ running=false; cancelAnimationFrame(raf); }
  function reset(){ stop(); t=0; ended=false; dragX=null; jumpSeg.pick(null); lastNote=''; draw(); }
  function changed(){ stop(); t=0; ended=false; jumpSeg.pick(null); lastNote=''; setRows(); draw(); }
  function jumpTo(k){ var o=cur(), tj=k==='ext'?firstRest(o):firstZero(o); stop(); if(tj==null){ jumpSeg.pick(null); return; } t=tj; ended=false; lastNote=''; draw(); }

  // ---- Experiment: time 10 oscillations for each mass or length
  function setLoadLabels(){ Array.prototype.forEach.call($('#sh-load').querySelectorAll('button'), function(b,i){ b.textContent=pend() ? EXPV.pend[i].toFixed(2)+' m' : EXPV.spring[i]+' g'; }); $('#sh-llab').textContent=pend()?'Length of the pendulum':'Mass on the spring'; }
  function startTiming(){ E.run={t:0, speed:moon()?5:pend()?2:1}; E.last=null; lastNote=''; loop(); }
  function expStep(real){
    var o=cur(), i=+loadSeg.value()||0, t10; E.run.t+=real*E.run.speed;
    if(E.run.t<NOSC*o.T) return;
    t10=+(Math.round((NOSC*o.T+expErr(i*3+(pend()?2:1))*0.02)/0.01)*0.01).toFixed(2);     // a stopwatch read to 0.01 s, with a small fixed pattern of timing error
    E.rd[sysSeg.value()][i]={t10:t10, T:t10/NOSC, T2:(t10/NOSC)*(t10/NOSC)}; E.run=null; E.last=i; lastNote='';
  }
  function loadChanged(){ E.run=null; stop(); E.last=null; lastNote=''; draw(); }

  // ---- drag the mass or the bob away from its equilibrium position and let go
  (function(){
    var off=0;
    function mv(q){ var o=cur(), v, p=o.sys==='pend', lo=p?2:10, hi=p?8:35, st=p?1:5, key=p?'pend':'spring';
      v = p ? (q.x-off-SOX-SPX)/PS*100 : (eqY(o)-(q.y-off))/SC;
      v=Math.round(v/st)*st; if(Math.abs(v)<lo) v=(v<0 || (v===0 && startSeg.value()==='neg') ? -lo : lo); v=Math.max(-hi,Math.min(hi,v));
      S[key].A=Math.abs(v); aIn.value=String(Math.abs(v)); startSeg.pick(v<0?'neg':'pos'); dragX=v; t=0; lastNote=''; draw(); }
    svgDrag(svg, {
      ok:function(){ return !predict() && !exp(); },
      hit:function(q){ var o=cur(), s=stt(o,t), x=q.x-SOX, bx, by;
        if(o.sys==='spring'){ by=eqY(o)-SC*s.x*1000; if(Math.abs(x-SPX)<=26 && q.y>=by-HANG-4 && q.y<=by+10){ off=q.y-by; return true; } return false; }
        bx=SPX+o.l*PS*Math.sin(s.x/o.l); by=PV+o.l*PS*Math.cos(s.x/o.l); if(Math.hypot(x-bx,q.y-by)<=bobR(o)+12){ off=q.x-SOX-bx; return true; } return false; },
      start:function(q){ stop(); ended=false; jumpSeg.pick(null); mv(q); },
      move:mv,
      end:function(){ dragX=null; running=true; lastNote=''; loop(); }
    });
  })();

  // ---- Questions: clicks and keys on the picture
  onPick(svg, function(id){ if(!predict() || Q.phase!=='ask') return; if(id.indexOf('o:')===0){ var i=+id.slice(2); Q.pick=Q.pick===i?null:i; lastNote=''; draw(); } });
  svg.addEventListener('click', function(e){
    if(!predict() || Q.kind!=='mark' || Q.phase!=='ask' || !e.target.closest('[data-pick="plot"]')) return;
    var q=svgPoint(svg,e), F=qFrames().big; setMark((q.x-F.x)/F.w*Q.W);
  });
  svg.addEventListener('keydown', function(e){
    if(!predict() || Q.kind!=='mark' || Q.phase!=='ask' || !e.target.closest('[data-pick="plot"]')) return;
    var d={ArrowLeft:-1, ArrowRight:1, ArrowDown:-1, ArrowUp:1, PageUp:10, PageDown:-10}[e.key]; if(!d) return;
    e.preventDefault(); setMark((Q.mark==null?Q.W/2:Q.mark)+d*Q.W/100);
  });

  // ---- tabs, level, rows
  function setRows(){
    var pr=predict(), ex=exp() && !pr, p=pend(), typed=pr && (Q.kind==='read' || Q.kind==='scale'), I=ib(), dv;
    Array.prototype.forEach.call($('#sh-damp').querySelectorAll('button'), function(b){ var v=b.dataset.v; b.hidden = v==='heavy' ? I : (v==='crit' || v==='over') ? !I : false; });
    dv=dampSeg.value(); if($('#sh-damp').querySelector('[data-v="'+dv+'"]').hidden){ dampSeg.pick('light'); dv='light'; }
    $('#sh-sliders').hidden=pr || ex; $('#sh-kbox').hidden=p; $('#sh-lbox').hidden=!p;
    expBtn.hidden=pr; newBtn.hidden=!pr; slowBtn.hidden=ex; $('#sh-reset').hidden=ex; $('#sh-clear').hidden=!ex;
    $('#sh-glab').hidden=$('#sh-graph').hidden=pr || ex;
    $('#sh-ylab').hidden=$('#sh-sys').hidden=pr;
    $('#sh-dlab').hidden=$('#sh-damp').hidden=pr || ex; $('#sh-slab').hidden=$('#sh-start').hidden=pr || ex;
    $('#sh-jlab').hidden=$('#sh-jump').hidden=pr || ex || ZETA[dv]>=1;
    $('#sh-llab').hidden=$('#sh-load').hidden=!ex;
    $('#sh-tablewrap').hidden=!ex; $('#sh-working').hidden=pr; $('.side').classList.toggle('exp', ex);
    $('#sh-guess').hidden=!typed;
    if(typed){ $('#sh-anslab').textContent=Q.lab; $('#sh-ansu').textContent=Q.unit; }
    $('#sh-start').querySelector('[data-v="pos"]').textContent='+'+As(); $('#sh-start').querySelector('[data-v="neg"]').textContent='−'+As();
    $('#sh-al').innerHTML='Amplitude, '+Ah(); $('#sh-kl').textContent=I?'Spring constant, k':'Stiffness, k';
    $('#sh-ml').textContent=p?'Bob, m':'Mass, m';
    svg.setAttribute('role', pr?'group':'img');
    $('#sh-eye').innerHTML = I ? 'Animations &middot; C.1 simple harmonic motion' : 'Animations &middot; oscillations &middot; IAL 5.5';
  }
  function setSliders(){ var p=pend(), s=S[p?'pend':'spring'];
    mIn.min=p?50:100; mIn.max=p?200:300; mIn.value=String(s.m); aIn.min=p?2:10; aIn.max=p?8:35; aIn.step=p?1:5; aIn.value=String(s.A); kIn.value=String(S.spring.k); lIn.value=String(S.pend.l); }
  function setSys(){ E.run=null; stop(); t=0; ended=false; jumpSeg.pick(null); setSliders(); setLoadLabels(); if(exp()) loadSeg.pick('0'); E.last=null; setRows(); lastNote=''; draw(); }
  function setTab(){ stop(); E.run=null; t=0; ended=false; picksHtml=null; lastNote='';
    if(predict()){ if(exp()) expBtn.setAttribute('aria-pressed','false'); Q.i=-1; Q.n=0; Q.tried=0; Q.right=0; deal(); }
    else { setRows(); draw(); } }
  function setLevel(){ try{ localStorage.setItem('pw-symbols', ib()?'ib':'alevel'); }catch(e){}
    stop(); E.run=null; t=0; ended=false; picksHtml=null; lastNote='';
    if(predict()){ Q.i=-1; Q.n=0; Q.tried=0; Q.right=0; deal(); } else { setRows(); draw(); } }
  function setExp(){ stop(); E.run=null; E.rd={spring:[],pend:[],moon:[]}; E.last=null; t=0; ended=false; jumpSeg.pick(null);
    if(exp()){ if(slowOn()) slowBtn.setAttribute('aria-pressed','false'); loadSeg.pick('0'); }
    setLoadLabels(); setRows(); lastNote=''; draw(); }

  playBtn.addEventListener('click', function(){
    var R, n;
    if(predict()){ go(); return; }
    if(exp()){ if(E.run) return; R=E.rd[sysSeg.value()][+loadSeg.value()||0]; if(R){ n=nextLoad(); if(n<0) return; loadSeg.pick(String(n)); } startTiming(); return; }
    if(running){ stop(); lastNote=''; draw(); return; }
    if(ended){ t=0; ended=false; }
    jumpSeg.pick(null); running=true; lastNote=''; loop();
  });
  newBtn.addEventListener('click', deal);
  slowBtn.addEventListener('click', function(){ slowBtn.setAttribute('aria-pressed', String(!slowOn())); });
  expBtn.addEventListener('click', function(){ expBtn.setAttribute('aria-pressed', String(!exp())); setExp(); });
  $('#sh-reset').addEventListener('click', function(){
    if(predict()){ if(Q.phase==='run') return; stop(); t=0; Q.phase='ask'; Q.mark=null; Q.pick=null; ansIn.value=''; ansIn.disabled=false; if(Q.kind==='scale') Q.sys=Q.before; picksHtml=null; lastNote=''; draw(); return; }
    reset(); });
  $('#sh-clear').addEventListener('click', function(){ stop(); E.run=null; E.rd[sysSeg.value()]=[]; E.last=null; loadSeg.pick('0'); lastNote=''; draw(); });
  mIn.addEventListener('input', function(){ S[pend()?'pend':'spring'].m=+mIn.value; changed(); });
  kIn.addEventListener('input', function(){ S.spring.k=+kIn.value; changed(); });
  lIn.addEventListener('input', function(){ S.pend.l=+lIn.value; changed(); });
  aIn.addEventListener('input', function(){ S[pend()?'pend':'spring'].A=+aIn.value; changed(); });
  ansIn.addEventListener('input', function(){ lastNote=''; readings(); });
  ansIn.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); go(); } });

  watchEquals($('#sh-eq1')); watchEquals($('#sh-eq2')); watchEquals($('#sh-eq3'));
  (function(){ var sm=(location.search.match(/[?&]sys=(pend|moon)\b/)||[])[1]; if(sm) sysSeg.pick(sm); })();
  (function(){ var gm=(location.search.match(/[?&]graph=(xva|et|ex|ax)\b/)||[])[1]; if(gm) graphSeg.pick(gm); })();
  setSliders(); setLoadLabels();
  if(/[?&]show=predict\b/.test(location.search)){ tabSeg.pick('predict'); setTab(); }
  else if(/[?&]show=exp\b/.test(location.search)){ expBtn.setAttribute('aria-pressed','true'); setExp(); }
  else { setRows(); draw(); }
  // redraw when the picture changes between its wide and its tall shape
  if(window.ResizeObserver) new ResizeObserver(function(){ var w=svg.getBoundingClientRect().width; if(LY && (w>0 && w<520)!==svg.classList.contains('tall')) draw(); }).observe(svg);

})();
</script><script id="choice-kit-js">
/* Choice kit (12 Nov 2026): the same block on every animation page. See tools/ANIMATION-STYLE.md, "Choices".
   A group of choices with one chosen gets a track round it (class pick); a .to-q button opens the questions from Explore. */
(function(){
  function on(b){ return b.getAttribute('aria-pressed')==='true' || b.classList.contains('is-on'); }
  function each(sel, fn){ Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }
  function mark(s){
    if(!s.classList.contains('pick')){
      var n=0; Array.prototype.forEach.call(s.children, function(b){ if(b.tagName==='BUTTON' && on(b)) n++; });
      if(n===1) s.classList.add('pick');
    }
    if(s.classList.contains('pick') && !s.hasAttribute('data-fit')){
      var d=getComputedStyle(s).display;
      if(d!=='none'){ s.setAttribute('data-fit','1'); if(d.indexOf('flex')>=0) s.classList.add('fit'); }
    }
  }
  each('.seg:not(.tabs):not(.mode):not(.apps)', function(s){
    mark(s);
    if(window.MutationObserver) new MutationObserver(function(){ mark(s); }).observe(s, {childList:true, subtree:true, attributes:true, attributeFilter:['aria-pressed','class']});
  });
  // Choice rows: wrap each .rowlab and the control after it in a .cgroup (label above, groups side by side).
  // A group is hidden when everything in it is hidden, so pages that hide a row's label and control still work.
  function shown(e){ return !e.hidden && e.style.display!=='none'; }
  each('.cgrid:not(.kit)', function(g){
    var kids=Array.prototype.slice.call(g.children), groups=[];
    for(var i=0;i<kids.length;i++){
      var w=document.createElement('div'); w.className='cgroup';
      g.insertBefore(w, kids[i]); w.appendChild(kids[i]);
      if(kids[i].classList.contains('rowlab') && kids[i+1]){ w.appendChild(kids[i+1]); i++; }
      groups.push(w);
    }
    g.classList.add('kit'); if(groups.length===1) g.classList.add('one');
    groups.forEach(function(w){
      function sync(){ var any=false; Array.prototype.forEach.call(w.children, function(c){ if(shown(c)) any=true; }); w.hidden=!any; }
      sync();
      if(window.MutationObserver) Array.prototype.forEach.call(w.children, function(c){ new MutationObserver(sync).observe(c, {attributes:true, attributeFilter:['hidden','style']}); });
    });
  });
  each('.to-q[data-mode]', function(b){
    var seg=document.getElementById(b.getAttribute('data-mode')); if(!seg) return;
    var bs=seg.querySelectorAll('button');
    function sync(){ b.hidden=!on(bs[0]) || !seg.getClientRects().length; }   // hidden too when the page hides its mode switch (e.g. at a level with no questions)
    b.addEventListener('click', function(){ bs[1].click(); bs[1].focus(); });
    if(window.MutationObserver) new MutationObserver(sync).observe(seg, {subtree:true, attributes:true, attributeFilter:['aria-pressed']});
    document.addEventListener('click', function(){ setTimeout(sync, 0); });
    sync(); setTimeout(sync, 0);
  });
})();
