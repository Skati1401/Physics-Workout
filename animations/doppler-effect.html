<title>The Doppler Effect Animation</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%231d2433%27/%3E%3Cpath d=%27M18.5 3 7 18h7.5l-2 11L25 13h-7.5z%27 fill=%27%23ffc83d%27 stroke=%27%23ffe08a%27 stroke-width=%271%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<meta name="description" content="Interactive physics animation for Edexcel IGCSE Physics 3.8, Edexcel IAL Physics (169) and IB Physics C.5: the Doppler effect for sound. Seen from above, a moving source sends out wavefronts that are closer together in front and further apart behind; change its speed up to 80% of the speed of sound, drag the two observers, and see and hear the frequency each one receives. Questions on the picture, and at IB the moving observer and the HL equations.">

<style>
  :root{
    --bg:#eef1f5; --bg-grid:rgba(29,41,61,0.055);
    --panel:#ffffff; --panel-border:#d7dce4;
    --ink:#182233; --ink-soft:#4c5668; --ink-faint:#8993a5;
    --accent:#d9720c; --accent-soft:#fdead2;
    --good:#15803d; --good-soft:#dcf5e3;
    --bad:#c0311a; --bad-soft:#fbe1db;
    --shadow:0 10px 26px -14px rgba(24,34,51,0.28);
    /* instrument kit colours */ --cur:#7c3aed; --lead:#3a4352; --lead-hi:#7d8899; --lead-v:#8791a3; --case-f:#4a5464; --case-t:#687385; --case-s:#343c4a; --lcd:#d5dec8; --lcd-ink:#1d2a1f; --plug-r:#d94444; --plug-k:#262d3a; --insul:#262d3a;
    --steel:#66748c; --steel-hi:#c3ccda; --steel-sh:#3f4a5e; --wood-f:#c99e6a; --wood-t:#e3c08f; --wood-s:#9c7444; --brass:#c9a13b; --brass-hi:#f0d78a; --copper:#b8651b; --copper-hi:#e6a25c;
    --glass:#9fb4c8; --glass-in:#f4f8fb; --rule-t:#f3e2ab; --rule-f:#d9c27e; --rule-ink:#5b4a1f; --ceramic:#e4e1d3; --thermo:#f3f6fa; --thread:#d7261e; --case:#3f4a5e;
    --topic:#4338ca;   --topic-soft:#e0e7ff;
    --hot:#dc2626;
    --water:#d6e9fb;   --ice:#ffffff;
    --font-display:'Big Shoulders',system-ui,sans-serif;
    --font-body:'IBM Plex Sans',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12161f; --bg-grid:rgba(255,255,255,0.045);
      --panel:#1b212e; --panel-border:#2c3444;
      --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;
      --accent:#ff9a3d; --accent-soft:#3a2712;
      --good:#4ade80; --good-soft:#123321;
      --bad:#f27159; --bad-soft:#3a1712;
      --shadow:0 14px 30px -14px rgba(0,0,0,0.55);
      /* instrument kit colours */ --cur:#c4a1ff; --lead:#566072; --lead-hi:#8e99ab; --lead-v:#8791a3; --case-f:#667083; --case-t:#8a94a6; --case-s:#4a5364; --lcd:#c6d0b8; --lcd-ink:#172018; --plug-r:#d95252; --plug-k:#0c1017; --insul:#0c1017;
      --steel:#8f9db3; --steel-hi:#dfe5ee; --steel-sh:#566179; --wood-f:#8a6a43; --wood-t:#a8855a; --wood-s:#644b2d; --brass:#b8943a; --brass-hi:#e8cf86; --copper:#f0a35e; --copper-hi:#ffd0a0;
      --glass:#7f97ad; --glass-in:#202938; --rule-t:#d9c88f; --rule-f:#b39f63; --rule-ink:#3d3214; --ceramic:#b9b6a6; --thermo:#dfe6ee; --thread:#e5392f; --case:#56617a;
      --topic:#a5b4fc; --topic-soft:#1e1b4b;
      --hot:#f87171;
      --water:#1c3a5a; --ice:#c9d6e6;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12161f; --bg-grid:rgba(255,255,255,0.045);
    --panel:#1b212e; --panel-border:#2c3444;
    --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;
    --accent:#ff9a3d; --accent-soft:#3a2712;
    --good:#4ade80; --good-soft:#123321;
    --bad:#f27159; --bad-soft:#3a1712;
    --shadow:0 14px 30px -14px rgba(0,0,0,0.55);
    /* instrument kit colours */ --cur:#c4a1ff; --lead:#566072; --lead-hi:#8e99ab; --lead-v:#8791a3; --case-f:#667083; --case-t:#8a94a6; --case-s:#4a5364; --lcd:#c6d0b8; --lcd-ink:#172018; --plug-r:#d95252; --plug-k:#0c1017; --insul:#0c1017;
      --steel:#8f9db3; --steel-hi:#dfe5ee; --steel-sh:#566179; --wood-f:#8a6a43; --wood-t:#a8855a; --wood-s:#644b2d; --brass:#b8943a; --brass-hi:#e8cf86; --copper:#f0a35e; --copper-hi:#ffd0a0;
      --glass:#7f97ad; --glass-in:#202938; --rule-t:#d9c88f; --rule-f:#b39f63; --rule-ink:#3d3214; --ceramic:#b9b6a6; --thermo:#dfe6ee; --thread:#e5392f; --case:#56617a;
    --topic:#a5b4fc; --topic-soft:#1e1b4b;
      --hot:#f87171;
      --water:#1c3a5a; --ice:#c9d6e6;
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      linear-gradient(var(--bg-grid) 1px,transparent 1px) 0 0/100% 34px,
      linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px) 0 0/34px 100%,
      var(--bg);
    color:var(--ink); font-family:var(--font-body); font-size:14px; -webkit-font-smoothing:antialiased;
  }
  [hidden]{display:none!important;}
  button{font:inherit;color:inherit;}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;}

  .page{max-width:1400px;margin-inline:auto;padding-inline:20px;padding-block:12px 40px;}
  h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:0.2px;text-wrap:balance;margin:0;}
  p{margin:0;line-height:1.55;}

  .home-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-bottom:4px;font:600 13px var(--font-mono);color:var(--ink-soft);text-decoration:none;}
  .home-link:hover{color:var(--accent);}
  .page-head{margin-bottom:12px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px;}
  .eyebrow{font-family:var(--font-mono);font-size:11.5px;color:var(--accent);font-weight:600;margin-bottom:6px;}
  .page-head h1{font-size:clamp(28px,5vw,38px);color:var(--ink);}

  .card{background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;box-shadow:var(--shadow);}
  .btn{
    font-family:var(--font-body);font-weight:600;font-size:13.5px;color:var(--ink);
    background:var(--panel);border:1px solid var(--panel-border);border-radius:9px;
    padding:9px 15px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  }
  .btn:hover{border-color:var(--ink-faint);}
  .btn:disabled{opacity:.45;cursor:default;}
  .btn-primary{background:var(--ink);border-color:var(--ink);color:var(--bg);}
  .btn-primary:hover{opacity:.88;border-color:var(--ink);}
  .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);}
  .btn-group{display:flex;flex-wrap:wrap;gap:10px;}
  /* button rows fill their width (Alex, 2 Nov 2026) */
  .btn-group>.btn,.exp-btns>.btn{flex:1 1 0;min-width:max-content;justify-content:center;}
  .seg:not(.tabs){display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,96px),1fr));}
  .seg:not(.tabs)>button{padding-inline:4px;white-space:nowrap;}

  /* picture on the left with its buttons under it; choices, readings and working on the right */
  .stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,410px);gap:18px 24px;align-items:start;padding:18px;}
  @media (max-width:860px){ .stage{grid-template-columns:minmax(0,1fr);} }
  .view{display:block;width:100%;height:auto;max-height:max(260px,calc(100vh - 335px));touch-action:pan-y;}
  .view.tall,.embed .view.tall{max-height:none;}
  .view text{font-family:var(--font-mono);}
  .under{display:flex;flex-direction:column;gap:12px;margin-top:12px;}
  .sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px 24px;}
  .side{display:flex;flex-direction:column;gap:12px;min-width:0;}
  .lab{display:block;font:12.5px var(--font-mono);color:var(--ink-soft);margin-bottom:6px;}
  .lab output{color:var(--ink);font-weight:600;white-space:nowrap;margin-left:6px;}
  input[type=range]{width:100%;accent-color:var(--topic);min-height:28px;}
  .seg{display:flex;flex-wrap:wrap;gap:6px;}
  .seg button{font:12.5px var(--font-mono);padding:8px 11px;min-height:44px;border:1px solid var(--panel-border);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer;}
  .seg button[aria-pressed="true"]{background:var(--topic);border-color:var(--topic);color:var(--panel);}
  .seg button:disabled{opacity:.45;cursor:default;}
  .seg.tabs{gap:0;flex-wrap:nowrap;}
  .seg.tabs button{white-space:nowrap;border-radius:0;margin-left:-1px;}
  .seg.tabs button:first-child{border-radius:8px 0 0 8px;margin-left:0;}
  .seg.tabs button:last-child{border-radius:0 8px 8px 0;}
  .cgrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center;}
  .rowlab{font:11.5px var(--font-mono);color:var(--ink-faint);}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px;}
  .stat{border:1px solid var(--panel-border);border-radius:8px;padding:5px 8px;display:flex;flex-direction:column;justify-content:space-between;}
  .stat small{display:block;font:10.5px var(--font-mono);color:var(--ink-faint);}
  .stat strong{font:600 15px var(--font-mono);color:var(--ink);white-space:nowrap;}
  .stat.hi strong{color:var(--topic);}
  .note{font-size:15px;line-height:1.5;color:var(--ink);padding:10px 12px;border-radius:8px;background:var(--bg);min-height:4.6em;}
  .note b{color:var(--topic);}

  details.working summary{cursor:pointer;font:600 13px var(--font-mono);color:var(--topic);min-height:44px;display:flex;align-items:center;}
  .eq{font-family:var(--font-mono);font-size:14px;line-height:1.75;padding:8px 12px;border-left:3px solid var(--topic);background:var(--topic-soft);border-radius:6px;color:var(--ink);}
  .eq b{color:var(--topic);}
  .eq + .eq{margin-top:8px;}
  .eqnote{font-size:13.5px;color:var(--ink-soft);margin-top:8px;}
  .eqg{display:grid;grid-template-columns:auto auto minmax(0,1fr);column-gap:.45em;row-gap:.2em;align-items:center}
  .eqg-l{justify-self:end;text-align:right}
  .eqg-m{justify-self:center}
  .eqg-r{justify-self:start;min-width:0}
  .eqg-full{grid-column:1/-1}
  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1.25;}
  .frac>span{padding:0 .25em;white-space:nowrap;}
  .frac>span:first-child{border-bottom:1.5px solid currentColor;}
  @media (max-width:560px){ .stage{padding:12px;} .view{max-height:none;} .eq{font-size:12px;padding:6px 8px;} .note{font-size:14px;} }

  /* ===== Experiment kit (tools/experiment-kit/kit.css) ===== */
  .exp-btns{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;}
  .view.dragging,.view.dragging *{cursor:grabbing;}
  .grab{cursor:grab;}
  .view:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px;}
  .rtable{width:100%;border-collapse:collapse;font:12.5px var(--font-mono);}
  .rtable th{position:sticky;top:0;background:var(--panel);font-weight:600;font-size:11px;color:var(--ink-faint);text-align:right;padding:4px 6px;border-bottom:1px solid var(--panel-border);}
  .rtable td{text-align:right;padding:3px 6px;border-bottom:1px solid var(--panel-border);color:var(--ink);}
  .rtable tr.new td{background:var(--cs, var(--accent-soft));}
  .rtable-wrap{max-height:150px;overflow:auto;border:1px solid var(--panel-border);border-radius:8px;}
  @media (prefers-reduced-motion: no-preference){ .rtable tr.new td{animation:rowin .35s ease-out;} }
  @keyframes rowin{from{opacity:0}to{opacity:1}}
  /* ===== end of Experiment kit ===== */

  /* mystery-beaker answer box */
  .guess{border:1px solid var(--panel-border);border-radius:8px;padding:8px 10px;}
  .guess-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
  .guess-row input{width:110px;min-height:44px;font:600 15px var(--font-mono);padding:6px 8px;border:1px solid var(--panel-border);border-radius:8px;background:var(--panel);color:var(--ink);}
  .guess-row .unit{font:13px var(--font-mono);color:var(--ink-soft);}
  .gfb{font-size:14px;margin-top:6px;min-height:1.4em;}
  .gfb.ok{color:var(--good);font-weight:600;} .gfb.no{color:var(--bad);font-weight:600;}
  .seg button sub,.stat sub{font-size:.75em;}
  .cgrid>[hidden]{display:none!important;}

  .guess-row label{font:12.5px var(--font-mono);color:var(--ink-soft);}
  .guess-row label sub{font-size:.75em;}
  .view .pick{cursor:pointer;}
  .view .pick:focus{outline:none;}
  .view .pick:focus-visible .ring{stroke:var(--accent);stroke-width:3.2;}

  /* inside a workout tab (?embed): no page heading, no outer margins */
  .embed body{background:transparent;}
  .embed .page{padding:0;max-width:none;display:flow-root;}
  .embed .home-link,.embed .page-head{display:none;}
  .embed #dp-level{display:none;}   /* the level switch is for the teacher: never in a frame */
  .embed .view{max-height:460px;}

  /* Build tab: the meters to put in, and the tab switch */
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{display:inline-flex;align-items:center;gap:8px;flex:1 1 auto;min-height:44px;padding:6px 12px;border:1px dashed var(--ink-faint);border-radius:8px;background:var(--panel);color:var(--ink);font:12.5px var(--font-mono);cursor:grab;touch-action:none;user-select:none;}
  .chip[aria-pressed="true"]{border-style:solid;border-color:var(--topic);background:var(--topic-soft);}
  .chip-m{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.8px solid var(--ink);font-weight:700;font-size:12px;}
  .ghost{position:fixed;left:0;top:0;z-index:20;pointer-events:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);background:var(--panel);display:grid;place-items:center;font:700 14px var(--font-mono);color:var(--ink);box-shadow:var(--shadow);}
  .btab{align-self:flex-start;}
  .toprow{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;}
  /* Experiment has a table as well, so its rows sit closer and its buttons are shorter */
  @media (min-width:861px){ .side.exp{gap:8px;} .side.exp .seg button{min-height:36px;padding-block:5px;} .side.exp .note{min-height:0;font-size:14px;} }
  /* ===== this page ===== */
  :root{--dp-ground:#eaf2e3;--dp-road:#c5cad2;--dp-dash:#ffffff;--dp-wave:#0b7285;--dp-a:#d9480f;--dp-b:#1864ab;--dp-c:#7b3fb5;--dp-case:#5a6577;}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--dp-ground:#18211b;--dp-road:#353b45;--dp-dash:#aab2bd;--dp-wave:#66d9e8;--dp-a:#f76707;--dp-b:#339af0;--dp-c:#9f6ef0;--dp-case:#465064;} }
  :root[data-theme="dark"]{--dp-ground:#18211b;--dp-road:#353b45;--dp-dash:#aab2bd;--dp-wave:#66d9e8;--dp-a:#f76707;--dp-b:#339af0;--dp-c:#9f6ef0;--dp-case:#465064;}
  .view{max-height:max(260px,calc(100vh - 330px));}
  .view .grab{cursor:grab;touch-action:none;}
  .view.dragging .grab{cursor:grabbing;}
  @media (min-width:861px){ .side{gap:10px;} .note{font-size:14.5px;min-height:0;} details.working summary{min-height:36px;}
    #dp-sliders{grid-template-columns:minmax(0,.85fr) minmax(0,.85fr) minmax(0,1.5fr);gap:8px 18px;} }
  #dp-stats{grid-template-columns:repeat(4,minmax(0,1fr));}
  #dp-stats.two{grid-template-columns:1fr 1fr;}
  #dp-stats .stat small{white-space:normal;}
  #dp-stats .stat strong{font-size:13.5px;}
  #dp-stats .ka{color:var(--dp-a);font-weight:700;} #dp-stats .kb{color:var(--dp-b);font-weight:700;}
  #dp-move,#dp-course,#dp-listen{display:flex;flex-wrap:wrap;}
  #dp-move>button,#dp-course>button,#dp-listen>button{padding-inline:10px;}
  #dp-jump{grid-template-columns:repeat(auto-fit,minmax(80px,1fr));}
  #dp-jump button{padding-inline:1px;font-size:11.5px;}
  /* teacher page: the sliders and Try these take their own full-width row under the buttons */
  .teach #dp-sliders{flex:1 1 100%;}
  .teach #dp-jump{grid-template-columns:repeat(4,minmax(0,1fr));}
  .teach #dp-jump button{font-size:13px;}
  .nb{white-space:nowrap;}
  #dp-working .eq{font-size:13.5px;}
  @media (max-height:640px) and (min-width:861px){ .side{gap:9px;} .note{font-size:14px;min-height:0;} .seg button{min-height:38px;padding-block:5px;} }
  @media (max-width:560px){ #dp-jump{grid-template-columns:repeat(2,minmax(0,1fr));} #dp-stats{grid-template-columns:1fr 1fr;} }

</style>
<style id="choice-kit">
/* Choice kit (12 Nov 2026): the same block on every animation page. See tools/ANIMATION-STYLE.md, "Choices". */
.seg.pick{background:var(--bg);box-shadow:inset 0 0 0 1px var(--panel-border);border-radius:8px;}
.seg.pick.fit{width:fit-content;max-width:100%;}
.seg.pick>button:not([aria-pressed="true"]):not(.is-on){background:transparent;border-color:transparent;}
.seg.pick>button:not([aria-pressed="true"]):not(.is-on):not(:disabled):hover{background:var(--panel);border-color:var(--panel-border);}
.seg.mode{display:flex;flex-wrap:nowrap;align-self:stretch;flex-grow:1;background:var(--bg);box-shadow:0 0 0 1px var(--panel-border);border-radius:11px;padding:3px;gap:3px;}
.seg.mode>button:nth-child(n){flex:1 1 0;min-height:38px;margin-left:0;padding:6px 12px;border-radius:8px;white-space:nowrap;font:600 14.5px var(--font-body,inherit);}
.seg.mode>button:nth-child(n):not([aria-pressed="true"]){background:transparent;border-color:transparent;color:var(--ink);}
.seg.mode>button:nth-child(n):not([aria-pressed="true"]):hover{background:var(--panel);border-color:var(--panel-border);}
.seg.mode>button:nth-child(n)[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel);}
/* Choice rows (13 Nov 2026, Alex): in a .cgrid the label sits above its group, each group is only as wide as its
   buttons, and short groups share a row, as on dc-motor.html. The script wraps each label and its control in a .cgroup. */
.cgrid.kit{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-start;}
.cgrid.kit>.cgroup{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;max-width:100%;}
/* a row of one group (e.g. Graph under the picture) keeps its label beside it, to save height */
.cgrid.kit.one>.cgroup{flex-direction:row;align-items:center;gap:10px;}
.cgrid.kit>.cgroup[hidden]{display:none;}
.cgrid.kit>.cgroup>.rowlab{font:12.5px var(--font-mono,ui-monospace,monospace);color:var(--ink-soft);}
.cgrid.kit>.cgroup>.seg{display:flex;flex-wrap:wrap;max-width:100%;}
.cgrid.kit>.cgroup>.seg>button{flex:0 1 auto;}
.to-q[hidden]{display:none!important;}
.to-q:nth-child(n){border-style:dashed;border-color:var(--ink);font-weight:600;}
</style>
<script>
  // Visit counter (GoatCounter: no cookies, no personal data). Skipped when a page is embedded in a workout, so a visit counts once.
  // pwCountTab(tab, label): counts each workout tab once per visit as a GoatCounter event (path "page#tab"), skipped in frames the same way.
  (function(){
    var off = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var seen = {}, queue = [];
    function send(e){ try { window.goatcounter.count(e); } catch (x) {} }
    window.pwCountTab = function(tab, label){
      if (off || !tab || seen[tab]) return;
      seen[tab] = 1;
      var page = (location.pathname.split('/').pop() || 'index').replace(/\.html$/, '');
      var e = { path: page + '#' + tab, title: (label || tab) + ' · ' + document.title, event: true };
      if (window.goatcounter && window.goatcounter.count) send(e); else queue.push(e);
    };
    if (off) return;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://gc.zgo.at/count.js';

<script>
  // Draft tags and Alex's reviewer button (tools/review/drafts.py writes this block; edit tools/review/snippet.html, then run drafts.py sync).
  // A page is Draft while its row in tools/REVIEW.md is not ✅: <meta name="pw-draft"> on the page, data-draft on its list cards.
  // ?reviewer (once, on any page) turns on reviewer mode in this browser; ?reviewer=off turns it off.
  (function(){
    var on = false, embed = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var m = /[?&]reviewer(?:=([^&]*))?/.exec(location.search);
    on = !!m && m[1] !== 'off';
    try {
      if (m) { if (m[1] === 'off') localStorage.removeItem('pw-reviewer'); else localStorage.setItem('pw-reviewer', '1'); }
      else on = localStorage.getItem('pw-reviewer') === '1';
    } catch (e) {}
    var CSS = '.pw-draft{display:inline-block;vertical-align:middle;margin-left:10px;font:600 11.5px/1.4 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:0;color:var(--bad,#b42318);border:1px dashed currentColor;border-radius:5px;padding:1px 7px;white-space:nowrap}'
      + '.act-top .pw-draft{margin-left:auto;flex:none}.act-top .pw-draft~.cp-tag,.act-top .pw-draft~.ta-tag{margin-left:0}'
      + 'a[data-draft]{position:relative}.pw-draft.pw-corner{position:absolute;top:10px;right:10px;margin:0;background:var(--panel,#fff)}'
      + '.pw-check{display:inline-block;vertical-align:middle;margin-left:8px;font:600 13px/1.4 "IBM Plex Sans",system-ui,sans-serif;color:#fff;background:#1a7f37;border-radius:6px;padding:4px 10px;text-decoration:none;white-space:nowrap}'
      + '.pw-check:hover{background:#116329}.pw-check:focus-visible{outline:2px solid #1a7f37;outline-offset:2px}'
      + '.pw-reviewer{position:fixed;left:10px;bottom:10px;z-index:9999;font:500 12px/1.4 "IBM Plex Mono",ui-monospace,monospace;background:#1d2433;color:#fff;border-radius:6px;padding:4px 9px;opacity:.85}'
      + '.pw-reviewer a{color:#ffc83d}';
    function tag(){ var t = document.createElement('span'); t.className = 'pw-draft'; t.title = 'Not yet checked'; t.textContent = 'Draft'; return t; }
    function go(){
      var st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st);
      var meta = document.querySelector('meta[name="pw-draft"]'), h1 = document.querySelector('h1');
      if (meta && h1 && !embed) {
        h1.appendChild(tag());
        if (on) {
          var page = meta.getAttribute('content'), b = document.createElement('a');
          b.className = 'pw-check'; b.target = '_blank'; b.rel = 'noopener'; b.textContent = '✓ Checked';
          b.title = 'Opens a GitHub issue. Submit it and the Draft tag goes in a minute or two.';

            + '&body=' + encodeURIComponent('Submit this issue to mark `' + page + '` as checked. The Draft tag goes in a minute or two, and the issue closes itself.');
          h1.appendChild(b);
        }
      }
      document.querySelectorAll('a[data-draft]').forEach(function(a){
        if (a.querySelector('.pw-draft')) return;
        var t = tag(), top = a.querySelector('.act-top');

        else { t.className += ' pw-corner'; a.appendChild(t); }
      });
      // No tag on a unit or theme heading (Alex, 12 Nov 2026): only the pages and their cards.
      if (on && !embed) {
        // Carry ?reviewer in every link to another page of the site, so reviewer mode survives
        // browsers that clear site storage (school Chromebooks) and pages cached from before.
        var carry = function(a){
          try {
            var u = new URL(a.href, location.href);

            u.searchParams.set('reviewer', ''); a.href = u.href.replace('reviewer=', 'reviewer');

  // The model. Seen from above. Sound travels at v = 340 m/s in every direction, whatever the source does.
  //   Moving source: wavefront n is a circle centred on where the source was when it sent it out, radius v × (time since).

  //   Moving observer (IB): the source is at rest, the wavefronts share one centre and the wavelength in the air is
  //   unchanged; the sound passes the observer at v ± u, so f′ = f (v ± u)/v.
  //   An observer at the roadside (within LINE of the road's centre line) is treated as in line with the motion, as exam
  //   questions do, so the readings match the working. Further from the road the page uses the true angle.
  // The picture is NOT to scale, and says so: the wavefronts are drawn far apart (a real 400 Hz wavelength is 0.85 m),
  //   and time is slowed. The ratios are true: wavefront spacing in front ÷ behind = (v − u) ÷ (v + u).
  // The oscilloscope screens are 10 ms across (1 ms per square), drawn from the frequency each microphone receives.
  // Question kinds, from Alex's three question indexes (read 20 Nov 2026):
  //   who:     who hears the highest or the lowest frequency, and who hears the frequency the source sends (the driver,
  //            no relative motion): 4PH1/1PR May 2023 Q5, 4PH1/1P Nov 2020 Q11(b)(iii), 4PH1/2P May 2026 Q8(b),
  //            9PH0/02 Nov 2021 Q6, IB P1 HL Nov 2004 Q24
  //   pattern: which wavefront diagram is right for a moving source (IB P1 HL May 2006 TZ1 Q22, May 2005 TZ1 Q24)
  //   pass:    which graph of observed frequency against time as the source passes an observer, or an observer passes
  //            the source (IB P1 HL May 2006 TZ2 Q24, Nov 2006 Q26; P2 HL May 2010 TZ1 B3 part 2(a)(ii); 4PH1/1PR May 2023 Q5)
  //   calc:    IGCSE, IAL and IB SL: f = v ÷ λ for the sound that arrives, or λ = v ÷ f (the mark schemes' last step:
  //            4PH1/1P Nov 2024 Q8(b), Jan 2023 P1R Q10(b), Nov 2020 P1 Q11(b)(ii)). IB HL: the observed frequency from a
  //            moving source, the wavelength received, and a moving observer (P2 HL May 2019 TZ2 Q3(e)(i) and (ii),
  //            P2 HL Nov 2008 B2 part 2(b)(ii), P1 HL Nov 2018 Q29). Never both moving (the IB guide rules it out).
  //   The notes follow the IGCSE mark schemes for "explain why the frequency is higher / lower": wavefronts closer
  //   together or further apart, wavelength shorter or longer, speed of sound constant, v = fλ.
  var SHOW=(location.search.match(/[?&]show=(predict)\b/)||[])[1];
  var svg=$('#dp-svg'), playBtn=$('#dp-play'), resetBtn=$('#dp-reset'), slowBtn=$('#dp-slow'), newBtn=$('#dp-new'), uIn=$('#dp-u'), fIn=$('#dp-f'), ansIn=$('#dp-ans');
  svg.innerHTML='<g id="dp-live"></g><g id="dp-picks"></g>';
  var live=$('#dp-live'), picksG=$('#dp-picks'), picksHtml=null;
  function levelGroup(el, onPick){ var sg=segGroup(el, onPick); if(PW_LEVEL && el.querySelector('[data-v="'+PW_LEVEL+'"]')) sg.pick(PW_LEVEL); return sg; }
  var tabSeg=segGroup($('#dp-tab'), function(){ setTab(); });
  var levelSeg=levelGroup($('#dp-level'), function(){ setLevel(); });
  var moveSeg=segGroup($('#dp-move'), function(v){ setMove(v); });
  var courseSeg=segGroup($('#dp-course'), function(){ workKey=''; lastNote=''; if(predict()){ Q.n=0; Q.tried=0; Q.right=0; deal(); } else draw(); });
  var listenSeg=segGroup($('#dp-listen'), function(){ audio(); });
  function predict(){ return tabSeg.value()==='predict'; }
  function lvl(){ return levelSeg.value(); }
  function ib(){ return lvl()==='ib'; }
  function hl(){ return ib() && courseSeg.value()==='hl'; }
  function slow(){ return pressed(slowBtn) ? 0.3 : 1; }
  function MS(){ return lvl()==='igcse' ? 'm/s' : 'm s⁻¹'; }
  function VFL(){ return lvl()==='igcse' ? 'v = f × λ' : 'v = fλ'; }
  function hears(){ return ib() ? 'observes' : 'hears'; }

  // ---- constants and small helpers
  var V=340, C=100, MW=600, YR=196, SX=300, SY=YR+30, TMAX=11, LINE=30;
  var COL={A:'var(--dp-a)', B:'var(--dp-b)', X:'var(--dp-a)', Y:'var(--dp-b)', Z:'var(--dp-c)'}, GOOD='var(--good)', BAD='var(--bad)', INK='var(--ink)', WAVE='var(--dp-wave)';
  function rnd(list){ return list[Math.floor(Math.random()*list.length)]; }
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
  function circ(x,y,r,fill,extra){ return '<circle cx="'+f1(x)+'" cy="'+f1(y)+'" r="'+f1(Math.max(0,r))+'" fill="'+fill+'"'+(extra||'')+'/>'; }
  function vehName(u){ return u<60 ? 'ambulance' : u<140 ? 'racing car' : 'jet'; }
  function vehSound(u){ return u<60 ? 'siren' : 'engine'; }

  // ---- the scene: {mode:'src'|'obs', dir, u (m/s), f (Hz), t (s of picture time), x0, obs:[{id, x, y, ride}]}
  function beta(s){ return s.u/V; }
  function moverX(s, t){ return s.x0+s.dir*beta(s)*C*t; }
  function srcPos(s, te){ return s.mode==='src' ? {x:moverX(s,te), y:YR} : {x:SX, y:SY}; }
  function obsPos(s, o){ return o.ride ? {x:moverX(s,s.t), y:YR} : {x:o.x, y:o.y}; }
  // what an observer receives now: {on, r (observed frequency ÷ source frequency), rel: to | away | side | rest | with}
  function hear(s, o){
    var b=beta(s), U=b*C, t=s.t, p=obsPos(s,o), dy, px, R, cs;
    if(s.mode==='obs'){
      if(!o.ride) return {on:Math.hypot(p.x-SX,p.y-SY)<=C*t, r:1, rel:'rest'};
      R=Math.abs(p.x-SX); cs=R<0.5 ? 0 : s.dir*(p.x-SX)/R;   // cs > 0: moving away from the source
      return {on:R<=C*t, r:1-b*cs, rel:b===0?'rest':cs<0?'to':cs>0?'away':'side'};
    }
    if(o.ride) return {on:s.t>0, r:1, rel:'with'};
    dy=p.y-YR; if(Math.abs(dy)<=LINE) dy=0;
    px=s.dir*(p.x-s.x0);
    var A2=U*U-C*C, B2=-2*px*U+2*C*C*t, C2=px*px+dy*dy-C*C*t*t, te=(-B2+Math.sqrt(Math.max(0,B2*B2-4*A2*C2)))/(2*A2);
    if(te<0) return {on:false, r:1, rel:'none'};
    R=Math.hypot(px - U*te,dy); cs=R<0.5 ? 0 : (px - U*te)/R;
    return {on:true, r:1/(1-b*cs), rel:b===0?'rest':cs>0.15?'to':cs<-0.15?'away':'side'};
  }
  function fronts(s){ var Td=0.44*400/s.f, n=Math.floor(s.t/Td+1e-9), a=[], j, te, r, c;
    for(j=0;j<=n;j++){ te=j*Td; r=C*(s.t-te); if(r>800 || r<=0) continue; c=srcPos(s,te); a.push({x:c.x, y:c.y, r:r, age:s.t-te}); }
    return a; }
  function ended(s){ var x=moverX(s,s.t); return s.t>=TMAX || (beta(s)>0 && (s.dir>0 ? x>=MW-25 : x<=25)); }

  // ---- state
  var E, running=false, raf=0, last=0, lastNote='', workKey='', drag=null;
  var Q={n:0, tried:0, right:0, phase:'ask', kind:'', ok:false, u:0, last:'', pick:null, val:null, q:null, s:null};
  function homeObs(mode){ return mode==='src' ? [{id:'A', x:520, y:YR+26},{id:'B', x:40, y:YR+26}] : [{id:'A', ride:true},{id:'B', x:520, y:YR+26}]; }
  function newE(mode){ E={mode:mode, dir:1, u:+uIn.value, f:+fIn.value, t:0, x0:mode==='src'?110:40, obs:homeObs(mode), pk:{}}; }
  newE('src');

  // ---- layout
  var LY, TALL, P, SCP, k;
  function layout(){
    var v=sizeView(svg,{VW:860,VH:350},{VW:430,VH:646}); LY=v; TALL=v.VW===430;
    P = TALL ? {x:6,y:4,w:418,h:240} : {x:6,y:4,w:596,h:342}; k=P.w/MW;
    SCP = TALL ? {x:6,y:252,w:418,h:130} : {x:612,y:4,w:242,h:114};
  }
  function X(x){ return P.x+x*k; }
  function Y(y){ return P.y+y*k; }
  function miniBox(j){ return TALL ? {x:6+212*(j%2), y:4+321*Math.floor(j/2), w:206, h:317} : {x:6+213.5*j, y:4, w:207.5, h:342}; }
  function at(G,s){ return '<g transform="translate('+f1(G.x)+','+f1(G.y)+')">'+s+'</g>'; }

  // ---- the vehicles, seen from above, pointing right, about 50 long
  function vehicle(u){
    var s=rect(-21,-8,48,22,'#000',' rx="6" opacity=".16"');
    if(u<60) return s+rect(-23,-11,46,22,'#f4f6f8',' rx="5" stroke="#8a94a3" stroke-width="1"')+rect(11,-9,7,18,'#4f6f8f',' rx="2"')+rect(3,-9.5,4,19,'#1c7ed6',' rx="1.5"')+
      rect(-13,-6.5,4,13,'#e03131')+rect(-17.5,-2,13,4,'#e03131')+ln(-21,-9.2,9,-9.2,'#fff',1.4);
    if(u<140) return s+rect(-17,-13,9,5,'#212529',' rx="1.5"')+rect(-17,8,9,5,'#212529',' rx="1.5"')+rect(10,-12,8,4.5,'#212529',' rx="1.5"')+rect(10,7.5,8,4.5,'#212529',' rx="1.5"')+
      rect(-25,-10,5,20,'#343a40',' rx="1"')+pg([[-20,-5],[-4,-7],[8,-4],[24,-2.5],[24,2.5],[8,4],[-4,7],[-20,5]],'#e03131',' stroke="#a61e1e" stroke-width="1"')+
      rect(20,-10,4,20,'#343a40',' rx="1"')+ell(-2,0,5,3.3,'#212529')+circ(-2,0,2.3,'#ffd43b')+ln(-18,-3,20,-1.4,'#fff',1,' opacity=".55"');
    return s+pg([[5,0],[-9,-25],[-17,-25],[-8,0],[-17,25],[-9,25]],'#8d99a8',' stroke="#6b7684" stroke-width="1"')+pg([[-18,0],[-25,-10],[-29,-10],[-24,0],[-29,10],[-25,10]],'#8d99a8',' stroke="#6b7684" stroke-width="1"')+
      pg([[29,0],[18,-4.2],[-22,-3.6],[-27,0],[-22,3.6],[18,4.2]],'#c9d0d9',' stroke="#7a8594" stroke-width="1"')+ell(14,0,5,2.3,'#3b5b7a')+ln(-20,-1.4,17,-1.7,'#fff',1,' opacity=".7"');
  }
  function person(x,y,id,state){
    var r=Math.max(9.5,10.5*k), col=COL[id], s=ell(x,y+1,r*1.45,r*0.8,col,' opacity=".5"');
    if(state) s+=circ(x,y,r+5.5,'none',' stroke="'+(state==='good'?GOOD:state==='bad'?BAD:INK)+'" stroke-width="3"');
    return s+circ(x,y,r,col,' class="ring" stroke="var(--panel)" stroke-width="1.5"')+txt(x,y+4.2,id,{a:'middle',fs:12,w:700,c:'#fff'});
  }

  // ---- the picture seen from above. o: drag (observers can be dragged), pick (observers are the answers), marks {id: state}
  function sceneHtml(s,o){
    o=o||{}; var b=beta(s), U=b*C, fr=fronts(s), inn='', top='', pk='', i, m=moverX(s,s.t), q, x1, x2, yb, F, G2;
    inn+=rect(X(0),Y(YR-22),P.w,44*k,'var(--dp-road)');
    for(i=0;i<15;i++) inn+=rect(X(8+i*40),Y(YR)-1,22*k,2,'var(--dp-dash)');
    fr.forEach(function(w){ inn+=circ(X(w.x),Y(w.y),w.r*k,'none',' stroke="'+WAVE+'" stroke-width="1.7" opacity="'+clamp(1-w.r/640,0.22,0.9).toFixed(2)+'"'); });
    // one wavelength, marked in front of the source and behind it
    function bracket(sign, speed){
      for(i=fr.length-1;i>=1;i--){ F=fr[i]; G2=fr[i-1]; if(speed*F.age<34) continue;
        x1=F.x+sign*s.dir*F.r; x2=G2.x+sign*s.dir*G2.r; if(Math.min(x1,x2)<6 || Math.max(x1,x2)>MW-6) return;
        yb=Y(F.y+34); inn+=ln(X(x1),Y(F.y)+2,X(x1),yb+4,INK,1.3)+ln(X(x2),Y(F.y)+2,X(x2),yb+4,INK,1.3)+ln(X(x1),yb,X(x2),yb,INK,2); return; }
    }
    if(s.mode==='src'){ bracket(1,C-U); bracket(-1,C+U); } else bracket(1,C);
    if(s.mode==='obs') inn+=circ(X(SX),Y(SY),10*k+1,'#343a40')+circ(X(SX),Y(SY),6*k+0.6,'#fa5252')+circ(X(SX),Y(SY),2.2,'#fff');
    inn+='<g transform="translate('+f1(X(m))+','+f1(Y(YR))+') scale('+(s.dir*k).toFixed(3)+','+k.toFixed(3)+')">'+vehicle(s.u)+'</g>';
    if(b>0) inn+=arrow(X(m-s.dir*12),Y(YR-34),X(m+s.dir*(16+70*b)),Y(YR-34),INK,2.2);
    s.obs.forEach(function(ob){
      var p=obsPos(s,ob), px=X(ob.ride ? p.x-s.dir*3 : p.x), py=Y(p.y), g=person(px,py,ob.id,o.marks && o.marks[ob.id]);
      if(o.pick) pk+='<g class="pick" data-pick="o:'+ob.id+'" tabindex="0" role="button" aria-pressed="'+(o.marks && o.marks[ob.id]==='sel')+'" aria-label="Observer '+ob.id+'">'+circ(px,py,19,'#fff',' fill-opacity="0"')+g+'</g>';
      else if(o.drag && !ob.ride) pk+='<g class="pick grab" data-pick="o:'+ob.id+'" tabindex="0" role="button" aria-label="Observer '+ob.id+': drag, or use the arrow keys">'+circ(px,py,19,'#fff',' fill-opacity="0"')+g+'</g>';
      else top+=g;
    });
    top+=txt(P.x+10,P.y+17,'Seen from above, not to scale',{fs:11,halo:1})+txt(P.x+P.w-10,P.y+17,Math.round(100*b)+'% of the speed of sound',{a:'end',fs:11,halo:1});
    top+=ln(P.x+10,P.y+P.h-17,P.x+10,P.y+P.h-7,INK,1.3)+ln(P.x+30,P.y+P.h-17,P.x+30,P.y+P.h-7,INK,1.3)+ln(P.x+10,P.y+P.h-12,P.x+30,P.y+P.h-12,INK,2)+txt(P.x+36,P.y+P.h-8,'one wavelength',{fs:11,halo:1});
    return {g:'<defs><clipPath id="dp-clip"><rect x="'+f1(P.x)+'" y="'+f1(P.y)+'" width="'+f1(P.w)+'" height="'+f1(P.h)+'" rx="10"/></clipPath></defs>'+rect(P.x,P.y,P.w,P.h,'var(--dp-ground)',' rx="10"')+'<g clip-path="url(#dp-clip)">'+inn+'</g>'+top, pk:pk};
  }

  // ---- the oscilloscopes: list of {label, col, fq (Hz, or null for no sound)}
  var TRACE={A:'#ffb066', B:'#7cc4ff', X:'#ffb066', Y:'#7cc4ff', Z:'#d0b3ff', S:'#e9eef8'};
  function scopes(list){
    var s='';
    list.forEach(function(it,j){
      var x=SCP.x, y=SCP.y+j*SCP.h, bx=x+1, by=y+27, bw=SCP.w-13, bh=SCP.h-36, sx=bx+7, sy=by+6, sw=bw-44, sh=bh-12, i, pts=[], mid=sy+sh/2, n=Math.round(sw*2);
      s+=txt(x+2,y+12,it.label,{fs:12,w:600,c:it.col||INK});
      if(j===0) s+=txt(x+SCP.w-3,y+12,'1 ms per square',{a:'end',fs:11,c:'var(--ink-faint)'});
      s+=box(bx,by,bw,bh,10,-7,'var(--dp-case)')+rect(sx,sy,sw,sh,'#0b1a14',' rx="3"');
      for(i=1;i<10;i++) s+=ln(sx+sw*i/10,sy,sx+sw*i/10,sy+sh,'#1f4032',1);
      for(i=1;i<4;i++) s+=ln(sx,sy+sh*i/4,sx+sw,sy+sh*i/4,'#1f4032',1);
      if(it.fq){ for(i=0;i<=n;i++) pts.push([sx+sw*i/n, mid-sh*0.36*Math.sin(2*Math.PI*it.fq*0.010*i/n)]); s+=pl(pts,TRACE[it.key],1.5); }
      else s+=ln(sx,mid,sx+sw,mid,TRACE[it.key],1.5);
      s+=circ(bx+bw-19,by+bh*0.3,6.5,'#c9d0d9',' stroke="#2b3340" stroke-width="1"')+ln(bx+bw-19,by+bh*0.3,bx+bw-19,by+bh*0.3-6,'#2b3340',1.5)+circ(bx+bw-19,by+bh*0.72,6.5,'#c9d0d9',' stroke="#2b3340" stroke-width="1"')+ln(bx+bw-19,by+bh*0.72,bx+bw-14,by+bh*0.72-4,'#2b3340',1.5);
    });
    return s;
  }
  function scopeList(s, first){
    var a = first ? [{label:'The source sends', key:'S', fq:s.f}] : [];
    s.obs.forEach(function(ob){ var h=hear(s,ob); a.push({label:ob.id+' '+hears(), key:ob.id, col:COL[ob.id], fq:h.on ? s.f*h.r : null}); });
    return a;
  }

  // ---- small diagrams for the questions: a wavefront pattern or a graph, in a box G
  var WCAP={still:'source not moving', right:'moving to the right', left:'moving to the left', oval:'never: wavefronts are circles'};
  var GCAP={down:'higher, then lower', up:'no: the wrong way round', fall:'no: it changes only as it passes', peak:'no: this is the loudness'};
  function miniHtml(G,j,kind,state,dn,graph){
    var W=G.w, H=G.h, s=rect(0,0,W,H,'var(--dp-ground)',' rx="9"'), letter='WXYZ'.charAt(j), col = state==='good' ? GOOD : state==='bad' ? BAD : INK, i, r;
    if(graph){
      var x0=32, x1=W-16, y0=58, y1=H-64, xm=(x0+x1)/2, yh=y0+(y1-y0)*0.2, yl=y0+(y1-y0)*0.74;
      s+=ln(x0,y0-12,x0,y1,INK,1.5)+ln(x0,y1,x1+4,y1,INK,1.5)+ln(xm,y0,xm,y1+5,'var(--ink-faint)',1.2,' stroke-dasharray="4 4"');
      s+=txt(8,y0-18,'frequency',{fs:11})+txt(x1+4,y1+17,'time',{a:'end',fs:11})+txt(xm,y1+17,'passes',{a:'middle',fs:11});
      s+=pl({down:[[x0,yh],[xm-9,yh],[xm+9,yl],[x1,yl]], up:[[x0,yl],[xm-9,yl],[xm+9,yh],[x1,yh]], fall:[[x0,yh],[x1,yl]], peak:[[x0,yl],[xm,yh],[x1,yl]]}[kind],WAVE,2.6);
    } else {
      var R0=15, cy=H/2+8, d=kind==='right' ? 1 : kind==='left' ? -1 : 0, cx=W/2+d*0.5*R0*5;
      for(i=1;i<=5;i++){ r=R0*i; s+= kind==='oval' ? ell(cx,cy,r*1.25,r*0.72,'none',' stroke="'+WAVE+'" stroke-width="1.7"') : circ(cx-d*0.5*r,cy,r,'none',' stroke="'+WAVE+'" stroke-width="1.7"'); }
      s+=circ(cx,cy,4.5,INK);
    }
    s+=txt(W/2,22,'Diagram '+letter+(state==='good'?' ✓':state==='bad'?' ✗':''),{a:'middle',fs:12.5,w:700,c:col});
    if(dn) s+=txt(W/2,H-12,(graph?GCAP:WCAP)[kind],{a:'middle',fs:11});
    return {g:s, letter:letter, frame:'<rect class="ring" x="1.2" y="1.2" width="'+f1(W-2.4)+'" height="'+f1(H-2.4)+'" rx="9" fill="#fff" fill-opacity="0" stroke="'+col+'" stroke-width="'+(state?2.8:1)+'"'+(state?'':' opacity=".4"')+'/>'};
  }

  // ---- drawing
  function draw(){
    layout();
    var out='', pk='', sc, q=Q.q, ask=Q.phase==='ask', dn=Q.phase==='done';
    if(!predict()){ sc=sceneHtml(E,{drag:true}); out=sc.g+scopes(scopeList(E,true)); pk=sc.pk; }
    else if((Q.kind==='pattern' || Q.kind==='pass') && Q.phase!=='run'){
      q.order.forEach(function(kind,j){ var G=miniBox(j), st = dn ? (j===q.ans?'good':Q.pick===j?'bad':'') : (Q.pick===j?'sel':''), m=miniHtml(G,j,kind,st,dn,Q.kind==='pass');
        out+=at(G,m.g);
        if(ask) pk+=at(G,'<g class="pick" data-pick="m:'+j+'" tabindex="0" role="button" aria-pressed="'+(Q.pick===j)+'" aria-label="Diagram '+m.letter+'">'+m.frame+'</g>'); else out+=at(G,m.frame); });
    } else {
      var marks={};
      if(Q.kind==='who'){ if(dn){ marks[q.ans]='good'; if(Q.pick && Q.pick!==q.ans) marks[Q.pick]='bad'; } else if(Q.pick) marks[Q.pick]='sel'; }
      sc=sceneHtml(Q.s,{pick:Q.kind==='who' && ask, marks:marks}); out=sc.g+scopes(scopeList(Q.s,Q.kind!=='who')); pk=sc.pk;
    }
    live.innerHTML=out;
    if(pk!==picksHtml){ setKeepFocus(picksG,pk); picksHtml=pk; }
    readings(); audio();
  }

  // ---- sound: the tone that A or B hears, only while the picture plays
  var AC=null, osc=null, gain=null, acBad=false;
  function audio(){
    var who=listenSeg.value(), on=false, fq=0, h;
    if(!predict() && running && who!=='off'){ h=hear(E,E.obs[who==='A'?0:1]); if(h.on){ on=true; fq=E.f*h.r; } }
    if(!AC){ if(!on || acBad) return;
      try{ var Ctor=window.AudioContext||window.webkitAudioContext; AC=new Ctor(); osc=AC.createOscillator(); gain=AC.createGain(); gain.gain.value=0; osc.connect(gain); gain.connect(AC.destination); osc.start(); }
      catch(e){ AC=null; acBad=true; return; } }
    try{ if(on && AC.state==='suspended') AC.resume(); if(on) osc.frequency.setTargetAtTime(fq,AC.currentTime,0.02); gain.gain.setTargetAtTime(on?0.05:0,AC.currentTime,0.03); }catch(e){}
  }

  // ---- readings, working and the note
  function setEq(e1,e2,e3,e4){ [e1,e2,e3].forEach(function(e,i){ var el=$('#dp-eq'+(i+1)); el.hidden=!e; el.innerHTML=FR(e||''); }); $('#dp-eq4').hidden=!e4; $('#dp-eq4').innerHTML=FR(e4||''); }
  function work(){
    var key=[lvl(),hl(),E.mode,E.u,E.f].join('|'); if(key===workKey) return; workKey=key;

  // ---- motion

  }
  function loop(){ cancelAnimationFrame(raf); last=performance.now(); raf=requestAnimationFrame(frame); }
  function stopRun(){ running=false; cancelAnimationFrame(raf); }

  // ---- Questions

  playBtn.addEventListener('click', function(){
    if(predict()){ if(Q.phase==='ask') go(); return; }
    if(running){ stopRun(); lastNote=''; draw(); return; }
    if(ended(E)){ E.t=0; E.pk={}; }
    running=true; lastNote=''; loop();
  });
  resetBtn.addEventListener('click', function(){
    if(predict()){ if(Q.phase!=='ask') return; Q.pick=null; ansIn.value=''; lastNote=''; draw(); return; }
    stopRun(); newE(E.mode); lastNote=''; draw();
  });
  slowBtn.addEventListener('click', function(){ slowBtn.setAttribute('aria-pressed', String(!pressed(slowBtn))); });
  newBtn.addEventListener('click', function(){ deal(); });
  uIn.addEventListener('input', restart); fIn.addEventListener('input', restart);
  $('#dp-jump').addEventListener('click', function(e){ var b=e.target.closest('button'); if(!b) return; uIn.value=b.dataset.v; restart(); });
  ansIn.addEventListener('input', function(){ readings(); });
  ansIn.addEventListener('keydown', function(e){ if(e.key==='Enter' && !playBtn.disabled){ e.preventDefault(); playBtn.click(); } });
  ['#dp-eq1','#dp-eq2','#dp-eq3'].forEach(function(s){ watchEquals($(s)); });

  // ---------- teacher page (not in a workout frame): the teach kit ----------
  // ---- teach kit (master: tools/teach-kit/kit.js; copied by tools/kits.py, do not edit here) ----
  /* Teacher page (Alex, 24 Nov 2026). An animation page opened on its own (not ?embed in a workout) is for a teacher
     showing it on a projector: they know the physics, so the picture is the main display and the controls are small.
     teachPage() hides the Explore | Questions switch (the questions are for students, in the workout frame, which is not
     changed), adds a "Student version with questions" link, puts the note, readings, hint and working behind a Notes
     button (in a card under the stage), moves the choices into one strip under the picture (or onto it), and makes the
     picture as big as the window allows with its controls still on screen.
     o = {
       svg:    the picture (svg.view),
       mode:   id of the Explore | Questions switch (leave out on a page that has none),
       strip:  ids of choice blocks for the strip under the picture, in order (a .cgrid, or a label and its buttons in a div),
       pic:    ids of choice blocks the picture itself does in layout B,
       pin:    'tr' | 'tl' | 'br' | 'bl': layout B lays the pic blocks over that corner of the picture;
               'hide': layout B hides them, as the picture already does that job (e.g. click a bar or a planet),
       q:      {href, label} for the student version, or null,
       layout: 'a' | 'b' | 'c' (default 'b'); ?layout= overrides it,
       trial:  true shows a "Layout A | B | C" picker on the title line (while Alex compares),
       onLayout: function(L), called after each change of layout
     }
     A: all the choices in the strip. B: the pic blocks on the picture (or hidden), the rest in the strip. C: the choices in
     a narrow column beside the picture. Returns {fit, layout} or null in a frame. */
  function teachPage(o){
    if(/[?&]embed\b/.test(location.search) || window.self!==window.top) return null;
    var $=function(id){ return document.getElementById(id); };
    var root=document.documentElement, svg=o.svg, stage=svg.closest('.stage'), left=svg.closest('.stage > *');
    var under=left.querySelector('.under'), side=stage.querySelector('.side'), head=document.querySelector('.page-head');
    var strip=(o.strip||[]).map($).filter(Boolean), pics=(o.pic||[]).map($).filter(Boolean), L='b';
    root.classList.add('teach');
    if(!$('teach-kit-css')){
      var st=document.createElement('style'); st.id='teach-kit-css';
      st.textContent=''
        +'.teach .page{max-width:1900px;padding-block:6px 24px;}'
        +'.teach .home-link{min-height:32px;margin:0;}'
        +'.teach .page-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-start;gap:6px 16px;margin-bottom:8px;}'
        +'.teach .page-head .eyebrow{display:none;}'
        +'.teach .page-head h1{font-size:26px;}'
        +'.tk-q{font:600 13px var(--font-mono,monospace);color:var(--topic,var(--accent));text-decoration:none;min-height:32px;display:inline-flex;align-items:center;}'
        +'.tk-q:hover{text-decoration:underline;}'
        +'.tk-lay{margin-left:auto;display:flex;align-items:center;gap:8px;font:12.5px var(--font-mono,monospace);color:var(--ink-soft);}'
        +'.tk-lay .seg button{min-height:32px;padding:4px 12px;}'
        +'.teach .stage{padding:12px;gap:12px 18px;grid-template-columns:minmax(0,1fr);}'
        +'.teach .view{max-height:none;}'
        +'.teach .side{display:none;}'
        +'.teach .under{display:flex;flex-direction:row;flex-wrap:wrap;margin-top:8px;gap:8px 18px;align-items:flex-end;}'
        +'.teach .under .sliders{flex:1 1 340px;}'
        // small controls: the picture is the display (Alex, 24 Nov 2026: zoomed in on a projector the full-size buttons were huge)
        +'.teach .under .btn{min-height:36px;padding:5px 12px;font-size:14.5px;border-radius:8px;}'
        +'.teach .under .btn-group{gap:6px;}'
        // bigger text that may take two lines ("No / epicycles"), so a group stays narrow (Alex, 24 Nov 2026)
        +'.teach .tk-strip .seg button,.teach .tk-strip .jumprow button{min-height:36px;padding:3px 9px;font-size:14.5px;line-height:1.15;white-space:normal;max-width:calc(10ch + 24px);text-align:center;flex:0 0 auto;}'
        +'.teach .tk-strip .rowlab,.teach .under .lab{font-size:12.5px;margin-bottom:2px;}'
        +'.teach .under input[type=range]{min-height:20px;}'
        +'.tk-strip{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:flex-end;}'
        +'.tk-strip:empty{display:none;}'
        +'.tk-strip>*{margin:0;}'
        +'.tk-pic{position:relative;margin-inline:auto;}'
        +'.tk-on{position:absolute;display:flex;flex-direction:column;gap:4px;padding:3px;border-radius:8px;background:color-mix(in srgb,var(--panel) 80%,transparent);max-width:calc(100% - 12px);}'
        +'.tk-on:empty{display:none;}'
        +'.tk-on.tr{top:6px;right:6px;align-items:flex-end;}.tk-on.tl{top:6px;left:6px;}.tk-on.br{bottom:6px;right:6px;align-items:flex-end;}.tk-on.bl{bottom:6px;left:6px;}'
        +'.tk-on .rowlab{display:none;}'
        +'.tk-on .cgrid.kit,.tk-on .cgrid.kit>.cgroup{gap:0;}'
        +'.tk-on .seg button{min-height:26px;padding:2px 8px;font-size:11.5px;}'
        +'.tk-on .seg{flex-wrap:wrap;justify-content:flex-end;}'
        +'.tk-notes{margin-top:12px;padding:14px;}'
        +'.tk-notes>div{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:10px 18px;align-items:start;}'
        +'.tk-notes .note{min-height:0;}'
        +'.lay-c .stage{grid-template-columns:minmax(0,1fr) 250px;}'
        +'.lay-c .side{display:flex;}'
        +'@media (max-width:860px){ .lay-c .stage{grid-template-columns:minmax(0,1fr);} }';
      document.head.appendChild(st);
    }
    // the title line: back link, title, student version, layout picker
    var home=document.querySelector('.home-link'); if(home && head) head.insertBefore(home, head.firstChild);
    if(o.q && head){ var a=document.createElement('a'); a.className='tk-q'; a.href=o.q.href; a.innerHTML=o.q.label||'Student version with questions &rarr;'; head.appendChild(a); }
    if(o.mode && $(o.mode)) $(o.mode).hidden=true;   // the Choice kit then hides "Try the questions" too
    // Notes: everything left in the side column that is not a choice
    var notes=document.createElement('div'); notes.className='card tk-notes'; notes.hidden=true;
    var inner=document.createElement('div'); notes.appendChild(inner);
    Array.prototype.slice.call(side.children).forEach(function(c){ if(c.id!==o.mode && strip.indexOf(c)<0 && pics.indexOf(c)<0) inner.appendChild(c); });
    stage.parentNode.insertBefore(notes, stage.nextSibling);
    // Notes goes in the main button row: the one with "Try the questions" if there is one (a page may have a hidden Questions row first)
    var tq=under.querySelector('.btn-group .to-q'), bg=tq?tq.parentNode:under.querySelector('.btn-group'), nb=document.createElement('button');
    nb.className='btn'; nb.type='button'; nb.textContent='Notes'; nb.setAttribute('aria-expanded','false');
    var toq=bg.querySelector('.to-q'); bg.insertBefore(nb, toq||null);
    nb.addEventListener('click',function(){ notes.hidden=!notes.hidden; nb.setAttribute('aria-expanded',notes.hidden?'false':'true'); if(!notes.hidden) notes.scrollIntoView({block:'nearest'}); });
    // where the choices go
    var row=document.createElement('div'); row.className='tk-strip'; under.insertBefore(row, under.firstChild);
    var wrap=document.createElement('div'); wrap.className='tk-pic'; svg.parentNode.insertBefore(wrap, svg); wrap.appendChild(svg);
    var on=document.createElement('div'); on.className='tk-on '+(o.pin||'tr'); wrap.appendChild(on);
    function fit(){
      svg.style.maxHeight=''; wrap.style.maxWidth='';
      if(window.innerWidth<=560) return;
      var r=stage.getBoundingClientRect(), sv=svg.getBoundingClientRect(), rest=r.height-sv.height;
      if(L==='c') rest=Math.max(0, left.getBoundingClientRect().height-sv.height)+24;
      var mh=Math.max(260, Math.floor(window.innerHeight-(r.top+window.scrollY)-rest-12));
      svg.style.maxHeight=mh+'px';
      // the box round the picture is only as wide as the picture drawn, so anything laid on a corner stays on it
      var vb=svg.viewBox && svg.viewBox.baseVal;
      if(vb && vb.height) wrap.style.maxWidth=Math.floor(mh*vb.width/vb.height)+'px';
    }
    function layout(x){
      L=x; root.classList.remove('lay-a','lay-b','lay-c'); root.classList.add('lay-'+x);
      var hide=x==='b' && o.pin==='hide';
      if(x==='c'){ strip.concat(pics).forEach(function(e){ side.appendChild(e); }); }
      else{
        strip.forEach(function(e){ row.appendChild(e); });
        pics.forEach(function(e){ (x==='b' && !hide ? on : row).appendChild(e); });
      }
      pics.forEach(function(e){ e.style.display=hide?'none':''; });
      if(lp) Array.prototype.forEach.call(lp.querySelectorAll('button'),function(b){ b.setAttribute('aria-pressed',b.getAttribute('data-l')===x?'true':'false'); });
      if(o.trial){ try{ var u=new URL(location.href); u.searchParams.set('layout',x); history.replaceState(null,'',u.href); }catch(e){} }
      if(o.onLayout) o.onLayout(x);
      fit();
    }
    var lp=null;
    if(o.trial && head){
      lp=document.createElement('div'); lp.className='tk-lay';
      lp.innerHTML='<span id="tk-lay-lab">Layout</span><div class="seg pick fit" role="group" aria-labelledby="tk-lay-lab"><button type="button" data-l="a">A</button><button type="button" data-l="b">B</button><button type="button" data-l="c">C</button></div>';
      head.appendChild(lp);
      lp.addEventListener('click',function(e){ var b=e.target.closest('button'); if(b) layout(b.getAttribute('data-l')); });
    }
    layout((location.search.match(/[?&]layout=([abc])\b/)||[])[1]||o.layout||'b');
    window.addEventListener('resize',fit); window.addEventListener('load',fit); setTimeout(fit,0);
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
    if(window.ResizeObserver) new ResizeObserver(function(){ requestAnimationFrame(fit); }).observe(under);
    return {fit:fit, layout:function(){ return L; }};
  }
  // ---- end of teach kit ----
  if(teachPage({svg:svg, mode:'dp-tab', strip:['dp-grid'],
      q:(!PW_LEVEL||PW_LEVEL==='igcse')?{href:'../waves.html#behaviour'}:null})){
    var tkq=document.querySelector('.tk-q'); document.querySelector('.page-head').insertBefore($('#dp-level'), tkq||null);
  }
  if(SHOW==='predict'){ tabSeg.pick('predict'); setTab(); }
  else { setRows(); draw(); }
  // redraw when the picture changes between its wide and its tall shape
  if(window.ResizeObserver) new ResizeObserver(function(){ var w=svg.getBoundingClientRect().width; if(LY && (w>0 && w<520)!==svg.classList.contains('tall')) draw(); }).observe(svg);

})();
</script>
<script id="choice-kit-js">
/* Choice kit (12 Nov 2026): the same block on every animation page. See tools/ANIMATION-STYLE.md, "Choices".
   A group of choices with one chosen gets a track round it (class pick); a .to-q button opens the questions from Explore. */
(function(){
  function on(b){ return b.getAttribute('aria-pressed')==='true' || b.classList.contains('is-on'); }
  function each(sel, fn){ Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }
  function mark(s){
    if(!s.classList.contains('pick')){
      var n=0; Array.prototype.forEach.call(s.children, function(b){ if(b.tagName==='BUTTON' && on(b)) n++; });
      if(n===1) s.classList.add('pick');
    }
    if(s.classList.contains('pick') && !s.hasAttribute('data-fit')){
      var d=getComputedStyle(s).display;
      if(d!=='none'){ s.setAttribute('data-fit','1'); if(d.indexOf('flex')>=0) s.classList.add('fit'); }
    }
  }
  each('.seg:not(.tabs):not(.mode):not(.apps)', function(s){
    mark(s);
    if(window.MutationObserver) new MutationObserver(function(){ mark(s); }).observe(s, {childList:true, subtree:true, attributes:true, attributeFilter:['aria-pressed','class']});
  });
  // Choice rows: wrap each .rowlab and the control after it in a .cgroup (label above, groups side by side).
  // A group is hidden when everything in it is hidden, so pages that hide a row's label and control still work.
  function shown(e){ return !e.hidden && e.style.display!=='none'; }
  each('.cgrid:not(.kit)', function(g){
    var kids=Array.prototype.slice.call(g.children), groups=[];
    for(var i=0;i<kids.length;i++){
      var w=document.createElement('div'); w.className='cgroup';
      g.insertBefore(w, kids[i]); w.appendChild(kids[i]);
      if(kids[i].classList.contains('rowlab') && kids[i+1]){ w.appendChild(kids[i+1]); i++; }
      groups.push(w);
    }
    g.classList.add('kit'); if(groups.length===1) g.classList.add('one');
    groups.forEach(function(w){
      function sync(){ var any=false; Array.prototype.forEach.call(w.children, function(c){ if(shown(c)) any=true; }); w.hidden=!any; }
      sync();
      if(window.MutationObserver) Array.prototype.forEach.call(w.children, function(c){ new MutationObserver(sync).observe(c, {attributes:true, attributeFilter:['hidden','style']}); });
    });
  });
  each('.to-q[data-mode]', function(b){
    var seg=document.getElementById(b.getAttribute('data-mode')); if(!seg) return;
    var bs=seg.querySelectorAll('button');
    function sync(){ b.hidden=!on(bs[0]) || !seg.getClientRects().length; }   // hidden too when the page hides its mode switch (e.g. at a level with no questions)
    b.addEventListener('click', function(){ bs[1].click(); bs[1].focus(); });
    if(window.MutationObserver) new MutationObserver(sync).observe(seg, {subtree:true, attributes:true, attributeFilter:['aria-pressed']});
    document.addEventListener('click', function(){ setTimeout(sync, 0); });
    sync(); setTimeout(sync, 0);
  });
})();
</script>
