<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hooke’s Law Animation</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%231d2433%27/%3E%3Cpath d=%27M18.5 3 7 18h7.5l-2 11L25 13h-7.5z%27 fill=%27%23ffc83d%27 stroke=%27%23ffe08a%27 stroke-width=%271%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<meta name="description" content="Interactive physics animation. Load a spring, a metal wire or a rubber band and watch the force–extension graph, past the limit of proportionality.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1f5;
    --bg-grid:rgba(29,41,61,0.055);
    --panel:#ffffff;
    --panel-border:#d7dce4;
    --ink:#182233;
    --ink-soft:#4c5668;
    --ink-faint:#8993a5;
    --accent:#d9720c;
    --accent-soft:#fdead2;
    --good:#15803d;
    --good-soft:#dcf5e3;
    --bad:#c0311a;
    --bad-soft:#fbe1db;
    --shadow:0 10px 26px -14px rgba(24,34,51,0.28);

    --motion:#2158d1;      --motion-soft:#dfe8fc;
    --elastic:#0c8a76;     --elastic-soft:#d6f3ee;
    --momentum:#b8267a;    --momentum-soft:#fbdeee;
    --newton:#3d3aa8;      --newton-soft:#e3e2f8;
    --moments:#6d3bce;     --moments-soft:#e9e0fb;
    --units:#96660b;       --units-soft:#f6e8ca;

    --font-display:'Big Shoulders',system-ui,sans-serif;
    --font-body:'IBM Plex Sans',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12161f; --bg-grid:rgba(255,255,255,0.045);
      --panel:#1b212e; --panel-border:#2c3444;
      --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;
      --accent:#ff9a3d; --accent-soft:#3a2712;
      --good:#4ade80; --good-soft:#123321;
      --bad:#f27159; --bad-soft:#3a1712;
      --shadow:0 14px 30px -14px rgba(0,0,0,0.55);
      --motion:#7da3ff; --motion-soft:#1a2440;
      --elastic:#4fd6bd; --elastic-soft:#0f2e29;
      --momentum:#ef83bd; --momentum-soft:#3a1c2c;
      --newton:#9d9af0; --newton-soft:#242259;
      --moments:#b393f5; --moments-soft:#2a2148;
      --units:#e0b64a; --units-soft:#332a10;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12161f; --bg-grid:rgba(255,255,255,0.045);
    --panel:#1b212e; --panel-border:#2c3444;
    --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;
    --accent:#ff9a3d; --accent-soft:#3a2712;
    --good:#4ade80; --good-soft:#123321;
    --bad:#f27159; --bad-soft:#3a1712;
    --shadow:0 14px 30px -14px rgba(0,0,0,0.55);
    --motion:#7da3ff; --motion-soft:#1a2440;
    --elastic:#4fd6bd; --elastic-soft:#0f2e29;
    --momentum:#ef83bd; --momentum-soft:#3a1c2c;
    --newton:#9d9af0; --newton-soft:#242259;
    --moments:#b393f5; --moments-soft:#2a2148;
    --units:#e0b64a; --units-soft:#332a10;
    color-scheme:dark;
  }

  :root{--c:var(--elastic);--cs:var(--elastic-soft);}

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      linear-gradient(var(--bg-grid) 1px,transparent 1px) 0 0/100% 34px,
      linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px) 0 0/34px 100%,
      var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  [hidden]{display:none!important;}
  button{font:inherit;color:inherit;}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;}

  .page{max-width:1400px;margin-inline:auto;padding-inline:20px;padding-block:12px 40px;}
  h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:0.2px;text-wrap:balance;margin:0;}
  p{margin:0;line-height:1.55;}

  .home-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-bottom:4px;font:600 13px var(--font-mono);color:var(--ink-soft);text-decoration:none;}
  .home-link:hover{color:var(--accent);}
  .page-head{margin-bottom:12px;}
  .eyebrow{font-family:var(--font-mono);font-size:11.5px;color:var(--accent);font-weight:600;margin-bottom:6px;}
  .page-head h1{font-size:clamp(28px,5vw,38px);color:var(--ink);}

  .card{background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;box-shadow:var(--shadow);}
  .btn{
    font-family:var(--font-body);font-weight:600;font-size:13.5px;color:var(--ink);
    background:var(--panel);border:1px solid var(--panel-border);border-radius:9px;
    padding:9px 15px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  }
  .btn:hover{border-color:var(--ink-faint);}
  .btn:disabled{opacity:.45;cursor:default;}
  .btn-primary{background:var(--ink);border-color:var(--ink);color:var(--bg);}
  .btn-primary:hover{opacity:.88;border-color:var(--ink);}
  .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);}
  .btn-group{display:flex;flex-wrap:wrap;gap:10px;}

  /* picture on the left; controls, readings and working on the right */
  .stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);gap:18px 24px;align-items:start;padding:18px;}
  @media (max-width:860px){ .stage{grid-template-columns:minmax(0,1fr);} }
  /* the picture shrinks on short screens so the whole box fits in the window */
  .view{display:block;width:100%;height:auto;max-height:max(260px,calc(100vh - 290px));}
  .embed .view{max-height:460px;}
  .under{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;margin-top:12px;}
  .under .btn-group{flex:0 1 auto;}
  .mass{flex:1 1 220px;min-width:0;}
  .sliders{flex:1 1 100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px 24px;}
  .eq .why{font-family:var(--font-body);font-size:11.5px;color:var(--ink-faint);margin-left:.8em;}
  .view text{font-family:var(--font-mono);}
  #hk-svg [data-grab]{cursor:grab;touch-action:none;}
  #hk-svg.dragging,#hk-svg.dragging *{cursor:grabbing;}
  .side{display:flex;flex-direction:column;gap:12px;min-width:0;}
  .lab{display:flex;justify-content:space-between;font:12.5px var(--font-mono);color:var(--ink-soft);margin-bottom:6px;}
  .lab output{color:var(--ink);font-weight:600;}
  input[type=range]{width:100%;accent-color:var(--c);min-height:28px;}
  .choices{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 8px;align-items:center;}
  .choices .row{display:contents;}
  .choices .lab{margin:0;}
  .seg{display:flex;flex-wrap:wrap;gap:6px;}
  .seg button{font:12.5px var(--font-mono);padding:8px 12px;min-height:44px;border:1px solid var(--panel-border);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer;}
  .seg button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--panel);}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px;}
  .stat strong{white-space:nowrap;}
  .stat{border:1px solid var(--panel-border);border-radius:8px;padding:5px 8px;}
  .stat small{display:block;font:10.5px var(--font-mono);color:var(--ink-faint);}
  .stat strong{font:600 15px var(--font-mono);color:var(--ink);}
  .stat.up strong{color:var(--accent);}
  .exp-btns{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;}
  .rtable{width:100%;border-collapse:collapse;font:12.5px var(--font-mono);}
  .rtable th{position:sticky;top:0;background:var(--panel);font-weight:600;font-size:11px;color:var(--ink-faint);text-align:right;padding:4px 6px;border-bottom:1px solid var(--panel-border);}
  .rtable td{text-align:right;padding:3px 6px;border-bottom:1px solid var(--panel-border);color:var(--ink);}
  .rtable tr.new td{background:var(--cs);}
  .rtable-wrap{max-height:150px;overflow:auto;border:1px solid var(--panel-border);border-radius:8px;}
  .rtable-wrap p{font-size:13px;color:var(--ink-faint);padding:8px 10px;}
  @media (prefers-reduced-motion: no-preference){ .rtable tr.new td{animation:rowin .35s ease-out;} }
  @keyframes rowin{from{opacity:0}to{opacity:1}}
  .note{font-size:15px;line-height:1.5;color:var(--ink);padding:10px 12px;border-radius:8px;background:var(--bg);min-height:4.6em;}

  details.working summary{cursor:pointer;font:600 13px var(--font-mono);color:var(--c);min-height:44px;display:flex;align-items:center;}
  .eq{font-family:var(--font-mono);font-size:14px;line-height:1.75;padding:8px 12px;border-left:3px solid var(--c);background:var(--cs);border-radius:6px;color:var(--ink);}
  .eq b{color:var(--c);}
  .eqg{display:grid;grid-template-columns:auto auto minmax(0,1fr);column-gap:.45em;row-gap:.2em;align-items:center}
  .eqg-l{justify-self:end;text-align:right}
  .eqg-m{justify-self:center}
  .eqg-r{justify-self:start;min-width:0}
  .eqg-full{grid-column:1/-1}
  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1.25;}
  .frac>span{padding:0 .25em;white-space:nowrap;}
  .frac>span:first-child{border-bottom:1.5px solid currentColor;}
  @media (max-width:560px){ .stage{padding:12px;} .eq{font-size:12.5px;padding:6px 8px;} }

  /* inside a workout tab (skydiver.html?embed): no page heading, no outer margins */
  .embed body{background:transparent;}
  .embed .page{padding:0;max-width:none;}
  .embed .home-link,.embed .page-head{display:none;}
</style>
<script>
  // Visit counter (GoatCounter: no cookies, no personal data). Skipped when a page is embedded in a workout, so a visit counts once.
  // pwCountTab(tab, label): counts each workout tab once per visit as a GoatCounter event (path "page#tab"), skipped in frames the same way.
  (function(){
    var off = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var seen = {}, queue = [];
    function send(e){ try { window.goatcounter.count(e); } catch (x) {} }
    window.pwCountTab = function(tab, label){
      if (off || !tab || seen[tab]) return;
      seen[tab] = 1;
      var page = (location.pathname.split('/').pop() || 'index').replace(/\.html$/, '');
      var e = { path: page + '#' + tab, title: (label || tab) + ' \u00b7 ' + document.title, event: true };
      if (window.goatcounter && window.goatcounter.count) send(e); else queue.push(e);
    };
    if (off) return;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://gc.zgo.at/count.js';
    s.setAttribute('data-goatcounter', 'https://physics-workout.goatcounter.com/count');
    s.onload = function(){ var q = queue; queue = []; q.forEach(send); };
    document.head.appendChild(s);
  })();
</script>
</head>
<body>
<div class="page" id="page">
  <a class="home-link" href="igcse.html">&larr; IGCSE animations</a>
  <header class="page-head">
    <div class="eyebrow">Animations &middot; forces</div>
    <h1>Hooke’s Law</h1>
  </header>

  <section class="card stage">
    <div>
      <svg class="view" id="hk-svg" viewBox="0 0 600 300" role="img" aria-label="A stretched sample with a mass hanger, a stock of slotted masses to drag onto the hanger, and the force-extension graph"><g id="hk-scene"></g><g id="hk-ghost" pointer-events="none"></g></svg>
      <div class="under">
        <div class="btn-group">
          <button type="button" class="btn" data-action="reset">&#8634; Reset</button>
          <button type="button" class="btn" id="slow" aria-pressed="false">Slow motion</button>
          <button type="button" class="btn" id="hk-exp" aria-pressed="false">Experiment</button>
        </div>
        <div class="mass" id="hk-slider"><label class="lab" for="hk-f">Load (force) <output id="hk-fo"></output></label><input type="range" id="hk-f" min="0" max="10" step="0.5" value="0"></div>
        <div class="exp-btns" id="hk-exp-btns" hidden>
          <button type="button" class="btn btn-primary" data-action="add">Add a mass</button>
          <button type="button" class="btn" data-action="remove">Take one off</button>
        </div>
      </div>
    </div>
    <div class="side">
      <div class="choices">
        <div class="row"><div class="lab">Material</div><div class="seg" id="hk-mat"></div></div>
        <div class="row" id="hk-msize-wrap" hidden><div class="lab">Each mass</div><div class="seg" id="hk-msize"></div></div>
      </div>
      <p class="note" id="hk-note" aria-live="polite"></p>
      <div id="hk-results" hidden><div class="lab">Results</div><div class="rtable-wrap" id="hk-table"></div></div>
      <details class="working" id="working">
        <summary>Show working</summary>
        <div class="eq" id="hk-eq"></div>
      </details>
    </div>
  </section>
</div>
<script>
(function(){
  // This page is the one copy of this animation. On its own it is the lesson version;
  // with ?embed it drops its heading so a workout tab can show it in a frame, and it tells that page its height.
  var EMBED = /[?&]embed\b/.test(location.search);
  if(EMBED){
    document.documentElement.classList.add('embed');
    var wk=document.getElementById('working'); if(wk) wk.open = true;
    var page = document.getElementById('page');
    var sendHeight = function(){ try{ parent.postMessage({animHeight: Math.ceil(page.getBoundingClientRect().height)}, '*'); }catch(e){} };
    if(window.ResizeObserver) new ResizeObserver(sendHeight).observe(page);
    window.addEventListener('load', sendHeight);
  }
  function $(sel){ return document.querySelector(sel); }
  function bindRange(id, fn){ var el=$('#'+id); el.addEventListener('input', fn); return el; }
  function onAction(name, fn){ var b=$('[data-action="'+name+'"]'); if(b) b.addEventListener('click', fn); }
  var REDUCED_MOTION=false;   // runs start only when pressed and always end, so they play even with reduced motion on
  // Slow motion: every run multiplies its time step by SPEED()
  function SPEED(){ var b=document.getElementById('slow'); return b && b.getAttribute('aria-pressed')==='true' ? 0.3 : 1; }
  (function(){ var b=document.getElementById('slow'); if(b) b.addEventListener('click',function(){ b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed')!=='true')); }); })();
  function num(n, dp){   // round, drop trailing zeros, group thousands with a space from 10 000
    var f = Math.pow(10, dp||0), r = Math.round(n*f)/f, t = String(r);
    if(Math.abs(r)>=10000) t = t.replace(/\B(?=(\d{3})+(?!\d))/g,' ');
    return t;
  }
  function FR(t){
    return String(t).replace(/(\d) (?=\d{3}\b)/g,'$1 ')
      .replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g,'<span class="frac"><span>$1</span><span>$2</span></span>');
  }
  function arrowHead(id, col){ return '<marker id="'+id+'" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="'+col+'"/></marker>'; }
  function alignEquals(el){
    if(el.querySelector('.eqg')) return;
    var rows = el.innerHTML.split(/<br\s*\/?>/i).map(function(line){
      var i = line.indexOf(' = ');
      if(i<0) return '<span class="eqg-full">'+line+'</span>';
      return '<span class="eqg-l">'+line.slice(0,i)+'</span><span class="eqg-m">=</span><span class="eqg-r">'+line.slice(i+3)+'</span>';
    });
    el.innerHTML = '<div class="eqg">'+rows.join('')+'</div>';
  }
  function watchEquals(sel){ Array.prototype.forEach.call(document.querySelectorAll(sel), function(el){ alignEquals(el); new MutationObserver(function(){ alignEquals(el); }).observe(el, {childList:true}); }); }

  function initHookeSim(){
    var fIn=$('#hk-f'), mat='spring', svg=$('#hk-svg'), scene=$('#hk-scene'), ghost=$('#hk-ghost');
    // Experiment mode: no theory line. Masses go on one at a time (50 g, 100 g or 200 g each: the student picks the interval)
    // and each reading is plotted like a data logger. Once loading stops (10 N, or the first mass taken off),
    // the masses come off one at a time and the unloading readings are plotted too, so the page shows whether
    // the sample is elastic (back to its original length) or permanently stretched.
    // phase and Fpeak are also tracked outside Experiment mode, so the rubber band's unloading line shows there too.
    var EXP=false, step=1, phase='load', Fpeak=0, loadR=[], unloadR=[];
    // Measure mode (?show=measure, Alex 5 Nov 2026): the practical page's "Do the experiment" tab. One spring, 100 g
    // masses, loading only to 8 N. Nothing is read for the student: a magnified view of the ruler at the pointer
    // replaces the graph, and the student writes each length in the table on the practical page and plots it there.
    // The spring's true lengths (cm) at 0–8 N are MEAS_L; the practical page checks against the same numbers.
    var MEAS=/[?&]show=measure\b/.test(location.search), MMAX=8;
    var MEAS_D=[0,0.1,-0.1,0,0.1,-0.1,0,0.1,0];   // a small fixed scatter, so the points are not perfectly in line
    var stack=[];      // slotted masses on the hanger (grams), bottom first; outside Experiment mode
    var Fcur=0;        // the load now (N)
    // the picture eases to each new load: Fd is the load the picture shows, off a short-lived offset so it never jumps
    var Fd=0, anim=null, looping=false, lastT=null, ANIM_T=0.6;
    var expBtn=$('#hk-exp');
    expBtn.addEventListener('click',function(){ EXP=!EXP; expBtn.setAttribute('aria-pressed',String(EXP)); clearRun(); });
    var MSIZES=[{g:50,N:0.5},{g:100,N:1},{g:200,N:2}], msEl=$('#hk-msize');
    msEl.innerHTML=MSIZES.map(function(m){ return '<button type="button" data-n="'+m.N+'" aria-pressed="'+(m.N===step)+'">'+m.g+' g</button>'; }).join('');
    msEl.addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return; step=+b.dataset.n;
      Array.prototype.forEach.call(msEl.children,function(x){ x.setAttribute('aria-pressed',String(x===b)); }); clearRun(); });
    if(MEAS){ EXP=true; expBtn.setAttribute('aria-pressed','true'); }
    function clearRun(){ loadR=[]; unloadR=[]; phase='load'; Fpeak=0; fIn.value=0; Fcur=0; Fd=0; anim=null; stack=[];
      $('#hk-slider').hidden=EXP; $('#hk-exp-btns').hidden=!EXP; $('#hk-results').hidden=!EXP||MEAS; $('#hk-msize-wrap').hidden=!EXP||MEAS; draw(); }
    function noise(F){ return [0,1,-1,0,2,-1,1,-2,0,1,-1,0,1,-1,2,0,-1,1,0,-2,1][Math.round(F*2)%21]; }
    // Rubber band hysteresis: on the way down the extension at each load is larger than on the way up,
    // and at 0 N it is back at its original length (elastic), so the loading and unloading lines form a loop.
    var SET=0, HYS=3;   // returns to its original length, as the practical page and mark schemes say
    function rubberDown(F, Fp){ var M=MATS.rubber, u=F/Fp; return M.ext(F)+HYS*(Fp/10)*6.75*u*(1-u)*(1-u)+SET*(Fp/10)*(1-u); }
    // The true extension now: on the way down an overloaded spring or wire comes back along a line parallel to
    // its straight-line region (so it keeps a permanent extension); a rubber band comes back on a different curve.
    // Outside Experiment mode the spring and wire simply follow their loading curve, as before.
    function xNow(F){
      var M=MATS[mat];
      if(MEAS) return M.ext(F)+(MEAS_D[Math.round(F)]||0)*Math.min(1,F);
      if(phase!=='unload' || F>=Fpeak) return M.ext(F);
      if(mat==='rubber') return rubberDown(F, Fpeak);
      if(!EXP || Fpeak<=M.lop) return M.ext(F);
      return M.ext(Fpeak)-M.k0*(Fpeak-F);
    }
    function ease(p){ return 1-Math.pow(1-p,3); }
    function dispX(){ var x=xNow(Fd); return anim ? x+anim.off*(1-ease(anim.p)) : x; }
    // every change of load: note where the picture is, change the state, then ease the picture to the new load
    function change(fn, tag){
      var before=dispX(); fn(); Fcur=+fIn.value;
      var F0=Fd; anim={F0:F0, F1:Fcur, p:0, off:0}; anim.off=before-xNow(F0);
      draw(tag);
      if(!looping){ looping=true; lastT=null; requestAnimationFrame(tick); }
    }
    function tick(t){
      if(!anim){ looping=false; return; }
      var dt=lastT===null?0.016:Math.min(0.05,(t-lastT)/1000); lastT=t;
      anim.p+=dt*SPEED()/ANIM_T;
      if(anim.p>=1){ Fd=anim.F1; anim=null; looping=false; render(); return; }
      Fd=anim.F0+(anim.F1-anim.F0)*ease(anim.p);
      render(); requestAnimationFrame(tick);
    }
    function reading(F, prev){   // what the student reads off the scale, to the scale's precision
      var M=MATS[mat], res=M.res, x=xNow(F), gap=Math.abs(x-prev);
      if(F>0) x+=noise(F)*Math.min(res*(mat==='wire'?0.5:1), gap/4);   // the error never makes a reading go the wrong way
      return Math.max(0, Math.round(x/res)*res);
    }
    var FMAX=MEAS?MMAX:10;
    function canAdd(){ return EXP ? (phase==='load' && Fpeak<FMAX-1e-9) : Fcur<10-1e-9; }
    function addMass(){
      if(phase!=='load' || Fpeak>=FMAX-1e-9) return;
      change(function(){
        var prev=loadR.length?loadR[loadR.length-1].x:0, F=Math.round((Fpeak+step)*2)/2;
        Fpeak=F; fIn.value=F; loadR.push({F:F, x:reading(F, prev)});
      },'load');
    }
    function removeMass(){

        });
        $('#hk-table').innerHTML=head+rows+'</tbody></table>';
        var tw=$('#hk-table'); if(isNew!=='unload') tw.scrollTop=tw.scrollHeight;
        if(last && !wire) $('#hk-eq').innerHTML='extension = new length − original length<br>extension = '+(M.orig+last.x).toFixed(1)+' − '+num(M.orig)+' = <b>'+last.x.toFixed(1)+' '+M.unit+'</b>';
        else if(last) $('#hk-eq').innerHTML='Read the vernier scale at the marker on the wire.<br>extension = <b>'+last.x.toFixed(2)+' mm</b>';
        else $('#hk-eq').innerHTML='Original length = '+num(M.orig)+' '+M.unit+(wire?' (2 m)':'');
        var nt, mg=Math.round(step*100)+' g', sample=mat==='spring'?'spring':mat==='wire'?'wire':'band';
        if(!last) nt='Experiment: choose a mass size (each 100 g adds 1 N), then drag the masses onto the hanger one at a time (or press Add a mass). Read the '+(wire?'vernier scale at the marker on the wire':'ruler at the pointer, with your eye level with it')+'.';
        else if(phase==='load' && !loadDone) nt='Reading: load '+last.F+' N, extension '+fx(last.x)+' '+M.unit+'. Add another '+mg+' mass, or take one off to start unloading.';
        else if(phase==='load') nt=(mat==='rubber'?'Loading done. The points do not lie on a straight line, so a rubber band does not obey Hooke’s law.':'Loading done. The points lie on a straight line through the origin up to about '+M.lop+' N, then curve: that is the limit of proportionality.')+' Now take the masses off one at a time.';
        else if(F>0) nt='Unloading: load '+F+' N, extension '+fx(last.x)+' '+M.unit+'. Take the next mass off.';
        else if(mat==='rubber') nt=(last.x>=M.res/2?'Back at 0 N the band is only '+fx(last.x)+' cm longer than at the start, and it creeps back to its original length within a minute or so, so it is elastic.':'Back at 0 N the band is at its original length, so it is elastic.')+' But the unloading points lie on a different curve: at each load the extension is larger than when loading.';
        else if(last.x>M.res*1.5) nt='Back at 0 N the '+sample+' is still '+fx(last.x)+' '+M.unit+' longer than at the start. It was loaded past its elastic limit, so it is permanently stretched.';
        else nt='Back at 0 N the '+sample+' is at its original length: it was only loaded in its straight-line region, so it shows elastic behaviour.';
        $('#hk-note').textContent=nt;
        return;
      }
      $('#hk-eq').innerHTML='extension = new length − original length<br>extension = '+num(newL,dp)+' − '+num(M.orig)+' = <b>'+num(x,dp)+' '+M.unit+'</b>';
      var note;
      if(mat==='rubber' && phase==='unload' && F>0) note='Unloading: at each load the band is longer than it was on the way up, so the unloading line is a different curve from the loading line.';
      else if(mat==='rubber' && phase==='unload') note=(x>=0.05?'Back at 0 N the band is only '+num(x,1)+' cm longer than at the start, and it creeps back within a minute or so: it':'Back at 0 N the band is at its original length: it')+' is elastic, but it came back on a different curve.';
      else if(mat==='rubber') note='A rubber band does not obey Hooke’s law: its graph is never a straight line. It stretches easily in the middle, then gets stiffer. Take masses off to see the unloading line.';
      else if(F===0) note='Drag masses onto the hanger (or use the slider). In the straight-line region, doubling the force doubles the extension.';
      else if(F<=M.lop) note='Straight-line region: extension is directly proportional to force, so it obeys Hooke’s law.';
      else note='Past the limit of proportionality: the line curves, so extension is no longer proportional to force.';
      $('#hk-note').textContent=note;
    }
    if(MEAS) clearRun(); else draw();
  }
  watchEquals('.eq');
  if(/[?&]show=measure\b/.test(location.search)){   // measure mode: hide everything the student does not need
    ['#hk-exp','#working','[data-action="remove"]'].forEach(function(s){ var e=$(s); if(e) e.hidden=true; });
    var mr=$('#hk-mat'); if(mr) mr.closest('.row').hidden=true;
    document.documentElement.classList.add('measure');
  }
  initHookeSim();
})();
</script>
