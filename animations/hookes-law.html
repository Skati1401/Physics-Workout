<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="description" content="Interactive physics animation for Edexcel IGCSE, IAL and IB. Load a spring, a metal wire or a rubber band and watch the force–extension graph, past the limit of proportionality. IAL and IB add the stiffness k from the gradient and the energy stored as the area under the graph.">

<style>
  :root{
    --bg:#eef1f5;
    --bg-grid:rgba(29,41,61,0.055);
    --panel:#ffffff;
    --panel-border:#d7dce4;
    --ink:#182233;
    --ink-soft:#4c5668;
    --ink-faint:#8993a5;
    --accent:#d9720c;
    --accent-soft:#fdead2;
    --good:#15803d;
    --good-soft:#dcf5e3;
    --bad:#c0311a;
    --bad-soft:#fbe1db;
    --shadow:0 10px 26px -14px rgba(24,34,51,0.28);

    --motion:#2158d1;      --motion-soft:#dfe8fc;
    --elastic:#0c8a76;     --elastic-soft:#d6f3ee;
    --momentum:#b8267a;    --momentum-soft:#fbdeee;
    --newton:#3d3aa8;      --newton-soft:#e3e2f8;
    --moments:#6d3bce;     --moments-soft:#e9e0fb;
    --units:#96660b;       --units-soft:#f6e8ca;

    --font-display:'Big Shoulders',system-ui,sans-serif;
    --font-body:'IBM Plex Sans',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12161f; --bg-grid:rgba(255,255,255,0.045);
      --panel:#1b212e; --panel-border:#2c3444;
      --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;
      --accent:#ff9a3d; --accent-soft:#3a2712;
      --good:#4ade80; --good-soft:#123321;
      --bad:#f27159; --bad-soft:#3a1712;
      --shadow:0 14px 30px -14px rgba(0,0,0,0.55);
      --motion:#7da3ff; --motion-soft:#1a2440;
      --elastic:#4fd6bd; --elastic-soft:#0f2e29;
      --momentum:#ef83bd; --momentum-soft:#3a1c2c;
      --newton:#9d9af0; --newton-soft:#242259;
      --moments:#b393f5; --moments-soft:#2a2148;
      --units:#e0b64a; --units-soft:#332a10;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12161f; --bg-grid:rgba(255,255,255,0.045);
    --panel:#1b212e; --panel-border:#2c3444;
    --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;
    --accent:#ff9a3d; --accent-soft:#3a2712;
    --good:#4ade80; --good-soft:#123321;
    --bad:#f27159; --bad-soft:#3a1712;
    --shadow:0 14px 30px -14px rgba(0,0,0,0.55);
    --motion:#7da3ff; --motion-soft:#1a2440;
    --elastic:#4fd6bd; --elastic-soft:#0f2e29;
    --momentum:#ef83bd; --momentum-soft:#3a1c2c;
    --newton:#9d9af0; --newton-soft:#242259;
    --moments:#b393f5; --moments-soft:#2a2148;
    --units:#e0b64a; --units-soft:#332a10;
    color-scheme:dark;
  }

  :root{--c:var(--elastic);--cs:var(--elastic-soft);}

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      linear-gradient(var(--bg-grid) 1px,transparent 1px) 0 0/100% 34px,
      linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px) 0 0/34px 100%,
      var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  [hidden]{display:none!important;}
  button{font:inherit;color:inherit;}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;}

  .page{max-width:1400px;margin-inline:auto;padding-inline:20px;padding-block:12px 40px;}
  h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:0.2px;text-wrap:balance;margin:0;}
  p{margin:0;line-height:1.55;}

  .home-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-bottom:4px;font:600 13px var(--font-mono);color:var(--ink-soft);text-decoration:none;}
  .home-link:hover{color:var(--accent);}
  .page-head{margin-bottom:12px;}
  .eyebrow{font-family:var(--font-mono);font-size:11.5px;color:var(--accent);font-weight:600;margin-bottom:6px;}
  .page-head h1{font-size:clamp(28px,5vw,38px);color:var(--ink);}

  .card{background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;box-shadow:var(--shadow);}
  .btn{
    font-family:var(--font-body);font-weight:600;font-size:13.5px;color:var(--ink);
    background:var(--panel);border:1px solid var(--panel-border);border-radius:9px;
    padding:9px 15px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  }
  .btn:hover{border-color:var(--ink-faint);}
  .btn:disabled{opacity:.45;cursor:default;}
  .btn-primary{background:var(--ink);border-color:var(--ink);color:var(--bg);}
  .btn-primary:hover{opacity:.88;border-color:var(--ink);}
  .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);}
  .btn-group{display:flex;flex-wrap:wrap;gap:10px;}

  /* picture on the left; controls, readings and working on the right */
  .stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);gap:18px 24px;align-items:start;padding:18px;}
  @media (max-width:860px){ .stage{grid-template-columns:minmax(0,1fr);} }
  /* the picture shrinks on short screens so the whole box fits in the window */
  .view{display:block;width:100%;height:auto;max-height:max(260px,calc(100vh - 290px));}
  .embed .view{max-height:460px;}
  .under{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;margin-top:12px;}
  .under .btn-group{flex:0 1 auto;}
  .mass{flex:1 1 220px;min-width:0;}
  .sliders{flex:1 1 100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px 24px;}
  .eq .why{font-family:var(--font-body);font-size:11.5px;color:var(--ink-faint);margin-left:.8em;}
  .view text{font-family:var(--font-mono);}
  #hk-svg [data-grab]{cursor:grab;touch-action:none;}
  #hk-svg.dragging,#hk-svg.dragging *{cursor:grabbing;}
  .side{display:flex;flex-direction:column;gap:12px;min-width:0;}
  .lab{display:flex;justify-content:space-between;font:12.5px var(--font-mono);color:var(--ink-soft);margin-bottom:6px;}
  .lab output{color:var(--ink);font-weight:600;}
  input[type=range]{width:100%;accent-color:var(--c);min-height:28px;}
  .choices{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 8px;align-items:center;}
  .choices .row{display:contents;}
  .choices .lab{margin:0;}
  .seg{display:flex;flex-wrap:wrap;gap:6px;}
  .seg button{font:12.5px var(--font-mono);padding:8px 12px;min-height:44px;border:1px solid var(--panel-border);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer;}
  .seg button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--panel);}
  /* level switch on the title line (IGCSE | IAL | IB): IAL and IB add the stiffness k and the energy stored (the area under the graph) */
  .head-line{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;}
  .seg.tabs{gap:0;flex-wrap:nowrap;}
  .seg.tabs button{font-size:12.5px;padding:8px 10px;white-space:nowrap;border-radius:0;margin-left:-1px;}
  .seg.tabs button:first-child{border-radius:8px 0 0 8px;margin-left:0;}
  .seg.tabs button:last-child{border-radius:0 8px 8px 0;}
  .seg.tabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);}
  .eq .why{display:inline-block;font-family:var(--font-body);font-size:11.5px;line-height:1.4;color:var(--ink-faint);}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px;}
  .stat strong{white-space:nowrap;}
  .stat{border:1px solid var(--panel-border);border-radius:8px;padding:5px 8px;display:flex;flex-direction:column;justify-content:space-between;}
  .stat small{display:block;font:10.5px var(--font-mono);color:var(--ink-faint);}
  .stat strong{font:600 15px var(--font-mono);color:var(--ink);}
  .stat.up strong{color:var(--accent);}
  .exp-btns{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;}
  .rtable{width:100%;border-collapse:collapse;font:12.5px var(--font-mono);}
  .rtable th{position:sticky;top:0;background:var(--panel);font-weight:600;font-size:11px;color:var(--ink-faint);text-align:right;padding:4px 6px;border-bottom:1px solid var(--panel-border);}
  .rtable td{text-align:right;padding:3px 6px;border-bottom:1px solid var(--panel-border);color:var(--ink);}
  .rtable tr.new td{background:var(--cs);}
  .rtable-wrap{max-height:150px;overflow:auto;border:1px solid var(--panel-border);border-radius:8px;}
  .rtable-wrap p{font-size:13px;color:var(--ink-faint);padding:8px 10px;}
  @media (prefers-reduced-motion: no-preference){ .rtable tr.new td{animation:rowin .35s ease-out;} }
  @keyframes rowin{from{opacity:0}to{opacity:1}}
  .note{font-size:15px;line-height:1.5;color:var(--ink);padding:10px 12px;border-radius:8px;background:var(--bg);min-height:4.6em;}

  details.working summary{cursor:pointer;font:600 13px var(--font-mono);color:var(--c);min-height:44px;display:flex;align-items:center;}
  .eq{font-family:var(--font-mono);font-size:14px;line-height:1.75;padding:8px 12px;border-left:3px solid var(--c);background:var(--cs);border-radius:6px;color:var(--ink);}
  .eq b{color:var(--c);}
  .eqg{display:grid;grid-template-columns:auto auto minmax(0,1fr);column-gap:.45em;row-gap:.2em;align-items:center}
  .eqg-l{justify-self:end;text-align:right}
  .eqg-m{justify-self:center}
  .eqg-r{justify-self:start;min-width:0}
  .eqg-full{grid-column:1/-1}
  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1.25;}
  .frac>span{padding:0 .25em;white-space:nowrap;}
  .frac>span:first-child{border-bottom:1.5px solid currentColor;}
  @media (max-width:560px){ .stage{padding:12px;} .eq{font-size:12.5px;padding:6px 8px;} }

  /* inside a workout tab (skydiver.html?embed): no page heading, no outer margins */
  .embed body{background:transparent;}
  .embed .page{padding:0;max-width:none;}
  .embed .home-link,.embed .page-head{display:none;}
  :root{--steel:#66748c;--steel-hi:#c3ccda;--steel-sh:#3f4a5e;--wood-f:#c99e6a;--wood-t:#e3c08f;--wood-s:#9c7444;--brass:#b98f2e;--rule:#f3dfae;--coil-sh:#086454;}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--steel:#8f9db3;--steel-hi:#dfe5ee;--steel-sh:#566179;--wood-f:#8a6a43;--wood-t:#a8855a;--wood-s:#644b2d;--brass:#c9a24a;--rule:#4a3d1c;--coil-sh:#2b8f7e;} }
  :root[data-theme="dark"]{--steel:#8f9db3;--steel-hi:#dfe5ee;--steel-sh:#566179;--wood-f:#8a6a43;--wood-t:#a8855a;--wood-s:#644b2d;--brass:#c9a24a;--rule:#4a3d1c;--coil-sh:#2b8f7e;}
</style>
<style id="choice-kit">
/* Choice kit (12 Nov 2026): the same block on every animation page. See tools/ANIMATION-STYLE.md, "Choices". */
.seg.pick{background:var(--bg);box-shadow:inset 0 0 0 1px var(--panel-border);border-radius:8px;}

<script>
  // Visit counter (GoatCounter: no cookies, no personal data). Skipped when a page is embedded in a workout, so a visit counts once.
  // pwCountTab(tab, label): counts each workout tab once per visit as a GoatCounter event (path "page#tab"), skipped in frames the same way.
  (function(){
    var off = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var seen = {}, queue = [];
    function send(e){ try { window.goatcounter.count(e); } catch (x) {} }
    window.pwCountTab = function(tab, label){
      if (off || !tab || seen[tab]) return;
      seen[tab] = 1;
      var page = (location.pathname.split('/').pop() || 'index').replace(/\.html$/, '');
      var e = { path: page + '#' + tab, title: (label || tab) + ' \u00b7 ' + document.title, event: true };
      if (window.goatcounter && window.goatcounter.count) send(e); else queue.push(e);
    };
    if (off) return;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://gc.zgo.at/count.js';
    s.setAttribute('data-goatcounter', 'https://physics-workout.goatcounter.com/count');
    s.onload = function(){ var q = queue; queue = []; q.forEach(send); };
    document.head.appendChild(s);
  })();
</script>

<script>
  // Draft tags and Alex's reviewer button (tools/review/drafts.py writes this block; edit tools/review/snippet.html, then run drafts.py sync).
  // A page is Draft while its row in tools/REVIEW.md is not ✅: <meta name="pw-draft"> on the page, data-draft on its list cards.
  // ?reviewer (once, on any page) turns on reviewer mode in this browser; ?reviewer=off turns it off.
  (function(){
    var on = false, embed = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var m = /[?&]reviewer(?:=([^&]*))?/.exec(location.search);
    on = !!m && m[1] !== 'off';
    try {
      if (m) { if (m[1] === 'off') localStorage.removeItem('pw-reviewer'); else localStorage.setItem('pw-reviewer', '1'); }
      else on = localStorage.getItem('pw-reviewer') === '1';
    } catch (e) {}
    var CSS = '.pw-draft{display:inline-block;vertical-align:middle;margin-left:10px;font:600 11.5px/1.4 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:0;color:var(--bad,#b42318);border:1px dashed currentColor;border-radius:5px;padding:1px 7px;white-space:nowrap}'
      + '.act-top .pw-draft{margin-left:auto;flex:none}.act-top .pw-draft~.cp-tag,.act-top .pw-draft~.ta-tag{margin-left:0}'
      + 'a[data-draft]{position:relative}.pw-draft.pw-corner{position:absolute;top:10px;right:10px;margin:0;background:var(--panel,#fff)}'
      + 'summary .pw-draft{margin-left:0;flex:none}'
      + '.pw-check{display:inline-block;vertical-align:middle;margin-left:8px;font:600 13px/1.4 "IBM Plex Sans",system-ui,sans-serif;color:#fff;background:#1a7f37;border-radius:6px;padding:4px 10px;text-decoration:none;white-space:nowrap}'
      + '.pw-check:hover{background:#116329}.pw-check:focus-visible{outline:2px solid #1a7f37;outline-offset:2px}'
      + '.pw-reviewer{position:fixed;left:10px;bottom:10px;z-index:9999;font:500 12px/1.4 "IBM Plex Mono",ui-monospace,monospace;background:#1d2433;color:#fff;border-radius:6px;padding:4px 9px;opacity:.85}'
      + '.pw-reviewer a{color:#ffc83d}';
    function tag(){ var t = document.createElement('span'); t.className = 'pw-draft'; t.title = 'Not yet checked'; t.textContent = 'Draft'; return t; }
    function go(){
      var st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st);
      var meta = document.querySelector('meta[name="pw-draft"]'), h1 = document.querySelector('h1');
      if (meta && h1 && !embed) {
        h1.appendChild(tag());
        if (on) {
          var page = meta.getAttribute('content'), b = document.createElement('a');
          b.className = 'pw-check'; b.target = '_blank'; b.rel = 'noopener'; b.textContent = '✓ Checked';
          b.title = 'Opens a GitHub issue. Submit it and the Draft tag goes in a minute or two.';
          b.href = 'https://github.com/Skati1401/Physics-Workout/issues/new?title=' + encodeURIComponent('Checked: ' + page)
            + '&body=' + encodeURIComponent('Submit this issue to mark `' + page + '` as checked. The Draft tag goes in a minute or two, and the issue closes itself.');
          h1.appendChild(b);
        }
      }
      document.querySelectorAll('a[data-draft]').forEach(function(a){
        if (a.querySelector('.pw-draft')) return;
        var t = tag(), top = a.querySelector('.act-top');
        if (top) top.insertBefore(t, top.querySelector('.cp-tag,.ta-tag'));
        else { t.className += ' pw-corner'; a.appendChild(t); }
      });
      document.querySelectorAll('details.unit').forEach(function(d){
        var s = d.querySelector('summary');
        if (!s || s.querySelector('.pw-draft') || !d.querySelector('a[data-draft]')) return;
        var h2 = s.querySelector('h2'); if (h2) h2.parentNode.insertBefore(tag(), h2.nextSibling); else s.appendChild(tag());
      });
      if (on && !embed) {
        // Carry ?reviewer in every link to another page of the site, so reviewer mode survives
        // browsers that clear site storage (school Chromebooks) and pages cached from before.
        var carry = function(a){
          try {
            var u = new URL(a.href, location.href);
            if (u.origin !== location.origin || !/(\.html|\/)$/.test(u.pathname) || u.searchParams.has('reviewer')) return;
            u.searchParams.set('reviewer', ''); a.href = u.href.replace('reviewer=', 'reviewer');
          } catch (e) {}
        };
        document.querySelectorAll('a[href]').forEach(carry);
        ['click', 'auxclick', 'contextmenu'].forEach(function(ev){
          document.addEventListener(ev, function(e){ var a = e.target.closest && e.target.closest('a[href]'); if (a) carry(a); }, true);
        });
        var r = document.createElement('div'); r.className = 'pw-reviewer';
        r.innerHTML = 'Reviewer mode · <a href="' + location.pathname + '?reviewer=off">turn off</a>';
        document.body.appendChild(r);
      }
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
  })();
</script>

<body>
<div class="page" id="page">
  <a class="home-link" href="igcse.html">&larr; IGCSE animations</a>
  <header class="page-head">
    <div class="eyebrow">Animations &middot; forces</div>
    <div class="head-line">
      <h1>Hooke’s Law</h1>
      <div class="seg tabs" id="hk-level" role="group" aria-label="Level"><button type="button" data-v="ks4" aria-pressed="true">IGCSE</button><button type="button" data-v="ial" aria-pressed="false">IAL</button><button type="button" data-v="ib" aria-pressed="false">IB</button></div>
    </div>
  </header>

  <section class="card stage">
    <div>
      <svg class="view" id="hk-svg" viewBox="0 0 600 300" role="img" aria-label="A stretched sample with a mass hanger, a stock of slotted masses to drag onto the hanger, and the force-extension graph"><g id="hk-scene"></g><g id="hk-ghost" pointer-events="none"></g></svg>
      <div class="under">
        <div class="btn-group">
          <button type="button" class="btn" data-action="reset">&#8634; Reset</button>
          <button type="button" class="btn" id="slow" aria-pressed="false">Slow motion</button>
          <button type="button" class="btn" id="hk-exp" aria-pressed="false">Experiment</button>
        </div>
        <div class="mass" id="hk-slider"><label class="lab" for="hk-f">Load (force) <output id="hk-fo"></output></label><input type="range" id="hk-f" min="0" max="10" step="0.5" value="0"></div>
        <div class="exp-btns" id="hk-exp-btns" hidden>
          <button type="button" class="btn btn-primary" data-action="add">Add a mass</button>
          <button type="button" class="btn" data-action="remove">Take one off</button>
        </div>
      </div>
    </div>
    <div class="side">
      <div class="choices">
        <div class="row"><div class="lab">Material</div><div class="seg" id="hk-mat"></div></div>
        <div class="row" id="hk-msize-wrap" hidden><div class="lab">Each mass</div><div class="seg" id="hk-msize"></div></div>
      </div>
      <p class="note" id="hk-note" aria-live="polite"></p>

<script>
var PW_LEVEL=(location.search.match(/[?&]level=(igcse|ial|ib)\b/)||[])[1]||(/[?&]from=alevel\b/.test(location.search)?'ial':'');

(function(){

  function $(sel){ return document.querySelector(sel); }

  function num(n, dp){   // round, drop trailing zeros, group thousands with a space from 10 000
    var f = Math.pow(10, dp||0), r = Math.round(n*f)/f, t = String(r);

  }

    return String(t).replace(/(\d) (?=\d{3}\b)/g,'$1 ')

  }
  function arrowHead(id, col){ return '<marker id="'+id+'" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="'+col+'"/></marker>'; }

    // ---- solid kit (the same block is in reaction-time.html, roller-coaster-energy.html, heat-transfer.html, density.html and liquid-pressure.html) ----
  function f1(n){ return (+n).toFixed(1); }
  function pts(list){ return list.map(function(p){ return f1(p[0])+','+f1(p[1]); }).join(' '); }

  // text in clear space: halo:1 gives it a panel-coloured edge so a line passing behind never cuts a letter
  function txt(x,y,s,o){ o=o||{}; return '<text x="'+f1(x)+'" y="'+f1(y)+'"'+(o.a?' text-anchor="'+o.a+'"':'')+' font-size="'+(o.fs||12)+'" fill="'+(o.c||'var(--ink-soft)')+'"'+(o.w?' font-weight="'+o.w+'"':'')+(o.halo?' paint-order="stroke" stroke="var(--panel)" stroke-width="4" stroke-linejoin="round"':'')+(o.x||'')+'>'+s+'</text>'; }
  // a solid block: front face at (x, y), w wide and h tall, going back by (dx, dy). Lit top, plain front, darker side.
  function box(x,y,w,h,dx,dy,col,o){ o=o||{};
    return pg([[x,y],[x+w,y],[x+w+dx,y+dy],[x+dx,y+dy]],o.top||col)+(o.top?'':pg([[x,y],[x+w,y],[x+w+dx,y+dy],[x+dx,y+dy]],'#fff',' opacity=".38"'))+
      pg([[x+w,y],[x+w+dx,y+dy],[x+w+dx,y+h+dy],[x+w,y+h]],o.side||col)+(o.side?'':pg([[x+w,y],[x+w+dx,y+dy],[x+w+dx,y+h+dy],[x+w,y+h]],'#000',' opacity=".28"'))+
      rect(x,y,w,h,col); }
  // a round bar or post: a dark core with a lighter streak along it
  function tube(x1,y1,x2,y2,w,col,hi){ var L=Math.hypot(x2-x1,y2-y1)||1, nx=-(y2-y1)/L*w*0.22, ny=(x2-x1)/L*w*0.22; if(ny>0){ nx=-nx; ny=-ny; }
    return ln(x1,y1,x2,y2,col,w,' stroke-linecap="round"')+ln(x1+nx,y1+ny,x2+nx,y2+ny,hi,Math.max(0.8,w*0.3),' stroke-linecap="round"'); }
  function wrapLines(s,n){ var out=[], cur=''; String(s).split(' ').forEach(function(w){ if(cur && (cur+' '+w).length>n){ out.push(cur); cur=w; } else cur=cur?cur+' '+w:w; }); if(cur) out.push(cur); return out; }
  function onPick(svg, fn){
    svg.addEventListener('click', function(e){ var t=e.target.closest('.pick'); if(t){ fn(t.getAttribute('data-pick')); } });
    svg.addEventListener('keydown', function(e){ if(e.key!=='Enter' && e.key!==' ') return; var t=e.target.closest('.pick'); if(t){ e.preventDefault(); fn(t.getAttribute('data-pick')); } });
  }
  function setKeepFocus(el, html){ var f=document.activeElement, k=f && el.contains(f) ? f.getAttribute('data-pick') : null; el.innerHTML=html;
    if(k!==null){ var n=el.querySelector('.pick[data-pick="'+k+'"]'); if(n && n.focus) n.focus(); } }
  function ell(cx,cy,rx,ry,fill,extra){ return '<ellipse cx="'+f1(cx)+'" cy="'+f1(cy)+'" rx="'+f1(rx)+'" ry="'+f1(ry)+'" fill="'+fill+'"'+(extra||'')+'/>'; }
  // a solid arrow from (x1, y1) to its tip at (x2, y2)
  function arrow(x1,y1,x2,y2,col,w,extra){ var a=Math.atan2(y2-y1,x2-x1), s=w*2.2, bx=x2-Math.cos(a)*s*1.5, by=y2-Math.sin(a)*s*1.5;
    return '<g'+(extra||'')+'>'+ln(x1,y1,bx,by,col,w)+'<path d="M'+f1(x2)+','+f1(y2)+' L'+f1(bx-Math.sin(a)*s)+','+f1(by+Math.cos(a)*s)+' L'+f1(bx+Math.sin(a)*s)+','+f1(by-Math.cos(a)*s)+' z" fill="'+col+'"/></g>'; }
  // an upright cylinder (a can, a beaker of liquid): top ellipse at yt, bottom at yb. o.top fills the top; o.hi adds a streak of light.
  function cyl(cx,yt,yb,rx,ry,fill,o){ o=o||{};
    return '<path d="M'+f1(cx-rx)+','+f1(yt)+' L'+f1(cx-rx)+','+f1(yb)+' A'+f1(rx)+','+f1(ry)+' 0 0 0 '+f1(cx+rx)+','+f1(yb)+' L'+f1(cx+rx)+','+f1(yt)+' z" fill="'+fill+'"'+(o.extra||'')+'/>'+
      '<path d="M'+f1(cx+rx*0.45)+','+f1(yt)+' L'+f1(cx+rx*0.45)+','+f1(yb+ry*0.85)+' A'+f1(rx)+','+f1(ry)+' 0 0 0 '+f1(cx+rx)+','+f1(yb)+' L'+f1(cx+rx)+','+f1(yt)+' z" fill="#000" opacity="'+(o.shade==null?0.16:o.shade)+'"/>'+
      (o.hi?ln(cx-rx*0.62,yt+ry+4,cx-rx*0.62,yb-2,o.hi,Math.max(1.6,rx*0.11),' stroke-linecap="round" opacity="'+(o.hiop||0.7)+'"'):'')+
      ell(cx,yt,rx,ry,o.top||fill,o.topx||'')+(o.top?'':ell(cx,yt,rx,ry,'#fff',' opacity=".3"')); }
  // a glass thermometer standing upright: bulb at (x, yb); the scale runs from t0 at y0 up to t1 at y1, and the thread stands at T.
  // o.step: a tick every so many degrees; o.num: a number every so many; o.side: numbers on the right (1) or the left (-1); o.from: first tick;
  // o.nobulb: the bulb is out of sight, inside a can or a cube
  function thermo(x,yb,y0,t0,y1,t1,T,o){ o=o||{};
    var w=o.w||7, yT=y1-9, sc=(y1-y0)/(t1-t0), yy=function(t){ return y0+(t-t0)*sc; }, side=o.side||1, fs=o.fs||11, g='', t;
    g+=rect(x-w/2,yT,w,yb-yT,'var(--thermo)',' rx="'+f1(w/2)+'" stroke="var(--ink-faint)" stroke-width="1"');
    g+=ln(x,yb,x,yy(Math.max(t0-4,Math.min(t1+2,T))),'var(--thread)',w*0.36,' stroke-linecap="round"');
    if(!o.nobulb) g+='<circle cx="'+f1(x)+'" cy="'+f1(yb)+'" r="'+f1(w*0.9)+'" fill="var(--thread)" stroke="var(--ink-faint)" stroke-width="0.8"/>'+ell(x-w*0.3,yb-w*0.3,w*0.22,w*0.22,'#fff',' opacity=".7"');
    for(t=(o.from==null?t0:o.from); t<=t1+1e-9; t+=(o.step||10)){ var big=!(Math.round(t)%(o.num||20));
      g+=ln(x+side*w/2,yy(t),x+side*(w/2+(big?7:4)),yy(t),'var(--ink-soft)',big?1.3:0.9);
      if(big && !o.nonum) g+=txt(x+side*(w/2+10),yy(t)+fs*0.36,String(Math.round(t)),{a:side>0?'start':'end',fs:fs,c:'var(--ink)'}); }
    return g; }
  // a stopwatch showing s (for example 1:37)
  function stopwatch(x,y,s,k){ k=k||1; var w=78*k, h=40*k;
    return rect(x+w/2-7*k,y-7*k,14*k,9*k,'var(--steel-sh,#3f4a5e)',' rx="2"')+rect(x,y,w,h,'var(--case,#3f4a5e)',' rx="'+f1(9*k)+'"')+rect(x+2,y+2,w-4,h*0.4,'#fff',' rx="'+f1(8*k)+'" opacity=".12"')+
      rect(x+7*k,y+8*k,w-14*k,h-16*k,'var(--panel)',' rx="3"')+txt(x+w/2,y+h/2+5.5*k,s,{a:'middle',fs:15*k,c:'var(--ink)',w:600}); }
  // ---- end of solid kit ----

  function initHookeSim(){
    var fIn=$('#hk-f'), mat='spring', svg=$('#hk-svg'), scene=$('#hk-scene'), ghost=$('#hk-ghost');
    // Experiment mode: no theory line. Masses go on one at a time (50 g, 100 g or 200 g each: the student picks the interval)
    // and each reading is plotted like a data logger. Once loading stops (10 N, or the first mass taken off),
    // the masses come off one at a time and the unloading readings are plotted too, so the page shows whether
    // the sample is elastic (back to its original length) or permanently stretched.
    // phase and Fpeak are also tracked outside Experiment mode, so the rubber band's unloading line shows there too.
    var EXP=false, step=1, phase='load', Fpeak=0, loadR=[], unloadR=[];
    // Measure mode (?show=measure, Alex 5 Nov 2026): the practical page's "Do the experiment" tab. One spring, 100 g
    // masses, loading only to 8 N. Nothing is read for the student: a magnified view of the ruler at the pointer
    // replaces the graph, and the student writes each length in the table on the practical page and plots it there.
    // The spring's true lengths (cm) at 0–8 N are MEAS_L; the practical page checks against the same numbers.
    var MEAS=/[?&]show=measure\b/.test(location.search), MMAX=8;
    var MEAS_D=[0,0.1,-0.1,0,0.1,-0.1,0,0.1,0];   // a small fixed scatter, so the points are not perfectly in line
    var stack=[];      // slotted masses on the hanger (grams), bottom first; outside Experiment mode
    var Fcur=0;        // the load now (N)
    // the picture eases to each new load: Fd is the load the picture shows, off a short-lived offset so it never jumps
    var Fd=0, anim=null, looping=false, lastT=null, ANIM_T=0.6;
    var expBtn=$('#hk-exp');
    expBtn.addEventListener('click',function(){ EXP=!EXP; expBtn.setAttribute('aria-pressed',String(EXP)); clearRun(); });
    var MSIZES=[{g:50,N:0.5},{g:100,N:1},{g:200,N:2}], msEl=$('#hk-msize');
    msEl.innerHTML=MSIZES.map(function(m){ return '<button type="button" data-n="'+m.N+'" aria-pressed="'+(m.N===step)+'">'+m.g+' g</button>'; }).join('');
    msEl.addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return; step=+b.dataset.n;
      Array.prototype.forEach.call(msEl.children,function(x){ x.setAttribute('aria-pressed',String(x===b)); }); clearRun(); });
    if(MEAS){ EXP=true; expBtn.setAttribute('aria-pressed','true'); }
    function clearRun(){ loadR=[]; unloadR=[]; phase='load'; Fpeak=0; fIn.value=0; Fcur=0; Fd=0; anim=null; stack=[];
      $('#hk-slider').hidden=EXP; $('#hk-exp-btns').hidden=!EXP; $('#hk-results').hidden=!EXP||MEAS; $('#hk-msize-wrap').hidden=!EXP||MEAS; draw(); }
    function noise(F){ return [0,1,-1,0,2,-1,1,-2,0,1,-1,0,1,-1,2,0,-1,1,0,-2,1][Math.round(F*2)%21]; }
    // Rubber band hysteresis: on the way down the extension at each load is larger than on the way up,
    // and at 0 N it is back at its original length (elastic), so the loading and unloading lines form a loop.
    var SET=0, HYS=3;   // returns to its original length, as the practical page and mark schemes say
    function rubberDown(F, Fp){ var M=MATS.rubber, u=F/Fp; return M.ext(F)+HYS*(Fp/10)*6.75*u*(1-u)*(1-u)+SET*(Fp/10)*(1-u); }
    // The true extension now: on the way down an overloaded spring or wire comes back along a line parallel to
    // its straight-line region (so it keeps a permanent extension); a rubber band comes back on a different curve.
    // Outside Experiment mode the spring and wire simply follow their loading curve, as before.
    function xNow(F){
      var M=MATS[mat];
      if(MEAS) return M.ext(F)+(MEAS_D[Math.round(F)]||0)*Math.min(1,F);
      if(phase!=='unload' || F>=Fpeak) return M.ext(F);
      if(mat==='rubber') return rubberDown(F, Fpeak);
      if(!EXP || Fpeak<=M.lop) return M.ext(F);
      return M.ext(Fpeak)-M.k0*(Fpeak-F);
    }
    function ease(p){ return 1-Math.pow(1-p,3); }
    function dispX(){ var x=xNow(Fd); return anim ? x+anim.off*(1-ease(anim.p)) : x; }
    // every change of load: note where the picture is, change the state, then ease the picture to the new load
    function change(fn, tag){
      var before=dispX(); fn(); Fcur=+fIn.value;
      var F0=Fd; anim={F0:F0, F1:Fcur, p:0, off:0}; anim.off=before-xNow(F0);
      draw(tag);
      if(!looping){ looping=true; lastT=null; requestAnimationFrame(tick); }
    }
    function tick(t){
      if(!anim){ looping=false; return; }
      var dt=lastT===null?0.016:Math.min(0.05,(t-lastT)/1000); lastT=t;
      anim.p+=dt*SPEED()/ANIM_T;
      if(anim.p>=1){ Fd=anim.F1; anim=null; looping=false; render(); return; }
      Fd=anim.F0+(anim.F1-anim.F0)*ease(anim.p);
      render(); requestAnimationFrame(tick);
    }
    function reading(F, prev){   // what the student reads off the scale, to the scale's precision
      var M=MATS[mat], res=M.res, x=xNow(F), gap=Math.abs(x-prev);
      if(F>0) x+=noise(F)*Math.min(res*(mat==='wire'?0.5:1), gap/4);   // the error never makes a reading go the wrong way
      return Math.max(0, Math.round(x/res)*res);
    }
    var FMAX=MEAS?MMAX:10;
    function canAdd(){ return EXP ? (phase==='load' && Fpeak<FMAX-1e-9) : Fcur<10-1e-9; }
    function addMass(){
      if(phase!=='load' || Fpeak>=FMAX-1e-9) return;
      change(function(){
        var prev=loadR.length?loadR[loadR.length-1].x:0, F=Math.round((Fpeak+step)*2)/2;
        Fpeak=F; fIn.value=F; loadR.push({F:F, x:reading(F, prev)});
      },'load');
    }
    function removeMass(){
      var F=+fIn.value; if(MEAS || F<=0 || Fpeak<=0) return;
      change(function(){
        if(phase==='load'){ phase='unload'; }
        var prev=unloadR.length?unloadR[unloadR.length-1].x:loadR[loadR.length-1].x;
        F=Math.round((F-step)*2)/2; if(F<0) F=0;
        fIn.value=F; unloadR.push({F:F, x:reading(F, prev)});
      },'unload');
    }
    onAction('add',addMass);
    onAction('remove',removeMass);
    onAction('reset',function(){ clearRun(); });
    // outside Experiment mode: going up past the last peak is loading; going down is unloading (back up again
    // retraces the unloading line until the old peak); a new load after reaching 0 N starts a fresh cycle
    function setLoad(Fn){
      var Fo=Fcur;
      if(Fn>Fo){ if(phase==='unload' && Fo<=1e-9){ phase='load'; Fpeak=Fn; } else if(phase==='unload' && Fn<=Fpeak){} else { phase='load'; Fpeak=Math.max(Fpeak,Fn); } }
      else if(Fn<Fo && Fpeak>0) phase='unload';
      fIn.value=Fn;
    }
    function canonical(F){ var a=[], n=Math.floor(F+1e-9); for(var i=0;i<n;i++) a.push(100); if(F-n>0.25) a.push(50); return a; }
    fIn.addEventListener('input',function(){ var Fn=+fIn.value; change(function(){ setLoad(Fn); stack=canonical(Fn); }); });
    function addExplore(g){
      if(Fcur+g/100>10+1e-9){ $('#hk-note').textContent='The load can go up to 10 N here: take a mass off first.'; return; }
      change(function(){ stack.push(g); setLoad(Math.round((Fcur+g/100)*2)/2); });
    }
    function removeExplore(){ if(!stack.length) return; change(function(){ var g=stack.pop(); setLoad(Math.max(0,Math.round((Fcur-g/100)*2)/2)); }); }
    function onHanger(){ if(!EXP) return stack; var a=[], n=Math.round(Fcur/step); for(var i=0;i<n;i++) a.push(step*100); return a; }
    function piles(){   // the stock of masses on the bench, with how many are left
      if(EXP) return [{g:step*100, n:Math.round((FMAX-Fcur)/step)}];
      var n100=stack.filter(function(g){ return g===100; }).length, n50=stack.length-n100;
      return [{g:100, n:10-n100}, {g:50, n:Math.max(0,2-n50)}];
    }
    var MATS={
      spring:{name:'Spring', unit:'cm', res:0.1, k0:1.5, orig:10, xmax:30, lop:6, ext:function(F){ return F<=6?1.5*F:9+1.5*(F-6)+0.5*(F-6)*(F-6); }, px:4},
      wire:{name:'Metal wire', unit:'mm', res:0.05, k0:0.25, orig:2000, xmax:8, lop:7, ext:function(F){ return F<=7?0.25*F:1.75+0.25*(F-7)+0.6*(F-7)*(F-7); }, px:15},
      rubber:{name:'Rubber band', unit:'cm', res:0.1, orig:8, xmax:25, lop:null, ext:function(F){ var L=function(f){ return 1/(1+Math.exp(-(f-4)/1.4)); }; return 20*(L(F)-L(0))/(L(10)-L(0)); }, px:4}
    };
    var segEl=$('#hk-mat');
    segEl.innerHTML=Object.keys(MATS).map(function(k){ return '<button type="button" data-k="'+k+'" aria-pressed="'+(k===mat)+'">'+MATS[k].name+'</button>'; }).join('');
    segEl.addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return; mat=b.dataset.k;
      Array.prototype.forEach.call(segEl.children,function(x){ x.setAttribute('aria-pressed',String(x===b)); });
      if(EXP) clearRun(); else { phase='load'; Fpeak=Fcur; Fd=Fcur; anim=null; draw(); } });

    // ---- level (Alex, 11 Nov 2026): IGCSE is the default and is unchanged. IAL and IB add the stiffness k (the gradient of the
    // straight-line region) and the energy stored (the area under the force–extension graph), shaded on the graph.
    // IAL (27, 32): ΔF = kΔx, stiffness, elastic strain energy ΔE_el = ½FΔx. IB (A.2, A.3): F_H = −kx, spring constant, E_H = ½k(Δx)².
    var level='ks4', levelEl=$('#hk-level');
    function ks5(){ return level!=='ks4' && !MEAS; }
    function ib(){ return level==='ib'; }
    function toM(M){ return M.unit==='cm' ? 0.01 : 0.001; }                 // the page's extension unit in metres
    function sg(v,n){ return Math.abs(v)<1e-12 ? '0' : String(+(+v).toPrecision(n||3)); }
    // area under a force–extension curve x(f) between two loads, in joules (trapezium strips of 0.02 N)
    function areaJ(fn, f0, f1, M){ var A=0, f, d=0.02; for(f=f0; f<f1-1e-9; f+=d){ var g2=Math.min(f1,f+d); A+=(f+g2)/2*(fn(g2)-fn(f)); } return A*toM(M); }
    function kOf(M){ return 1/(M.k0*toM(M)); }                                // N m⁻¹, from the straight-line region
    function WHY(t){ return '<span class="why">'+t+'</span>'; }
    function Esym(){ return ib() ? 'E<sub>H</sub>' : 'ΔE<sub>el</sub>'; }
    // the extra working at IAL and IB for a load F on the loading line (x: extension in the page's unit)
    function ks5Lines(M, F, x){

      var t=e.target.closest && e.target.closest('[data-grab]'); if(!t || e.button>0) return;
      var from=t.getAttribute('data-grab'), hs=onHanger();
      var g=from==='pile' ? +t.getAttribute('data-g') : hs[hs.length-1];
      drag={from:from, g:g, sx:e.clientX, sy:e.clientY, moved:false, q:svgPt(e), over:false};
      svg.setPointerCapture(e.pointerId); svg.classList.add('dragging'); e.preventDefault();
    });
    svg.addEventListener('pointermove',function(e){
      if(!drag) return;
      if(!drag.moved && Math.hypot(e.clientX-drag.sx, e.clientY-drag.sy)<6) return;
      drag.moved=true; drag.q=svgPt(e); drag.over=inHangerZone(drag.q, sampleEnd(dispX()));
      render();
    });
    function endDrag(e, cancel){
      if(!drag) return;
      var d=drag; drag=null; svg.classList.remove('dragging');
      if(cancel){ render(); return; }
      var over = d.moved ? inHangerZone(svgPt(e), sampleEnd(dispX())) : null;
      // a tap (under 6 px) on the bench adds a mass; a tap on the hanger takes the top one off
      if(d.from==='pile' && (!d.moved || over)){ if(EXP) addMass(); else addExplore(d.g); return; }
      if(d.from==='hanger' && (!d.moved || !over)){ if(EXP) removeMass(); else removeExplore(); return; }
      render();
    }
    svg.addEventListener('pointerup',function(e){ endDrag(e,false); });
    svg.addEventListener('pointercancel',function(e){ endDrag(e,true); });

    function draw(isNew){
      var M=MATS[mat], F=Fcur, x=xNow(F), loadDone = EXP && (phase==='unload' || Fpeak>=10-1e-9);
      render();
      var dp=mat==='wire'?2:1, newL=M.orig+x;
      $('#hk-fo').textContent=F+' N';
      setStats(M, F, x);
      if(MEAS){
        var nm=Math.round(F);
        $('#hk-note').textContent = nm===0 ? 'Start with no masses on the hanger. Read the length of the spring at the pointer in the magnified ruler, with your eye level with the pointer, and write it in your table below. Then drag a 100 g mass onto the hanger (or press Add a mass).'
          : nm<MMAX ? 'Load: '+nm+' N. Read the length at the pointer and write it in your table. Then add the next 100 g mass.'
          : 'Load: '+nm+' N, the last reading. Read the length, then work out every extension in your table and plot your graph.';
        return;
      }
      if(EXP){
        var dpx=mat==='wire'?2:1, wire=mat==='wire', fx=function(v){ return v.toFixed(dpx); };
        var last=phase==='unload'&&unloadR.length?unloadR[unloadR.length-1]:loadR[loadR.length-1];
        var head='<table class="rtable"><thead><tr><th>Load (N)</th>'+(wire?'':'<th>Length ('+M.unit+')</th>')+'<th>Extension loading ('+M.unit+')</th><th>Extension unloading ('+M.unit+')</th></tr></thead><tbody>';
        var loads=[0].concat(loadR.map(function(r){ return r.F; })), rows='';
        loads.forEach(function(Fv){
          var l=Fv===0?{x:0}:loadR.filter(function(r){ return r.F===Fv; })[0], u=unloadR.filter(function(r){ return r.F===Fv; })[0];
          if(Fv===Fpeak && phase==='unload') u=l;
          var isNewRow=(isNew==='load'&&l===loadR[loadR.length-1])||(isNew==='unload'&&u===unloadR[unloadR.length-1]);
          rows+='<tr'+(isNewRow?' class="new"':'')+'><td>'+Fv+'</td>'+(wire?'':'<td>'+(M.orig+l.x).toFixed(1)+'</td>')+'<td>'+fx(l.x)+'</td><td>'+(u?fx(u.x):'')+'</td></tr>';
        });
        $('#hk-table').innerHTML=head+rows+'</tbody></table>';
        var tw=$('#hk-table'); if(isNew!=='unload') tw.scrollTop=tw.scrollHeight;
        if(last && !wire) $('#hk-eq').innerHTML='extension = new length − original length<br>extension = '+(M.orig+last.x).toFixed(1)+' − '+num(M.orig)+' = <b>'+last.x.toFixed(1)+' '+M.unit+'</b>';
        else if(last) $('#hk-eq').innerHTML='Read the vernier scale at the marker on the wire.<br>extension = <b>'+last.x.toFixed(2)+' mm</b>';
        else $('#hk-eq').innerHTML='Original length = '+num(M.orig)+' '+M.unit+(wire?' (2 m)':'');
        if(ks5() && loadDone && mat!=='rubber'){   // IAL and IB: k and the energy from the largest reading still on the straight line
          var rs=loadR.filter(function(r){ return r.F<=M.lop+1e-9; }), rk=rs[rs.length-1];
          if(rk){ var xm=rk.x*toM(M), kk=rk.F/xm;
            $('#hk-eq').innerHTML+=FR('<br>'+WHY('From your graph: the gradient of the straight-line region, using the origin and your reading at '+rk.F+' N ('+fx(rk.x)+' '+M.unit+'\u00a0=\u00a0'+sg(xm,4)+' m)')+
              '<br>k = [[ΔF|Δx]]<br>k = [['+rk.F+'|'+sg(xm,4)+']]<br>k = <b>'+sg(kk)+' N m⁻¹</b><br>'+WHY('Energy stored at '+rk.F+' N: the area under the straight line')+'<br>'+
              (ib() ? 'E<sub>H</sub> = ½k(Δx)²<br>E<sub>H</sub> = ½ × '+sg(kk,4)+' × '+sg(xm,4)+'²' : 'ΔE<sub>el</sub> = ½FΔx<br>ΔE<sub>el</sub> = ½ × '+rk.F+' × '+sg(xm,4))+'<br>'+Esym()+' = <b>'+sg(0.5*rk.F*xm)+' J</b>'); }
        }
        var nt, mg=Math.round(step*100)+' g', sample=mat==='spring'?'spring':mat==='wire'?'wire':'band';
        if(!last) nt='Experiment: choose a mass size (each 100 g adds 1 N), then drag the masses onto the hanger one at a time (or press Add a mass). Read the '+(wire?'vernier scale at the marker on the wire':'ruler at the pointer, with your eye level with it')+'.';
        else if(phase==='load' && !loadDone) nt='Reading: load '+last.F+' N, extension '+fx(last.x)+' '+M.unit+'. Add another '+mg+' mass, or take one off to start unloading.';
        else if(phase==='load') nt=(mat==='rubber'?'Loading done. The points do not lie on a straight line, so a rubber band does not obey Hooke’s law.':'Loading done. The points lie on a straight line through the origin up to about '+M.lop+' N, then curve: that is the limit of proportionality.')+' Now take the masses off one at a time.';
        else if(F>0) nt='Unloading: load '+F+' N, extension '+fx(last.x)+' '+M.unit+'. Take the next mass off.';
        else if(mat==='rubber') nt=(last.x>=M.res/2?'Back at 0 N the band is only '+fx(last.x)+' cm longer than at the start, and it creeps back to its original length within a minute or so, so it is elastic.':'Back at 0 N the band is at its original length, so it is elastic.')+' But the unloading points lie on a different curve: at each load the extension is larger than when loading.';
        else if(last.x>M.res*1.5) nt='Back at 0 N the '+sample+' is still '+fx(last.x)+' '+M.unit+' longer than at the start. It was loaded past its elastic limit, so it is permanently stretched.';
        else nt='Back at 0 N the '+sample+' is at its original length: it was only loaded in its straight-line region, so it shows elastic behaviour.';
        $('#hk-note').textContent=nt;
        return;
      }
      $('#hk-eq').innerHTML='extension = new length − original length<br>extension = '+num(newL,dp)+' − '+num(M.orig)+' = <b>'+num(x,dp)+' '+M.unit+'</b>';
      if(ks5()){
        if(mat==='rubber' && phase==='unload'){ var Wl=areaJ(M.ext,0,Fpeak,M), Wu=areaJ(function(f){ return rubberDown(f,Fpeak); },0,Fpeak,M);
          $('#hk-eq').innerHTML+='<br>'+WHY('Each area under a curve is an energy.')+'<br>work done stretching = area under the loading curve<br> = <b>'+sg(Wl)+' J</b><br>energy given back = area under the unloading curve<br> = <b>'+sg(Wu)+' J</b><br>difference = '+sg(Wl)+' − '+sg(Wu)+'<br> = <b>'+sg(Wl-Wu)+' J</b><br>'+WHY('The shaded loop between the curves: this energy heats the band.'); }
        else $('#hk-eq').innerHTML+=FR(ks5Lines(M, F, x));
      }
      var note;
      if(mat==='rubber' && phase==='unload' && F>0) note='Unloading: at each load the band is longer than it was on the way up, so the unloading line is a different curve from the loading line.';
      else if(mat==='rubber' && phase==='unload') note=(x>=0.05?'Back at 0 N the band is only '+num(x,1)+' cm longer than at the start, and it creeps back within a minute or so: it':'Back at 0 N the band is at its original length: it')+' is elastic, but it came back on a different curve.';
      else if(mat==='rubber') note='A rubber band does not obey Hooke’s law: its graph is never a straight line. It stretches easily in the middle, then gets stiffer. Take masses off to see the unloading line.';
      else if(F===0) note='Drag masses onto the hanger (or use the slider). In the straight-line region, doubling the force doubles the extension.';
      else if(F<=M.lop) note='Straight-line region: extension is directly proportional to force, so it obeys Hooke’s law.';
      else note='Past the limit of proportionality: the line curves, so extension is no longer proportional to force.';
      if(ks5()){   // IAL and IB notes: the same physics, with k and the area
        var kn=ib()?'spring constant':'stiffness', en=ib()?'elastic potential energy':'elastic strain energy';
        if(mat==='rubber' && phase==='unload') note='Unloading: the band comes back on a different curve. The area under the unloading curve (energy given back) is smaller than the area under the loading curve (work done stretching it); the shaded loop is the energy that heats the band.';
        else if(mat==='rubber') note='A rubber band does not obey Hooke’s law: its graph is a curve, so it has no single '+kn+'. The shaded area is the work done stretching it. Take masses off to see the unloading curve.';
        else if(F===0) note='Drag masses onto the hanger (or use the slider). The gradient of the straight-line region is the '+kn+' k, and the area under the line is the '+en+'.';
        else if(F<=M.lop) note='Straight-line region: force is directly proportional to extension (Hooke’s law). The gradient is the '+kn+' k, and the shaded triangle is the '+en+' stored.';
        else note='Past the limit of proportionality the line curves. The shaded area is still the work done, but '+(ib()?'½k(Δx)²':'½FΔx')+' no longer gives it.'+(ib()?'':' Loaded beyond its elastic limit the '+(mat==='wire'?'wire':'spring')+' deforms plastically: it does not go back to its original length.');
      }
      $('#hk-note').textContent=note;
    }
    if(PW_LEVEL==='ial' || PW_LEVEL==='ib') level=PW_LEVEL, Array.prototype.forEach.call(levelEl.children,function(x){ x.setAttribute('aria-pressed',String(x.dataset.v===PW_LEVEL)); });
    if(MEAS) clearRun(); else draw();
  }
  watchEquals('.eq');
  if(/[?&]show=measure\b/.test(location.search)){   // measure mode: hide everything the student does not need
    ['#hk-exp','#working','[data-action="remove"]'].forEach(function(s){ var e=$(s); if(e) e.hidden=true; });
    var mr=$('#hk-mat'); if(mr) mr.closest('.row').hidden=true;
    document.documentElement.classList.add('measure');
  }
  initHookeSim();
})();
</script><script id="choice-kit-js">
/* Choice kit (12 Nov 2026): the same block on every animation page. See tools/ANIMATION-STYLE.md, "Choices".
   A group of choices with one chosen gets a track round it (class pick); a .to-q button opens the questions from Explore. */
(function(){
  function on(b){ return b.getAttribute('aria-pressed')==='true' || b.classList.contains('is-on'); }
  function each(sel, fn){ Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }
  function mark(s){
    if(!s.classList.contains('pick')){
      var n=0; Array.prototype.forEach.call(s.children, function(b){ if(b.tagName==='BUTTON' && on(b)) n++; });
      if(n===1) s.classList.add('pick');
    }
    if(s.classList.contains('pick') && !s.hasAttribute('data-fit')){
      var d=getComputedStyle(s).display;
      if(d!=='none'){ s.setAttribute('data-fit','1'); if(d.indexOf('flex')>=0) s.classList.add('fit'); }
    }
  }
  each('.seg:not(.tabs):not(.mode):not(.apps)', function(s){
    mark(s);
    if(window.MutationObserver) new MutationObserver(function(){ mark(s); }).observe(s, {childList:true, subtree:true, attributes:true, attributeFilter:['aria-pressed','class']});
  });
  each('.to-q[data-mode]', function(b){
    var seg=document.getElementById(b.getAttribute('data-mode')); if(!seg) return;
    var bs=seg.querySelectorAll('button');
    function sync(){ b.hidden=!on(bs[0]) || !seg.getClientRects().length; }   // hidden too when the page hides its mode switch (e.g. at a level with no questions)
    b.addEventListener('click', function(){ bs[1].click(); bs[1].focus(); });
    if(window.MutationObserver) new MutationObserver(sync).observe(seg, {subtree:true, attributes:true, attributeFilter:['aria-pressed']});
    document.addEventListener('click', function(){ setTimeout(sync, 0); });
    sync(); setTimeout(sync, 0);
  });
})();
</script>
