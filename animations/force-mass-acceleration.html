<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F = ma Animation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1f5;
    --bg-grid:rgba(29,41,61,0.055);
    --panel:#ffffff;
    --panel-border:#d7dce4;
    --ink:#182233;
    --ink-soft:#4c5668;
    --ink-faint:#8993a5;
    --accent:#d9720c;
    --accent-soft:#fdead2;
    --good:#15803d;
    --good-soft:#dcf5e3;
    --bad:#c0311a;
    --bad-soft:#fbe1db;
    --shadow:0 10px 26px -14px rgba(24,34,51,0.28);

    --motion:#2158d1;      --motion-soft:#dfe8fc;
    --calc:#0c8a76;        --calc-soft:#d6f3ee;
    --measure:#0a7f96;     --measure-soft:#d7f0f4;
    --force:#c2560c;       --force-soft:#fbe4cd;
    --balance:#6d3bce;     --balance-soft:#e9e0fb;
    --vector:#b8267a;      --vector-soft:#fbdeee;
    --newton:#3d3aa8;      --newton-soft:#e3e2f8;
    --units:#96660b;       --units-soft:#f6e8ca;

    --font-display:'Big Shoulders',system-ui,sans-serif;
    --font-body:'IBM Plex Sans',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12161f; --bg-grid:rgba(255,255,255,0.045);
      --panel:#1b212e; --panel-border:#2c3444;
      --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;
      --accent:#ff9a3d; --accent-soft:#3a2712;
      --good:#4ade80; --good-soft:#123321;
      --bad:#f27159; --bad-soft:#3a1712;
      --shadow:0 14px 30px -14px rgba(0,0,0,0.55);
      --motion:#7da3ff; --motion-soft:#1a2440;
      --calc:#4fd6bd; --calc-soft:#0f2e29;
      --measure:#5fd0e6; --measure-soft:#0f2c33;
      --force:#ff9f5c; --force-soft:#3a2413;
      --balance:#b393f5; --balance-soft:#2a2148;
      --vector:#ef83bd; --vector-soft:#3a1c2c;
      --newton:#9d9af0; --newton-soft:#242259;
      --units:#e0b64a; --units-soft:#332a10;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12161f; --bg-grid:rgba(255,255,255,0.045);
    --panel:#1b212e; --panel-border:#2c3444;
    --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;
    --accent:#ff9a3d; --accent-soft:#3a2712;
    --good:#4ade80; --good-soft:#123321;
    --bad:#f27159; --bad-soft:#3a1712;
    --shadow:0 14px 30px -14px rgba(0,0,0,0.55);
    --motion:#7da3ff; --motion-soft:#1a2440;
    --calc:#4fd6bd; --calc-soft:#0f2e29;
    --measure:#5fd0e6; --measure-soft:#0f2c33;
    --force:#ff9f5c; --force-soft:#3a2413;
    --balance:#b393f5; --balance-soft:#2a2148;
    --vector:#ef83bd; --vector-soft:#3a1c2c;
    --newton:#9d9af0; --newton-soft:#242259;
    --units:#e0b64a; --units-soft:#332a10;
    color-scheme:dark;
  }

  :root{--c:var(--newton);--cs:var(--newton-soft);}

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      linear-gradient(var(--bg-grid) 1px,transparent 1px) 0 0/100% 34px,
      linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px) 0 0/34px 100%,
      var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  [hidden]{display:none!important;}
  button{font:inherit;color:inherit;}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;}

  .page{max-width:1400px;margin-inline:auto;padding-inline:20px;padding-block:12px 40px;}
  h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:0.2px;text-wrap:balance;margin:0;}
  p{margin:0;line-height:1.55;}

  .home-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-bottom:4px;font:600 13px var(--font-mono);color:var(--ink-soft);text-decoration:none;}
  .home-link:hover{color:var(--accent);}
  .page-head{margin-bottom:12px;}
  .eyebrow{font-family:var(--font-mono);font-size:11.5px;color:var(--accent);font-weight:600;margin-bottom:6px;}
  .page-head h1{font-size:clamp(28px,5vw,38px);color:var(--ink);}

  .card{background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;box-shadow:var(--shadow);}
  .btn{
    font-family:var(--font-body);font-weight:600;font-size:13.5px;color:var(--ink);
    background:var(--panel);border:1px solid var(--panel-border);border-radius:9px;
    padding:9px 15px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  }
  .btn:hover{border-color:var(--ink-faint);}
  .btn:disabled{opacity:.45;cursor:default;}
  .btn-primary{background:var(--ink);border-color:var(--ink);color:var(--bg);}
  .btn-primary:hover{opacity:.88;border-color:var(--ink);}
  .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);}
  .btn-group{display:flex;flex-wrap:wrap;gap:10px;}

  /* picture on the left; controls, readings and working on the right */
  .stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);gap:18px 24px;align-items:start;padding:18px;}
  @media (max-width:860px){ .stage{grid-template-columns:minmax(0,1fr);} }
  /* the picture shrinks on short screens so the whole box fits in the window */
  .view{display:block;width:100%;height:auto;max-height:max(260px,calc(100vh - 290px));}
  .embed .view{max-height:460px;}
  .under{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;margin-top:12px;}
  .under .btn-group{flex:0 1 auto;}
  .mass{flex:1 1 220px;min-width:0;}
  .sliders{flex:1 1 100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px 24px;}
  .eq .why{font-family:var(--font-body);font-size:11.5px;color:var(--ink-faint);margin-left:.8em;}
  .view text{font-family:var(--font-mono);}
  .side{display:flex;flex-direction:column;gap:12px;min-width:0;}
  .lab{display:flex;justify-content:space-between;font:12.5px var(--font-mono);color:var(--ink-soft);margin-bottom:6px;}
  .lab output{color:var(--ink);font-weight:600;}
  input[type=range]{width:100%;accent-color:var(--c);min-height:28px;}
  .seg{display:flex;flex-wrap:wrap;gap:6px;}
  .seg button{font:12.5px var(--font-mono);padding:8px 12px;min-height:44px;border:1px solid var(--panel-border);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer;}
  .seg button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--panel);}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px;}
  .stat strong{white-space:nowrap;}
  .stat{border:1px solid var(--panel-border);border-radius:8px;padding:5px 8px;}
  .stat small{display:block;font:10.5px var(--font-mono);color:var(--ink-faint);}
  .stat strong{font:600 15px var(--font-mono);color:var(--ink);}
  .stat.up strong{color:var(--accent);}
  .note{font-size:15px;line-height:1.5;color:var(--ink);padding:10px 12px;border-radius:8px;background:var(--bg);min-height:4.6em;}

  details.working summary{cursor:pointer;font:600 13px var(--font-mono);color:var(--c);min-height:44px;display:flex;align-items:center;}
  .eq{font-family:var(--font-mono);font-size:14px;line-height:1.75;padding:8px 12px;border-left:3px solid var(--c);background:var(--cs);border-radius:6px;color:var(--ink);}
  .eq b{color:var(--c);}
  .eqg{display:grid;grid-template-columns:auto auto minmax(0,1fr);column-gap:.45em;row-gap:.2em;align-items:center}
  .eqg-l{justify-self:end;text-align:right}
  .eqg-m{justify-self:center}
  .eqg-r{justify-self:start;min-width:0}
  .eqg-full{grid-column:1/-1}
  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1.25;}
  .frac>span{padding:0 .25em;white-space:nowrap;}
  .frac>span:first-child{border-bottom:1.5px solid currentColor;}
  @media (max-width:560px){ .stage{padding:12px;} .eq{font-size:12.5px;padding:6px 8px;} }

  /* inside a workout tab (skydiver.html?embed): no page heading, no outer margins */
  .embed body{background:transparent;}
  .embed .page{padding:0;max-width:none;}
  .embed .home-link,.embed .page-head{display:none;}
  .hint{font-size:13px;color:var(--ink-soft);}
  .embed .hint{display:none;}
  .embed .view{max-height:none;}
</style>
</head>
<body>
<div class="page" id="page">
  <a class="home-link" href="../index.html">&larr; Home</a>
  <header class="page-head">
    <div class="eyebrow">Animations &middot; forces</div>
    <h1>Force, Mass and Acceleration</h1>
  </header>

  <section class="card stage">
    <div>
      <svg class="view" id="fma-svg" viewBox="20 72 530 92" role="img" aria-label="A trolley on a track pushed by a resultant force">
        <defs><marker id="fma-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--force)"/></marker></defs>
        <line x1="24" x2="546" y1="132" y2="132" stroke="var(--ink-soft)" stroke-width="3"/>
        <g id="fma-ticks"></g>
        <g id="fma-trail"></g>
        <g id="fma-trolley">
          <line id="fma-arrow" y1="-26" y2="-26" stroke="var(--force)" stroke-width="5" marker-end="url(#fma-head)"/>
          <text id="fma-flabel" y="-40" text-anchor="middle" font-family="var(--font-mono)" font-size="13" fill="var(--force)"></text>
          <rect id="fma-body" y="-44" height="34" rx="5" fill="var(--newton-soft)" stroke="var(--newton)" stroke-width="2.5"/>
          <text id="fma-mlabel" y="-22" text-anchor="middle" font-family="var(--font-mono)" font-size="13" fill="var(--ink)"></text>
          <circle id="fma-w1" cy="-5" r="6" fill="var(--panel)" stroke="var(--ink)" stroke-width="2.5"/>
          <circle id="fma-w2" cy="-5" r="6" fill="var(--panel)" stroke="var(--ink)" stroke-width="2.5"/>
        </g>
      </svg>
      <div class="under">
        <div class="btn-group">
          <button class="btn btn-primary" data-action="fma-go" type="button">&#9654; Go</button>
          <button class="btn" data-action="fma-reset" type="button">&#8634; Reset</button>
          <button class="btn" id="slow" type="button" aria-pressed="false">Slow motion</button>
        </div>
        <div class="sliders">
          <div><label class="lab" for="fma-f">Resultant force F <output id="fma-fo"></output></label><input type="range" id="fma-f" min="0" max="24" step="1" value="12"></div>
          <div><label class="lab" for="fma-m">Mass m <output id="fma-mo"></output></label><input type="range" id="fma-m" min="1" max="8" step="0.5" value="4"></div>
        </div>
      </div>
    </div>
    <div class="side">
      <p class="note" id="fma-note" aria-live="polite"></p>
      <p class="hint">The trolley starts from rest on a 10 m track. The faint dots mark where it was every 0.5 s, so you can see it speeding up.</p>
      <div class="stats">
        <div class="stat"><small>Time</small><strong id="fma-t">0.0 s</strong></div>
        <div class="stat"><small>Speed</small><strong id="fma-v">0.0 m/s</strong></div>
        <div class="stat"><small>Distance</small><strong id="fma-s">0.0 m</strong></div>
      </div>
      <details class="working" id="working">
        <summary>Show working</summary>
        <div class="eq" id="fma-eq"></div>
      </details>
    </div>
  </section>
</div>
<script>
(function(){
  // This page is the one copy of this animation. On its own it is the lesson version;
  // with ?embed it drops its heading so a workout tab can show it in a frame, and it tells that page its height.
  var EMBED = /[?&]embed\b/.test(location.search);
  if(EMBED){
    document.documentElement.classList.add('embed');
    var wk=document.getElementById('working'); if(wk) wk.open = true;
    var page = document.getElementById('page');
    var sendHeight = function(){ try{ parent.postMessage({animHeight: Math.ceil(page.getBoundingClientRect().height)}, '*'); }catch(e){} };
    if(window.ResizeObserver) new ResizeObserver(sendHeight).observe(page);
    window.addEventListener('load', sendHeight);
  }
  function $(sel){ return document.querySelector(sel); }
  function bindRange(id, fn){ var el=$('#'+id); el.addEventListener('input', fn); return el; }
  function onAction(name, fn){ var b=$('[data-action="'+name+'"]'); if(b) b.addEventListener('click', fn); }
  var REDUCED_MOTION=false;   // runs start only when pressed and always end, so they play even with reduced motion on
  // Slow motion: every run multiplies its time step by SPEED()
  function SPEED(){ var b=document.getElementById('slow'); return b && b.getAttribute('aria-pressed')==='true' ? 0.3 : 1; }
  (function(){ var b=document.getElementById('slow'); if(b) b.addEventListener('click',function(){ b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed')!=='true')); }); })();
  function num(n, dp){   // round, drop trailing zeros, group thousands with a space from 10 000
    var f = Math.pow(10, dp||0), r = Math.round(n*f)/f, t = String(r);
    if(Math.abs(r)>=10000) t = t.replace(/\B(?=(\d{3})+(?!\d))/g,' ');
    return t;
  }
  function FR(t){
    return String(t).replace(/(\d) (?=\d{3}\b)/g,'$1 ')
      .replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g,'<span class="frac"><span>$1</span><span>$2</span></span>');
  }
  function arrowHead(id, col){ return '<marker id="'+id+'" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="'+col+'"/></marker>'; }
  function alignEquals(el){
    if(el.querySelector('.eqg')) return;
    var rows = el.innerHTML.split(/<br\s*\/?>/i).map(function(line){
      var i = line.indexOf(' = ');
      if(i<0) return '<span class="eqg-full">'+line+'</span>';
      return '<span class="eqg-l">'+line.slice(0,i)+'</span><span class="eqg-m">=</span><span class="eqg-r">'+line.slice(i+3)+'</span>';
    });
    el.innerHTML = '<div class="eqg">'+rows.join('')+'</div>';
  }
  function watchEquals(sel){ Array.prototype.forEach.call(document.querySelectorAll(sel), function(el){ alignEquals(el); new MutationObserver(function(){ alignEquals(el); }).observe(el, {childList:true}); }); }

  function initFmaSim(){
    var X0=130, PXM=32, TRACK=10, TMAX=8, REDUCED=false;   // student-started and always ends, so it plays even with reduced motion
    var fIn=$('#fma-f'), mIn=$('#fma-m'), t=0, running=false, last=0, raf=0, dots=[];
    var ticks='';
    for(var i=0;i<=TRACK;i+=2){ var x=X0+i*PXM; ticks+='<line x1="'+x+'" x2="'+x+'" y1="132" y2="140" stroke="var(--ink-faint)" stroke-width="1.5"/><text x="'+x+'" y="156" text-anchor="middle" font-family="var(--font-mono)" font-size="11" fill="var(--ink-faint)">'+i+' m</text>'; }
    $('#fma-ticks').innerHTML=ticks;
    function F(){ return +fIn.value; } function M(){ return +mIn.value; } function A(){ return F()/M(); }
    function sAt(tt){ return Math.min(TRACK, 0.5*A()*tt*tt); }
    function fmt1(n){ return (Math.round(n*10)/10).toFixed(1); }
    function fmtA(n){ return String(Math.round(n*100)/100); }
    function draw(){
      var s=sAt(t), v=A()*t, bw=34+M()*7, x=X0+s*PXM, f=F();
      if(s>=TRACK) v=Math.sqrt(2*A()*TRACK);
      $('#fma-trolley').setAttribute('transform','translate('+x+' 132)');
      var b=$('#fma-body'); b.setAttribute('x',0); b.setAttribute('width',bw);
      $('#fma-mlabel').setAttribute('x',bw/2); $('#fma-mlabel').textContent=M()+' kg';
      $('#fma-w1').setAttribute('cx',9); $('#fma-w2').setAttribute('cx',bw-9);
      var ar=$('#fma-arrow'), len=f*4;
      ar.setAttribute('x1',-6-len); ar.setAttribute('x2',-6); ar.style.display=f?'':'none';
      $('#fma-flabel').setAttribute('x',-6-len/2); $('#fma-flabel').textContent=f?f+' N':'';
      $('#fma-trail').innerHTML=dots.map(function(d){ return '<circle cx="'+(X0+d*PXM)+'" cy="118" r="3.5" fill="var(--newton)" opacity=".35"/>'; }).join('');
      $('#fma-t').textContent=fmt1(t)+' s'; $('#fma-v').textContent=fmt1(v)+' m/s'; $('#fma-s').textContent=fmt1(s)+' m';
    }
    // the answer stays hidden until the run ends, so students can predict it first
    function eq(done){
      $('#fma-fo').textContent=F()+' N'; $('#fma-mo').textContent=M()+' kg';
      $('#fma-eq').innerHTML=FR('F = m × a<br>a = [[F|m]]<br>a = [['+F()+'|'+M()+']]<br>a = <b>'+(done?fmtA(A())+' m/s²':'? m/s²')+'</b>');
    }
    function stop(){ running=false; cancelAnimationFrame(raf); }
    function reset(){ stop(); t=0; dots=[]; $('#fma-note').textContent='Press Go to push the trolley from rest.'; eq(); draw(); }
    function addDots(){ dots=[]; for(var k=0.5;k<=t+1e-9;k+=0.5){ var d=sAt(k); dots.push(d); if(d>=TRACK) break; } }
    function finish(){
      stop(); addDots(); draw(); eq(true);
      $('#fma-note').textContent = F()===0 ? 'No resultant force, so no acceleration: the trolley stays at rest.'
        : 'It reached the end of the track in '+fmt1(t)+' s. Try doubling the force, or doubling the mass.';
    }
    function frame(now){
      if(!running) return;
      t+=Math.min(0.05,(now-last)/1000)*SPEED(); last=now;
      addDots();
      if(sAt(t)>=TRACK || t>=TMAX){ if(sAt(t)>=TRACK) t=Math.sqrt(2*TRACK/A()); finish(); return; }
      draw(); raf=requestAnimationFrame(frame);
    }
    function go(){
      reset();
      if(F()===0){ t=0; finish(); return; }
      if(REDUCED){ t=Math.min(TMAX, Math.sqrt(2*TRACK/A())); finish(); return; }
      running=true; last=performance.now(); raf=requestAnimationFrame(frame);
    }
    fIn.addEventListener('input',reset); mIn.addEventListener('input',reset);
    onAction('fma-go',go); onAction('fma-reset',reset);
    reset();
  }
  watchEquals('.eq');
  initFmaSim();
})();
</script>
</body>
</html>
