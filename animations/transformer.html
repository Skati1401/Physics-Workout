<script>
  // Visit counter (GoatCounter: no cookies, no personal data). Skipped when a page is embedded in a workout, so a visit counts once.
  // pwCountTab(tab, label): counts each workout tab once per visit as a GoatCounter event (path "page#tab"), skipped in frames the same way.
  (function(){
    var off = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var seen = {}, queue = [];
    function send(e){ try { window.goatcounter.count(e); } catch (x) {} }
    window.pwCountTab = function(tab, label){
      if (off || !tab || seen[tab]) return;
      seen[tab] = 1;
      var page = (location.pathname.split('/').pop() || 'index').replace(/\.html$/, '');
      var e = { path: page + '#' + tab, title: (label || tab) + ' \u00b7 ' + document.title, event: true };
      if (window.goatcounter && window.goatcounter.count) send(e); else queue.push(e);
    };
    if (off) return;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://gc.zgo.at/count.js';
    s.setAttribute('data-goatcounter', 'https://physics-workout.goatcounter.com/count');
    s.onload = function(){ var q = queue; queue = []; q.forEach(send); };
    document.head.appendChild(s);
  })();
</script>

<script>
  // Draft tags and Alex's reviewer button (tools/review/drafts.py writes this block; edit tools/review/snippet.html, then run drafts.py sync).
  // A page is Draft while its row in tools/REVIEW.md is not ✅: <meta name="pw-draft"> on the page, data-draft on its list cards.
  // ?reviewer (once, on any page) turns on reviewer mode in this browser; ?reviewer=off turns it off.
  (function(){
    var on = false, embed = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    try {
      var m = /[?&]reviewer(?:=([^&]*))?/.exec(location.search);
      if (m) { if (m[1] === 'off') localStorage.removeItem('pw-reviewer'); else localStorage.setItem('pw-reviewer', '1'); }
      on = localStorage.getItem('pw-reviewer') === '1';
    } catch (e) {}
    var CSS = '.pw-draft{display:inline-block;vertical-align:middle;margin-left:10px;font:600 11.5px/1.4 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:0;color:var(--bad,#b42318);border:1px dashed currentColor;border-radius:5px;padding:1px 7px;white-space:nowrap}'
      + '.act-top .pw-draft{margin-left:auto;flex:none}.act-top .pw-draft~.cp-tag,.act-top .pw-draft~.ta-tag{margin-left:0}'
      + 'a[data-draft]{position:relative}.pw-draft.pw-corner{position:absolute;top:10px;right:10px;margin:0;background:var(--panel,#fff)}'
      + 'summary .pw-draft{margin-left:0;flex:none}'
      + '.pw-check{display:inline-block;vertical-align:middle;margin-left:8px;font:600 13px/1.4 "IBM Plex Sans",system-ui,sans-serif;color:#fff;background:#1a7f37;border-radius:6px;padding:4px 10px;text-decoration:none;white-space:nowrap}'
      + '.pw-check:hover{background:#116329}.pw-check:focus-visible{outline:2px solid #1a7f37;outline-offset:2px}'
      + '.pw-reviewer{position:fixed;left:10px;bottom:10px;z-index:9999;font:500 12px/1.4 "IBM Plex Mono",ui-monospace,monospace;background:#1d2433;color:#fff;border-radius:6px;padding:4px 9px;opacity:.85}'
      + '.pw-reviewer a{color:#ffc83d}';
    function tag(){ var t = document.createElement('span'); t.className = 'pw-draft'; t.title = 'Not yet checked'; t.textContent = 'Draft'; return t; }
    function go(){
      var st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st);
      var meta = document.querySelector('meta[name="pw-draft"]'), h1 = document.querySelector('h1');
      if (meta && h1 && !embed) {
        h1.appendChild(tag());
        if (on) {
          var page = meta.getAttribute('content'), b = document.createElement('a');
          b.className = 'pw-check'; b.target = '_blank'; b.rel = 'noopener'; b.textContent = '✓ Checked';
          b.title = 'Opens a GitHub issue. Submit it and the Draft tag goes in a minute or two.';
          b.href = 'https://github.com/Skati1401/Physics-Workout/issues/new?title=' + encodeURIComponent('Checked: ' + page)
            + '&body=' + encodeURIComponent('Submit this issue to mark `' + page + '` as checked. The Draft tag goes in a minute or two, and the issue closes itself.');
          h1.appendChild(b);
        }
      }
      document.querySelectorAll('a[data-draft]').forEach(function(a){
        if (a.querySelector('.pw-draft')) return;
        var t = tag(), top = a.querySelector('.act-top');
        if (top) top.insertBefore(t, top.querySelector('.cp-tag,.ta-tag'));
        else { t.className += ' pw-corner'; a.appendChild(t); }
      });
      document.querySelectorAll('details.unit').forEach(function(d){
        var s = d.querySelector('summary');
        if (!s || s.querySelector('.pw-draft') || !d.querySelector('a[data-draft]')) return;
        var h2 = s.querySelector('h2'); if (h2) h2.parentNode.insertBefore(tag(), h2.nextSibling); else s.appendChild(tag());
      });
      if (on && !embed) {
        var r = document.createElement('div'); r.className = 'pw-reviewer';
        r.innerHTML = 'Reviewer mode · <a href="?reviewer=off">turn off</a>';
        document.body.appendChild(r);
      }
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
  })();
</script>

<body>
<div class="page" id="page">

<script>
(function(){
  // transformer.html is the one copy of this animation.
  // With ?embed the page drops its heading so a workout tab can show it in a frame, and tells that page its height.
  var EMBED = /[?&]embed\b/.test(location.search);
  if(EMBED){
    document.documentElement.classList.add('embed');
    var wk = document.querySelector('details.working'); if(wk) wk.open = true;
    var page = document.getElementById('page');
    var sendHeight = function(){ try{ parent.postMessage({animHeight: Math.ceil(page.getBoundingClientRect().height)}, '*'); }catch(e){} };
    if(window.ResizeObserver) new ResizeObserver(sendHeight).observe(page);
    window.addEventListener('load', sendHeight);
  }
  function $(sel){ return document.querySelector(sel); }
  function num(n, dp){   // round, drop trailing zeros, group thousands with a space from 10 000
    var f = Math.pow(10, dp||0), r = Math.round(n*f)/f, t = String(Math.abs(r));
    if(Math.abs(r)>=10000) t = t.replace(/\B(?=(\d{3})+(?!\d))/g,' ');
    return (r<0?'−':'')+t;
  }
  function FR(t){
    return String(t).replace(/(\d) (?=\d{3}\b)/g,'$1 ')
      .replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g,'<span class="frac"><span>$1</span><span>$2</span></span>');
  }
  function arrowHead(id, col){ return '<marker id="'+id+'" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="'+col+'"/></marker>'; }

    else g+='<rect x="'+S.x+'" y="'+S.top+'" width="'+S.w+'" height="'+(S.h*0.3).toFixed(1)+'" rx="7" fill="var(--copper)"/>'+txt(S.x+S.w-12,py1+6,'+',{a:'middle',fs:17,c:'#fff',w:600})+txt(S.x+S.w-12,py2+6,'−',{a:'middle',fs:17,c:'#fff',w:600});
    g+=txt(cxs+4,S.top+S.h+17,ac()?'a.c. supply':'battery',{a:'middle',fs:12.5})+txt(cxs+4,S.top+S.h+33,Vin()+' V'+(ac()?'':' d.c.'),{a:'middle',fs:12.5,c:'var(--ink)',w:600});

    if(!exp() && !q){
      ['vp','vs'].forEach(function(w){ var pts=[]; for(var k=0;k<=400;k++){ var tt=k/400*TMAX; pts.push(gx(tt).toFixed(1)+','+gy(w==='vp'?vp(tt):vs(tt)).toFixed(1)); }
        g+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--'+(w==='vp'?'accent':'topic')+')" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.5"/>'; });

  // ---- Predict: a transformer is dealt, the student clicks the voltmeter's scale, then Switch on shows the reading ----
  // every answer falls on a division of the scale
  var QS=[[200,400,10,1],[400,100,20,1],[100,500,4,1],[600,300,20,1],[300,900,10,1],[200,2000,4,1],[1000,500,20,1],[400,800,20,1],[200,400,6,1],[600,300,16,1],[100,300,4,1],[200,400,12,0],[400,100,6,0],[100,500,8,0]];
  function deal(){
    var i; do{ i=Math.floor(Math.random()*QS.length); }while(i===lastQ); lastQ=i; var c=QS[i];
    stop(); t=0; flowPh=0; readings=[]; mark('');
    npIn.value=c[0]; nsIn.value=c[1]; vpIn.value=c[2]; sup.pick(c[3]?'ac':'dc');
    q={ans:c[3]?c[2]*c[1]/c[0]:0, pick:null, phase:'ask', ok:null};
    draw();
  }
  function setPick(v){ if(!q || q.phase!=='ask') return; var YM=yMax(), st=YM/10; q.pick=Math.max(-YM,Math.min(YM,Math.round(v/st)*st)); draw(); }
  function judge(){ if(q && q.phase==='run' && t>=(ac()?2:1.2)){ q.phase='done'; q.ok=Math.abs(Math.abs(q.pick)-q.ans)<yMax()/20-1e-9; score[1]++; if(q.ok) score[0]++; } }
  function predictNote(YM){
    var set='This transformer has '+Np()+' turns on the primary and '+Ns()+' on the secondary, with '+Vin()+' V '+(ac()?'a.c.':'from a battery')+' across the primary. ';
    if(q.phase==='ask') return '<b>Predict.</b> '+set+(ac()?'How far will the voltmeter&rsquo;s needle swing?':'Where will the voltmeter&rsquo;s needle settle?')+' Click its scale'+(q.pick===null?'':' (you chose <b>'+num(Math.abs(q.pick),1)+' V</b>)')+', then press <b>Switch on</b>.';
    if(q.phase==='run') return 'Watch the voltmeter.';
    var why=ac()?'The voltages are in the same ratio as the turns: '+Ns()+' is '+(Ns()>Np()?num(Ns()/Np(),2)+' times as many turns as '+Np()+', so the output is '+num(Ns()/Np(),2)+' × '+Vin()+' V':'only '+FR('[['+Ns()+'|'+Np()+']]')+' of the turns, so the output is that fraction of '+Vin()+' V')+' = <b>'+num(q.ans,1)+' V</b>.'
      :'A battery gives a steady current, so the field in the core does not change. After a brief flick at switch-on the output is <b>0 V</b>, whatever the turns.';
    return (q.ok?'<b>Right.</b> ':'<b>Not quite.</b> ')+why+' Press <b>New question</b> for another.';
  }
  function predictSvg(L,m,YM){
    if(!q) return '';
    var g='', ask=q.phase==='ask', over=q.phase==='done', y=L.Q.y, qx=L.Q.x, p, a;
    var ask1=(ac()?'How far will the needle swing?':'Where will the needle settle?')+' Click the voltmeter’s scale.';
    if(!over){ wrapLines('Question: '+ask1,L.Q.n).forEach(function(s,i){ g+=txt(qx,y,i?s:'<tspan fill="var(--accent)">Question:</tspan>'+s.slice(9),{fs:13,c:'var(--ink)',w:600}); y+=17; });
      if(q.pick!==null) g+=txt(qx,y+2,'Your prediction: '+num(Math.abs(q.pick),1)+' V',{fs:12.5}); }
    else wrapLines((q.ok?'✓ Right: ':'✗ Not quite: ')+(ac()?'the needle swings to '+num(q.ans,1)+' V each way.':'the needle settles at 0 V.')+(q.ok?'':' You chose '+num(Math.abs(q.pick),1)+' V.'),L.Q.n).forEach(function(s){ g+=txt(qx,y,s,{fs:13.5,c:q.ok?'var(--good)':'var(--bad)',w:600}); y+=17; });
    // the scale is one big thing to click; the arrow keys move the prediction one division at a time
    g+='<g class="pick" data-pick="dial" tabindex="'+(ask?0:-1)+'" role="slider" aria-label="Your prediction of the voltmeter reading, in volts: click the scale or use the arrow keys" aria-valuemin="0" aria-valuemax="'+YM+'" aria-valuenow="'+(q.pick===null?0:Math.abs(q.pick))+'">'+
      '<path class="ring" d="'+meterWedge(m,-m.span-5,m.span+5)+'" fill="none" stroke-width="4" stroke-linejoin="round"/><path d="'+meterWedge(m,-m.span-5,m.span+5)+'" fill="var(--panel)" fill-opacity="0.01"/>';
    function marker(v,col,dash){ var a=v/YM*m.span, p=meterPt(m,a,m.r-3), o=meterPt(m,a,m.r+4);
      return line(m.px,m.py,p[0].toFixed(1),p[1].toFixed(1),col,2.4,' stroke-linecap="round"'+(dash?' stroke-dasharray="5 4"':''))+'<circle cx="'+o[0].toFixed(1)+'" cy="'+o[1].toFixed(1)+'" r="4.5" fill="'+col+'" stroke="var(--panel)" stroke-width="1.5"/>'; }
    if(q.pick!==null) g+=marker(q.pick,over?(q.ok?'var(--good)':'var(--bad)'):'var(--cur)',1);
    if(over && !q.ok){ g+=marker(q.ans,'var(--good)',0); if(q.ans>0) g+=marker(-q.ans,'var(--good)',0); }

  }

  function record(to){ var dt=0.02; var nx=readings.length?readings[readings.length-1][0]+dt:0; while(nx<=to+1e-9){ readings.push([nx,vp(nx),vs(nx)]); nx+=dt; } }
  function rate(){ return pressed(slowBtn)?0.3:1; }
  function stop(){ running=false; cancelAnimationFrame(raf); }
  function frame(now){ if(!running) return; var dt=Math.min(0.05,(now-last)/1000)*rate(); last=now;
    t=Math.min(TMAX,t+dt); flowPh+=field(t)*dt*90; record(t); judge();
    if(done()) stop(); draw(); if(running) raf=requestAnimationFrame(frame); }
  function mark(v){ Array.prototype.forEach.call(ptsEl.children,function(x){ x.setAttribute('aria-pressed', String(x.dataset.v===v)); }); }
  function reset(){ stop(); t=0; flowPh=0; readings=[]; mark(''); if(q && q.phase!=='ask'){ q.phase='ask'; q.ok=null; } draw(); }
  function changed(){ if(predicting()) return; reset(); }
  function showControls(){ var pr=predicting();
    ['#tf-reset','#tf-exp','#tf-sliders','#tf-points-row','#tf-sup'].forEach(function(id){ $(id).hidden=pr; }); $('#tf-new').hidden=!pr; }
  function modeChanged(){ showControls();
    if(predicting()){ if(exp()) toggle(expBtn); score=[0,0]; deal(); }
    else { q=null; npIn.value=200; nsIn.value=400; vpIn.value=12; sup.pick('ac'); reset(); } }
  playBtn.addEventListener('click',function(){ mark(''); if(running){ stop(); draw(); return; }
    if(q){ if(q.phase==='ask'){ if(q.pick===null) return; q.phase='run'; } else if(done()) return; }
    else if(done()) reset();
    if(!readings.length) record(0); running=true; last=performance.now(); raf=requestAnimationFrame(frame); draw(); });
  ptsEl.addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b||b.disabled) return; reset(); t=(+b.dataset.v)/F+(+b.dataset.v===0?1/F:0); flowPh=40; record(t); mark(b.dataset.v); draw(); });
  // predicting: click the scale, or focus it and use the arrow keys
  svg.addEventListener('click',function(e){ if(!q || q.phase!=='ask' || !e.target.closest('.pick')) return; var p=svgPoint(svg,e), a=Math.atan2(p.x-MG.px, MG.py-p.y)/DEG; setPick(Math.max(-MG.span,Math.min(MG.span,a))/MG.span*yMax()); focusDial(); });
  svg.addEventListener('keydown',function(e){ if(!q || q.phase!=='ask' || !e.target.closest('.pick')) return; var k={ArrowLeft:-1,ArrowDown:-1,ArrowRight:1,ArrowUp:1}[e.key]; if(!k) return; e.preventDefault();
    setPick((q.pick===null?0:q.pick)+k*yMax()/10); focusDial(); });
  function focusDial(){ var d=svg.querySelector('.pick'); if(d && d.focus) d.focus(); }
  slowBtn.addEventListener('click',function(){ toggle(slowBtn); });
  expBtn.addEventListener('click',function(){ toggle(expBtn); reset(); });
  $('#tf-reset').addEventListener('click',reset);
  $('#tf-new').addEventListener('click',deal);
  watchEquals($('#tf-eq'));
  window.addEventListener('resize', function(){ if(!running) draw(); });
  showControls();
  reset();

})();
