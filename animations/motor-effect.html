<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motor Effect Animation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1f5; --bg-grid:rgba(29,41,61,0.055);
    --panel:#ffffff; --panel-border:#d7dce4;
    --ink:#182233; --ink-soft:#4c5668; --ink-faint:#8993a5;
    --accent:#d9720c; --accent-soft:#fdead2;
    --good:#15803d; --good-soft:#dcf5e3;
    --bad:#c0311a; --bad-soft:#fbe1db;
    --shadow:0 10px 26px -14px rgba(24,34,51,0.28);
    --topic:#0f7a86;   --topic-soft:#d6f1f3;
    --north:#d23b3b;   --north-soft:#fbdede;
    --south:#2f62d6;   --south-soft:#dde7fb;
    --copper:#b8651b;  --filing:#3b4352;
    --font-display:'Big Shoulders',system-ui,sans-serif;
    --font-body:'IBM Plex Sans',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12161f; --bg-grid:rgba(255,255,255,0.045);
      --panel:#1b212e; --panel-border:#2c3444;
      --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;
      --accent:#ff9a3d; --accent-soft:#3a2712;
      --good:#4ade80; --good-soft:#123321;
      --bad:#f27159; --bad-soft:#3a1712;
      --shadow:0 14px 30px -14px rgba(0,0,0,0.55);
      --topic:#4fd1dc; --topic-soft:#123236;
      --north:#ff7a7a; --north-soft:#3d1a1a;
      --south:#7da3ff; --south-soft:#1a2440;
      --copper:#f0a35e; --filing:#c3cad6;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12161f; --bg-grid:rgba(255,255,255,0.045);
    --panel:#1b212e; --panel-border:#2c3444;
    --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;
    --accent:#ff9a3d; --accent-soft:#3a2712;
    --good:#4ade80; --good-soft:#123321;
    --bad:#f27159; --bad-soft:#3a1712;
    --shadow:0 14px 30px -14px rgba(0,0,0,0.55);
    --topic:#4fd1dc; --topic-soft:#123236;
    --north:#ff7a7a; --north-soft:#3d1a1a;
    --south:#7da3ff; --south-soft:#1a2440;
    --copper:#f0a35e; --filing:#c3cad6;
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      linear-gradient(var(--bg-grid) 1px,transparent 1px) 0 0/100% 34px,
      linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px) 0 0/34px 100%,
      var(--bg);
    color:var(--ink); font-family:var(--font-body); font-size:14px; -webkit-font-smoothing:antialiased;
  }
  [hidden]{display:none!important;}
  button{font:inherit;color:inherit;}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;}

  .page{max-width:1400px;margin-inline:auto;padding-inline:20px;padding-block:12px 40px;}
  h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:0.2px;text-wrap:balance;margin:0;}
  p{margin:0;line-height:1.55;}

  .home-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-bottom:4px;font:600 13px var(--font-mono);color:var(--ink-soft);text-decoration:none;}
  .home-link:hover{color:var(--accent);}
  .page-head{margin-bottom:12px;}
  .eyebrow{font-family:var(--font-mono);font-size:11.5px;color:var(--accent);font-weight:600;margin-bottom:6px;}
  .page-head h1{font-size:clamp(28px,5vw,38px);color:var(--ink);}

  .card{background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;box-shadow:var(--shadow);}
  .btn{
    font-family:var(--font-body);font-weight:600;font-size:13.5px;color:var(--ink);
    background:var(--panel);border:1px solid var(--panel-border);border-radius:9px;
    padding:9px 15px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  }
  .btn:hover{border-color:var(--ink-faint);}
  .btn:disabled{opacity:.45;cursor:default;}
  .btn-primary{background:var(--ink);border-color:var(--ink);color:var(--bg);}
  .btn-primary:hover{opacity:.88;border-color:var(--ink);}
  .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);}
  .btn-group{display:flex;flex-wrap:wrap;gap:10px;}

  /* picture on the left; controls, readings and working on the right */
  .stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);gap:18px 24px;align-items:start;padding:18px;}
  @media (max-width:860px){ .stage{grid-template-columns:minmax(0,1fr);} }
  /* three pictures side by side: plan view, 3D view, Fleming's rule */
  .views{display:grid;grid-template-columns:260fr 380fr 300fr;gap:10px;align-items:start;}
  .views figure{margin:0;border:1px solid var(--panel-border);border-radius:10px;background:var(--panel);min-width:0;}
  .views figcaption{font:600 12px var(--font-mono);color:var(--ink-soft);padding:6px 10px 0;}
  .view{display:block;width:100%;height:auto;max-height:max(240px,calc(100vh - 320px));touch-action:pan-y;}
  .embed .view{max-height:420px;}
  @media (max-width:640px){ .views{grid-template-columns:1fr 1fr;} .views .v3d{grid-column:1/-1;grid-row:1;} }
  .under{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;margin-top:12px;}
  .under .btn-group{flex:0 1 auto;}
  .sliders{flex:1 1 300px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px 20px;min-width:0;}
  .view text{font-family:var(--font-mono);}
  .side{display:flex;flex-direction:column;gap:12px;min-width:0;}
  .lab{display:flex;justify-content:space-between;gap:8px;font:12.5px var(--font-mono);color:var(--ink-soft);margin-bottom:6px;}
  .lab output{color:var(--ink);font-weight:600;}
  input[type=range]{width:100%;accent-color:var(--topic);min-height:28px;}
  .seg{display:flex;flex-wrap:wrap;gap:6px;}
  .seg button{font:12.5px var(--font-mono);padding:8px 12px;min-height:44px;border:1px solid var(--panel-border);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer;}
  .seg button[aria-pressed="true"]{background:var(--topic);border-color:var(--topic);color:var(--panel);}
  .seg button:disabled{opacity:.45;cursor:default;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px;}
  .stat{border:1px solid var(--panel-border);border-radius:8px;padding:5px 8px;}
  .stat small{display:block;font:10.5px var(--font-mono);color:var(--ink-faint);}
  .stat strong{font:600 15px var(--font-mono);color:var(--ink);white-space:nowrap;}
  .stat.hi strong{color:var(--accent);}
  .note{font-size:15px;line-height:1.5;color:var(--ink);padding:10px 12px;border-radius:8px;background:var(--bg);min-height:4.6em;}
  .note b{color:var(--topic);}
  .hint{font-size:12.5px;color:var(--ink-soft);}

  details.working summary{cursor:pointer;font:600 13px var(--font-mono);color:var(--topic);min-height:44px;display:flex;align-items:center;}
  .eq{font-family:var(--font-mono);font-size:14px;line-height:1.75;padding:8px 12px;border-left:3px solid var(--topic);background:var(--topic-soft);border-radius:6px;color:var(--ink);}
  .eq b{color:var(--topic);}
  .eqg{display:grid;grid-template-columns:auto auto minmax(0,1fr);column-gap:.45em;row-gap:.2em;align-items:center}
  .eqg-l{justify-self:end;text-align:right}
  .eqg-m{justify-self:center}
  .eqg-r{justify-self:start;min-width:0}
  .eqg-full{grid-column:1/-1}
  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1.25;}
  .frac>span{padding:0 .25em;white-space:nowrap;}
  .frac>span:first-child{border-bottom:1.5px solid currentColor;}
  .dragme{cursor:grab;}
  .dragme:focus{outline:none;}
  .dragme:focus-visible .focus-ring{stroke:var(--accent);stroke-width:3;}
  @media (max-width:560px){ .stage{padding:12px;} .eq{font-size:12.5px;padding:6px 8px;} .note{font-size:14px;} }

  .embed body{background:transparent;}
  .embed .page{padding:0;max-width:none;display:flow-root;}
  .embed .home-link,.embed .page-head{display:none;}
  .embed .hint{display:none;}

  .fbar{display:block;height:10px;margin-top:5px;border-radius:5px;background:var(--bg);overflow:hidden;}
  .fbar>span{display:block;height:100%;background:var(--accent);transform-origin:left center;transition:transform .25s ease-out;}
  @media (prefers-reduced-motion: reduce){ .fbar>span{transition:none;} }
  /* Wire / Charged particles switch */
  .modebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:12px;}
  .modebar .lab{margin:0;}
  .ta{display:inline-block;font:600 10.5px var(--font-mono);padding:1px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);margin-left:6px;}
  .seg button[aria-pressed="true"] .ta{background:var(--panel);}
  .fixed .modebar{display:none;}
  #st-particles .view{max-height:max(240px,calc(100vh - 380px));}
  .embed #st-particles .view{max-height:460px;}
  #st-particles .under .sliders{flex-basis:100%;}
</style>
<script>
  // Visit counter (GoatCounter: no cookies, no personal data). Skipped when a page is embedded in a workout, so a visit counts once.
  // pwCountTab(tab, label): counts each workout tab once per visit as a GoatCounter event (path "page#tab"), skipped in frames the same way.
  (function(){
    var off = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var seen = {}, queue = [];
    function send(e){ try { window.goatcounter.count(e); } catch (x) {} }
    window.pwCountTab = function(tab, label){
      if (off || !tab || seen[tab]) return;
      seen[tab] = 1;
      var page = (location.pathname.split('/').pop() || 'index').replace(/\.html$/, '');
      var e = { path: page + '#' + tab, title: (label || tab) + ' \u00b7 ' + document.title, event: true };
      if (window.goatcounter && window.goatcounter.count) send(e); else queue.push(e);
    };
    if (off) return;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://gc.zgo.at/count.js';
    s.setAttribute('data-goatcounter', 'https://physics-workout.goatcounter.com/count');
    s.onload = function(){ var q = queue; queue = []; q.forEach(send); };
    document.head.appendChild(s);
  })();
</script>
</head>
<body>
<div class="page" id="page">
  <a class="home-link" href="igcse.html">&larr; IGCSE animations</a>
  <header class="page-head">
    <div class="eyebrow">Animations &middot; magnetism</div>
    <h1>The Motor Effect: Wires and Charged Particles</h1>
  </header>
  <div class="modebar"><span class="lab">Show</span><div class="seg" id="mode"><button type="button" data-v="wire" aria-pressed="true">A wire carrying a current</button><button type="button" data-v="particles" aria-pressed="false">Charged particles<span class="ta" title="Triple Award only">TA</span></button></div></div>
  <section class="card stage" id="st-wire">
    <div>
      <div class="views">
        <figure><figcaption>2D: plan view from above</figcaption><svg class="view" id="me-plan" viewBox="0 0 260 300" role="img" aria-label="Plan view: the wire runs up the page between the poles of a magnet"></svg></figure>
        <figure class="v3d"><figcaption>3D view</figcaption><svg class="view" id="me-3d" viewBox="0 0 380 300" role="img" aria-label="3D view of the wire between the poles of the magnet, showing which way it moves"></svg></figure>
        <figure><figcaption>Fleming&rsquo;s left-hand rule</figcaption><svg class="view" id="me-hand" viewBox="0 0 300 300" role="img" aria-label="Thumb, first finger and second finger at right angles: motion, field and current"></svg></figure>
      </div>
      <div class="under">
        <div class="btn-group">
          <button class="btn btn-primary" id="me-go" type="button">&#9654; Switch on</button>
          <button class="btn" id="me-comb" type="button" aria-pressed="false">Combined field</button>
          <button class="btn" id="me-reset" type="button">&#8634; Reset</button>
          <button class="btn" id="me-slow" type="button" aria-pressed="false">Slow motion</button>
        </div>
        <div class="sliders">
          <div><label class="lab" for="me-i">Current <output id="me-io"></output></label><input type="range" id="me-i" min="1" max="3" step="0.5" value="2"></div>
          <div><label class="lab" for="me-b">Magnet strength <output id="me-bo"></output></label><input type="range" id="me-b" min="1" max="3" step="1" value="2"></div>
        </div>
      </div>
    </div>
    <div class="side">
      <div>
        <div class="lab">Magnet</div>
        <div class="seg" id="me-mag"><button type="button" data-v="L" aria-pressed="true">N on the left</button><button type="button" data-v="R" aria-pressed="false">N on the right</button></div>
      </div>
      <div>
        <div class="lab">Current in the wire</div>
        <div class="seg" id="me-cur"><button type="button" data-v="up" aria-pressed="true">Up the page &uarr;</button><button type="button" data-v="down" aria-pressed="false">Down the page &darr;</button></div>
      </div>
      <div>
        <div class="lab">Your prediction</div>
        <div class="seg" id="me-pred"><button type="button" data-v="up" aria-pressed="false">Moves up &odot;</button><button type="button" data-v="down" aria-pressed="false">Moves down &otimes;</button><button type="button" data-v="none" aria-pressed="false">Doesn&rsquo;t move</button></div>
      </div>
      <p class="note" id="me-note" aria-live="polite"></p>
      <div class="stats">
        <div class="stat"><small>Current</small><strong id="me-si">0 A</strong></div>
        <div class="stat"><small>Force size</small><strong id="me-sf">&ndash;</strong></div>
        <div class="stat hi"><small>Motion</small><strong id="me-sd">&ndash;</strong></div>
      </div>
      <details class="working">
        <summary>Show Fleming&rsquo;s left-hand rule</summary>
        <div class="eq" id="me-eq"></div>
      </details>
    </div>
  </section>
  <section class="card stage" id="st-particles" hidden>
    <div>
      <svg class="view" id="cp-svg" viewBox="0 0 640 320" role="img" aria-label="A beam of charged particles fired into a magnetic field"></svg>
      <div class="under">
        <div class="btn-group">
          <button class="btn btn-primary" id="cp-play" type="button">&#9654; Fire the beam</button>
          <button class="btn" id="cp-reset" type="button">&#8634; Reset</button>
          <button class="btn" id="cp-slow" type="button" aria-pressed="false">Slow motion</button>
        </div>
        <div class="seg" id="cp-view" role="group" aria-label="View"><button type="button" data-v="2d" aria-pressed="true">2D: from the front</button><button type="button" data-v="3d" aria-pressed="false">3D</button></div>
        <div class="sliders">
          <div><label class="lab" for="cp-b"><span>Field strength</span> <output id="cp-bo"></output></label><input type="range" id="cp-b" min="1" max="3" step="1" value="2"></div>
          <div><label class="lab" for="cp-v"><span>Speed of the particles</span> <output id="cp-vo"></output></label><input type="range" id="cp-v" min="1" max="3" step="1" value="2"></div>
        </div>
      </div>
    </div>
    <div class="side">
      <div>
        <div class="lab">Particles</div>
        <div class="seg" id="cp-q"><button type="button" data-v="-1" aria-pressed="true">Electrons (&minus;)</button><button type="button" data-v="1" aria-pressed="false">Positive ions (+)</button></div>
      </div>
      <div>
        <div class="lab">Magnetic field</div>
        <div class="seg" id="cp-fd"><button type="button" data-v="in" aria-pressed="true">Into the page</button><button type="button" data-v="out" aria-pressed="false">Out of the page</button><button type="button" data-v="along" aria-pressed="false">Along the beam</button></div>
      </div>
      <p class="note" id="cp-note" aria-live="polite"></p>
      <div class="stats">
        <div class="stat"><small>Force on particles</small><strong id="cp-sf">&ndash;</strong></div>
        <div class="stat"><small>Path</small><strong id="cp-sp">&ndash;</strong></div>
        <div class="stat hi"><small>Bends</small><strong id="cp-sb">&ndash;</strong></div>
      </div>
      <details class="working">
        <summary>Show the left-hand rule</summary>
        <div class="eq" id="cp-eq"></div>
      </details>
    </div>
  </section>

</div>
<script>
(function(){
  // motor-effect.html is the one copy of this animation (the wire and, since 25 Oct 2026, charged particles).
  // With ?embed the page drops its heading so a workout tab can show it in a frame, and tells that page its height.
  var EMBED = /[?&]embed\b/.test(location.search);
  if(EMBED){
    document.documentElement.classList.add('embed');
    Array.prototype.forEach.call(document.querySelectorAll('details.working'), function(wk){ wk.open = true; });
    var page = document.getElementById('page');
    var sendHeight = function(){ try{ parent.postMessage({animHeight: Math.ceil(page.getBoundingClientRect().height)}, '*'); }catch(e){} };
    if(window.ResizeObserver) new ResizeObserver(sendHeight).observe(page);
    window.addEventListener('load', sendHeight);
  }
  function $(sel){ return document.querySelector(sel); }
  function num(n, dp){   // round, drop trailing zeros, group thousands with a space from 10 000
    var f = Math.pow(10, dp||0), r = Math.round(n*f)/f, t = String(Math.abs(r));
    if(Math.abs(r)>=10000) t = t.replace(/\B(?=(\d{3})+(?!\d))/g,' ');
    return (r<0?'−':'')+t;
  }
  function FR(t){
    return String(t).replace(/(\d) (?=\d{3}\b)/g,'$1 ')
      .replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g,'<span class="frac"><span>$1</span><span>$2</span></span>');
  }
  function arrowHead(id, col){ return '<marker id="'+id+'" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="'+col+'"/></marker>'; }
  function alignEquals(el){
    if(el.querySelector('.eqg')) return;
    var rows = el.innerHTML.split(/<br\s*\/?>/i).map(function(line){
      var i = line.indexOf(' = ');
      if(i<0) return '<span class="eqg-full">'+line+'</span>';
      return '<span class="eqg-l">'+line.slice(0,i)+'</span><span class="eqg-m">=</span><span class="eqg-r">'+line.slice(i+3)+'</span>';
    });
    el.innerHTML = '<div class="eqg">'+rows.join('')+'</div>';
  }
  function watchEquals(el){ if(!el) return; alignEquals(el); new MutationObserver(function(){ alignEquals(el); }).observe(el, {childList:true}); }
  function pressed(b){ return b.getAttribute('aria-pressed')==='true'; }
  function toggle(b){ b.setAttribute('aria-pressed', String(!pressed(b))); }
  // a row of choice buttons that behaves like a radio group
  function segGroup(el, onPick){
    el.addEventListener('click', function(e){ var b=e.target.closest('button'); if(!b||b.disabled) return; pick(b.dataset.v); onPick(b.dataset.v); });
    function pick(v){ Array.prototype.forEach.call(el.querySelectorAll('button'), function(x){ x.setAttribute('aria-pressed', String(x.dataset.v===v)); }); }
    function value(){ var b=el.querySelector('[aria-pressed="true"]'); return b?b.dataset.v:null; }
    return {pick:pick, value:value};
  }
  // a pole of a magnet: coloured block with its letter
  function poleRect(x,y,w,h,pole,fs){
    var c = pole==='N' ? 'north' : 'south';
    return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="var(--'+c+'-soft)" stroke="var(--'+c+')" stroke-width="2"/>'+
      '<text x="'+(x+w/2)+'" y="'+(y+h/2+(fs||16)*0.36)+'" text-anchor="middle" font-size="'+(fs||16)+'" font-weight="600" fill="var(--'+c+')">'+pole+'</text>';
  }
  // a wire seen end-on: dot = current out of the page, cross = into the page
  function wireEnd(x,y,r,dir,col){
    var g='<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="var(--panel)" stroke="'+(col||'var(--copper)')+'" stroke-width="3"/>';
    if(dir>0) g+='<circle cx="'+x+'" cy="'+y+'" r="'+(r*0.28)+'" fill="var(--ink)"/>';
    else if(dir<0){ var d=r*0.55; g+='<path d="M'+(x-d)+','+(y-d)+' L'+(x+d)+','+(y+d)+' M'+(x+d)+','+(y-d)+' L'+(x-d)+','+(y+d)+'" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>'; }
    return g;
  }
  function line(x1,y1,x2,y2,col,w,extra){ return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+col+'" stroke-width="'+(w||2)+'"'+(extra||'')+'/>'; }
  function txt(x,y,s,o){ o=o||{}; return '<text x="'+x+'" y="'+y+'"'+(o.a?' text-anchor="'+o.a+'"':'')+' font-size="'+(o.fs||11.5)+'" fill="'+(o.c||'var(--ink-soft)')+'"'+(o.w?' font-weight="'+o.w+'"':'')+'>'+s+'</text>'; }
  // pointer position in SVG user units
  function svgPoint(svg, e){ var r=svg.getBoundingClientRect(), vb=svg.viewBox.baseVal; return {x:vb.x+(e.clientX-r.left)/r.width*vb.width, y:vb.y+(e.clientY-r.top)/r.height*vb.height}; }

  var plan=$('#me-plan'), v3=$('#me-3d'), hand=$('#me-hand'), goBtn=$('#me-go'), combBtn=$('#me-comb'), slowBtn=$('#me-slow'), iIn=$('#me-i'), bIn=$('#me-b');
  // world axes: X to the right (across the gap), Y away from you (up the page in the plan view), Z up
  var GAP=52, POLE=62, HA=50, HZ=50, WL=125, DMAX=40, t=0, d=0, on=false, running=false, finished=false, raf=0, last=0;
  var mag=segGroup($('#me-mag'), changed), cur=segGroup($('#me-cur'), changed), pred=segGroup($('#me-pred'), function(){ draw(); });
  iIn.addEventListener('input', changed); bIn.addEventListener('input', changed);

  function bdir(){ return mag.value()==='L' ? 1 : -1; }             // field points from N to S: +1 = to the right
  function cdir(){ return cur.value()==='up' ? 1 : -1; }            // +1 = up the page in the plan (away from you in 3D)
  function I(){ return +iIn.value; } function B(){ return +bIn.value; }
  function fup(){ return -cdir()*bdir(); }                          // F = I L x B: y x x = -z, so current away in a rightward field is pushed down
  function fsize(){ return I()*B(); }
  var STR=['','weak','medium','strong'];

  // one camera for the 3D view and the hand: a true (orthographic) view from the front left and above
  var TH=28*Math.PI/180, PH=26*Math.PI/180, CT=Math.cos(TH), ST=Math.sin(TH), CP=Math.cos(PH), SP=Math.sin(PH);
  function proj(cx,cy,s){ return function(X,Y,Z){ var dep=-X*ST+Y*CT; return [cx+s*(X*CT+Y*ST), cy+s*(-Z*CP-dep*SP)]; }; }
  function pts(P,list){ return list.map(function(q){ var p=P(q[0],q[1],q[2]); return p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' '); }
  function poly(P,list,fill,stroke,extra){ return '<polygon points="'+pts(P,list)+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="1.6" stroke-linejoin="round"'+(extra||'')+'/>'; }
  function seg3(P,a,b,col,w,extra){ var p=P(a[0],a[1],a[2]), q=P(b[0],b[1],b[2]); return line(p[0].toFixed(1),p[1].toFixed(1),q[0].toFixed(1),q[1].toFixed(1),col,w,extra); }
  // a pole block: visible faces are the top, the front (towards you) and the right-hand side
  function block(P,x0,x1,pole,op){
    var c=pole==='N'?'north':'south', f='var(--'+c+'-soft)', s='var(--'+c+')', o=op?' fill-opacity="'+op+'"':'';
    var g=poly(P,[[x0,-HA,HZ],[x1,-HA,HZ],[x1,HA,HZ],[x0,HA,HZ]],f,s,o)+
          poly(P,[[x0,-HA,-HZ],[x1,-HA,-HZ],[x1,-HA,HZ],[x0,-HA,HZ]],f,s,o)+
          poly(P,[[x1,-HA,-HZ],[x1,HA,-HZ],[x1,HA,HZ],[x1,-HA,HZ]],f,s,(o||'')+' style="filter:brightness(0.93)"');
    var tp=P((x0+x1)/2,0,HZ), fp=P((x0+x1)/2,-HA,0);
    g+=txt(tp[0].toFixed(1),(tp[1]+6).toFixed(1),pole,{a:'middle',c:s,w:600,fs:17})+txt(fp[0].toFixed(1),(fp[1]+7).toFixed(1),pole,{a:'middle',c:s,w:600,fs:20});
    return g;
  }

  // total field in the front face (X-Z plane), for the combined-field picture
  function field(X,Z){
    var bx=bdir()*B()*0.9, bz=0;
    if(on){ var rx=X, rz=Z-d, r2=rx*rx+rz*rz+30, k=I()*32*cdir(); bx+=k*rz/r2; bz+=-k*rx/r2; }
    return [bx,bz];
  }
  function trace(x,z){
    var p=[[x,-HA,z]];
    for(var i=0;i<240;i++){
      var b=field(x,z), l=Math.hypot(b[0],b[1]); if(l<1e-6) break;
      x+=b[0]/l*1.6; z+=b[1]/l*1.6; p.push([x,-HA,z]);
      if(x<-GAP||x>GAP||z<-HZ||z>HZ) break;
    }
    return p;
  }

  function drawPlan(){
    var g='<defs>'+arrowHead('me-pa','var(--topic)')+arrowHead('me-pc','var(--copper)')+'</defs>';
    var cx=130, cy=150, nl=mag.value()==='L';
    g+=poleRect(cx-GAP-POLE,cy-HA*1.1,POLE,HA*2.2,nl?'N':'S',22)+poleRect(cx+GAP,cy-HA*1.1,POLE,HA*2.2,nl?'S':'N',22);
    for(var y=cy-44;y<=cy+44;y+=22){ var a=bdir()>0?[cx-GAP,cx+GAP]:[cx+GAP,cx-GAP];
      g+=line(a[0],y,a[1],y,'var(--topic)',1.5);
      g+=line(a[0]+(a[1]-a[0])*0.16,y,a[0]+(a[1]-a[0])*0.22,y,'var(--topic)',2,' marker-end="url(#me-pa)"');
      g+=line(a[0]+(a[1]-a[0])*0.80,y,a[0]+(a[1]-a[0])*0.86,y,'var(--topic)',2,' marker-end="url(#me-pa)"');
    }
    // the wire runs up the page; it looks a little thicker as it rises towards you
    var w=7+5*d/DMAX;
    g+=line(cx,20,cx,284,'var(--ink)',w+3,' stroke-linecap="round"')+line(cx,20,cx,284,'var(--copper)',w,' stroke-linecap="round"');
    if(on){ [52,248].forEach(function(y){ g+=line(cx-20,y+cdir()*12,cx-20,y-cdir()*12,'var(--copper)',2.5,' marker-end="url(#me-pc)"'); });
      g+=txt(cx-26,40,'I',{a:'end',c:'var(--copper)',w:600,fs:13});
      var r=8+fsize()*0.9;
      [cy-26,cy+26].forEach(function(y){ g+=wireEnd(cx+24,y,r,fup(),'var(--accent)'); });
      g+=txt(cx+24,cy+4,'F',{a:'middle',c:'var(--accent)',w:600,fs:12});
      g+=txt(cx,296,fup()>0?'force out of the page ⊙':'force into the page ⊗',{a:'middle',c:'var(--accent)',w:600,fs:11});
    } else g+=txt(cx,296,'wire runs up the page',{a:'middle',fs:11});
    plan.innerHTML=g;
  }

  function draw3d(){
    var P=proj(190,152,1.2);
    var g='<defs>'+arrowHead('me-ta','var(--topic)')+arrowHead('me-tc','var(--copper)')+arrowHead('me-tf','var(--accent)')+'</defs>';
    var nl=mag.value()==='L', comb=pressed(combBtn)&&on, x0=bdir()>0?-GAP:GAP;
    g+=block(P,-GAP-POLE,-GAP,nl?'N':'S');
    // the magnet's field lines across the gap (the back rows first)
    function fieldRow(y,z){ var a=[x0,y,z], b=[-x0,y,z], m1=[x0*0.45,y,z], m2=[x0*0.25,y,z];
      return seg3(P,a,b,'var(--topic)',1.3,' opacity="0.75"')+seg3(P,m1,m2,'var(--topic)',2,' marker-end="url(#me-ta)"'); }
    if(!comb){ [HA*0.6,0].forEach(function(y){ [-30,0,30].forEach(function(z){ g+=fieldRow(y,z); }); }); }
    // the wire, with arrows showing the current
    var wb=[0,WL,d], wf=[0,-WL,d];
    g+=seg3(P,wb,wf,'var(--ink)',10,' stroke-linecap="round"')+seg3(P,wb,wf,'var(--copper)',7,' stroke-linecap="round"');
    if(on){ [-95,92].forEach(function(y){ g+=seg3(P,[0,y-cdir()*12,d+9],[0,y+cdir()*12,d+9],'var(--copper)',2.5,' marker-end="url(#me-tc)"'); });
      var ti=P(0,-102,d+16); g+=txt(ti[0].toFixed(1),ti[1].toFixed(1),'I',{a:'end',c:'var(--copper)',w:600,fs:13}); }
    if(comb){
      g+='<polygon points="'+pts(P,[[-GAP,-HA,-HZ],[GAP,-HA,-HZ],[GAP,-HA,HZ],[-GAP,-HA,HZ]])+'" fill="var(--topic-soft)" fill-opacity="0.35" stroke="var(--topic)" stroke-dasharray="3 4" stroke-width="1"/>';
      for(var z=-44;z<=44;z+=8){ g+='<polyline points="'+pts(P,trace(x0*0.98,z))+'" fill="none" stroke="var(--topic)" stroke-width="1.4"/>'; }
    } else {
      [-HA*0.6].forEach(function(y){ [-30,0,30].forEach(function(z){ g+=fieldRow(y,z); }); });
      if(on){ for(var r=16;r<=34;r+=9){ var c=[]; for(var k=0;k<=48;k++){ var a=k/48*2*Math.PI; c.push([r*Math.cos(a),-HA,d+r*Math.sin(a)]); }
        g+='<polyline points="'+pts(P,c)+'" fill="none" stroke="var(--copper)" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.85"/>';
        // arrow on the wire's own field, from the right-hand grip rule
        g+=seg3(P,[-3*cdir(),-HA,d+r],[3*cdir(),-HA,d+r],'var(--copper)',1.6,' marker-end="url(#me-tc)"'); } }
    }
    g+=block(P,GAP,GAP+POLE,nl?'S':'N',0.82);
    if(on){ var L=16+fsize()*4.5, a0=P(0,-HA-20,d), a1=P(0,-HA-20,d+fup()*L);
      g+=line(a0[0].toFixed(1),a0[1].toFixed(1),a1[0].toFixed(1),a1[1].toFixed(1),'var(--accent)',4.5,' marker-end="url(#me-tf)"');
      g+=txt((a1[0]+8).toFixed(1),(a1[1]+(fup()>0?8:4)).toFixed(1),'force',{a:'start',c:'var(--accent)',w:600}); }
    v3.innerHTML=g;
  }

  function drawHand(){
    var P=proj(150,165,1.0), Lx=88, HW=300;
    var g='<defs>'+arrowHead('me-ha','var(--topic)')+arrowHead('me-hc','var(--copper)')+arrowHead('me-hf','var(--accent)')+'</defs>';
    // nothing to show until the current is switched on, so the rule doesn't give the answer away
    if(!on){ hand.innerHTML=txt(150,150,'Switch on to see',{a:'middle',c:'var(--ink-faint)',fs:12})+txt(150,168,'the left-hand rule',{a:'middle',c:'var(--ink-faint)',fs:12}); return; }
    var bx=bdir(), cy=cdir(), fz=fup();
    // a faint floor and wall so the three directions read as 3D, with right-angle marks
    g+=poly(P,[[0,0,0],[bx*Lx,0,0],[bx*Lx,cy*Lx,0],[0,cy*Lx,0]],'var(--topic-soft)','var(--panel-border)',' fill-opacity="0.55"');
    if(on) g+=poly(P,[[0,0,0],[bx*Lx*0.55,0,0],[bx*Lx*0.55,0,fz*Lx*0.55],[0,0,fz*Lx*0.55]],'var(--accent-soft)','var(--panel-border)',' fill-opacity="0.6"');
    var q=12; g+='<polyline points="'+pts(P,[[bx*q,0,0],[bx*q,cy*q,0],[0,cy*q,0]])+'" fill="none" stroke="var(--ink-soft)" stroke-width="1.3"/>';
    if(on) g+='<polyline points="'+pts(P,[[bx*q,0,0],[bx*q,0,fz*q],[0,0,fz*q]])+'" fill="none" stroke="var(--ink-soft)" stroke-width="1.3"/>';
    function ax(v,col,mk,l1,l2){
      var o=P(0,0,0), e=P(v[0],v[1],v[2]), dx=e[0]-o[0], dy=e[1]-o[1], n=Math.hypot(dx,dy)||1, lx=e[0]+dx/n*14, ly=e[1]+dy/n*14;
      var an=dx>8?'start':(dx<-8?'end':'middle'), y0=ly+(dy>8?8:(dy<-8?-12:0)), tw=Math.max(l1.length*6.4,l2.length*7.8);
      if(an==='start') lx=Math.min(lx,HW-4-tw); else if(an==='end') lx=Math.max(lx,4+tw); else lx=Math.min(Math.max(lx,4+tw/2),HW-4-tw/2);
      return line(o[0].toFixed(1),o[1].toFixed(1),e[0].toFixed(1),e[1].toFixed(1),col,5,' stroke-linecap="round" marker-end="url(#'+mk+')"')+
        txt(lx.toFixed(1),y0.toFixed(1),l1,{a:an,c:col,fs:10.5})+txt(lx.toFixed(1),(y0+13).toFixed(1),l2,{a:an,c:col,fs:12.5,w:600});
    }
    g+=ax([bx*Lx,0,0],'var(--topic)','me-ha','First finger','Field');
    g+=ax([0,cy*Lx*1.35,0],on?'var(--copper)':'var(--ink-faint)','me-hc','Second finger','Current');
    if(on) g+=ax([0,0,fz*Lx],'var(--accent)','me-hf','Thumb','Motion');
    else { var tp=P(0,0,Lx); g+=txt(tp[0].toFixed(1),(tp[1]-6).toFixed(1),'Thumb: Motion',{a:'middle',c:'var(--ink-faint)',fs:11})+txt(tp[0].toFixed(1),(tp[1]+8).toFixed(1),'(switch on)',{a:'middle',c:'var(--ink-faint)',fs:10.5}); }
    g+='<circle cx="150" cy="165" r="4" fill="var(--ink-soft)"/>';
    hand.innerHTML=g;
  }

  function draw(){
    drawPlan(); draw3d(); drawHand();
    $('#me-io').textContent=num(I(),1)+' A'; $('#me-bo').textContent=STR[B()];
    $('#me-si').textContent=on?num(I(),1)+' A':'0 A';
    $('#me-sf').innerHTML=on?'<span class="fbar"><span style="transform:scaleX('+(fsize()/9).toFixed(3)+')"></span></span>':'–';
    $('#me-sd').textContent=on?(fup()>0?'up':'down'):'–';
    $('#me-eq').innerHTML='First finger (Field): N to S, to the '+(bdir()>0?'right':'left')+'<br>Second finger (Current): '+(cdir()>0?'up the page, away from you':'down the page, towards you')+'<br>Thumb (Motion): <b>'+(fup()>0?'up, out of the page':'down, into the page')+'</b>';
    var p=pred.value(), n;
    if(!on) n='Choose the magnet and the current, predict which way the wire will move, then <b>switch on</b>.';
    else if(running) n=pressed(combBtn)?'The wire’s own circular field adds to the magnet’s field on one side and cancels it on the other. The wire is pushed out of the stronger field towards the weaker one.':'The current makes a magnetic field around the wire. This interacts with the magnet’s field, so there is a force on the wire.';
    else { var dir=fup()>0?'up':'down';
      n='The wire moved <b>'+dir+'</b> ('+(fup()>0?'out of':'into')+' the page in the plan view). '+(p? (p===dir?'Your prediction was right. ':(p==='none'?'It does move: a current at right angles to a magnetic field always feels a force. ':'You predicted '+p+': check with Fleming’s left-hand rule. ')) : '')+'Reverse the current or the magnet and the force reverses; a bigger current or a stronger magnet gives a bigger force.'; }
    $('#me-note').innerHTML=n;
    goBtn.disabled=running||finished;
    Array.prototype.forEach.call($('#me-pred').children,function(b){ b.disabled=on; });
  }
  function rate(){ return pressed(slowBtn)?0.3:1; }
  function stop(){ running=false; cancelAnimationFrame(raf); }
  function frame(now){ if(!running) return; t+=Math.min(0.05,(now-last)/1000)*rate(); last=now;
    var A=fsize()*24;                              // bigger force, bigger acceleration
    d=Math.min(DMAX,0.5*A*t*t)*fup();
    if(Math.abs(d)>=DMAX){ stop(); finished=true; }
    draw(); if(running) raf=requestAnimationFrame(frame); }
  function go(){ if(running||finished) return; on=true; t=0; d=0; running=true; last=performance.now(); raf=requestAnimationFrame(frame); draw(); }
  function reset(){ stop(); on=false; finished=false; t=0; d=0; draw(); }
  function changed(){ reset(); }
  goBtn.addEventListener('click',go);
  combBtn.addEventListener('click',function(){ toggle(combBtn); draw(); });
  slowBtn.addEventListener('click',function(){ toggle(slowBtn); });
  $('#me-reset').addEventListener('click',reset);
  watchEquals($('#me-eq'));
  reset();

})();
</script>
<script>
// Charged particles (6.11P): the second picture on this page.
(function(){
  function $(sel){ return document.querySelector(sel); }
  function num(n, dp){   // round, drop trailing zeros, group thousands with a space from 10 000
    var f = Math.pow(10, dp||0), r = Math.round(n*f)/f, t = String(Math.abs(r));
    if(Math.abs(r)>=10000) t = t.replace(/\B(?=(\d{3})+(?!\d))/g,' ');
    return (r<0?'−':'')+t;
  }
  function FR(t){
    return String(t).replace(/(\d) (?=\d{3}\b)/g,'$1 ')
      .replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g,'<span class="frac"><span>$1</span><span>$2</span></span>');
  }
  function arrowHead(id, col){ return '<marker id="'+id+'" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="'+col+'"/></marker>'; }
  function alignEquals(el){
    if(el.querySelector('.eqg')) return;
    var rows = el.innerHTML.split(/<br\s*\/?>/i).map(function(line){
      var i = line.indexOf(' = ');
      if(i<0) return '<span class="eqg-full">'+line+'</span>';
      return '<span class="eqg-l">'+line.slice(0,i)+'</span><span class="eqg-m">=</span><span class="eqg-r">'+line.slice(i+3)+'</span>';
    });
    el.innerHTML = '<div class="eqg">'+rows.join('')+'</div>';
  }
  function watchEquals(el){ if(!el) return; alignEquals(el); new MutationObserver(function(){ alignEquals(el); }).observe(el, {childList:true}); }
  function pressed(b){ return b.getAttribute('aria-pressed')==='true'; }
  function toggle(b){ b.setAttribute('aria-pressed', String(!pressed(b))); }
  // a row of choice buttons that behaves like a radio group
  function segGroup(el, onPick){
    el.addEventListener('click', function(e){ var b=e.target.closest('button'); if(!b||b.disabled) return; pick(b.dataset.v); onPick(b.dataset.v); });
    function pick(v){ Array.prototype.forEach.call(el.querySelectorAll('button'), function(x){ x.setAttribute('aria-pressed', String(x.dataset.v===v)); }); }
    function value(){ var b=el.querySelector('[aria-pressed="true"]'); return b?b.dataset.v:null; }
    return {pick:pick, value:value};
  }
  // a pole of a magnet: coloured block with its letter
  function poleRect(x,y,w,h,pole,fs){
    var c = pole==='N' ? 'north' : 'south';
    return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="var(--'+c+'-soft)" stroke="var(--'+c+')" stroke-width="2"/>'+
      '<text x="'+(x+w/2)+'" y="'+(y+h/2+(fs||16)*0.36)+'" text-anchor="middle" font-size="'+(fs||16)+'" font-weight="600" fill="var(--'+c+')">'+pole+'</text>';
  }
  // a wire seen end-on: dot = current out of the page, cross = into the page
  function wireEnd(x,y,r,dir,col){
    var g='<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="var(--panel)" stroke="'+(col||'var(--copper)')+'" stroke-width="3"/>';
    if(dir>0) g+='<circle cx="'+x+'" cy="'+y+'" r="'+(r*0.28)+'" fill="var(--ink)"/>';
    else if(dir<0){ var d=r*0.55; g+='<path d="M'+(x-d)+','+(y-d)+' L'+(x+d)+','+(y+d)+' M'+(x+d)+','+(y-d)+' L'+(x-d)+','+(y+d)+'" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>'; }
    return g;
  }
  function line(x1,y1,x2,y2,col,w,extra){ return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+col+'" stroke-width="'+(w||2)+'"'+(extra||'')+'/>'; }
  function txt(x,y,s,o){ o=o||{}; return '<text x="'+x+'" y="'+y+'"'+(o.a?' text-anchor="'+o.a+'"':'')+' font-size="'+(o.fs||11.5)+'" fill="'+(o.c||'var(--ink-soft)')+'"'+(o.w?' font-weight="'+o.w+'"':'')+'>'+s+'</text>'; }
  // pointer position in SVG user units
  function svgPoint(svg, e){ var r=svg.getBoundingClientRect(), vb=svg.viewBox.baseVal; return {x:vb.x+(e.clientX-r.left)/r.width*vb.width, y:vb.y+(e.clientY-r.top)/r.height*vb.height}; }

  var svg=$('#cp-svg'), playBtn=$('#cp-play'), slowBtn=$('#cp-slow'), bIn=$('#cp-b'), vIn=$('#cp-v');
  var X0=140, Y0=160, RX=[140,626], RY=[18,302], TMAX=6, EMIT=3.6, GAP=0.12, t=0, running=false, raf=0, last=0, path=[];
  var qG=segGroup($('#cp-q'), changed), fG=segGroup($('#cp-fd'), changed), vwG=segGroup($('#cp-view'), function(){ draw(); });
  [bIn,vIn].forEach(function(x){ x.addEventListener('input', changed); });
  var LV=['','weak','medium','strong'], SP=['','slow','medium','fast'];

  // F = qvB at right angles to the motion, so inside the field each particle moves on a circle.
  // Radius grows with speed and shrinks with field strength (r = mv/qB, both kinds drawn with the same mass here).
  // Which way: electrons moving right are a conventional current to the LEFT. With the field into the page the
  // left-hand rule gives a force DOWN the page for electrons and UP for positive ions; out of the page reverses both.
  function q(){ return +qG.value(); } function fd(){ return fG.value(); }
  function speed(){ return 70+45*(+vIn.value); }                 // px/s on screen
  function radius(){ return 70*(+vIn.value)/(+bIn.value)+18; }
  function bendDown(){ var d=(q()<0?1:-1); return fd()==='out'?-d:d; } // +1: curves down the page
  function inField(x,y){ return x>=RX[0]&&x<=RX[1]&&y>=RY[0]&&y<=RY[1]; }
  function build(){
    path=[]; var x=30, y=Y0, ang=0, ds=2, r=radius(), s=bendDown();
    for(var k=0;k<1400;k++){
      path.push([x,y,ang]);
      if(fd()!=='along' && inField(x,y)) ang+=s*ds/r;
      x+=ds*Math.cos(ang); y+=ds*Math.sin(ang);
      if(x<-10||x>650||y<-10||y>330) break;
    }
  }
  function at(d){ var i=Math.floor(d/2); return i<path.length?path[i]:null; }
  function done(){ return t>=TMAX-1e-9; }

  // 3D: the same beam seen from the front left and above. The page becomes an upright plane:
  // X to the right (x on the page), Y away from you (into the page), Z up (y on the page, upside down)
  var TH=22*Math.PI/180, PH=18*Math.PI/180, CT=Math.cos(TH), ST=Math.sin(TH), CP=Math.cos(PH), SP=Math.sin(PH), S3=0.82, DP=50;
  function P(X,Y,Z){ var dep=-X*ST+Y*CT; return [300+S3*(X*CT+Y*ST), 164+S3*(-Z*CP-dep*SP)]; }
  function Pp(x,y,Y){ return P(x-333,Y||0,160-y); }                // a point on the page, or Y in front of / behind it
  function ps(list){ return list.map(function(q){ return q[0].toFixed(1)+','+q[1].toFixed(1); }).join(' '); }
  function seg(a,b,col,w,extra){ return line(a[0].toFixed(1),a[1].toFixed(1),b[0].toFixed(1),b[1].toFixed(1),col,w,extra); }
  function plate(Y,pole,op){   // a magnet pole face parallel to the page, covering the field region
    var c=pole==='N'?'north':'south', m=Pp(RX[1]-24,RY[0]+30,Y);
    return '<polygon points="'+ps([Pp(RX[0],RY[0],Y),Pp(RX[1],RY[0],Y),Pp(RX[1],RY[1],Y),Pp(RX[0],RY[1],Y)])+'" fill="var(--'+c+'-soft)" fill-opacity="'+op+'" stroke="var(--'+c+')" stroke-width="2"/>'+
      txt(m[0].toFixed(1),m[1].toFixed(1),pole,{a:'middle',fs:18,c:'var(--'+c+')',w:600});
  }
  function draw3d(){
    var g='<defs>'+arrowHead('cp-fa3','var(--accent)')+arrowHead('cp-va3','var(--ink)')+arrowHead('cp-ba3','var(--topic)')+'</defs>';
    var str=+bIn.value, step=(str===1?48:str===2?36:27)*1.5, inn=fd()==='in', along=fd()==='along';
    // the back pole (field goes from N to S)
    if(!along) g+=plate(DP,inn?'S':'N',0.9);
    // field lines: straight through the page from the front pole to the back one, or along the beam
    if(along){ [-40,0,40].forEach(function(Y){ for(var y=RY[0]+30;y<RY[1];y+=step) g+=seg(Pp(RX[0]+8,y,Y),Pp(RX[1]-10,y,Y),'var(--topic)',1.3,' opacity="0.6" marker-end="url(#cp-ba3)"'); }); }
    else for(var x=RX[0]+step/2;x<RX[1];x+=step) for(var y2=RY[0]+step/2;y2<RY[1];y2+=step)
      g+=seg(Pp(x,y2,inn?-DP:DP),Pp(x,y2,inn?DP:-DP),'var(--topic)',1.3,' opacity="0.55" marker-end="url(#cp-ba3)"');
    // the page the beam travels in
    g+='<polygon points="'+ps([Pp(RX[0],RY[0]),Pp(RX[1],RY[0]),Pp(RX[1],RY[1]),Pp(RX[0],RY[1])])+'" fill="var(--topic-soft)" fill-opacity="0.35" stroke="var(--topic)" stroke-dasharray="5 4"/>';
    // the source
    g+='<polygon points="'+ps([Pp(4,146),Pp(48,146),Pp(48,174),Pp(4,174)])+'" fill="var(--panel)" stroke="var(--ink-soft)" stroke-width="2"/>';
    var sl=Pp(26,192); g+=txt(sl[0].toFixed(1),sl[1].toFixed(1),'source',{a:'middle',fs:10.5});
    var col=q()<0?'var(--south)':'var(--north)', v=speed(), head=Math.min(t,EMIT+20)*v, trail=[];
    if(t>0){ for(var i=0;i<path.length && i*2<=head;i+=2) trail.push(Pp(path[i][0],path[i][1])); }
    if(trail.length>1) g+='<polyline points="'+ps(trail)+'" fill="none" stroke="'+col+'" stroke-width="2" opacity="0.3"/>';
    var lead=null;
    for(var e=0;e*GAP<=Math.min(t,EMIT);e++){ var p=at((t-e*GAP)*v); if(!p) continue; if(!lead) lead=p; var o=Pp(p[0],p[1]);
      g+='<circle cx="'+o[0].toFixed(1)+'" cy="'+o[1].toFixed(1)+'" r="4.5" fill="'+col+'"/>'+txt(o[0].toFixed(1),(o[1]+3.2).toFixed(1),q()<0?'−':'+',{a:'middle',fs:8.5,c:'var(--panel)',w:600}); }
    if(lead && inField(lead[0],lead[1]) && running){
      var c=Math.cos(lead[2]), s=Math.sin(lead[2]), o0=Pp(lead[0],lead[1]);
      g+=seg(o0,Pp(lead[0]+36*c,lead[1]+36*s),'var(--ink)',2,' marker-end="url(#cp-va3)"');
      if(!along){ var b=bendDown(), f1=Pp(lead[0]-36*s*b,lead[1]+36*c*b), fl=Pp(lead[0]-48*s*b,lead[1]+48*c*b);
        g+=seg(o0,f1,'var(--accent)',3,' marker-end="url(#cp-fa3)"')+txt(fl[0].toFixed(1),(fl[1]+4).toFixed(1),'F',{a:'middle',c:'var(--accent)',w:600}); }
    }
    // the front pole, see-through so the beam shows behind it
    if(!along) g+=plate(-DP,inn?'N':'S',0.22);
    g+=txt(634,314,along?'magnetic field along the beam':'magnetic field from N to S, '+(inn?'into':'out of')+' the page',{a:'end',fs:11,c:'var(--topic)'});
    return g;
  }

  // the left-hand rule as three axes, once the beam is fired: top left in 2D, bottom left in 3D (where the picture leaves room)
  var LT=Math.cos(40*Math.PI/180), LS=Math.sin(40*Math.PI/180), LC=Math.cos(25*Math.PI/180), LP=Math.sin(25*Math.PI/180);
  function lhr(y0){
    if(t===0) return '';
    var v=speed(), p=at(t*v)||path[path.length-1], a=p[2], c=Math.cos(a), s=Math.sin(a), ox=62, oy=y0+76, L=46;
    function L3(X,Y,Z){ var dep=-X*LS+Y*LT; return [ox+(X*LT+Y*LS), oy+(-Z*LC-dep*LP)]; }
    // page directions (x right, y down) to world (X right, Y into the page, Z up)
    var along=fd()==='along', fy=fd()==='in'?1:-1, qc=q();
    var field=along?[c,0,-s]:[0,fy,0], curr=[qc*c,0,-qc*s], b=bendDown(), force=[-s*b,0,-c*b];
    var g='<defs>'+arrowHead('cp-la','var(--topic)')+arrowHead('cp-lc','var(--copper)')+arrowHead('cp-lf','var(--accent)')+'</defs>';
    g+='<rect x="2" y="'+y0+'" width="132" height="136" rx="8" fill="var(--panel)" fill-opacity="0.9" stroke="var(--panel-border)"/>';
    g+=txt(68,y0+15,'left-hand rule',{a:'middle',fs:10.5,c:'var(--ink)',w:600});
    function ax(d,col,mk,lab,k){ var e=L3(d[0]*L*k,d[1]*L*k,d[2]*L*k), dx=e[0]-ox, dy=e[1]-oy, n=Math.hypot(dx,dy)||1;
      var lx=Math.max(8,Math.min(128,e[0]+dx/n*15)), ly=e[1]+dy/n*13+4, an=lx<30?'start':(lx>100?'end':'middle');
      return line(ox,oy,e[0].toFixed(1),e[1].toFixed(1),col,3.5,' stroke-linecap="round" marker-end="url(#'+mk+')"')+txt(lx.toFixed(1),ly.toFixed(1),lab,{a:an,fs:10,c:col,w:600}); }
    g+=ax(field,'var(--topic)','cp-la','field',along?1.15:1)+ax(curr,'var(--copper)','cp-lc','current',along?0.75:1);
    g+=along?txt(68,y0+128,'parallel: no force',{a:'middle',fs:10,c:'var(--accent)',w:600}):ax(force,'var(--accent)','cp-lf','force',1);
    return g+'<circle cx="'+ox+'" cy="'+oy+'" r="3" fill="var(--ink-soft)"/>';
  }

  function draw(){
    var g='<defs>'+arrowHead('cp-fa','var(--accent)')+arrowHead('cp-va','var(--ink)')+arrowHead('cp-ba','var(--topic)')+'</defs>';
    g+='<rect x="'+RX[0]+'" y="'+RY[0]+'" width="'+(RX[1]-RX[0])+'" height="'+(RY[1]-RY[0])+'" fill="var(--topic-soft)" stroke="var(--topic)" stroke-dasharray="5 4" rx="6"/>';
    var str=+bIn.value, step=str===1?48:str===2?36:27;
    if(fd()==='along'){ for(var y=RY[0]+step/2;y<RY[1];y+=step) g+=line(RX[0]+8,y,RX[1]-10,y,'var(--topic)',1.4,' opacity="0.6" marker-end="url(#cp-ba)"'); }
    else for(var x=RX[0]+step/2;x<RX[1];x+=step) for(var y2=RY[0]+step/2;y2<RY[1];y2+=step){
      if(fd()==='in'){ var d=4.5; g+='<path d="M'+(x-d)+','+(y2-d)+' L'+(x+d)+','+(y2+d)+' M'+(x+d)+','+(y2-d)+' L'+(x-d)+','+(y2+d)+'" stroke="var(--topic)" stroke-width="1.6" opacity="0.6"/>'; }
      else g+='<circle cx="'+x+'" cy="'+y2+'" r="5" fill="none" stroke="var(--topic)" stroke-width="1.4" opacity="0.6"/><circle cx="'+x+'" cy="'+y2+'" r="1.6" fill="var(--topic)" opacity="0.7"/>';
    }
    g+=txt(RX[1]-6,RY[1]-8,'magnetic field '+(fd()==='in'?'into the page':fd()==='out'?'out of the page':'along the beam'),{a:'end',fs:11,c:'var(--topic)'});
    // the gun
    g+='<rect x="4" y="146" width="44" height="28" rx="4" fill="var(--panel)" stroke="var(--ink-soft)" stroke-width="2"/>'+txt(26,192,'source',{a:'middle',fs:10.5});
    var col=q()<0?'var(--south)':'var(--north)', v=speed();
    // trail of where the beam has been
    var head=Math.min(t,EMIT+20)*v, trail=[];
    if(t>0){ for(var i=0;i<path.length && i*2<=head;i+=2) trail.push(path[i][0].toFixed(1)+','+path[i][1].toFixed(1)); }
    if(trail.length>1) g+='<polyline points="'+trail.join(' ')+'" fill="none" stroke="'+col+'" stroke-width="2" opacity="0.3"/>';
    // the particles
    var lead=null;
    for(var e=0;e*GAP<=Math.min(t,EMIT);e++){ var p=at((t-e*GAP)*v); if(!p) continue; if(!lead) lead=p;
      g+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="5" fill="'+col+'"/>'+txt(p[0],p[1]+3.5,q()<0?'−':'+',{a:'middle',fs:9,c:'var(--panel)',w:600}); }
    // velocity and force on the leading particle while it is in the field
    if(lead && inField(lead[0],lead[1]) && running){
      var c=Math.cos(lead[2]), s=Math.sin(lead[2]);
      g+=line(lead[0],lead[1],lead[0]+30*c,lead[1]+30*s,'var(--ink)',2,' marker-end="url(#cp-va)"');
      if(fd()!=='along'){ var b=bendDown(); g+=line(lead[0],lead[1],lead[0]-30*s*b,lead[1]+30*c*b,'var(--accent)',3,' marker-end="url(#cp-fa)"')+txt(lead[0]-40*s*b,lead[1]+40*c*b+4,'F',{a:'middle',c:'var(--accent)',w:600}); }
    }
    var v3=vwG.value()==='3d';
    svg.innerHTML=(v3?draw3d():g)+lhr(v3?182:2);
    svg.setAttribute('aria-label', v3?'A beam of charged particles fired into a magnetic field, seen in 3D between the two poles of a magnet':'A beam of charged particles fired into a magnetic field');

    $('#cp-bo').textContent=LV[+bIn.value]; $('#cp-vo').textContent=SP[+vIn.value];
    var along=fd()==='along', bd=bendDown();
    $('#cp-sf').textContent=along?'none':'at 90° to path';
    $('#cp-sp').textContent=along?'straight':(bd>0?'curves down':'curves up');
    var r=radius(); $('#cp-sb').textContent=along?'not at all':(r<70?'sharply':r<130?'a fair bit':'gently');
    var cur=q()<0?'to the <b>left</b> (electrons carry negative charge, so the current is opposite to their motion)':'to the <b>right</b>, the same way the positive ions move';
    $('#cp-eq').innerHTML=along?'The particles move parallel to the field lines, so there is <b>no force</b> on them. They carry straight on.':
      'First finger (field): '+(fd()==='in'?'into':'out of')+' the page<br>Second finger (current): '+cur+'<br>Thumb (force): <b>'+(bd>0?'down':'up')+'</b> the page, at right angles to the motion';
    var n;
    if(!running && t===0) n='Press <b>Fire the beam</b>. Moving charged particles are a current, so a magnetic field can push on them, just like the motor effect on a wire.';
    else if(along) n='The beam moves <b>along</b> the field lines, so there is no force and it goes straight through. A force only acts when the motion crosses the field lines.';
    else if(done()) n='The force is always at right angles to the motion, so the beam bends into a curve. A stronger field bends it more; faster particles bend less. Reversing the field, or the charge, reverses the force.';
    else n='Inside the field the particles feel a force at right angles to their motion, so the beam curves <b>'+(bd>0?'down':'up')+'</b> the page.';
    $('#cp-note').innerHTML=n;
    playBtn.innerHTML=running?'&#10074;&#10074; Pause':(done()?'&#9654; Fire again':(t>0?'&#9654; Play':'&#9654; Fire the beam'));
  }
  function rate(){ return pressed(slowBtn)?0.3:1; }
  function stop(){ running=false; cancelAnimationFrame(raf); }
  function frame(now){ if(!running) return; t=Math.min(TMAX,t+Math.min(0.05,(now-last)/1000)*rate()); last=now;
    if(done()) stop(); draw(); if(running) raf=requestAnimationFrame(frame); }
  function reset(){ stop(); t=0; build(); draw(); }
  function changed(){ reset(); }
  playBtn.addEventListener('click',function(){ if(running){ stop(); draw(); return; } if(done()) reset(); running=true; last=performance.now(); raf=requestAnimationFrame(frame); draw(); });
  slowBtn.addEventListener('click',function(){ toggle(slowBtn); });
  $('#cp-reset').addEventListener('click',reset);
  reset();

})();
</script>
<script>
// Wire / Charged particles switch. ?show=wire or ?show=particles opens one part and hides the switch (used by the workout tabs).
(function(){
  var q = location.search.match(/[?&]show=(wire|particles)\b/), modeEl = document.getElementById('mode');
  function pick(v){
    Array.prototype.forEach.call(modeEl.querySelectorAll('button'), function(b){ b.setAttribute('aria-pressed', String(b.dataset.v===v)); });
    document.getElementById('st-wire').hidden = v!=='wire';
    document.getElementById('st-particles').hidden = v!=='particles';
  }
  modeEl.addEventListener('click', function(e){ var b=e.target.closest('button'); if(b) pick(b.dataset.v); });
  if(q){ document.documentElement.classList.add('fixed'); pick(q[1]); } else pick('wire');
})();
</script>
