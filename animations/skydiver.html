<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skydiver Animation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1f5;
    --bg-grid:rgba(29,41,61,0.055);
    --panel:#ffffff;
    --panel-border:#d7dce4;
    --ink:#182233;
    --ink-soft:#4c5668;
    --ink-faint:#8993a5;
    --accent:#d9720c;
    --accent-soft:#fdead2;
    --good:#15803d;
    --good-soft:#dcf5e3;
    --bad:#c0311a;
    --bad-soft:#fbe1db;
    --shadow:0 10px 26px -14px rgba(24,34,51,0.28);
    --motion:#2158d1;      --motion-soft:#dfe8fc;
    --font-display:'Big Shoulders',system-ui,sans-serif;
    --font-body:'IBM Plex Sans',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12161f; --bg-grid:rgba(255,255,255,0.045);
      --panel:#1b212e; --panel-border:#2c3444;
      --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;
      --accent:#ff9a3d; --accent-soft:#3a2712;
      --good:#4ade80; --good-soft:#123321;
      --bad:#f27159; --bad-soft:#3a1712;
      --shadow:0 14px 30px -14px rgba(0,0,0,0.55);
      --motion:#7da3ff; --motion-soft:#1a2440;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12161f; --bg-grid:rgba(255,255,255,0.045);
    --panel:#1b212e; --panel-border:#2c3444;
    --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;
    --accent:#ff9a3d; --accent-soft:#3a2712;
    --good:#4ade80; --good-soft:#123321;
    --bad:#f27159; --bad-soft:#3a1712;
    --shadow:0 14px 30px -14px rgba(0,0,0,0.55);
    --motion:#7da3ff; --motion-soft:#1a2440;
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      linear-gradient(var(--bg-grid) 1px,transparent 1px) 0 0/100% 34px,
      linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px) 0 0/34px 100%,
      var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  [hidden]{display:none!important;}
  button{font:inherit;color:inherit;}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;}

  .page{max-width:1400px;margin-inline:auto;padding-inline:20px;padding-block:12px 40px;}
  h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:0.2px;text-wrap:balance;margin:0;}
  p{margin:0;line-height:1.55;}

  .home-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-bottom:4px;font:600 13px var(--font-mono);color:var(--ink-soft);text-decoration:none;}
  .home-link:hover{color:var(--accent);}
  .page-head{margin-bottom:12px;}
  .eyebrow{font-family:var(--font-mono);font-size:11.5px;color:var(--accent);font-weight:600;margin-bottom:6px;}
  .page-head h1{font-size:clamp(28px,5vw,38px);color:var(--ink);}

  .card{background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;box-shadow:var(--shadow);}
  .btn{
    font-family:var(--font-body);font-weight:600;font-size:13.5px;color:var(--ink);
    background:var(--panel);border:1px solid var(--panel-border);border-radius:9px;
    padding:9px 15px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  }
  .btn:hover{border-color:var(--ink-faint);}
  .btn:disabled{opacity:.45;cursor:default;}
  .btn-primary{background:var(--ink);border-color:var(--ink);color:var(--bg);}
  .btn-primary:hover{opacity:.88;border-color:var(--ink);}
  .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);}
  .btn-group{display:flex;flex-wrap:wrap;gap:10px;}

  /* picture on the left; controls, readings and working on the right */
  .stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);gap:18px 24px;align-items:start;padding:18px;}
  @media (max-width:860px){ .stage{grid-template-columns:minmax(0,1fr);} }
  /* the picture shrinks on short screens so the whole box fits in the window */
  .view{display:block;width:100%;height:auto;max-height:max(260px,calc(100vh - 290px));}
  .embed .view{max-height:460px;}
  .under{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;margin-top:12px;}
  .under .btn-group{flex:0 1 auto;}
  .mass{flex:1 1 220px;min-width:0;}
  .view text{font-family:var(--font-mono);}
  .side{display:flex;flex-direction:column;gap:12px;min-width:0;}
  .lab{display:flex;justify-content:space-between;font:12.5px var(--font-mono);color:var(--ink-soft);margin-bottom:6px;}
  .lab output{color:var(--ink);font-weight:600;}
  input[type=range]{width:100%;accent-color:var(--motion);min-height:28px;}
  .seg{display:flex;flex-wrap:wrap;gap:6px;}
  .seg button{font:12.5px var(--font-mono);padding:8px 12px;min-height:44px;border:1px solid var(--panel-border);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer;}
  .seg button[aria-pressed="true"]{background:var(--motion);border-color:var(--motion);color:var(--panel);}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px;}
  .stat strong{white-space:nowrap;}
  .stat{border:1px solid var(--panel-border);border-radius:8px;padding:5px 8px;}
  .stat small{display:block;font:10.5px var(--font-mono);color:var(--ink-faint);}
  .stat strong{font:600 15px var(--font-mono);color:var(--ink);}
  .stat.up strong{color:var(--accent);}
  .note{font-size:15px;line-height:1.5;color:var(--ink);padding:10px 12px;border-radius:8px;background:var(--bg);min-height:4.6em;}

  details.working summary{cursor:pointer;font:600 13px var(--font-mono);color:var(--motion);min-height:44px;display:flex;align-items:center;}
  .eq{font-family:var(--font-mono);font-size:14px;line-height:1.75;padding:8px 12px;border-left:3px solid var(--motion);background:var(--motion-soft);border-radius:6px;color:var(--ink);}
  .eq b{color:var(--motion);}
  .eqg{display:grid;grid-template-columns:auto auto minmax(0,1fr);column-gap:.45em;row-gap:.2em;align-items:center}
  .eqg-l{justify-self:end;text-align:right}
  .eqg-m{justify-self:center}
  .eqg-r{justify-self:start;min-width:0}
  .eqg-full{grid-column:1/-1}
  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1.25;}
  .frac>span{padding:0 .25em;white-space:nowrap;}
  .frac>span:first-child{border-bottom:1.5px solid currentColor;}
  @media (max-width:560px){ .stage{padding:12px;} .eq{font-size:12.5px;padding:6px 8px;} }

  /* inside a workout tab (skydiver.html?embed): no page heading, no outer margins */
  .embed body{background:transparent;}
  .embed .page{padding:0;max-width:none;}
  .embed .home-link,.embed .page-head{display:none;}
</style>
</head>
<body>
<div class="page" id="page">
  <a class="home-link" href="../index.html">&larr; Home</a>
  <header class="page-head">
    <div class="eyebrow">Animations &middot; forces</div>
    <h1>Skydiver and Terminal Velocity</h1>
  </header>

  <section class="card stage">
    <div>
      <svg class="view" id="fa-svg" viewBox="0 0 520 290" role="img" aria-label="Zahra the skydiver, with weight and air resistance arrows, and her velocity-time graph"></svg>
      <div class="under">
        <div class="btn-group">
          <button class="btn btn-primary" id="fa-play" type="button">&#9654; Jump</button>
          <button class="btn" id="fa-chute" type="button" disabled>Open parachute</button>
          <button class="btn" id="fa-reset" type="button">&#8634; Reset</button>
          <button class="btn" id="fa-slow" type="button" aria-pressed="false">Slow motion</button>
        </div>
        <div class="mass">
          <label class="lab" for="fa-m">Zahra&rsquo;s mass <output id="fa-mo"></output></label>
          <input type="range" id="fa-m" min="50" max="110" step="5" value="80">
        </div>
      </div>
    </div>
    <div class="side">
      <div>
        <div class="lab">Jump to a point</div>
        <div class="seg" id="fa-points"><button type="button" data-p="start" aria-pressed="false">Start</button><button type="button" data-p="mid" aria-pressed="false">Mid fall</button><button type="button" data-p="term1" aria-pressed="false">Terminal velocity 1</button><button type="button" data-p="slow" aria-pressed="false">Parachute slowing her</button><button type="button" data-p="term2" aria-pressed="false">Terminal velocity 2</button></div>
      </div>
      <p class="note" id="fa-note" aria-live="polite"></p>
      <div class="stats">
        <div class="stat"><small>Time</small><strong id="fa-t">0 s</strong></div>
        <div class="stat"><small>Velocity</small><strong id="fa-v">0 m/s</strong></div>
        <div class="stat"><small>Weight</small><strong id="fa-w">0 N</strong></div>
        <div class="stat up"><small>Air resistance</small><strong id="fa-air">0 N</strong></div>
      </div>
      <details class="working" id="fa-working">
        <summary>Show working</summary>
        <div class="eq" id="fa-eq"></div>
      </details>
    </div>
  </section>
</div>
<script>
(function(){
  // skydiver.html is the one copy of this animation. On its own it is the lesson version;
  // with ?embed it drops its heading so a workout tab can show it in a frame, and it tells that page its height.
  var EMBED = /[?&]embed\b/.test(location.search);
  if(EMBED){
    document.documentElement.classList.add('embed');
    document.getElementById('fa-working').open = true;
    var page = document.getElementById('page');
    var sendHeight = function(){ try{ parent.postMessage({animHeight: Math.ceil(page.getBoundingClientRect().height)}, '*'); }catch(e){} };
    if(window.ResizeObserver) new ResizeObserver(sendHeight).observe(page);
    window.addEventListener('load', sendHeight);
  }
  function $(sel){ return document.querySelector(sel); }
  function num(n, dp){   // round, drop trailing zeros, group thousands with a space from 10 000
    var f = Math.pow(10, dp||0), r = Math.round(n*f)/f, t = String(r);
    if(Math.abs(r)>=10000) t = t.replace(/\B(?=(\d{3})+(?!\d))/g,' ');
    return t;
  }
  function FR(t){
    return String(t).replace(/(\d) (?=\d{3}\b)/g,'$1 ')
      .replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g,'<span class="frac"><span>$1</span><span>$2</span></span>');
  }
  function arrowHead(id, col){ return '<marker id="'+id+'" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="'+col+'"/></marker>'; }
  // Each line of a working readout becomes left | = | right, so the = signs sit under each other.
  function alignEquals(el){
    if(el.querySelector('.eqg')) return;
    var rows = el.innerHTML.split(/<br\s*\/?>/i).map(function(line){
      var i = line.indexOf(' = ');
      if(i<0) return '<span class="eqg-full">'+line+'</span>';
      return '<span class="eqg-l">'+line.slice(0,i)+'</span><span class="eqg-m">=</span><span class="eqg-r">'+line.slice(i+3)+'</span>';
    });
    el.innerHTML = '<div class="eqg">'+rows.join('')+'</div>';
  }
  function watchEquals(el){ alignEquals(el); new MutationObserver(function(){ alignEquals(el); }).observe(el, {childList:true}); }

  function initFallingSim(){
    var mIn=$('#fa-m'), G=10, KC=0.25, KO=30, TMAX=60, PLAY=5, OPEN=3, TCHUTE=25;
    // the canopy takes OPEN seconds to fill; that part, and the slowing straight after, play in slow motion
    var t=0, v=0, chuteAt=null, pts=[[0,0]], running=false, last=0, raf=0, playBtn=$('#fa-play'), pointsEl=$('#fa-points'), slowBtn=$('#fa-slow');
    mIn.addEventListener('input',reset);
    function m(){ return +mIn.value; }
    function opened(tt){ return chuteAt===null||tt<chuteAt ? 0 : Math.min(1,(tt-chuteAt)/OPEN); }
    function k(tt){ var f=opened(tt); return KC+(KO-KC)*f*f; }
    function autoRate(){ if(chuteAt===null||t<chuteAt) return PLAY; var d=t-chuteAt; return d<OPEN+1 ? 0.5 : (d<OPEN+4 ? 1 : PLAY); }
    function slowOn(){ return slowBtn.getAttribute('aria-pressed')==='true'; }
    function rate(){ return autoRate()*(slowOn()?0.3:1); }
    function drag(){ return k(t)*v*v; }
    function step(dt){   // small fixed steps keep the parachute opening stable
      var n=Math.ceil(dt/0.005), h=dt/n;
      for(var i=0;i<n;i++){ var a=(m()*G-k(t)*v*v)/m(); v=Math.max(0,v+a*h); t+=h; }
      if(!pts.length||t-pts[pts.length-1][0]>=0.2) pts.push([t,v]);
    }
    function advance(to){ while(t<to-1e-9) step(Math.min(0.2,to-t)); }
    function draw(){
      var W=m()*G, D=Math.min(drag(),W*3), g='<defs>'+arrowHead('fa-d','var(--ink)')+arrowHead('fa-u','var(--accent)')+'</defs>';
      var cx=52, cy=150, sc=0.07, open=chuteAt!==null&&t>=chuteAt, f=opened(t), cw=10+36*f, ch=cy-30-28*f, ctop=ch-54*f-6;
      if(open){ g+='<path d="M'+(cx-cw)+','+ch+' Q'+cx+','+ctop+' '+(cx+cw)+','+ch+' Z" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2"/><line x1="'+(cx-cw)+'" y1="'+ch+'" x2="'+(cx-6)+'" y2="'+(cy-18)+'" stroke="var(--ink-faint)"/><line x1="'+(cx+cw)+'" y1="'+ch+'" x2="'+(cx+6)+'" y2="'+(cy-18)+'" stroke="var(--ink-faint)"/>'; }
      // the skydiver: a girl with a ponytail and a dress
      g+='<path d="M'+(cx+6)+','+(cy-27)+' q12,-2 14,10 q-6,-4 -12,-3 z" fill="var(--ink)"/>';
      g+='<circle cx="'+cx+'" cy="'+(cy-22)+'" r="8" fill="var(--panel)" stroke="var(--ink)" stroke-width="2.5"/>';
      g+='<path d="M'+(cx-9)+','+(cy-21)+' a9,9 0 0 1 18,0 q-5,-6 -9,-5 q-5,0 -9,5 z" fill="var(--ink)"/>';
      g+='<line x1="'+(cx-16)+'" y1="'+(cy-8)+'" x2="'+(cx+16)+'" y2="'+(cy-8)+'" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>';
      g+='<polygon points="'+(cx-4)+','+(cy-13)+' '+(cx+4)+','+(cy-13)+' '+(cx+12)+','+(cy+14)+' '+(cx-12)+','+(cy+14)+'" fill="var(--motion-soft)" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>';
      g+='<line x1="'+(cx-5)+'" y1="'+(cy+14)+'" x2="'+(cx-8)+'" y2="'+(cy+28)+'" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/><line x1="'+(cx+5)+'" y1="'+(cy+14)+'" x2="'+(cx+8)+'" y2="'+(cy+28)+'" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>';
      g+='<line x1="'+cx+'" x2="'+cx+'" y1="'+(cy+32)+'" y2="'+(cy+32+W*sc)+'" stroke="var(--ink)" stroke-width="4" marker-end="url(#fa-d)"/><text x="'+(cx+8)+'" y="'+(cy+46+W*sc)+'" font-size="11.5" fill="var(--ink)">weight '+num(W)+' N</text>';
      if(D>5){ var L=Math.min(D*sc,110), x2=cx+30; g+='<line x1="'+x2+'" x2="'+x2+'" y1="'+(cy+4)+'" y2="'+(cy+4-L)+'" stroke="var(--accent)" stroke-width="4" marker-end="url(#fa-u)"/><text x="'+(x2+6)+'" y="'+(cy+18)+'" font-size="10.5" fill="var(--accent)">air resistance</text><text x="'+(x2+6)+'" y="'+(cy+31)+'" font-size="10.5" fill="var(--accent)">'+num(drag())+' N</text>'; }
      // velocity-time graph
      var GX=205, GY=20, GW=300, GH=230, VMAX=70;
      function gx(tt){ return GX+tt/TMAX*GW; } function gy(vv){ return GY+GH-vv/VMAX*GH; }
      for(var i=0;i<=60;i+=10) g+='<line x1="'+gx(i)+'" x2="'+gx(i)+'" y1="'+GY+'" y2="'+(GY+GH)+'" stroke="var(--panel-border)"/><text x="'+gx(i)+'" y="'+(GY+GH+15)+'" text-anchor="middle" font-size="10.5" fill="var(--ink-faint)">'+i+'</text>';
      for(i=0;i<=70;i+=10) g+='<line x1="'+GX+'" x2="'+(GX+GW)+'" y1="'+gy(i)+'" y2="'+gy(i)+'" stroke="var(--panel-border)"/><text x="'+(GX-6)+'" y="'+(gy(i)+4)+'" text-anchor="end" font-size="10.5" fill="var(--ink-faint)">'+i+'</text>';
      g+='<line x1="'+GX+'" x2="'+GX+'" y1="'+GY+'" y2="'+(GY+GH)+'" stroke="var(--ink-soft)" stroke-width="2"/><line x1="'+GX+'" x2="'+(GX+GW)+'" y1="'+(GY+GH)+'" y2="'+(GY+GH)+'" stroke="var(--ink-soft)" stroke-width="2"/>';
      g+='<text x="'+(GX+GW/2)+'" y="'+(GY+GH+32)+'" text-anchor="middle" font-size="11.5" fill="var(--ink-soft)">time (s)</text><text x="'+(GX)+'" y="'+(GY-6)+'" font-size="11.5" fill="var(--ink-soft)">velocity (m/s)</text>';
      var ptsAll=pts.concat([[t,v]]);
      g+='<polyline points="'+ptsAll.map(function(q){ return gx(q[0])+','+gy(q[1]); }).join(' ')+'" fill="none" stroke="var(--motion)" stroke-width="2.5"/>';
      if(t>0) g+='<circle cx="'+gx(t)+'" cy="'+gy(v)+'" r="5" fill="var(--motion)" stroke="var(--panel)" stroke-width="2"/>';
      if(running && autoRate()<1) g+='<text x="'+(GX+GW-6)+'" y="'+(GY+16)+'" text-anchor="end" font-size="12" fill="var(--accent)">slow motion</text>';
      $('#fa-svg').innerHTML=g;
      var F=W-drag(), dir=Math.abs(F)<0.5?'':(F>0?' downwards':' upwards');
      $('#fa-mo').textContent=m()+' kg'; $('#fa-w').textContent=num(W)+' N'; $('#fa-air').textContent=num(drag())+' N'; $('#fa-t').textContent=Math.round(t)+' s'; $('#fa-v').textContent=num(v,1)+' m/s';
      $('#fa-eq').innerHTML=FR('W = m × g = '+m()+' × 10 = '+num(W)+' N<br>F = W − air resistance<br>F = '+num(W)+' − '+num(drag())+' = '+num(Math.abs(F))+' N'+dir+'<br>F = m × a<br>a = [[F|m]]<br>a = [['+num(Math.abs(F))+'|'+m()+']] = <b>'+num(Math.abs(F)/m(),1)+' m/s²</b>'+dir);
      var note='';
      if(t===0) note='Zahra is about to jump: the only force on her is her weight.';
      else if(open && f<1 && F>=-0.5) note='The parachute is opening. Air resistance is growing fast as the canopy fills.';
      else if(open && F<-0.5) note='The parachute is open: air resistance is now bigger than her weight, so the resultant force is upwards and she slows down.';
      else if(Math.abs(F)<0.02*W) note=open?'Air resistance balances her weight again at a much lower speed: a new, lower terminal velocity.':'Air resistance has grown until it balances her weight: zero resultant force, so she falls at a steady terminal velocity.';
      else note='Weight is bigger than air resistance, so she accelerates. As she speeds up the air resistance grows, so her acceleration gets smaller.';
      $('#fa-note').textContent=note;
      $('#fa-chute').disabled = !(t>0) || chuteAt!==null || t>=TMAX;
      playBtn.innerHTML = running ? '&#10074;&#10074; Pause' : (t>0 && t<TMAX ? '&#9654; Play' : '&#9654; Jump');
    }
    function stop(){ running=false; cancelAnimationFrame(raf); }
    function mark(p){ Array.prototype.forEach.call(pointsEl.children,function(x){ x.setAttribute('aria-pressed', String(x.dataset.p===p)); }); }
    function reset(){ stop(); t=0; v=0; chuteAt=null; pts=[[0,0]]; mark(''); draw(); }
    function frame(now){ if(!running) return; var dt=Math.min(0.05,(now-last)/1000)*rate(); last=now;
      advance(Math.min(TMAX,t+dt)); draw(); if(t>=TMAX){ stop(); return; } raf=requestAnimationFrame(frame); }
    function run(){ running=true; last=performance.now(); raf=requestAnimationFrame(frame); draw(); }
    // fixed points on one standard journey: the parachute opens at TCHUTE seconds
    function until(test){ while(t<TMAX && !test()) step(0.02); }
    function jumpTo(p){
      reset(); mark(p); if(p==='start'){ draw(); return; }
      var vt1=Math.sqrt(m()*G/KC), vt2=Math.sqrt(m()*G/KO);
      if(p==='mid'){ until(function(){ return v>=vt1/2; }); draw(); return; }
      advance(TCHUTE-3); if(p==='term1'){ draw(); return; }
      advance(TCHUTE); chuteAt=TCHUTE;
      if(p==='slow'){ until(function(){ return v<=(vt1+vt2)/2; }); draw(); return; }
      advance(TCHUTE+15); draw();
    }
    pointsEl.addEventListener('click',function(e){ var b=e.target.closest('button'); if(b) jumpTo(b.dataset.p); });
    playBtn.addEventListener('click',function(){ if(running){ stop(); draw(); return; } if(t>=TMAX) reset(); run(); });
    slowBtn.addEventListener('click',function(){ slowBtn.setAttribute('aria-pressed', String(!slowOn())); });
    $('#fa-chute').addEventListener('click',function(){ if(chuteAt!==null||t===0) return; chuteAt=t; mark(''); if(!running && t<TMAX) run(); draw(); });
    $('#fa-reset').addEventListener('click',reset);
    reset();
  }

  watchEquals($('#fa-eq'));
  initFallingSim();
})();
</script>
</body>
</html>
