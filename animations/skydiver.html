<html lang="en">
<head>

<meta name="description" content="Interactive physics animation for Edexcel IGCSE, IAL and IB. A skydiver’s weight, air resistance and resultant force with her velocity–time graph, from the jump to two terminal velocities. Predict the air resistance at a point on the graph.">

<style>
  :root{
    --bg:#eef1f5;
    --bg-grid:rgba(29,41,61,0.055);
    --panel:#ffffff;
    --panel-border:#d7dce4;
    --ink:#182233;
    --ink-soft:#4c5668;
    --ink-faint:#8993a5;
    --accent:#d9720c;
    --accent-soft:#fdead2;
    --good:#15803d;
    --good-soft:#dcf5e3;
    --bad:#c0311a;
    --bad-soft:#fbe1db;
    --shadow:0 10px 26px -14px rgba(24,34,51,0.28);
    --motion:#2158d1;      --motion-soft:#dfe8fc;
    --font-display:'Big Shoulders',system-ui,sans-serif;
    --font-body:'IBM Plex Sans',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12161f; --bg-grid:rgba(255,255,255,0.045);
      --panel:#1b212e; --panel-border:#2c3444;
      --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;
      --accent:#ff9a3d; --accent-soft:#3a2712;
      --good:#4ade80; --good-soft:#123321;
      --bad:#f27159; --bad-soft:#3a1712;
      --shadow:0 14px 30px -14px rgba(0,0,0,0.55);
      --motion:#7da3ff; --motion-soft:#1a2440;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12161f; --bg-grid:rgba(255,255,255,0.045);
    --panel:#1b212e; --panel-border:#2c3444;
    --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;
    --accent:#ff9a3d; --accent-soft:#3a2712;
    --good:#4ade80; --good-soft:#123321;
    --bad:#f27159; --bad-soft:#3a1712;
    --shadow:0 14px 30px -14px rgba(0,0,0,0.55);
    --motion:#7da3ff; --motion-soft:#1a2440;
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      linear-gradient(var(--bg-grid) 1px,transparent 1px) 0 0/100% 34px,
      linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px) 0 0/34px 100%,
      var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  [hidden]{display:none!important;}
  button{font:inherit;color:inherit;}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;}

  .page{max-width:1400px;margin-inline:auto;padding-inline:20px;padding-block:12px 40px;}
  h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:0.2px;text-wrap:balance;margin:0;}
  p{margin:0;line-height:1.55;}

  .home-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-bottom:4px;font:600 13px var(--font-mono);color:var(--ink-soft);text-decoration:none;}
  .home-link:hover{color:var(--accent);}
  .page-head{margin-bottom:12px;}
  .eyebrow{font-family:var(--font-mono);font-size:11.5px;color:var(--accent);font-weight:600;margin-bottom:6px;}
  .page-head h1{font-size:clamp(28px,5vw,38px);color:var(--ink);}

  .card{background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;box-shadow:var(--shadow);}
  .btn{
    font-family:var(--font-body);font-weight:600;font-size:13.5px;color:var(--ink);
    background:var(--panel);border:1px solid var(--panel-border);border-radius:9px;
    padding:9px 15px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  }
  .btn:hover{border-color:var(--ink-faint);}
  .btn:disabled{opacity:.45;cursor:default;}
  .btn-primary{background:var(--ink);border-color:var(--ink);color:var(--bg);}
  .btn-primary:hover{opacity:.88;border-color:var(--ink);}
  .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);}
  .btn-group{display:flex;flex-wrap:wrap;gap:10px;}

  /* picture on the left; controls, readings and working on the right */
  .stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);gap:18px 24px;align-items:start;padding:18px;}
  @media (max-width:860px){ .stage{grid-template-columns:minmax(0,1fr);} }
  /* the picture shrinks on short screens so the whole box fits in the window */
  .view{display:block;width:100%;height:auto;max-height:max(260px,calc(100vh - 290px));}
  .embed .view{max-height:460px;}
  .under{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;margin-top:12px;}
  .under .btn-group{flex:0 1 auto;}
  .mass{flex:1 1 220px;min-width:0;}
  .view text{font-family:var(--font-mono);}
  .side{display:flex;flex-direction:column;gap:12px;min-width:0;}
  .lab{display:flex;justify-content:space-between;font:12.5px var(--font-mono);color:var(--ink-soft);margin-bottom:6px;}
  .lab output{color:var(--ink);font-weight:600;}
  input[type=range]{width:100%;accent-color:var(--motion);min-height:28px;}
  .seg{display:flex;flex-wrap:wrap;gap:6px;}
  .seg button{font:12.5px var(--font-mono);padding:8px 12px;min-height:44px;border:1px solid var(--panel-border);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer;}
  .seg button[aria-pressed="true"]{background:var(--motion);border-color:var(--motion);color:var(--panel);}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px;}
  .stat strong{white-space:nowrap;}
  .stat{border:1px solid var(--panel-border);border-radius:8px;padding:5px 8px;display:flex;flex-direction:column;justify-content:space-between;}
  .stat small{display:block;font:10.5px var(--font-mono);color:var(--ink-faint);}
  .stat strong{font:600 15px var(--font-mono);color:var(--ink);}
  .stat.up strong{color:var(--accent);}
  .note{font-size:15px;line-height:1.5;color:var(--ink);padding:10px 12px;border-radius:8px;background:var(--bg);min-height:4.6em;}

  details.working summary{cursor:pointer;font:600 13px var(--font-mono);color:var(--motion);min-height:44px;display:flex;align-items:center;}
  .eq{font-family:var(--font-mono);font-size:14px;line-height:1.75;padding:8px 12px;border-left:3px solid var(--motion);background:var(--motion-soft);border-radius:6px;color:var(--ink);}
  .eq b{color:var(--motion);}
  .eqg{display:grid;grid-template-columns:auto auto minmax(0,1fr);column-gap:.45em;row-gap:.2em;align-items:center}
  .eqg-l{justify-self:end;text-align:right}
  .eqg-m{justify-self:center}
  .eqg-r{justify-self:start;min-width:0}
  .eqg-full{grid-column:1/-1}
  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1.25;}
  .frac>span{padding:0 .25em;white-space:nowrap;}
  .frac>span:first-child{border-bottom:1.5px solid currentColor;}
  @media (max-width:560px){ .stage{padding:12px;} .eq{font-size:12.5px;padding:6px 8px;} }

  /* inside a workout tab (skydiver.html?embed): no page heading, no outer margins */
  .embed body{background:transparent;}
  .embed .page{padding:0;max-width:none;}
  .embed .home-link,.embed .page-head{display:none;}
  /* batch 4 */
  :root{--grass:#cfe8b4;--steel:#66748c;--steel-hi:#c3ccda;--steel-sh:#3f4a5e;--case:#3f4a5e;--road:#6f7785;--road-s:#4c5361;--car:#2f6fe0;--car-ref:#8a93a3;--car-glass:#cfe6f7;}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--grass:#22361a;--steel:#8f9db3;--steel-hi:#dfe5ee;--steel-sh:#566179;--case:#56617a;--road:#5a6170;--road-s:#3b414c;--car:#5b8cf0;--car-ref:#9aa4b5;--car-glass:#9fc3df;} }
  :root[data-theme="dark"]{--grass:#22361a;--steel:#8f9db3;--steel-hi:#dfe5ee;--steel-sh:#566179;--case:#56617a;--road:#5a6170;--road-s:#3b414c;--car:#5b8cf0;--car-ref:#9aa4b5;--car-glass:#9fc3df;}

  :root{--wood-f:#c99e6a;--wood-t:#e3c08f;--wood-s:#9c7444;--trol:#3d3aa8;--skin:#c99a6c;--hair:#3b2a1f;--sky:#d9ecfb;--cloud:#ffffff;}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--wood-f:#8a6a43;--wood-t:#a8855a;--wood-s:#644b2d;--trol:#5a57c9;--skin:#c29364;--hair:#7a563c;--sky:#1d3147;--cloud:#3c536d;} }
  :root[data-theme="dark"]{--wood-f:#8a6a43;--wood-t:#a8855a;--wood-s:#644b2d;--trol:#5a57c9;--skin:#c29364;--hair:#7a563c;--sky:#1d3147;--cloud:#3c536d;}
  .view{max-height:max(240px,calc(100vh - 272px));}
  .embed .view{max-height:400px;}
  .view.tall,.embed .view.tall{max-height:none;}
  .view text{font-family:var(--font-mono);}
  .seg.tabs{gap:0;flex-wrap:nowrap;}
  .seg.tabs button{font-size:12.5px;padding:8px 10px;white-space:nowrap;border-radius:0;margin-left:-1px;font-weight:600;}
  .seg.tabs button:first-child{border-radius:8px 0 0 8px;margin-left:0;}
  .seg.tabs button:last-child{border-radius:0 8px 8px 0;}
  .seg.tabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);}
  .head-line{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;}
  .pick{cursor:pointer;}
  .pick.off{cursor:default;}
  .pick:focus{outline:none;}
  .pick .ring{stroke:transparent;}
  .pick:focus-visible .ring{stroke:var(--accent);}
  :root{--chute:#e4572e;--chute-2:#f6c453;--plane:#8a93a3;}
  .stats{grid-template-columns:repeat(auto-fit,minmax(84px,1fr));}
  .seg.pts button{padding:6px 10px;min-height:40px;}
  .pred .ex-only{display:none!important;}
  html:not(.pred) .pr-only{display:none!important;}
  .side .seg.tabs{align-self:flex-start;}
  .stats.six{grid-template-columns:repeat(3,minmax(0,1fr));}
  :root{--balance:#6d3bce;}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--balance:#b393f5;} }
  :root[data-theme="dark"]{--balance:#b393f5;}
  /* in a workout frame the fixed points go under the picture, so the frame fits one laptop screen */
  .under #fa-ptsbox{flex:1 1 100%;}
  /* end batch 4 */
</style>
<style id="choice-kit">
/* Choice kit (12 Nov 2026): the same block on every animation page. See tools/ANIMATION-STYLE.md, "Choices". */

<script>
  // Visit counter (GoatCounter: no cookies, no personal data). Skipped when a page is embedded in a workout, so a visit counts once.
  // pwCountTab(tab, label): counts each workout tab once per visit as a GoatCounter event (path "page#tab"), skipped in frames the same way.
  (function(){
    var off = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var seen = {}, queue = [];
    function send(e){ try { window.goatcounter.count(e); } catch (x) {} }
    window.pwCountTab = function(tab, label){
      if (off || !tab || seen[tab]) return;
      seen[tab] = 1;
      var page = (location.pathname.split('/').pop() || 'index').replace(/\.html$/, '');
      var e = { path: page + '#' + tab, title: (label || tab) + ' \u00b7 ' + document.title, event: true };
      if (window.goatcounter && window.goatcounter.count) send(e); else queue.push(e);
    };
    if (off) return;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://gc.zgo.at/count.js';
    s.setAttribute('data-goatcounter', 'https://physics-workout.goatcounter.com/count');
    s.onload = function(){ var q = queue; queue = []; q.forEach(send); };
    document.head.appendChild(s);
  })();
</script>

<script>
  // Draft tags and Alex's reviewer button (tools/review/drafts.py writes this block; edit tools/review/snippet.html, then run drafts.py sync).
  // A page is Draft while its row in tools/REVIEW.md is not ✅: <meta name="pw-draft"> on the page, data-draft on its list cards.
  // ?reviewer (once, on any page) turns on reviewer mode in this browser; ?reviewer=off turns it off.
  (function(){
    var on = false, embed = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var m = /[?&]reviewer(?:=([^&]*))?/.exec(location.search);
    on = !!m && m[1] !== 'off';
    try {
      if (m) { if (m[1] === 'off') localStorage.removeItem('pw-reviewer'); else localStorage.setItem('pw-reviewer', '1'); }
      else on = localStorage.getItem('pw-reviewer') === '1';
    } catch (e) {}
    var CSS = '.pw-draft{display:inline-block;vertical-align:middle;margin-left:10px;font:600 11.5px/1.4 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:0;color:var(--bad,#b42318);border:1px dashed currentColor;border-radius:5px;padding:1px 7px;white-space:nowrap}'
      + '.act-top .pw-draft{margin-left:auto;flex:none}.act-top .pw-draft~.cp-tag,.act-top .pw-draft~.ta-tag{margin-left:0}'
      + 'a[data-draft]{position:relative}.pw-draft.pw-corner{position:absolute;top:10px;right:10px;margin:0;background:var(--panel,#fff)}'
      + 'summary .pw-draft{margin-left:0;flex:none}'
      + '.pw-check{display:inline-block;vertical-align:middle;margin-left:8px;font:600 13px/1.4 "IBM Plex Sans",system-ui,sans-serif;color:#fff;background:#1a7f37;border-radius:6px;padding:4px 10px;text-decoration:none;white-space:nowrap}'
      + '.pw-check:hover{background:#116329}.pw-check:focus-visible{outline:2px solid #1a7f37;outline-offset:2px}'
      + '.pw-reviewer{position:fixed;left:10px;bottom:10px;z-index:9999;font:500 12px/1.4 "IBM Plex Mono",ui-monospace,monospace;background:#1d2433;color:#fff;border-radius:6px;padding:4px 9px;opacity:.85}'
      + '.pw-reviewer a{color:#ffc83d}';
    function tag(){ var t = document.createElement('span'); t.className = 'pw-draft'; t.title = 'Not yet checked'; t.textContent = 'Draft'; return t; }
    function go(){
      var st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st);
      var meta = document.querySelector('meta[name="pw-draft"]'), h1 = document.querySelector('h1');
      if (meta && h1 && !embed) {
        h1.appendChild(tag());
        if (on) {
          var page = meta.getAttribute('content'), b = document.createElement('a');
          b.className = 'pw-check'; b.target = '_blank'; b.rel = 'noopener'; b.textContent = '✓ Checked';
          b.title = 'Opens a GitHub issue. Submit it and the Draft tag goes in a minute or two.';
          b.href = 'https://github.com/Skati1401/Physics-Workout/issues/new?title=' + encodeURIComponent('Checked: ' + page)
            + '&body=' + encodeURIComponent('Submit this issue to mark `' + page + '` as checked. The Draft tag goes in a minute or two, and the issue closes itself.');
          h1.appendChild(b);
        }
      }
      document.querySelectorAll('a[data-draft]').forEach(function(a){
        if (a.querySelector('.pw-draft')) return;
        var t = tag(), top = a.querySelector('.act-top');
        if (top) top.insertBefore(t, top.querySelector('.cp-tag,.ta-tag'));
        else { t.className += ' pw-corner'; a.appendChild(t); }
      });
      document.querySelectorAll('details.unit').forEach(function(d){
        var s = d.querySelector('summary');
        if (!s || s.querySelector('.pw-draft') || !d.querySelector('a[data-draft]')) return;
        var h2 = s.querySelector('h2'); if (h2) h2.parentNode.insertBefore(tag(), h2.nextSibling); else s.appendChild(tag());
      });
      if (on && !embed) {
        // Carry ?reviewer in every link to another page of the site, so reviewer mode survives
        // browsers that clear site storage (school Chromebooks) and pages cached from before.
        var carry = function(a){
          try {
            var u = new URL(a.href, location.href);
            if (u.origin !== location.origin || !/(\.html|\/)$/.test(u.pathname) || u.searchParams.has('reviewer')) return;
            u.searchParams.set('reviewer', ''); a.href = u.href.replace('reviewer=', 'reviewer');
          } catch (e) {}
        };
        document.querySelectorAll('a[href]').forEach(carry);
        ['click', 'auxclick', 'contextmenu'].forEach(function(ev){
          document.addEventListener(ev, function(e){ var a = e.target.closest && e.target.closest('a[href]'); if (a) carry(a); }, true);
        });
        var r = document.createElement('div'); r.className = 'pw-reviewer';
        r.innerHTML = 'Reviewer mode · <a href="' + location.pathname + '?reviewer=off">turn off</a>';
        document.body.appendChild(r);
      }
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
  })();
</script>

<body>
<div class="page" id="page">
  <a class="home-link" href="igcse.html">&larr; IGCSE animations</a>
  <header class="page-head">
    <div class="eyebrow" id="fa-eyebrow">Animations &middot; forces</div>
    <div class="head-line">
      <h1 id="fa-h1">Skydiver and Terminal Velocity</h1>
      <div class="seg tabs" id="fa-level" role="group" aria-label="Level"><button type="button" data-v="ks4" aria-pressed="true">IGCSE</button><button type="button" data-v="ial" aria-pressed="false">IAL</button><button type="button" data-v="ib" aria-pressed="false">IB</button></div>
    </div>
  </header>

  <section class="card stage">
    <div>
      <svg class="view" id="fa-svg" viewBox="0 0 860 340" role="img" aria-label="A skydiver falling, the force diagram of her weight and the air resistance on her, and her velocity–time graph. At IAL and IB her acceleration–time graph is drawn under it."><g id="fa-main"></g><g id="fa-pk"></g></svg>
      <div class="under">
        <div class="btn-group">
          <button class="btn btn-primary" id="fa-play" type="button">&#9654; Jump</button>
          <button class="btn ex-only" id="fa-chute" type="button" disabled>Open parachute</button>
          <button class="btn ex-only" id="fa-reset" type="button">&#8634; Reset</button>
          <button class="btn pr-only" id="fa-new" type="button">New question</button>
          <button class="btn" id="fa-slow" type="button" aria-pressed="false">Slow motion</button>
          <button class="btn to-q" type="button" data-mode="fa-tab" hidden>Try the questions &rarr;</button>
        </div>
        <div class="mass ex-only">
          <label class="lab" for="fa-m"><span id="fa-ml">Zahra&rsquo;s mass</span> <output id="fa-mo"></output></label>
          <input type="range" id="fa-m" min="50" max="110" step="5" value="80">
        </div>
      </div>
    </div>
    <div class="side">
      <div class="seg tabs mode" id="fa-tab" role="group" aria-label="Mode"><button type="button" data-v="explore" aria-pressed="true">Explore</button><button type="button" data-v="predict" aria-pressed="false">Questions</button></div>
      <div class="ex-only" id="fa-ptsbox">
        <div class="lab">Jump to a point</div>
        <div class="seg pts" id="fa-points"><button type="button" data-p="start" aria-pressed="false">Start</button><button type="button" data-p="mid" aria-pressed="false">Mid fall</button><button type="button" data-p="term1" aria-pressed="false">Terminal velocity 1</button><button type="button" data-p="slow" aria-pressed="false">Parachute slowing her</button><button type="button" data-p="term2" aria-pressed="false">Terminal velocity 2</button></div>
      </div>
      <p class="note" id="fa-note" aria-live="polite"></p>
      <div class="stats" id="fa-stats">
        <div class="stat"><small>Time</small><strong id="fa-t">0 s</strong></div>

</div>
<script>
var PW_LEVEL=(location.search.match(/[?&]level=(igcse|ial|ib)\b/)||[])[1]||(/[?&]from=alevel\b/.test(location.search)?'ial':'');
(function(){
  var hl=document.querySelector('.home-link'); if(!hl) return;

  if(L){ hl.href=L[0]; hl.innerHTML='&larr; '+L[1]; }
})();
(function(){
  // This page is the one copy of this animation. On its own it is the lesson version;
  // with ?embed it drops its heading so a workout tab can show it in a frame, and it tells that page its height.
  var EMBED = /[?&]embed\b/.test(location.search);
  if(EMBED){
    document.documentElement.classList.add('embed');

  }
  function $(sel){ return document.querySelector(sel); }

  function SPEED(){ var b=document.getElementById('slow'); return b && b.getAttribute('aria-pressed')==='true' ? 0.3 : 1; }
  (function(){ var b=document.getElementById('slow'); if(b) b.addEventListener('click',function(){ b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed')!=='true')); }); })();
  function num(n, dp){   // round, drop trailing zeros, group thousands with a space from 10 000
    var f = Math.pow(10, dp||0), r = Math.round(n*f)/f, t = String(r);
    if(Math.abs(r)>=10000) t = t.replace(/\B(?=(\d{3})+(?!\d))/g,' ');
    return t;
  }
  function FR(t){
    return String(t).replace(/(\d) (?=\d{3}\b)/g,'$1 ')
      .replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g,'<span class="frac"><span>$1</span><span>$2</span></span>');
  }
  // Each line of a working readout becomes left | = | right, so the = signs sit under each other.
  function alignEquals(el){

    var rows = el.innerHTML.split(/<br\s*\/?>/i).map(function(line){
      var i = line.indexOf(' = ');
      if(i<0) return '<span class="eqg-full">'+line+'</span>';
      return '<span class="eqg-l">'+line.slice(0,i)+'</span><span class="eqg-m">=</span><span class="eqg-r">'+line.slice(i+3)+'</span>';
    });

  }
  function watchEquals(sel){ Array.prototype.forEach.call(document.querySelectorAll(sel), function(el){ alignEquals(el); new MutationObserver(function(){ alignEquals(el); }).observe(el, {childList:true}); }); }

    // ---- solid kit (the same block is in reaction-time.html, roller-coaster-energy.html, heat-transfer.html, density.html and liquid-pressure.html) ----
  function f1(n){ return (+n).toFixed(1); }
  function pts(list){ return list.map(function(p){ return f1(p[0])+','+f1(p[1]); }).join(' '); }

  function ln(x1,y1,x2,y2,col,w,extra){ return '<line x1="'+f1(x1)+'" y1="'+f1(y1)+'" x2="'+f1(x2)+'" y2="'+f1(y2)+'" stroke="'+col+'" stroke-width="'+(w||1)+'"'+(extra||'')+'/>'; }
  function rect(x,y,w,h,fill,extra){ return '<rect x="'+f1(x)+'" y="'+f1(y)+'" width="'+f1(Math.max(0,w))+'" height="'+f1(Math.max(0,h))+'" fill="'+fill+'"'+(extra||'')+'/>'; }
  // text in clear space: halo:1 gives it a panel-coloured edge so a line passing behind never cuts a letter
  function txt(x,y,s,o){ o=o||{}; return '<text x="'+f1(x)+'" y="'+f1(y)+'"'+(o.a?' text-anchor="'+o.a+'"':'')+' font-size="'+(o.fs||12)+'" fill="'+(o.c||'var(--ink-soft)')+'"'+(o.w?' font-weight="'+o.w+'"':'')+(o.halo?' paint-order="stroke" stroke="var(--panel)" stroke-width="4" stroke-linejoin="round"':'')+(o.x||'')+'>'+s+'</text>'; }
  // a solid block: front face at (x, y), w wide and h tall, going back by (dx, dy). Lit top, plain front, darker side.
  function box(x,y,w,h,dx,dy,col,o){ o=o||{};
    return pg([[x,y],[x+w,y],[x+w+dx,y+dy],[x+dx,y+dy]],o.top||col)+(o.top?'':pg([[x,y],[x+w,y],[x+w+dx,y+dy],[x+dx,y+dy]],'#fff',' opacity=".38"'))+
      pg([[x+w,y],[x+w+dx,y+dy],[x+w+dx,y+h+dy],[x+w,y+h]],o.side||col)+(o.side?'':pg([[x+w,y],[x+w+dx,y+dy],[x+w+dx,y+h+dy],[x+w,y+h]],'#000',' opacity=".28"'))+
      rect(x,y,w,h,col); }
  // a round bar or post: a dark core with a lighter streak along it
  function tube(x1,y1,x2,y2,w,col,hi){ var L=Math.hypot(x2-x1,y2-y1)||1, nx=-(y2-y1)/L*w*0.22, ny=(x2-x1)/L*w*0.22; if(ny>0){ nx=-nx; ny=-ny; }
    return ln(x1,y1,x2,y2,col,w,' stroke-linecap="round"')+ln(x1+nx,y1+ny,x2+nx,y2+ny,hi,Math.max(0.8,w*0.3),' stroke-linecap="round"'); }
  function wrapLines(s,n){ var out=[], cur=''; String(s).split(' ').forEach(function(w){ if(cur && (cur+' '+w).length>n){ out.push(cur); cur=w; } else cur=cur?cur+' '+w:w; }); if(cur) out.push(cur); return out; }
  function onPick(svg, fn){
    svg.addEventListener('click', function(e){ var t=e.target.closest('.pick'); if(t){ fn(t.getAttribute('data-pick')); } });
    svg.addEventListener('keydown', function(e){ if(e.key!=='Enter' && e.key!==' ') return; var t=e.target.closest('.pick'); if(t){ e.preventDefault(); fn(t.getAttribute('data-pick')); } });
  }
  function setKeepFocus(el, html){ var f=document.activeElement, k=f && el.contains(f) ? f.getAttribute('data-pick') : null; el.innerHTML=html;
    if(k!==null){ var n=el.querySelector('.pick[data-pick="'+k+'"]'); if(n && n.focus) n.focus(); } }
  function ell(cx,cy,rx,ry,fill,extra){ return '<ellipse cx="'+f1(cx)+'" cy="'+f1(cy)+'" rx="'+f1(rx)+'" ry="'+f1(ry)+'" fill="'+fill+'"'+(extra||'')+'/>'; }
  // a solid arrow from (x1, y1) to its tip at (x2, y2)
  function arrow(x1,y1,x2,y2,col,w,extra){ var a=Math.atan2(y2-y1,x2-x1), s=w*2.2, bx=x2-Math.cos(a)*s*1.5, by=y2-Math.sin(a)*s*1.5;
    return '<g'+(extra||'')+'>'+ln(x1,y1,bx,by,col,w)+'<path d="M'+f1(x2)+','+f1(y2)+' L'+f1(bx-Math.sin(a)*s)+','+f1(by+Math.cos(a)*s)+' L'+f1(bx+Math.sin(a)*s)+','+f1(by-Math.cos(a)*s)+' z" fill="'+col+'"/></g>'; }
  // an upright cylinder (a can, a beaker of liquid): top ellipse at yt, bottom at yb. o.top fills the top; o.hi adds a streak of light.
  function cyl(cx,yt,yb,rx,ry,fill,o){ o=o||{};
    return '<path d="M'+f1(cx-rx)+','+f1(yt)+' L'+f1(cx-rx)+','+f1(yb)+' A'+f1(rx)+','+f1(ry)+' 0 0 0 '+f1(cx+rx)+','+f1(yb)+' L'+f1(cx+rx)+','+f1(yt)+' z" fill="'+fill+'"'+(o.extra||'')+'/>'+
      '<path d="M'+f1(cx+rx*0.45)+','+f1(yt)+' L'+f1(cx+rx*0.45)+','+f1(yb+ry*0.85)+' A'+f1(rx)+','+f1(ry)+' 0 0 0 '+f1(cx+rx)+','+f1(yb)+' L'+f1(cx+rx)+','+f1(yt)+' z" fill="#000" opacity="'+(o.shade==null?0.16:o.shade)+'"/>'+
      (o.hi?ln(cx-rx*0.62,yt+ry+4,cx-rx*0.62,yb-2,o.hi,Math.max(1.6,rx*0.11),' stroke-linecap="round" opacity="'+(o.hiop||0.7)+'"'):'')+
      ell(cx,yt,rx,ry,o.top||fill,o.topx||'')+(o.top?'':ell(cx,yt,rx,ry,'#fff',' opacity=".3"')); }
  // a glass thermometer standing upright: bulb at (x, yb); the scale runs from t0 at y0 up to t1 at y1, and the thread stands at T.
  // o.step: a tick every so many degrees; o.num: a number every so many; o.side: numbers on the right (1) or the left (-1); o.from: first tick;
  // o.nobulb: the bulb is out of sight, inside a can or a cube
  function thermo(x,yb,y0,t0,y1,t1,T,o){ o=o||{};
    var w=o.w||7, yT=y1-9, sc=(y1-y0)/(t1-t0), yy=function(t){ return y0+(t-t0)*sc; }, side=o.side||1, fs=o.fs||11, g='', t;
    g+=rect(x-w/2,yT,w,yb-yT,'var(--thermo)',' rx="'+f1(w/2)+'" stroke="var(--ink-faint)" stroke-width="1"');

    for(t=(o.from==null?t0:o.from); t<=t1+1e-9; t+=(o.step||10)){ var big=!(Math.round(t)%(o.num||20));
      g+=ln(x+side*w/2,yy(t),x+side*(w/2+(big?7:4)),yy(t),'var(--ink-soft)',big?1.3:0.9);
      if(big && !o.nonum) g+=txt(x+side*(w/2+10),yy(t)+fs*0.36,String(Math.round(t)),{a:side>0?'start':'end',fs:fs,c:'var(--ink)'}); }
    return g; }
  // a stopwatch showing s (for example 1:37)
  function stopwatch(x,y,s,k){ k=k||1; var w=78*k, h=40*k;
    return rect(x+w/2-7*k,y-7*k,14*k,9*k,'var(--steel-sh,#3f4a5e)',' rx="2"')+rect(x,y,w,h,'var(--case,#3f4a5e)',' rx="'+f1(9*k)+'"')+rect(x+2,y+2,w-4,h*0.4,'#fff',' rx="'+f1(8*k)+'" opacity=".12"')+
      rect(x+7*k,y+8*k,w-14*k,h-16*k,'var(--panel)',' rx="3"')+txt(x+w/2,y+h/2+5.5*k,s,{a:'middle',fs:15*k,c:'var(--ink)',w:600}); }
  // ---- end of solid kit ----

  /* The picture is 860 x 340: the skydiver in the sky, the force diagram (weight, air resistance and the resultant force,
     all to the same scale) and her velocity–time graph. Under 520px the same code uses a tall viewBox with the graph underneath.
     Explore: Jump, open the parachute, or jump to a fixed point of one standard journey.
     Predict (?show=predict): a point P is marked on the graph of the standard journey; the student clicks the arrow that
     shows the air resistance at P, then Go runs the journey to P and marks it.
     A level switch (IGCSE | IAL | IB): IAL and IB add the resultant force and the acceleration as readings, a = ΣF/m with
     g = 9.81 (IAL) or 9.8 (IB) N kg⁻¹, the tangent to the graph, whose gradient is the acceleration, and her
     acceleration–time graph under the velocity–time graph (the papers ask for its shape and for the areas under it).
     At IAL and IB half the Predict questions ask for the arrow that shows her acceleration at P.
     Question kinds and wording checked against the papers on 11 Nov 2026: 4PH1 Jan 2022 1P Q6(b), Jan 2014 1P Q7,
     May 2019 1P Q8; WPH11 Oct 2020 Q14, June 2025 Q20; IB May 2019 TZ1 P1 Q3, May 2026 TZ2 P2 Q8. */
  function initFallingSim(){
    var mIn=$('#fa-m'), KC=0.25, KO=30, TMAX=60, PLAY=5, OPEN=3, TCHUTE=25;
    // the canopy takes OPEN seconds to fill; that part, and the slowing straight after, play in slow motion
    var t=0, v=0, dist=0, chuteAt=null, pts=[[0,0,10]], running=false, last=0, raf=0, playBtn=$('#fa-play'), pointsEl=$('#fa-points'), slowBtn=$('#fa-slow');
    var svg=$('#fa-svg'), mainG=$('#fa-main'), pkG=$('#fa-pk'), levelEl=$('#fa-level'), tabEl=$('#fa-tab'), L=null;
    var level='ks4', PRED=false, Q=null, std=[];
    function ks5(){ return level!=='ks4'; }
    function G(){ return level==='ial' ? 9.81 : (level==='ib' ? 9.8 : 10); }
    function NAME(){ return level==='ial' ? 'Rose' : (level==='ib' ? 'Jessica' : 'Zahra'); }
    function TV(){ return level==='ib' ? 'terminal speed' : 'terminal velocity'; }
    function ms(){ return ks5() ? 'm s⁻¹' : 'm/s'; }
    function ms2(){ return ks5() ? 'm s⁻²' : 'm/s²'; }
    function s4(x){ return String(+(+x).toPrecision(4)); } function s3(x){ return String(+(+x).toPrecision(3)); }
    function nN(x){ return ks5() ? s4(x) : num(x); }   // a force in newtons
    // symbols: IAL W and D; IB F_g and F_d. svg: true for text in the picture
    function sym(k, inSvg){ var s={W:level==='ib'?'F_g':'W', D:level==='ib'?'F_d':'D', F:level==='ib'?'F':'ΣF'}[k];
      return s.replace(/_(\w)/, inSvg ? '<tspan baseline-shift="sub" font-size="72%">$1</tspan>' : '<sub>$1</sub>'); }
    mIn.addEventListener('input',reset);
    function m(){ return +mIn.value; }
    function opened(tt){ return chuteAt===null||tt<chuteAt ? 0 : Math.min(1,(tt-chuteAt)/OPEN); }
    function k(tt){ var f=opened(tt); return KC+(KO-KC)*f*f; }
    function autoRate(){ if(PRED) return 8; if(chuteAt===null||t<chuteAt) return PLAY; var d=t-chuteAt; return d<OPEN+1 ? 0.5 : (d<OPEN+4 ? 1 : PLAY); }
    function slowOn(){ return slowBtn.getAttribute('aria-pressed')==='true'; }

    function drag(){ return k(t)*v*v; }
    function accNow(){ return (m()*G()-drag())/m(); }
    function step(dt){   // small fixed steps keep the parachute opening stable
      var n=Math.ceil(dt/0.005), h=dt/n;
      for(var i=0;i<n;i++){ var a=(m()*G()-k(t)*v*v)/m(); v=Math.max(0,v+a*h); dist+=v*h; t+=h; }

    }
    function advance(to){ while(t<to-1e-9) step(Math.min(0.2,to-t)); }
    function narrow(){ return window.innerWidth<=520; }
    // IAL and IB: the acceleration–time graph (GA) sits under a shorter velocity–time graph (GR), on the same time axis
    function lay(){ var two=ks5(); return narrow()
      ? {tall:true, W:430, H:two?716:566, fs:11.5, S:{x:6,y:6,w:196,h:296,cx:104,cy:204,k:1.2}, F:{x:314,y:150,sc:0.062,cap:96,px:[262,302,342,382],wx:228,ty:20,vw:29,vx:216}, GR:{x0:52,x1:414,y0:340,y1:two?490:510}, GA:{y0:520,y1:660}}
      : {tall:false, W:860, H:340, fs:12, S:{x:6,y:6,w:208,h:328,cx:110,cy:222,k:1.3}, F:{x:326,y:160,sc:0.07,cap:118,px:[296,338,380,422],wx:250,ty:24,vw:33,vx:232}, GR:{x0:500,x1:848,y0:24,y1:two?150:284}, GA:{y0:176,y1:296}}; }
    // ---- the scene: sky, clouds going up past her, the aeroplane she has just left, the parachute and the skydiver ----
    function scene(){
      var S=L.S, cx=S.cx, cy=S.cy, K=S.k, g='', i, f=opened(t), open=chuteAt!==null&&t>=chuteAt, u=Math.min(1,v/20);
      g+='<clipPath id="fa-clip"><rect x="'+S.x+'" y="'+S.y+'" width="'+S.w+'" height="'+S.h+'" rx="10"/></clipPath><g clip-path="url(#fa-clip)">'+rect(S.x,S.y,S.w,S.h,'var(--sky)');
      [[0.2,40,1],[0.78,150,0.8],[0.3,270,1.15],[0.86,360,0.9],[0.1,450,0.7]].forEach(function(c){
        var span=S.h+120, y=S.y-60+(((c[1]-dist*0.6)%span)+span)%span, x=S.x+c[0]*S.w, r=15*c[2]*K;
        g+=ell(x,y,r*1.9,r*0.75,'var(--cloud)')+ell(x-r*0.7,y-r*0.45,r*0.9,r*0.7,'var(--cloud)')+ell(x+r*0.5,y-r*0.6,r*1.05,r*0.85,'var(--cloud)'); });
      var py=S.y+34*K-dist*4;   // the aeroplane is left behind above her
      if(py>-70) g+='<g transform="translate('+f1(cx-18*K)+' '+f1(py)+') scale('+K+')">'+pg([[-78,-6],[-96,-30],[-84,-30],[-62,-8]],'var(--plane)')+rect(-86,-10,150,24,'var(--plane)',' rx="12"')+rect(-80,-8,138,6,'#fff',' rx="3" opacity=".3"')+pg([[-20,6],[30,6],[10,26],[-34,26]],'var(--steel-sh)')+rect(34,-5,13,9,'var(--car-glass)',' rx="2"')+rect(-4,-6,13,18,'#1d2430',' rx="2"')+'</g>';

      if(open){ var cw=(12+58*f)*K, ch=cy-(42+44*f)*K, ct=ch-(14+52*f)*K, n=4, j, d='M'+f1(cx-cw)+','+f1(ch)+' Q'+f1(cx-cw)+','+f1(ct)+' '+f1(cx)+','+f1(ct)+' Q'+f1(cx+cw)+','+f1(ct)+' '+f1(cx+cw)+','+f1(ch);
        for(j=n;j>0;j--){ var xa=cx-cw+2*cw*j/n, xb=cx-cw+2*cw*(j-1)/n; d+=' Q'+f1((xa+xb)/2)+','+f1(ch-9*f*K)+' '+f1(xb)+','+f1(ch); }
        for(j=0;j<=n;j++){ var lx=cx-cw+2*cw*j/n; g+=ln(lx,ch,cx+(j<n/2?-5:(j>n/2?5:0))*K,cy-12*K,'var(--ink-faint)',0.9); }
        g+='<path d="'+d+' Z" fill="var(--chute)"/>';

        g+='<path d="M'+f1(cx-cw*0.82)+','+f1(ch-6*K*f)+' Q'+f1(cx-cw*0.8)+','+f1(ct+6*K)+' '+f1(cx-cw*0.2)+','+f1(ct+3*K)+'" fill="none" stroke="#fff" stroke-width="'+f1(2.2*K)+'" stroke-linecap="round" opacity=".45"/>';
      }
      // the skydiver: a girl with a ponytail and a solid dress. Legs first, then the dress, then the arms, hair and head on top.
      g+='<g transform="translate('+f1(cx)+' '+f1(cy)+') scale('+K+')">';
      g+=tube(-5,16,-8,37,6,'var(--skin)','var(--skin)')+tube(5,16,8,37,6,'var(--skin)','var(--skin)')+ell(-9,40,5.5,3.4,'#23262c')+ell(9,40,5.5,3.4,'#23262c');
      g+=pg([[-6.5,-13],[6.5,-13],[15,18],[-15,18]],'var(--accent)')+pg([[2,-13],[6.5,-13],[15,18],[7,18]],'#000',' opacity=".16"')+pg([[-5,-11],[-2.5,-11],[-8,16],[-12.5,16]],'#fff',' opacity=".2"');
      var hx=open?12:23, hy=open?-31:-17-6*u;   // her hands: out to the sides in free fall, up on the lines under the parachute
      g+=tube(-6,-10,-hx,hy,5,'var(--accent)','var(--accent)')+tube(6,-10,hx,hy,5,'var(--accent)','var(--accent)')+'<circle cx="'+(-hx)+'" cy="'+f1(hy)+'" r="3.2" fill="var(--skin)"/><circle cx="'+hx+'" cy="'+f1(hy)+'" r="3.2" fill="var(--skin)"/>';
      g+=rect(-2.5,-18,5,6,'var(--skin)');
      g+='<path d="M6,-31 Q'+f1(17-2*u)+','+f1(-28-10*u)+' '+f1(15-1*u)+','+f1(-14-24*u)+'" fill="none" stroke="var(--hair)" stroke-width="5" stroke-linecap="round"/>';   // the ponytail streams upwards as she falls faster
      g+='<circle cx="0" cy="-26" r="10" fill="var(--hair)"/><circle cx="0" cy="-24" r="8.4" fill="var(--skin)"/><path d="M-8.6,-25 Q-6,-34 0,-33.5 Q6,-34 8.6,-25 Q4,-30 0,-29.5 Q-4,-30 -8.6,-25 Z" fill="var(--hair)"/><circle cx="-3" cy="-23.5" r="1" fill="#23262c"/><circle cx="3" cy="-23.5" r="1" fill="#23262c"/>';
      g+='</g></g>';

          '<rect class="ring" x="'+f1(x-17)+'" y="'+f1(F.y-F.cap-6)+'" width="34" height="'+f1(F.cap+38)+'" rx="6" fill="'+(sel&&!Q.done?'var(--accent-soft)':'transparent')+'" stroke-width="2"/>'+
          upArrow(x,y0,len,col,!(sel||(Q.done&&p[0]===Q.ans)),sel?4:2,qa?'zero':'')+'<circle cx="'+f1(x)+'" cy="'+f1(y0)+'" r="3" fill="'+col+'"/>'+txt(x,F.y+22,'ABCD'.charAt(i),{a:'middle',fs:13,c:col,w:700})+'</g>'; });

    function graph(){

      if(two){   // the acceleration–time graph: the area above the axis is the velocity gained, the area below it the velocity lost
        var A=L.GA, AMIN=-30, AMAX=10, ay=function(a){ return A.y1-(Math.max(AMIN,Math.min(AMAX,a))-AMIN)/(AMAX-AMIN)*(A.y1-A.y0); }, low=0, lowT=0;
        for(i=0;i<=60;i+=10) g+=ln(gx(i),A.y0,gx(i),A.y1,'var(--panel-border)',1)+txt(gx(i),A.y1+15,String(i),{a:'middle',fs:11,c:'var(--ink-faint)'});
        for(i=AMIN;i<=AMAX;i+=10) g+=ln(R.x0,ay(i),R.x1,ay(i),'var(--panel-border)',1)+txt(R.x0-6,ay(i)+4,String(i).replace('-','−'),{a:'end',fs:11,c:'var(--ink-faint)'});
        g+=ln(R.x0,A.y0,R.x0,A.y1,'var(--ink-soft)',2)+ln(R.x0,ay(0),R.x1,ay(0),'var(--ink-soft)',2)+txt((R.x0+R.x1)/2,A.y1+33,'Time t / s',{a:'middle',fs:12});
        g+='<text transform="translate('+f1(R.x0-32)+' '+f1((A.y0+A.y1)/2)+') rotate(-90)" text-anchor="middle" font-size="11" fill="var(--ink-soft)">Acceleration a / m s⁻²</text>';
        var al=pts.concat([[t,v,accNow()]]), aline=al.map(function(q){ if(q[2]<low){ low=q[2]; lowT=q[0]; } return [gx(q[0]),ay(q[2])]; });
        g+=pg([[gx(0),ay(0)]].concat(aline).concat([[gx(t),ay(0)]]),'var(--balance)',' opacity=".2"')+pl(aline,'var(--balance)',2.2);
        if(low<AMIN) g+=txt(gx(lowT)+7,A.y1-5,'down to '+s3(low).replace('-','−'),{fs:10.5,c:'var(--balance)'});   // the opening parachute takes the line off the scale
        if(t>0) g+='<circle cx="'+f1(gx(t))+'" cy="'+f1(ay(accNow()))+'" r="4.5" fill="var(--balance)" stroke="var(--panel)" stroke-width="2"/>';
      }

        g+=txt(R.x1,R.y0-8,'gradient of the tangent = a = '+s3(a).replace('-','−')+' '+ms2(),{a:'end',fs:L.fs,c:'var(--balance)',w:600});

      if(t>0) g+='<circle cx="'+f1(gx(t))+'" cy="'+f1(gy(v))+'" r="5" fill="var(--motion)" stroke="var(--panel)" stroke-width="2"/>';

    function draw(){
      L=lay(); svg.setAttribute('viewBox','0 0 '+L.W+' '+L.H); svg.classList.toggle('tall', !!L.tall);

      $('#fa-res').textContent=(Math.abs(F)<0.5?'0':s3(Math.abs(F)))+' N'+(dir?(F>0?' ↓':' ↑'):''); $('#fa-acc').textContent=(F<-0.5?'−':'')+s3(a)+' '+ms2();

      if(PRED && Q){
        if(Q.done) note=(Q.pick===Q.ans?'Correct. ':'Not quite. ')+Q.why+' Press New question for another point.';
        else if(running) note=N+' is falling. Watch the graph reach P.';
        else note=N+' jumps, then opens her parachute after '+TCHUTE+' s. The dashed line is her velocity–time graph. Click the arrow (A to D) that shows '+(Q.kind==='acc'?'her acceleration':'the air resistance on her')+' at point P, then press Go.'+(Q.need?' Choose an arrow first.':'');

    if(!EMBED) $('.head-line').insertBefore(tabEl, levelEl);

    // ---- level: IGCSE (the default), IAL or IB ----
    function setLevel(lv){

      $('#fa-h1').firstChild.nodeValue=level==='ib'?'Skydiver and Terminal Speed':'Skydiver and Terminal Velocity';
      pointsEl.children[2].textContent=level==='ib'?'Terminal speed 1':'Terminal velocity 1'; pointsEl.children[4].textContent=level==='ib'?'Terminal speed 2':'Terminal velocity 2';

/* Choice kit (12 Nov 2026): the same block on every animation page. See tools/ANIMATION-STYLE.md, "Choices".

(function(){
  function on(b){ return b.getAttribute('aria-pressed')==='true' || b.classList.contains('is-on'); }

  function mark(s){
    if(!s.classList.contains('pick')){
      var n=0; Array.prototype.forEach.call(s.children, function(b){ if(b.tagName==='BUTTON' && on(b)) n++; });
      if(n===1) s.classList.add('pick');
    }
    if(s.classList.contains('pick') && !s.hasAttribute('data-fit')){
      var d=getComputedStyle(s).display;
      if(d!=='none'){ s.setAttribute('data-fit','1'); if(d.indexOf('flex')>=0) s.classList.add('fit'); }
    }
  }
  each('.seg:not(.tabs):not(.mode):not(.apps)', function(s){
    mark(s);
    if(window.MutationObserver) new MutationObserver(function(){ mark(s); }).observe(s, {childList:true, subtree:true, attributes:true, attributeFilter:['aria-pressed','class']});
  });
  each('.to-q[data-mode]', function(b){
    var seg=document.getElementById(b.getAttribute('data-mode')); if(!seg) return;
    var bs=seg.querySelectorAll('button');
    function sync(){ b.hidden=!on(bs[0]) || !seg.getClientRects().length; }   // hidden too when the page hides its mode switch (e.g. at a level with no questions)
    b.addEventListener('click', function(){ bs[1].click(); bs[1].focus(); });
    if(window.MutationObserver) new MutationObserver(sync).observe(seg, {subtree:true, attributes:true, attributeFilter:['aria-pressed']});
    document.addEventListener('click', function(){ setTimeout(sync, 0); });
    sync(); setTimeout(sync, 0);
  });
})();
</script>
