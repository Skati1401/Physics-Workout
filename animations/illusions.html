<script>
  // Visit counter (GoatCounter: no cookies, no personal data). Skipped when a page is embedded in a workout, so a visit counts once.
  // pwCountTab(tab, label): counts each workout tab once per visit as a GoatCounter event (path "page#tab"), skipped in frames the same way.
  (function(){
    var off = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var seen = {}, queue = [];
    function send(e){ try { window.goatcounter.count(e); } catch (x) {} }
    window.pwCountTab = function(tab, label){
      if (off || !tab || seen[tab]) return;
      seen[tab] = 1;
      var page = (location.pathname.split('/').pop() || 'index').replace(/\.html$/, '');
      var e = { path: page + '#' + tab, title: (label || tab) + ' \u00b7 ' + document.title, event: true };
      if (window.goatcounter && window.goatcounter.count) send(e); else queue.push(e);
    };
    if (off) return;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://gc.zgo.at/count.js';
    s.setAttribute('data-goatcounter', 'https://physics-workout.goatcounter.com/count');
    s.onload = function(){ var q = queue; queue = []; q.forEach(send); };
    document.head.appendChild(s);
  })();
</script>

<script>
  // Draft tags and Alex's reviewer button (tools/review/drafts.py writes this block; edit tools/review/snippet.html, then run drafts.py sync).
  // A page is Draft while its row in tools/REVIEW.md is not ✅: <meta name="pw-draft"> on the page, data-draft on its list cards.
  // ?reviewer (once, on any page) turns on reviewer mode in this browser; ?reviewer=off turns it off.
  (function(){
    var on = false, embed = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var m = /[?&]reviewer(?:=([^&]*))?/.exec(location.search);
    on = !!m && m[1] !== 'off';
    try {
      if (m) { if (m[1] === 'off') localStorage.removeItem('pw-reviewer'); else localStorage.setItem('pw-reviewer', '1'); }
      else on = localStorage.getItem('pw-reviewer') === '1';
    } catch (e) {}
    var CSS = '.pw-draft{display:inline-block;vertical-align:middle;margin-left:10px;font:600 11.5px/1.4 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:0;color:var(--bad,#b42318);border:1px dashed currentColor;border-radius:5px;padding:1px 7px;white-space:nowrap}'
      + '.act-top .pw-draft{margin-left:auto;flex:none}.act-top .pw-draft~.cp-tag,.act-top .pw-draft~.ta-tag{margin-left:0}'
      + 'a[data-draft]{position:relative}.pw-draft.pw-corner{position:absolute;top:10px;right:10px;margin:0;background:var(--panel,#fff)}'
      + '.pw-check{display:inline-block;vertical-align:middle;margin-left:8px;font:600 13px/1.4 "IBM Plex Sans",system-ui,sans-serif;color:#fff;background:#1a7f37;border-radius:6px;padding:4px 10px;text-decoration:none;white-space:nowrap}'
      + '.pw-check:hover{background:#116329}.pw-check:focus-visible{outline:2px solid #1a7f37;outline-offset:2px}'
      + '.pw-reviewer{position:fixed;left:10px;bottom:10px;z-index:9999;font:500 12px/1.4 "IBM Plex Mono",ui-monospace,monospace;background:#1d2433;color:#fff;border-radius:6px;padding:4px 9px;opacity:.85}'
      + '.pw-reviewer a{color:#ffc83d}';
    function tag(){ var t = document.createElement('span'); t.className = 'pw-draft'; t.title = 'Not yet checked'; t.textContent = 'Draft'; return t; }
    function go(){
      var st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st);
      var meta = document.querySelector('meta[name="pw-draft"]'), h1 = document.querySelector('h1');
      if (meta && h1 && !embed) {
        h1.appendChild(tag());
        if (on) {
          var page = meta.getAttribute('content'), b = document.createElement('a');
          b.className = 'pw-check'; b.target = '_blank'; b.rel = 'noopener'; b.textContent = '✓ Checked';
          b.title = 'Opens a GitHub issue. Submit it and the Draft tag goes in a minute or two.';
          b.href = 'https://github.com/Skati1401/Physics-Workout/issues/new?title=' + encodeURIComponent('Checked: ' + page)
            + '&body=' + encodeURIComponent('Submit this issue to mark `' + page + '` as checked. The Draft tag goes in a minute or two, and the issue closes itself.');
          h1.appendChild(b);
        }
      }
      document.querySelectorAll('a[data-draft]').forEach(function(a){
        if (a.querySelector('.pw-draft')) return;
        var t = tag(), top = a.querySelector('.act-top');
        if (top) top.insertBefore(t, top.querySelector('.cp-tag,.ta-tag'));
        else { t.className += ' pw-corner'; a.appendChild(t); }
      });
      // No tag on a unit or theme heading (Alex, 12 Nov 2026): only the pages and their cards.
      if (on && !embed) {
        // Carry ?reviewer in every link to another page of the site, so reviewer mode survives
        // browsers that clear site storage (school Chromebooks) and pages cached from before.
        var carry = function(a){
          try {
            var u = new URL(a.href, location.href);
            if (u.origin !== location.origin || !/(\.html|\/)$/.test(u.pathname) || u.searchParams.has('reviewer')) return;
            u.searchParams.set('reviewer', ''); a.href = u.href.replace('reviewer=', 'reviewer');
          } catch (e) {}
        };
        document.querySelectorAll('a[href]').forEach(carry);
        ['click', 'auxclick', 'contextmenu'].forEach(function(ev){
          document.addEventListener(ev, function(e){ var a = e.target.closest && e.target.closest('a[href]'); if (a) carry(a); }, true);
        });
        var r = document.createElement('div'); r.className = 'pw-reviewer';
        r.innerHTML = 'Reviewer mode · <a href="' + location.pathname + '?reviewer=off">turn off</a>';
        document.body.appendChild(r);
      }
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
  })();
</script>

<script>
(function(){
'use strict';
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
const pic=$('pic'), ctl=$('ctl'), note=$('note');
function S(tag,at,parent){const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);(parent||pic).appendChild(e);return e;}
function button(label,primary){const b=document.createElement('button');b.type='button';b.className='btn'+(primary?' btn-primary':'');b.textContent=label;ctl.appendChild(b);return b;}
function toggle(label,fn){const b=button(label);b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);fn(on);});return b;}
function slider(label,min,max,val,step,fn){const w=document.createElement('label');w.className='slide';const t=document.createElement('span');t.textContent=label;const i=document.createElement('input');i.type='range';i.min=min;i.max=max;i.step=step;i.value=val;w.append(t,i);ctl.appendChild(w);i.addEventListener('input',()=>fn(+i.value));return i;}
function say(html){note.innerHTML=html;}
const pct=x=>Math.round(Math.abs(x)*100);

/* Method of adjustment: the student sets one shape to match the other, then Check shows how far out they were. */
function matchGame(o){
  let starts=o.starts, n=0, done=false;
  const sl=slider(o.label,o.min,o.max,starts[0],o.step,v=>{if(done)return;o.set(v);});
  const chk=button('Check',true), again=button('Try again');
  again.disabled=true;
  function begin(){done=false;sl.disabled=false;sl.value=starts[n%starts.length];o.set(+sl.value);o.reveal(false);chk.disabled=false;again.disabled=true;say(o.start);}
  chk.addEventListener('click',()=>{
    done=true;sl.disabled=true;chk.disabled=true;again.disabled=false;o.reveal(true);
    const d=(+sl.value-o.truth)/o.truth;
    say(pct(d)<2?'<b>Within 2%.</b> You beat the illusion. The dashed guides show the true size.'
      :'<b>Yours is '+pct(d)+'% too '+(d>0?o.big:o.small)+'.</b> The dashed guides show the true size. '+(d>0===o.expectBig?o.typical:'Most people go the other way. Try again without overthinking it.'));
  });
  again.addEventListener('click',()=>{n++;begin();});
  begin();
}

const ILL={
/* ---------- 1 Checker shadow ---------- */
checker:{name:'Checker shadow',title:'Which square is darker, A or B?',
 steps:['Look at squares A and B. Decide which is darker.','Now press <b>Hide everything else</b>. Look again.','Press <b>Join A and B</b> to connect them with a bar of the same grey.'],
 start:'Decide first: A or B?',
 why:['Squares A and B are exactly the same grey. The same amount of light reaches your eye from each.',
  'Your brain is not trying to measure light. It is trying to work out what the board is made of. B is in a shadow and has darker squares all round it, so your brain decides it must be a light square in the shade. A is in full light with lighter squares round it, so it must be a dark square.',
  'Take away the shadow and the neighbours, and the clues are gone. Then you see the two greys as they really are.'],
 credit:'After the checker shadow illusion by Edward H. Adelson, 1995. Redrawn.',
 build(){
  const G='#787878';                       /* A and B: both exactly RGB 120, 120, 120 */
  const M='matrix(80,0,-36,50,190,75)';    /* board drawn on a 5 x 5 grid, then sheared */
  const defs=S('defs',{});
  const f=S('filter',{id:'cs-blur',x:'-20%',y:'-20%',width:'140%',height:'140%'},defs);S('feGaussianBlur',{stdDeviation:'0.13'},f);
  const g=S('g',{transform:M});
  for(let i=0;i<5;i++)for(let j=0;j<5;j++)S('rect',{x:i,y:j,width:1.01,height:1.01,fill:(i+j)%2?G:'#d2d2d2'},g);
  /* shadow: black at 3/7 opacity turns the light squares (210) into 120 */
  S('rect',{x:0,y:0,width:5,height:5},S('clipPath',{id:'cs-clip'},defs));
  S('polygon',{points:'1.0,1.6 4.3,1.0 5,1.6 5,2.4 2.0,4.4',fill:'#000','fill-opacity':3/7,filter:'url(#cs-blur)'},S('g',{'clip-path':'url(#cs-clip)'},g));
  S('rect',{x:2,y:2,width:1,height:1,fill:G},g);           /* B, redrawn in the exact grey */
  S('rect',{x:1,y:0,width:1,height:1,fill:G},g);           /* A */
  const join=S('polygon',{points:'1,0 2,0 3,2 3,3 2,3 1,1',fill:G,visibility:'hidden'},g);
  const mask=S('path',{d:'M-9,-9H14V14H-9Z M1,0H2V1H1Z M2,2H3V3H2Z','fill-rule':'evenodd',fill:'#fff',visibility:'hidden'},g);
  const board=S('polygon',{points:'0,0 5,0 5,5 0,5',fill:'none',stroke:'#555','stroke-width':0.03},g);
  /* cylinder standing on the board, casting the shadow */
  const cyl=S('g',{});
  S('path',{d:'M456,42 V150 A40,17 0 0 0 536,150 V42 Z',fill:'#3f9b5c'},cyl);
  S('path',{d:'M504,42 V166 A40,17 0 0 0 536,150 V42 Z',fill:'#2f7a47'},cyl);
  S('ellipse',{cx:496,cy:42,rx:40,ry:17,fill:'#63c183'},cyl);
  const lab=(t,x,y)=>{const e=S('text',{x,y,'text-anchor':'middle','font-family':'IBM Plex Sans,sans-serif','font-weight':700,'font-size':24,fill:'#fff',stroke:'#000','stroke-width':3,'paint-order':'stroke'});e.textContent=t;};
  lab('A',292,108);lab('B',300,208);
  toggle('Hide everything else',on=>{mask.setAttribute('visibility',on?'visible':'hidden');cyl.setAttribute('visibility',on?'hidden':'visible');board.setAttribute('visibility',on?'hidden':'visible');say(on?'Only A and B are left. <b>Are they different now?</b>':'The board is back. Does B look lighter again, even though you know?');});
  toggle('Join A and B',on=>{join.setAttribute('visibility',on?'visible':'hidden');say(on?'The bar is one grey all the way along. <b>It matches A and it matches B.</b>':'The bar has gone. The illusion comes straight back.');});
 }},
/* ---------- 2 Müller-Lyer ---------- */
'muller-lyer':{name:'Arrow lines',title:'Which blue line is longer?',
 steps:['Move the slider until the bottom blue line looks the same length as the top one.','Press <b>Check</b> to see how close you were.'],
 start:'Make the two blue lines look the same length. Only the blue parts count.',
 why:['Almost everyone makes the bottom line too long. The fins change how long each line looks: fins that point outwards make a line look longer, and fins that point inwards make it look shorter.',
  'Scientists do not fully agree on why. One idea is that your brain reads the fins as a clue about depth, like the corners of a room or a building, and corrects the size of the line to match. Another is that your brain cannot fully separate the line from its fins, so it judges the length of the whole shape.',
  'Either way, knowing the answer does not switch the illusion off.'],
 credit:'Müller-Lyer illusion, 1889.',
 build(){
  const L=240,cx=300,yT=120,yB=265,F=36,a=40*Math.PI/180,fx=F*Math.cos(a),fy=F*Math.sin(a);
  const blue='#1f5fe0',st={stroke:'#222','stroke-width':4,'stroke-linecap':'round'};
  const fin=(x,y,dir,p)=>{S('line',Object.assign({x1:x,y1:y,x2:x+dir*fx,y2:y-fy},st),p);S('line',Object.assign({x1:x,y1:y,x2:x+dir*fx,y2:y+fy},st),p);};
  fin(cx-L/2,yT,-1);fin(cx+L/2,yT,1);
  S('line',{x1:cx-L/2,y1:yT,x2:cx+L/2,y2:yT,stroke:blue,'stroke-width':6});
  const gB=S('g',{});
  const gd=S('g',{visibility:'hidden'});
  [-1,1].forEach(s=>S('line',{x1:cx+s*L/2,y1:yT-50,x2:cx+s*L/2,y2:yB+50,stroke:'#d9720c','stroke-width':2,'stroke-dasharray':'7 6'},gd));
  matchGame({label:'Length of the bottom line',min:150,max:330,step:2,starts:[176,310,200,290],truth:L,big:'long',small:'short',expectBig:true,
   start:this.start,typical:'Most people make it too long, like you.',
   set(v){gB.textContent='';fin(cx-v/2,yB,1,gB);fin(cx+v/2,yB,-1,gB);S('line',{x1:cx-v/2,y1:yB,x2:cx+v/2,y2:yB,stroke:blue,'stroke-width':6},gB);},
   reveal(on){gd.setAttribute('visibility',on?'visible':'hidden');}});
 }},
/* ---------- 3 Ebbinghaus ---------- */
ebbinghaus:{name:'Orange circles',title:'Which orange circle is bigger?',
 steps:['Move the slider until the right-hand orange circle looks the same size as the left-hand one.','Press <b>Check</b> to see how close you were.','Press <b>Hide the grey circles</b> and compare again.'],
 start:'Make the two orange circles look the same size.',
 why:['Your brain judges size by comparing a thing with what is next to it. Beside big grey circles, the orange circle looks small. Beside small grey circles, it looks big.',
  'So to make the two look equal, most people make the right-hand circle too small. How close the grey circles sit to the orange one matters as well.',
  'Hide the grey circles and there is nothing to compare with, so the illusion goes.'],
 credit:'Ebbinghaus illusion (Titchener circles), about 1900.',
 build(){
  const R=30,grey='#9aa3b2',or='#f28c1c';
  const gG=S('g',{});
  for(let k=0;k<6;k++){const t=k*Math.PI/3;S('circle',{cx:160+105*Math.cos(t),cy:190+105*Math.sin(t),r:50,fill:grey},gG);}
  for(let k=0;k<8;k++){const t=k*Math.PI/4;S('circle',{cx:450+64*Math.cos(t),cy:190+64*Math.sin(t),r:11,fill:grey},gG);}
  S('circle',{cx:160,cy:190,r:R,fill:or});
  const c=S('circle',{cx:450,cy:190,r:R,fill:or});
  const gd=S('g',{visibility:'hidden'});
  [-1,1].forEach(s=>S('line',{x1:100,y1:190+s*R,x2:520,y2:190+s*R,stroke:'#1d2433','stroke-width':1.5,'stroke-dasharray':'7 6'},gd));
  matchGame({label:'Size of the right-hand orange circle',min:18,max:46,step:0.5,starts:[40,21,36,24],truth:R,big:'big',small:'small',expectBig:false,
   start:this.start,typical:'Most people make it too small, like you.',
   set(v){c.setAttribute('r',v);},reveal(on){gd.setAttribute('visibility',on?'visible':'hidden');}});
  toggle('Hide the grey circles',on=>gG.setAttribute('visibility',on?'hidden':'visible'));
 }},
/* ---------- 4 Munker ---------- */
munker:{name:'Striped circles',title:'Are these two circles the same colour?',
 steps:['Decide what colour each circle is.','Move the slider to fade the blue and yellow stripes away.','Slide back and watch the two colours split apart again.'],
 start:'Left circle, right circle: what colours do you see?',
 why:['Both circles are made of stripes of exactly the same red. In the left circle the red stripes sit between blue stripes, and in the right circle they sit between yellow stripes.',
  'Your eye sees fine detail in brightness much better than fine detail in colour. With stripes this thin, the colour of each red stripe gets partly mixed with its neighbours: red with blue looks purple or pink, and red with yellow looks orange.',
  'So the colour you see depends on what is around it, not just on the light from the stripe itself. Screens use the same fact: each pixel is separate red, green and blue lights that your eye blends.'],
 credit:'Munker illusion (Munker, 1970).',
 build(){
  const h=5,red='#ff2d2d',defs=S('defs',{});
  S('circle',{cx:165,cy:190,r:78},S('clipPath',{id:'mk-l'},defs));
  S('circle',{cx:435,cy:190,r:78},S('clipPath',{id:'mk-r'},defs));
  const bg=S('g',{}),l=S('g',{'clip-path':'url(#mk-l)'}),r=S('g',{'clip-path':'url(#mk-r)'});
  for(let k=0;k*h<380;k++){
    S('rect',{x:0,y:k*h,width:600,height:h,fill:k%2?'#1c3cff':'#ffe81a'},bg);
    S('rect',{x:0,y:k*h,width:600,height:h,fill:red},k%2?r:l);   /* left: red in place of yellow; right: red in place of blue */
  }
  slider('Fade the blue and yellow stripes',0,100,0,1,v=>{bg.setAttribute('opacity',1-v/100);
    say(v>=95?'<b>Both circles are the same red.</b> Only the stripes around them were different.':v>0?'Keep going. Watch both circles as the stripes fade.':ILL.munker.start);});
 }},
/* ---------- 5 Café wall ---------- */
'cafe-wall':{name:'Café wall',title:'Are the grey lines parallel?',
 steps:['Decide whether the grey lines between the rows are parallel.','Press <b>Show a straight edge</b> to check one.','Now slide the rows until the lines look straight. Then try changing the shade of the lines.'],
 start:'Do the grey lines slope, or are they parallel?',
 why:['Every grey line is straight and level. The lines only look sloped when the rows of tiles are out of step.',
  'Look where a black tile sits just above a white tile. The thin grey line between them is darker than the white and lighter than the black, so your eye sees a tiny slanted wedge there. Your brain joins all the little wedges along a row into one long sloping line.',
  'Line the tiles up, or make the lines black or white, and the wedges disappear. So does the slope.'],
 credit:'Café wall illusion, described by Richard Gregory and Priscilla Heard, 1979.',
 build(){
  const T=50,H=36,m=3,pat=[0,1,2,1,0,1,2,1,0];let shift=12,shade=136;
  const g=S('g',{}),mort=S('g',{});
  for(let r=0;r<=9;r++)S('rect',{x:0,y:r*(H+m)+8,width:600,height:m},mort);
  const ey=4*(H+m)+8+m/2,edge=S('line',{x1:0,y1:ey,x2:600,y2:ey,stroke:'#e0201b','stroke-width':1.5,visibility:'hidden'});
  function draw(){g.textContent='';
    for(let r=0;r<9;r++)for(let k=-2;k<8;k++)S('rect',{x:k*2*T+pat[r]*shift,y:r*(H+m)+8+m,width:T,height:H,fill:'#000'},g);
    mort.setAttribute('fill','rgb('+shade+','+shade+','+shade+')');}
  draw();
  toggle('Show a straight edge',on=>{edge.setAttribute('visibility',on?'visible':'hidden');say(on?'The red line is perfectly straight. <b>The grey line follows it all the way across.</b>':ILL['cafe-wall'].start);});
  slider('Slide the rows',0,25,shift,1,v=>{shift=v;draw();say(v===0?'<b>Tiles lined up: the slope has gone.</b> The grey lines have not moved.':v===25?'<b>A plain chessboard: no slope.</b> The slope needs rows that are partly out of step.':'The grey lines never move. Only the tiles slide.');});
  slider('Shade of the lines: black to white',0,255,shade,1,v=>{shade=v;draw();say(v<40||v>215?'<b>The slope fades.</b> It only works when the lines are a grey in between black and white.':'A mid grey gives the strongest slope.');});
 }},
/* ---------- 6 Shepard's tables ---------- */
shepard:{name:'Two tables',title:'Which table top is longer?',
 steps:['Decide which table top is longer, and which is wider.','Move the slider to lift the left-hand top and carry it over to the right-hand table.'],
 start:'Longer? Wider? Decide before you move anything.',
 why:['The two table tops are exactly the same shape and size on the screen. One is just turned round.',
  'Your brain does not see flat shapes here. It sees two tables in 3D. The left-hand table seems to stretch away from you, and things that stretch away look shorter in a picture than they really are. So your brain "corrects" it and tells you that table is long and thin.',
  'The legs and the angles are the clues it uses. It is the right guess for real tables, and the wrong one for a flat drawing.'],
 credit:'After "Turning the tables" by Roger N. Shepard, 1990. Redrawn.',
 build(){
  const l=[34,-178],s=[92,-26],a0=[70,265],th=72;            /* long edge, short edge, corner, turn in degrees */
  const P=[a0,[a0[0]+s[0],a0[1]+s[1]],[a0[0]+s[0]+l[0],a0[1]+s[1]+l[1]],[a0[0]+l[0],a0[1]+l[1]]];
  const cA=[a0[0]+(s[0]+l[0])/2,a0[1]+(s[1]+l[1])/2],cB=[432,170];
  const rot=(p,deg)=>{const t=deg*Math.PI/180,x=p[0]-cA[0],y=p[1]-cA[1];return[cA[0]+x*Math.cos(t)-y*Math.sin(t),cA[1]+x*Math.sin(t)+y*Math.cos(t)];};
  const Q=P.map(p=>{const q=rot(p,th);return[q[0]+cB[0]-cA[0],q[1]+cB[1]-cA[1]];});
  const pts=A=>A.map(p=>p[0].toFixed(2)+','+p[1].toFixed(2)).join(' ');
  const leg=(p,len)=>S('line',{x1:p[0],y1:p[1],x2:p[0],y2:p[1]+len,stroke:'#3b2a1a','stroke-width':7,'stroke-linecap':'round'});
  P.concat(Q).forEach(p=>leg(p,78));
  const top={fill:'#c98f4e',stroke:'#3b2a1a','stroke-width':3,'stroke-linejoin':'round'};
  S('polygon',Object.assign({points:pts(P)},top));S('polygon',Object.assign({points:pts(Q)},top));
  const ghost=S('polygon',{points:pts(P),fill:'#2158d1','fill-opacity':0.35,stroke:'#2158d1','stroke-width':3,'stroke-linejoin':'round',visibility:'hidden'});
  slider('Carry the left-hand top across',0,100,0,1,v=>{const t=v/100;
    ghost.setAttribute('visibility',v?'visible':'hidden');ghost.setAttribute('transform','translate('+(t*(cB[0]-cA[0]))+','+(t*(cB[1]-cA[1]))+') rotate('+(t*th)+','+cA[0]+','+cA[1]+')');
    say(v===100?'<b>It fits exactly.</b> The two tops are the same shape and the same size.':v===0?ILL.shepard.start:'The blue shape is a copy of the left-hand top. It turns as it moves, but it never changes size.');});
 }}
};

const ORDER=['checker','muller-lyer','ebbinghaus','munker','cafe-wall','shepard'];
const picker=$('picker');
ORDER.forEach(id=>{const b=document.createElement('button');b.type='button';b.dataset.id=id;b.textContent=ILL[id].name;b.addEventListener('click',()=>{location.hash=id;});picker.appendChild(b);});
function show(){
  let id=decodeURIComponent(location.hash.slice(1));if(!ILL[id])id=ORDER[0];
  const o=ILL[id];
  pic.textContent='';ctl.textContent='';
  $('title').textContent=o.title;document.title=o.title+' · Is Seeing Believing?';
  $('steps').innerHTML=o.steps.map(s=>'<li><span>'+s+'</span></li>').join('');
  $('whytext').innerHTML=o.why.map(p=>'<p>'+p+'</p>').join('')+'<p class="close">Your brain doesn’t just record what your eyes see. It makes its best guess.</p>';
  $('why').open=false;$('credit').textContent=o.credit;
  say(o.start);o.build();
  picker.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===id));
  if(window.pwCountTab)window.pwCountTab(id,o.name);
}
window.addEventListener('hashchange',show);show();
})();
</script>
