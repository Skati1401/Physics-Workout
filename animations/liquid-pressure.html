      --topic:#7fb0ff; --topic-soft:#17294a; --accent:#7fb0ff; --accent-soft:#17294a;

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      linear-gradient(var(--bg-grid) 1px,transparent 1px) 0 0/100% 34px,
      linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px) 0 0/34px 100%,
      var(--bg);

  }
  [hidden]{display:none!important;}
  button{font:inherit;color:inherit;}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;}

  .page{max-width:1400px;margin-inline:auto;padding-inline:20px;padding-block:12px 40px;}

  p{margin:0;line-height:1.55;}

  .home-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-bottom:4px;font:600 13px var(--font-mono);color:var(--ink-soft);text-decoration:none;}
  .home-link:hover{color:var(--accent);}
  .page-head{margin-bottom:12px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px;}
  .eyebrow{font-family:var(--font-mono);font-size:11.5px;color:var(--accent);font-weight:600;margin-bottom:6px;}
  .page-head h1{font-size:clamp(28px,5vw,38px);color:var(--ink);}

  .card{background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;box-shadow:var(--shadow);}
  .btn{
    font-family:var(--font-body);font-weight:600;font-size:13.5px;color:var(--ink);
    background:var(--panel);border:1px solid var(--panel-border);border-radius:9px;
    padding:9px 15px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  }
  .btn:hover{border-color:var(--ink-faint);}
  .btn:disabled{opacity:.45;cursor:default;}
  .btn-primary{background:var(--ink);border-color:var(--ink);color:var(--bg);}
  .btn-primary:hover{opacity:.88;border-color:var(--ink);}
  .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);}
  .btn-group{display:flex;flex-wrap:wrap;gap:10px;}
  /* button rows fill their width (Alex, 2 Nov 2026) */
  .btn-group>.btn,.exp-btns>.btn{flex:1 1 0;min-width:max-content;justify-content:center;}
  .seg:not(.tabs){display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,96px),1fr));}
  .seg:not(.tabs)>button{padding-inline:4px;white-space:nowrap;}

  /* picture on the left with its buttons under it; choices, readings and working on the right */
  .stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,410px);gap:18px 24px;align-items:start;padding:18px;}
  @media (max-width:860px){ .stage{grid-template-columns:minmax(0,1fr);} }
  .view{display:block;width:100%;height:auto;max-height:max(260px,calc(100vh - 300px));}
  .view text{font-family:var(--font-mono);}
  .under{display:flex;flex-direction:column;gap:12px;margin-top:12px;}
  .sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px 24px;}
  .side{display:flex;flex-direction:column;gap:12px;min-width:0;}
  .lab{display:block;font:12.5px var(--font-mono);color:var(--ink-soft);margin-bottom:6px;}
  .lab output{color:var(--ink);font-weight:600;white-space:nowrap;margin-left:6px;}
  input[type=range]{width:100%;accent-color:var(--topic);min-height:28px;}
  .seg{display:flex;flex-wrap:wrap;gap:6px;}
  .seg button{font:12.5px var(--font-mono);padding:8px 11px;min-height:44px;border:1px solid var(--panel-border);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer;}
  .seg button[aria-pressed="true"]{background:var(--topic);border-color:var(--topic);color:var(--panel);}
  .seg button:disabled{opacity:.45;cursor:default;}
  .seg.tabs{gap:0;flex-wrap:nowrap;}
  .seg.tabs button{white-space:nowrap;border-radius:0;margin-left:-1px;}
  .seg.tabs button:first-child{border-radius:8px 0 0 8px;margin-left:0;}
  .seg.tabs button:last-child{border-radius:0 8px 8px 0;}
  .cgrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center;}
  .rowlab{font:11.5px var(--font-mono);color:var(--ink-faint);}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px;}
  .stat{border:1px solid var(--panel-border);border-radius:8px;padding:5px 8px;display:flex;flex-direction:column;justify-content:space-between;}
  .stat small{display:block;font:10.5px var(--font-mono);color:var(--ink-faint);}
  .stat strong{font:600 15px var(--font-mono);color:var(--ink);white-space:nowrap;}
  .stat.hi strong{color:var(--topic);}
  .note{font-size:15px;line-height:1.5;color:var(--ink);padding:10px 12px;border-radius:8px;background:var(--bg);min-height:4.6em;}
  .note b{color:var(--topic);}

  details.working summary{cursor:pointer;font:600 13px var(--font-mono);color:var(--topic);min-height:44px;display:flex;align-items:center;}
  .eq{font-family:var(--font-mono);font-size:14px;line-height:1.75;padding:8px 12px;border-left:3px solid var(--topic);background:var(--topic-soft);border-radius:6px;color:var(--ink);}
  .eq b{color:var(--topic);}
  .eq + .eq{margin-top:8px;}
  .eqnote{font-size:13.5px;color:var(--ink-soft);margin-top:8px;}
  .eqg{display:grid;grid-template-columns:auto auto minmax(0,1fr);column-gap:.45em;row-gap:.2em;align-items:center}
  .eqg-l{justify-self:end;text-align:right}
  .eqg-m{justify-self:center}
  .eqg-r{justify-self:start;min-width:0}
  .eqg-full{grid-column:1/-1}
  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1.25;}
  .frac>span{padding:0 .25em;white-space:nowrap;}
  .frac>span:first-child{border-bottom:1.5px solid currentColor;}
  @media (max-width:560px){ .stage{padding:12px;} .view{max-height:none;} .eq{font-size:12px;padding:6px 8px;} .note{font-size:14px;} }

  /* ===== Experiment kit (tools/experiment-kit/kit.css) ===== */
  .exp-btns{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;}
  #lp-svg.dragging,#lp-svg.dragging *{cursor:grabbing;}
  .rtable{width:100%;border-collapse:collapse;font:12.5px var(--font-mono);}
  .rtable th{position:sticky;top:0;background:var(--panel);font-weight:600;font-size:11px;color:var(--ink-faint);text-align:right;padding:4px 6px;border-bottom:1px solid var(--panel-border);}
  .rtable td{text-align:right;padding:3px 6px;border-bottom:1px solid var(--panel-border);color:var(--ink);}
  .rtable tr.new td{background:var(--cs, var(--accent-soft));}
  .rtable-wrap{max-height:150px;overflow:auto;border:1px solid var(--panel-border);border-radius:8px;}
  @media (prefers-reduced-motion: no-preference){ .rtable tr.new td{animation:rowin .35s ease-out;} }
  @keyframes rowin{from{opacity:0}to{opacity:1}}
  /* ===== end of Experiment kit ===== */

  .seg button sub,.stat sub{font-size:.75em;}
  .cgrid>[hidden]{display:none!important;}

  /* inside a workout tab (?embed): no page heading, no outer margins */
  .embed body{background:transparent;}
  .embed .page{padding:0;max-width:none;display:flow-root;}
  .embed .home-link,.embed .page-head{display:none;}
  .embed .view{max-height:460px;}

  .view.tall,.embed .view.tall{max-height:none;}
  .side>.seg.tabs{align-self:flex-start;}
  .grab{cursor:grab;touch-action:none;}
  .grab:focus{outline:none;}
  .grab .ring{stroke:transparent;}
  .grab:focus-visible .ring{stroke:var(--accent);}
</style>

<script>
  // Visit counter (GoatCounter: no cookies, no personal data). Skipped when a page is embedded in a workout, so a visit counts once.
  // pwCountTab(tab, label): counts each workout tab once per visit as a GoatCounter event (path "page#tab"), skipped in frames the same way.
  (function(){
    var off = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var seen = {}, queue = [];
    function send(e){ try { window.goatcounter.count(e); } catch (x) {} }
    window.pwCountTab = function(tab, label){
      if (off || !tab || seen[tab]) return;
      seen[tab] = 1;
      var page = (location.pathname.split('/').pop() || 'index').replace(/\.html$/, '');
      var e = { path: page + '#' + tab, title: (label || tab) + ' · ' + document.title, event: true };
      if (window.goatcounter && window.goatcounter.count) send(e); else queue.push(e);
    };
    if (off) return;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://gc.zgo.at/count.js';
    s.setAttribute('data-goatcounter', 'https://physics-workout.goatcounter.com/count');
    s.onload = function(){ var q = queue; queue = []; q.forEach(send); };
    document.head.appendChild(s);
  })();
</script>

<script>
  // Draft tags and Alex's reviewer button (tools/review/drafts.py writes this block; edit tools/review/snippet.html, then run drafts.py sync).
  // A page is Draft while its row in tools/REVIEW.md is not ✅: <meta name="pw-draft"> on the page, data-draft on its list cards.
  // ?reviewer (once, on any page) turns on reviewer mode in this browser; ?reviewer=off turns it off.
  (function(){
    var on = false, embed = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var m = /[?&]reviewer(?:=([^&]*))?/.exec(location.search);
    on = !!m && m[1] !== 'off';
    try {
      if (m) { if (m[1] === 'off') localStorage.removeItem('pw-reviewer'); else localStorage.setItem('pw-reviewer', '1'); }
      else on = localStorage.getItem('pw-reviewer') === '1';
    } catch (e) {}
    var CSS = '.pw-draft{display:inline-block;vertical-align:middle;margin-left:10px;font:600 11.5px/1.4 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:0;color:var(--bad,#b42318);border:1px dashed currentColor;border-radius:5px;padding:1px 7px;white-space:nowrap}'
      + '.act-top .pw-draft{margin-left:auto;flex:none}.act-top .pw-draft~.cp-tag,.act-top .pw-draft~.ta-tag{margin-left:0}'
      + 'a[data-draft]{position:relative}.pw-draft.pw-corner{position:absolute;top:10px;right:10px;margin:0;background:var(--panel,#fff)}'
      + 'summary .pw-draft{margin-left:0;flex:none}'
      + '.pw-check{display:inline-block;vertical-align:middle;margin-left:8px;font:600 13px/1.4 "IBM Plex Sans",system-ui,sans-serif;color:#fff;background:#1a7f37;border-radius:6px;padding:4px 10px;text-decoration:none;white-space:nowrap}'
      + '.pw-check:hover{background:#116329}.pw-check:focus-visible{outline:2px solid #1a7f37;outline-offset:2px}'
      + '.pw-reviewer{position:fixed;left:10px;bottom:10px;z-index:9999;font:500 12px/1.4 "IBM Plex Mono",ui-monospace,monospace;background:#1d2433;color:#fff;border-radius:6px;padding:4px 9px;opacity:.85}'
      + '.pw-reviewer a{color:#ffc83d}';
    function tag(){ var t = document.createElement('span'); t.className = 'pw-draft'; t.title = 'Not yet checked'; t.textContent = 'Draft'; return t; }
    function go(){
      var st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st);
      var meta = document.querySelector('meta[name="pw-draft"]'), h1 = document.querySelector('h1');
      if (meta && h1 && !embed) {
        h1.appendChild(tag());
        if (on) {
          var page = meta.getAttribute('content'), b = document.createElement('a');
          b.className = 'pw-check'; b.target = '_blank'; b.rel = 'noopener'; b.textContent = '✓ Checked';
          b.title = 'Opens a GitHub issue. Submit it and the Draft tag goes in a minute or two.';
          b.href = 'https://github.com/Skati1401/Physics-Workout/issues/new?title=' + encodeURIComponent('Checked: ' + page)
            + '&body=' + encodeURIComponent('Submit this issue to mark `' + page + '` as checked. The Draft tag goes in a minute or two, and the issue closes itself.');
          h1.appendChild(b);
        }
      }
      document.querySelectorAll('a[data-draft]').forEach(function(a){
        if (a.querySelector('.pw-draft')) return;
        var t = tag(), top = a.querySelector('.act-top');
        if (top) top.insertBefore(t, top.querySelector('.cp-tag,.ta-tag'));
        else { t.className += ' pw-corner'; a.appendChild(t); }
      });
      document.querySelectorAll('details.unit').forEach(function(d){
        var s = d.querySelector('summary');
        if (!s || s.querySelector('.pw-draft') || !d.querySelector('a[data-draft]')) return;
        var h2 = s.querySelector('h2'); if (h2) h2.parentNode.insertBefore(tag(), h2.nextSibling); else s.appendChild(tag());
      });
      if (on && !embed) {
        // Carry ?reviewer in every link to another page of the site, so reviewer mode survives
        // browsers that clear site storage (school Chromebooks) and pages cached from before.
        var carry = function(a){
          try {
            var u = new URL(a.href, location.href);
            if (u.origin !== location.origin || !/(\.html|\/)$/.test(u.pathname) || u.searchParams.has('reviewer')) return;
            u.searchParams.set('reviewer', ''); a.href = u.href.replace('reviewer=', 'reviewer');
          } catch (e) {}
        };
        document.querySelectorAll('a[href]').forEach(carry);
        ['click', 'auxclick', 'contextmenu'].forEach(function(ev){
          document.addEventListener(ev, function(e){ var a = e.target.closest && e.target.closest('a[href]'); if (a) carry(a); }, true);
        });
        var r = document.createElement('div'); r.className = 'pw-reviewer';
        r.innerHTML = 'Reviewer mode · <a href="' + location.pathname + '?reviewer=off">turn off</a>';
        document.body.appendChild(r);
      }
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
  })();
</script>

<body>
<div class="page" id="page">
  <a class="home-link" href="igcse.html">&larr; IGCSE animations</a>
  <header class="page-head">
    <div>
      <div class="eyebrow">Animations &middot; matter</div>
      <h1>Pressure in a Liquid</h1>
    </div>
  </header>

  <section class="card stage">
    <div>
      <svg class="view" id="lp-svg" viewBox="0 0 860 350" role="img" aria-label=""><g id="lp-scene"></g><g id="lp-grab"></g></svg>
      <div class="under">
        <div class="btn-group" id="lp-btns">
          <button class="btn btn-primary" id="lp-take" type="button" hidden>Take reading</button>
          <button class="btn" id="lp-exp" type="button" aria-pressed="false" title="Take your own readings">Experiment</button>
          <button class="btn" id="lp-clear" type="button" hidden>Clear readings</button>
        </div>
        <div class="sliders">
          <div id="lp-hrow"><label class="lab" for="lp-h">Depth h <output id="lp-ho"></output></label><input type="range" id="lp-h" min="0" max="40" step="1" value="12"></div>
          <div id="lp-prow" hidden><label class="lab" for="lp-p">Gas pressure minus air pressure <output id="lp-po"></output></label><input type="range" id="lp-p" min="-48000" max="48000" step="400" value="13600"></div>
        </div>
      </div>
    </div>
    <div class="side">

</div>
<script>
// Which list this page was opened from: ?level=igcse, ial or ib sets the back link (and, on two-level pages, the starting level).
var PW_LEVEL=(location.search.match(/[?&]level=(igcse|ial|ib)\b/)||[])[1]||(/[?&]from=alevel\b/.test(location.search)?'ial':'');
(function(){

})();
(function(){
  // This page is the one copy of this animation. With ?embed it drops its heading so a workout tab
  // can show it in a frame, and it tells that page its height. ?show=dam or ?show=man shows one part only.
  var EMBED = /[?&]embed\b/.test(location.search);
  if(EMBED){
    document.documentElement.classList.add('embed');
    var page = document.getElementById('page');
    var sendHeight = function(){ try{ parent.postMessage({animHeight: Math.ceil(page.getBoundingClientRect().height)}, '*'); }catch(e){} };
    if(window.ResizeObserver) new ResizeObserver(sendHeight).observe(page);
    window.addEventListener('load', sendHeight);
  }
  function $(sel){ return document.querySelector(sel); }
  function num(n, dp){   // round, drop trailing zeros, group thousands with a space from 10 000
    var f = Math.pow(10, dp||0), r = Math.round(n*f)/f, t = String(Math.abs(r));

  }
  function FR(t){
    return String(t).replace(/(\d) (?=\d{3}\b)/g,'$1 ')
      .replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g,'<span class="frac"><span>$1</span><span>$2</span></span>');
  }
  // Each line of a working readout becomes left | = | right, so the = signs sit under each other.
  function alignEquals(el){

      return '<span class="eqg-l">'+line.slice(0,i)+'</span><span class="eqg-m">=</span><span class="eqg-r">'+line.slice(i+3)+'</span>';

  // a row of choice buttons that behaves like a radio group

  // ---- solid kit (the same block is in roller-coaster-energy.html, heat-transfer.html, density.html and liquid-pressure.html) ----
  function f1(n){ return (+n).toFixed(1); }
  function pts(list){ return list.map(function(p){ return f1(p[0])+','+f1(p[1]); }).join(' '); }

  function ln(x1,y1,x2,y2,col,w,extra){ return '<line x1="'+f1(x1)+'" y1="'+f1(y1)+'" x2="'+f1(x2)+'" y2="'+f1(y2)+'" stroke="'+col+'" stroke-width="'+(w||1)+'"'+(extra||'')+'/>'; }

  // text in clear space: halo:1 gives it a panel-coloured edge so a line passing behind never cuts a letter

  // a solid block: front face at (x, y), w wide and h tall, going back by (dx, dy). Lit top, plain front, darker side.
  function box(x,y,w,h,dx,dy,col,o){ o=o||{};
    return pg([[x,y],[x+w,y],[x+w+dx,y+dy],[x+dx,y+dy]],o.top||col)+(o.top?'':pg([[x,y],[x+w,y],[x+w+dx,y+dy],[x+dx,y+dy]],'#fff',' opacity=".38"'))+
      pg([[x+w,y],[x+w+dx,y+dy],[x+w+dx,y+h+dy],[x+w,y+h]],o.side||col)+(o.side?'':pg([[x+w,y],[x+w+dx,y+dy],[x+w+dx,y+h+dy],[x+w,y+h]],'#000',' opacity=".28"'))+
      rect(x,y,w,h,col); }

  function tube(x1,y1,x2,y2,w,col,hi){ var L=Math.hypot(x2-x1,y2-y1)||1, nx=-(y2-y1)/L*w*0.22, ny=(x2-x1)/L*w*0.22; if(ny>0){ nx=-nx; ny=-ny; }
    return ln(x1,y1,x2,y2,col,w,' stroke-linecap="round"')+ln(x1+nx,y1+ny,x2+nx,y2+ny,hi,Math.max(0.8,w*0.3),' stroke-linecap="round"'); }
  function wrapLines(s,n){ var out=[], cur=''; String(s).split(' ').forEach(function(w){ if(cur && (cur+' '+w).length>n){ out.push(cur); cur=w; } else cur=cur?cur+' '+w:w; }); if(cur) out.push(cur); return out; }
  function onPick(svg, fn){

  }
  function setKeepFocus(el, html){ var f=document.activeElement, k=f && el.contains(f) ? f.getAttribute('data-pick') : null; el.innerHTML=html;
    if(k!==null){ var n=el.querySelector('.pick[data-pick="'+k+'"]'); if(n && n.focus) n.focus(); } }
  function ell(cx,cy,rx,ry,fill,extra){ return '<ellipse cx="'+f1(cx)+'" cy="'+f1(cy)+'" rx="'+f1(rx)+'" ry="'+f1(ry)+'" fill="'+fill+'"'+(extra||'')+'/>'; }
  // a solid arrow from (x1, y1) to its tip at (x2, y2)
  function arrow(x1,y1,x2,y2,col,w,extra){ var a=Math.atan2(y2-y1,x2-x1), s=w*2.2, bx=x2-Math.cos(a)*s*1.5, by=y2-Math.sin(a)*s*1.5;
    return '<g'+(extra||'')+'>'+ln(x1,y1,bx,by,col,w)+'<path d="M'+f1(x2)+','+f1(y2)+' L'+f1(bx-Math.sin(a)*s)+','+f1(by+Math.cos(a)*s)+' L'+f1(bx+Math.sin(a)*s)+','+f1(by-Math.cos(a)*s)+' z" fill="'+col+'"/></g>'; }
  // an upright cylinder (a can, a beaker of liquid): top ellipse at yt, bottom at yb. o.top fills the top; o.hi adds a streak of light.
  function cyl(cx,yt,yb,rx,ry,fill,o){ o=o||{};
    return '<path d="M'+f1(cx-rx)+','+f1(yt)+' L'+f1(cx-rx)+','+f1(yb)+' A'+f1(rx)+','+f1(ry)+' 0 0 0 '+f1(cx+rx)+','+f1(yb)+' L'+f1(cx+rx)+','+f1(yt)+' z" fill="'+fill+'"'+(o.extra||'')+'/>'+
      '<path d="M'+f1(cx+rx*0.45)+','+f1(yt)+' L'+f1(cx+rx*0.45)+','+f1(yb+ry*0.85)+' A'+f1(rx)+','+f1(ry)+' 0 0 0 '+f1(cx+rx)+','+f1(yb)+' L'+f1(cx+rx)+','+f1(yt)+' z" fill="#000" opacity="'+(o.shade==null?0.16:o.shade)+'"/>'+
      (o.hi?ln(cx-rx*0.62,yt+ry+4,cx-rx*0.62,yb-2,o.hi,Math.max(1.6,rx*0.11),' stroke-linecap="round" opacity="'+(o.hiop||0.7)+'"'):'')+
      ell(cx,yt,rx,ry,o.top||fill,o.topx||'')+(o.top?'':ell(cx,yt,rx,ry,'#fff',' opacity=".3"')); }
  // a glass thermometer standing upright: bulb at (x, yb); the scale runs from t0 at y0 up to t1 at y1, and the thread stands at T.
  // o.step: a tick every so many degrees; o.num: a number every so many; o.side: numbers on the right (1) or the left (-1); o.from: first tick;
  // o.nobulb: the bulb is out of sight, inside a can or a cube
  function thermo(x,yb,y0,t0,y1,t1,T,o){ o=o||{};
    var w=o.w||7, yT=y1-9, sc=(y1-y0)/(t1-t0), yy=function(t){ return y0+(t-t0)*sc; }, side=o.side||1, fs=o.fs||11, g='', t;
    g+=rect(x-w/2,yT,w,yb-yT,'var(--thermo)',' rx="'+f1(w/2)+'" stroke="var(--ink-faint)" stroke-width="1"');
    g+=ln(x,yb,x,yy(Math.max(t0-4,Math.min(t1+2,T))),'var(--thread)',w*0.36,' stroke-linecap="round"');

    for(t=(o.from==null?t0:o.from); t<=t1+1e-9; t+=(o.step||10)){ var big=!(Math.round(t)%(o.num||20));
      g+=ln(x+side*w/2,yy(t),x+side*(w/2+(big?7:4)),yy(t),'var(--ink-soft)',big?1.3:0.9);
      if(big && !o.nonum) g+=txt(x+side*(w/2+10),yy(t)+fs*0.36,String(Math.round(t)),{a:side>0?'start':'end',fs:fs,c:'var(--ink)'}); }
    return g; }
  // a stopwatch showing s (for example 1:37)
  function stopwatch(x,y,s,k){ k=k||1; var w=78*k, h=40*k;
    return rect(x+w/2-7*k,y-7*k,14*k,9*k,'var(--steel-sh,#3f4a5e)',' rx="2"')+rect(x,y,w,h,'var(--case,#3f4a5e)',' rx="'+f1(9*k)+'"')+rect(x+2,y+2,w-4,h*0.4,'#fff',' rx="'+f1(8*k)+'" opacity=".12"')+
      rect(x+7*k,y+8*k,w-14*k,h-16*k,'var(--panel)',' rx="3"')+txt(x+w/2,y+h/2+5.5*k,s,{a:'middle',fs:15*k,c:'var(--ink)',w:600}); }
  // ---- end of solid kit ----

  var svg=$('#lp-svg'), sceneEl=$('#lp-scene'), grabEl=$('#lp-grab');
  var hIn=$('#lp-h'), pIn=$('#lp-p'), expBtn=$('#lp-exp'), takeBtn=$('#lp-take'), clearBtn=$('#lp-clear');
  var partSeg=segGroup($('#lp-part'), function(){ setPart(); });
  var liqSeg=segGroup($('#lp-liq'), function(k){ var M=MAN[k]; pIn.min=-M.max; pIn.max=M.max; pIn.step=M.step; pIn.value=M.start; draw(); });
  function part(){ return partSeg.value(); }
  function exp(){ return pressed(expBtn) && part()==='dam'; }
  function narrow(){ return window.innerWidth<=520; }
  var T=1;   // text size in the picture: larger where the scene is drawn smaller (phones)
  function ft(n){ return n*T; }

  /* ================= Part 1: water behind a dam. Pressure difference p = h × ρ × g ================= */
  var HMAX=40, RHO=1000, G=10, PMAX=HMAX*RHO*G;
  var D={Y0:78, YB:308, XW:98, FACE:300, YC:54, dx:46, dy:-26};   // the scene, before it is moved or scaled
  var E={rows:[], just:null};
  var ERR=[0,1,-1,0,2,-1,1,-2,0,1];   // the sensor's small, fixed reading error (kPa), by depth
  function yOf(h){ return D.Y0+h/HMAX*(D.YB-D.Y0); }
  function lenOf(p){ return 10+110*p/PMAX; }
  function sensor(h){ return h===0 ? 0 : Math.round(h*RHO*G/1000)+ERR[h%10]; }   // kPa, as the pressure sensor shows it
  function fit(){   // best-fit line through the origin, once there are enough readings over a wide enough range
    if(E.rows.length<4 || E.rows[E.rows.length-1].h-E.rows[0].h<20) return null;
    var a=0, b=0; E.rows.forEach(function(r){ a+=r.h*r.p; b+=r.h*r.h; }); return a/b;
  }
  function damScene(h){
    var p=h*RHO*G, y=yOf(h)-(h===HMAX?7:0), F=D.FACE, g='', i;
    g+='<defs><linearGradient id="lp-wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--water)"/><stop offset="1" stop-color="var(--water-deep)"/></linearGradient></defs>';
    // bedrock under everything
    var rl=D.XW-16, rr=F+190;
    g+=pg([[rl,D.YB],[rr,D.YB],[rr+D.dx,D.YB+D.dy],[rl+D.dx,D.YB+D.dy]],'var(--rock-t)')+pg([[rr,D.YB],[rr+D.dx,D.YB+D.dy],[rr+D.dx,D.YB+D.dy+16],[rr,D.YB+16]],'var(--rock-s)')+rect(rl,D.YB,rr-rl,16,'var(--rock-f)');
    // the water: its surface, then the face cut through it
    g+=pg([[D.XW,D.Y0],[F,D.Y0],[F+D.dx,D.Y0+D.dy],[D.XW+D.dx,D.Y0+D.dy]],'var(--water-top)')+rect(D.XW,D.Y0,F-D.XW,D.YB-D.Y0,'url(#lp-wg)')+
       ln(D.XW,D.Y0,F,D.Y0,'var(--water-ink)',1.4)+ln(D.XW+8,D.Y0-5,D.XW+34,D.Y0-5,'#fff',1.2,' opacity=".7" stroke-linecap="round"')+ln(D.XW+70,D.Y0-13,D.XW+104,D.Y0-13,'#fff',1.2,' opacity=".6" stroke-linecap="round"');
    // the dam: thin at the top, thick at the base
    g+=pg([[F,D.YC],[F+30,D.YC],[F+30+D.dx,D.YC+D.dy],[F+D.dx,D.YC+D.dy]],'var(--conc-t)')+
       pg([[F+30,D.YC],[F+30+D.dx,D.YC+D.dy],[F+128+D.dx,D.YB+D.dy],[F+128,D.YB]],'var(--conc-s)')+
       pg([[F,D.YC],[F+30,D.YC],[F+128,D.YB],[F,D.YB]],'var(--conc-f)');
    for(i=1;i<5;i++){ var yy=D.YC+i*(D.YB-D.YC)/5; g+=ln(F+1,yy,F+30+(yy-D.YC)*98/(D.YB-D.YC)-1,yy,'var(--conc-s)',1,' opacity=".55"'); }   // lifts of concrete
    // the depth scale, in clear space beside the water
    var xs=D.XW-46;
    g+=ln(xs,D.Y0,xs,D.YB,'var(--ink-soft)',1.4);
    for(i=0;i<=40;i+=5) g+=ln(xs-(i%10?4:7),yOf(i),xs,yOf(i),'var(--ink-soft)',1.2)+(i%10?'':txt(xs-11,yOf(i)+4*T,String(i),{a:'end',fs:ft(12)}));
    var xl=xs-(T>1?32:38)*T; g+=txt(xl,yOf(20),'depth (m)',{a:'middle',fs:ft(12),x:' transform="rotate(-90 '+f1(xl)+' '+f1(yOf(20))+')"'});
    // h: from the surface down to the point
    var xd=D.XW-22;
    if(h>=3) g+=ln(xd,D.Y0+1,xd,y-1,'var(--ink)',1.4)+'<path d="M'+f1(xd)+','+f1(D.Y0)+' l-3.6,7 h7.2 z M'+f1(xd)+','+f1(y)+' l-3.6,-7 h7.2 z" fill="var(--ink)"/>'+txt(xd+7,(D.Y0+y)/2+4*T,'h',{fs:ft(13.5),c:'var(--ink)',w:600});
    g+=ln(D.XW-30,y,F,y,'var(--ink)',1,' stroke-dasharray="4 4" opacity=".55"');
    // the water pushes on the dam: grey arrows every 10 m, and the arrow at this depth
    [10,20,30,40].forEach(function(d){ var ya=yOf(d)-(d===HMAX?7:0), L=lenOf(d*RHO*G); g+=arrow(F-L,ya,F-2,ya,'var(--ink-soft)',2.2,' opacity=".6"'); });
    if(h>0) g+=arrow(F-lenOf(p),y,F-3,y,'var(--force)',4.5);

    g+=txt(D.XW+150,D.Y0+D.dy-12,'water',{a:'middle',fs:ft(13),halo:1})+txt(F+86,D.YC+D.dy-12,'dam',{a:'middle',fs:ft(13),halo:1});
    return g;
  }
  // the exam graph: pressure difference against depth
  function damGraph(h, A){
    var gx=function(d){ return A.x0+d/HMAX*(A.x1-A.x0); }, gy=function(k){ return A.y0-k/400*(A.y0-A.y1); }, g='', i, m=fit();
    for(i=0;i<=4;i++){ g+=ln(gx(i*10),A.y0,gx(i*10),A.y1,'var(--panel-border)',1)+ln(A.x0,gy(i*100),A.x1,gy(i*100),'var(--panel-border)',1)+
      txt(gx(i*10),A.y0+16,String(i*10),{a:'middle',fs:12})+txt(A.x0-8,gy(i*100)+4,String(i*100),{a:'end',fs:12}); }
    g+=ln(A.x0,A.y0,A.x1,A.y0,'var(--ink-soft)',1.5)+ln(A.x0,A.y0,A.x0,A.y1,'var(--ink-soft)',1.5);
    g+=txt((A.x0+A.x1)/2,A.y0+34,'depth h (m)',{a:'middle',fs:12.5})+txt(A.x0-44,(A.y0+A.y1)/2,'pressure difference (kPa)',{a:'middle',fs:12.5,x:' transform="rotate(-90 '+f1(A.x0-44)+' '+f1((A.y0+A.y1)/2)+')"'});
    if(exp()){
      if(m) g+=ln(gx(0),gy(0),gx(40),gy(40*m),'var(--topic)',1.8,' stroke-dasharray="7 5"')+txt(gx(3),A.y1+16,'gradient = ρ × g',{fs:12,c:'var(--topic)',halo:1});
      E.rows.forEach(function(r){ var cx=gx(r.h), cy=gy(r.p), s=4.5; g+='<path d="M'+f1(cx-s)+','+f1(cy-s)+' L'+f1(cx+s)+','+f1(cy+s)+' M'+f1(cx+s)+','+f1(cy-s)+' L'+f1(cx-s)+','+f1(cy+s)+'" stroke="var(--ink)" stroke-width="2"/>'; });
      g+=ln(gx(h),A.y0,gx(h),A.y1,'var(--force)',1.2,' stroke-dasharray="3 4" opacity=".8"');
    } else {
      var k=h*RHO*G/1000;
      g+=ln(gx(0),gy(0),gx(40),gy(400),'var(--topic)',2.2);
      g+=ln(gx(h),A.y0,gx(h),gy(k),'var(--force)',1.2,' stroke-dasharray="3 4"')+ln(A.x0,gy(k),gx(h),gy(k),'var(--force)',1.2,' stroke-dasharray="3 4"');
      g+='<circle cx="'+f1(gx(h))+'" cy="'+f1(gy(k))+'" r="5.5" fill="var(--force)" stroke="var(--panel)" stroke-width="1.6"/>';
    }

  }
  function drawDam(){
    var h=+hIn.value, p=h*RHO*G, tall=narrow(), s=tall?0.78:1, tx=tall?4:0, ty=0, ex=exp(), m=fit();
    T=tall?1.2:1;
    svg.setAttribute('viewBox', tall?'0 0 430 560':'0 0 860 350'); svg.classList.toggle('tall',tall);
    var y=yOf(h)-(h===HMAX?7:0);
    sceneEl.innerHTML='<g transform="translate('+tx+' '+ty+') scale('+s+')">'+damScene(h)+'</g>'+damGraph(h, tall?{x0:86,x1:410,y0:510,y1:300}:{x0:622,x1:846,y0:296,y1:36});
    // the point on the dam face: drag it, or focus it and use the arrow keys
    grabEl.innerHTML='<g transform="translate('+tx+' '+ty+') scale('+s+')"><g class="grab" id="lp-pt" tabindex="0" role="slider" aria-label="Depth of the point on the dam, in metres" aria-valuemin="0" aria-valuemax="40" aria-valuenow="'+h+'">'+
      '<rect x="'+(D.FACE-40)+'" y="'+f1(y-20)+'" width="66" height="40" fill="transparent"/><circle class="ring" cx="'+D.FACE+'" cy="'+f1(y)+'" r="12" fill="none" stroke-width="2.5"/>'+
      '<circle cx="'+D.FACE+'" cy="'+f1(y)+'" r="7.5" fill="var(--force)" stroke="var(--panel)" stroke-width="2"/>'+
      '<path d="M0,-4.4 L2.6,-1.3 L-2.6,-1.3 z M0,4.4 L2.6,1.3 L-2.6,1.3 z" fill="#fff" transform="translate('+D.FACE+' '+f1(y)+')"/><title>Drag up or down to change the depth</title></g></g>';
    D.s=s; D.ty=ty;
    $('#lp-ho').textContent=h+' m';
    svg.setAttribute('aria-label','Water held back by a dam, cut through to show its shape: thin at the top and thick at the base. An arrow shows the water pushing on the dam '+h+' m below the surface. Beside it, a graph of pressure difference against depth.');
    // the note always says what is happening now
    var note;
    if(ex){
      if(m) note='The points lie on a straight line through the origin: the pressure difference is <b>directly proportional</b> to the depth. The gradient of the line is ρ × g, which gives the density of the water.';
      else if(!E.rows.length) note='<b>Experiment.</b> The point is a pressure sensor. Drag it to a depth and press <b>Take reading</b>. Take at least four readings, from near the surface to near the bottom.';
      else note='<b>Experiment.</b> '+E.rows.length+' reading'+(E.rows.length>1?'s':'')+' so far. Move the sensor to another depth and press <b>Take reading</b>'+(E.rows.length>=4?': spread them over at least 20 m of depth.':'.');
    } else if(h===0) note='At the surface there is no water above the point, so the water adds no pressure. Drag the point down the face of the dam.';
    else note='At '+h+' m below the surface the water pushes on the dam with a pressure of <b>'+num(p)+' Pa</b> more than at the surface. The grey arrows show the pressure every 10 m: it is greatest at the bottom, which is why a dam is built thicker at its base.';
    $('#lp-note').innerHTML=note;
    $('#lp-stats').innerHTML=stat('Depth h',h+' m')+(ex ? stat('Sensor reading',sensor(h)+' kPa',1)+stat('Density from graph', m?num(Math.round(m*1000/G/10)*10)+' kg/m³':'?') : stat('Pressure difference',num(p)+' Pa',1));
    var w;
    if(!ex) w='Pressure difference from the surface<br>p = h × ρ × g<br>p = '+h+' × '+RHO+' × '+G+'<br>p = <b>'+num(p)+' Pa</b>';
    else if(!m) w='The working appears when you have at least four readings spread over 20 m or more.';
    else { var gr=Math.round(m*10)/10, rho=Math.round(m*1000/G/10)*10;
      w='gradient = '+gr.toFixed(1)+' kPa/m = '+num(gr*1000)+' Pa/m<br>p = h × ρ × g<br>gradient = ρ × g<br>'+num(gr*1000)+' = ρ × '+G+'<br>ρ = [['+num(gr*1000)+'|'+G+']]<br>ρ = <b>'+num(rho)+' kg/m³</b>'; }
    $('#lp-eq').innerHTML=FR(w);
    $('#lp-eqnote').textContent='Take g = 10 N/kg and ρ = 1000 kg/m³ for water. This is the extra pressure caused by the water; the air adds atmospheric pressure on top.';
    $('#lp-tablewrap').hidden=!ex;
    if(ex){ var t='<table class="rtable"><thead><tr><th>Depth h (m)</th><th>Pressure difference (kPa)</th></tr></thead><tbody>';
      E.rows.forEach(function(r){ t+='<tr'+(r.h===E.just?' class="new"':'')+'><td>'+r.h+'</td><td>'+r.p+'</td></tr>'; });
      $('#lp-table').innerHTML=t+'</tbody></table>'; }
  }
  function take(){
    var h=+hIn.value, r={h:h, p:sensor(h)};
    E.rows=E.rows.filter(function(x){ return x.h!==h; }); E.rows.push(r); E.rows.sort(function(a,b){ return a.h-b.h; }); E.just=h; draw();
  }

  /* ================= Part 2: a U-tube manometer. Δp = h × ρ × g ================= */
  var MAN={hg:{n:'mercury',r:13600,max:48000,step:400,start:13600,c:'var(--hg)',hi:'var(--hg-hi)'},w:{n:'water',r:1000,max:4000,step:50,start:2000,c:'var(--water-deep)',hi:'var(--water-top)'}};
  var U={XL:440, XR:540, Y0:166, YB:262, RB:50, PXCM:4.4, TOP:44};
  function manScene(dp, cx){
    var M=MAN[liqSeg.value()], h=dp/(M.r*G), hcm=h*100, half=hcm*U.PXCM/2, yL=U.Y0+half, yR=U.Y0-half, g='', i;
    var XL=U.XL, XR=U.XR, YB=U.YB, RB=U.RB, xc=(XL+XR)/2;
    // the bench
    g+=box(150,334,560,9,16,-9,'var(--wood-f)',{top:'var(--wood-t)',side:'var(--wood-s)'});
    // the gas container, with a tap, and the hose to the left limb
    g+='<ellipse cx="'+cx+'" cy="327" rx="46" ry="8" fill="#000" opacity=".13"/>';
    g+='<rect x="'+(cx-38)+'" y="150" width="76" height="176" rx="14" fill="var(--steel)"/><rect x="'+(cx-38)+'" y="150" width="76" height="176" rx="14" fill="#000" opacity=".12"/>'+
       '<rect x="'+(cx-38)+'" y="150" width="50" height="176" rx="14" fill="var(--steel)"/><rect x="'+(cx-28)+'" y="160" width="7" height="156" rx="3.5" fill="var(--steel-hi)" opacity=".75"/>'+
       '<path d="M'+(cx-24)+',152 q24,-30 48,0 z" fill="var(--steel)"/><rect x="'+(cx-9)+'" y="118" width="18" height="24" rx="3" fill="var(--steel-sh)"/>'+
       '<rect x="'+(cx-18)+'" y="112" width="36" height="8" rx="4" fill="var(--bad)"/><rect x="'+(cx-5)+'" y="98" width="10" height="16" fill="var(--steel-sh)"/>';
    var hose='M'+cx+',100 V40 Q'+cx+',22 '+(cx+18)+',22 H'+(XL-18)+' Q'+XL+',22 '+XL+',40 V'+(U.TOP+14);
    // the board the tube is clipped to, with a centre-zero scale in cm between the limbs
    g+=box(XL-24,34,XR-XL+48,300,7,-4,'var(--wood-f)',{top:'var(--wood-t)',side:'var(--wood-s)'});
    var xd=XR+72;
    g+=ln(XL+14,yL,xd+8,yL,'var(--ink)',1.1,' stroke-dasharray="4 3"')+ln(XR+14,yR,xd+8,yR,'var(--ink)',1.1,' stroke-dasharray="4 3"');
    g+=rect(xc-19,U.Y0-98,38,196,'var(--panel)',' rx="2" stroke="var(--ink-faint)" stroke-width="0.8"');
    for(i=-20;i<=20;i++){ var ys=U.Y0-i*U.PXCM, big=i%5===0; g+=ln(xc-19,ys,xc-19+(big?8:4.5),ys,'var(--ink)',big?1.1:0.7)+ln(xc+19,ys,xc+19-(big?8:4.5),ys,'var(--ink)',big?1.1:0.7);
      if(big) g+=txt(xc,ys+3.8,String(Math.abs(i)),{a:'middle',fs:11,c:'var(--ink)'}); }
    g+=txt(xc,U.Y0+112,'cm',{a:'middle',fs:11,c:'var(--ink)'});
    // the glass U-tube, the liquid in it, and a streak of light on the glass
    var tube='M'+XL+','+U.TOP+' L'+XL+','+YB+' A'+RB+','+RB+' 0 0 0 '+XR+','+YB+' L'+XR+','+U.TOP;
    g+='<path d="'+tube+'" fill="none" stroke="var(--glass)" stroke-width="27"/><path d="'+tube+'" fill="none" stroke="var(--glass-in)" stroke-width="21"/>';
    g+='<path d="M'+XL+','+f1(yL)+' L'+XL+','+YB+' A'+RB+','+RB+' 0 0 0 '+XR+','+YB+' L'+XR+','+f1(yR)+'" fill="none" stroke="'+M.c+'" stroke-width="21"/>';
    g+='<path d="M'+(XL-6)+','+f1(yL+4)+' L'+(XL-6)+','+YB+' A'+(RB+6)+','+(RB+6)+' 0 0 0 '+(xc-10)+','+(YB+RB+3)+'" fill="none" stroke="'+M.hi+'" stroke-width="2.6" stroke-linecap="round" opacity=".8"/>'+ln(XR-6,yR+4,XR-6,YB,M.hi,2.6,' stroke-linecap="round" opacity=".8"');
    g+=ln(XL-6,U.TOP+18,XL-6,Math.max(U.TOP+18,yL-5),'#fff',2.2,' stroke-linecap="round" opacity=".75"')+ln(XR-6,U.TOP+4,XR-6,Math.max(U.TOP+4,yR-5),'#fff',2.2,' stroke-linecap="round" opacity=".75"');
    g+='<ellipse cx="'+XR+'" cy="'+U.TOP+'" rx="13.5" ry="3.2" fill="var(--glass-in)" stroke="var(--glass)" stroke-width="2"/>';
    g+='<path d="'+hose+'" fill="none" stroke="var(--hose)" stroke-width="15" stroke-linecap="butt" stroke-linejoin="round"/><path d="'+hose+'" fill="none" stroke="var(--hose-hi)" stroke-width="3" stroke-linecap="round" transform="translate(-3 -3)" opacity=".8"/>'+rect(XL-9,U.TOP+12,18,5,'var(--steel-sh)',' rx="1.5"');
    // each pressure pushes down on its side of the liquid
    var aL=50*(1+dp/100000), xa=XL-42, xb=XR+42;
    g+=arrow(xa,yL-aL,xa,yL,'var(--force)',4)+arrow(xb,yR-50,xb,yR,'var(--force)',4);
    // the two levels and the difference in height, h
    if(Math.abs(yL-yR)>1) g+=ln(xd,yL,xd,yR,'var(--topic)',2.6);
    return {g:g, yL:yL, yR:yR, hcm:hcm, h:h, xd:xd, xa:xa, xb:xb, M:M, cx:cx};
  }
  function drawMan(){
    var dp=+pIn.value, tall=narrow(), s=tall?0.74:1, tx=tall?-207:0, S;
    T=tall?1.3:1;
    svg.setAttribute('viewBox', tall?'0 0 430 296':'0 0 860 350'); svg.classList.toggle('tall',tall);
    S=manScene(dp, tall?332:240);   // on a phone the gas container stands closer, and its label goes under the bench
    var g=S.g, M=S.M;
    // labels, all in clear space
    g+=txt(S.xd+10,U.Y0+4.5*T,'h = '+num(Math.abs(S.hcm),1)+' cm',{fs:ft(14),c:'var(--topic)',w:600,halo:1});
    if(tall) g+=txt(S.cx,364,'gas',{a:'middle',fs:ft(13),c:'var(--ink)'})+txt(S.cx,364+ft(16),num(100000+dp)+' Pa',{a:'middle',fs:ft(12.5),c:'var(--force)',w:600});
    else g+=txt(S.cx-46,190,'gas',{a:'end',fs:13,c:'var(--ink)'})+txt(S.cx-46,206,num(100000+dp)+' Pa',{a:'end',fs:12.5,c:'var(--force)',w:600});
    g+=txt(S.xd+10,26*T,'open to the air',{fs:ft(13),c:'var(--ink)'})+txt(S.xd+10,26*T+ft(16),'100 000 Pa',{fs:ft(12.5),c:'var(--force)',w:600});
    g+=ln(S.xd+6,22*T,U.XR+16,U.TOP-6,'var(--ink-faint)',1);
    sceneEl.innerHTML='<g transform="translate('+tx+' 0) scale('+s+')">'+g+'</g>'; grabEl.innerHTML='';
    $('#lp-po').textContent=num(dp)+' Pa';
    svg.setAttribute('aria-label','A U-tube manometer holding '+M.n+'. One side is joined to a gas container and the other is open to the air. The difference in the two levels is '+num(Math.abs(S.hcm),1)+' cm.');
    $('#lp-note').innerHTML = dp===0 ? 'The two levels are equal, so the gas is at the same pressure as the air.' :
      'The gas pressure is <b>'+(dp>0?'higher':'lower')+'</b> than the air pressure, so the '+M.n+' is pushed down on the '+(dp>0?'gas':'open')+' side and up on the other. The difference in the levels, h = '+num(Math.abs(S.hcm),1)+' cm, measures the pressure difference.';
    $('#lp-stats').innerHTML=stat('Pressure difference',num(dp)+' Pa')+stat('Height difference h',num(Math.abs(S.hcm),1)+' cm',1)+stat('Gas pressure',num(100000+dp)+' Pa');
    $('#lp-eq').innerHTML=FR('Δp = p(gas) − p(air)<br>Δp = h × ρ × g<br>'+num(Math.abs(dp))+' = h × '+num(M.r)+' × '+G+'<br>h = [['+num(Math.abs(dp))+'|'+num(M.r)+' × '+G+']]<br>h = <b>'+num(Math.abs(S.h),3)+' m</b>'+
      '<br>gas pressure = 100 000 '+(dp<0?'−':'+')+' '+num(Math.abs(dp))+'<br>gas pressure = <b>'+num(100000+dp)+' Pa</b>');
    var other=liqSeg.value()==='hg'?Math.abs(dp)/(1000*G):Math.abs(dp)/(13600*G);
    $('#lp-eqnote').textContent=(dp===0?'':(liqSeg.value()==='hg'?'With water in the tube, the same pressure difference would need h = '+num(other,2)+' m. Mercury is 13.6 times denser, so its height difference is 13.6 times smaller. '
        :'With mercury in the tube, the same pressure difference would give h = '+num(other*100,2)+' cm. Water is much less dense, so it shows small pressure differences more clearly. '))+
      'Take g = 10 N/kg and atmospheric pressure as about 100 000 Pa.';
    $('#lp-tablewrap').hidden=true;
  }

  function draw(){
    var dam=part()==='dam', ex=exp();
    $('#lp-hrow').hidden=!dam; $('#lp-prow').hidden=dam; $('#lp-liqgrid').hidden=dam; $('#lp-btns').hidden=!dam;
    takeBtn.hidden=!ex; clearBtn.hidden=!ex || !E.rows.length;
    if(dam) drawDam(); else drawMan();
  }
  function setPart(){ draw(); }
  hIn.addEventListener('input', function(){ E.just=null; draw(); });
  pIn.addEventListener('input', draw);
  expBtn.addEventListener('click', function(){ expBtn.setAttribute('aria-pressed', String(!pressed(expBtn))); E.rows=[]; E.just=null; draw(); });
  takeBtn.addEventListener('click', take);
  clearBtn.addEventListener('click', function(){ E.rows=[]; E.just=null; draw(); });

  // drag the point up and down the dam face: pointer height -> depth, rounded to the slider's step.
  // The arrow keys on the focused point do the same.
  var drag=null;
  function svgPt(e){ var q=svg.createSVGPoint(); q.x=e.clientX; q.y=e.clientY; return q.matrixTransform(svg.getScreenCTM().inverse()); }
  function hOf(q){ return ((q.y-D.ty)/D.s-D.Y0)/(D.YB-D.Y0)*HMAX; }
  function setH(v){ v=Math.max(0,Math.min(HMAX,Math.round(v))); if(+hIn.value!==v){ hIn.value=v; E.just=null; draw(); } }
  svg.addEventListener('pointerdown', function(e){
    if(part()!=='dam' || !(e.target.closest && e.target.closest('.grab'))) return;
    drag={off:hOf(svgPt(e))-(+hIn.value)};
    svg.setPointerCapture(e.pointerId); svg.classList.add('dragging'); e.preventDefault();
  });
  svg.addEventListener('pointermove', function(e){ if(drag) setH(hOf(svgPt(e))-drag.off); });
  function endDrag(){ if(!drag) return; drag=null; svg.classList.remove('dragging'); }
  svg.addEventListener('pointerup', endDrag); svg.addEventListener('pointercancel', endDrag);
  svg.addEventListener('keydown', function(e){
    if(part()!=='dam' || !(e.target.closest && e.target.closest('.grab'))) return;
    var k={ArrowDown:1,ArrowRight:1,ArrowUp:-1,ArrowLeft:-1,PageDown:5,PageUp:-5}[e.key];
    if(e.key==='Enter' || e.key===' '){ if(exp()){ e.preventDefault(); take(); refocus(); } return; }
    if(!k) return; e.preventDefault(); setH(+hIn.value+k); refocus();
  });
  function refocus(){ var p=document.getElementById('lp-pt'); if(p && p.focus) p.focus(); }
  var wasNarrow=narrow(); window.addEventListener('resize', function(){ if(narrow()!==wasNarrow){ wasNarrow=narrow(); draw(); } });

  var showQ=location.search.match(/[?&]show=(dam|man)\b/);
  if(showQ){ partSeg.pick(showQ[1]); $('#lp-part').hidden=true; }
  watchEquals($('#lp-eq'));
  draw();
})();
</script><script id="choice-kit-js">
/* Choice kit (12 Nov 2026): the same block on every animation page. See tools/ANIMATION-STYLE.md, "Choices".
   A group of choices with one chosen gets a track round it (class pick); a .to-q button opens the questions from Explore. */
(function(){
  function on(b){ return b.getAttribute('aria-pressed')==='true' || b.classList.contains('is-on'); }
  function each(sel, fn){ Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }
  function mark(s){
    if(!s.classList.contains('pick')){
      var n=0; Array.prototype.forEach.call(s.children, function(b){ if(b.tagName==='BUTTON' && on(b)) n++; });
      if(n===1) s.classList.add('pick');
    }
    if(s.classList.contains('pick') && !s.hasAttribute('data-fit')){
      var d=getComputedStyle(s).display;
      if(d!=='none'){ s.setAttribute('data-fit','1'); if(d.indexOf('flex')>=0) s.classList.add('fit'); }
    }
  }
  each('.seg:not(.tabs):not(.mode):not(.apps)', function(s){
    mark(s);
    if(window.MutationObserver) new MutationObserver(function(){ mark(s); }).observe(s, {childList:true, subtree:true, attributes:true, attributeFilter:['aria-pressed','class']});
  });
  each('.to-q[data-mode]', function(b){
    var seg=document.getElementById(b.getAttribute('data-mode')); if(!seg) return;
    var bs=seg.querySelectorAll('button');
    function sync(){ b.hidden=!on(bs[0]) || !seg.getClientRects().length; }   // hidden too when the page hides its mode switch (e.g. at a level with no questions)
    b.addEventListener('click', function(){ bs[1].click(); bs[1].focus(); });
    if(window.MutationObserver) new MutationObserver(sync).observe(seg, {subtree:true, attributes:true, attributeFilter:['aria-pressed']});
    document.addEventListener('click', function(){ setTimeout(sync, 0); });
    sync(); setTimeout(sync, 0);
  });
})();
</script>
