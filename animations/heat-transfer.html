<style>

    --bg:#eef1f5; --bg-grid:rgba(29,41,61,0.055);
    --panel:#ffffff; --panel-border:#d7dce4;
    --ink:#182233; --ink-soft:#4c5668; --ink-faint:#8993a5;
    --accent:#d9720c; --accent-soft:#fdead2;
    --good:#15803d; --good-soft:#dcf5e3;
    --bad:#c0311a; --bad-soft:#fbe1db;
    --shadow:0 10px 26px -14px rgba(24,34,51,0.28);
    --topic:#c62828;   --topic-soft:#fde3e1;
    --water:#d6e9fb;   --ice:#eef6fd;   --ice-edge:#9cc3e6;   --water-ink:#3b82c4;
    --water-top:#eaf4fd; --glass:#9fb4c8; --glass-in:#f4f8fb; --thermo:#f3f6fa; --thread:#d7261e;

  }

      --panel:#1b212e; --panel-border:#2c3444;
      --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;
      --accent:#ff9a3d; --accent-soft:#3a2712;
      --good:#4ade80; --good-soft:#123321;
      --bad:#f27159; --bad-soft:#3a1712;
      --shadow:0 14px 30px -14px rgba(0,0,0,0.55);
      --topic:#ff7a6b; --topic-soft:#3d1714;
      --water:#1c3a5a; --ice:#2a3d52; --ice-edge:#6f9bc4; --water-ink:#7fb4ea;
      --water-top:#2b5682; --glass:#7f97ad; --glass-in:#202938; --thermo:#dfe6ee; --thread:#e5392f;

      --wood-f:#8a6a43; --wood-t:#a8855a; --wood-s:#644b2d; --mat:#3b414c; --lid:#8792a3; --case:#56617a;

    --bg:#12161f; --bg-grid:rgba(255,255,255,0.045);
    --panel:#1b212e; --panel-border:#2c3444;
    --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;
    --accent:#ff9a3d; --accent-soft:#3a2712;
    --good:#4ade80; --good-soft:#123321;
    --bad:#f27159; --bad-soft:#3a1712;
    --shadow:0 14px 30px -14px rgba(0,0,0,0.55);

      --water:#1c3a5a; --ice:#2a3d52; --ice-edge:#6f9bc4; --water-ink:#7fb4ea;
      --water-top:#2b5682; --glass:#7f97ad; --glass-in:#202938; --thermo:#dfe6ee; --thread:#e5392f;

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      linear-gradient(var(--bg-grid) 1px,transparent 1px) 0 0/100% 34px,
      linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px) 0 0/34px 100%,
      var(--bg);
    color:var(--ink); font-family:var(--font-body); font-size:14px; -webkit-font-smoothing:antialiased;
  }
  [hidden]{display:none!important;}
  button{font:inherit;color:inherit;}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;}

  .page{max-width:1400px;margin-inline:auto;padding-inline:20px;padding-block:12px 40px;}
  h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:0.2px;text-wrap:balance;margin:0;}
  p{margin:0;line-height:1.55;}

  .home-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-bottom:4px;font:600 13px var(--font-mono);color:var(--ink-soft);text-decoration:none;}
  .home-link:hover{color:var(--accent);}
  .page-head{margin-bottom:12px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px;}
  .eyebrow{font-family:var(--font-mono);font-size:11.5px;color:var(--accent);font-weight:600;margin-bottom:6px;}
  .page-head h1{font-size:clamp(28px,5vw,38px);color:var(--ink);}

  .card{background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;box-shadow:var(--shadow);}
  .btn{
    font-family:var(--font-body);font-weight:600;font-size:13.5px;color:var(--ink);
    background:var(--panel);border:1px solid var(--panel-border);border-radius:9px;
    padding:9px 15px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  }
  .btn:hover{border-color:var(--ink-faint);}
  .btn:disabled{opacity:.45;cursor:default;}
  .btn-primary{background:var(--ink);border-color:var(--ink);color:var(--bg);}
  .btn-primary:hover{opacity:.88;border-color:var(--ink);}
  .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);}
  .btn-group{display:flex;flex-wrap:wrap;gap:10px;}
  /* button rows fill their width (Alex, 2 Nov 2026) */
  .btn-group>.btn,.exp-btns>.btn{flex:1 1 0;min-width:max-content;justify-content:center;}
  .seg:not(.tabs){display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,96px),1fr));}
  .seg:not(.tabs)>button{padding-inline:4px;white-space:nowrap;}

  /* picture on the left with its buttons under it; choices, readings and working on the right */
  .stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,410px);gap:18px 24px;align-items:start;padding:18px;}
  @media (max-width:860px){ .stage{grid-template-columns:minmax(0,1fr);} }
  .view{display:block;width:100%;height:auto;max-height:max(260px,calc(100vh - 300px));}
  .view text{font-family:var(--font-mono);}
  .under{display:flex;flex-direction:column;gap:12px;margin-top:12px;}
  .sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px 24px;}
  .side{display:flex;flex-direction:column;gap:12px;min-width:0;}
  .lab{display:block;font:12.5px var(--font-mono);color:var(--ink-soft);margin-bottom:6px;}
  .lab output{color:var(--ink);font-weight:600;white-space:nowrap;margin-left:6px;}
  input[type=range]{width:100%;accent-color:var(--topic);min-height:28px;}
  .seg{display:flex;flex-wrap:wrap;gap:6px;}
  .seg button{font:12.5px var(--font-mono);padding:8px 11px;min-height:44px;border:1px solid var(--panel-border);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer;}
  .seg button[aria-pressed="true"]{background:var(--topic);border-color:var(--topic);color:var(--panel);}
  .seg button:disabled{opacity:.45;cursor:default;}
  .seg.tabs{gap:0;flex-wrap:nowrap;}
  .seg.tabs button{white-space:nowrap;border-radius:0;margin-left:-1px;}
  .seg.tabs button:first-child{border-radius:8px 0 0 8px;margin-left:0;}
  .seg.tabs button:last-child{border-radius:0 8px 8px 0;}
  .cgrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center;}
  .rowlab{font:11.5px var(--font-mono);color:var(--ink-faint);}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px;}
  .stat{border:1px solid var(--panel-border);border-radius:8px;padding:5px 8px;display:flex;flex-direction:column;justify-content:space-between;}
  .stat small{display:block;font:10.5px var(--font-mono);color:var(--ink-faint);}
  .stat strong{font:600 15px var(--font-mono);color:var(--ink);white-space:nowrap;}
  .stat.hi strong{color:var(--topic);}
  .note{font-size:15px;line-height:1.5;color:var(--ink);padding:10px 12px;border-radius:8px;background:var(--bg);min-height:4.6em;}
  .note b{color:var(--topic);}

  details.working summary{cursor:pointer;font:600 13px var(--font-mono);color:var(--topic);min-height:44px;display:flex;align-items:center;}
  .eq{font-family:var(--font-mono);font-size:14px;line-height:1.75;padding:8px 12px;border-left:3px solid var(--topic);background:var(--topic-soft);border-radius:6px;color:var(--ink);}
  .eq b{color:var(--topic);}
  .eq + .eq{margin-top:8px;}
  .eqnote{font-size:13.5px;color:var(--ink-soft);margin-top:8px;}
  .eqg{display:grid;grid-template-columns:auto auto minmax(0,1fr);column-gap:.45em;row-gap:.2em;align-items:center}
  .eqg-l{justify-self:end;text-align:right}
  .eqg-m{justify-self:center}
  .eqg-r{justify-self:start;min-width:0}
  .eqg-full{grid-column:1/-1}
  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1.25;}
  .frac>span{padding:0 .25em;white-space:nowrap;}
  .frac>span:first-child{border-bottom:1.5px solid currentColor;}
  @media (max-width:560px){ .stage{padding:12px;} .view{max-height:none;} .eq{font-size:12px;padding:6px 8px;} .note{font-size:14px;} }

  /* ===== Experiment kit (tools/experiment-kit/kit.css) ===== */
  .exp-btns{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;}
  #ht-svg.dragging,#ht-svg.dragging *{cursor:grabbing;}
  #ht-svg:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px;}
  .rtable{width:100%;border-collapse:collapse;font:12.5px var(--font-mono);}
  .rtable th{position:sticky;top:0;background:var(--panel);font-weight:600;font-size:11px;color:var(--ink-faint);text-align:right;padding:4px 6px;border-bottom:1px solid var(--panel-border);}
  .rtable td{text-align:right;padding:3px 6px;border-bottom:1px solid var(--panel-border);color:var(--ink);}
  .rtable tr.new td{background:var(--cs, var(--accent-soft));}
  .rtable-wrap{max-height:150px;overflow:auto;border:1px solid var(--panel-border);border-radius:8px;}
  @media (prefers-reduced-motion: no-preference){ .rtable tr.new td{animation:rowin .35s ease-out;} }
  @keyframes rowin{from{opacity:0}to{opacity:1}}
  /* ===== end of Experiment kit ===== */

  .seg button sub,.stat sub{font-size:.75em;}
  #ht-det{cursor:grab;}
  #ht-face{grid-template-columns:repeat(2,minmax(0,1fr));}
  #ht-heat button,#ht-face button,#ht-jump button{white-space:normal;line-height:1.2;}
  .expl p{font-size:13.5px;color:var(--ink-soft);margin:0 0 8px;line-height:1.5;}
  .expl b{color:var(--topic);}
  .cgrid>[hidden]{display:none!important;}

  /* measure mode (?show=measure): the practical page's Do Experiment tab. Nothing is read for the student. */
  .meas-off{display:none !important;}
  /* inside a workout tab (?embed): no page heading, no outer margins */
  .embed body{background:transparent;}
  .embed .page{padding:0;max-width:none;display:flow-root;}
  .embed .home-link,.embed .page-head{display:none;}
  .embed .view{max-height:460px;}
  .view.tall,.embed .view.tall{max-height:none;}
  .side>.seg.tabs{align-self:flex-start;}

</style>

<script>
  // Visit counter (GoatCounter: no cookies, no personal data). Skipped when a page is embedded in a workout, so a visit counts once.
  // pwCountTab(tab, label): counts each workout tab once per visit as a GoatCounter event (path "page#tab"), skipped in frames the same way.
  (function(){
    var off = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var seen = {}, queue = [];
    function send(e){ try { window.goatcounter.count(e); } catch (x) {} }
    window.pwCountTab = function(tab, label){
      if (off || !tab || seen[tab]) return;
      seen[tab] = 1;
      var page = (location.pathname.split('/').pop() || 'index').replace(/\.html$/, '');
      var e = { path: page + '#' + tab, title: (label || tab) + ' · ' + document.title, event: true };
      if (window.goatcounter && window.goatcounter.count) send(e); else queue.push(e);
    };
    if (off) return;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://gc.zgo.at/count.js';
    s.setAttribute('data-goatcounter', 'https://physics-workout.goatcounter.com/count');
    s.onload = function(){ var q = queue; queue = []; q.forEach(send); };
    document.head.appendChild(s);
  })();
</script>

<script>
  // Draft tags and Alex's reviewer button (tools/review/drafts.py writes this block; edit tools/review/snippet.html, then run drafts.py sync).
  // A page is Draft while its row in tools/REVIEW.md is not ✅: <meta name="pw-draft"> on the page, data-draft on its list cards.
  // ?reviewer (once, on any page) turns on reviewer mode in this browser; ?reviewer=off turns it off.
  (function(){
    var on = false, embed = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var m = /[?&]reviewer(?:=([^&]*))?/.exec(location.search);
    on = !!m && m[1] !== 'off';
    try {
      if (m) { if (m[1] === 'off') localStorage.removeItem('pw-reviewer'); else localStorage.setItem('pw-reviewer', '1'); }
      else on = localStorage.getItem('pw-reviewer') === '1';
    } catch (e) {}
    var CSS = '.pw-draft{display:inline-block;vertical-align:middle;margin-left:10px;font:600 11.5px/1.4 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:0;color:var(--bad,#b42318);border:1px dashed currentColor;border-radius:5px;padding:1px 7px;white-space:nowrap}'
      + '.act-top .pw-draft{margin-left:auto;flex:none}.act-top .pw-draft~.cp-tag,.act-top .pw-draft~.ta-tag{margin-left:0}'
      + 'a[data-draft]{position:relative}.pw-draft.pw-corner{position:absolute;top:10px;right:10px;margin:0;background:var(--panel,#fff)}'
      + '.pw-check{display:inline-block;vertical-align:middle;margin-left:8px;font:600 13px/1.4 "IBM Plex Sans",system-ui,sans-serif;color:#fff;background:#1a7f37;border-radius:6px;padding:4px 10px;text-decoration:none;white-space:nowrap}'
      + '.pw-check:hover{background:#116329}.pw-check:focus-visible{outline:2px solid #1a7f37;outline-offset:2px}'
      + '.pw-reviewer{position:fixed;left:10px;bottom:10px;z-index:9999;font:500 12px/1.4 "IBM Plex Mono",ui-monospace,monospace;background:#1d2433;color:#fff;border-radius:6px;padding:4px 9px;opacity:.85}'
      + '.pw-reviewer a{color:#ffc83d}';
    function tag(){ var t = document.createElement('span'); t.className = 'pw-draft'; t.title = 'Not yet checked'; t.textContent = 'Draft'; return t; }
    function go(){
      var st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st);
      var meta = document.querySelector('meta[name="pw-draft"]'), h1 = document.querySelector('h1');
      if (meta && h1 && !embed) {
        h1.appendChild(tag());
        if (on) {
          var page = meta.getAttribute('content'), b = document.createElement('a');
          b.className = 'pw-check'; b.target = '_blank'; b.rel = 'noopener'; b.textContent = '✓ Checked';
          b.title = 'Opens a GitHub issue. Submit it and the Draft tag goes in a minute or two.';
          b.href = 'https://github.com/Skati1401/Physics-Workout/issues/new?title=' + encodeURIComponent('Checked: ' + page)
            + '&body=' + encodeURIComponent('Submit this issue to mark `' + page + '` as checked. The Draft tag goes in a minute or two, and the issue closes itself.');
          h1.appendChild(b);
        }
      }
      document.querySelectorAll('a[data-draft]').forEach(function(a){
        if (a.querySelector('.pw-draft')) return;
        var t = tag(), top = a.querySelector('.act-top');
        if (top) top.insertBefore(t, top.querySelector('.cp-tag,.ta-tag'));
        else { t.className += ' pw-corner'; a.appendChild(t); }
      });
      // No tag on a unit or theme heading (Alex, 12 Nov 2026): only the pages and their cards.
      if (on && !embed) {
        // Carry ?reviewer in every link to another page of the site, so reviewer mode survives
        // browsers that clear site storage (school Chromebooks) and pages cached from before.
        var carry = function(a){
          try {
            var u = new URL(a.href, location.href);
            if (u.origin !== location.origin || !/(\.html|\/)$/.test(u.pathname) || u.searchParams.has('reviewer')) return;
            u.searchParams.set('reviewer', ''); a.href = u.href.replace('reviewer=', 'reviewer');
          } catch (e) {}
        };
        document.querySelectorAll('a[href]').forEach(carry);
        ['click', 'auxclick', 'contextmenu'].forEach(function(ev){
          document.addEventListener(ev, function(e){ var a = e.target.closest && e.target.closest('a[href]'); if (a) carry(a); }, true);
        });
        var r = document.createElement('div'); r.className = 'pw-reviewer';
        r.innerHTML = 'Reviewer mode · <a href="' + location.pathname + '?reviewer=off">turn off</a>';
        document.body.appendChild(r);
      }
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
  })();
</script>

/* ================= Experiment kit (copy this block into an animation page's <script>) =================
   The reusable parts of an animation's Experiment mode, taken from animations/hookes-law.html:
   - expRun():     the run itself: step the independent variable up one interval at a time, then
                   (optionally) back down again, measuring at every step
   - expReading(): a reading with a small, fixed pattern of reading error, rounded to the instrument's
                   resolution, that never goes the wrong way
   - expTable():   the results table (sticky header, newest row highlighted, a column per run)
   - expCross(), expRing(), expKey(): SVG marks for plotted readings (× first run, ○ return run)
   The page keeps its own picture, physics, graph axes and notes. See tools/experiment-kit/README.md.
   Plain ES5 so it can sit inside any animation page's IIFE. */

// A fixed pattern of reading errors, in units of the instrument's resolution. Fixed (not random) so a
// teacher sees the same results as the class, and a re-run gives the same table.
var EXP_ERR = [0, 1, -1, 0, 2, -1, 1, -2, 0, 1, -1, 0, 1, -1, 2, 0, -1, 1, 0, -2, 1];
function expErr(i){ return EXP_ERR[((i % EXP_ERR.length) + EXP_ERR.length) % EXP_ERR.length]; }

// What the student reads off the instrument.
//   trueVal  the value the physics gives at this step
//   prevVal  the reading taken at the step before (or the start value)
//   res      the instrument's resolution (0.1 cm ruler, 0.05 mm vernier, 0.01 A ammeter, 1° protractor)
//   i        the step number (picks the error from the pattern)
//   scale    how big the error is, in resolutions (default 1; 0.5 for a fine instrument)
// The error is never more than a quarter of the change since the last reading, so a reading never
// goes the wrong way (an extension never falls as the load rises, a current never drops as V rises).
function expReading(trueVal, prevVal, res, i, scale){
  var gap = Math.abs(trueVal - prevVal);
  var err = i > 0 ? expErr(i) * Math.min(res * (scale == null ? 1 : scale), gap / 4) : 0;
  var r = Math.round((trueVal + err) / res) * res;
  var dp = Math.max(0, Math.ceil(-Math.log10(res) - 1e-9));
  return +r.toFixed(dp);
}

// The run. cfg = {
//   start: 0,                 value of the independent variable before the first step
//   max: 10,                  last value of the first run (the run stops there)
//   step: 1,                  the interval (the page can change it with setStep, which resets the run)
//   reverse: true,            allow a return run (unloading, turning the voltage back down)
//   measure: function(v, phase, prevReading){ return reading },   phase is 'up' or 'down'
//   onChange: function(run, what){}  what is 'up', 'down' or 'reset'
// }
// run.up and run.down are arrays of {v, r}. run.phase is 'up' until the first step back, then 'down'.
function expRun(cfg){
  var run = { up: [], down: [], phase: 'up', value: cfg.start || 0, peak: cfg.start || 0, step: cfg.step || 1 };
  var r6 = function(x){ return Math.round(x * 1e6) / 1e6; };
  run.upDone = function(){ return run.phase === 'down' || run.peak >= cfg.max - 1e-9; };
  run.downDone = function(){ return run.phase === 'down' && run.value <= (cfg.start || 0) + 1e-9; };
  run.last = function(){ var a = run.phase === 'down' && run.down.length ? run.down : run.up; return a[a.length - 1] || null; };
  run.stepUp = function(){
    if(run.phase !== 'up' || run.upDone()) return false;
    var prev = run.up.length ? run.up[run.up.length - 1].r : null;
    var v = r6(Math.min(cfg.max, run.value + run.step));
    run.value = run.peak = v;
    run.up.push({ v: v, r: cfg.measure(v, 'up', prev) });
    if(cfg.onChange) cfg.onChange(run, 'up');
    return true;
  };
  run.stepDown = function(){
    if(!cfg.reverse || run.value <= (cfg.start || 0) + 1e-9 || !run.up.length) return false;
    run.phase = 'down';
    var prev = run.down.length ? run.down[run.down.length - 1].r : run.up[run.up.length - 1].r;
    var v = r6(Math.max(cfg.start || 0, run.value - run.step));
    run.value = v;
    run.down.push({ v: v, r: cfg.measure(v, 'down', prev) });
    if(cfg.onChange) cfg.onChange(run, 'down');
    return true;
  };
  run.reset = function(){ run.up = []; run.down = []; run.phase = 'up'; run.value = run.peak = cfg.start || 0; if(cfg.onChange) cfg.onChange(run, 'reset'); };
  run.setStep = function(s){ run.step = s; run.reset(); };
  return run;
}

// The results table. cols = [{label:'Load (N)', key:'v', dp:0}, {label:'Extension loading (cm)', key:'up', dp:1}, ...]
// rows = [{v:1, up:1.6, down:''}, ...]. newKey/newV highlight the reading just taken (fades in).
// Wrap it in .rtable-wrap so a long table scrolls under its sticky header.
function expTable(el, cols, rows, newV){
  var fmt = function(x, dp){ return (x === '' || x == null) ? '' : (+x).toFixed(dp || 0); };
  var h = '<table class="rtable"><thead><tr>' + cols.map(function(c){ return '<th>' + c.label + '</th>'; }).join('') + '</tr></thead><tbody>';
  rows.forEach(function(row){
    h += '<tr' + (newV != null && row.v === newV ? ' class="new"' : '') + '>' + cols.map(function(c){ return '<td>' + fmt(row[c.key], c.dp) + '</td>'; }).join('') + '</tr>';
  });
  el.innerHTML = h + '</tbody></table>';
}

// Plotted readings, as SVG strings. Size 5 suits a 300px-wide graph.
function expCross(cx, cy, s){ s = s || 5; return '<path d="M' + (cx - s) + ',' + (cy - s) + ' L' + (cx + s) + ',' + (cy + s) + ' M' + (cx + s) + ',' + (cy - s) + ' L' + (cx - s) + ',' + (cy + s) + '" stroke="var(--ink)" stroke-width="2"/>'; }
function expRing(cx, cy, r){ return '<circle cx="' + cx + '" cy="' + cy + '" r="' + (r || 4.5) + '" fill="none" stroke="var(--accent)" stroke-width="2"/>'; }
// A two-line key in the bottom-right corner of a graph: expKey(rightX, bottomY, 'loading', 'unloading')
function expKey(x, y, upLabel, downLabel){
  return '<text x="' + x + '" y="' + (y - 14) + '" text-anchor="end" font-size="10.5" fill="var(--ink)">× ' + upLabel + '</text>' +
         '<text x="' + x + '" y="' + y + '" text-anchor="end" font-size="10.5" fill="var(--accent)">○ ' + downLabel + '</text>';
}
/* ================= end of Experiment kit ================= */

  function part(){ return modeSeg.value(); }

  var raf=0, last=0, running=false;
  function stop(){ running=false; cancelAnimationFrame(raf); }
  function loop(){ cancelAnimationFrame(raf); last=performance.now(); raf=requestAnimationFrame(frame); }
  function frame(now){
    // keep to clock time on a slow laptop: a long frame is worked through in steps of 0.05 s (up to 0.5 s)
    var real=Math.min(0.5,(now-last)/1000); last=now;
    var more=false, p=part();
    do{
      var chunk=Math.min(0.05,real), dt=chunk*(slowOn()?0.3:1); real-=chunk;
      if(p==='cond') more=condTick(dt);
      else if(p==='conv') more=convTick(dt);
      else more=radTick(dt);
    }while(more && real>1e-6);
    draw();
    if(more) raf=requestAnimationFrame(frame); else { running=false; draw(); }
  }

  /* ---------------- CONDUCTION ----------------
     Four rods, 14 cm long, pushed through the side of a tank of hot water kept at 90 °C. A drawing pin is
     stuck with wax 11 cm from the water on each. Each rod: dT/dt = D d²T/dx² − h(T − 20), with the
     far end losing energy only to the air. Real diffusivities; h and the wax (melts at 50 °C) tuned so
     the copper pin drops at about 0:55, aluminium 1:03, iron about 4:54, glass never in 10 min.
     A run is 10 minutes at 30× speed: 20 s on the clock. */
  var RODS=[
    {k:'cu', name:'Copper',    D:1.11e-4, h:0.0008, col:'#c47a45'},
    {k:'al', name:'Aluminium', D:9.7e-5,  h:0.0008, col:'#b9bec6'},
    {k:'fe', name:'Iron',      D:2.3e-5,  h:0.0008, col:'#77777e'},
    {k:'gl', name:'Glass',     D:3.4e-7,  h:0.0015, col:'#cfe6ee'}
  ];
  var RL=0.14, RN=28, RDX=RL/RN, PIN=0.11, PI_=Math.round(PIN/RDX), MELT=50, TW=90, TR=20, CEND=600, CSPEED=30;
  var C={t:0, T:null, drop:[], rec:[]};
  function condInit(){ C.t=0; C.T=RODS.map(function(){ var a=[]; for(var i=0;i<=RN;i++) a.push(TR); a[0]=TW; return a; }); C.drop=RODS.map(function(){ return null; }); C.rec=RODS.map(function(){ return null; }); C.acc=0; C.just=null; }
  function condStep(ts){   // advance the physics by ts seconds
    RODS.forEach(function(r,k){
      var T=C.T[k], left=ts, sub=Math.min(0.4*RDX*RDX/r.D, 1);
      while(left>1e-9){
        var dt=Math.min(sub,left), n=T.slice();
        for(var i=1;i<RN;i++) n[i]=T[i]+dt*(r.D*(T[i+1]-2*T[i]+T[i-1])/(RDX*RDX)-r.h*(T[i]-TR));
        n[RN]=T[RN]+dt*(r.D*2*(T[RN-1]-T[RN])/(RDX*RDX)-r.h*(T[RN]-TR));
        T=n; left-=dt;
      }
      C.T[k]=T;
    });
    C.t+=ts;
    RODS.forEach(function(r,k){ if(C.drop[k]==null && C.T[k][PI_]>=MELT) C.drop[k]=C.t; });
  }
  function condTo(t){ condInit(); while(C.t<t-1e-9) condStep(Math.min(5,t-C.t)); }
  // the standard run's drop times, for Jump to
  condTo(CEND); var DROP=C.drop.slice(); condInit();
  var nRec=0;
  function condTick(dt){
    if(!running) return false;
    if(MEAS){   // whole seconds, so every run gives the same times; stop the stopwatch as each pin drops
      C.acc+=dt*CSPEED;
      while(C.acc>=1 && C.t<CEND-1e-9){
        var was=C.drop.slice(); condStep(1); C.acc-=1; C.t=Math.round(C.t);
        for(var q=0;q<RODS.length;q++) if(was[q]==null && C.drop[q]!=null){ C.drop[q]=C.t; C.just=q; C.acc=0; running=false; return false; }
      }
      if(C.t>=CEND-1e-9){ C.just=null; running=false; return false; }
      return true;
    }
    var target=Math.min(CEND, C.t+dt*CSPEED);
    while(C.t<target-1e-9) condStep(Math.min(1,target-C.t));
    if(exp()) RODS.forEach(function(r,k){
      if(C.drop[k]!=null && C.rec[k]==null){ C.rec[k]=Math.max(1,Math.round(C.drop[k]+expErr(nRec+2)*1.2)); nRec++; C.justAdded=k; }
    });
    if(C.t>=CEND-1e-9){ running=false; return false; }
    return true;
  }
  function heatCol(T){
    var st=[[20,[107,127,153]],[40,[214,170,74]],[60,[240,128,40]],[90,[214,38,30]]];
    T=Math.max(20,Math.min(90,T));
    for(var i=1;i<st.length;i++) if(T<=st[i][0]){
      var a=st[i-1], b=st[i], f=(T-a[0])/(b[0]-a[0]);
      return 'rgb('+[0,1,2].map(function(j){ return Math.round(a[1][j]+f*(b[1][j]-a[1][j])); }).join(',')+')';
    }
    return 'rgb(214,38,30)';
  }
  /* ================= the pictures =================
     Each part is one wide picture of the apparatus as solid objects (viewBox about 860 wide); under 560px the
     same function lays it out tall. The physics above works in its own units; these functions only draw it. */
  function condLay(){ return narrow()
    ? {W:430,H:384, tx:10,tw:76,ty:66,by:326, dx:24,dy:-13, X0:98, PX:17, RY:[112,172,232,292], sw:[346,8], key:[150,352], fs:12.5, tall:1}
    : {W:860,H:352, tx:30,tw:118,ty:46,by:308, dx:36,dy:-20, X0:166, PX:36, RY:[98,154,210,266], sw:[772,8], key:[330,330], fs:13, tall:0}; }
  function drawCond(){
    var L=condLay(), ex=exp(), s='', x0=L.X0, cm=L.PX, xe=x0+RL*100*cm, pxn=x0+PIN*100*cm, by=L.by, r=5;
    var tl=L.tx, tr=L.tx+L.tw, tt=L.ty, th=by-tt, wy=tt+16, dx_=L.dx, dy_=L.dy, hot='rgba(214,38,30,';
    // the bench
    s+=box(4,by,L.W-10-dx_,9,dx_,dy_,'var(--wood-f)',{top:'var(--wood-t)',side:'var(--wood-s)'});
    // the glass tank: its back wall, then what is inside it, then the faces nearest to us
    s+=rect(tl+dx_,tt+dy_,L.tw,th,'var(--glass-in)',' stroke="var(--glass)" stroke-width="1.5"');
    RODS.forEach(function(rd,k){ var y=L.RY[k], xi=tl+L.tw*0.4+dx_/2; s+=rect(xi,y-r,x0-xi,2*r,ex?rd.col:heatCol(TW))+rect(xi,y-r,x0-xi,2*r*0.35,'#fff',' opacity=".28"'); });
    s+=thermo(tl+22+dx_/2,by-12+dy_/2,by-40,0,tt-2,100,TW,{nonum:1,step:10,num:50});
    s+=pg([[tl,wy],[tr,wy],[tr+dx_,wy+dy_],[tl+dx_,wy+dy_]],hot+'0.14)')+pg([[tr,wy],[tr+dx_,wy+dy_],[tr+dx_,by+dy_],[tr,by]],hot+'0.26)')+rect(tl,wy,L.tw,by-wy,hot+'0.17)');
    s+=pg([[tl,tt],[tr,tt],[tr+dx_,tt+dy_],[tl+dx_,tt+dy_]],'none',' stroke="var(--glass)" stroke-width="2" stroke-linejoin="round"')+
       pg([[tr,tt],[tr+dx_,tt+dy_],[tr+dx_,by+dy_],[tr,by]],'none',' stroke="var(--glass)" stroke-width="2" stroke-linejoin="round"')+
       rect(tl,tt,L.tw,th,'none',' stroke="var(--glass)" stroke-width="2.4"')+ln(tl+9,tt+26,tl+9,by-16,'#fff',3,' stroke-linecap="round" opacity=".6"');
    s+=txt(tl,tt-(L.tall?34:28),'hot water, '+TW+' °C',{fs:L.fs,c:'var(--ink)'});
    // 11 cm from the water to each pin
    var ya=L.RY[0]-30;
    s+=ln(x0,ya,pxn,ya,'var(--ink-soft)',1.2)+'<path d="M'+f1(x0)+','+ya+' l7,-3.4 v6.8 z M'+f1(pxn)+','+ya+' l-7,-3.4 v6.8 z" fill="var(--ink-soft)"/>'+
       ln(x0,ya-6,x0,ya+6,'var(--ink-soft)',1.2)+ln(pxn,ya-6,pxn,L.RY[3]+r,'var(--ink-faint)',1,' stroke-dasharray="3 4"')+txt((x0+pxn)/2,ya-7,'11 cm',{a:'middle',fs:L.fs-0.5});
    // the rods: round bars pushed through bungs in the side of the tank
    RODS.forEach(function(rd,k){
      var y=L.RY[k], T=C.T[k], i, lastCol=rd.col;
      for(i=0;i<RN;i++){ lastCol=ex?rd.col:heatCol((T[i]+T[i+1])/2); s+=rect(x0+i*RDX*100*cm,y-r,RDX*100*cm+0.6,2*r,lastCol); }
      s+=rect(x0,y-r,xe-x0,2*r*0.36,'#fff',' opacity="'+(rd.k==='gl'?0.55:0.3)+'"')+rect(x0,y+r*0.35,xe-x0,r*0.65,'#000',' opacity=".16"');
      if(rd.k==='gl') s+=rect(x0,y-r,xe-x0,2*r,'none',' stroke="var(--glass)" stroke-width="1"');
      s+=ell(xe,y,2.6,r,lastCol)+ell(xe,y,2.6,r,'#fff',' opacity=".28"')+ell(x0,y,4.5,r+3.5,'#34343a')+ell(x0-0.8,y-1,2.2,r,'#fff',' opacity=".12"');
      s+=txt(xe+10,y+4.5,rd.name,{fs:L.fs,c:'var(--ink)'});
      // the wax and its drawing pin
      var d=C.drop[k], fall=0;
      if(d!=null) fall=RM?40:Math.min(40,(C.t-d)*6);
      if(fall<40){
        s+='<g opacity="'+(1-fall/40).toFixed(2)+'" transform="translate(0,'+fall.toFixed(1)+')">';
        if(d==null) s+=ell(pxn,y+r+2,8,4.6,'#f3e3a6',' stroke="#b49a3c"')+ell(pxn-2.5,y+r+0.6,2.6,1.2,'#fff',' opacity=".6"');
        s+=ln(pxn,y+r+8,pxn,y+r+25,'var(--steel)',1.8,' stroke-linecap="round"')+ell(pxn,y+r+8,6.5,2.5,'var(--steel)')+ell(pxn-1.5,y+r+7.4,3,1,'var(--steel-hi)')+'</g>';
      }
      if(d!=null) s+=txt(pxn+14,y+r+22,(ex?'pin dropped':'dropped at '+mmss(d)),{fs:L.fs-1,c:'var(--topic)'});
    });
    if(MEAS) s+=stopwatch(L.sw[0]-(L.tall?26:58),L.sw[1]+4,mmss(C.t),L.tall?1.3:1.7);
    else s+=stopwatch(L.sw[0],L.sw[1],mmss(C.t));
    if(!ex){
      var gx_=L.key[0], gy_=L.key[1]; for(var j=0;j<=20;j++) s+=rect(gx_+j*7,gy_,7.5,9,heatCol(20+j*3.5));
      s+=txt(gx_-7,gy_+9,'20 °C',{a:'end',fs:12})+txt(gx_+155,gy_+9,'90 °C',{fs:12});
    }
    return {s:s, W:L.W, H:L.H, tall:L.tall};
  }
  function condNote(){
    var ex=exp(), done=C.t>=CEND-1e-9, order=RODS.map(function(r,k){ return [k,ex?C.rec[k]:C.drop[k]]; }).filter(function(a){ return a[1]!=null; }).sort(function(a,b){ return a[1]-b[1]; });
    if(MEAS){
      if(C.t===0) return 'Each rod has a pin stuck on with wax, 11 cm from the hot water. Press <b>Start</b> and watch the pins. The stopwatch stops each time a pin drops, so that you can read it.';
      if(done) return 'The stopwatch has reached 10 minutes, and the run stops here. In your table, write “did not drop” for any pin that is still on.';
      if(running) return 'Timing… watch the pins.';
      if(C.just!=null) return 'A pin has dropped. Write the <b>time on the stopwatch</b> in your table, in the row for that rod. Then press <b>Carry on</b>.';
      return 'Paused. Press <b>Carry on</b>.';
    }
    if(ex){
      if(C.t===0) return 'Press <b>Start</b>. Each rod has a pin stuck on with wax, 11 cm from the hot water. Watch the pins and record the stopwatch time when each one drops.';
      if(!done) return 'Timing… '+(order.length?order.length+' of 4 pins have dropped.':'no pins have dropped yet.')+' The run stops at 10 minutes.';
      var best=RODS[order[0][0]].name.toLowerCase();
      return 'Done. The '+best+' pin dropped first, so '+best+' is the <b>best conductor</b> here. The glass pin was still on after 10 minutes: glass is a poor conductor (an insulator).';
    }
    if(C.t===0) return 'Energy from the hot water is conducted along each rod. The colours show the temperature. Press <b>Play</b>.';
    if(!order.length) return 'The ends in the water are hot. Energy is conducted along each rod, fastest along the metals.';
    if(done) return 'After 10 minutes the copper and aluminium are hot all along. Iron is slower, and the glass is still cold just outside the water: glass is a poor conductor.';
    var k=order[order.length-1][0];
    return 'The '+RODS[k].name.toLowerCase()+' pin dropped at '+mmss(order[order.length-1][1])+': the wax there reached '+MELT+' °C and melted.';
  }
  function condStats(){
    return RODS.map(function(r,k){ return stat(r.name+' at pin', Math.round(C.T[k][PI_])+' °C', C.drop[k]!=null); }).join('');
  }
  function condTable(){
    var rows=RODS.map(function(r,k){ return '<tr'+(C.justAdded===k?' class="new"':'')+'><td style="text-align:left">'+r.name+'</td><td>'+(C.rec[k]!=null?mmss(C.rec[k]):(C.t>=CEND-1e-9?'still on':''))+'</td><td>'+(C.rec[k]!=null?C.rec[k]:'')+'</td></tr>'; }).join('');
    tableEl.innerHTML='<table class="rtable"><thead><tr><th style="text-align:left">Rod</th><th>Pin dropped (min:s)</th><th>Time (s)</th></tr></thead><tbody>'+rows+'</tbody></table>';
  }
  function jumpTo(v){
    stop();
    var t = v==='0' ? 0 : v==='end' ? CEND : v==='cu' ? DROP[0]+1 : DROP[2]+1;
    condTo(t); draw();
  }

  /* ---------------- CONVECTION ----------------
     Water in a beaker (inside 340 × 220 px). Heating the bottom at xh sets up one convection cell on each
     side of xh, from the stream function ψ = s·A·sin(π(x − x0)/w)·sin(πy/H): water rises above the heat,
     spreads across the top, sinks at the side and comes back along the bottom. Heating at the top gives no
     current: the warm water is less dense and stays at the top. */
  var BX=130, BY=40, BW=340, BH=220, VMAX=9, CVEND=240, CVSPEED=6, XC=75;
  var V={t:0, dye:[], front:null, marks:[], cmp:false, emit:0};
  function heatX(){ var h=heatSeg.value(); return h==='under' ? XC-6 : h==='mid' ? BW/2 : null; }
  function vel(x,y,t){   // x across from the left wall, y up from the bottom (px); px per sim second
    var xh=heatX(); if(xh==null) return [0,0];
    var g=1-Math.exp(-t/15), x0, w, sg;
    if(x<xh){ x0=0; w=xh; sg=1; } else { x0=xh; w=BW-xh; sg=-1; }
    var A=VMAX*w/Math.PI*g;
    var a=Math.PI*(x-x0)/w, b=Math.PI*y/BH;
    return [sg*A*(Math.PI/BH)*Math.sin(a)*Math.cos(b), -sg*A*(Math.PI/w)*Math.cos(a)*Math.sin(b)];
  }
  function adv(p,dt,t){
    var k1=vel(p.x,p.y,t), k2=vel(p.x+k1[0]*dt/2,p.y+k1[1]*dt/2,t);
    p.x+=k2[0]*dt; p.y+=k2[1]*dt;
  }
  var seed=rng(7);
  function convInit(){ V.t=0; V.dye=[]; V.front={x:XC,y:6}; V.marks=[]; V.cmp=false; V.emit=0; seed=rng(7); }
  function convStep(ts){
    var n=Math.max(1,Math.ceil(ts/0.5)), dt=ts/n;
    for(var j=0;j<n;j++){
      var t=V.t;
      if(t<150){ V.emit+=dt*2.2; while(V.emit>=1 && V.dye.length<420){ V.emit--; V.dye.push({x:XC+(seed()-0.5)*8, y:3+seed()*5}); } }
      var sd=Math.sqrt(2*1.6*dt);
      V.dye.forEach(function(p){
        adv(p,dt,t);
        p.x+=(seed()-0.5)*2*sd; p.y+=(seed()-0.5)*2*sd;
        p.x=Math.max(2,Math.min(BW-2,p.x)); p.y=Math.max(1,Math.min(BH-2,p.y));
      });
      adv(V.front,dt,t); V.front.x=Math.max(3,Math.min(BW-3,V.front.x)); V.front.y=Math.max(3,Math.min(BH-3,V.front.y));
      V.t+=dt;
    }
  }
  function convTick(dt){
    if(!running) return false;
    convStep(Math.min(CVEND-V.t, dt*CVSPEED));
    if(V.t>=CVEND-1e-9){ running=false; return false; }
    return true;
  }
  function where(p){
    var v=vel(p.x,p.y,V.t), sp=Math.hypot(v[0],v[1]);
    if(heatX()==null || sp<0.6) return 'at the bottom, by the crystal';
    if(v[1]>Math.abs(v[0])) return 'rising above the heat';
    if(-v[1]>Math.abs(v[0])) return 'sinking down the side';
    return p.y>BH/2 ? 'moving across the top' : 'moving along the bottom';
  }
  function markFront(){
    if(V.marks.length>=12) return;
    V.marks.push({x:V.front.x, y:V.front.y, t:Math.round(V.t), w:where(V.front)});
    draw();
  }
  // ---- convection: the beaker's water is BW × BH with its top left corner at (BX, BY)
  var VL=null;
  function convLay(){ var n=narrow(); BX=n?45:124; BY=n?84:58;
    VL = n ? {W:430,H:642, dg:{x:115,y:452,w:200,h:110}, sw:[346,4], tall:1} : {W:860,H:380, dg:{x:616,y:96,w:204,h:130}, sw:[502,72], tall:0}; }
  function cvx(x){ return BX+x; } function cvy(y){ return BY+BH-y; }
  // a rounded loop inside one cell, with arrows showing the flow. M maps the water's own coordinates to the picture.
  function loopPath(x0,w,dir,M){
    M=M||{X:cvx,Y:cvy,r:30,w:2.5};
    var ix=x0+w*0.22, iw=w*0.56, iy=BH*0.2, ih=BH*0.6;
    var Lx=M.X(ix), Rx=M.X(ix+iw), T=M.Y(iy+ih), B=M.Y(iy), r=Math.min(M.r,(Rx-Lx)/2,(B-T)/2);
    // dir 1: up on the right side (heat to the right); -1: up on the left side
    var d = dir>0
      ? 'M'+Rx+','+(B-r)+' L'+Rx+','+(T+r)+' Q'+Rx+','+T+' '+(Rx-r)+','+T+' L'+(Lx+r)+','+T+' Q'+Lx+','+T+' '+Lx+','+(T+r)+' L'+Lx+','+(B-r)+' Q'+Lx+','+B+' '+(Lx+r)+','+B+' L'+(Rx-r)+','+B+' Q'+Rx+','+B+' '+Rx+','+(B-r)

  function radNote(){
    var ex=exp();
    if(cans()){
      var done=ex ? (R.can.length && R.can[R.can.length-1].t>=10) : R.t>=10;
      if(MEAS){
        var lm=R.can[R.can.length-1];
        if(running) return 'Heating… both cans get the same radiation from the heater.';
        if(lm.t===0) return 'Both cans hold the same volume of cold water, the same distance from the heater. Read both thermometers in the close-up, to the nearest 0.5 °C, and write the temperatures at 0 minutes in your table. Then press <b>Heat for 2 minutes</b>.';
        return 'The stopwatch reads '+lm.t+' minutes. Read both thermometers, to the nearest 0.5 °C, and write the temperatures in your table. '+(done?'That was the last reading.':'Then heat for 2 minutes more.');
      }
      if(ex){
        if(!R.can.length) return 'Both cans hold the same volume of cold water, the same distance from the heater. Press <b>First reading</b>.';
        if(!done) return 'Press <b>Next reading</b> for the next readings, every '+intSeg.value()+' min. The run ends at 10 minutes.';
        var L=R.can[R.can.length-1];
        return 'Done. The matt black can warmed by '+(L.b-20).toFixed(1)+' °C and the shiny can by '+(L.s-20).toFixed(1)+' °C. <b>Matt black surfaces are better absorbers</b> of infrared radiation.';
      }
      if(!R.t) return 'The heater emits infrared radiation onto both cans. Press <b>Play</b>.';
      return done ? 'After 10 minutes the matt black can is much warmer: dark, matt surfaces are <b>good absorbers</b>; shiny surfaces reflect most of the radiation.' : 'Both cans receive the same radiation. The matt black can absorbs more of it, so its water warms faster.';
    }
    var keys=Object.keys(R.rd);
    if(MEAS) return Math.abs(R.ang-R.angT)>=0.5 ? 'Turning the cube…'
      : 'The <b>'+FACES[R.face].n.toLowerCase()+'</b> face is towards the detector. Read the <b>millivoltmeter</b> and write the reading in your table. Then turn the cube to another face with the Face buttons. The detector stays 10 cm from the cube, and every face is at the temperature of the water.';
    if(ex){
      if(!keys.length) return 'Drag the detector to a distance, then press <b>Take reading</b>. Turn the cube with the Face buttons and read each face.';
      var ds={}; keys.forEach(function(k){ ds[R.rd[k].d+'/'+R.rd[k].tw]=1; });
      if(Object.keys(ds).length>1) return 'Not a fair test: some faces were read at a different distance or water temperature. Keep both the same and read that face again.';
      if(keys.length<4) return keys.length+' of 4 faces read. Keep the detector where it is and turn the cube to the next face.';
      var order=keys.map(Number).sort(function(a,b){ return R.rd[b].r-R.rd[a].r; });
      return 'Done. Highest to lowest: '+order.map(function(k){ return FACES[k].n.toLowerCase(); }).join(', ')+'. <b>Matt black is the best emitter</b> of infrared; shiny silver is the worst.';
    }
    if(running) return 'Turning the cube to each face in turn. Every face is at the same temperature, so only the surface changes.';
    return FACES[R.face].n+' face: '+(R.face===0?'the best emitter of infrared.':R.face===3?'the worst emitter: shiny surfaces emit little infrared.':'it emits less than matt black.')+' Move the detector or change the water temperature to see the reading change.';
  }

  /* ---------------- explanations ---------------- */
  var EXPL={
    cond:'<p>In a solid, the particles at the hot end vibrate more. They pass energy on to their neighbours, so energy is <b>conducted</b> along the rod.</p><p>Metals also have <b>free electrons</b>, which carry energy quickly along the rod. That is why metals are good conductors and glass is a poor one.</p><p>Fair test: the rods are the same length and thickness, in the same hot water, with the same amount of wax at the same distance.</p>',
    conv:'<p>The water above the heat warms up and <b>expands</b>. The same mass now takes up a bigger volume, so its <b>density</b> is lower and it rises.</p><p>Cooler, denser water sinks to take its place. This flow is a <b>convection current</b>. It happens in liquids and gases, not in solids.</p><p>Heating at the top makes no current: the warm, less dense water is already at the top.</p>',
    rad:'<p>All objects emit and absorb <b>infrared radiation</b>. The hotter an object, the more it emits.</p><p><b>Dark, matt</b> surfaces are good emitters and good absorbers. <b>Light, shiny</b> surfaces are poor emitters and poor absorbers: they reflect most of the radiation.</p><p>Radiation needs no particles, so it can travel through a vacuum.</p>'
  };

  /* ---------------- shared wiring ---------------- */
  function draw(){
    var p=part(), ex=exp(), o;
    if(p==='cond'){ o=drawCond(); noteEl.innerHTML=condNote(); statsEl.innerHTML=condStats(); if(ex) condTable(); }
    else if(p==='conv'){ o=drawConv(); noteEl.innerHTML=convNote(); statsEl.innerHTML=convStats(); if(ex) convTable(); }
    else { o=cans()?drawCans():drawCube(); noteEl.innerHTML=radNote(); statsEl.innerHTML=radStats(); if(ex) radTable(); }
    svg.setAttribute('viewBox','0 0 '+o.W+' '+o.H); svg.classList.toggle('tall',!!o.tall);
    svg.innerHTML=o.s;
    $('#ht-do').textContent=R.d+' cm'; $('#ht-two').textContent=R.tw+' °C';
    setPlayLabel();
    cmpBtn.disabled=!(V.marks.length>=5) || V.cmp;
    actBtn.disabled=!(V.t>0) || V.marks.length>=12;
  }
  function setPlayLabel(){
    var p=part(), ex=exp(), lab;
    if(p==='rad' && !cans() && ex) lab='Take reading';
    else if(p==='rad' && cans() && ex) lab = R.can.length ? 'Next reading' : 'First reading';
    else lab = running ? '&#10074;&#10074; Pause' : (ex && p==='cond' ? (MEAS && C.t>0 && C.t<CEND-1e-9 ? '&#9654; Carry on' : '&#9654; Start') : '&#9654; Play');
    if(MEAS && p==='rad' && cans()) lab='&#9654; Heat for 2 minutes';
    playBtn.innerHTML=lab;
    var d = p==='rad' && cans() && ex && R.can.length && R.can[R.can.length-1].t>=10;
    playBtn.disabled = !!d || (p==='rad' && cans() && ex && running);
  }
  function setRows(){

    $('#ht-slab').hidden=$('#ht-setup').hidden=p!=='rad';
    $('#ht-flab').hidden=$('#ht-face').hidden=!(p==='rad' && !cn);
    $('#ht-ilab').hidden=$('#ht-int').hidden=!(p==='rad' && cn && ex);
    $('#ht-sliders').hidden=!(p==='rad' && !cn);
    actBtn.hidden=cmpBtn.hidden=!(p==='conv' && ex);
    $('#ht-clear').hidden=!ex; $('#ht-tablewrap').hidden=!ex; statsEl.hidden=ex;
    slowBtn.hidden = p==='rad' && !cn;
    if(MEAS){ playBtn.hidden = p==='rad' && !cn; $('#ht-reset').hidden = p==='rad' && !cn; }
    explEl.innerHTML=EXPL[p];
    svg.setAttribute('tabindex', p==='rad' && !cn ? '0' : '-1');
    svg.setAttribute('aria-label', p==='cond' ? 'A tank of hot water with rods of copper, aluminium, iron and glass sticking out of its side. A drawing pin is stuck with wax to each rod, 11 cm from the water.'
      : p==='conv' ? 'A beaker of water on a tripod with a potassium permanganate crystal at the bottom on the left, heated from below or at the top. Purple dye shows how the water moves.'
      : cn ? 'A radiant heater between two cans of water, one matt black and one shiny, each with a thermometer. '+(MEAS?'A stopwatch and a close-up of each thermometer are beside them.':'A temperature against time graph is beside them.')
      : 'A Leslie cube of hot water with a thermometer through its lid, and an infrared detector on a bench joined to a millivoltmeter. A small picture shows the cube from above. Use the arrow keys to move the detector.');
  }
  function resetPart(){
    stop();
    var p=part();
    if(p==='cond'){ condInit(); jumpSeg.pick(null); }
    else if(p==='conv') convInit();
    else { radInit(); if(cans()){ R.next=0; if(MEAS) takeCan(); } }
    setRows(); draw();
  }
  function setMode(){ resetPart(); }

  playBtn.addEventListener('click', function(){
    var p=part(), ex=exp();
    if(p==='rad' && !cans()){
      if(ex){ if(Math.abs(R.ang-R.angT)<0.5) takeLeslie(); return; }
      if(running){ stop(); draw(); return; }
      R.t=0; faceSeg.pick('0'); turnTo(0); running=true; loop(); draw(); return;
    }
    if(p==='rad' && cans() && ex){
      if(running) return;
      if(!R.can.length){ R.next=0; takeCan(); draw(); return; }
      R.justAdded=null; R.next=Math.min(10,R.can[R.can.length-1].t+(+intSeg.value())); running=true; loop(); draw(); return;
    }
    if(running){ stop(); draw(); return; }
    if(p==='cond'){ if(C.t>=CEND-1e-9) condInit(); jumpSeg.pick(null); }
    if(p==='conv' && V.t>=CVEND-1e-9) convInit();
    if(p==='rad' && R.t>=10) radInit();
    running=true; loop(); draw();
  });
  actBtn.addEventListener('click', markFront);
  cmpBtn.addEventListener('click', function(){ V.cmp=true; draw(); });
  slowBtn.addEventListener('click', function(){ slowBtn.setAttribute('aria-pressed', String(!slowOn())); draw(); });
  expBtn.addEventListener('click', function(){ expBtn.setAttribute('aria-pressed', String(!exp())); resetPart(); });
  $('#ht-reset').addEventListener('click', function(){ resetPart(); });
  $('#ht-clear').addEventListener('click', function(){ resetPart(); });
  window.addEventListener('pagehide', stop);
  var wasNarrow=narrow(); window.addEventListener('resize', function(){ if(narrow()!==wasNarrow){ wasNarrow=narrow(); draw(); } });

  condInit(); convInit(); radInit(); R.next=0;
  setMode();
})();
</script><script id="choice-kit-js">
/* Choice kit (12 Nov 2026): the same block on every animation page. See tools/ANIMATION-STYLE.md, "Choices".
   A group of choices with one chosen gets a track round it (class pick); a .to-q button opens the questions from Explore. */
(function(){
  function on(b){ return b.getAttribute('aria-pressed')==='true' || b.classList.contains('is-on'); }
  function each(sel, fn){ Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }
  function mark(s){
    if(!s.classList.contains('pick')){
      var n=0; Array.prototype.forEach.call(s.children, function(b){ if(b.tagName==='BUTTON' && on(b)) n++; });
      if(n===1) s.classList.add('pick');
    }
    if(s.classList.contains('pick') && !s.hasAttribute('data-fit')){
      var d=getComputedStyle(s).display;
      if(d!=='none'){ s.setAttribute('data-fit','1'); if(d.indexOf('flex')>=0) s.classList.add('fit'); }
    }
  }
  each('.seg:not(.tabs):not(.mode):not(.apps)', function(s){
    mark(s);
    if(window.MutationObserver) new MutationObserver(function(){ mark(s); }).observe(s, {childList:true, subtree:true, attributes:true, attributeFilter:['aria-pressed','class']});
  });
  // Choice rows: wrap each .rowlab and the control after it in a .cgroup (label above, groups side by side).
  // A group is hidden when everything in it is hidden, so pages that hide a row's label and control still work.
  function shown(e){ return !e.hidden && e.style.display!=='none'; }
  each('.cgrid:not(.kit)', function(g){
    var kids=Array.prototype.slice.call(g.children), groups=[];
    for(var i=0;i<kids.length;i++){
      var w=document.createElement('div'); w.className='cgroup';
      g.insertBefore(w, kids[i]); w.appendChild(kids[i]);
      if(kids[i].classList.contains('rowlab') && kids[i+1]){ w.appendChild(kids[i+1]); i++; }
      groups.push(w);
    }
    g.classList.add('kit'); if(groups.length===1) g.classList.add('one');
    groups.forEach(function(w){
      function sync(){ var any=false; Array.prototype.forEach.call(w.children, function(c){ if(shown(c)) any=true; }); w.hidden=!any; }
      sync();
      if(window.MutationObserver) Array.prototype.forEach.call(w.children, function(c){ new MutationObserver(sync).observe(c, {attributes:true, attributeFilter:['hidden','style']}); });
    });
  });
  each('.to-q[data-mode]', function(b){
    var seg=document.getElementById(b.getAttribute('data-mode')); if(!seg) return;
    var bs=seg.querySelectorAll('button');
    function sync(){ b.hidden=!on(bs[0]) || !seg.getClientRects().length; }   // hidden too when the page hides its mode switch (e.g. at a level with no questions)
    b.addEventListener('click', function(){ bs[1].click(); bs[1].focus(); });
    if(window.MutationObserver) new MutationObserver(sync).observe(seg, {subtree:true, attributes:true, attributeFilter:['aria-pressed']});
    document.addEventListener('click', function(){ setTimeout(sync, 0); });
    sync(); setTimeout(sync, 0);
  });
})();
</script>
