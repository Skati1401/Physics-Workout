<style>
  :root{
    --bg:#eef1f5; --bg-grid:rgba(29,41,61,0.055);
    --panel:#ffffff; --panel-border:#d7dce4;
    --ink:#182233; --ink-soft:#4c5668; --ink-faint:#8993a5;
    --accent:#d9720c; --accent-soft:#fdead2;
    --good:#15803d; --good-soft:#dcf5e3;
    --bad:#c0311a; --bad-soft:#fbe1db;
    --shadow:0 10px 26px -14px rgba(24,34,51,0.28);
    --topic:#4d7c0f;   --topic-soft:#e6f3d3;
    --alpha:#d23b3b;   --beta:#2f62d6;   --gamma:#8a3fd1;
    --lead:#5b6270;    --alu:#c4cad3;
    --font-display:'Big Shoulders',system-ui,sans-serif;
    --font-body:'IBM Plex Sans',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    /* solid kit colours */ --glass:#9fb4c8; --glass-in:#f4f8fb; --thermo:#f3f6fa; --thread:#d7261e; --steel:#66748c; --steel-hi:#c3ccda; --steel-sh:#3f4a5e; --wood-f:#c99e6a; --wood-t:#e3c08f; --wood-s:#9c7444; --case:#3f4a5e; --tray:#dfe4ec; --tray-in:#f6f8fb; --lcd:#d5dec8; --lcd-ink:#1d2a1f; --cable:#3a4352;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12161f; --bg-grid:rgba(255,255,255,0.045);
      --panel:#1b212e; --panel-border:#2c3444;
      --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;
      --accent:#ff9a3d; --accent-soft:#3a2712;
      --good:#4ade80; --good-soft:#123321;
      --bad:#f27159; --bad-soft:#3a1712;
      --shadow:0 14px 30px -14px rgba(0,0,0,0.55);
      --topic:#a3d65c; --topic-soft:#1f2e12;
      --alpha:#ff7a7a; --beta:#7da3ff; --gamma:#c39bff;
      --lead:#a7aebb; --alu:#7d8592;
      /* solid kit colours */ --glass:#7f97ad; --glass-in:#202938; --thermo:#dfe6ee; --thread:#e5392f; --steel:#8f9db3; --steel-hi:#dfe5ee; --steel-sh:#566179; --wood-f:#8a6a43; --wood-t:#a8855a; --wood-s:#644b2d; --case:#56617a; --tray:#3a4558; --tray-in:#161c27; --lcd:#c6d0b8; --lcd-ink:#172018; --cable:#8e99ab;
    color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12161f; --bg-grid:rgba(255,255,255,0.045);
    --panel:#1b212e; --panel-border:#2c3444;
    --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;
    --accent:#ff9a3d; --accent-soft:#3a2712;
    --good:#4ade80; --good-soft:#123321;
    --bad:#f27159; --bad-soft:#3a1712;
    --shadow:0 14px 30px -14px rgba(0,0,0,0.55);
    --topic:#a3d65c; --topic-soft:#1f2e12;
    --alpha:#ff7a7a; --beta:#7da3ff; --gamma:#c39bff;
    --lead:#a7aebb; --alu:#7d8592;
    /* solid kit colours */ --glass:#7f97ad; --glass-in:#202938; --thermo:#dfe6ee; --thread:#e5392f; --steel:#8f9db3; --steel-hi:#dfe5ee; --steel-sh:#566179; --wood-f:#8a6a43; --wood-t:#a8855a; --wood-s:#644b2d; --case:#56617a; --tray:#3a4558; --tray-in:#161c27; --lcd:#c6d0b8; --lcd-ink:#172018; --cable:#8e99ab;

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      linear-gradient(var(--bg-grid) 1px,transparent 1px) 0 0/100% 34px,
      linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px) 0 0/34px 100%,
      var(--bg);
    color:var(--ink); font-family:var(--font-body); font-size:14px; -webkit-font-smoothing:antialiased;
  }
  [hidden]{display:none!important;}
  button{font:inherit;color:inherit;}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;}

  .page{max-width:1400px;margin-inline:auto;padding-inline:20px;padding-block:12px 40px;}
  h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:0.2px;text-wrap:balance;margin:0;}
  p{margin:0;line-height:1.55;}

  .home-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-bottom:4px;font:600 13px var(--font-mono);color:var(--ink-soft);text-decoration:none;}
  .home-link:hover{color:var(--accent);}
  .page-head{margin-bottom:12px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px;}
  .eyebrow{font-family:var(--font-mono);font-size:11.5px;color:var(--accent);font-weight:600;margin-bottom:6px;}
  .page-head h1{font-size:clamp(28px,5vw,38px);color:var(--ink);}

  .card{background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;box-shadow:var(--shadow);}
  .btn{
    font-family:var(--font-body);font-weight:600;font-size:13.5px;color:var(--ink);
    background:var(--panel);border:1px solid var(--panel-border);border-radius:9px;
    padding:9px 15px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  }
  .btn:hover{border-color:var(--ink-faint);}
  .btn:disabled{opacity:.45;cursor:default;}
  .btn-primary{background:var(--ink);border-color:var(--ink);color:var(--bg);}
  .btn-primary:hover{opacity:.88;border-color:var(--ink);}
  .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);}
  .btn-group{display:flex;flex-wrap:wrap;gap:10px;}

  /* picture on the left with its buttons under it; choices, readings and working on the right */
  .stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,410px);gap:18px 24px;align-items:start;padding:18px;}
  @media (max-width:860px){ .stage{grid-template-columns:minmax(0,1fr);} }
  .view{display:block;width:100%;height:auto;max-height:max(260px,calc(100vh - 300px));}
  .view text{font-family:var(--font-mono);}
  .under{display:flex;flex-direction:column;gap:12px;margin-top:12px;}
  .sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px 24px;}
  .side{display:flex;flex-direction:column;gap:12px;min-width:0;}
  .lab{display:block;font:12.5px var(--font-mono);color:var(--ink-soft);margin-bottom:6px;}
  .lab output{color:var(--ink);font-weight:600;white-space:nowrap;margin-left:6px;}
  input[type=range]{width:100%;accent-color:var(--topic);min-height:28px;}
  .seg{display:flex;flex-wrap:wrap;gap:6px;}
  .seg button{font:12.5px var(--font-mono);padding:8px 11px;min-height:44px;border:1px solid var(--panel-border);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer;}
  .seg button[aria-pressed="true"]{background:var(--topic);border-color:var(--topic);color:var(--panel);}
  .seg button:disabled{opacity:.45;cursor:default;}
  .seg.tabs{gap:0;flex-wrap:nowrap;}
  .seg.tabs button{white-space:nowrap;border-radius:0;margin-left:-1px;}
  .seg.tabs button:first-child{border-radius:8px 0 0 8px;margin-left:0;}
  .seg.tabs button:last-child{border-radius:0 8px 8px 0;}
  .cgrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center;}
  .rowlab{font:11.5px var(--font-mono);color:var(--ink-faint);}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px;}
  .stat{border:1px solid var(--panel-border);border-radius:8px;padding:5px 8px;display:flex;flex-direction:column;justify-content:space-between;}
  .stat small{display:block;font:10.5px var(--font-mono);color:var(--ink-faint);}
  .stat strong{font:600 15px var(--font-mono);color:var(--ink);white-space:nowrap;}
  .stat.hi strong{color:var(--topic);}
  .note{font-size:15px;line-height:1.5;color:var(--ink);padding:10px 12px;border-radius:8px;background:var(--bg);min-height:4.6em;}
  .note b{color:var(--topic);}
  .ta{color:var(--alpha);font-weight:600;} .tb{color:var(--beta);font-weight:600;} .tg{color:var(--gamma);font-weight:600;}

  details.working summary{cursor:pointer;font:600 13px var(--font-mono);color:var(--topic);min-height:44px;display:flex;align-items:center;}
  .eq{font-family:var(--font-mono);font-size:14px;line-height:1.75;padding:8px 12px;border-left:3px solid var(--topic);background:var(--topic-soft);border-radius:6px;color:var(--ink);}
  .eq b{color:var(--topic);}
  .eq + .eq{margin-top:8px;}
  .eqnote{font-size:13.5px;color:var(--ink-soft);margin-top:8px;}
  .eqg{display:grid;grid-template-columns:auto auto minmax(0,1fr);column-gap:.45em;row-gap:.2em;align-items:center}
  .eqg-l{justify-self:end;text-align:right}
  .eqg-m{justify-self:center}
  .eqg-r{justify-self:start;min-width:0}
  .eqg-full{grid-column:1/-1}
  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1.25;}
  .frac>span{padding:0 .25em;white-space:nowrap;}
  .frac>span:first-child{border-bottom:1.5px solid currentColor;}
  @media (max-width:560px){ .stage{padding:12px;} .view{max-height:none;} .eq{font-size:12px;padding:6px 8px;} .note{font-size:14px;} }

  /* ===== Experiment kit (tools/experiment-kit/kit.css) ===== */
  .exp-btns{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;}
  .rtable{width:100%;border-collapse:collapse;font:12.5px var(--font-mono);}
  .rtable th{position:sticky;top:0;background:var(--panel);font-weight:600;font-size:11px;color:var(--ink-faint);text-align:right;padding:4px 6px;border-bottom:1px solid var(--panel-border);}
  .rtable td{text-align:right;padding:3px 6px;border-bottom:1px solid var(--panel-border);color:var(--ink);}
  .rtable tr.new td{background:var(--cs, var(--accent-soft));}
  .rtable-wrap{max-height:150px;overflow:auto;border:1px solid var(--panel-border);border-radius:8px;}
  @media (prefers-reduced-motion: no-preference){ .rtable tr.new td{animation:rowin .35s ease-out;} }
  @keyframes rowin{from{opacity:0}to{opacity:1}}
  /* ===== end of Experiment kit ===== */

  /* inside a workout tab (?embed): no page heading, no outer margins */
  .embed body{background:transparent;}
  .embed .page{padding:0;max-width:none;display:flow-root;}
  .embed .home-link,.embed .page-head{display:none;}
  .embed .view{max-height:460px;}
  .toprow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;}
  @media (prefers-reduced-motion: no-preference){ .nu{transition:opacity .35s ease-out;}
    .rg.pop{transform-box:fill-box;transform-origin:center;animation:rgpop .5s ease-out;}
    @keyframes rgpop{0%{transform:scale(2.4);stroke:var(--accent);stroke-width:2.5px;opacity:1}100%{transform:scale(1);opacity:1}} }
  .view.tall{max-height:none;}
  .btn[aria-disabled="true"]{opacity:.45;cursor:default;}
  .meas-off{display:none!important;}   /* measure mode (?show=measure): parts of the page it does not use */
  /* decay on the N–Z chart: colours for the two radiations the shared tokens lack, and the nucleus */
  :root{ --pos:#0e8a8a; --neu:#6b7280; --nuc:#b45309; --nuc-hi:#f6c48f; --nuc-ink:#fff; --band:#d9efc0; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --pos:#4fd1c5; --neu:#a3abb8; --nuc:#f59e0b; --nuc-hi:#fde4b4; --nuc-ink:#1d2433; --band:#24391a; } }
  :root[data-theme="dark"]{ --pos:#4fd1c5; --neu:#a3abb8; --nuc:#f59e0b; --nuc-hi:#fde4b4; --nuc-ink:#1d2433; --band:#24391a; }
  .tp{color:var(--pos);font-weight:600;} .tn{color:var(--neu);font-weight:600;}
  .dbtns{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .dbtns .rowlab{margin-right:2px;}
  .btn .dot{width:12px;height:12px;border-radius:50%;flex:none;}
  .btn.dec{font-size:15px;min-width:64px;justify-content:center;}
  .nuc{display:inline-flex;flex-direction:column;align-items:flex-end;vertical-align:middle;font-size:.72em;line-height:1.05;margin-right:1px;}
  .eqline{font-family:var(--font-mono);font-size:16px;line-height:2;}
  .view.pickable{cursor:crosshair;}
  .view .pick{cursor:pointer;}
  .view .pick:focus{outline:none;}
  .view .pick:focus-visible .pk-ring{stroke:var(--accent);stroke-width:3;}
  .score{font:600 13px var(--font-mono);color:var(--ink-soft);}
</style>

<script>
  // Visit counter (GoatCounter: no cookies, no personal data). Skipped when a page is embedded in a workout, so a visit counts once.
  // pwCountTab(tab, label): counts each workout tab once per visit as a GoatCounter event (path "page#tab"), skipped in frames the same way.
  (function(){
    var off = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var seen = {}, queue = [];
    function send(e){ try { window.goatcounter.count(e); } catch (x) {} }
    window.pwCountTab = function(tab, label){
      if (off || !tab || seen[tab]) return;
      seen[tab] = 1;
      var page = (location.pathname.split('/').pop() || 'index').replace(/\.html$/, '');
      var e = { path: page + '#' + tab, title: (label || tab) + ' · ' + document.title, event: true };
      if (window.goatcounter && window.goatcounter.count) send(e); else queue.push(e);
    };
    if (off) return;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://gc.zgo.at/count.js';
    s.setAttribute('data-goatcounter', 'https://physics-workout.goatcounter.com/count');
    s.onload = function(){ var q = queue; queue = []; q.forEach(send); };
    document.head.appendChild(s);
  })();
</script>

<script>
  // Draft tags and Alex's reviewer button (tools/review/drafts.py writes this block; edit tools/review/snippet.html, then run drafts.py sync).
  // A page is Draft while its row in tools/REVIEW.md is not ✅: <meta name="pw-draft"> on the page, data-draft on its list cards.
  // ?reviewer (once, on any page) turns on reviewer mode in this browser; ?reviewer=off turns it off.
  (function(){
    var on = false, embed = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var m = /[?&]reviewer(?:=([^&]*))?/.exec(location.search);
    on = !!m && m[1] !== 'off';
    try {
      if (m) { if (m[1] === 'off') localStorage.removeItem('pw-reviewer'); else localStorage.setItem('pw-reviewer', '1'); }
      else on = localStorage.getItem('pw-reviewer') === '1';
    } catch (e) {}
    var CSS = '.pw-draft{display:inline-block;vertical-align:middle;margin-left:10px;font:600 11.5px/1.4 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:0;color:var(--bad,#b42318);border:1px dashed currentColor;border-radius:5px;padding:1px 7px;white-space:nowrap}'
      + '.act-top .pw-draft{margin-left:auto;flex:none}.act-top .pw-draft~.cp-tag,.act-top .pw-draft~.ta-tag{margin-left:0}'
      + 'a[data-draft]{position:relative}.pw-draft.pw-corner{position:absolute;top:10px;right:10px;margin:0;background:var(--panel,#fff)}'
      + '.pw-check{display:inline-block;vertical-align:middle;margin-left:8px;font:600 13px/1.4 "IBM Plex Sans",system-ui,sans-serif;color:#fff;background:#1a7f37;border-radius:6px;padding:4px 10px;text-decoration:none;white-space:nowrap}'
      + '.pw-check:hover{background:#116329}.pw-check:focus-visible{outline:2px solid #1a7f37;outline-offset:2px}'
      + '.pw-reviewer{position:fixed;left:10px;bottom:10px;z-index:9999;font:500 12px/1.4 "IBM Plex Mono",ui-monospace,monospace;background:#1d2433;color:#fff;border-radius:6px;padding:4px 9px;opacity:.85}'
      + '.pw-reviewer a{color:#ffc83d}';
    function tag(){ var t = document.createElement('span'); t.className = 'pw-draft'; t.title = 'Not yet checked'; t.textContent = 'Draft'; return t; }
    function go(){
      var st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st);
      var meta = document.querySelector('meta[name="pw-draft"]'), h1 = document.querySelector('h1');
      if (meta && h1 && !embed) {
        h1.appendChild(tag());
        if (on) {
          var page = meta.getAttribute('content'), b = document.createElement('a');
          b.className = 'pw-check'; b.target = '_blank'; b.rel = 'noopener'; b.textContent = '✓ Checked';
          b.title = 'Opens a GitHub issue. Submit it and the Draft tag goes in a minute or two.';
          b.href = 'https://github.com/Skati1401/Physics-Workout/issues/new?title=' + encodeURIComponent('Checked: ' + page)
            + '&body=' + encodeURIComponent('Submit this issue to mark `' + page + '` as checked. The Draft tag goes in a minute or two, and the issue closes itself.');
          h1.appendChild(b);
        }
      }
      document.querySelectorAll('a[data-draft]').forEach(function(a){
        if (a.querySelector('.pw-draft')) return;
        var t = tag(), top = a.querySelector('.act-top');
        if (top) top.insertBefore(t, top.querySelector('.cp-tag,.ta-tag'));
        else { t.className += ' pw-corner'; a.appendChild(t); }
      });
      // No tag on a unit or theme heading (Alex, 12 Nov 2026): only the pages and their cards.
      if (on && !embed) {
        // Carry ?reviewer in every link to another page of the site, so reviewer mode survives
        // browsers that clear site storage (school Chromebooks) and pages cached from before.
        var carry = function(a){
          try {
            var u = new URL(a.href, location.href);
            if (u.origin !== location.origin || !/(\.html|\/)$/.test(u.pathname) || u.searchParams.has('reviewer')) return;
            u.searchParams.set('reviewer', ''); a.href = u.href.replace('reviewer=', 'reviewer');
          } catch (e) {}
        };
        document.querySelectorAll('a[href]').forEach(carry);
        ['click', 'auxclick', 'contextmenu'].forEach(function(ev){
          document.addEventListener(ev, function(e){ var a = e.target.closest && e.target.closest('a[href]'); if (a) carry(a); }, true);
        });
        var r = document.createElement('div'); r.className = 'pw-reviewer';
        r.innerHTML = 'Reviewer mode · <a href="' + location.pathname + '?reviewer=off">turn off</a>';
        document.body.appendChild(r);
      }
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
  })();
</script>

<script>
// Which list this page was opened from: ?level=igcse, ial or ib sets the back link (and, on two-level pages, the starting level).
var PW_LEVEL=(location.search.match(/[?&]level=(igcse|ial|ib)\b/)||[])[1]||(/[?&]from=alevel\b/.test(location.search)?'ial':'');
(function(){
  var hl=document.querySelector('.home-link'); if(!hl) return;

  if(!lv && /ial\.html/.test(hl.getAttribute('href'))){ try{ if(localStorage.getItem('pw-symbols')==='ib') lv='ib'; }catch(e){} }

  if(L){ hl.href=L[0]; hl.innerHTML='&larr; '+L[1]; }
})();
(function(){
  /* Decay on the N–Z chart (17 Nov 2026). A nucleus sits on a chart of neutron number N (up) against proton number Z
     (across). Each emission moves it: alpha 2 down and 2 left (Z − 2, N − 2), beta-minus 1 down and 1 right (Z + 1, N − 1),
     beta-plus 1 up and 1 left (Z − 1, N + 1; IAL and IB only), neutron 1 straight down (N − 1; IGCSE 7.7 only), gamma no move.
     The balanced equation builds beside it. Any move can be tried on any nucleus in Explore; "Next real decay" and the
     Questions use only real decays (REAL below). The band of stability is drawn from the semi-empirical line
     Z = A / (1.98 + 0.0155 A^(2/3)), widening with Z: a guide to where stable nuclei lie, not a table of them.
     Specs: IGCSE 7.7, 7.8; IAL 139; IB E.3 (SL decay equations with ν and ν̄; HL N/Z ratio and stability). */
  var EMBED = /[?&]embed\b/.test(location.search);
  if(EMBED){
    document.documentElement.classList.add('embed');
    var page = document.getElementById('page');
    var sendHeight = function(){ try{ parent.postMessage({animHeight: Math.ceil(page.getBoundingClientRect().height)}, '*'); }catch(e){} };
    if(window.ResizeObserver) new ResizeObserver(sendHeight).observe(page);
    window.addEventListener('load', sendHeight);
  }
  function $(s){ return document.querySelector(s); }
  function f1(n){ return (+n).toFixed(1); }
  function ln(x1,y1,x2,y2,col,w,extra){ return '<line x1="'+f1(x1)+'" y1="'+f1(y1)+'" x2="'+f1(x2)+'" y2="'+f1(y2)+'" stroke="'+col+'" stroke-width="'+(w||1)+'"'+(extra||'')+'/>'; }
  function rect(x,y,w,h,fill,extra){ return '<rect x="'+f1(x)+'" y="'+f1(y)+'" width="'+f1(Math.max(0,w))+'" height="'+f1(Math.max(0,h))+'" fill="'+fill+'"'+(extra||'')+'/>'; }
  function txt(x,y,s,o){ o=o||{}; return '<text x="'+f1(x)+'" y="'+f1(y)+'"'+(o.a?' text-anchor="'+o.a+'"':'')+' font-size="'+(o.fs||12)+'" fill="'+(o.c||'var(--ink-soft)')+'"'+(o.w?' font-weight="'+o.w+'"':'')+(o.halo?' paint-order="stroke" stroke="var(--panel)" stroke-width="4" stroke-linejoin="round"':'')+(o.op!=null?' opacity="'+o.op+'"':'')+(o.x||'')+'>'+s+'</text>'; }
  function circ(x,y,r,fill,extra){ return '<circle cx="'+f1(x)+'" cy="'+f1(y)+'" r="'+f1(r)+'" fill="'+fill+'"'+(extra||'')+'/>'; }
  function arrow(x1,y1,x2,y2,col,w,extra){ var a=Math.atan2(y2-y1,x2-x1), s=w*2.2, bx=x2-Math.cos(a)*s*1.5, by=y2-Math.sin(a)*s*1.5;
    return '<g'+(extra||'')+'>'+ln(x1,y1,bx,by,col,w)+'<path d="M'+f1(x2)+','+f1(y2)+' L'+f1(bx-Math.sin(a)*s)+','+f1(by+Math.cos(a)*s)+' L'+f1(bx+Math.sin(a)*s)+','+f1(by-Math.cos(a)*s)+' z" fill="'+col+'"/></g>'; }
  var SUP = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
  function sup(n){ return String(n).replace(/\d/g,function(c){ return SUP[c]; }); }
  function FR(t){ return String(t).replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g,'<span class="frac"><span>$1</span><span>$2</span></span>'); }
  function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
  function ease(s){ s=clamp(s,0,1); return s<.5?2*s*s:1-Math.pow(-2*s+2,2)/2; }

  var SYM = ' H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe Cs Ba La Ce Pr Nd Pm Sm Eu Gd Tb Dy Ho Er Tm Yb Lu Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra Ac Th Pa U Np Pu Am Cm Bk Cf Es Fm'.split(' ');
  var NAME = ',hydrogen,helium,lithium,beryllium,boron,carbon,nitrogen,oxygen,fluorine,neon,sodium,magnesium,aluminium,silicon,phosphorus,sulfur,chlorine,argon,potassium,calcium,scandium,titanium,vanadium,chromium,manganese,iron,cobalt,nickel,copper,zinc,gallium,germanium,arsenic,selenium,bromine,krypton,rubidium,strontium,yttrium,zirconium,niobium,molybdenum,technetium,ruthenium,rhodium,palladium,silver,cadmium,indium,tin,antimony,tellurium,iodine,xenon,caesium,barium,lanthanum,cerium,praseodymium,neodymium,promethium,samarium,europium,gadolinium,terbium,dysprosium,holmium,erbium,thulium,ytterbium,lutetium,hafnium,tantalum,tungsten,rhenium,osmium,iridium,platinum,gold,mercury,thallium,lead,bismuth,polonium,astatine,radon,francium,radium,actinium,thorium,protactinium,uranium,neptunium,plutonium,americium,curium,berkelium,californium,einsteinium,fermium'.split(',');
  var ZMAX = 100, NMAX = 160;
  function sym(Z){ return SYM[Z]||'?'; }
  function nm(Z,N,ex){ return (NAME[Z]||'element '+Z)+'-'+(Z+N)+(ex?((Z===43||Z===56)?'m':' (excited)'):''); }
  function lab(Z,N,ex){ return sup(Z+N)+sym(Z)+(ex?'*':''); }

  // The band of stability: N on the stable line for each Z, and the band's half-width.
  var NST = [], WB = [];
  for(var z=0; z<=ZMAX; z++){ var A=2*z+1; for(var i=0;i<30;i++) A = z*(1.98+0.0155*Math.pow(A,2/3)); NST[z]=z===0?0:A-z; WB[z]=0.8+0.035*z; }
  function inBand(Z,N){ return Z>=1 && Math.abs(N-NST[Z])<=WB[Z]; }

  // The radiations. dz, dn: the move on the chart; A, Z: the particle's numbers in the equation.
  var D = {
    a: {dz:-2,dn:-2,A:4,Z:2,s:'α',col:'var(--alpha)',cls:'ta',name:'an alpha particle',short:'alpha'},
    bm:{dz:1,dn:-1,A:0,Z:-1,s:'β⁻',col:'var(--beta)',cls:'tb',name:'a beta-minus particle',short:'beta-minus'},
    bp:{dz:-1,dn:1,A:0,Z:1,s:'β⁺',col:'var(--pos)',cls:'tp',name:'a beta-plus particle (a positron)',short:'beta-plus'},
    g: {dz:0,dn:0,A:0,Z:0,s:'γ',col:'var(--gamma)',cls:'tg',name:'a gamma ray',short:'gamma'},
    n: {dz:0,dn:-1,A:1,Z:0,s:'n',col:'var(--neu)',cls:'tn',name:'a neutron',short:'neutron'}
  };
  function kinds(){ return level==='igcse' ? ['a','bm','g','n'] : ['a','bm','bp','g']; }

  // How each nucleus here really decays ('s' = stable). "Z-N" (+ "*" for the excited state). bm* leaves the daughter excited.
  var REAL = {
    '92-146':'a','90-144':'bm','91-143':'bm','92-142':'a','90-140':'a','88-138':'a','86-136':'a','84-134':'a','82-132':'bm','83-131':'bm',
    '84-130':'a','82-128':'bm','83-127':'bm','84-126':'a','82-124':'s',
    '6-8':'bm','7-7':'s','27-33':'bm*','28-32*':'g','28-32':'s','38-52':'bm','39-51':'bm','40-50':'s','53-78':'bm','54-77':'s',
    '95-146':'a','93-144':'a','55-82':'bm*','56-81*':'g','56-81':'s','43-56*':'g','43-56':'bm','44-55':'s',
    '9-9':'bp','8-10':'s','6-5':'bp','5-6':'s','11-11':'bp','10-12':'s','7-6':'bp','6-7':'s','8-7':'bp','7-8':'s',
    '90-142':'a','88-140':'bm','89-139':'bm','90-138':'a','88-136':'a','86-134':'a',
    '3-7':'n','3-6':'bm','4-5':'s','2-3':'n','2-2':'s','4-9':'n','4-8':'bm','6-6':'s','8-8':'s','26-30':'s'
  };
  // Decay chains for "how many α and β⁻?" (IGCSE 4PH1 May 2022 1P Q5(b)(ii), May 2019 1P Q3(c)(ii); IAL 9PH0/02 Oct 2020 Q16(a)(i),
  // June 2019 Q4, June 2024 Q3; IB P1 18 May TZ2 Q25, 25 May TZ1 Q37) and sequences for "where does it end?" (IB P1A 25 May TZ3 Q35,
  // P1 15 Nov Q27, P1 22 May TZ1 Q27, P1 04 May TZ1 Q32, P2 21 May TZ2 Q4(c); IGCSE 4420/2H June 2008 Q13(c)(ii)).
  var CHAINS = [ [[90,142],[86,134]], [[92,146],[82,124]], [[88,138],[82,124]], [[82,128],[82,124]], [[92,142],[86,136]], [[92,146],[92,142]] ];
  var SEQS = [ [[90,142],['a','bm']], [[92,146],['a','bm','bm']], [[83,127],['bm','a']], [[92,146],['a','bm']], [[88,138],['a','a']],
    [[3,7],['n','bm']], [[90,144],['bm','bm','a']], [[15,15],['bp','a']], [[11,11],['bp','bp']], [[84,126],['a','bm']] ];
  function realChain(p,t){ var st={Z:p.Z,N:p.N,ex:false}, out=[];
    for(var i=0;i<20 && !(st.Z===t.Z&&st.N===t.N);i++){ var r=real(st); if(!r||r==='s') return null; var k=r.replace('*',''); out.push(k); st=after(st,k); }
    return out; }
  function isLand(q){ return q && (q.kind==='land'||q.kind==='multi'); }
  function isGrid(q){ return q && (isLand(q)||q.kind==='path'); }
  function real(st){ return REAL[st.Z+'-'+st.N+(st.ex?'*':'')]||null; }
  var PRESETS = [
    {id:'u',Z:92,N:146,t:'U-238',title:'uranium-238'},
    {id:'ra',Z:88,N:138,t:'Ra-226',title:'radium-226'},
    {id:'c',Z:6,N:8,t:'C-14',title:'carbon-14'},
    {id:'co',Z:27,N:33,t:'Co-60',title:'cobalt-60'},
    {id:'li',Z:3,N:7,t:'Li-10',title:'lithium-10 (gives out a neutron)',lv:'igcse'},
    {id:'f',Z:9,N:9,t:'F-18',title:'fluorine-18 (gives out a positron)',lv:'ks5'}
  ];

  var level = PW_LEVEL||'igcse', mode = /[?&]show=predict\b/.test(location.search) ? 'q' : 'explore';
  var start = PRESETS[0], cur, hist, last = null, slow = false, anim = null, eqT = Infinity;
  var view = {z:0,n:0}, viewFrom = null, viewTo = null;
  var Q = null, score = {r:0,t:0}, qOrder = [], wide = true;
  // Question sets (18 Nov 2026, Alex): Simple (one decay: land, which) or Chains (plot the path, where does it end, how many).
  // IAL deals chains only (its papers ask only "how many" and "where does it end"), so its switch is hidden and it has no path kind.
  // ?set=simple|chain fixes the set and hides the switch (the 7a workout frames each set in its own tab).
  var SET_LOCK = (location.search.match(/[?&]set=(simple|chain)\b/)||[])[1]||null, userSet = SET_LOCK||'simple', chainOrder = [];
  function qset(){ return SET_LOCK || (level==='ial' ? 'chain' : userSet); }
  function chainKinds(){ return level==='ial' ? ['multi','count'] : ['path','multi','count']; }
  var svg = $('#nd-svg');

  function okSt(Z,N){ return Z>=1 && N>=0 && Z<=ZMAX && N<=NMAX; }
  function after(st,k){ var d=D[k]; return {Z:st.Z+d.dz, N:st.N+d.dn, ex:false}; }

  // ---- layout: one wide picture, or a tall one under 520 px ----
  var K = 11, C = 29;
  function lay(){
    return wide ? {W:860,H:366,gx:60,gy:6,ex:432,ey:50,bx:432,by:100,kx:432,ky:172,ix:650,iy:178,iw:190,ih:150}
                : {W:430,H:744,gx:56,gy:6,ex:24,ey:404,bx:24,by:452,kx:24,ky:526,ix:228,iy:538,iw:186,ih:150};
  }
  function centreOn(st){ return {z:clamp(st.Z-(K-1)/2,0,ZMAX-K+1), n:clamp(st.N-(K-1)/2,0,NMAX-K+1)}; }
  function nearEdge(st,v){ return st.Z<v.z+2 || st.Z>v.z+K-3 || st.N<v.n+2 || st.N>v.n+K-3; }
  function cx(L,Z){ return L.gx+(Z-view.z+0.5)*C; }
  function cy(L,N){ return L.gy+(K-0.5-(N-view.n))*C; }

  // a nuclide in nuclear notation: A over Z, right-aligned at x, the symbol after it
  function nucSvg(x,y,A,Zs,s,col,op,extra){
    var fsS=24, fsN=13, w = s.length*fsS*0.62;
    return '<g opacity="'+op+'">'+txt(x,y-15,A,{a:'end',fs:fsN,c:'var(--ink)'})+txt(x,y+4,Zs,{a:'end',fs:fsN,c:'var(--ink)'})+
      txt(x+3,y+2,s,{fs:fsS,c:col||'var(--ink)',w:600})+(extra||'')+'</g>';
  }
  function zs(z){ return z<0 ? '−'+(-z) : String(z); }
  function numW(v){ return String(v).length*13*0.62; }

  // the equation for one step: parent → daughter + particle (+ ν or ν̄ at IAL and IB)
  function eqParts(p,k){
    var d=D[k], q=after(p,k), parts=[], ks5=level!=='igcse';
    parts.push({A:p.Z+p.N,Z:p.Z,s:sym(p.Z)+(k==='g'?'*':''),col:'var(--ink)'});
    parts.push({arrow:1});
    parts.push({A:q.Z+q.N,Z:q.Z,s:sym(q.Z),col:'var(--ink)'});
    parts.push({plus:1});
    parts.push({A:d.A,Z:d.Z,s:d.s,col:d.col});
    if(ks5 && (k==='bm'||k==='bp')){ parts.push({plus:1}); parts.push({A:0,Z:0,s:'ν',bar:k==='bm',col:'var(--ink-soft)'}); }
    return parts;
  }
  var REV = [0,150,950,1150,1150,1300,1300];   // when each part of the equation appears (ms after the press)
  function drawEq(L){
    var o='', x=L.ex, y=L.ey;
    if(Q && Q.kind==='count'){
      var p0=Q.p, t0=Q.t, xx=x;
      o+=nucSvg(xx+numW(p0.Z+p0.N),y,p0.Z+p0.N,p0.Z,sym(p0.Z),'var(--ink)',1); xx+=numW(p0.Z+p0.N)+6+sym(p0.Z).length*14.9+10;
      o+=arrow(xx+6,y-4,xx+38,y-4,'var(--ink)',2); xx+=48;
      o+=nucSvg(xx+numW(t0.Z+t0.N),y,t0.Z+t0.N,t0.Z,sym(t0.Z),'var(--ink)',1); xx+=numW(t0.Z+t0.N)+6+sym(t0.Z).length*14.9+10;
      var showA = Q.done && !anim ? Q.na : '?', showB = Q.done && !anim ? Q.nb : '?';
      o+=txt(xx+6,y+2,'+',{fs:22,c:'var(--ink)'}); xx+=26; o+=txt(xx,y+2,String(showA),{fs:20,c:'var(--accent)',w:700}); xx+=String(showA).length*12.4+4;
      o+=nucSvg(xx+8,y,4,2,'α','var(--alpha)',1); xx+=8+6+15+10;
      o+=txt(xx+6,y+2,'+',{fs:22,c:'var(--ink)'}); xx+=26; o+=txt(xx,y+2,String(showB),{fs:20,c:'var(--accent)',w:700}); xx+=String(showB).length*12.4+4;
      o+=nucSvg(xx+16,y,0,'−1','β⁻','var(--beta)',1);
      if(!Q.done || anim){
        [['a','α particles',Q.pick.a],['b','β⁻ particles',Q.pick.b]].forEach(function(r,i){
          var yy=L.by-18+i*34, bx=L.bx;
          o+=txt(bx,yy+18,r[1]+':',{fs:13.5,c:'var(--ink)'});
          ['-','+'].forEach(function(sg,j){ var px=bx+130+j*84, pk=r[0]+sg;
            var g='<rect class="pk-ring" x="'+px+'" y="'+yy+'" width="34" height="27" rx="7" fill="var(--panel)" stroke="var(--panel-border)"/>'+txt(px+17,yy+19,sg==='-'?'−':'+',{a:'middle',fs:17,c:'var(--ink)',w:700});
            o+= (!Q.done && !anim) ? '<g class="pick" data-pick="'+pk+'" tabindex="0" role="button" aria-label="'+(sg==='-'?'fewer ':'more ')+r[1]+'">'+g+'</g>' : g; });
          o+=txt(bx+130+34+25,yy+19,String(r[2]),{a:'middle',fs:16,c:'var(--accent)',w:700});
        });
      } else {
        var dA=(p0.Z+p0.N)-(t0.Z+t0.N);
        o+=txt(L.bx,L.by,'Mass numbers:   '+(p0.Z+p0.N)+' = '+(t0.Z+t0.N)+' + '+Q.na+' × 4 + '+Q.nb+' × 0 ✓',{fs:14,c:'var(--topic)',w:600,x:' xml:space="preserve"'});
        o+=txt(L.bx,L.by+24,'Atomic numbers: '+p0.Z+' = '+t0.Z+' + '+Q.na+' × 2 + '+Q.nb+' × (−1) ✓',{fs:14,c:'var(--topic)',w:600,x:' xml:space="preserve"'});
      }
      return o;
    }
    if(Q && Q.kind==='path' && (!Q.done || !last)){
      var pp=Q.p;
      o+=nucSvg(x+numW(pp.Z+pp.N),y,pp.Z+pp.N,pp.Z,sym(pp.Z),'var(--ink)',1);
      o+=txt(L.bx,L.by,'Gives out: '+Q.seq.map(function(k){ return D[k].s; }).join(', then '),{fs:14,c:'var(--ink)',w:600});
      o+=txt(L.bx,L.by+24,'Squares placed: '+Q.picks.length+' of '+Q.seq.length,{fs:13,c:Q.picks.length===Q.seq.length?'var(--accent)':'var(--ink-soft)'});
      return o;
    }
    if(Q && Q.kind==='multi' && (!Q.done || !last)){
      var pm=Q.p;
      o+=nucSvg(x+numW(pm.Z+pm.N),y,pm.Z+pm.N,pm.Z,sym(pm.Z),'var(--ink)',1);
      o+=arrow(x+numW(pm.Z+pm.N)+50,y-4,x+numW(pm.Z+pm.N)+82,y-4,'var(--ink)',2)+txt(x+numW(pm.Z+pm.N)+92,y+2,'?',{fs:24,c:'var(--accent)',w:700});

    }
    if(!last){

      o+=txt(L.bx,L.by,m1+' ✓',{fs:14,c:'var(--topic)',w:600,op:eqT>=1500?1:0,x:' xml:space="preserve"'});

  // ---- running a decay ----
  function runSeq(ks, done){ if(!ks.length){ if(done) done(); return; } run(ks[0], function(){ runSeq(ks.slice(1), done); }, true); }
  function run(k, onEnd, fast){
    var from={Z:cur.Z,N:cur.N,ex:cur.ex}, to=after(cur,k);
    if(REAL[from.Z+'-'+from.N+(from.ex?'*':'')]==='bm*' && k==='bm') to.ex=true;
    last={from:from,k:k}; hist.push({from:from,to:to,k:k});
    viewFrom={z:view.z,n:view.n}; viewTo=nearEdge(to,view)?centreOn(to):{z:view.z,n:view.n};
    anim={k:k,from:from,to:to,t:0,t0:performance.now(),onEnd:onEnd,fast:!!fast}; eqT=0;
    sync();
    requestAnimationFrame(tick);
  }
  function tick(now){
    if(!anim) return;
    var sp = (slow ? 0.3 : 1)*(anim.fast ? 2.2 : 1);
    anim.t=(now-anim.t0)*sp; eqT=anim.t;
    var s=ease((anim.t-250)/700); view={z:viewFrom.z+(viewTo.z-viewFrom.z)*s, n:viewFrom.n+(viewTo.n-viewFrom.n)*s};
    if(anim.t>=2000){
      cur={Z:anim.to.Z,N:anim.to.N,ex:anim.to.ex}; view=viewTo; var cb=anim.onEnd; anim=null; eqT=Infinity;
      if(cb) cb(); if(anim) return; sync(); draw(); return;
    }
    draw(); requestAnimationFrame(tick);
  }

  function noteFor(h){
    var d=D[h.k], p=h.from, q=h.to, ks5=level!=='igcse', s='';
    var P=lab(p.Z,p.N,p.ex), Qn=lab(q.Z,q.N,false);
    if(h.k==='a') s='<b>Alpha emission.</b> '+P+' gave out <span class="ta">an alpha particle</span>: 2 protons and 2 neutrons. Z falls by 2 and N falls by 2, so the nucleus moves <b>2 squares down and 2 to the left</b>. The mass number falls by 4. It is now '+NAME[q.Z]+', '+Qn+'.';
    if(h.k==='bm') s='<b>Beta-minus emission.</b> In '+P+' a neutron changed into a proton and an electron, and the electron left as <span class="tb">a beta particle</span>'+(ks5?' (with an antineutrino)':'')+'. Z rises by 1 and N falls by 1: <b>1 square down and 1 to the right</b>. The mass number stays the same. It is now '+NAME[q.Z]+', '+Qn+'.';
    if(h.k==='bp') s='<b>Beta-plus emission.</b> In '+P+' a proton changed into a neutron, and <span class="tp">a positron</span> left (with a neutrino). Z falls by 1 and N rises by 1: <b>1 square up and 1 to the left</b>. The mass number stays the same. It is now '+NAME[q.Z]+', '+Qn+'.';
    if(h.k==='g') s='<b>Gamma emission.</b> '+P+' gave out <span class="tg">a gamma ray</span>: energy, not a particle. Z and N do not change, so the nucleus <b>stays on the same square</b>: same element, same mass number. It just has less energy.';
    if(h.k==='n') s='<b>Neutron emission.</b> '+P+' gave out <span class="tn">a neutron</span>. N falls by 1 and Z stays the same: <b>1 square straight down</b>. The mass number falls by 1, but it is still '+NAME[q.Z]+': an isotope with one neutron fewer, '+Qn+'.';
    return s;
  }
  function bandNote(st){
    if(st.Z>82) return 'No nucleus past lead (Z = 82) is truly stable.';
    if(inBand(st.Z,st.N)) return '';
    var rich = st.N>NST[st.Z];
    return 'It is off the band: '+(rich?'too many neutrons for its protons':'too few neutrons for its protons')+(level!=='igcse'?(rich?', so it is likely to decay by β⁻.':', so it is likely to decay by β⁺.'):'.');
  }
  function realNote(st){
    var r=real(st); if(!r) return '';
    var nm2=nm(st.Z,st.N,st.ex);
    if(r==='s') return 'Real '+nm2+' is stable.';
    var k=r.replace('*','');
    if(k==='bp' && level==='igcse') return 'Real '+nm2+' gives out a positron (β⁺), which is not in IGCSE.';
    return 'Real '+nm2+' gives out '+D[k].name+': try Next real decay.';
  }

  // ---- what the right-hand column says ----
  function sync(){
    var ks=kinds(), ks5=level!=='igcse';
    Array.prototype.forEach.call(document.querySelectorAll('#nd-dec .dec'), function(b){
      var k=b.getAttribute('data-d'); b.hidden = ks.indexOf(k)<0;
      var t=after(cur,k); b.disabled = !!anim || !okSt(t.Z,t.N);

    var root=document.documentElement, svg=o.svg, stage=svg.closest('.stage'), left=svg.closest('.stage > *');
    var under=left.querySelector('.under'), side=stage.querySelector('.side'), head=document.querySelector('.page-head');
    var strip=(o.strip||[]).map($).filter(Boolean), pics=(o.pic||[]).map($).filter(Boolean), L='b';
    root.classList.add('teach');
    if(!$('teach-kit-css')){
      var st=document.createElement('style'); st.id='teach-kit-css';
      st.textContent=''
        +'.teach .page{max-width:1900px;padding-block:6px 24px;}'
        +'.teach .home-link{min-height:32px;margin:0;}'
        +'.teach .page-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-start;gap:6px 16px;margin-bottom:8px;}'
        +'.teach .page-head .eyebrow{display:none;}'
        +'.teach .page-head h1{font-size:26px;}'
        +'.tk-q{font:600 13px var(--font-mono,monospace);color:var(--topic,var(--accent));text-decoration:none;min-height:32px;display:inline-flex;align-items:center;}'
        +'.tk-q:hover{text-decoration:underline;}'
        +'.tk-lay{margin-left:auto;display:flex;align-items:center;gap:8px;font:12.5px var(--font-mono,monospace);color:var(--ink-soft);}'
        +'.tk-lay .seg button{min-height:32px;padding:4px 12px;}'
        +'.teach .stage{padding:12px;gap:12px 18px;grid-template-columns:minmax(0,1fr);}'
        +'.teach .view{max-height:none;}'
        +'.teach .side{display:none;}'
        +'.teach .under{display:flex;flex-direction:row;flex-wrap:wrap;margin-top:8px;gap:8px 18px;align-items:flex-end;}'
        +'.teach .under .sliders{flex:1 1 340px;}'
        // small controls: the picture is the display (Alex, 24 Nov 2026: zoomed in on a projector the full-size buttons were huge)
        +'.teach .under .btn{min-height:36px;padding:5px 12px;font-size:14.5px;border-radius:8px;}'
        +'.teach .under .btn-group{gap:6px;}'
        // bigger text that may take two lines ("No / epicycles"), so a group stays narrow (Alex, 24 Nov 2026)
        +'.teach .tk-strip .seg button,.teach .tk-strip .jumprow button{min-height:36px;padding:3px 9px;font-size:14.5px;line-height:1.15;white-space:normal;max-width:calc(10ch + 24px);text-align:center;flex:0 0 auto;}'
        +'.teach .tk-strip .rowlab,.teach .under .lab{font-size:12.5px;margin-bottom:2px;}'
        +'.teach .under input[type=range]{min-height:20px;}'
        +'.tk-strip{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:flex-end;}'
        +'.tk-strip:empty{display:none;}'
        +'.tk-strip>*{margin:0;}'
        +'.tk-pic{position:relative;margin-inline:auto;}'
        +'.tk-on{position:absolute;display:flex;flex-direction:column;gap:4px;padding:3px;border-radius:8px;background:color-mix(in srgb,var(--panel) 80%,transparent);max-width:calc(100% - 12px);}'
        +'.tk-on:empty{display:none;}'
        +'.tk-on.tr{top:6px;right:6px;align-items:flex-end;}.tk-on.tl{top:6px;left:6px;}.tk-on.br{bottom:6px;right:6px;align-items:flex-end;}.tk-on.bl{bottom:6px;left:6px;}'
        +'.tk-on .rowlab{display:none;}'
        +'.tk-on .cgrid.kit,.tk-on .cgrid.kit>.cgroup{gap:0;}'
        +'.tk-on .seg button{min-height:26px;padding:2px 8px;font-size:11.5px;}'
        +'.tk-on .seg{flex-wrap:wrap;justify-content:flex-end;}'
        +'.tk-notes{margin-top:12px;padding:14px;}'
        +'.tk-notes>div{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:10px 18px;align-items:start;}'
        +'.tk-notes .note{min-height:0;}'
        +'.lay-c .stage{grid-template-columns:minmax(0,1fr) 250px;}'
        +'.lay-c .side{display:flex;}'
        +'@media (max-width:860px){ .lay-c .stage{grid-template-columns:minmax(0,1fr);} }';
      document.head.appendChild(st);
    }
    // the title line: back link, title, student version, layout picker
    var home=document.querySelector('.home-link'); if(home && head) head.insertBefore(home, head.firstChild);
    if(o.q && head){ var a=document.createElement('a'); a.className='tk-q'; a.href=o.q.href; a.innerHTML=o.q.label||'Student version with questions &rarr;'; head.appendChild(a); }
    if(o.mode && $(o.mode)) $(o.mode).hidden=true;   // the Choice kit then hides "Try the questions" too
    // Notes: everything left in the side column that is not a choice
    var notes=document.createElement('div'); notes.className='card tk-notes'; notes.hidden=true;
    var inner=document.createElement('div'); notes.appendChild(inner);
    Array.prototype.slice.call(side.children).forEach(function(c){ if(c.id!==o.mode && strip.indexOf(c)<0 && pics.indexOf(c)<0) inner.appendChild(c); });
    stage.parentNode.insertBefore(notes, stage.nextSibling);
    // Notes goes in the main button row: the one with "Try the questions" if there is one (a page may have a hidden Questions row first)
    var tq=under.querySelector('.btn-group .to-q'), bg=tq?tq.parentNode:under.querySelector('.btn-group'), nb=document.createElement('button');
    nb.className='btn'; nb.type='button'; nb.textContent='Notes'; nb.setAttribute('aria-expanded','false');
    var toq=bg.querySelector('.to-q'); bg.insertBefore(nb, toq||null);
    nb.addEventListener('click',function(){ notes.hidden=!notes.hidden; nb.setAttribute('aria-expanded',notes.hidden?'false':'true'); if(!notes.hidden) notes.scrollIntoView({block:'nearest'}); });
    // where the choices go
    var row=document.createElement('div'); row.className='tk-strip'; under.insertBefore(row, under.firstChild);
    var wrap=document.createElement('div'); wrap.className='tk-pic'; svg.parentNode.insertBefore(wrap, svg); wrap.appendChild(svg);
    var on=document.createElement('div'); on.className='tk-on '+(o.pin||'tr'); wrap.appendChild(on);
    function fit(){
      svg.style.maxHeight=''; wrap.style.maxWidth='';
      if(window.innerWidth<=560) return;
      var r=stage.getBoundingClientRect(), sv=svg.getBoundingClientRect(), rest=r.height-sv.height;
      if(L==='c') rest=Math.max(0, left.getBoundingClientRect().height-sv.height)+24;
      var mh=Math.max(260, Math.floor(window.innerHeight-(r.top+window.scrollY)-rest-12));
      svg.style.maxHeight=mh+'px';
      // the box round the picture is only as wide as the picture drawn, so anything laid on a corner stays on it
      var vb=svg.viewBox && svg.viewBox.baseVal;
      if(vb && vb.height) wrap.style.maxWidth=Math.floor(mh*vb.width/vb.height)+'px';
    }
    function layout(x){
      L=x; root.classList.remove('lay-a','lay-b','lay-c'); root.classList.add('lay-'+x);
      var hide=x==='b' && o.pin==='hide';
      if(x==='c'){ strip.concat(pics).forEach(function(e){ side.appendChild(e); }); }
      else{
        strip.forEach(function(e){ row.appendChild(e); });
        pics.forEach(function(e){ (x==='b' && !hide ? on : row).appendChild(e); });
      }
      pics.forEach(function(e){ e.style.display=hide?'none':''; });
      if(lp) Array.prototype.forEach.call(lp.querySelectorAll('button'),function(b){ b.setAttribute('aria-pressed',b.getAttribute('data-l')===x?'true':'false'); });
      if(o.trial){ try{ var u=new URL(location.href); u.searchParams.set('layout',x); history.replaceState(null,'',u.href); }catch(e){} }
      if(o.onLayout) o.onLayout(x);
      fit();
    }
    var lp=null;
    if(o.trial && head){
      lp=document.createElement('div'); lp.className='tk-lay';
      lp.innerHTML='<span id="tk-lay-lab">Layout</span><div class="seg pick fit" role="group" aria-labelledby="tk-lay-lab"><button type="button" data-l="a">A</button><button type="button" data-l="b">B</button><button type="button" data-l="c">C</button></div>';
      head.appendChild(lp);
      lp.addEventListener('click',function(e){ var b=e.target.closest('button'); if(b) layout(b.getAttribute('data-l')); });
    }
    layout((location.search.match(/[?&]layout=([abc])\b/)||[])[1]||o.layout||'b');
    window.addEventListener('resize',fit); window.addEventListener('load',fit); setTimeout(fit,0);
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
    if(window.ResizeObserver) new ResizeObserver(function(){ requestAnimationFrame(fit); }).observe(under);
    return {fit:fit, layout:function(){ return L; }};
  }
  // ---- end of teach kit ----
  if(!/[?&]embed\b/.test(location.search) && window.self===window.top){
    teachPage({svg:svg, mode:'nd-mode', strip:['nd-startrow'],
      q:(!PW_LEVEL||PW_LEVEL==='igcse')?{href:'../radioactivity.html#equations'}:null});
  }
  setLevel(level);
  fit();
})();
</script>
<script id="choice-kit-js">
/* Choice kit (12 Nov 2026): the same block on every animation page. See tools/ANIMATION-STYLE.md, "Choices".
   A group of choices with one chosen gets a track round it (class pick); a .to-q button opens the questions from Explore. */
(function(){
  function on(b){ return b.getAttribute('aria-pressed')==='true' || b.classList.contains('is-on'); }
  function each(sel, fn){ Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }
  function mark(s){
    if(!s.classList.contains('pick')){
      var n=0; Array.prototype.forEach.call(s.children, function(b){ if(b.tagName==='BUTTON' && on(b)) n++; });
      if(n===1) s.classList.add('pick');
    }
    if(s.classList.contains('pick') && !s.hasAttribute('data-fit')){
      var d=getComputedStyle(s).display;
      if(d!=='none'){ s.setAttribute('data-fit','1'); if(d.indexOf('flex')>=0) s.classList.add('fit'); }
    }
  }
  each('.seg:not(.tabs):not(.mode):not(.apps)', function(s){
    mark(s);
    if(window.MutationObserver) new MutationObserver(function(){ mark(s); }).observe(s, {childList:true, subtree:true, attributes:true, attributeFilter:['aria-pressed','class']});
  });
  // Choice rows: wrap each .rowlab and the control after it in a .cgroup (label above, groups side by side).
  // A group is hidden when everything in it is hidden, so pages that hide a row's label and control still work.
  function shown(e){ return !e.hidden && e.style.display!=='none'; }
  each('.cgrid:not(.kit)', function(g){
    var kids=Array.prototype.slice.call(g.children), groups=[];
    for(var i=0;i<kids.length;i++){
      var w=document.createElement('div'); w.className='cgroup';
      g.insertBefore(w, kids[i]); w.appendChild(kids[i]);
      if(kids[i].classList.contains('rowlab') && kids[i+1]){ w.appendChild(kids[i+1]); i++; }
      groups.push(w);
    }
    g.classList.add('kit'); if(groups.length===1) g.classList.add('one');
    groups.forEach(function(w){
      function sync(){ var any=false; Array.prototype.forEach.call(w.children, function(c){ if(shown(c)) any=true; }); w.hidden=!any; }
      sync();
      if(window.MutationObserver) Array.prototype.forEach.call(w.children, function(c){ new MutationObserver(sync).observe(c, {attributes:true, attributeFilter:['hidden','style']}); });
    });
  });
  each('.to-q[data-mode]', function(b){
    var seg=document.getElementById(b.getAttribute('data-mode')); if(!seg) return;
    var bs=seg.querySelectorAll('button');
    function sync(){ b.hidden=!on(bs[0]) || !seg.getClientRects().length; }   // hidden too when the page hides its mode switch (e.g. at a level with no questions)
    b.addEventListener('click', function(){ bs[1].click(); bs[1].focus(); });
    if(window.MutationObserver) new MutationObserver(sync).observe(seg, {subtree:true, attributes:true, attributeFilter:['aria-pressed']});
    document.addEventListener('click', function(){ setTimeout(sync, 0); });
    sync(); setTimeout(sync, 0);
  });
})();
</script>
