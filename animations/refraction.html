<style>
  :root{
    --bg:#eef1f5; --bg-grid:rgba(29,41,61,0.055);
    --panel:#ffffff; --panel-border:#d7dce4;
    --ink:#182233; --ink-soft:#4c5668; --ink-faint:#8993a5;
    --accent:#d9720c; --accent-soft:#fdead2;
    --good:#15803d; --good-soft:#dcf5e3;
    --bad:#c0311a; --bad-soft:#fbe1db;
    --shadow:0 10px 26px -14px rgba(24,34,51,0.28);
    --topic:#be185d;   --topic-soft:#fce7f3;
    --ray:#dc2626;     --pencil:#6b7280;
    --paper:#fdfcf8;   --glass:#cfe8f5;   --glass-edge:#5b8db3;   --prot:rgba(255,255,255,0.55);
    --box-f:#2d3648;   --box-t:#4a5569;   --box-s:#151b27;   --slit:#b4bcc9;   --lamp:#fde68a;   --glass-hi:rgba(255,255,255,0.7);
    --font-display:'Big Shoulders',system-ui,sans-serif;
    --font-body:'IBM Plex Sans',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12161f; --bg-grid:rgba(255,255,255,0.045);
      --panel:#1b212e; --panel-border:#2c3444;
      --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;
      --accent:#ff9a3d; --accent-soft:#3a2712;
      --good:#4ade80; --good-soft:#123321;
      --bad:#f27159; --bad-soft:#3a1712;
      --shadow:0 14px 30px -14px rgba(0,0,0,0.55);
      --topic:#f472b6; --topic-soft:#3f1530;
      --ray:#f87171; --pencil:#a3acbb;
      --paper:#20283a; --glass:#1e3a52; --glass-edge:#7fb2d9; --prot:rgba(27,33,46,0.55);
      --box-f:#5d6880; --box-t:#7c879d; --box-s:#353d4f; --slit:#c5ccd8; --lamp:#fde68a; --glass-hi:rgba(200,228,250,0.32);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12161f; --bg-grid:rgba(255,255,255,0.045);
    --panel:#1b212e; --panel-border:#2c3444;
    --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;
    --accent:#ff9a3d; --accent-soft:#3a2712;
    --good:#4ade80; --good-soft:#123321;
    --bad:#f27159; --bad-soft:#3a1712;
    --shadow:0 14px 30px -14px rgba(0,0,0,0.55);
    --topic:#f472b6; --topic-soft:#3f1530;
      --ray:#f87171; --pencil:#a3acbb;
      --paper:#20283a; --glass:#1e3a52; --glass-edge:#7fb2d9; --prot:rgba(27,33,46,0.55);
      --box-f:#5d6880; --box-t:#7c879d; --box-s:#353d4f; --slit:#c5ccd8; --lamp:#fde68a; --glass-hi:rgba(200,228,250,0.32);
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      linear-gradient(var(--bg-grid) 1px,transparent 1px) 0 0/100% 34px,
      linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px) 0 0/34px 100%,
      var(--bg);
    color:var(--ink); font-family:var(--font-body); font-size:14px; -webkit-font-smoothing:antialiased;
  }
  [hidden]{display:none!important;}
  button{font:inherit;color:inherit;}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;}

  .page{max-width:1400px;margin-inline:auto;padding-inline:20px;padding-block:12px 40px;}
  h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:0.2px;text-wrap:balance;margin:0;}
  p{margin:0;line-height:1.55;}

  .home-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-bottom:4px;font:600 13px var(--font-mono);color:var(--ink-soft);text-decoration:none;}
  .home-link:hover{color:var(--accent);}
  .page-head{margin-bottom:12px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px;}
  .eyebrow{font-family:var(--font-mono);font-size:11.5px;color:var(--accent);font-weight:600;margin-bottom:6px;}
  .page-head h1{font-size:clamp(28px,5vw,38px);color:var(--ink);}

  .card{background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;box-shadow:var(--shadow);}
  .btn{
    font-family:var(--font-body);font-weight:600;font-size:13.5px;color:var(--ink);
    background:var(--panel);border:1px solid var(--panel-border);border-radius:9px;
    padding:9px 15px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  }
  .btn:hover{border-color:var(--ink-faint);}
  .btn:disabled{opacity:.45;cursor:default;}
  .btn-primary{background:var(--ink);border-color:var(--ink);color:var(--bg);}
  .btn-primary:hover{opacity:.88;border-color:var(--ink);}
  .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);}
  .btn-group{display:flex;flex-wrap:wrap;gap:10px;}
  /* button rows fill their width (Alex, 2 Nov 2026) */
  .btn-group>.btn,.exp-btns>.btn{flex:1 1 0;min-width:max-content;justify-content:center;}
  .seg:not(.tabs){display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,96px),1fr));}
  .seg:not(.tabs)>button{padding-inline:4px;white-space:nowrap;}

  /* picture on the left with its buttons under it; choices, readings and working on the right */
  .stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,410px);gap:18px 24px;align-items:start;padding:18px;}
  @media (max-width:860px){ .stage{grid-template-columns:minmax(0,1fr);} }
  .view{display:block;width:100%;height:auto;max-height:max(260px,calc(100vh - 335px));}
  .view text{font-family:var(--font-mono);}
  .under{display:flex;flex-direction:column;gap:12px;margin-top:12px;}
  .revbox{display:flex;align-items:end;}
  .sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px 24px;}
  .side{display:flex;flex-direction:column;gap:12px;min-width:0;}
  .lab{display:block;font:12.5px var(--font-mono);color:var(--ink-soft);margin-bottom:6px;}
  .lab output{color:var(--ink);font-weight:600;white-space:nowrap;margin-left:6px;}
  input[type=range]{width:100%;accent-color:var(--topic);min-height:28px;}
  .seg{display:flex;flex-wrap:wrap;gap:6px;}
  .seg button{font:12.5px var(--font-mono);padding:8px 11px;min-height:44px;border:1px solid var(--panel-border);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer;}
  .seg button[aria-pressed="true"]{background:var(--topic);border-color:var(--topic);color:var(--panel);}
  .seg button:disabled{opacity:.45;cursor:default;}
  .seg.tabs{gap:0;flex-wrap:nowrap;}
  .seg.tabs button{white-space:nowrap;border-radius:0;margin-left:-1px;}
  .seg.tabs button:first-child{border-radius:8px 0 0 8px;margin-left:0;}
  .seg.tabs button:last-child{border-radius:0 8px 8px 0;}
  .cgrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center;}
  .rowlab{font:11.5px var(--font-mono);color:var(--ink-faint);}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px;}
  .stat{border:1px solid var(--panel-border);border-radius:8px;padding:5px 8px;display:flex;flex-direction:column;justify-content:space-between;}
  .stat small{display:block;font:10.5px var(--font-mono);color:var(--ink-faint);}
  .stat strong{font:600 15px var(--font-mono);color:var(--ink);white-space:nowrap;}
  .stat.hi strong{color:var(--topic);}
  .note{font-size:15px;line-height:1.5;color:var(--ink);padding:10px 12px;border-radius:8px;background:var(--bg);min-height:4.6em;}
  .note b{color:var(--topic);}

  details.working summary{cursor:pointer;font:600 13px var(--font-mono);color:var(--topic);min-height:44px;display:flex;align-items:center;}
  .eq{font-family:var(--font-mono);font-size:14px;line-height:1.75;padding:8px 12px;border-left:3px solid var(--topic);background:var(--topic-soft);border-radius:6px;color:var(--ink);}
  .eq b{color:var(--topic);}
  .eq + .eq{margin-top:8px;}
  .eqnote{font-size:13.5px;color:var(--ink-soft);margin-top:8px;}
  .eqg{display:grid;grid-template-columns:auto auto minmax(0,1fr);column-gap:.45em;row-gap:.2em;align-items:center}
  .eqg-l{justify-self:end;text-align:right}
  .eqg-m{justify-self:center}
  .eqg-r{justify-self:start;min-width:0}
  .eqg-full{grid-column:1/-1}
  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1.25;}
  .frac>span{padding:0 .25em;white-space:nowrap;}
  .frac>span:first-child{border-bottom:1.5px solid currentColor;}
  @media (max-width:560px){ .stage{padding:12px;} .view{max-height:none;} .eq{font-size:12px;padding:6px 8px;} .note{font-size:14px;} }

  /* ===== Experiment kit (tools/experiment-kit/kit.css) ===== */
  .exp-btns{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;}
  .view.dragging,.view.dragging *{cursor:grabbing;}
  .grab{cursor:grab;}
  .view:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px;}
  .rtable{width:100%;border-collapse:collapse;font:12.5px var(--font-mono);}
  .rtable th{position:sticky;top:0;background:var(--panel);font-weight:600;font-size:11px;color:var(--ink-faint);text-align:right;padding:4px 6px;border-bottom:1px solid var(--panel-border);}
  .rtable td{text-align:right;padding:3px 6px;border-bottom:1px solid var(--panel-border);color:var(--ink);}
  .rtable tr.new td{background:var(--cs, var(--accent-soft));}
  .rtable-wrap{max-height:150px;overflow:auto;border:1px solid var(--panel-border);border-radius:8px;}
  @media (prefers-reduced-motion: no-preference){ .rtable tr.new td{animation:rowin .35s ease-out;} }
  @keyframes rowin{from{opacity:0}to{opacity:1}}
  /* ===== end of Experiment kit ===== */

  /* inside a workout tab (?embed): no page heading, no outer margins */
  .embed body{background:transparent;}
  .embed .page{padding:0;max-width:none;display:flow-root;}
  .embed .home-link,.embed .page-head{display:none;}
  .embed .view{max-height:460px;}


  /* refraction: paper, block, ray box */
  #rf-block,#rf-jump,#rf-entry,#rf-light,#rf-show{display:flex;flex-wrap:nowrap;}
  #rf-block>button,#rf-jump>button,#rf-entry>button,#rf-light>button,#rf-show>button{flex:1 1 auto;padding-inline:6px;}
  #rf-block>button{padding-inline:3px;font-size:12px;}
  #rf-light>button,#rf-show>button{font-size:12px;padding-inline:5px;}
  #rf-stats{grid-template-columns:repeat(auto-fit,minmax(74px,1fr));}
  #rf-stats .stat strong{font-size:14px;}
  #rf-svg{max-height:max(260px,calc(100vh - 262px));}
  .embed #rf-svg{max-height:460px;}
  @media (max-width:560px){ #rf-block,#rf-jump{flex-wrap:wrap;} }
  .seg button.tog[aria-pressed="true"]{background:var(--topic-soft);border-color:var(--topic);color:var(--ink);}
  .obs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;}
  .obs li{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.4;padding:4px 8px;border:1px solid var(--panel-border);border-radius:8px;color:var(--ink-soft);}
  .obs li .tk{font:600 13px var(--font-mono);width:1.2em;flex:none;color:var(--ink-faint);}
  .obs li.on{color:var(--ink);border-color:var(--good);background:var(--good-soft);}
  .obs li.on .tk{color:var(--good);}
  .obs li{padding:3px 8px;font-size:13px;}
  #rf-tablewrap{max-height:122px;}
  .slider-hint{font:11.5px var(--font-mono);color:var(--ink-faint);margin-top:2px;}
  /* Questions: the dashed lines to choose from are in the picture */
  .pick{cursor:pointer;}
  .pick:focus{outline:none;}
  .pick .ring{stroke:transparent;}
  .pick:focus-visible .ring{stroke:var(--accent);}
  /* the slider under the picture is one line: its label, then the slider (not in the dispersion view, which has two) */
  @media (min-width:561px){ html:not(.disp) .under .sliders>div{display:flex;align-items:center;gap:14px;} html:not(.disp) .under .sliders .lab{margin:0;white-space:nowrap;} html:not(.disp) .under .sliders input{flex:1 1 auto;min-width:0;} }
  @media (max-height:640px) and (min-width:861px){ .seg button{min-height:38px;} .side{gap:9px;} .note{min-height:0;} }
  /* measure mode (?show=measure): everything that reads, records or explains is hidden */
  .meas-off{display:none !important;}
  #rf-pos{display:flex;flex-wrap:nowrap;}
  #rf-pos>button{flex:1 1 auto;padding-inline:6px;min-width:38px;}

</style>

<script>
  // Visit counter (GoatCounter: no cookies, no personal data). Skipped when a page is embedded in a workout, so a visit counts once.
  // pwCountTab(tab, label): counts each workout tab once per visit as a GoatCounter event (path "page#tab"), skipped in frames the same way.
  (function(){
    var off = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var seen = {}, queue = [];
    function send(e){ try { window.goatcounter.count(e); } catch (x) {} }
    window.pwCountTab = function(tab, label){
      if (off || !tab || seen[tab]) return;
      seen[tab] = 1;
      var page = (location.pathname.split('/').pop() || 'index').replace(/\.html$/, '');
      var e = { path: page + '#' + tab, title: (label || tab) + ' · ' + document.title, event: true };
      if (window.goatcounter && window.goatcounter.count) send(e); else queue.push(e);
    };
    if (off) return;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://gc.zgo.at/count.js';
    s.setAttribute('data-goatcounter', 'https://physics-workout.goatcounter.com/count');
    s.onload = function(){ var q = queue; queue = []; q.forEach(send); };
    document.head.appendChild(s);
  })();
</script>
<!-- pw-review -->
<script>
  // Draft tags and Alex's reviewer button (tools/review/drafts.py writes this block; edit tools/review/snippet.html, then run drafts.py sync).
  // A page is Draft while its row in tools/REVIEW.md is not ✅: <meta name="pw-draft"> on the page, data-draft on its list cards.
  // ?reviewer (once, on any page) turns on reviewer mode in this browser; ?reviewer=off turns it off.
  (function(){
    var on = false, embed = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var m = /[?&]reviewer(?:=([^&]*))?/.exec(location.search);
    on = !!m && m[1] !== 'off';
    try {
      if (m) { if (m[1] === 'off') localStorage.removeItem('pw-reviewer'); else localStorage.setItem('pw-reviewer', '1'); }
      else on = localStorage.getItem('pw-reviewer') === '1';
    } catch (e) {}
    var CSS = '.pw-draft{display:inline-block;vertical-align:middle;margin-left:10px;font:600 11.5px/1.4 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:0;color:var(--bad,#b42318);border:1px dashed currentColor;border-radius:5px;padding:1px 7px;white-space:nowrap}'
      + '.act-top .pw-draft{margin-left:auto;flex:none}.act-top .pw-draft~.cp-tag,.act-top .pw-draft~.ta-tag{margin-left:0}'
      + 'a[data-draft]{position:relative}.pw-draft.pw-corner{position:absolute;top:10px;right:10px;margin:0;background:var(--panel,#fff)}'
      + '.pw-check{display:inline-block;vertical-align:middle;margin-left:8px;font:600 13px/1.4 "IBM Plex Sans",system-ui,sans-serif;color:#fff;background:#1a7f37;border-radius:6px;padding:4px 10px;text-decoration:none;white-space:nowrap}'
      + '.pw-check:hover{background:#116329}.pw-check:focus-visible{outline:2px solid #1a7f37;outline-offset:2px}'
      + '.pw-reviewer{position:fixed;left:10px;bottom:10px;z-index:9999;font:500 12px/1.4 "IBM Plex Mono",ui-monospace,monospace;background:#1d2433;color:#fff;border-radius:6px;padding:4px 9px;opacity:.85}'
      + '.pw-reviewer a{color:#ffc83d}';
    function tag(){ var t = document.createElement('span'); t.className = 'pw-draft'; t.title = 'Not yet checked'; t.textContent = 'Draft'; return t; }
    function go(){
      var st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st);
      var meta = document.querySelector('meta[name="pw-draft"]'), h1 = document.querySelector('h1');
      if (meta && h1 && !embed) {
        h1.appendChild(tag());
        if (on) {
          var page = meta.getAttribute('content'), b = document.createElement('a');
          b.className = 'pw-check'; b.target = '_blank'; b.rel = 'noopener'; b.textContent = '✓ Checked';
          b.title = 'Opens a GitHub issue. Submit it and the Draft tag goes in a minute or two.';
          b.href = 'https://github.com/Skati1401/Physics-Workout/issues/new?title=' + encodeURIComponent('Checked: ' + page)
            + '&body=' + encodeURIComponent('Submit this issue to mark `' + page + '` as checked. The Draft tag goes in a minute or two, and the issue closes itself.');
          h1.appendChild(b);
        }
      }
      document.querySelectorAll('a[data-draft]').forEach(function(a){
        if (a.querySelector('.pw-draft')) return;
        var t = tag(), top = a.querySelector('.act-top');
        if (top) top.insertBefore(t, top.querySelector('.cp-tag,.ta-tag'));
        else { t.className += ' pw-corner'; a.appendChild(t); }
      });
      // No tag on a unit or theme heading (Alex, 12 Nov 2026): only the pages and their cards.
      if (on && !embed) {
        // Carry ?reviewer in every link to another page of the site, so reviewer mode survives
        // browsers that clear site storage (school Chromebooks) and pages cached from before.
        var carry = function(a){
          try {
            var u = new URL(a.href, location.href);
            if (u.origin !== location.origin || !/(\.html|\/)$/.test(u.pathname) || u.searchParams.has('reviewer')) return;
            u.searchParams.set('reviewer', ''); a.href = u.href.replace('reviewer=', 'reviewer');
          } catch (e) {}
        };
        document.querySelectorAll('a[href]').forEach(carry);
        ['click', 'auxclick', 'contextmenu'].forEach(function(ev){

/* ================= Experiment kit (copy this block into an animation page's <script>) =================
   The reusable parts of an animation's Experiment mode, taken from animations/hookes-law.html:
   - expRun():     the run itself: step the independent variable up one interval at a time, then
                   (optionally) back down again, measuring at every step
   - expReading(): a reading with a small, fixed pattern of reading error, rounded to the instrument's
                   resolution, that never goes the wrong way
   - expTable():   the results table (sticky header, newest row highlighted, a column per run)
   - expCross(), expRing(), expKey(): SVG marks for plotted readings (× first run, ○ return run)
   The page keeps its own picture, physics, graph axes and notes. See tools/experiment-kit/README.md.
   Plain ES5 so it can sit inside any animation page's IIFE. */

// A fixed pattern of reading errors, in units of the instrument's resolution. Fixed (not random) so a
// teacher sees the same results as the class, and a re-run gives the same table.
var EXP_ERR = [0, 1, -1, 0, 2, -1, 1, -2, 0, 1, -1, 0, 1, -1, 2, 0, -1, 1, 0, -2, 1];
function expErr(i){ return EXP_ERR[((i % EXP_ERR.length) + EXP_ERR.length) % EXP_ERR.length]; }

// What the student reads off the instrument.
//   trueVal  the value the physics gives at this step
//   prevVal  the reading taken at the step before (or the start value)
//   res      the instrument's resolution (0.1 cm ruler, 0.05 mm vernier, 0.01 A ammeter, 1° protractor)
//   i        the step number (picks the error from the pattern)
//   scale    how big the error is, in resolutions (default 1; 0.5 for a fine instrument)
// The error is never more than a quarter of the change since the last reading, so a reading never
// goes the wrong way (an extension never falls as the load rises, a current never drops as V rises).
function expReading(trueVal, prevVal, res, i, scale){
  var gap = Math.abs(trueVal - prevVal);
  var err = i > 0 ? expErr(i) * Math.min(res * (scale == null ? 1 : scale), gap / 4) : 0;
  var r = Math.round((trueVal + err) / res) * res;
  var dp = Math.max(0, Math.ceil(-Math.log10(res) - 1e-9));
  return +r.toFixed(dp);
}

// The run. cfg = {
//   start: 0,                 value of the independent variable before the first step
//   max: 10,                  last value of the first run (the run stops there)
//   step: 1,                  the interval (the page can change it with setStep, which resets the run)
//   reverse: true,            allow a return run (unloading, turning the voltage back down)
//   measure: function(v, phase, prevReading){ return reading },   phase is 'up' or 'down'
//   onChange: function(run, what){}  what is 'up', 'down' or 'reset'
// }
// run.up and run.down are arrays of {v, r}. run.phase is 'up' until the first step back, then 'down'.
function expRun(cfg){
  var run = { up: [], down: [], phase: 'up', value: cfg.start || 0, peak: cfg.start || 0, step: cfg.step || 1 };
  var r6 = function(x){ return Math.round(x * 1e6) / 1e6; };
  run.upDone = function(){ return run.phase === 'down' || run.peak >= cfg.max - 1e-9; };
  run.downDone = function(){ return run.phase === 'down' && run.value <= (cfg.start || 0) + 1e-9; };
  run.last = function(){ var a = run.phase === 'down' && run.down.length ? run.down : run.up; return a[a.length - 1] || null; };
  run.stepUp = function(){
    if(run.phase !== 'up' || run.upDone()) return false;
    var prev = run.up.length ? run.up[run.up.length - 1].r : null;
    var v = r6(Math.min(cfg.max, run.value + run.step));
    run.value = run.peak = v;
    run.up.push({ v: v, r: cfg.measure(v, 'up', prev) });
    if(cfg.onChange) cfg.onChange(run, 'up');
    return true;
  };
  run.stepDown = function(){
    if(!cfg.reverse || run.value <= (cfg.start || 0) + 1e-9 || !run.up.length) return false;
    run.phase = 'down';
    var prev = run.down.length ? run.down[run.down.length - 1].r : run.up[run.up.length - 1].r;
    var v = r6(Math.max(cfg.start || 0, run.value - run.step));
    run.value = v;
    run.down.push({ v: v, r: cfg.measure(v, 'down', prev) });
    if(cfg.onChange) cfg.onChange(run, 'down');
    return true;
  };
  run.reset = function(){ run.up = []; run.down = []; run.phase = 'up'; run.value = run.peak = cfg.start || 0; if(cfg.onChange) cfg.onChange(run, 'reset'); };
  run.setStep = function(s){ run.step = s; run.reset(); };
  return run;
}

// The results table. cols = [{label:'Load (N)', key:'v', dp:0}, {label:'Extension loading (cm)', key:'up', dp:1}, ...]
// rows = [{v:1, up:1.6, down:''}, ...]. newKey/newV highlight the reading just taken (fades in).
// Wrap it in .rtable-wrap so a long table scrolls under its sticky header.
function expTable(el, cols, rows, newV){
  var fmt = function(x, dp){ return (x === '' || x == null) ? '' : (+x).toFixed(dp || 0); };
  var h = '<table class="rtable"><thead><tr>' + cols.map(function(c){ return '<th>' + c.label + '</th>'; }).join('') + '</tr></thead><tbody>';
  rows.forEach(function(row){
    h += '<tr' + (newV != null && row.v === newV ? ' class="new"' : '') + '>' + cols.map(function(c){ return '<td>' + fmt(row[c.key], c.dp) + '</td>'; }).join('') + '</tr>';
  });
  el.innerHTML = h + '</tbody></table>';
}

// Plotted readings, as SVG strings. Size 5 suits a 300px-wide graph.
function expCross(cx, cy, s){ s = s || 5; return '<path d="M' + (cx - s) + ',' + (cy - s) + ' L' + (cx + s) + ',' + (cy + s) + ' M' + (cx + s) + ',' + (cy - s) + ' L' + (cx - s) + ',' + (cy + s) + '" stroke="var(--ink)" stroke-width="2"/>'; }
function expRing(cx, cy, r){ return '<circle cx="' + cx + '" cy="' + cy + '" r="' + (r || 4.5) + '" fill="none" stroke="var(--accent)" stroke-width="2"/>'; }
// A two-line key in the bottom-right corner of a graph: expKey(rightX, bottomY, 'loading', 'unloading')
function expKey(x, y, upLabel, downLabel){
  return '<text x="' + x + '" y="' + (y - 14) + '" text-anchor="end" font-size="10.5" fill="var(--ink)">× ' + upLabel + '</text>' +
         '<text x="' + x + '" y="' + y + '" text-anchor="end" font-size="10.5" fill="var(--accent)">○ ' + downLabel + '</text>';
}
/* ================= end of Experiment kit ================= */

  // ================= small helpers =================
  function f1(x){ return (+x).toFixed(1); }
  function stat(lab, val, hi){ return '<div class="stat'+(hi?' hi':'')+'"><small>'+lab+'</small><strong>'+val+'</strong></div>'; }
  function svgPoint(svg, e){ var p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }

  // ================= the optics =================
  // Glass with n = 1.50 for one colour (critical angle 41.8°). White light: seven colours, red 1.490 to violet 1.530.
  var NG=1.50;
  var WHITE=[['#dc2626',1.490],['#ea580c',1.497],['#ca8a04',1.503],['#16a34a',1.510],['#2563eb',1.517],['#4f46e5',1.524],['#9333ea',1.530]];
  var NGREEN=1.510;

  // Dispersion view: the same glass as a smooth curve, n = 1.4706 + 9503/λ² (λ in nm): 1.490 at 700 nm, 1.530 at 400 nm.
  // That is about twice the spread of real crown glass, so that the colours can be seen apart.
  function nOf(l){ return 1.4706+9503/(l*l); }
  var DWL=[700,675,650,625,600,575,550,525,500,475,450,425,400], WL=550;
  function wlCol(l){ var r=0,g=0,b=0;   // the colour of one wavelength (after Bruton), a little darker so that it shows on the paper
    if(l<440){ r=(440-l)/60; b=1; } else if(l<490){ g=(l-440)/50; b=1; } else if(l<510){ g=1; b=(510-l)/20; } else if(l<580){ r=(l-510)/70; g=1; } else if(l<645){ r=1; g=(645-l)/65; } else r=1;

  function wlName(l){ return l<450 ? 'violet' : l<495 ? 'blue' : l<570 ? 'green' : l<590 ? 'yellow' : l<620 ? 'orange' : 'red'; }
  var PW=600, PH=360;                     // the sheet of paper
  function seg(a,b,face){ return {t:'s', a:a, b:b, face:face}; }
  function arc(c,r,face){ return {t:'a', c:c, r:r, face:face}; }   // lower half of a circle (y down)
  var S3=Math.sqrt(3), R2=Math.SQRT1_2;
  var BLOCKS={

      entries:{curved:{label:'Curved side', P:[300,118], u:[0,1], s:[-1,0], Rb:222, max:85, kind:'crit'},

      entries:{left:{label:'Left face', P:[245,204.75], u:[-S3/2,-0.5], s:[-0.5,S3/2], Rb:180, max:80, kind:'obs'}}},

      w2='sin c = [[1|n]]<br>sin c = [[1|'+nTxt+']]<br>sin c = '+(1/n).toFixed(4)+'<br>c = <b>'+d1(C)+'</b>';
      if(e.kind==='tir'){ w1='n = [[sin (angle in air)|sin (angle in glass)]]<br>'+nTxt+' = [[sin r|sin '+d1(I)+']]<br>sin r = '+nTxt+' × sin '+d1(I)+'<br>sin r = '+(n*sinD(I)).toFixed(4); w3='sin r would be more than 1, which is impossible: no light leaves. '+d1(I)+' is bigger than the critical angle, so there is total internal reflection.'; }
      else if(I<0.05){ w1='Along the normal (0°): no bending.'; }
      else { w1='n = [[sin (angle in air)|sin (angle in glass)]]<br>'+nTxt+' = [[sin r|sin '+d1(I)+']]<br>sin r = '+nTxt+' × sin '+d1(I)+'<br>sin r = '+(n*sinD(I)).toFixed(4)+'<br>r = <b>'+d1(e.r)+'</b>'; w3='The ray enters along a radius, so it does not bend at the curved side. At the flat face it speeds up and bends away from the normal.'; }
    } else {
      w1=snell(I, e.r, n, nTxt);
      if(nx){ w2='critical angle c = '+d1(C)+'<br>angle at the next face = '+d1(nx.i); w3 = nx.kind==='tir' ? d1(nx.i)+' is more than c, so the ray is totally internally reflected.' : d1(nx.i)+' is less than c, so the ray refracts out, bending away from the normal.'; }
      if(white()) w3+=' Worked for green light (n = 1.51).';
    }
    setEq('#rf-eq1', w1); setEq('#rf-eq2', w2); $('#rf-eq3').innerHTML=FR(w3); $('#rf-eq3').hidden=!w3;

    // note
    var note='';
    if(ex){
      if(X.busy) note = X.busy>TRACE_T-0.5 ? 'Marking two crosses on the ray going in and two on the ray coming out, far apart…' : X.busy>TRACE_T-1.5 ? 'Lifting the block off, then joining the crosses with a ruler, through the outline…' : 'Drawing the normal and measuring the angles from it with a protractor…';
      else if(K==='graph'){
        if(!X.rd.length) note='Experiment (3.19): set an angle of incidence, then press <b>Take reading</b>. Measure i and r from the normal. Take readings from about 10° to 80°.';
        else if(!done()) note='You have '+distinctI().length+' angle'+(distinctI().length===1?'':'s')+'. You need at least 5, from 30° or less to 60° or more. Plot sin i against sin r.';
        else note='Done: a straight line through the origin, so sin i ∝ sin r. Gradient = refractive index, <b>n ≈ '+slope().toFixed(2)+'</b>. r increases with i, but at a decreasing rate.';
      } else if(K==='crit'){
        var cr2=critRange();
        if(!X.rd.length) note='Experiment (3.17): the ray goes along a radius to the centre of the flat face. Take readings as you turn the ray box, and find where the light stops leaving the flat face.';
        else if(!done()) note = cr2[0]>=0 && cr2[1]<99 ? 'It refracts out at '+cr2[0]+'° and is totally internally reflected at '+cr2[1]+'°. Narrow it down to within 2°.' : cr2[1]<99 ? 'Total internal reflection at '+cr2[1]+'°. Try a smaller angle.' : 'The light still leaves the flat face. Try a bigger angle in the glass.';
        else note='Done: the <b>critical angle</b> is between '+cr2[0]+'° and '+cr2[1]+'° (it is 41.8°). Below it the ray refracts out; above it, total internal reflection. n = [[1|sin c]] ≈ 1.5.';
      } else {
        if(!X.rd.length) note='Experiment (3.17): set an angle, then press <b>Trace the ray</b>. See everything on the list.'+(blockSeg.value()==='p60'?' Try white light too.':' Try both sides.');
        else if(!done()) note='Keep going: '+OBS[obsKey()].filter(function(o){ return !X.obs[o[0]]; }).length+' still to see.'+(blockSeg.value()==='p45' && !X.obs.t180 ? ' Use <b>Ray in: Long side</b> for one of them.' : '');
        else note = blockSeg.value()==='p60' ? 'Done: above the critical angle at the second face, the ray is totally internally reflected. Violet bends most, red least: <b>dispersion</b>.' : 'Done: inside, the ray meets a face at 45°, more than the critical angle (41.8°): <b>total internal reflection</b>, as in periscopes and binoculars.';
      }
    } else if(K==='graph'){
      note = I<0.05 ? 'Along the normal: the ray goes straight through without bending.' : 'Going into the glass the light slows down and bends <b>towards</b> the normal (r &lt; i).'+(b==='rect' ? ' Coming out it speeds up and bends away, leaving <b>parallel</b> to the ray going in.' : ' It leaves the curved side along a radius, so it does not bend there.');
      if(white() && I>0.05) note='White light: each colour bends by a different amount, violet the most. Coming out of parallel faces the colours end up parallel again, so you hardly see them.';
    } else if(K==='crit'){
      note = I<0.05 ? 'Along the normal: no bending at all.' : e.kind==='tir' ? 'Above the critical angle: <b>total internal reflection</b>. All the light reflects back into the glass.' : Math.abs(I-C)<0.6 ? 'At the <b>critical angle</b>: the refracted ray runs along the flat face (angle in air 90°).' : 'Below the critical angle: the light refracts out, bending <b>away</b> from the normal, and some reflects weakly.';
    } else if(blockSeg.value()==='p60'){
      note = nx && nx.kind==='tir' ? 'The ray meets the second face above the critical angle, so it is <b>totally internally reflected</b>.' : white() ? 'White light splits into a spectrum: violet bends most, red least. This is <b>dispersion</b>.' : 'The ray bends towards the normal going in, and away from it coming out, so it turns towards the base.';
    } else {
      var tirs=tr.ev.filter(function(q){ return q.kind==='tir'; }).length;
      note = tirs===2 ? 'Two total internal reflections: the ray comes back the way it came, shifted sideways (binoculars).' : tirs===1 ? 'Inside, the ray meets the long side at more than the critical angle: <b>total internal reflection</b> turns it through '+d0(deviation(R))+' (a periscope).' : 'At this angle the ray meets the far face below the critical angle, so it refracts out. Total internal reflection needs the ray to go in close to the normal.';
    }
    if(note!==lastNote){ $('#rf-note').innerHTML=FR(note); lastNote=note; }
    if(ex){ playBtn.innerHTML = K==='obs' ? '&#9654; Trace the ray' : '&#9654; Take reading'; playBtn.disabled=X.busy>0; }
    else { playBtn.innerHTML = running ? '&#10074;&#10074; Pause' : '&#9654; Play'; playBtn.disabled=false; }
  }

  // ================= motion =================
  // Play turns the ray box steadily from 0° to the largest angle, then stops (it never loops).
  var SWEEP=7;   // degrees per second
  var wlIn=$('#rf-wl'), wlF=550;
  function frame(now){
    var real=Math.min(0.05,(now-last)/1000); last=now;
    if(running && DISP && !white()){
      wlF-=45*real*(slowOn()?0.3:1);
      if(wlF<=400){ wlF=400; running=false; }
      WL=Math.round(wlF/10)*10; wlIn.value=WL;
    } else if(running){
      var v=I+SWEEP*real*(slowOn()?0.3:1);
      if(v>=ent().max){ v=ent().max; running=false; }
      I=Math.round(v*100)/100; iIn.value=Math.round(I); jumpSeg.pick(null);
    }
    if(X.busy){ X.busy-=real; if(X.busy<=0){ X.busy=0; record(); } }
    var qrun=predict() && Q && Q.phase==='run';
    if(qrun){ Q.t+=QSPEED*real*(slowOn()?0.3:1); if(Q.t>=Q.len){ Q.t=Q.len; qJudge(); qrun=false; } }
    draw();
    if(running || X.busy || qrun) raf=requestAnimationFrame(frame);
  }
  function loop(){ cancelAnimationFrame(raf); last=performance.now(); raf=requestAnimationFrame(frame); }
  function stop(){ running=false; cancelAnimationFrame(raf); }

  // ================= controls =================
  var JUMPS={
    rect:{top:[[0,'Along the normal'],[30,'30°'],[60,'60°']]},
    semi:{curved:[[30,'Below c'],[+crit(NG).toFixed(1),'At c'],[50,'Above c']], flat:[[0,'Along the normal'],[30,'30°'],[60,'60°']]},
    p60:{left:[[20,'20°'],[40,'40°'],[60,'60°']]},
    p45:{short:[[0,'Along the normal'],[20,'20°']], long:[[0,'Along the normal'],[10,'10°']]}
  };
  function setJumps(){ jumpEl.innerHTML=JUMPS[blockSeg.value()][entrySeg.value()].map(function(j){ return '<button type="button" data-v="'+j[0]+'" aria-pressed="false">'+j[1]+'</button>'; }).join(''); }
  function setEntries(){
    var es=blk().entries, keys=Object.keys(es);
    entryEl.innerHTML=keys.map(function(k,j){ return '<button type="button" data-v="'+k+'" aria-pressed="'+(j===0)+'">'+es[k].label+'</button>'; }).join('');
  }
  function setI(v, keep){
    if(X.busy) return;
    v=Math.max(0, Math.min(ent().max, v));
    if(exp()) v=Math.round(v);
    if(v!==I) X.mark=null;
    I=v; iIn.value=Math.round(v);
    if(!keep) jumpSeg.pick(null);
    draw();
  }
  function setRows(){
    var ex=exp(), K=kind(), multi=Object.keys(blk().entries).length>1;
    $('#rf-elab').hidden=entryEl.hidden=!multi;
    $('#rf-jlab').hidden=jumpEl.hidden=ex;
    var pr=predict();
    $('#rf-slab').hidden=showEl.hidden=ex; $('#rf-stats').hidden=ex || pr;
    Array.prototype.forEach.call(document.querySelectorAll('.cgrid'), function(c){ c.hidden=pr; }); iIn.parentNode.hidden=pr || MIDX; expBtn.hidden=pr; $('#rf-posrow').hidden=!MIDX;
    $('#rf-reset').innerHTML = pr ? 'New question' : '&#8634; Reset';
    $('details.working').hidden = (ex && K==='obs') || pr; $('#rf-tablewrap').style.maxHeight = K==='obs' ? '98px' : '';
    $('#rf-llab').hidden=$('#rf-light').hidden = (ex && K!=='obs') || blockSeg.value()==='p45';
    $('#rf-clear').hidden=!ex; $('#rf-tablewrap').hidden=!ex; $('#rf-obs').hidden=!(ex && K==='obs');
    iIn.max=ent().max;
    if(DISP){ $('#rf-blab').hidden=$('#rf-block').hidden=true; expBtn.hidden=true; $('#rf-wlrow').hidden=white(); $('#rf-mode').hidden=true; }
  }
  function newSetup(){ stop(); clearRun(); setJumps(); setRows(); layout(); if(I>ent().max) I=ent().max; if(exp()) I=Math.round(I); iIn.value=Math.round(I); lastNote=''; draw(); }

  // Explore or Questions
  function setMode(){
    stop(); X.mark=null;
    if(predict()){ saved={b:blockSeg.value(), e:entrySeg.value(), i:I}; expBtn.setAttribute('aria-pressed','false'); clearRun(); newQ(); }
    else { Q=null; if(saved){ curBlock=saved.b; blockSeg.pick(saved.b); setEntries(); entrySeg.pick(saved.e); I=saved.i; iIn.max=ent().max; iIn.value=Math.round(I); saved=null; } }
    svg.setAttribute('aria-label', predict() ? 'A ray box shines a ray at a glass block on a sheet of paper. Dashed lines with letters show where the ray might go next. Press Tab to reach a line and Enter to choose it, then press Go.' : ARIA0);
    setJumps(); setRows(); layout(); lastNote=''; draw();
  }
  var ARIA0=svg.getAttribute('aria-label');
  modeSeg=segGroup($('#rf-mode'), function(){ setMode(); });
  posSeg=segGroup($('#rf-pos'), function(v){ stop(); setI(+v, true); });
  function nearPos(v){ var b=MPOS[0]; MPOS.forEach(function(p){ if(Math.abs(p-v)<Math.abs(b-v)) b=p; }); return b; }
  function choose(t){ if(t && Q && Q.phase==='ask' && predict()){ Q.pick=t.getAttribute('data-pick'); lastNote=''; draw(); } }
  svg.addEventListener('click', function(e){ choose(e.target.closest('.pick')); });
  svg.addEventListener('keydown', function(e){ if(e.key!=='Enter' && e.key!==' ') return; var t=e.target.closest('.pick'); if(t){ e.preventDefault(); choose(t); } });

  svgDrag(svg, {
    ok:function(){ return !X.busy && !predict(); },
    hit:function(q){ var B=boxPos(I); return Math.hypot(q.x-B[0], q.y-B[1])<40; },
    start:function(){ stop(); },
    move:function(q){ var E=ent(), v=[q.x-E.P[0], q.y-E.P[1]], a=deg(Math.atan2(dot(v,E.s), dot(v,E.u))); setI(MIDX ? nearPos(a) : Math.round(Math.max(0,a))); }
  });
  svg.addEventListener('keydown', function(e){
    if(X.busy || predict()) return;
    var k=e.key, v=null;
    if(MIDX){ var pi=MPOS.indexOf(nearPos(I)); if(k==='ArrowRight'||k==='ArrowUp') v=MPOS[Math.min(MPOS.length-1,pi+1)]; else if(k==='ArrowLeft'||k==='ArrowDown') v=MPOS[Math.max(0,pi-1)]; if(v!==null){ stop(); setI(v); e.preventDefault(); } return; }
    if(k==='ArrowRight'||k==='ArrowUp') v=Math.floor(I)+1; else if(k==='ArrowLeft'||k==='ArrowDown') v=Math.ceil(I)-1;
    else if(k==='PageUp') v=I+10; else if(k==='PageDown') v=I-10; else if(k==='Home') v=0; else if(k==='End') v=ent().max;
    if(v!==null){ stop(); setI(v); e.preventDefault(); }
  });
  iIn.addEventListener('input', function(){ stop(); setI(+iIn.value); });
  wlIn.addEventListener('input', function(){ stop(); WL=+wlIn.value; wlF=WL; draw(); });

  playBtn.addEventListener('click', function(){
    if(predict()){ if(Q && Q.phase==='ask' && Q.pick){ Q.phase='run'; Q.t=0; lastNote=''; loop(); } return; }
    if(exp()){ if(X.busy) return; takeReading(); X.busy=TRACE_T; loop(); return; }
    if(running){ stop(); draw(); return; }
    if(DISP && !white()){ wlF = WL<=400 ? 700 : WL; if(WL<=400){ WL=700; wlIn.value=700; } running=true; loop(); return; }
    if(I>=ent().max-0.01) I=0;
    jumpSeg.pick(null); running=true; loop();
  });
  slowBtn.addEventListener('click', function(){ slowBtn.setAttribute('aria-pressed', String(!slowOn())); draw(); });
  expBtn.addEventListener('click', function(){ expBtn.setAttribute('aria-pressed', String(!exp())); newSetup(); });
  $('#rf-reset').addEventListener('click', function(){ stop(); if(predict()){ newQ(); draw(); return; } if(DISP){ WL=550; wlF=550; wlIn.value=550; } if(exp()){ clearRun(); I=Math.round(I); draw(); return; } jumpSeg.pick(null); setI(40); });
  $('#rf-clear').addEventListener('click', function(){ stop(); clearRun(); draw(); });

  watchEquals($('#rf-eq1')); watchEquals($('#rf-eq2'));
  if(DISP){ curBlock='p60'; blockSeg.pick('p60'); lightSeg.pick('white'); showEl.querySelector('[data-v="refl"]').setAttribute('aria-pressed','false'); }
  if(MEAS){
    document.documentElement.classList.add('measure');
    expBtn.setAttribute('aria-pressed','true');
    ['#rf-exp','#rf-slow','#rf-clear','#rf-reset','#rf-stats','#rf-tablewrap','#rf-obs','details.working','#rf-mode','.to-q'].forEach(function(q){ var el=$(q); if(el) el.classList.add('meas-off'); });
    var off=function(a){ a.forEach(function(q){ $(q).classList.add('meas-off'); }); };
    var mb=location.search.match(/[?&]block=(rect|semi|p60|p45)\b/), me=location.search.match(/[?&]entry=(top|curved|flat|left|short|long)\b/), fixB=MIDX || !!mb;
    if(mb && !MIDX){ curBlock=mb[1]; blockSeg.pick(mb[1]); }
    if(fixB) off(['#rf-blab','#rf-block']);
    setEntries();
    if(me && !MIDX && blk().entries[me[1]]){ entrySeg.pick(me[1]); off(['#rf-elab','#rf-entry']); }
    if(/[?&]light=white\b/.test(location.search) && !MIDX){ lightSeg.pick('white'); off(['#rf-llab','#rf-light']); }
    if(/[?&]light=one\b/.test(location.search) || MIDX) off(['#rf-llab','#rf-light']);
    $('label[for="rf-i"]').firstChild.nodeValue='Turn the ray box (or drag it)';
    svg.setAttribute('aria-label','A ray box on a sheet of paper shines a ray of light at a glass block. Beside it, the protractor seen close up, to read the angles after the ray is traced. Drag the ray box, or use the arrow keys, to turn it.');
  } else setEntries();
  var showP=/[?&]show=predict\b/.test(location.search) && !DISP && !MEAS;
  if(showP) modeSeg.pick('predict');
  setJumps(); setRows(); layout();
  if(showP) setMode(); else draw();
})();
</script><script id="choice-kit-js">
/* Choice kit (12 Nov 2026): the same block on every animation page. See tools/ANIMATION-STYLE.md, "Choices".
   A group of choices with one chosen gets a track round it (class pick); a .to-q button opens the questions from Explore. */
(function(){
  function on(b){ return b.getAttribute('aria-pressed')==='true' || b.classList.contains('is-on'); }
  function each(sel, fn){ Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }
  function mark(s){
    if(!s.classList.contains('pick')){
      var n=0; Array.prototype.forEach.call(s.children, function(b){ if(b.tagName==='BUTTON' && on(b)) n++; });
      if(n===1) s.classList.add('pick');
    }
    if(s.classList.contains('pick') && !s.hasAttribute('data-fit')){
      var d=getComputedStyle(s).display;
      if(d!=='none'){ s.setAttribute('data-fit','1'); if(d.indexOf('flex')>=0) s.classList.add('fit'); }
    }
  }
  each('.seg:not(.tabs):not(.mode):not(.apps)', function(s){
    mark(s);
    if(window.MutationObserver) new MutationObserver(function(){ mark(s); }).observe(s, {childList:true, subtree:true, attributes:true, attributeFilter:['aria-pressed','class']});
  });
  // Choice rows: wrap each .rowlab and the control after it in a .cgroup (label above, groups side by side).
  // A group is hidden when everything in it is hidden, so pages that hide a row's label and control still work.
  function shown(e){ return !e.hidden && e.style.display!=='none'; }
  each('.cgrid:not(.kit)', function(g){
    var kids=Array.prototype.slice.call(g.children), groups=[];
    for(var i=0;i<kids.length;i++){
      var w=document.createElement('div'); w.className='cgroup';
      g.insertBefore(w, kids[i]); w.appendChild(kids[i]);
      if(kids[i].classList.contains('rowlab') && kids[i+1]){ w.appendChild(kids[i+1]); i++; }
      groups.push(w);
    }
    g.classList.add('kit'); if(groups.length===1) g.classList.add('one');
    groups.forEach(function(w){
      function sync(){ var any=false; Array.prototype.forEach.call(w.children, function(c){ if(shown(c)) any=true; }); w.hidden=!any; }
      sync();
      if(window.MutationObserver) Array.prototype.forEach.call(w.children, function(c){ new MutationObserver(sync).observe(c, {attributes:true, attributeFilter:['hidden','style']}); });
    });
  });
  each('.to-q[data-mode]', function(b){
    var seg=document.getElementById(b.getAttribute('data-mode')); if(!seg) return;
    var bs=seg.querySelectorAll('button');
    function sync(){ b.hidden=!on(bs[0]) || !seg.getClientRects().length; }   // hidden too when the page hides its mode switch (e.g. at a level with no questions)
    b.addEventListener('click', function(){ bs[1].click(); bs[1].focus(); });
    if(window.MutationObserver) new MutationObserver(sync).observe(seg, {subtree:true, attributes:true, attributeFilter:['aria-pressed']});
    document.addEventListener('click', function(){ setTimeout(sync, 0); });
    sync(); setTimeout(sync, 0);
  });
})();
</script>
