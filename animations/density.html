  .rowlab{font:11.5px var(--font-mono);color:var(--ink-faint);}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px;}

<script>
  // Visit counter (GoatCounter: no cookies, no personal data). Skipped when a page is embedded in a workout, so a visit counts once.
  // pwCountTab(tab, label): counts each workout tab once per visit as a GoatCounter event (path "page#tab"), skipped in frames the same way.
  (function(){
    var off = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var seen = {}, queue = [];
    function send(e){ try { window.goatcounter.count(e); } catch (x) {} }
    window.pwCountTab = function(tab, label){
      if (off || !tab || seen[tab]) return;
      seen[tab] = 1;
      var page = (location.pathname.split('/').pop() || 'index').replace(/\.html$/, '');
      var e = { path: page + '#' + tab, title: (label || tab) + ' · ' + document.title, event: true };
      if (window.goatcounter && window.goatcounter.count) send(e); else queue.push(e);
    };
    if (off) return;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://gc.zgo.at/count.js';
    s.setAttribute('data-goatcounter', 'https://physics-workout.goatcounter.com/count');
    s.onload = function(){ var q = queue; queue = []; q.forEach(send); };
    document.head.appendChild(s);
  })();
</script>

<script>
  // Draft tags and Alex's reviewer button (tools/review/drafts.py writes this block; edit tools/review/snippet.html, then run drafts.py sync).
  // A page is Draft while its row in tools/REVIEW.md is not ✅: <meta name="pw-draft"> on the page, data-draft on its list cards.
  // ?reviewer (once, on any page) turns on reviewer mode in this browser; ?reviewer=off turns it off.
  (function(){
    var on = false, embed = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var m = /[?&]reviewer(?:=([^&]*))?/.exec(location.search);
    on = !!m && m[1] !== 'off';
    try {
      if (m) { if (m[1] === 'off') localStorage.removeItem('pw-reviewer'); else localStorage.setItem('pw-reviewer', '1'); }
      else on = localStorage.getItem('pw-reviewer') === '1';
    } catch (e) {}
    var CSS = '.pw-draft{display:inline-block;vertical-align:middle;margin-left:10px;font:600 11.5px/1.4 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:0;color:var(--bad,#b42318);border:1px dashed currentColor;border-radius:5px;padding:1px 7px;white-space:nowrap}'
      + '.act-top .pw-draft{margin-left:auto;flex:none}.act-top .pw-draft~.cp-tag,.act-top .pw-draft~.ta-tag{margin-left:0}'
      + 'a[data-draft]{position:relative}.pw-draft.pw-corner{position:absolute;top:10px;right:10px;margin:0;background:var(--panel,#fff)}'
      + '.pw-check{display:inline-block;vertical-align:middle;margin-left:8px;font:600 13px/1.4 "IBM Plex Sans",system-ui,sans-serif;color:#fff;background:#1a7f37;border-radius:6px;padding:4px 10px;text-decoration:none;white-space:nowrap}'
      + '.pw-check:hover{background:#116329}.pw-check:focus-visible{outline:2px solid #1a7f37;outline-offset:2px}'
      + '.pw-reviewer{position:fixed;left:10px;bottom:10px;z-index:9999;font:500 12px/1.4 "IBM Plex Mono",ui-monospace,monospace;background:#1d2433;color:#fff;border-radius:6px;padding:4px 9px;opacity:.85}'
      + '.pw-reviewer a{color:#ffc83d}';
    function tag(){ var t = document.createElement('span'); t.className = 'pw-draft'; t.title = 'Not yet checked'; t.textContent = 'Draft'; return t; }
    function go(){
      var st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st);
      var meta = document.querySelector('meta[name="pw-draft"]'), h1 = document.querySelector('h1');
      if (meta && h1 && !embed) {
        h1.appendChild(tag());
        if (on) {
          var page = meta.getAttribute('content'), b = document.createElement('a');
          b.className = 'pw-check'; b.target = '_blank'; b.rel = 'noopener'; b.textContent = '✓ Checked';
          b.title = 'Opens a GitHub issue. Submit it and the Draft tag goes in a minute or two.';
          b.href = 'https://github.com/Skati1401/Physics-Workout/issues/new?title=' + encodeURIComponent('Checked: ' + page)
            + '&body=' + encodeURIComponent('Submit this issue to mark `' + page + '` as checked. The Draft tag goes in a minute or two, and the issue closes itself.');
          h1.appendChild(b);
        }
      }
      document.querySelectorAll('a[data-draft]').forEach(function(a){
        if (a.querySelector('.pw-draft')) return;
        var t = tag(), top = a.querySelector('.act-top');
        if (top) top.insertBefore(t, top.querySelector('.cp-tag,.ta-tag'));
        else { t.className += ' pw-corner'; a.appendChild(t); }
      });
      // No tag on a unit or theme heading (Alex, 12 Nov 2026): only the pages and their cards.
      if (on && !embed) {
        // Carry ?reviewer in every link to another page of the site, so reviewer mode survives
        // browsers that clear site storage (school Chromebooks) and pages cached from before.
        var carry = function(a){
          try {
            var u = new URL(a.href, location.href);
            if (u.origin !== location.origin || !/(\.html|\/)$/.test(u.pathname) || u.searchParams.has('reviewer')) return;
            u.searchParams.set('reviewer', ''); a.href = u.href.replace('reviewer=', 'reviewer');
          } catch (e) {}
        };
        document.querySelectorAll('a[href]').forEach(carry);
        ['click', 'auxclick', 'contextmenu'].forEach(function(ev){
          document.addEventListener(ev, function(e){ var a = e.target.closest && e.target.closest('a[href]'); if (a) carry(a); }, true);
        });
        var r = document.createElement('div'); r.className = 'pw-reviewer';
        r.innerHTML = 'Reviewer mode · <a href="' + location.pathname + '?reviewer=off">turn off</a>';
        document.body.appendChild(r);
      }
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
  })();
</script>

/* ================= Experiment kit (copy this block into an animation page's <script>) =================
   The reusable parts of an animation's Experiment mode, taken from animations/hookes-law.html:
   - expRun():     the run itself: step the independent variable up one interval at a time, then
                   (optionally) back down again, measuring at every step
   - expReading(): a reading with a small, fixed pattern of reading error, rounded to the instrument's
                   resolution, that never goes the wrong way
   - expTable():   the results table (sticky header, newest row highlighted, a column per run)
   - expCross(), expRing(), expKey(): SVG marks for plotted readings (× first run, ○ return run)
   The page keeps its own picture, physics, graph axes and notes. See tools/experiment-kit/README.md.
   Plain ES5 so it can sit inside any animation page's IIFE. */

// A fixed pattern of reading errors, in units of the instrument's resolution. Fixed (not random) so a
// teacher sees the same results as the class, and a re-run gives the same table.
var EXP_ERR = [0, 1, -1, 0, 2, -1, 1, -2, 0, 1, -1, 0, 1, -1, 2, 0, -1, 1, 0, -2, 1];
function expErr(i){ return EXP_ERR[((i % EXP_ERR.length) + EXP_ERR.length) % EXP_ERR.length]; }

// What the student reads off the instrument.
//   trueVal  the value the physics gives at this step
//   prevVal  the reading taken at the step before (or the start value)
//   res      the instrument's resolution (0.1 cm ruler, 0.05 mm vernier, 0.01 A ammeter, 1° protractor)
//   i        the step number (picks the error from the pattern)
//   scale    how big the error is, in resolutions (default 1; 0.5 for a fine instrument)
// The error is never more than a quarter of the change since the last reading, so a reading never
// goes the wrong way (an extension never falls as the load rises, a current never drops as V rises).
function expReading(trueVal, prevVal, res, i, scale){
  var gap = Math.abs(trueVal - prevVal);
  var err = i > 0 ? expErr(i) * Math.min(res * (scale == null ? 1 : scale), gap / 4) : 0;
  var r = Math.round((trueVal + err) / res) * res;
  var dp = Math.max(0, Math.ceil(-Math.log10(res) - 1e-9));
  return +r.toFixed(dp);
}

// The run. cfg = {
//   start: 0,                 value of the independent variable before the first step
//   max: 10,                  last value of the first run (the run stops there)
//   step: 1,                  the interval (the page can change it with setStep, which resets the run)
//   reverse: true,            allow a return run (unloading, turning the voltage back down)
//   measure: function(v, phase, prevReading){ return reading },   phase is 'up' or 'down'
//   onChange: function(run, what){}  what is 'up', 'down' or 'reset'
// }
// run.up and run.down are arrays of {v, r}. run.phase is 'up' until the first step back, then 'down'.
function expRun(cfg){
  var run = { up: [], down: [], phase: 'up', value: cfg.start || 0, peak: cfg.start || 0, step: cfg.step || 1 };
  var r6 = function(x){ return Math.round(x * 1e6) / 1e6; };
  run.upDone = function(){ return run.phase === 'down' || run.peak >= cfg.max - 1e-9; };
  run.downDone = function(){ return run.phase === 'down' && run.value <= (cfg.start || 0) + 1e-9; };
  run.last = function(){ var a = run.phase === 'down' && run.down.length ? run.down : run.up; return a[a.length - 1] || null; };
  run.stepUp = function(){
    if(run.phase !== 'up' || run.upDone()) return false;
    var prev = run.up.length ? run.up[run.up.length - 1].r : null;
    var v = r6(Math.min(cfg.max, run.value + run.step));
    run.value = run.peak = v;
    run.up.push({ v: v, r: cfg.measure(v, 'up', prev) });
    if(cfg.onChange) cfg.onChange(run, 'up');
    return true;
  };
  run.stepDown = function(){
    if(!cfg.reverse || run.value <= (cfg.start || 0) + 1e-9 || !run.up.length) return false;
    run.phase = 'down';
    var prev = run.down.length ? run.down[run.down.length - 1].r : run.up[run.up.length - 1].r;
    var v = r6(Math.max(cfg.start || 0, run.value - run.step));
    run.value = v;
    run.down.push({ v: v, r: cfg.measure(v, 'down', prev) });
    if(cfg.onChange) cfg.onChange(run, 'down');
    return true;
  };
  run.reset = function(){ run.up = []; run.down = []; run.phase = 'up'; run.value = run.peak = cfg.start || 0; if(cfg.onChange) cfg.onChange(run, 'reset'); };
  run.setStep = function(s){ run.step = s; run.reset(); };
  return run;
}

// The results table. cols = [{label:'Load (N)', key:'v', dp:0}, {label:'Extension loading (cm)', key:'up', dp:1}, ...]
// rows = [{v:1, up:1.6, down:''}, ...]. newKey/newV highlight the reading just taken (fades in).
// Wrap it in .rtable-wrap so a long table scrolls under its sticky header.
function expTable(el, cols, rows, newV){
  var fmt = function(x, dp){ return (x === '' || x == null) ? '' : (+x).toFixed(dp || 0); };
  var h = '<table class="rtable"><thead><tr>' + cols.map(function(c){ return '<th>' + c.label + '</th>'; }).join('') + '</tr></thead><tbody>';
  rows.forEach(function(row){
    h += '<tr' + (newV != null && row.v === newV ? ' class="new"' : '') + '>' + cols.map(function(c){ return '<td>' + fmt(row[c.key], c.dp) + '</td>'; }).join('') + '</tr>';
  });
  el.innerHTML = h + '</tbody></table>';
}

// Plotted readings, as SVG strings. Size 5 suits a 300px-wide graph.
function expCross(cx, cy, s){ s = s || 5; return '<path d="M' + (cx - s) + ',' + (cy - s) + ' L' + (cx + s) + ',' + (cy + s) + ' M' + (cx + s) + ',' + (cy - s) + ' L' + (cx - s) + ',' + (cy + s) + '" stroke="var(--ink)" stroke-width="2"/>'; }
function expRing(cx, cy, r){ return '<circle cx="' + cx + '" cy="' + cy + '" r="' + (r || 4.5) + '" fill="none" stroke="var(--accent)" stroke-width="2"/>'; }
// A two-line key in the bottom-right corner of a graph: expKey(rightX, bottomY, 'loading', 'unloading')
function expKey(x, y, upLabel, downLabel){
  return '<text x="' + x + '" y="' + (y - 14) + '" text-anchor="end" font-size="10.5" fill="var(--ink)">× ' + upLabel + '</text>' +
         '<text x="' + x + '" y="' + y + '" text-anchor="end" font-size="10.5" fill="var(--accent)">○ ' + downLabel + '</text>';
}
/* ================= end of Experiment kit ================= */

  // a ruler laid along a line from A to B (cm marks every s px), on the side given by the unit normal n
  function ruler(A, B, cm, n, op){

  // ================= IRREGULAR OBJECT =================
  function irrGeo(){
    var e=eur(), o=obj();

    G.hang=(e?G.rim:G.y0-G.k*100-8)-o.h/2-7;

  function objCentre(G){
    var o=obj(), start=[132,282-o.h/2], pan=[62,244-o.h/2], hang=[G.cx,G.hang];

    if(S===1) return lerp2(start,pan,ease(P),true);

      g+=pg([[G.cx+G.hw,G.spoutY-6],[G.cx+G.hw+46,G.spoutY+6],[G.cx+G.hw+44,G.spoutY+13],[G.cx+G.hw,G.spoutY+6]],'var(--steel-hi)',' opacity=".55"');

  // a close-up of the scale at the water level, read at eye level

  function scaleClose(b, lev, col, title, empty, emptyMsg){

  // a close-up of the ruler against the side being measured. The 0 mark is level with one end of the block; the other end
  // is drawn exactly on the millimetre mark it reads (L, to 0.1 cm), so there is one right reading.
  function ruleClose(b, L, name, m, show){
    var g=rect(b.bx+2,b.by+2,b.bw-4,b.bh-4,'var(--panel)',' stroke="var(--panel-border)" rx="10"');
    g+=txt(b.bx+b.bw/2,b.by+20,'Close-up: ruler along the '+name+' (cm)',{a:'middle',fs:13,c:'var(--ink)',w:600});
    var up=name==='height' && !narrow;                 // the height is read on an upright ruler
    var span=up?4:6, z=up ? Math.min(54,(b.bh-96)/(span+0.5)) : Math.min(54,(b.bw-30)/(span+0.5));
    // u runs along the ruler from its 0 mark (cm), v across it (px, away from the block)
    var th=up?76:64, rw=52;
    var ox=up ? b.bx+b.bw/2+(th-rw)/2 : b.bx+(b.bw-span*z)/2-2, oy=up ? b.by+b.bh-50 : b.by+b.bh/2+6+(th-rw)/2;
    var pt=function(u,v){ return up ? [ox+v, oy-u*z] : [ox+u*z, oy+v]; };
    var q=function(a,b2){ return [pt(a[0],a[1]), pt(b2[0],b2[1])]; };
    g+='<clipPath id="dn-rclip"><rect x="'+(b.bx+6)+'" y="'+(b.by+28)+'" width="'+(b.bw-12)+'" height="'+(b.bh-34)+'"/></clipPath><g clip-path="url(#dn-rclip)" opacity="'+show.toFixed(2)+'">';
    // the block, on the far side of the ruler's edge
    var e=' stroke="'+m.edge+'" stroke-width="1.4" stroke-linejoin="round"';
    g+=pg([pt(0,-th),pt(L,-th),pt(L,0),pt(0,0)],m.fill,e);
    var hi=q([0.08,-th+6],[L-0.08,-th+6]); g+=ln(hi[0][0],hi[0][1],hi[1][0],hi[1][1],'#fff',2,' stroke-linecap="round" opacity=".45"');
    // the ruler
    g+=pg([pt(-0.35,0),pt(span+0.2,0),pt(span+0.2,rw),pt(-0.35,rw)],'#fff6cf',' stroke="#b59a3a" stroke-width="1.2"');
    for(var i=0;i<=span*10;i++){
      var len=i%10===0?19:i%5===0?13:8, a=pt(i/10,0), c=pt(i/10,len);
      g+=ln(a[0],a[1],c[0],c[1],'#5c4a12',i%10===0?1.5:1);
      if(i%10===0){ var n=pt(i/10,up?33:36); g+=txt(n[0],n[1]+(up?5:0),i/10,{a:'middle',fs:15,c:'#3d300a',w:600}); }
    }
    // dashed sight lines from each end of the block across the ruler: read where the line meets the scale
    [0,L].forEach(function(u){ var a=pt(u,-th-8), c=pt(u,22); g+=ln(a[0],a[1],c[0],c[1],'var(--accent)',1.3,' stroke-dasharray="4 3"'); });
    g+='</g>';
    g+=txt(b.bx+b.bw/2,b.by+b.bh-12,'Read the '+name+' to the nearest 0.1 cm',{a:'middle',fs:12,c:'var(--ink-soft)'});
    return g;
  }

        eq2.innerHTML = full ? FR('ρ = [[m|V]]<br>ρ = [['+f1(mo)+'|'+Vr+']]<br>ρ = '+rho3(rr)+' g/cm³<br>ρ = '+kgm3(rr)+' kg/m³') : FR('ρ = [[m|V]]');
      } else {
        var R=E.irr, got=e ? R.c!=null : R.v2!=null;
        if(goal) n= goal.stage===1 ? 'Putting the '+o.name+' on the balance…' : goal.stage===2 ? (e?'Filling the eureka can until water runs out of the spout…':'Hanging the '+o.name+' on a thread above the water…') : 'Lowering the '+o.name+' gently into the water…';
        else if(R.m==null) n='Experiment: press <b>Weigh it</b> to put the '+o.name+' on the balance.';
        else if(e && !R.filled) n='m = '+f1(R.m)+' g. Now press <b>Fill the can</b>: fill it until water runs out of the spout, wait for the dripping to stop, then put an empty measuring cylinder under the spout.';
        else if(!e && R.v1==null) n='m = '+f1(R.m)+' g. Now press <b>Read V₁</b> to hang it above the water and read the level before.';
        else if(dep<1) n='<b>Drag</b> the '+o.name+' down into the water on its thread (or press <b>Lower it</b>). Lower it gently, so no water splashes out.';
        else if(!got) n='It is fully under water and not touching the sides. Press <b>'+(e?'Read the volume':'Read V₂')+'</b>, eye level with the bottom of the meniscus.';
        else n= e ? 'V = '+R.c+' cm³, so ρ = '+FR('[[m|V]]')+' = <b>'+rho3(R.m/R.c)+' g/cm³</b>. A few drops stay in the spout, so the volume collected can be a little low.' : 'V = V₂ − V₁ = '+(R.v2-R.v1)+' cm³, so ρ = '+FR('[[m|V]]')+' = <b>'+rho3(R.m/(R.v2-R.v1))+' g/cm³</b>.';
        var VV = got ? (e?R.c:R.v2-R.v1) : null;
        var t='<table class="rtable"><thead><tr><th style="text-align:left">Quantity</th><th>Reading</th></tr></thead><tbody>';
        var row=function(q,v){ return '<tr><td class="q">'+q+'</td><td>'+(v==null?'':v)+'</td></tr>'; };
        t+=row('Mass m (g)', R.m==null?null:f1(R.m));
        if(e) t+=row('Water collected (cm³)', R.c);
        else t+=row('Level before V₁ (cm³)', R.v1)+row('Level after V₂ (cm³)', R.v2)+row('Volume V (cm³)', VV==null?'?':VV);
        t+=row('Density ρ (g/cm³)', VV==null?'?':rho3(R.m/VV));
        $('#dn-table').innerHTML=t+'</tbody></table>';
        eq1.innerHTML = VV==null ? (e?'V = volume of water collected<br>V = ?':'V = V₂ − V₁<br>V = ?') : (e?'V = volume of water collected<br>V = '+VV+' cm³':'V = V₂ − V₁<br>V = '+R.v2+' − '+R.v1+'<br>V = '+VV+' cm³');
        eq2.innerHTML = VV==null ? FR('ρ = [[m|V]]<br>ρ = ?') : FR('ρ = [[m|V]]<br>ρ = [['+f1(R.m)+'|'+VV+']]<br>ρ = '+rho3(R.m/VV)+' g/cm³<br>ρ = '+kgm3(R.m/VV)+' kg/m³');
      }
    } else {
      var L=liq(), M=r1(liqMassTrue(vol)), ml=r1(M-CYL);
      if(!ex){
        n = vol<=0 ? 'The empty measuring cylinder on the balance: <b>'+f1(CYL)+' g</b>. Press Play to pour in '+L.name+'.' :
            (running ? 'Pouring in '+L.name+'… V = '+Math.round(vol)+' cm³, total mass '+f1(M)+' g.' :
            'Mass of liquid = '+f1(M)+' − '+f1(CYL)+' = '+f1(ml)+' g, so ρ = '+FR('[[m|V]]')+' = <b>'+rho3(ml/vol)+' g/cm³</b>.'+(vol>=100 && L.reveal?' That matches '+L.reveal+'.':''));
        var ok=vol>0;
        st=stat('Mass of liquid', ok?f1(ml)+' g':'?')+stat('Density ρ', ok?rho3(ml/vol)+' g/cm³':'?', true)+stat('In kg/m³', ok?kgm3(ml/vol):'?');
        eq1.innerHTML = ok ? 'mass of liquid = total mass − mass of cylinder<br>m = '+f1(M)+' − '+f1(CYL)+'<br>m = '+f1(ml)+' g' : 'mass of liquid = total mass − mass of cylinder';
        eq2.innerHTML = ok ? FR('ρ = [[m|V]]<br>ρ = [['+f1(ml)+'|'+Math.round(vol)+']]<br>ρ = '+rho3(ml/vol)+' g/cm³<br>ρ = '+kgm3(ml/vol)+' kg/m³') : FR('ρ = [[m|V]]');
      } else {
        var k2=E.rows.length, st2=+intSeg.value();
        if(goal) n='Pouring in '+st2+' cm³…';
        else if(!k2) n='Experiment: press <b>Weigh the empty cylinder</b> first. Then add '+L.name+' '+st2+' cm³ at a time and record the total mass each time.';
        else if(!liqDone()){ var lr=E.rows[k2-1]; n=(lr.v?lr.v+' cm³: ':'Empty cylinder: ')+'total mass '+f1(lr.m)+' g. Press <b>Add '+st2+' cm³</b>.'; }
        else { var f=liqFit(); n='A straight line, but not through the origin: it meets the mass axis at '+f1(f.c)+' g, the mass of the empty cylinder. Its gradient is the density: <b>'+rho3(f.m)+' g/cm³</b>.'+(L.reveal?' That matches '+L.reveal+'.':''); }
        expTable($('#dn-table'), [{label:'Volume (cm³)',key:'v',dp:0},{label:'Total mass (g)',key:'m',dp:1}], E.rows, E.fresh);
        if(liqDone()){
          var ff=liqFit(), a=r1(ff.c+ff.m*20), b=r1(ff.c+ff.m*100);
          eq1.innerHTML='intercept = mass of the empty cylinder<br>intercept = '+f1(ff.c)+' g';
          eq2.innerHTML=FR('ρ = gradient of the line<br>ρ = [[change in mass|change in volume]]<br>ρ = [['+f1(b)+' − '+f1(a)+'|100 − 20]]<br>ρ = [['+f1(b-a)+'|80]]<br>ρ = '+rho3((b-a)/80)+' g/cm³');
        } else { eq1.innerHTML='intercept = mass of the empty cylinder<br>intercept = ?'; eq2.innerHTML='ρ = gradient of the line of best fit<br>ρ = ?'; }
      }
    }
    note.innerHTML=n;
    $('#dn-stats').innerHTML=st;
  }

  // ---- what the main button does now
  function nextAction(){
    var p=part();
    if(!exp()) return running ? {label:'❚❚ Pause'} : {label:'▶ Play'};
    if(goal) return {label:'…', off:true};
    if(MEAS){
      if(p==='reg') return {label:'…', off:true};
      if(p==='irr'){
        var Rm=E.irr, em=eur();
        if(Rm.m==null) return {label:'▶ Weigh it', fn:function(){ go(1, 1.6, function(){ Rm.m=objMass(); }); }};
        if(em ? !Rm.filled : Rm.v1==null) return {label: em?'▶ Fill the can':'▶ Hang it above the water', fn:function(){ go(2, 1.6, function(){ Rm.filled=true; Rm.v1=V1; }); }};
        if(dep<1) return {label:'▶ Lower it', fn:function(){ dep0=dep; S=3; P=0; goal={stage:3, speed:1}; start(); }};
        return {label:'Done', off:true};
      }
      var nm=E.rows.length;
      if(!nm) return {label:'▶ Weigh the empty cylinder', fn:function(){ E.rows.push({v:0, m:measLiqMass(0)}); draw(); }};
      if(nm>=MEAS_V.length) return {label:'Done', off:true};
      return {label:'▶ Pour in some liquid', fn:function(){ goal={pour:MEAS_V[nm], onEnd:function(){ E.rows.push({v:MEAS_V[nm], m:measLiqMass(nm)}); }}; start(); }};
    }
    if(p==='reg'){ var k=E.rows.length; return k<5 ? {label:'▶ Measure block '+(k+1), fn:measureBlock} : {label:'Done', off:true}; }
    if(p==='irr'){
      var R=E.irr, e=eur();
      if(R.m==null) return {label:'▶ Weigh it', fn:function(){ go(1, 1.6, function(){ R.m=objMass(); }); }};
      if(e && !R.filled) return {label:'▶ Fill the can', fn:function(){ go(2, 1.6, function(){ R.filled=true; }); }};
      if(!e && R.v1==null) return {label:'▶ Read V₁', fn:function(){ go(2, 1.6, function(){ R.v1=Math.round(irrWater().level); }); }};
      if(dep<1) return {label:'▶ Lower it', fn:function(){ dep0=dep; S=3; P=0; goal={stage:3, speed:1}; start(); }};
      var got=e ? R.c!=null : R.v2!=null;
      if(!got) return {label: e?'▶ Read the volume':'▶ Read V₂', fn:function(){ var lv=Math.round(irrWater().level); if(e) R.c=lv; else R.v2=lv; draw(); }};
      return {label:'Done', off:true};
    }
    if(!E.rows.length) return {label:'▶ Weigh the empty cylinder', fn:function(){ E.rows.push({v:0, m:CYL}); E.fresh=0; draw(); }};
    if(liqDone()) return {label:'Done', off:true};
    return {label:'▶ Add '+intSeg.value()+' cm³', fn:function(){ var to=Math.min(100, vol+(+intSeg.value())); goal={pour:to, onEnd:function(){ E.run.stepUp(); }}; start(); }};
  }
  function buttons(){
    var a=nextAction();
    playBtn.innerHTML=a.label.replace('▶','&#9654;'); playBtn.disabled=!!a.off;
  }
  function measureBlock(){
    E.blk=E.rows.length; S=0; P=1; hold=0;
    go(4, 2.6, function(){
      var i=E.blk, d=blockRead(i);
      E.rows.push({n:i+1, l:d[0], w:d[1], h:d[2], V:r1(d[0]*d[1]*d[2]), m:blockMass(i)}); E.fresh=i+1;
    });
  }
  // move through the stages up to `stage`, then call onEnd
  function go(stage, speed, onEnd){
    goal={stage:stage, speed:speed, onEnd:onEnd};
    if(S>=stage && P>=1){ finish(); return; }
    if(P>=1){ S++; P=0; if(part()==='irr' && S===3) dep0=dep; }
    start();
  }
  function finish(){ var g=goal; goal=null; stop(); if(g && g.onEnd) g.onEnd(); draw(); }

  function tick(dt){
    var p=part(), sp=(goal&&goal.speed)||1;
    if(p==='liq'){
      var to = goal ? goal.pour : 100, rate = goal ? 30 : 12;
      vol=Math.min(to, vol+dt*rate);
      if(vol>=to-1e-9){ vol=to; if(goal) finish(); else { stop(); } }
      return;
    }
    if(P<1){
      P=Math.min(1, P+dt*sp/DUR[p][S]);
      if(p==='irr' && S===3) dep=dep0+(1-dep0)*ease(P);
      return;
    }
    var target = goal ? goal.stage : LAST[p];
    if(S<target){ hold+=dt*sp; if(hold>=0.5){ hold=0; S++; P=0; if(p==='irr' && S===3) dep0=dep; } return; }
    if(goal) finish(); else stop();
  }
  function frame(now){
    var dt=Math.min(0.05,(now-last)/1000)*(slowOn()?0.3:1); last=now;
    tick(dt);
    draw();
    if(running) rafId=requestAnimationFrame(frame);
  }
  function start(){ running=true; cancelAnimationFrame(rafId); last=performance.now(); rafId=requestAnimationFrame(frame); jumpSeg.pick(null); draw(); }
  function stop(){ running=false; cancelAnimationFrame(rafId); }

  function play(){
    if(running){ stop(); draw(); return; }
    var p=part();
    if(p==='liq'){ if(vol>=100) vol=0; start(); return; }
    if(S>=LAST[p] && P>=1){ S=0; P=1; dep=0; }
    if(P>=1 && S<LAST[p] && !(p==='irr' && S===2 && dep>0)){ S++; P=0; if(p==='irr' && S===3) dep0=dep; }
    else if(p==='irr' && S===2 && P>=1){ S=3; P=0; dep0=dep; }
    start();
  }
  function jump(k){
    stop(); goal=null; hold=0;
    var p=part();
    if(p==='liq'){ vol=k; draw(); jumpSeg.pick(String(k)); return; }
    S=k; P=1; dep = (p==='irr' && k===3) ? 1 : 0;
    draw(); jumpSeg.pick(String(k));
  }
  function setJumps(){
    var p=part(), J = p==='reg' ? [[0,'Start'],[1,'Weighed'],[4,'Measured']] : p==='irr' ? [[0,'Start'],[1,'Weighed'],[2,'Before'],[3,'Lowered']] : [[0,'Empty'],[50,'50 cm³'],[100,'100 cm³']];
    $('#dn-jump').innerHTML=J.map(function(j){ return '<button type="button" data-v="'+j[0]+'" aria-pressed="false">'+j[1]+'</button>'; }).join('');
  }
  function clearAll(){
    stop(); goal=null; S=0; P=1; hold=0; dep=0; dep0=0; vol=0;
    E={rows:[], blk:null, fresh:null, irr:{m:null, v1:null, v2:null, c:null, filled:false}};
    E.run=expRun({start:0, max:100, step:+intSeg.value(), measure:function(v, ph, prev){
      var i=E.rows.length, r=expReading(liqMassTrue(v), prev==null?CYL:prev, 0.1, i, 4);
      E.rows.push({v:v, m:r}); E.fresh=v; return r; }});
    jumpSeg.pick(null);
    if(MEAS && part()==='reg'){ E.blk=0; S=2; blkSeg.pick('0'); sideSeg.pick('2'); }
    draw();
  }
  function setRows(){
    var p=part(), ex=exp();
    $('#dn-matlab').hidden=$('#dn-mat').hidden=p!=='reg';
    $('#dn-objlab').hidden=$('#dn-obj').hidden=$('#dn-methlab').hidden=$('#dn-meth').hidden=p!=='irr';
    $('#dn-liqlab').hidden=$('#dn-liq').hidden=p!=='liq';
    $('#dn-intlab').hidden=$('#dn-int').hidden=!(p==='liq' && ex);
    $('#dn-jlab').hidden=$('#dn-jump').hidden=ex;
    $('#dn-clear').hidden=!ex; $('#dn-tablewrap').hidden=!ex; $('#dn-stats').hidden=ex;
    $('#dn-slow').hidden=false;
    if(MEAS){
      ['#dn-matlab','#dn-mat','#dn-objlab','#dn-obj','#dn-methlab','#dn-meth','#dn-liqlab','#dn-liq','#dn-intlab','#dn-int','#dn-jlab','#dn-jump'].forEach(function(q){ $(q).hidden=true; });
      $('#dn-mrow').hidden=p!=='reg'; $('#dn-btns').hidden=p==='reg';
    }
    svg.setAttribute('aria-label', MEAS ? (p==='reg' ? 'A rectangular block on a top-pan balance, with a ruler along one side. On the right, the balance display and a close-up of the ruler to read.'
      : p==='irr' ? 'An irregular object, a top-pan balance and '+(eur()?'a eureka can with a measuring cylinder under its spout.':'a measuring cylinder of water.')+' On the right, the balance display and a close-up of the scale to read.'
      : 'A measuring cylinder on a top-pan balance, with liquid poured in. On the right, the balance display and a close-up of the scale to read.')
      : p==='reg' ? 'A rectangular block on a top-pan balance, measured with a ruler. A graph of mass against volume is on the right.'
      : p==='irr' ? 'An irregular object, weighed on a balance, then lowered on a thread into '+(eur()?'a eureka can, with the water it pushes out collected in a measuring cylinder.':'a measuring cylinder of water.')+' A close-up of the scale is on the right.'
      : 'A measuring cylinder on a top-pan balance, with liquid poured in. A graph of total mass against volume is on the right.');
    if(p==='irr'){ svg.setAttribute('tabindex','0'); } else svg.removeAttribute('tabindex');
  }
  function setPart(){ setRows(); setJumps(); clearAll(); }

  // ---- drag the object down into the water (pointer), or ↑ ↓ when the picture has focus
  function canDrag(){
    if(part()!=='irr' || running || goal) return false;
    if(exp()){ var R=E.irr; if(R.m==null || (eur()? !R.filled : R.v1==null)) return false; if(eur()? R.c!=null : R.v2!=null) return false; return true; }
    return S>=2;
  }
  function setDep(v){
    v=Math.max(0, Math.min(1, v));
    dep=v; P=1;
    S = dep>=0.999 ? 3 : 2; if(S===3) dep=1;
    jumpSeg.pick(null); draw();
  }
  function svgPt(e){ var pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); }
  var grab=null;
  svg.addEventListener('pointerdown', function(e){
    if(!canDrag()) return;
    var q=svgPt(e), G=irrGeo(), o=obj(), c=objCentre(G);
    if(Math.abs((q.x-OFF.x)/SC-c[0])>o.w/2+14 || Math.abs((q.y-OFF.y)/SC-c[1])>o.h/2+14) return;
    grab={y:q.y, d:dep, span:(G.low-G.hang)*SC}; svg.setPointerCapture(e.pointerId); svg.classList.add('dragging'); e.preventDefault();
  });
  svg.addEventListener('pointermove', function(e){ if(!grab) return; var q=svgPt(e); setDep(grab.d+(q.y-grab.y)/grab.span); });
  function endGrab(){ if(!grab) return; grab=null; svg.classList.remove('dragging'); draw(); }
  svg.addEventListener('pointerup', endGrab); svg.addEventListener('pointercancel', endGrab);
  svg.addEventListener('keydown', function(e){
    if(!canDrag()) return;
    var v=null;
    if(e.key==='ArrowDown') v=dep+0.1; else if(e.key==='ArrowUp') v=dep-0.1; else if(e.key==='End') v=1; else if(e.key==='Home') v=0;
    if(v!==null){ setDep(Math.round(v*10)/10); e.preventDefault(); }
  });

  playBtn.addEventListener('click', function(){ var a=nextAction(); if(a.off) return; if(exp()) a.fn(); else play(); });
  slowBtn.addEventListener('click', function(){ slowBtn.setAttribute('aria-pressed', String(!slowOn())); draw(); });
  expBtn.addEventListener('click', function(){ expBtn.setAttribute('aria-pressed', String(!exp())); setRows(); clearAll(); });
  $('#dn-reset').addEventListener('click', clearAll);
  $('#dn-clear').addEventListener('click', clearAll);
  window.addEventListener('resize', function(){ var was=narrow; layout(); if(was!==narrow) draw(); });

  watchEquals($('#dn-eq1')); watchEquals($('#dn-eq2'));
  setPart();
})();
</script><script id="choice-kit-js">
/* Choice kit (12 Nov 2026): the same block on every animation page. See tools/ANIMATION-STYLE.md, "Choices".
   A group of choices with one chosen gets a track round it (class pick); a .to-q button opens the questions from Explore. */
(function(){
  function on(b){ return b.getAttribute('aria-pressed')==='true' || b.classList.contains('is-on'); }
  function each(sel, fn){ Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }
  function mark(s){
    if(!s.classList.contains('pick')){
      var n=0; Array.prototype.forEach.call(s.children, function(b){ if(b.tagName==='BUTTON' && on(b)) n++; });
      if(n===1) s.classList.add('pick');
    }
    if(s.classList.contains('pick') && !s.hasAttribute('data-fit')){
      var d=getComputedStyle(s).display;
      if(d!=='none'){ s.setAttribute('data-fit','1'); if(d.indexOf('flex')>=0) s.classList.add('fit'); }
    }
  }
  each('.seg:not(.tabs):not(.mode):not(.apps)', function(s){
    mark(s);
    if(window.MutationObserver) new MutationObserver(function(){ mark(s); }).observe(s, {childList:true, subtree:true, attributes:true, attributeFilter:['aria-pressed','class']});
  });
  // Choice rows: wrap each .rowlab and the control after it in a .cgroup (label above, groups side by side).
  // A group is hidden when everything in it is hidden, so pages that hide a row's label and control still work.
  function shown(e){ return !e.hidden && e.style.display!=='none'; }
  each('.cgrid:not(.kit)', function(g){
    var kids=Array.prototype.slice.call(g.children), groups=[];
    for(var i=0;i<kids.length;i++){
      var w=document.createElement('div'); w.className='cgroup';
      g.insertBefore(w, kids[i]); w.appendChild(kids[i]);
      if(kids[i].classList.contains('rowlab') && kids[i+1]){ w.appendChild(kids[i+1]); i++; }
      groups.push(w);
    }
    g.classList.add('kit'); if(groups.length===1) g.classList.add('one');
    groups.forEach(function(w){
      function sync(){ var any=false; Array.prototype.forEach.call(w.children, function(c){ if(shown(c)) any=true; }); w.hidden=!any; }
      sync();
      if(window.MutationObserver) Array.prototype.forEach.call(w.children, function(c){ new MutationObserver(sync).observe(c, {attributes:true, attributeFilter:['hidden','style']}); });
    });
  });
  each('.to-q[data-mode]', function(b){
    var seg=document.getElementById(b.getAttribute('data-mode')); if(!seg) return;
    var bs=seg.querySelectorAll('button');
    function sync(){ b.hidden=!on(bs[0]) || !seg.getClientRects().length; }   // hidden too when the page hides its mode switch (e.g. at a level with no questions)
    b.addEventListener('click', function(){ bs[1].click(); bs[1].focus(); });
    if(window.MutationObserver) new MutationObserver(sync).observe(seg, {subtree:true, attributes:true, attributeFilter:['aria-pressed']});
    document.addEventListener('click', function(){ setTimeout(sync, 0); });
    sync(); setTimeout(sync, 0);
  });
})();
