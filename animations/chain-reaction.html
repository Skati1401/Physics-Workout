<style>
  :root{
    --bg:#eef1f5; --bg-grid:rgba(29,41,61,0.055);
    --panel:#ffffff; --panel-border:#d7dce4;
    --ink:#182233; --ink-soft:#4c5668; --ink-faint:#8993a5;
    --accent:#d9720c; --accent-soft:#fdead2;
    --good:#15803d; --good-soft:#dcf5e3;
    --bad:#c0311a; --bad-soft:#fbe1db;
    --shadow:0 10px 26px -14px rgba(24,34,51,0.28);
    --topic:#4d7c0f;   --topic-soft:#e6f3d3;
    --fast:#d23b3b;    --slow:#2f62d6;
    --fuel:#7fae2a;    --fuel-edge:#4d7c0f;
    --rod:#3b4150;     --rod-edge:#1f2430;
    --graphite:#d9dce2; --graphite-line:#b9bec8;
    --water:#d6e8fb;   --water-line:#a9c9ef;
    --frag:#d9720c;
    --font-display:'Big Shoulders',system-ui,sans-serif;
    --font-body:'IBM Plex Sans',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12161f; --bg-grid:rgba(255,255,255,0.045);
      --panel:#1b212e; --panel-border:#2c3444;
      --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;
      --accent:#ff9a3d; --accent-soft:#3a2712;
      --good:#4ade80; --good-soft:#123321;
      --bad:#f27159; --bad-soft:#3a1712;
      --shadow:0 14px 30px -14px rgba(0,0,0,0.55);
      --topic:#a3d65c; --topic-soft:#1f2e12;
      --fast:#ff7a7a; --slow:#7da3ff;
      --fuel:#6f9a2a; --fuel-edge:#a3d65c;
      --rod:#8a91a0; --rod-edge:#c3c8d2;
      --graphite:#2a303c; --graphite-line:#3a4250;
      --water:#16263c; --water-line:#24406a;
      --frag:#ff9a3d;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12161f; --bg-grid:rgba(255,255,255,0.045);
    --panel:#1b212e; --panel-border:#2c3444;
    --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;
    --accent:#ff9a3d; --accent-soft:#3a2712;
    --good:#4ade80; --good-soft:#123321;
    --bad:#f27159; --bad-soft:#3a1712;
    --shadow:0 14px 30px -14px rgba(0,0,0,0.55);
    --topic:#a3d65c; --topic-soft:#1f2e12;
    --fast:#ff7a7a; --slow:#7da3ff;
    --fuel:#6f9a2a; --fuel-edge:#a3d65c;
    --rod:#8a91a0; --rod-edge:#c3c8d2;
    --graphite:#2a303c; --graphite-line:#3a4250;
    --water:#16263c; --water-line:#24406a;
    --frag:#ff9a3d;
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      linear-gradient(var(--bg-grid) 1px,transparent 1px) 0 0/100% 34px,
      linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px) 0 0/34px 100%,
      var(--bg);
    color:var(--ink); font-family:var(--font-body); font-size:14px; -webkit-font-smoothing:antialiased;
  }
  [hidden]{display:none!important;}
  button{font:inherit;color:inherit;}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;}

  .page{max-width:1400px;margin-inline:auto;padding-inline:20px;padding-block:12px 40px;}
  h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:0.2px;text-wrap:balance;margin:0;}
  p{margin:0;line-height:1.55;}

  .home-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-bottom:4px;font:600 13px var(--font-mono);color:var(--ink-soft);text-decoration:none;}
  .home-link:hover{color:var(--accent);}
  .page-head{margin-bottom:12px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px;}
  .eyebrow{font-family:var(--font-mono);font-size:11.5px;color:var(--accent);font-weight:600;margin-bottom:6px;}
  .page-head h1{font-size:clamp(28px,5vw,38px);color:var(--ink);}

  .card{background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;box-shadow:var(--shadow);}
  .btn{
    font-family:var(--font-body);font-weight:600;font-size:13.5px;color:var(--ink);
    background:var(--panel);border:1px solid var(--panel-border);border-radius:9px;
    padding:9px 15px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  }
  .btn:hover{border-color:var(--ink-faint);}
  .btn:disabled{opacity:.45;cursor:default;}
  .btn-primary{background:var(--ink);border-color:var(--ink);color:var(--bg);}
  .btn-primary:hover{opacity:.88;border-color:var(--ink);}
  .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);}
  .btn-group{display:flex;flex-wrap:wrap;gap:10px;}

  /* picture on the left with its buttons under it; choices, readings and working on the right */
  .stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,410px);gap:18px 24px;align-items:start;padding:18px;}
  @media (max-width:860px){ .stage{grid-template-columns:minmax(0,1fr);} }
  .view{display:block;width:100%;height:auto;max-height:max(260px,calc(100vh - 290px));touch-action:pan-y;}
  .view text{font-family:var(--font-mono);}
  .under{display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px;margin-top:12px;}
  .under .rtable-wrap{flex:1 1 300px;}
  .side{display:flex;flex-direction:column;gap:12px;min-width:0;}
  .lab{display:block;font:12.5px var(--font-mono);color:var(--ink-soft);margin-bottom:2px;}
  .lab output{color:var(--ink);font-weight:600;white-space:nowrap;margin-left:6px;}
  input[type=range]{width:100%;accent-color:var(--topic);min-height:28px;}
  .seg{display:flex;flex-wrap:wrap;gap:6px;}
  .seg button{font:12.5px var(--font-mono);padding:8px 11px;min-height:44px;border:1px solid var(--panel-border);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer;}
  .seg button[aria-pressed="true"]{background:var(--topic);border-color:var(--topic);color:var(--panel);}
  .seg button:disabled{opacity:.45;cursor:default;}
  .cgrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center;}
  .rowlab{font:11.5px var(--font-mono);color:var(--ink-faint);}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px;}
  .stat{border:1px solid var(--panel-border);border-radius:8px;padding:5px 8px;display:flex;flex-direction:column;justify-content:space-between;}
  .stat small{display:block;font:10.5px var(--font-mono);color:var(--ink-faint);}
  .stat strong{font:600 15px var(--font-mono);color:var(--ink);white-space:nowrap;}
  .stat.hi strong{color:var(--topic);}
  .note{font-size:15px;line-height:1.5;color:var(--ink);padding:10px 12px;border-radius:8px;background:var(--bg);min-height:4.6em;}
  .note b{color:var(--topic);}
  .tf,.note b.tf{color:var(--fast);font-weight:600;} .ts,.note b.ts{color:var(--slow);font-weight:600;}

  details.working summary{cursor:pointer;font:600 13px var(--font-mono);color:var(--topic);min-height:44px;display:flex;align-items:center;}
  .eq{font-family:var(--font-mono);font-size:14px;line-height:1.75;padding:8px 12px;border-left:3px solid var(--topic);background:var(--topic-soft);border-radius:6px;color:var(--ink);}
  .eq b{color:var(--topic);}
  .eq + .eq{margin-top:8px;}
  .eqnote{font-size:13.5px;color:var(--ink-soft);margin-top:8px;}
  .eqg{display:grid;grid-template-columns:auto auto minmax(0,1fr);column-gap:.45em;row-gap:.2em;align-items:center}
  .eqg-l{justify-self:end;text-align:right}
  .eqg-m{justify-self:center}
  .eqg-r{justify-self:start;min-width:0}
  .eqg-full{grid-column:1/-1}
  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1.25;}
  .frac>span{padding:0 .25em;white-space:nowrap;}
  .frac>span:first-child{border-bottom:1.5px solid currentColor;}
  @media (max-width:560px){ .stage{padding:12px;} .view{max-height:none;} .eq{font-size:12px;padding:6px 8px;} .note{font-size:14px;} }

  /* the control rods can be dragged up and down in the picture */
  #cr-rods{cursor:grab;}
  #cr-rods.dragging{cursor:grabbing;}
  #cr-rods:focus{outline:none;}
  #cr-rods:focus-visible .rod-hit{stroke:var(--accent);stroke-width:3;}

  /* ===== Experiment kit (tools/experiment-kit/kit.css) ===== */
  .rtable{width:100%;border-collapse:collapse;font:12.5px var(--font-mono);}
  .rtable th{position:sticky;top:0;background:var(--panel);font-weight:600;font-size:11px;color:var(--ink-faint);text-align:right;padding:4px 6px;border-bottom:1px solid var(--panel-border);}
  .rtable td{text-align:right;padding:3px 6px;border-bottom:1px solid var(--panel-border);color:var(--ink);}
  .rtable tr.new td{background:var(--cs, var(--accent-soft));}
  .rtable-wrap{max-height:92px;overflow:auto;border:1px solid var(--panel-border);border-radius:8px;}
  @media (prefers-reduced-motion: no-preference){ .rtable tr.new td{animation:rowin .35s ease-out;} }
  @keyframes rowin{from{opacity:0}to{opacity:1}}
  /* ===== end of Experiment kit ===== */

  /* inside a workout tab (?embed): no page heading, no outer margins */
  .embed body{background:transparent;}
  .embed .page{padding:0;max-width:none;display:flow-root;}
  .embed .home-link,.embed .page-head{display:none;}
  .embed .view{max-height:460px;}
  .stage.has-runs .view{max-height:max(240px,calc(100vh - 340px));}
</style>

<script>
  // Visit counter (GoatCounter: no cookies, no personal data). Skipped when a page is embedded in a workout, so a visit counts once.
  // pwCountTab(tab, label): counts each workout tab once per visit as a GoatCounter event (path "page#tab"), skipped in frames the same way.
  (function(){
    var off = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var seen = {}, queue = [];
    function send(e){ try { window.goatcounter.count(e); } catch (x) {} }
    window.pwCountTab = function(tab, label){
      if (off || !tab || seen[tab]) return;
      seen[tab] = 1;
      var page = (location.pathname.split('/').pop() || 'index').replace(/\.html$/, '');
      var e = { path: page + '#' + tab, title: (label || tab) + ' · ' + document.title, event: true };
      if (window.goatcounter && window.goatcounter.count) send(e); else queue.push(e);
    };
    if (off) return;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://gc.zgo.at/count.js';
    s.setAttribute('data-goatcounter', 'https://physics-workout.goatcounter.com/count');
    s.onload = function(){ var q = queue; queue = []; q.forEach(send); };
    document.head.appendChild(s);
  })();
</script>

<script>
  // Draft tags and Alex's reviewer button (tools/review/drafts.py writes this block; edit tools/review/snippet.html, then run drafts.py sync).
  // A page is Draft while its row in tools/REVIEW.md is not ✅: <meta name="pw-draft"> on the page, data-draft on its list cards.
  // ?reviewer (once, on any page) turns on reviewer mode in this browser; ?reviewer=off turns it off.
  (function(){
    var on = false, embed = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var m = /[?&]reviewer(?:=([^&]*))?/.exec(location.search);
    on = !!m && m[1] !== 'off';
    try {
      if (m) { if (m[1] === 'off') localStorage.removeItem('pw-reviewer'); else localStorage.setItem('pw-reviewer', '1'); }
      else on = localStorage.getItem('pw-reviewer') === '1';
    } catch (e) {}
    var CSS = '.pw-draft{display:inline-block;vertical-align:middle;margin-left:10px;font:600 11.5px/1.4 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:0;color:var(--bad,#b42318);border:1px dashed currentColor;border-radius:5px;padding:1px 7px;white-space:nowrap}'
      + '.act-top .pw-draft{margin-left:auto;flex:none}.act-top .pw-draft~.cp-tag,.act-top .pw-draft~.ta-tag{margin-left:0}'
      + 'a[data-draft]{position:relative}.pw-draft.pw-corner{position:absolute;top:10px;right:10px;margin:0;background:var(--panel,#fff)}'
      + 'summary .pw-draft{margin-left:0;flex:none}'
      + '.pw-check{display:inline-block;vertical-align:middle;margin-left:8px;font:600 13px/1.4 "IBM Plex Sans",system-ui,sans-serif;color:#fff;background:#1a7f37;border-radius:6px;padding:4px 10px;text-decoration:none;white-space:nowrap}'
      + '.pw-check:hover{background:#116329}.pw-check:focus-visible{outline:2px solid #1a7f37;outline-offset:2px}'
      + '.pw-reviewer{position:fixed;left:10px;bottom:10px;z-index:9999;font:500 12px/1.4 "IBM Plex Mono",ui-monospace,monospace;background:#1d2433;color:#fff;border-radius:6px;padding:4px 9px;opacity:.85}'
      + '.pw-reviewer a{color:#ffc83d}';
    function tag(){ var t = document.createElement('span'); t.className = 'pw-draft'; t.title = 'Not yet checked'; t.textContent = 'Draft'; return t; }
    function go(){
      var st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st);
      var meta = document.querySelector('meta[name="pw-draft"]'), h1 = document.querySelector('h1');
      if (meta && h1 && !embed) {
        h1.appendChild(tag());
        if (on) {
          var page = meta.getAttribute('content'), b = document.createElement('a');
          b.className = 'pw-check'; b.target = '_blank'; b.rel = 'noopener'; b.textContent = '✓ Checked';
          b.title = 'Opens a GitHub issue. Submit it and the Draft tag goes in a minute or two.';
          b.href = 'https://github.com/Skati1401/Physics-Workout/issues/new?title=' + encodeURIComponent('Checked: ' + page)
            + '&body=' + encodeURIComponent('Submit this issue to mark `' + page + '` as checked. The Draft tag goes in a minute or two, and the issue closes itself.');
          h1.appendChild(b);
        }
      }
      document.querySelectorAll('a[data-draft]').forEach(function(a){
        if (a.querySelector('.pw-draft')) return;
        var t = tag(), top = a.querySelector('.act-top');
        if (top) top.insertBefore(t, top.querySelector('.cp-tag,.ta-tag'));
        else { t.className += ' pw-corner'; a.appendChild(t); }
      });
      document.querySelectorAll('details.unit').forEach(function(d){
        var s = d.querySelector('summary');
        if (!s || s.querySelector('.pw-draft') || !d.querySelector('a[data-draft]')) return;
        var h2 = s.querySelector('h2'); if (h2) h2.parentNode.insertBefore(tag(), h2.nextSibling); else s.appendChild(tag());
      });
      if (on && !embed) {
        // Carry ?reviewer in every link to another page of the site, so reviewer mode survives
        // browsers that clear site storage (school Chromebooks) and pages cached from before.
        var carry = function(a){
          try {
            var u = new URL(a.href, location.href);
            if (u.origin !== location.origin || !/(\.html|\/)$/.test(u.pathname) || u.searchParams.has('reviewer')) return;
            u.searchParams.set('reviewer', ''); a.href = u.href.replace('reviewer=', 'reviewer');
          } catch (e) {}
        };
        document.querySelectorAll('a[href]').forEach(carry);
        ['click', 'auxclick', 'contextmenu'].forEach(function(ev){
          document.addEventListener(ev, function(e){ var a = e.target.closest && e.target.closest('a[href]'); if (a) carry(a); }, true);
        });
        var r = document.createElement('div'); r.className = 'pw-reviewer';
        r.innerHTML = 'Reviewer mode · <a href="' + location.pathname + '?reviewer=off">turn off</a>';
        document.body.appendChild(r);
      }
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
  })();
</script>

<body>
<div class="page" id="page">
  <a class="home-link" href="ial.html">&larr; IAL animations</a>
  <header class="page-head">
    <div>
      <div class="eyebrow">Animations &middot; nuclear fission</div>
      <h1>Chain Reaction in a Nuclear Reactor</h1>
    </div>
  </header>

  <section class="card stage">
    <div>
      <svg class="view" id="cr-svg" viewBox="0 0 600 322" role="img" aria-label="A nuclear reactor core with uranium-235 fuel rods, a moderator and boron control rods, with neutrons causing fissions, beside a graph of the number of fissions in each generation"><g id="cr-core"></g><g id="cr-rods" tabindex="0" role="slider" aria-label="Control rods: drag up or down, or use the arrow keys" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" aria-valuetext="50% in"></g><g id="cr-n"></g><g id="cr-graph"></g></svg>
      <div class="under">
        <div class="btn-group">
          <button class="btn btn-primary" id="cr-play" type="button">&#9654; Play</button>
          <button class="btn" id="cr-reset" type="button">&#8634; Reset</button>
          <button class="btn" id="cr-slow" type="button" aria-pressed="false">Slow motion</button>
          <button class="btn" id="cr-exp" type="button" aria-pressed="false" title="Hide k: find the control-rod position that keeps the chain steady from your own runs">Experiment</button>
        </div>
        <div class="rtable-wrap" id="cr-runs-wrap" hidden>
          <table class="rtable" aria-label="Your runs">
            <thead><tr><th>Run</th><th>Fuel</th><th>Rods in</th><th>k from graph</th><th>Chain</th></tr></thead>
            <tbody id="cr-runs"></tbody>
          </table>
        </div>
      </div>
    </div>
    <div class="side">
      <div class="cgrid">
        <span class="rowlab">Fuel</span>
        <div class="seg" id="cr-fuel"><button type="button" data-v="new" aria-pressed="true">New fuel</button><button type="button" data-v="used" aria-pressed="false" title="Some of the U-235 has already been used up">Used fuel</button></div>
        <span class="rowlab">Moderator</span>
        <div class="seg" id="cr-mod"><button type="button" data-v="graphite" aria-pressed="true">Graphite</button><button type="button" data-v="water" aria-pressed="false">Water</button><button type="button" data-v="none" aria-pressed="false">Removed</button></div>
        <span class="rowlab">Rods</span>
        <div class="seg" id="cr-preset"><button type="button" data-v="0" aria-pressed="false">All out</button><button type="button" data-v="crit" aria-pressed="false" id="cr-crit">Steady</button><button type="button" data-v="100" aria-pressed="false">All in</button></div>
      </div>
      <div>
        <label class="lab" for="cr-f">Control rods lowered into the core <output id="cr-f-out">50%</output></label>
        <input type="range" id="cr-f" min="0" max="100" step="5" value="50">
      </div>
      <p class="note" id="cr-note" aria-live="polite"></p>
      <div class="stats">
        <div class="stat"><small>Generation</small><strong id="cr-g">0</strong></div>
        <div class="stat"><small>Fissions</small><strong id="cr-fis">20</strong></div>
        <div class="stat"><small>Neutrons</small><strong id="cr-nn">0</strong></div>
        <div class="stat hi" id="cr-k-box"><small>k</small><strong id="cr-k">1.00</strong></div>
      </div>
      <details class="working">
        <summary>Show working</summary>
        <div class="eq" id="cr-eq1"></div>
        <div class="eq" id="cr-eq2"></div>
        <p class="eqnote" id="cr-eq3"></p>
      </details>
    </div>
  </section>
</div>
<script>
// Which list this page was opened from: ?level=igcse, ial or ib sets the back link (and, on two-level pages, the starting level).
var PW_LEVEL=(location.search.match(/[?&]level=(igcse|ial|ib)\b/)||[])[1]||(/[?&]from=alevel\b/.test(location.search)?'ial':'');
(function(){
  var hl=document.querySelector('.home-link'); if(!hl) return;
  var lv=PW_LEVEL;
  if(!lv && /ial\.html/.test(hl.getAttribute('href'))){ try{ if(localStorage.getItem('pw-symbols')==='ib') lv='ib'; }catch(e){} }
  var L={igcse:['igcse.html','IGCSE animations'],ial:['ial.html','IAL animations'],ib:['ib.html','IB animations']}[lv];
  if(L){ hl.href=L[0]; hl.innerHTML='&larr; '+L[1]; }
})();
(function(){
  // This page is the one copy of this animation. With ?embed it drops its heading so a workout tab
  // can show it in a frame, and it tells that page its height.
  var EMBED = /[?&]embed\b/.test(location.search);
  if(EMBED){
    document.documentElement.classList.add('embed');
    var page = document.getElementById('page');
    var sendHeight = function(){ try{ parent.postMessage({animHeight: Math.ceil(page.getBoundingClientRect().height)}, '*'); }catch(e){} };
    if(window.ResizeObserver) new ResizeObserver(sendHeight).observe(page);
    window.addEventListener('load', sendHeight);
  }
  function $(sel){ return document.querySelector(sel); }
  function sn(x, dp){ var t = Math.abs(x).toFixed(dp); return (x<0 && +t!==0 ? '−' : '')+t; }   // real minus sign
  function FR(t){
    return String(t).replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g,'<span class="frac"><span>$1</span><span>$2</span></span>');
  }
  // Each line of a working readout becomes left | = | right, so the = signs sit under each other.
  function alignEquals(el){
    if(el.querySelector('.eqg')) return;
    var rows = el.innerHTML.split(/<br\s*\/?>/i).map(function(line){
      var i = line.indexOf(' = ');
      if(i<0) return '<span class="eqg-full">'+line+'</span>';
      return '<span class="eqg-l">'+line.slice(0,i)+'</span><span class="eqg-m">=</span><span class="eqg-r">'+line.slice(i+3)+'</span>';
    });
    el.innerHTML = '<div class="eqg">'+rows.join('')+'</div>';
  }
  function watchEquals(el){ alignEquals(el); new MutationObserver(function(){ alignEquals(el); }).observe(el, {childList:true}); }
  // a row of choice buttons that behaves like a radio group
  function segGroup(el, onPick){
    el.addEventListener('click', function(e){ var b=e.target.closest('button'); if(!b||b.disabled) return; pick(b.dataset.v); onPick(b.dataset.v); });
    function pick(v){ Array.prototype.forEach.call(el.querySelectorAll('button'), function(x){ x.setAttribute('aria-pressed', String(x.dataset.v===v)); }); }
    function value(){ var b=el.querySelector('[aria-pressed="true"]'); return b?b.dataset.v:null; }
    return {pick:pick, value:value};
  }
  function pressed(b){ return b.getAttribute('aria-pressed')==='true'; }
  function txt(x,y,s,o){ o=o||{}; return '<text x="'+(+x).toFixed(1)+'" y="'+(+y).toFixed(1)+'"'+(o.a?' text-anchor="'+o.a+'"':'')+' font-size="'+(o.fs||11)+'" fill="'+(o.c||'var(--ink-soft)')+'"'+(o.w?' font-weight="'+o.w+'"':'')+'>'+s+'</text>'; }
  function ln(x1,y1,x2,y2,col,w,extra){ return '<line x1="'+(+x1).toFixed(1)+'" y1="'+(+y1).toFixed(1)+'" x2="'+(+x2).toFixed(1)+'" y2="'+(+y2).toFixed(1)+'" stroke="'+col+'" stroke-width="'+(w||1.5)+'"'+(extra||'')+'/>'; }
  function circ(x,y,r,fill,extra){ return '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+r.toFixed(2)+'" fill="'+fill+'"'+(extra||'')+'/>'; }
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

  // ---- the physics
  // Each U-235 fission releases 2 or 3 fast neutrons (2.5 on average). Each neutron then either escapes from the core,
  // is captured without fission (by U-238, the moderator or fission products), is absorbed by a boron control rod,
  // or is captured by a U-235 nucleus and causes the next fission. k = 2.5 × (fraction that cause fission).
  var NU = 2.5, F0 = 20, CAP = 100, GMAX = 15, GEN_SECS = 1.5;
  var CAPTURE = {new:0.33, used:0.39};   // used fuel has less U-235 left, so a larger share of neutrons is lost to other nuclei
  function probs(f){
    var mod = modSeg.value(), p;
    if(mod==='none'){
      // fast neutrons are rarely captured by U-235: most leave the core or are captured by U-238
      p = {leak:0.55, rod:0.10*f, fiss:0.10};
    } else {
      p = {leak:0.15, rod:0.30*f};
      p.fiss = 1 - p.leak - CAPTURE[fuelSeg.value()] - p.rod;
    }
    p.cap = 1 - p.leak - p.rod - p.fiss;
    return p;
  }
  function kOf(f){ return NU*probs(f).fiss; }
  function critF(){ return modSeg.value()==='none' ? null : (1 - 0.15 - CAPTURE[fuelSeg.value()] - 1/NU)/0.30; }   // 0.40 new, 0.20 used

  var svg=$('#cr-svg'), coreG=$('#cr-core'), rodsG=$('#cr-rods'), nG=$('#cr-n'), graphG=$('#cr-graph');
  var playBtn=$('#cr-play'), slowBtn=$('#cr-slow'), expBtn=$('#cr-exp'), fIn=$('#cr-f');
  var fuelSeg=segGroup($('#cr-fuel'), function(){ reset(); });
  var modSeg=segGroup($('#cr-mod'), function(){ reset(); });
  var presetSeg=segGroup($('#cr-preset'), function(v){ setRods(v==='crit' ? Math.round(critF()*100) : +v); });
  function slowOn(){ return pressed(slowBtn); }
  function exp(){ return pressed(expBtn); }
  var rodPc=50;
  function rodsIn(){ return rodPc/100; }

  // ---- layout: the core on the left and the graph on the right; on a phone the graph goes underneath
  var narrowQ = window.matchMedia('(max-width:560px)'), C, G, LEG;
  function layout(){
    if(narrowQ.matches){
      C = {x:16, y:52, w:298, h:226, head:24};
      LEG = {x:16, y:300};
      G = {x:52, y:372, w:262, h:190};
      svg.setAttribute('viewBox', '0 0 330 610');
    } else {
      C = {x:16, y:40, w:276, h:230, head:24};
      LEG = {x:16, y:292};
      G = {x:352, y:28, w:236, h:236};
      svg.setAttribute('viewBox', '0 0 600 322');
    }
    // 7 slots across the core: fuel rods in slots 0, 2, 4, 6 and control rods in slots 1, 3, 5
    C.fuel=[]; C.ctrl=[];
    for(var j=0;j<7;j++){ var x=C.x+C.w*(j+0.5)/7; (j%2? C.ctrl : C.fuel).push(x); }
  }

  // ---- state
  var gen=0, tg=0, sites=[], neutrons=[], samples=[], carry={}, running=false, started=false, done=false, endWhy='', raf=0, last=0;
  var scram=0, scramFrom=0, runNo=0, runs=[], movedAt=-1, setFAtStart=0;

  function rnd(a,b){ return a+Math.random()*(b-a); }
  function inCore(p){ return [clamp(p[0], C.x+5, C.x+C.w-5), clamp(p[1], C.y+5, C.y+C.h-5)]; }
  function nearest(list, x){ var best=list[0]; list.forEach(function(v){ if(Math.abs(v-x)<Math.abs(best-x)) best=v; }); return best; }
  function fuelSpot(){ return [C.fuel[Math.floor(Math.random()*C.fuel.length)]+rnd(-3,3), rnd(C.y+8, C.y+C.h-8)]; }
  // shared rounding: the fractional part is carried on to the next generation, so the counts follow k without drifting
  function share(key, x){ var v=x+(carry[key]||0); var n=Math.floor(v+1e-9); carry[key]=v-n; return n; }

  // start a generation: each fission site releases 2 or 3 neutrons, and each neutron gets its fate
  function startGen(){
    var F=sites.length, p=probs(effF()), threes=share('three', F*(NU-2)), M=2*F+Math.min(F,threes);
    var nF=share('fiss', M*p.fiss), nR=share('rod', M*p.rod), nL=share('leak', M*p.leak);
    if(nF+nR+nL>M) nL=Math.max(0, M-nF-nR);
    var fates=[], i;
    for(i=0;i<M;i++) fates.push(i<nF?'fiss':(i<nF+nR?'rod':(i<nF+nR+nL?'leak':'cap')));
    for(i=fates.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=fates[i]; fates[i]=fates[j]; fates[j]=t; }
    var order=sites.map(function(s,ix){ return ix; }).sort(function(){ return Math.random()-0.5; });
    neutrons=[];
    var k=0;
    sites.forEach(function(s, ix){
      var n = 2 + (order.indexOf(ix)<threes ? 1 : 0);
      for(var m=0;m<n && k<M;m++,k++) neutrons.push(makeNeutron(s, fates[k]));
    });
    while(k<M){ neutrons.push(makeNeutron(sites[k%F], fates[k])); k++; }
  }
  function effF(){ return scram ? 1 : rodsIn(); }

  function makeNeutron(s, fate){
    var mod=modSeg.value(), pts=[[s[0]+rnd(-2,2), s[1]+rnd(-2,2)]], ts=[0], slowFrom, f=effF();
    var arr=rnd(0.55, 0.75);
    if(mod==='none'){
      // no moderator: the neutron stays fast and flies straight
      var end;
      if(fate==='fiss') end=fuelSpot();
      else if(fate==='rod') end=[C.ctrl[Math.floor(Math.random()*3)]+rnd(-3,3), rnd(C.y+4, C.y+Math.max(6, f*C.h)-2)];
      else if(fate==='leak') end=leakSpot(pts[0]);
      else end=inCore([pts[0][0]+rnd(-60,60), pts[0][1]+rnd(-60,60)]);
      pts.push(end); ts.push(rnd(0.22, 0.38)); slowFrom=99;
    } else {
      // with a moderator: several collisions with moderator nuclei slow the neutron from fast to thermal
      var hops = mod==='graphite' ? 4 : 3, cur=pts[0];
      for(var h=1;h<=hops;h++){
        var a=Math.random()*2*Math.PI, d=rnd(16, 34);
        cur=inCore([cur[0]+d*Math.cos(a), cur[1]+d*Math.sin(a)]);
        pts.push(cur); ts.push(0.08+0.40*(h-1)/(hops-1));
      }
      slowFrom = Math.ceil(hops/2);   // fast for the first collisions, then thermal
      var e;
      if(fate==='fiss') e=[nearest(C.fuel, cur[0])+rnd(-3,3), clamp(cur[1]+rnd(-20,20), C.y+8, C.y+C.h-8)];
      else if(fate==='rod') e=[nearest(C.ctrl, cur[0])+rnd(-2.5,2.5), clamp(cur[1], C.y+4, C.y+Math.max(6, f*C.h)-3)];
      else if(fate==='leak') e=leakSpot(cur);
      else e=inCore([cur[0]+rnd(-14,14), cur[1]+rnd(-14,14)]);
      pts.push(e); ts.push(arr);
    }
    return {pts:pts, ts:ts, slowFrom:slowFrom, fate:fate, arr:ts[ts.length-1]};
  }
  // a neutron that escapes leaves through the nearest side of the core
  function leakSpot(p){
    var dl=p[0]-C.x, dr=C.x+C.w-p[0], db=C.y+C.h-p[1];
    if(dl<=dr && dl<=db) return [C.x-9, p[1]+rnd(-10,10)];
    if(dr<=db) return [C.x+C.w+9, p[1]+rnd(-10,10)];
    return [p[0]+rnd(-10,10), C.y+C.h+9];
  }

  function resetRun(){
    gen=0; tg=0; carry={three:0.5, fiss:0.5, rod:0.5, leak:0.5}; done=false; endWhy=''; scram=0; movedAt=-1;
    sites=[]; for(var i=0;i<F0;i++) sites.push(fuelSpot());
    samples=[[0, F0]]; neutrons=[];
  }

  // ---- drawing the core
  function drawCore(){
    var mod=modSeg.value(), g='', x0=C.x, y0=C.y, w=C.w, h=C.h, i;
    // concrete shield and steel vessel round the core
    g+='<rect x="'+(x0-6)+'" y="'+(y0-C.head-6)+'" width="'+(w+12)+'" height="'+(h+C.head+12)+'" rx="8" fill="none" stroke="var(--ink-faint)" stroke-width="3"/>';
    var fill = mod==='graphite' ? 'var(--graphite)' : (mod==='water' ? 'var(--water)' : 'var(--panel)');
    g+='<rect x="'+x0+'" y="'+y0+'" width="'+w+'" height="'+h+'" fill="'+fill+'" stroke="var(--ink-soft)" stroke-width="1.5"/>';
    if(mod==='graphite'){   // stacked graphite blocks
      for(i=1;i*26<h;i++) g+=ln(x0, y0+i*26, x0+w, y0+i*26, 'var(--graphite-line)', 1);
      for(i=0;i*26<h;i++) for(var j=0;j<7;j++){ var bx=x0+w*(j+(i%2?0:0.5))/7; if(bx>x0+2 && bx<x0+w-2) g+=ln(bx, y0+i*26, bx, Math.min(y0+h, y0+(i+1)*26), 'var(--graphite-line)', 1); }
    } else if(mod==='water'){
      for(i=1;i*30<h;i++){ var yy=y0+i*30, d='M'+x0+' '+yy; for(var xx=x0;xx<x0+w;xx+=20) d+=' q5 -3 10 0 t10 0'; g+='<path d="'+d+'" fill="none" stroke="var(--water-line)" stroke-width="1"/>'; }
    } else g+=txt(x0+w/2, y0+h/2+4, 'no moderator', {a:'middle', fs:11, c:'var(--ink-faint)'});
    // fuel rods (enriched uranium: mostly U-238 with about 3% U-235)
    C.fuel.forEach(function(x){ g+='<rect x="'+(x-6)+'" y="'+(y0+2)+'" width="12" height="'+(h-4)+'" rx="3" fill="var(--fuel)" stroke="var(--fuel-edge)" stroke-width="1.2"/>'; });
    // head space above the core, where the control rods are when they are raised
    g+='<rect x="'+x0+'" y="'+(y0-C.head)+'" width="'+w+'" height="'+C.head+'" fill="var(--bg)" stroke="var(--ink-faint)" stroke-width="1"/>';
    // legend
    var L=LEG, fs=narrowQ.matches?9.5:10;
    g+='<rect x="'+L.x+'" y="'+(L.y-8)+'" width="8" height="10" rx="2" fill="var(--fuel)"/>'+txt(L.x+12, L.y+1, 'fuel rod (U-235)', {fs:fs});
    g+='<rect x="'+(L.x+128)+'" y="'+(L.y-8)+'" width="8" height="10" rx="2" fill="var(--rod)"/>'+txt(L.x+140, L.y+1, 'control rod (boron)', {fs:fs});
    g+=circ(L.x+4, L.y+15, 3.2, 'var(--fast)')+txt(L.x+12, L.y+19, 'fast neutron', {fs:fs});
    g+=circ(L.x+132, L.y+15, 3.2, 'var(--slow)')+txt(L.x+140, L.y+19, 'slow (thermal) neutron', {fs:fs});
    coreG.innerHTML=g;
  }
  // the control rods hang from a drive above the core; f is the fraction of the core height they reach down
  function drawRods(){
    var f=shownF(), g='', bot=C.y+f*C.h, top=C.y-C.head;
    C.ctrl.forEach(function(x){
      g+='<rect class="rod-hit" x="'+(x-5)+'" y="'+top+'" width="10" height="'+(bot-top).toFixed(1)+'" rx="2" fill="var(--rod)" stroke="var(--rod-edge)" stroke-width="1"/>';
      g+='<rect x="'+(x-14)+'" y="'+top+'" width="28" height="'+(bot-top+6).toFixed(1)+'" fill="transparent"/>';   // a wider grab area
    });
    g+=txt(C.x+C.w/2, top-8, scram ? 'all control rods dropped in' : 'control rods  ↕ drag', {a:'middle', fs:10.5, c: scram?'var(--bad)':'var(--ink-soft)'});
    rodsG.innerHTML=g;
    var pc=Math.round(f*100);
    rodsG.setAttribute('aria-valuenow', pc); rodsG.setAttribute('aria-valuetext', pc+'% in');
  }
  function shownF(){ return scram ? scramFrom+(1-scramFrom)*Math.min(1, scram) : rodsIn(); }

  // ---- drawing the neutrons and fissions of the generation in flight
  function pos(n, t){
    var ts=n.ts, i=0;
    if(t>=n.arr) return {p:n.pts[n.pts.length-1], seg:ts.length};
    while(i<ts.length-2 && t>=ts[i+1]) i++;
    var u=(t-ts[i])/(ts[i+1]-ts[i]), a=n.pts[i], b=n.pts[i+1];
    return {p:[a[0]+(b[0]-a[0])*u, a[1]+(b[1]-a[1])*u], seg:i};
  }
  function drawNeutrons(){
    var g='', i;
    if(!started){ nG.innerHTML=''; return; }
    // the fissions that released this generation: each nucleus splits into two fragments that fly apart
    if(tg<0.3){
      sites.forEach(function(s, ix){
        var age=tg/0.28; if(age>=1) return;
        var a=(ix*2.39)%(Math.PI), d=2+age*7, o=(1-age).toFixed(2);
        g+='<circle cx="'+s[0].toFixed(1)+'" cy="'+s[1].toFixed(1)+'" r="'+(3+age*6).toFixed(1)+'" fill="none" stroke="var(--frag)" stroke-width="1.2" opacity="'+(0.5*(1-age)).toFixed(2)+'"/>';
        g+=circ(s[0]+d*Math.cos(a), s[1]+d*Math.sin(a), 2.4, 'var(--frag)', ' opacity="'+o+'"');
        g+=circ(s[0]-d*Math.cos(a), s[1]-d*Math.sin(a), 2.0, 'var(--frag)', ' opacity="'+o+'"');
      });
    }
    neutrons.forEach(function(n){
      var q=pos(n, tg), p=q.p;
      if(tg<n.arr){
        g+=circ(p[0], p[1], 2.6, q.seg<n.slowFrom ? 'var(--fast)' : 'var(--slow)');
        return;
      }
      var age=tg-n.arr;
      if(n.fate==='fiss'){   // captured by a U-235 nucleus: it becomes U-236, which splits at the start of the next generation
        g+=circ(p[0], p[1], 3, 'var(--frag)', ' stroke="var(--panel)" stroke-width="1"');
      } else if(n.fate==='rod'){
        if(age<0.15) g+=circ(p[0], p[1], 2.6*(1-age/0.15)+0.3, 'var(--slow)');
      } else if(n.fate==='leak'){
        if(age<0.12) g+=circ(p[0], p[1], 2.6, n.slowFrom>10?'var(--fast)':'var(--slow)', ' opacity="'+(1-age/0.12).toFixed(2)+'"');
      } else if(age<0.2){
        g+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" fill="none" stroke="var(--ink-faint)" stroke-width="1.2" opacity="'+(1-age/0.2).toFixed(2)+'"/>';
      }
    });
    nG.innerHTML=g;
  }

  // ---- the graph: fissions in each generation
  var YMAX=120;
  function gx(n){ return G.x+n/GMAX*G.w; }
  function gy(v){ return G.y+G.h-Math.min(v,YMAX)/YMAX*G.h; }
  function drawGraph(){
    var g='', k, f=rodsIn();
    for(k=0;k<=GMAX;k+=1){
      var x=gx(k);
      if(k%5===0){ g+=ln(x, G.y, x, G.y+G.h, 'var(--panel-border)', 1)+txt(x, G.y+G.h+14, k, {a:'middle', fs:10, c:'var(--ink-faint)'}); }
    }
    for(var y=20;y<=YMAX;y+=20) g+=ln(G.x, gy(y), G.x+G.w, gy(y), 'var(--panel-border)', 1)+txt(G.x-5, gy(y)+3.5, y, {a:'end', fs:10, c:'var(--ink-faint)'});
    g+=txt(G.x-5, G.y+G.h+3.5, 0, {a:'end', fs:10, c:'var(--ink-faint)'});
    g+=ln(G.x, G.y, G.x, G.y+G.h, 'var(--ink-soft)', 2)+ln(G.x, G.y+G.h, G.x+G.w, G.y+G.h, 'var(--ink-soft)', 2);
    g+=txt(G.x+5, G.y-6, 'fissions per generation', {fs:11, c:'var(--ink-soft)'});
    g+=txt(G.x+G.w/2, G.y+G.h+29, 'generation', {a:'middle', fs:11, c:'var(--ink-soft)'});
    // the safety limit: above it the reactor shuts itself down
    g+=ln(G.x, gy(CAP), G.x+G.w, gy(CAP), 'var(--bad)', 1.2, ' stroke-dasharray="6 4"')+txt(G.x+G.w-3, gy(CAP)-4, 'safety limit', {a:'end', fs:10, c:'var(--bad)'});
    // where the chain is heading with the rods where they are now (hidden in Experiment mode)
    if(!exp() && !done){
      var s0=samples[samples.length-1], kk=kOf(f), pts=[], j;
      for(j=s0[0]; j<=GMAX; j+=0.25){ var v=s0[1]*Math.pow(kk, j-s0[0]); pts.push(gx(j).toFixed(1)+','+gy(v).toFixed(1)); if(v>YMAX) break; }
      if(pts.length>1) g+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--ink-faint)" stroke-width="2" stroke-dasharray="5 4"/>';
    }
    if(movedAt>=0) g+=ln(gx(movedAt), G.y, gx(movedAt), G.y+G.h, 'var(--accent)', 1, ' stroke-dasharray="2 3"')+txt(gx(movedAt)+3, G.y+10, 'rods moved', {fs:9.5, c:'var(--accent)'});
    // the readings, plotted one generation at a time
    if(samples.length>1) g+='<polyline points="'+samples.map(function(q){ return gx(q[0]).toFixed(1)+','+gy(q[1]).toFixed(1); }).join(' ')+'" fill="none" stroke="var(--topic)" stroke-width="1.6"/>';
    samples.forEach(function(q){ g+=circ(gx(q[0]), gy(q[1]), 3.2, 'var(--topic)'); });
    if(exp() && !started) g+=txt(G.x+G.w/2, G.y+G.h/2, 'readings appear here', {a:'middle', fs:11.5, c:'var(--ink-faint)'});
    if(running && slowOn()) g+=txt(G.x+G.w, G.y+G.h-6, 'slow motion', {a:'end', fs:11, c:'var(--accent)'});
    graphG.innerHTML=g;
  }

  // ---- k found from the readings: F(last) = F(0) × kⁿ over the generations since the rods last moved
  function measured(){
    var from = movedAt>=0 ? movedAt : 0, a=null, b=null;
    samples.forEach(function(q){ if(q[0]===from) a=q; if(q[0]>from && q[1]>0) b=q; });
    if(!a || !b) return null;
    var n=b[0]-a[0], r=b[1]/a[1];
    return {a:a, b:b, n:n, r:r, k:Math.pow(r, 1/n)};
  }
  function regime(k){ return Math.abs(k-1)<0.02 ? 'steady' : (k<1 ? 'dies' : 'grows'); }
  var WORD={steady:'<b>critical</b> and the chain stays steady', dies:'<b>subcritical</b> and the chain is dying out', grows:'<b>supercritical</b> and the chain is growing'};

  // IGCSE (?level=igcse): no k anywhere; the chain is described as dying out, steady or growing.
  var IG = PW_LEVEL==='igcse';
  var PLAIN={steady:'staying the same: the chain is <b>steady</b>', dies:'falling: the chain is <b>dying out</b>', grows:'rising: the chain is <b>growing</b>'};
  if(IG){
    $('#cr-k-box').hidden=true;
    $('#cr-exp').title='Find the control-rod position that keeps the chain steady from your own runs';
    var th=document.querySelectorAll('#cr-runs-wrap thead th'); if(th[3]) th[3].remove();
  }
  var lastNote='';
  function readings(){
    var f=rodsIn(), p=probs(f), k=NU*p.fiss, F=sites.length, hide=exp() && !done, m=measured(), mod=modSeg.value();
    $('#cr-g').textContent = started ? gen : 0;
    $('#cr-fis').textContent = started ? F : F0;
    $('#cr-nn').textContent = started ? neutrons.length : 0;
    $('#cr-k').textContent = hide ? '?' : (exp() && m ? m.k.toFixed(2) : k.toFixed(2));
    $('#cr-f-out').textContent = Math.round(f*100)+'%';
    $('#cr-crit').hidden = exp() || mod==='none';

    // working
    var w1='', w2='', w3='';
    if(hide && IG){
      w1='Finish the run, then look at your graph: does the number of fissions in each generation fall, stay the same or rise?';
    } else if(hide){
      w1='Finish the run, then find k from your graph:<br>F<sub>n</sub> = F<sub>0</sub> × k<sup>n</sup><br>k = 1 when the number of fissions stays the same.';
    } else {
      var per=function(x){ return Math.round(x*100); };
      w1='Each fission releases 2 or 3 neutrons: 2.5 on average.<br>Of every 100 neutrons: '+per(p.leak)+' escape, '+per(p.cap)+' are captured without fission'+(p.rod>0?', '+per(p.rod)+' are absorbed by the control rods':'')+' and '+per(p.fiss)+' cause fission.'+(IG?'':'<br>k = 2.5 × [['+per(p.fiss)+'|100]]<br>k = <b>'+k.toFixed(2)+'</b>');
      if(m && (exp() || done) && !IG){
        var sup='<sup>'+m.n+'</sup>';
        w2='F<sub>n</sub> = F<sub>0</sub> × k<sup>n</sup><br>'+m.b[1]+' = '+m.a[1]+' × k'+sup+'<br>k'+sup+' = [['+m.b[1]+'|'+m.a[1]+']]<br>k'+sup+' = '+m.r.toFixed(3)+'<br>k = '+(m.n>1?sup:'')+(m.n>1?'√':'')+m.r.toFixed(3)+'<br>k = <b>'+m.k.toFixed(2)+'</b>';
        w3='From the graph: generation '+m.a[0]+' to generation '+m.b[0]+'.'+(endWhy==='dies'?' (The last generation with any fissions.)':'');
      }
    }
    $('#cr-eq1').innerHTML=FR(w1); $('#cr-eq2').innerHTML=FR(w2); $('#cr-eq2').hidden=!w2; $('#cr-eq3').innerHTML=w3; $('#cr-eq3').hidden=!w3;

    // what is happening now
    var note, kk = (exp() && m) ? m.k : k;
    if(!started){
      note = exp()
        ? 'Experiment: set the control rods, then press <b>Play</b>. Find the position that keeps the number of fissions <b>steady</b>'+(IG?'':' (k = 1)')+'. Moving the rods starts the run again.'
        : 'A U-235 nucleus that captures a <b class="ts">slow</b> neutron splits into two fission fragments, releasing 2 or 3 <b class="tf">fast</b> neutrons and about 200 MeV of energy. Press <b>Play</b> to start with 20 fissions.';
      if(mod==='none') note='With no moderator the neutrons stay <b class="tf">fast</b>, and U-235 rarely captures a fast neutron. Press <b>Play</b> and watch the chain.';
    } else if(done){
      if(endWhy==='scram') note='Over 100 fissions in one generation: the power is rising too fast, so the safety system drops all the control rods in (an emergency shutdown). '+(IG?'The chain was growing.':'With k = '+kk.toFixed(2)+' the chain was <b>supercritical</b>.');
      else if(endWhy==='dies') note='The chain has <b>died out</b> after '+gen+' generations: '+(IG?'':'with k = '+kk.toFixed(2)+' ')+'each generation has fewer fissions than the one before'+(IG?'.':' (subcritical).')+(mod==='none'?' Without a moderator, too few neutrons are slowed down.':'');
      else note=(IG?'After '+GMAX+' generations the number of fissions is '+PLAIN[regime(kk)]+'.':'After '+GMAX+' generations: k = '+kk.toFixed(2)+', so the reactor is '+WORD[regime(kk)]+'.')+(regime(kk)==='steady'?' This is how a power station runs: each fission causes exactly one more on average.':'');
      if(exp() && endWhy!=='scram') note+= regime(kk)==='steady' ? ' You have found the critical position.' : (kk<1 ? ' Raise the rods a little and try again.' : ' Lower the rods a little and try again.');
      if(exp() && endWhy==='scram') note+=' Lower the rods and try again.';
    } else {
      note = mod==='none'
        ? 'Generation '+gen+': '+F+' fissions. Without a moderator the <b class="tf">fast</b> neutrons fly straight on: most escape or are captured by U-238.'
        : 'Generation '+gen+': '+F+' fissions. <b class="tf">Fast</b> neutrons collide with '+(mod==='graphite'?'carbon':'hydrogen')+' nuclei in the moderator and slow down to <b class="ts">thermal</b> speeds; some are absorbed by the boron control rods.';
      if(!hide && IG) note+=' The chain '+(regime(k)==='steady'?'is steady.':(k<1?'is dying out.':'is growing.'));
      else if(!hide) note+=' k = '+k.toFixed(2)+': the chain '+(regime(k)==='steady'?'stays steady (critical).':(k<1?'is dying out (subcritical).':'is growing (supercritical).'));
      if(!running) note='Paused. '+note;
    }
    note=FR(note);
    if(note!==lastNote){ $('#cr-note').innerHTML=note; lastNote=note; }
    playBtn.innerHTML = running ? '&#10074;&#10074; Pause' : (done ? '&#8634; Run again' : '&#9654; Play');
    var pv = String(Math.round(f*100)), crit=critF();
    presetSeg.pick(pv==='0'?'0':(pv==='100'?'100':(crit!==null && !exp() && Math.round(crit*100)===+pv?'crit':'')));
  }

  function draw(){ drawCore(); drawRods(); drawNeutrons(); drawGraph(); readings(); }

  // ---- the animation: it always ends (the chain dies out, the safety system shuts it down, or after 15 generations)
  function stop(){ running=false; cancelAnimationFrame(raf); }
  function endGen(){
    var next=neutrons.filter(function(n){ return n.fate==='fiss'; }).map(function(n){ return n.pts[n.pts.length-1]; });
    gen++; samples.push([gen, next.length]); sites=next; neutrons=[]; tg=0;
    if(next.length===0){ finish('dies'); return; }
    if(next.length>=CAP){ scram=0.0001; scramFrom=rodsIn(); return; }   // the rods drop in, then the run ends
    if(gen>=GMAX){ finish('end'); return; }
    startGen();
  }
  function finish(why){
    done=true; endWhy=why; stop();
    if(exp()) logRun();
  }
  function showRuns(){ var on=exp() && runs.length>0; $('#cr-runs-wrap').hidden=!on; $('.stage').classList.toggle('has-runs', on); }
  function logRun(){
    var m=measured(), k=m?m.k:0, r=endWhy==='scram'?'grows':(endWhy==='dies'?'dies':regime(k));
    var row=[++runNo, fuelSeg.value()==='new'?'new':'used', Math.round(rodsIn()*100)+'%', m?m.k.toFixed(2):'–', {steady:'steady', dies:'dies out', grows:'grows'}[r]];
    if(IG) row.splice(3,1);
    runs.push(row);
    var tb=$('#cr-runs');
    tb.innerHTML=runs.map(function(r,i){ return '<tr'+(i===runs.length-1?' class="new"':'')+'>'+r.map(function(c){ return '<td>'+c+'</td>'; }).join('')+'</tr>'; }).join('');
    showRuns(); var wrap=$('#cr-runs-wrap'); wrap.scrollTop=wrap.scrollHeight;
  }
  function frame(now){
    if(!running) return;
    var real=Math.min(0.05,(now-last)/1000); last=now;
    var dt=real*(slowOn()?0.3:1)/GEN_SECS;
    if(scram){
      tg=Math.min(1, tg+dt);
      scram+=dt*2.5;   // the rods fall in about 0.4 generations
      if(scram>=1){ scram=1; finish('scram'); }
    } else {
      tg+=dt;
      if(tg>=1) endGen();
    }
    draw(); if(running) raf=requestAnimationFrame(frame);
  }
  function run(){
    if(done || !started){ if(done) resetRun(); startGen(); }
    started=true; running=true; last=performance.now();
    raf=requestAnimationFrame(frame); draw();
  }
  function reset(){ stop(); started=false; resetRun(); draw(); }

  // Moving the rods: before a run, or during a normal run (the next generation uses the new position).
  // In Experiment mode, moving them clears the readings and starts again.
  function setRods(pc){
    pc=clamp(Math.round(pc/5)*5, 0, 100);
    fIn.value=pc;
    if(pc===rodPc){ draw(); return; }
    rodPc=pc;
    if(exp() || done || scram) reset();
    else { if(started) movedAt=gen; draw(); }
  }
  fIn.addEventListener('input', function(){ setRods(+fIn.value); });

  // drag the control rods up and down in the picture
  var drag=null;
  function svgY(e){ var pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()).y; }
  rodsG.addEventListener('pointerdown', function(e){
    if(scram && !done) return;
    drag={off:svgY(e)-(C.y+rodsIn()*C.h), id:e.pointerId};
    rodsG.classList.add('dragging');
    try{ rodsG.setPointerCapture(e.pointerId); }catch(x){}
    e.preventDefault();
  });
  rodsG.addEventListener('pointermove', function(e){
    if(!drag) return;
    var pc=(svgY(e)-drag.off-C.y)/C.h*100;
    pc=clamp(Math.round(pc/5)*5, 0, 100);
    if(pc!==rodPc) setRods(pc);
  });
  function endDrag(){ drag=null; rodsG.classList.remove('dragging'); }
  rodsG.addEventListener('pointerup', endDrag); rodsG.addEventListener('pointercancel', endDrag);
  rodsG.addEventListener('keydown', function(e){
    var d = (e.key==='ArrowDown'||e.key==='ArrowRight') ? 5 : ((e.key==='ArrowUp'||e.key==='ArrowLeft') ? -5 : 0);
    if(e.key==='Home') d=-100; if(e.key==='End') d=100;
    if(!d) return; e.preventDefault(); setRods(rodPc+d);
  });

  playBtn.addEventListener('click', function(){ if(running){ stop(); draw(); } else run(); });
  slowBtn.addEventListener('click', function(){ slowBtn.setAttribute('aria-pressed', String(!slowOn())); draw(); });
  expBtn.addEventListener('click', function(){
    expBtn.setAttribute('aria-pressed', String(!exp()));
    showRuns();
    reset();
  });
  $('#cr-reset').addEventListener('click', reset);
  if(narrowQ.addEventListener) narrowQ.addEventListener('change', function(){ layout(); reset(); });

  watchEquals($('#cr-eq1')); watchEquals($('#cr-eq2'));
  layout(); reset();
})();
</script><script id="choice-kit-js">
/* Choice kit (12 Nov 2026): the same block on every animation page. See tools/ANIMATION-STYLE.md, "Choices".
   A group of choices with one chosen gets a track round it (class pick); a .to-q button opens the questions from Explore. */
(function(){
  function on(b){ return b.getAttribute('aria-pressed')==='true' || b.classList.contains('is-on'); }
  function each(sel, fn){ Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }
  function mark(s){
    if(!s.classList.contains('pick')){
      var n=0; Array.prototype.forEach.call(s.children, function(b){ if(b.tagName==='BUTTON' && on(b)) n++; });
      if(n===1) s.classList.add('pick');
    }
    if(s.classList.contains('pick') && !s.hasAttribute('data-fit')){
      var d=getComputedStyle(s).display;
      if(d!=='none'){ s.setAttribute('data-fit','1'); if(d.indexOf('flex')>=0) s.classList.add('fit'); }
    }
  }
  each('.seg:not(.tabs):not(.mode):not(.apps)', function(s){
    mark(s);
    if(window.MutationObserver) new MutationObserver(function(){ mark(s); }).observe(s, {childList:true, subtree:true, attributes:true, attributeFilter:['aria-pressed','class']});
  });
  each('.to-q[data-mode]', function(b){
    var seg=document.getElementById(b.getAttribute('data-mode')); if(!seg) return;
    var bs=seg.querySelectorAll('button');
    function sync(){ b.hidden=!on(bs[0]) || !seg.getClientRects().length; }   // hidden too when the page hides its mode switch (e.g. at a level with no questions)
    b.addEventListener('click', function(){ bs[1].click(); bs[1].focus(); });
    if(window.MutationObserver) new MutationObserver(sync).observe(seg, {subtree:true, attributes:true, attributeFilter:['aria-pressed']});
    document.addEventListener('click', function(){ setTimeout(sync, 0); });
    sync(); setTimeout(sync, 0);
  });
})();
</script>
