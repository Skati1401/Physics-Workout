<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seesaw Animation</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%231d2433%27/%3E%3Cpath d=%27M18.5 3 7 18h7.5l-2 11L25 13h-7.5z%27 fill=%27%23ffc83d%27 stroke=%27%23ffe08a%27 stroke-width=%271%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<meta name="description" content="Interactive physics animation for Edexcel IGCSE, IAL and IB. Change two weights and their distances until the clockwise and anticlockwise moments balance, then predict which side goes down or where to sit to balance. IAL and IB add the plank’s own weight, a pivot off centre and the force from the pivot.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1f5;
    --bg-grid:rgba(29,41,61,0.055);
    --panel:#ffffff;
    --panel-border:#d7dce4;
    --ink:#182233;
    --ink-soft:#4c5668;
    --ink-faint:#8993a5;
    --accent:#d9720c;
    --accent-soft:#fdead2;
    --good:#15803d;
    --good-soft:#dcf5e3;
    --bad:#c0311a;
    --bad-soft:#fbe1db;
    --shadow:0 10px 26px -14px rgba(24,34,51,0.28);

    --motion:#2158d1;      --motion-soft:#dfe8fc;
    --elastic:#0c8a76;     --elastic-soft:#d6f3ee;
    --momentum:#b8267a;    --momentum-soft:#fbdeee;
    --newton:#3d3aa8;      --newton-soft:#e3e2f8;
    --moments:#6d3bce;     --moments-soft:#e9e0fb;
    --units:#96660b;       --units-soft:#f6e8ca;

    --font-display:'Big Shoulders',system-ui,sans-serif;
    --font-body:'IBM Plex Sans',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12161f; --bg-grid:rgba(255,255,255,0.045);
      --panel:#1b212e; --panel-border:#2c3444;
      --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;
      --accent:#ff9a3d; --accent-soft:#3a2712;
      --good:#4ade80; --good-soft:#123321;
      --bad:#f27159; --bad-soft:#3a1712;
      --shadow:0 14px 30px -14px rgba(0,0,0,0.55);
      --motion:#7da3ff; --motion-soft:#1a2440;
      --elastic:#4fd6bd; --elastic-soft:#0f2e29;
      --momentum:#ef83bd; --momentum-soft:#3a1c2c;
      --newton:#9d9af0; --newton-soft:#242259;
      --moments:#b393f5; --moments-soft:#2a2148;
      --units:#e0b64a; --units-soft:#332a10;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12161f; --bg-grid:rgba(255,255,255,0.045);
    --panel:#1b212e; --panel-border:#2c3444;
    --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;
    --accent:#ff9a3d; --accent-soft:#3a2712;
    --good:#4ade80; --good-soft:#123321;
    --bad:#f27159; --bad-soft:#3a1712;
    --shadow:0 14px 30px -14px rgba(0,0,0,0.55);
    --motion:#7da3ff; --motion-soft:#1a2440;
    --elastic:#4fd6bd; --elastic-soft:#0f2e29;
    --momentum:#ef83bd; --momentum-soft:#3a1c2c;
    --newton:#9d9af0; --newton-soft:#242259;
    --moments:#b393f5; --moments-soft:#2a2148;
    --units:#e0b64a; --units-soft:#332a10;
    color-scheme:dark;
  }

  :root{--c:var(--moments);--cs:var(--moments-soft);}

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      linear-gradient(var(--bg-grid) 1px,transparent 1px) 0 0/100% 34px,
      linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px) 0 0/34px 100%,
      var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  [hidden]{display:none!important;}
  button{font:inherit;color:inherit;}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;}

  .page{max-width:1400px;margin-inline:auto;padding-inline:20px;padding-block:12px 40px;}
  h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:0.2px;text-wrap:balance;margin:0;}
  p{margin:0;line-height:1.55;}

  .home-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-bottom:4px;font:600 13px var(--font-mono);color:var(--ink-soft);text-decoration:none;}
  .home-link:hover{color:var(--accent);}
  .page-head{margin-bottom:12px;}
  .eyebrow{font-family:var(--font-mono);font-size:11.5px;color:var(--accent);font-weight:600;margin-bottom:6px;}
  .page-head h1{font-size:clamp(28px,5vw,38px);color:var(--ink);}

  .card{background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;box-shadow:var(--shadow);}
  .btn{
    font-family:var(--font-body);font-weight:600;font-size:13.5px;color:var(--ink);
    background:var(--panel);border:1px solid var(--panel-border);border-radius:9px;
    padding:9px 15px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  }
  .btn:hover{border-color:var(--ink-faint);}
  .btn:disabled{opacity:.45;cursor:default;}
  .btn-primary{background:var(--ink);border-color:var(--ink);color:var(--bg);}
  .btn-primary:hover{opacity:.88;border-color:var(--ink);}
  .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);}
  .btn-group{display:flex;flex-wrap:wrap;gap:10px;}

  /* picture on the left; controls, readings and working on the right */
  .stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);gap:18px 24px;align-items:start;padding:18px;}
  @media (max-width:860px){ .stage{grid-template-columns:minmax(0,1fr);} }
  /* the picture shrinks on short screens so the whole box fits in the window */
  .view{display:block;width:100%;height:auto;max-height:max(260px,calc(100vh - 290px));}
  .embed .view{max-height:460px;}
  .under{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;margin-top:12px;}
  .under .btn-group{flex:0 1 auto;}
  .mass{flex:1 1 220px;min-width:0;}
  .sliders{flex:1 1 440px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px 24px;}
  .eq .why{font-family:var(--font-body);font-size:11.5px;color:var(--ink-faint);margin-left:.8em;}
  .view text{font-family:var(--font-mono);}
  /* drag a person along the beam to set their distance */
  .grab{cursor:grab;touch-action:none;}
  .hint{font-size:12.5px;color:var(--ink-faint);}
  #ss-svg.dragging,#ss-svg.dragging *{cursor:grabbing;}
  .side{display:flex;flex-direction:column;gap:12px;min-width:0;}
  .lab{display:flex;justify-content:space-between;font:12.5px var(--font-mono);color:var(--ink-soft);margin-bottom:6px;}
  .lab output{color:var(--ink);font-weight:600;}
  input[type=range]{width:100%;accent-color:var(--c);min-height:28px;}
  .seg{display:flex;flex-wrap:wrap;gap:6px;}
  .seg button{font:12.5px var(--font-mono);padding:8px 12px;min-height:44px;border:1px solid var(--panel-border);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer;}
  .seg button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--panel);}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px;}
  .stat strong{white-space:nowrap;}
  .stat{border:1px solid var(--panel-border);border-radius:8px;padding:5px 8px;display:flex;flex-direction:column;justify-content:space-between;}
  .stat small{display:block;font:10.5px var(--font-mono);color:var(--ink-faint);}
  .stat strong{font:600 15px var(--font-mono);color:var(--ink);}
  .stat.up strong{color:var(--accent);}
  .note{font-size:15px;line-height:1.5;color:var(--ink);padding:10px 12px;border-radius:8px;background:var(--bg);min-height:4.6em;}

  details.working summary{cursor:pointer;font:600 13px var(--font-mono);color:var(--c);min-height:44px;display:flex;align-items:center;}
  .eq{font-family:var(--font-mono);font-size:14px;line-height:1.75;padding:8px 12px;border-left:3px solid var(--c);background:var(--cs);border-radius:6px;color:var(--ink);}
  .eq b{color:var(--c);}
  .eqg{display:grid;grid-template-columns:auto auto minmax(0,1fr);column-gap:.45em;row-gap:.2em;align-items:center}
  .eqg-l{justify-self:end;text-align:right}
  .eqg-m{justify-self:center}
  .eqg-r{justify-self:start;min-width:0}
  .eqg-full{grid-column:1/-1}
  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1.25;}
  .frac>span{padding:0 .25em;white-space:nowrap;}
  .frac>span:first-child{border-bottom:1.5px solid currentColor;}
  @media (max-width:560px){ .stage{padding:12px;} .eq{font-size:12.5px;padding:6px 8px;} }

  /* inside a workout tab (skydiver.html?embed): no page heading, no outer margins */
  .embed body{background:transparent;}
  .embed .page{padding:0;max-width:none;}
  .embed .home-link,.embed .page-head{display:none;}
  .view{max-height:max(240px,calc(100vh - 290px));touch-action:manipulation;}
  .embed .view{max-height:400px;}
  .view.tall,.embed .view.tall{max-height:none;}
  .seg.tabs{gap:0;flex-wrap:nowrap;}
  .seg.tabs button{border-radius:0;margin-left:-1px;font-weight:600;}
  .seg.tabs button:first-child{border-radius:8px 0 0 8px;margin-left:0;}
  .seg.tabs button:last-child{border-radius:0 8px 8px 0;}
  .pick{cursor:pointer;}
  .pick.off{cursor:default;}
  .pick:focus{outline:none;}
  .pick .ring{stroke:transparent;}
  .pick:focus-visible .ring{stroke:var(--accent);}
  .note.bad{background:var(--bad-soft);}
  .note.good{background:var(--good-soft);}
  /* level switch on the title line (IGCSE | IAL | IB): IAL and IB add the plank's own weight, a pivot away from its centre and the force from the pivot */
  .head-line{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;}
  #ss-level button{font-weight:400;font-size:12.5px;padding:8px 10px;white-space:nowrap;}
  #ss-level button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);}
  .tro-name.t3{background:var(--wood-s);} #ss-wp,#ss-s{accent-color:var(--wood-s);}
  .eq .why{display:inline-block;font-family:var(--font-body);font-size:11.5px;line-height:1.4;color:var(--ink-faint);}
  .tro{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:4px 14px;align-items:center;}
  .tro .lab{margin-bottom:0;}
  .tro-name{font:600 12.5px var(--font-mono);color:#fff;padding:5px 8px;border-radius:6px;white-space:nowrap;text-align:center;}
  .tro-name.t1{background:var(--p1);} .tro-name.t2{background:var(--p2);}
  #ss-w1,#ss-d1{accent-color:var(--p1);} #ss-w2,#ss-d2{accent-color:var(--p2);}
  :root{--p1:#6d3bce;--p2:#0c8a76;--grass:#cfe8b4;--grass-line:#b5d698;--steel:#66748c;--steel-hi:#c3ccda;--steel-sh:#3f4a5e;--wood-f:#c99e6a;--wood-t:#e3c08f;--wood-s:#9c7444;--skin:#c99a6c;--hair:#3b2a1f;--jeans:#3d4c70;--jeans-hi:#7384a8;}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--p1:#8257e0;--p2:#17a08a;--grass:#22361a;--grass-line:#2c4522;--steel:#8f9db3;--steel-hi:#dfe5ee;--steel-sh:#566179;--wood-f:#8a6a43;--wood-t:#a8855a;--wood-s:#644b2d;--skin:#c29364;--hair:#7a563c;--jeans:#4a5b85;--jeans-hi:#8496bd;} }
  :root[data-theme="dark"]{--p1:#8257e0;--p2:#17a08a;--grass:#22361a;--grass-line:#2c4522;--steel:#8f9db3;--steel-hi:#dfe5ee;--steel-sh:#566179;--wood-f:#8a6a43;--wood-t:#a8855a;--wood-s:#644b2d;--skin:#c29364;--hair:#7a563c;--jeans:#4a5b85;--jeans-hi:#8496bd;}
</style>
<script>
  // Visit counter (GoatCounter: no cookies, no personal data). Skipped when a page is embedded in a workout, so a visit counts once.
  // pwCountTab(tab, label): counts each workout tab once per visit as a GoatCounter event (path "page#tab"), skipped in frames the same way.
  (function(){
    var off = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var seen = {}, queue = [];
    function send(e){ try { window.goatcounter.count(e); } catch (x) {} }
    window.pwCountTab = function(tab, label){
      if (off || !tab || seen[tab]) return;
      seen[tab] = 1;
      var page = (location.pathname.split('/').pop() || 'index').replace(/\.html$/, '');
      var e = { path: page + '#' + tab, title: (label || tab) + ' \u00b7 ' + document.title, event: true };
      if (window.goatcounter && window.goatcounter.count) send(e); else queue.push(e);
    };
    if (off) return;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://gc.zgo.at/count.js';
    s.setAttribute('data-goatcounter', 'https://physics-workout.goatcounter.com/count');
    s.onload = function(){ var q = queue; queue = []; q.forEach(send); };
    document.head.appendChild(s);
  })();
</script>

<script>
  // Draft tags and Alex's reviewer button (tools/review/drafts.py writes this block; edit tools/review/snippet.html, then run drafts.py sync).
  // A page is Draft while its row in tools/REVIEW.md is not ✅: <meta name="pw-draft"> on the page, data-draft on its list cards.
  // ?reviewer (once, on any page) turns on reviewer mode in this browser; ?reviewer=off turns it off.
  (function(){
    var on = false, embed = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var m = /[?&]reviewer(?:=([^&]*))?/.exec(location.search);
    on = !!m && m[1] !== 'off';
    try {
      if (m) { if (m[1] === 'off') localStorage.removeItem('pw-reviewer'); else localStorage.setItem('pw-reviewer', '1'); }
      else on = localStorage.getItem('pw-reviewer') === '1';
    } catch (e) {}
    var CSS = '.pw-draft{display:inline-block;vertical-align:middle;margin-left:10px;font:600 11.5px/1.4 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:0;color:var(--bad,#b42318);border:1px dashed currentColor;border-radius:5px;padding:1px 7px;white-space:nowrap}'
      + '.act-top .pw-draft{margin-left:auto;flex:none}.act-top .pw-draft~.cp-tag,.act-top .pw-draft~.ta-tag{margin-left:0}'
      + 'a[data-draft]{position:relative}.pw-draft.pw-corner{position:absolute;top:10px;right:10px;margin:0;background:var(--panel,#fff)}'
      + 'summary .pw-draft{margin-left:0;flex:none}'
      + '.pw-check{display:inline-block;vertical-align:middle;margin-left:8px;font:600 13px/1.4 "IBM Plex Sans",system-ui,sans-serif;color:#fff;background:#1a7f37;border-radius:6px;padding:4px 10px;text-decoration:none;white-space:nowrap}'
      + '.pw-check:hover{background:#116329}.pw-check:focus-visible{outline:2px solid #1a7f37;outline-offset:2px}'
      + '.pw-reviewer{position:fixed;left:10px;bottom:10px;z-index:9999;font:500 12px/1.4 "IBM Plex Mono",ui-monospace,monospace;background:#1d2433;color:#fff;border-radius:6px;padding:4px 9px;opacity:.85}'
      + '.pw-reviewer a{color:#ffc83d}';
    function tag(){ var t = document.createElement('span'); t.className = 'pw-draft'; t.title = 'Not yet checked'; t.textContent = 'Draft'; return t; }
    function go(){
      var st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st);
      var meta = document.querySelector('meta[name="pw-draft"]'), h1 = document.querySelector('h1');
      if (meta && h1 && !embed) {
        h1.appendChild(tag());
        if (on) {
          var page = meta.getAttribute('content'), b = document.createElement('a');
          b.className = 'pw-check'; b.target = '_blank'; b.rel = 'noopener'; b.textContent = '✓ Checked';
          b.title = 'Opens a GitHub issue. Submit it and the Draft tag goes in a minute or two.';
          b.href = 'https://github.com/Skati1401/Physics-Workout/issues/new?title=' + encodeURIComponent('Checked: ' + page)
            + '&body=' + encodeURIComponent('Submit this issue to mark `' + page + '` as checked. The Draft tag goes in a minute or two, and the issue closes itself.');
          h1.appendChild(b);
        }
      }
      document.querySelectorAll('a[data-draft]').forEach(function(a){
        if (a.querySelector('.pw-draft')) return;
        var t = tag(), top = a.querySelector('.act-top');
        if (top) top.insertBefore(t, top.querySelector('.cp-tag,.ta-tag'));
        else { t.className += ' pw-corner'; a.appendChild(t); }
      });
      document.querySelectorAll('details.unit').forEach(function(d){
        var s = d.querySelector('summary');
        if (!s || s.querySelector('.pw-draft') || !d.querySelector('a[data-draft]')) return;
        var h2 = s.querySelector('h2'); if (h2) h2.parentNode.insertBefore(tag(), h2.nextSibling); else s.appendChild(tag());
      });
      if (on && !embed) {
        // Carry ?reviewer in every link to another page of the site, so reviewer mode survives
        // browsers that clear site storage (school Chromebooks) and pages cached from before.
        var carry = function(a){
          try {
            var u = new URL(a.href, location.href);
            if (u.origin !== location.origin || !/(\.html|\/)$/.test(u.pathname) || u.searchParams.has('reviewer')) return;
            u.searchParams.set('reviewer', ''); a.href = u.href.replace('reviewer=', 'reviewer');
          } catch (e) {}
        };
        document.querySelectorAll('a[href]').forEach(carry);
        ['click', 'auxclick', 'contextmenu'].forEach(function(ev){
          document.addEventListener(ev, function(e){ var a = e.target.closest && e.target.closest('a[href]'); if (a) carry(a); }, true);
        });
        var r = document.createElement('div'); r.className = 'pw-reviewer';
        r.innerHTML = 'Reviewer mode · <a href="' + location.pathname + '?reviewer=off">turn off</a>';
        document.body.appendChild(r);
      }
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
  })();
</script>

<body>
<div class="page" id="page">
  <a class="home-link" href="igcse.html">&larr; IGCSE animations</a>
  <header class="page-head">
    <div class="eyebrow">Animations &middot; forces</div>
    <div class="head-line">
      <h1>Moments on a Seesaw</h1>
      <div class="seg tabs" id="ss-level" role="group" aria-label="Level"><button type="button" data-v="ks4" aria-pressed="true">IGCSE</button><button type="button" data-v="ial" aria-pressed="false">IAL</button><button type="button" data-v="ib" aria-pressed="false">IB</button></div>
    </div>
  </header>

  <section class="card stage">
    <div>
      <svg class="view" id="ss-svg" viewBox="0 0 860 350" role="img" aria-label="A seesaw with a girl sitting on the left and a boy on the right. Beside it, the force diagram: a beam on a pivot with each person's weight and distance from the pivot, and the anticlockwise and clockwise moments as bars."></svg>
      <div class="under">
        <div class="btn-group">
          <button class="btn btn-primary" id="ss-go" type="button" hidden>&#9654; Go</button>
          <button class="btn" id="ss-new" type="button" hidden>&#8634; New question</button>
          <button class="btn" id="slow" type="button" aria-pressed="false">Slow motion</button>
        </div>
      </div>
    </div>
    <div class="side">
      <div class="seg tabs" id="ss-mode" role="group" aria-label="Mode"><button type="button" data-v="explore" aria-pressed="true">Explore</button><button type="button" data-v="predict" aria-pressed="false">Predict</button></div>
      <div class="tro" id="ss-sliders" role="group" aria-label="The two people">
        <span class="tro-name t1">Left</span>
        <div><label class="lab" for="ss-w1"><span>Weight</span> <output id="ss-w1o"></output></label><input type="range" id="ss-w1" min="100" max="800" step="50" value="400" aria-label="Left weight"></div>
        <div><label class="lab" for="ss-d1"><span>Distance</span> <output id="ss-d1o"></output></label><input type="range" id="ss-d1" min="0.5" max="2.5" step="0.25" value="1.5" aria-label="Left distance from the pivot"></div>
        <span class="tro-name t2">Right</span>
        <div><label class="lab" for="ss-w2"><span>Weight</span> <output id="ss-w2o"></output></label><input type="range" id="ss-w2" min="100" max="800" step="50" value="300" aria-label="Right weight"></div>
        <div><label class="lab" for="ss-d2"><span>Distance</span> <output id="ss-d2o"></output></label><input type="range" id="ss-d2" min="0.5" max="2.5" step="0.25" value="2.5" aria-label="Right distance from the pivot"></div>

    // ---- solid kit (the same block is in reaction-time.html, roller-coaster-energy.html, heat-transfer.html, density.html and liquid-pressure.html) ----
  function f1(n){ return (+n).toFixed(1); }

      g+=rect(0,gy-3,L.tall?L.W:532,L.H,'var(--grass)')+ln(0,gy-3,L.tall?L.W:532,gy-3,'var(--grass-line)',2);

      // the beam: a plank marked every half metre
      var e0=-2.6-v.s, e1=2.6-v.s, TL=pt(e0,4.5), TR=pt(e1,4.5), BL=pt(e0,-4.5), BR=pt(e1,-4.5), o=[6,-4];   // the plank's ends, measured from the pivot
      g+=pg([TL,TR,[TR[0]+o[0],TR[1]+o[1]],[TL[0]+o[0],TL[1]+o[1]]],'var(--wood-t)')+pg([TR,[TR[0]+o[0],TR[1]+o[1]],[BR[0]+o[0],BR[1]+o[1]],BR],'var(--wood-s)')+pg([TL,TR,BR,BL],'var(--wood-f)');
      for(k=-6;k<=5;k++){ if(!k || k/2<e0 || k/2>e1) continue; var m0=pt(k/2,4.5), m1=pt(k/2,k%2?0:-4.5); g+=ln(m0[0],m0[1],m1[0],m1[1],'#fff',1.4,' opacity=".75"'); }
      g+='<circle cx="'+cx+'" cy="'+cy+'" r="4.5" fill="var(--steel-hi)" stroke="var(--steel-sh)" stroke-width="1.5"/>';
      // while a question is asked the pivot is locked, so the seesaw stays level until Go
      if(ask) g+='<circle cx="'+cx+'" cy="'+cy+'" r="8" fill="none" stroke="var(--bad)" stroke-width="2.5"/>'+ln(cx-5.5,cy-5.5,cx+5.5,cy+5.5,'var(--bad)',2.5)+txt(cx,cy-15,'locked',{a:'middle',fs:12,c:'var(--bad)',w:600,halo:1});
      // seats to choose from (Predict, "where must they sit?"): a lettered ring on the grass under each seat, with a dotted line up to the beam
      if(pr && q.kind==='seat') SPOTS.forEach(function(d,i){ var id=LET[i], s=pt(d,-4.5), x=cx+d*P, y=gy+24, sel=q.pick===id, st=done?(id===q.ans?'good':(sel?'bad':'')):'';
        if(!sel) g+=ln(x,y-14,s[0],s[1]+1,'var(--ink-faint)',1.2,' stroke-dasharray="2 3"');
        g+=pickG(id,x,y,id+': '+d+' m from the pivot',function(col){ return txt(x,y+4.5,id,{a:'middle',fs:13,c:col,w:700}); },st,sel,ask); });
      function who(d, W, side, col, girl){
        var s=pt(d,4.5), u=pt(d,-4.5), hgt=62*L.pk*(0.66+W/800*0.46), len=14+W/50, r=person(s[0],s[1],W,-side,col,girl);
        // the weight acts downwards, so its arrow hangs under the beam, with its value under the tip
        // (beside the arrow when this person sits over the plank's centre of gravity, where the plank's own arrow hangs)
        var clash=side<0 && v.Wp>0 && v.s>0 && Math.abs(-d-v.s)<0.3;
        r+=arrow(u[0],u[1]+2,u[0],u[1]+2+len,col,3.5)+(clash ? txt(u[0]-9,u[1]+len/2+8,W+' N',{a:'end',fs:13,c:col,w:600,halo:1}) : txt(u[0],u[1]+len+15,W+' N',{a:'middle',fs:13,c:col,w:600,halo:1}));
        // invisible grab area over the person and their weight arrow (Explore only)
        if(!pr) r+='<rect class="grab" data-side="'+side+'" x="'+f1(s[0]-26)+'" y="'+f1(s[1]-hgt-8)+'" width="52" height="'+f1(hgt+len+36)+'" fill="transparent"/>';
        return r;
      }
      // IAL and IB: the plank's own weight, acting at its centre of gravity (its middle). With the pivot under the middle it acts
      // through the pivot, so only the force diagram says so.
      if(v.Wp>0 && v.s>0){ var pc=pt(-v.s,-4.5), pl2=L.tall?40:50; g+=arrow(pc[0],pc[1]+2,pc[0],pc[1]+2+pl2,'var(--wood-s)',3.5)+txt(pc[0],pc[1]+pl2+16,v.Wp+' N',{a:'middle',fs:13,c:'var(--ink)',w:600,halo:1})+txt(pc[0],pc[1]+pl2+29,'plank',{a:'middle',fs:11.5,c:'var(--ink-soft)',halo:1}); }
      g+=who(-v.d1,v.W1,-1,C1,true); if(v.d2!=null) g+=who(v.d2,v.W2,1,C2,false);
      // which side goes down? (Predict): an arrow on the grass under each half of the beam, and = under the pivot
      if(pr && q.kind==='side'){
        [['L',-1.25,'the left side goes down'],['R',1.25,'the right side goes down']].forEach(function(p){ var x=cx+p[1]*P, y=gy+24, sel=q.pick===p[0], st=done?(p[0]===q.ans?'good':(sel?'bad':'')):'';
          g+=pickG(p[0],x,y,p[2],function(col){ return arrow(x,y-8,x,y+8.5,col,2.6); },st,sel,ask); });
        var ye=gy+24, se=q.pick==='E', ste=done?(q.ans==='E'?'good':(se?'bad':'')):'';
        g+=pickG('E',cx,ye,'it stays balanced',function(col){ return ln(cx-6,ye-3,cx+6,ye-3,col,2.6,' stroke-linecap="round"')+ln(cx-6,ye+3,cx+6,ye+3,col,2.6,' stroke-linecap="round"'); },ste,se,ask);
      }
      // the question, then the verdict, in clear space above the picture
      if(pr){ var lines=wrapLines(done ? (q.ok?'✓ Right: ':'✗ Not quite: ')+answerText() : askText(), L.qn), colq=done?(q.ok?'var(--good)':'var(--bad)'):'var(--ink)';
        lines.forEach(function(s,i){ g+=txt(L.qx,L.qy+i*16,s,{fs:13,c:colq,w:600,halo:1}); }); }
      return g;
    }
    // the force diagram as an exam paper draws it: a level beam on a pivot, the two weights and their distances from the pivot
    function examSVG(v){
      var E=L.E, x0=E.cx+v.s*E.epx, by=E.by, e=E.epx, g=txt(E.tx,E.ty,'Force diagram',{fs:12.5,c:'var(--ink)',w:700});
      g+=pg([[x0,by+7],[x0-12,by+25],[x0+12,by+25]],'var(--panel)',' stroke="var(--ink-soft)" stroke-width="2"')+ln(x0-22,by+25,x0+22,by+25,'var(--ink-soft)',2);
      g+=rect(E.cx-2.6*e,by,5.2*e,7,'var(--ink)',' rx="1.5"');
      // IAL and IB: the plank's weight at its centre of gravity, and the force from the pivot (it has no moment about the pivot)
      // (the pivot's force is only named: it equals the total weight only when the seesaw is balanced, and the note gives it then)
      if(kp()){ var pl3=L.tall?66:84, up=level==='ib'?'F<tspan dy="3" font-size="9">N</tspan>':'R';
        if(v.Wp>0 && v.s>0) g+=arrow(E.cx,by+8,E.cx,by+8+pl3,'var(--wood-s)',3)+(L.tall ? txt(E.cx,by+23+pl3,'plank '+v.Wp+' N, '+v.s+' m from the pivot',{a:'middle',fs:11.5,c:'var(--ink)',w:600,halo:1})
          : txt(E.cx,by+22+pl3,'plank '+v.Wp+' N',{a:'middle',fs:12,c:'var(--ink)',w:600,halo:1})+txt(E.cx,by+35+pl3,v.s+' m from the pivot',{a:'middle',fs:11,c:'var(--ink-soft)',halo:1}));
        else if(v.Wp>0) g+=txt(E.cx,by+22+pl3,'plank '+v.Wp+' N: acts through the pivot',{a:'middle',fs:11,c:'var(--ink-soft)',halo:1});
        g+=arrow(x0,by+62,x0,by+27,'var(--accent)',3)+txt(x0+6,by+64,up,{fs:12,c:'var(--accent)',w:700,halo:1}); }
      function force(d, W, side, col, row){
        var x=x0+side*d*e, len=16+W/16, yd=by-(row?38:15), r='';
        // at IAL and IB a label that would sit on the plank's arrow or the pivot's force goes beside its own arrow, on the outside
        var near=kp() && (Math.abs(x-x0)<34 || (v.Wp>0 && v.s>0 && Math.abs(x-E.cx)<26));
        r+=arrow(x,by+8,x,by+8+len,col,3)+(near ? txt(x+side*8,by+8+len/2+4,W+' N',{a:side<0?'end':'start',fs:12,c:col,w:600,halo:1}) : txt(x,by+22+len,W+' N',{a:'middle',fs:12,c:col,w:600}));
        r+=ln(x0,yd,x,yd,'var(--ink-soft)',1.3)+ln(x0,yd-4,x0,yd+4,'var(--ink-soft)',1.3)+ln(x,yd-4,x,yd+4,'var(--ink-soft)',1.3)+ln(x,yd+4,x,by-1,'var(--ink-faint)',1,' stroke-dasharray="2 3"');
        r+=txt((x0+x)/2,yd-6,d+' m',{a:'middle',fs:12,c:'var(--ink)'});
        return r;
      }
      g+=force(v.d1,v.W1,-1,C1,0);
      if(v.d2!=null) g+=force(v.d2,v.W2,1,C2,1);
      else g+=txt(x0+1.4*e,by-21,'distance = ?',{a:'middle',fs:12,c:'var(--ink)'})+txt(x0+1.4*e,by+40,v.W2+' N',{a:'middle',fs:12,c:C2,w:600});
      return g;
    }
    // the two moments as bars; in Predict they stay as "?" until the question has been run
    function barsSVG(v){
      var M=L.M, hide=mode==='predict' && q && q.phase!=='done', acw=v.W1*v.d1+v.Wp*v.s, cw=v.d2==null?0:v.W2*v.d2, mx=Math.max(acw,cw,1), g='';
      [[kp()?'anticlockwise moments':'anticlockwise moment',acw,C1,'var(--p1)',false],[kp()?'clockwise moments':'clockwise moment',cw,C2,'var(--p2)',true]].forEach(function(r,i){ var y=M.y+i*50;
        g+=turnIcon(M.x+8,y+6,6.5,r[4],r[2])+txt(M.x+24,y+10,tw(r[0]),{fs:12,c:r[2],w:600})+txt(M.x+M.w,y+10,hide?'? N m':num(r[1],1)+' N m',{a:'end',fs:12.5,c:'var(--ink)',w:600});
        g+=rect(M.x,y+19,M.w-6,13,'var(--bg)',' rx="2"');
        if(!hide && r[1]>0) g+=box(M.x,y+19,(M.w-6)*r[1]/mx,13,4,-3,r[3]); });
      return g;
    }
    function draw(){
      var v=V(); L=lay(); L.cx+=v.s*L.pxm; svgEl.setAttribute('viewBox','0 0 '+L.W+' '+L.H); svgEl.classList.toggle('tall', !!L.tall);
      setKeepFocus(svgEl, sceneSVG(v)+examSVG(v)+barsSVG(v));
    }
    function animate(then){
      cancelAnimationFrame(raf);
      if(REDUCED_MOTION){ ang=target; draw(); if(then) then(); return; }
      var a0=ang, t0=performance.now(), wob=then && target===0 && a0===0;   // a balanced seesaw let go: it rocks a little and settles level
      (function step(now){ var k=Math.min(1,(now-t0)*SPEED()/(wob?1100:450)), e=1-Math.pow(1-k,3);
        ang = wob ? 1.6*Math.sin(k*Math.PI*3)*(1-k) : a0+(target-a0)*e; draw();
        if(k<1) raf=requestAnimationFrame(step); else if(then) then(); })(t0);
    }
    // IAL and IB (Explore): the sum of the moments each way, with the plank's own weight, then the force from the pivot
    function workingKS5(v){
      var a1=v.W1*v.d1, ap=v.Wp*v.s, acw=a1+ap, cw=v.W2*v.d2, diff=cw-acw, tot=v.W1+v.W2+v.Wp, up=level==='ib'?'F<sub>N</sub>':'R', h;
      h=(level==='ib' ? 'τ = Fr sin θ<br>'+WHY('Each weight is at 90° to the plank, so sin θ is 1 and τ is Fr.') : 'moment of force = Fx')+'<br>';
      h+=v.Wp>0 ? WHY('The plank’s weight acts at its centre of gravity, '+(v.s>0 ? v.s+' m to the left of the pivot.' : 'which is at the pivot, so it has no moment about the pivot.'))+'<br>' : '';
      h+='sum of anticlockwise moments = '+v.W1+' × '+v.d1+(ap>0?' + '+v.Wp+' × '+v.s:'')+'<br> = '+num(acw,1)+' N m<br>sum of clockwise moments = '+v.W2+' × '+v.d2+'<br> = '+num(cw,1)+' N m<br>';
      h+='<b>'+(diff===0 ? (level==='ib'?'Resultant torque is zero: rotational equilibrium':'The moments balance: equilibrium') : (diff>0?'Clockwise is bigger: the right side goes down':'Anticlockwise is bigger: the left side goes down'))+'</b><br>';
      h+=diff===0 ? WHY('In equilibrium the resultant force is zero too, so the pivot pushes up with the total weight:')+'<br>'+up+' = '+v.W1+' + '+v.W2+(v.Wp>0?' + '+v.Wp:'')+'<br>'+up+' = <b>'+tot+' N</b><br>'+WHY('This force acts through the pivot, so it has no moment about the pivot.')
        : WHY('The force from the pivot ('+up+') acts through the pivot, so it has no moment about it. That is why moments are taken about the pivot.');
      return h.replace(/ × /g,'\u00a0×\u00a0');
    }
    function workingOf(v){
      if(kp()) return workingKS5(v);
      var acw=v.W1*v.d1, cw=v.W2*v.d2, diff=cw-acw;
      return 'anticlockwise moment = '+v.W1+' × '+v.d1+' = '+num(acw,1)+' N m<br>clockwise moment = '+v.W2+' × '+v.d2+' = '+num(cw,1)+' N m<br><b>'+(diff===0?'Balanced':(diff>0?'Clockwise is bigger: the right side goes down':'Anticlockwise is bigger: the left side goes down'))+'</b>';
    }
    function upd(){
      var v=V(), acw=v.W1*v.d1+v.Wp*v.s, cw=v.W2*v.d2, diff=cw-acw;
      $('#ss-wpo').textContent=wp.value+' N'; $('#ss-so').textContent=(+sIn.value)+' m';
      $('#ss-w1o').textContent=w1.value+' N'; $('#ss-d1o').textContent=(+d1.value)+' m'; $('#ss-w2o').textContent=w2.value+' N'; $('#ss-d2o').textContent=(+d2.value)+' m';
      if(mode!=='explore') return;
      target=tilt(v);
      $('#ss-eq').innerHTML=tw(workingOf(v));
      var need=acw/v.W2;
      $('#ss-note').innerHTML = tw(diff===0 ? (kp() ? 'The clockwise and anticlockwise moments are equal, so the seesaw is in equilibrium. The pivot pushes up with '+(level==='ib'?'F<sub>N</sub>':'R')+' = '+(v.W1+v.W2+v.Wp)+' N, the total weight.' : 'The moments are equal, so the seesaw balances.') :
        FR('To balance with this right weight, it would need to sit at d = [['+num(acw,1)+'|'+w2.value+']] = '+num(need,2)+' m'+(need>2.5-v.s?', which is off the end of the seesaw.':'.')));
      animate();
    }

    /* ---- Predict ---- */
    function rnd(list){ return list[Math.floor(Math.random()*list.length)]; }
    var WS=[100,150,200,250,300,350,400,450,500,550,600,650,700,750,800];
    function deal(){
      var k, W1, W2, a, b, kind=nDealt%2?'seat':'side', bal=Math.random()<0.3, tricky=Math.random()<0.65; nDealt++;
      for(k=0;k<4000;k++){ W1=rnd(WS); W2=rnd(WS); a=rnd(SPOTS); b=rnd(SPOTS);
        if(kind==='seat'){ if(W1!==W2 && SPOTS.indexOf(W1*a/W2)>=0) break; continue; }
        if(W1===W2 || a===b) continue;
        var diff=W2*b-W1*a;
        if(bal ? diff===0 : (diff!==0 && (!tricky || (W2>W1)!==(diff>0)))) break; }
      q={kind:kind, W1:W1, d1:a, W2:W2, d2:b, pick:null, phase:'ask', ok:false};
      q.ans = kind==='seat' ? LET[SPOTS.indexOf(W1*a/W2)] : (W2*b===W1*a ? 'E' : (W2*b>W1*a ? 'R' : 'L'));
      ang=0; target=0; cancelAnimationFrame(raf); show();
    }
    function askText(){ return q.kind==='side' ? 'Predict: the seesaw is locked level. Which side goes down when it is let go? Click an arrow, or = if it stays balanced.'
      : 'Predict: the seesaw is locked level. Where must the '+q.W2+' N boy sit so that it stays balanced when it is let go? Click a letter.'; }
    function sideWord(id){ return id==='E' ? 'it stays balanced' : (id==='L' ? 'the left side goes down' : 'the right side goes down'); }
    function answerText(){
      var acw=q.W1*q.d1;
      if(q.kind==='side') return sideWord(q.ans)+'.';
      var dn=acw/q.W2; return 'it balances at '+q.ans+', '+dn+' m from the pivot.';
    }
    function show(){
      var pr=mode==='predict', v=V(), acw, n=$('#ss-note');
      $('#ss-sliders').hidden=pr; goBtn.hidden=!pr; newBtn.hidden=!pr; $('#ss-hint').hidden=pr; $('#ss-score').hidden=!pr;
      ['#ss-pl-name','#ss-wp-cell','#ss-s-cell'].forEach(function(id){ $(id).hidden=!ks5(); }); fitRight();
      if(!pr){ upd(); return; }
      goBtn.disabled = q.phase!=='ask' || !q.pick;
      $('#ss-score').textContent='Score: '+score[0]+' of '+score[1];
      if(q.phase!=='done'){
        n.className='note';
        n.innerHTML = q.kind==='side' ? '<b>Predict.</b> The seesaw is locked level. Which side goes down when it is let go? Click an arrow on the picture, or = if it stays balanced'+(q.pick?' (you chose: '+sideWord(q.pick)+')':'')+', then press <b>Go</b>.'
          : '<b>Predict.</b> The seesaw is locked level. Where must the '+q.W2+' N boy sit so that it stays balanced when it is let go? Click a letter on the picture'+(q.pick?' (you chose <b>'+q.pick+'</b>)':'')+', then press <b>Go</b>.';
        $('#ss-eq').innerHTML='Press Go to see the working.';
      } else {
        acw=q.W1*q.d1; n.className='note '+(q.ok?'good':'bad');
        if(q.kind==='side'){ var cw=q.W2*q.d2;
          n.innerHTML=(q.ok?'<b>✓ Right.</b> ':'<b>✗ Not quite.</b> ')+'Anticlockwise moment = '+num(acw,1)+' N m, clockwise moment = '+num(cw,1)+' N m: '+(cw===acw?'they are equal, so it stays balanced.':(cw>acw?'clockwise is bigger, so the right side goes down.':'anticlockwise is bigger, so the left side goes down.'))+(q.ok||q.ans==='E'?'':' The heavier person does not always win: the distance from the pivot matters too.');
          n.innerHTML=tw(n.innerHTML); $('#ss-eq').innerHTML=tw(workingOf(v));
        } else { var dn=acw/q.W2, dp=SPOTS[LET.indexOf(q.pick)];
          n.innerHTML=(q.ok?'<b>✓ Right.</b> ':'<b>✗ Not quite.</b> ')+'It balances at <b>'+q.ans+'</b>, '+dn+' m from the pivot: '+q.W2+' × '+dn+' = '+num(acw,1)+' N m, equal to the anticlockwise moment.'+(q.ok?'':' At '+q.pick+' ('+dp+' m) the clockwise moment is '+num(q.W2*dp,1)+' N m, so the '+(q.W2*dp>acw?'right':'left')+' side goes down.');
          n.innerHTML=tw(n.innerHTML); $('#ss-eq').innerHTML=tw(FR('anticlockwise moment = clockwise moment<br>'+q.W1+' × '+q.d1+' = '+q.W2+'d<br>'+num(acw,1)+' = '+q.W2+'d<br>d = [['+num(acw,1)+'|'+q.W2+']]<br>d = <b>'+dn+' m</b>'));
        }
      }
      draw();
    }
    onPick(svgEl,function(id){ if(mode!=='predict' || !q || q.phase!=='ask') return; q.pick=id; show(); });
    goBtn.addEventListener('click',function(){
      if(mode!=='predict' || !q || q.phase!=='ask' || !q.pick) return;
      q.phase='run'; goBtn.disabled=true; target=tilt(V());
      animate(function(){ q.phase='done'; q.ok=q.pick===q.ans; score[1]++; if(q.ok) score[0]++; show(); });
    });
    newBtn.addEventListener('click',deal);
    var modeEl=$('#ss-mode');
    modeEl.addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b || b.dataset.v===mode) return; mode=b.dataset.v;
      Array.prototype.forEach.call(modeEl.children,function(x){ x.setAttribute('aria-pressed',String(x===b)); });
      cancelAnimationFrame(raf); $('#ss-note').className='note';
      if(mode==='predict'){ if(!q || q.phase!=='ask') deal(); else { ang=0; show(); } } else { ang=0; show(); } });

    // drag a person along the beam (Explore): project the pointer onto the (tilted) beam, round to the slider's step
    var drag=null;
    function svgPt(e){ var p=svgEl.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; return p.matrixTransform(svgEl.getScreenCTM().inverse()); }
    function along(p){ var a=ang*Math.PI/180; return ((p.x-L.cx)*Math.cos(a)+(p.y-L.cy)*Math.sin(a))/L.pxm; }
    svgEl.addEventListener('pointerdown',function(e){
      var r=e.target.closest && e.target.closest('.grab'); if(!r || mode!=='explore') return;
      var side=+r.getAttribute('data-side'), el=side<0?d1:d2;
      drag={el:el, side:side, off:along(svgPt(e))-side*(+el.value)};
      svgEl.setPointerCapture(e.pointerId); svgEl.classList.add('dragging'); e.preventDefault();
    });
    svgEl.addEventListener('pointermove',function(e){
      if(!drag) return;
      var el=drag.el, v=drag.side*(along(svgPt(e))-drag.off);
      v=Math.max(+el.min, Math.min(+el.max, Math.round(v*4)/4));
      if(+el.value!==v){ el.value=v; upd(); }
    });
    function endDrag(){ if(!drag) return; drag=null; svgEl.classList.remove('dragging'); }
    svgEl.addEventListener('pointerup',endDrag); svgEl.addEventListener('pointercancel',endDrag);
    var wasNarrow=narrow(); window.addEventListener('resize',function(){ if(narrow()!==wasNarrow){ wasNarrow=narrow(); draw(); } });
    // no level switch in an IGCSE workout's frame, or when opened from the IGCSE list with ?level=igcse
    if(PW_LEVEL==='igcse' || (EMBED && !PW_LEVEL)) levelEl.hidden=true;
    if(PW_LEVEL==='ial' || PW_LEVEL==='ib'){ level=PW_LEVEL; Array.prototype.forEach.call(levelEl.children,function(x){ x.setAttribute('aria-pressed',String(x.dataset.v===PW_LEVEL)); }); }
    show();
  }
  watchEquals('.eq');
  initSeesawSim();
})();
</script>
