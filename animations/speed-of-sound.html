  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      linear-gradient(var(--bg-grid) 1px,transparent 1px) 0 0/100% 34px,
      linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px) 0 0/34px 100%,
      var(--bg);
    color:var(--ink); font-family:var(--font-body); font-size:14px; -webkit-font-smoothing:antialiased;
  }
  [hidden]{display:none!important;}
  button{font:inherit;color:inherit;}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;}

  .page{max-width:1400px;margin-inline:auto;padding-inline:20px;padding-block:12px 40px;}
  h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:0.2px;text-wrap:balance;margin:0;}
  p{margin:0;line-height:1.55;}

  .home-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-bottom:4px;font:600 13px var(--font-mono);color:var(--ink-soft);text-decoration:none;}
  .home-link:hover{color:var(--accent);}
  .page-head{margin-bottom:12px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px;}
  .eyebrow{font-family:var(--font-mono);font-size:11.5px;color:var(--accent);font-weight:600;margin-bottom:6px;}
  .page-head h1{font-size:clamp(28px,5vw,38px);color:var(--ink);}

  .card{background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;box-shadow:var(--shadow);}
  .btn{
    font-family:var(--font-body);font-weight:600;font-size:13.5px;color:var(--ink);
    background:var(--panel);border:1px solid var(--panel-border);border-radius:9px;
    padding:9px 15px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  }
  .btn:hover{border-color:var(--ink-faint);}
  .btn:disabled{opacity:.45;cursor:default;}
  .btn-primary{background:var(--ink);border-color:var(--ink);color:var(--bg);}
  .btn-primary:hover{opacity:.88;border-color:var(--ink);}
  .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);}
  .btn-group{display:flex;flex-wrap:wrap;gap:10px;}
  /* button rows fill their width (Alex, 2 Nov 2026) */
  .btn-group>.btn,.exp-btns>.btn{flex:1 1 0;min-width:max-content;justify-content:center;}
  .seg:not(.tabs){display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,96px),1fr));}
  .seg:not(.tabs)>button{padding-inline:4px;white-space:nowrap;}

  /* picture on the left with its buttons under it; choices, readings and working on the right */
  .stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,410px);gap:18px 24px;align-items:start;padding:18px;}
  @media (max-width:860px){ .stage{grid-template-columns:minmax(0,1fr);} }
  .view{display:block;width:100%;height:auto;max-height:max(260px,calc(100vh - 300px));}
  .view text{font-family:var(--font-mono);}
  .under{display:flex;flex-direction:column;gap:12px;margin-top:12px;}
  .sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px 24px;}
  .side{display:flex;flex-direction:column;gap:12px;min-width:0;}
  .lab{display:block;font:12.5px var(--font-mono);color:var(--ink-soft);margin-bottom:6px;}
  .lab output{color:var(--ink);font-weight:600;white-space:nowrap;margin-left:6px;}
  input[type=range]{width:100%;accent-color:var(--topic);min-height:28px;}
  .seg{display:flex;flex-wrap:wrap;gap:6px;}
  .seg button{font:12.5px var(--font-mono);padding:8px 11px;min-height:44px;border:1px solid var(--panel-border);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer;}
  .seg button[aria-pressed="true"]{background:var(--topic);border-color:var(--topic);color:var(--panel);}
  .seg button:disabled{opacity:.45;cursor:default;}
  .seg.tabs{gap:0;flex-wrap:nowrap;}
  .seg.tabs button{white-space:nowrap;border-radius:0;margin-left:-1px;}
  .seg.tabs button:first-child{border-radius:8px 0 0 8px;margin-left:0;}
  .seg.tabs button:last-child{border-radius:0 8px 8px 0;}
  .cgrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center;}
  .rowlab{font:11.5px var(--font-mono);color:var(--ink-faint);}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px;}
  .stat{border:1px solid var(--panel-border);border-radius:8px;padding:5px 8px;display:flex;flex-direction:column;justify-content:space-between;}
  .stat small{display:block;font:10.5px var(--font-mono);color:var(--ink-faint);}
  .stat strong{font:600 15px var(--font-mono);color:var(--ink);white-space:nowrap;}
  .stat.hi strong{color:var(--topic);}
  .note{font-size:15px;line-height:1.5;color:var(--ink);padding:10px 12px;border-radius:8px;background:var(--bg);min-height:4.6em;}
  .note b{color:var(--topic);}

  details.working summary{cursor:pointer;font:600 13px var(--font-mono);color:var(--topic);min-height:44px;display:flex;align-items:center;}
  .eq{font-family:var(--font-mono);font-size:14px;line-height:1.75;padding:8px 12px;border-left:3px solid var(--topic);background:var(--topic-soft);border-radius:6px;color:var(--ink);}
  .eq b{color:var(--topic);}
  .eq + .eq{margin-top:8px;}
  .eqnote{font-size:13.5px;color:var(--ink-soft);margin-top:8px;}
  .eqg{display:grid;grid-template-columns:auto auto minmax(0,1fr);column-gap:.45em;row-gap:.2em;align-items:center}
  .eqg-l{justify-self:end;text-align:right}
  .eqg-m{justify-self:center}
  .eqg-r{justify-self:start;min-width:0}
  .eqg-full{grid-column:1/-1}
  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1.25;}
  .frac>span{padding:0 .25em;white-space:nowrap;}
  .frac>span:first-child{border-bottom:1.5px solid currentColor;}
  @media (max-width:560px){ .stage{padding:12px;} .view{max-height:none;} .eq{font-size:12px;padding:6px 8px;} .note{font-size:14px;} }

  /* ===== Experiment kit (tools/experiment-kit/kit.css) ===== */
  .exp-btns{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;}
  #ss-svg.dragging,#ss-svg.dragging *{cursor:grabbing;}
  #ss-svg:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px;}
  .rtable{width:100%;border-collapse:collapse;font:12.5px var(--font-mono);}
  .rtable th{position:sticky;top:0;background:var(--panel);font-weight:600;font-size:11px;color:var(--ink-faint);text-align:right;padding:4px 6px;border-bottom:1px solid var(--panel-border);}
  .rtable td{text-align:right;padding:3px 6px;border-bottom:1px solid var(--panel-border);color:var(--ink);}
  .rtable tr.new td{background:var(--cs, var(--accent-soft));}
  .rtable-wrap{max-height:150px;overflow:auto;border:1px solid var(--panel-border);border-radius:8px;}
  @media (prefers-reduced-motion: no-preference){ .rtable tr.new td{animation:rowin .35s ease-out;} }
  @keyframes rowin{from{opacity:0}to{opacity:1}}
  /* ===== end of Experiment kit ===== */

  /* inside a workout tab (?embed): no page heading, no outer margins */
  .embed body{background:transparent;}
  .embed .page{padding:0;max-width:none;display:flow-root;}
  .embed .home-link,.embed .page-head{display:none;}
  .embed .view{max-height:460px;}
  #ss-svg{touch-action:pan-y;}
  /* measure mode (?show=measure): everything that reads, records or explains is hidden */
  .meas-off{display:none !important;}
  .embed .side>#ss-mode{align-self:flex-start;}
  #ss-svg sub{font-size:.8em;}
  /* Questions (?show=predict) */
  #ss-svg .pick{cursor:pointer;} #ss-svg .pick:focus{outline:none;} #ss-svg .pick .ring{fill:none;stroke:transparent;} #ss-svg .pick:focus-visible .ring{stroke:var(--accent);}
  #ss-svg .pick .hit{fill:transparent;} #ss-svg .pick.locked{cursor:default;}
  .qbox{display:flex;flex-direction:column;gap:10px;}
  #ss-kind{display:flex;flex-wrap:wrap;} #ss-kind>button{flex:0 1 auto;padding-inline:10px;}
  .ans{display:flex;align-items:center;gap:8px;font:600 15px var(--font-mono);color:var(--ink);flex-wrap:wrap;}
  .ans input{font:600 16px var(--font-mono);color:var(--ink);background:var(--panel);border:2px solid var(--topic);border-radius:8px;padding:8px 10px;min-height:44px;width:7.5em;}
  .ans input:disabled{opacity:.7;border-color:var(--panel-border);}
  .ans.ok input{border-color:var(--good);background:var(--good-soft);opacity:1;}
  .ans.no input{border-color:var(--bad);background:var(--bad-soft);opacity:1;}
  .rtable th sub{font-size:.85em;}

</style>

/* Choice rows (13 Nov 2026, Alex): in a .cgrid the label sits above its group, each group is only as wide as its

.to-q[hidden]{display:none!important;}
.to-q:nth-child(n){border-style:dashed;border-color:var(--ink);font-weight:600;}
</style>
<script>
  // Visit counter (GoatCounter: no cookies, no personal data). Skipped when a page is embedded in a workout, so a visit counts once.
  // pwCountTab(tab, label): counts each workout tab once per visit as a GoatCounter event (path "page#tab"), skipped in frames the same way.
  (function(){
    var off = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var seen = {}, queue = [];
    function send(e){ try { window.goatcounter.count(e); } catch (x) {} }
    window.pwCountTab = function(tab, label){
      if (off || !tab || seen[tab]) return;
      seen[tab] = 1;
      var page = (location.pathname.split('/').pop() || 'index').replace(/\.html$/, '');
      var e = { path: page + '#' + tab, title: (label || tab) + ' · ' + document.title, event: true };
      if (window.goatcounter && window.goatcounter.count) send(e); else queue.push(e);
    };
    if (off) return;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://gc.zgo.at/count.js';
    s.setAttribute('data-goatcounter', 'https://physics-workout.goatcounter.com/count');
    s.onload = function(){ var q = queue; queue = []; q.forEach(send); };
    document.head.appendChild(s);
  })();
</script>

<script>
  // Draft tags and Alex's reviewer button (tools/review/drafts.py writes this block; edit tools/review/snippet.html, then run drafts.py sync).
  // A page is Draft while its row in tools/REVIEW.md is not ✅: <meta name="pw-draft"> on the page, data-draft on its list cards.
  // ?reviewer (once, on any page) turns on reviewer mode in this browser; ?reviewer=off turns it off.
  (function(){
    var on = false, embed = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var m = /[?&]reviewer(?:=([^&]*))?/.exec(location.search);
    on = !!m && m[1] !== 'off';
    try {
      if (m) { if (m[1] === 'off') localStorage.removeItem('pw-reviewer'); else localStorage.setItem('pw-reviewer', '1'); }
      else on = localStorage.getItem('pw-reviewer') === '1';
    } catch (e) {}
    var CSS = '.pw-draft{display:inline-block;vertical-align:middle;margin-left:10px;font:600 11.5px/1.4 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:0;color:var(--bad,#b42318);border:1px dashed currentColor;border-radius:5px;padding:1px 7px;white-space:nowrap}'
      + '.act-top .pw-draft{margin-left:auto;flex:none}.act-top .pw-draft~.cp-tag,.act-top .pw-draft~.ta-tag{margin-left:0}'
      + 'a[data-draft]{position:relative}.pw-draft.pw-corner{position:absolute;top:10px;right:10px;margin:0;background:var(--panel,#fff)}'
      + '.pw-check{display:inline-block;vertical-align:middle;margin-left:8px;font:600 13px/1.4 "IBM Plex Sans",system-ui,sans-serif;color:#fff;background:#1a7f37;border-radius:6px;padding:4px 10px;text-decoration:none;white-space:nowrap}'
      + '.pw-check:hover{background:#116329}.pw-check:focus-visible{outline:2px solid #1a7f37;outline-offset:2px}'
      + '.pw-reviewer{position:fixed;left:10px;bottom:10px;z-index:9999;font:500 12px/1.4 "IBM Plex Mono",ui-monospace,monospace;background:#1d2433;color:#fff;border-radius:6px;padding:4px 9px;opacity:.85}'
      + '.pw-reviewer a{color:#ffc83d}';

  function sci(x, dp){   // 4.97 × 10⁻¹⁹
    if(x===0) return '0';
    var e = Math.floor(Math.log10(Math.abs(x))), m = x/Math.pow(10,e);

  function sig(x, n){   // n significant figures, as text, real minus sign
    if(x===0) return '0';
    var dp = Math.max(0, n-1-Math.floor(Math.log10(Math.abs(x))));

/* ================= Experiment kit (copy this block into an animation page's <script>) =================
   The reusable parts of an animation's Experiment mode, taken from animations/hookes-law.html:
   - expRun():     the run itself: step the independent variable up one interval at a time, then
                   (optionally) back down again, measuring at every step
   - expReading(): a reading with a small, fixed pattern of reading error, rounded to the instrument's
                   resolution, that never goes the wrong way
   - expTable():   the results table (sticky header, newest row highlighted, a column per run)
   - expCross(), expRing(), expKey(): SVG marks for plotted readings (× first run, ○ return run)
   The page keeps its own picture, physics, graph axes and notes. See tools/experiment-kit/README.md.
   Plain ES5 so it can sit inside any animation page's IIFE. */

// A fixed pattern of reading errors, in units of the instrument's resolution. Fixed (not random) so a
// teacher sees the same results as the class, and a re-run gives the same table.
var EXP_ERR = [0, 1, -1, 0, 2, -1, 1, -2, 0, 1, -1, 0, 1, -1, 2, 0, -1, 1, 0, -2, 1];
function expErr(i){ return EXP_ERR[((i % EXP_ERR.length) + EXP_ERR.length) % EXP_ERR.length]; }

// What the student reads off the instrument.
//   trueVal  the value the physics gives at this step
//   prevVal  the reading taken at the step before (or the start value)
//   res      the instrument's resolution (0.1 cm ruler, 0.05 mm vernier, 0.01 A ammeter, 1° protractor)
//   i        the step number (picks the error from the pattern)
//   scale    how big the error is, in resolutions (default 1; 0.5 for a fine instrument)
// The error is never more than a quarter of the change since the last reading, so a reading never
// goes the wrong way (an extension never falls as the load rises, a current never drops as V rises).
function expReading(trueVal, prevVal, res, i, scale){
  var gap = Math.abs(trueVal - prevVal);
  var err = i > 0 ? expErr(i) * Math.min(res * (scale == null ? 1 : scale), gap / 4) : 0;
  var r = Math.round((trueVal + err) / res) * res;
  var dp = Math.max(0, Math.ceil(-Math.log10(res) - 1e-9));
  return +r.toFixed(dp);
}

// The run. cfg = {
//   start: 0,                 value of the independent variable before the first step
//   max: 10,                  last value of the first run (the run stops there)
//   step: 1,                  the interval (the page can change it with setStep, which resets the run)
//   reverse: true,            allow a return run (unloading, turning the voltage back down)
//   measure: function(v, phase, prevReading){ return reading },   phase is 'up' or 'down'
//   onChange: function(run, what){}  what is 'up', 'down' or 'reset'
// }
// run.up and run.down are arrays of {v, r}. run.phase is 'up' until the first step back, then 'down'.
function expRun(cfg){
  var run = { up: [], down: [], phase: 'up', value: cfg.start || 0, peak: cfg.start || 0, step: cfg.step || 1 };
  var r6 = function(x){ return Math.round(x * 1e6) / 1e6; };
  run.upDone = function(){ return run.phase === 'down' || run.peak >= cfg.max - 1e-9; };
  run.downDone = function(){ return run.phase === 'down' && run.value <= (cfg.start || 0) + 1e-9; };
  run.last = function(){ var a = run.phase === 'down' && run.down.length ? run.down : run.up; return a[a.length - 1] || null; };
  run.stepUp = function(){
    if(run.phase !== 'up' || run.upDone()) return false;
    var prev = run.up.length ? run.up[run.up.length - 1].r : null;
    var v = r6(Math.min(cfg.max, run.value + run.step));
    run.value = run.peak = v;
    run.up.push({ v: v, r: cfg.measure(v, 'up', prev) });
    if(cfg.onChange) cfg.onChange(run, 'up');
    return true;
  };
  run.stepDown = function(){
    if(!cfg.reverse || run.value <= (cfg.start || 0) + 1e-9 || !run.up.length) return false;
    run.phase = 'down';
    var prev = run.down.length ? run.down[run.down.length - 1].r : run.up[run.up.length - 1].r;
    var v = r6(Math.max(cfg.start || 0, run.value - run.step));
    run.value = v;
    run.down.push({ v: v, r: cfg.measure(v, 'down', prev) });
    if(cfg.onChange) cfg.onChange(run, 'down');
    return true;
  };
  run.reset = function(){ run.up = []; run.down = []; run.phase = 'up'; run.value = run.peak = cfg.start || 0; if(cfg.onChange) cfg.onChange(run, 'reset'); };
  run.setStep = function(s){ run.step = s; run.reset(); };
  return run;
}

// The results table. cols = [{label:'Load (N)', key:'v', dp:0}, {label:'Extension loading (cm)', key:'up', dp:1}, ...]
// rows = [{v:1, up:1.6, down:''}, ...]. newKey/newV highlight the reading just taken (fades in).
// Wrap it in .rtable-wrap so a long table scrolls under its sticky header.
function expTable(el, cols, rows, newV){
  var fmt = function(x, dp){ return (x === '' || x == null) ? '' : (+x).toFixed(dp || 0); };
  var h = '<table class="rtable"><thead><tr>' + cols.map(function(c){ return '<th>' + c.label + '</th>'; }).join('') + '</tr></thead><tbody>';
  rows.forEach(function(row){
    h += '<tr' + (newV != null && row.v === newV ? ' class="new"' : '') + '>' + cols.map(function(c){ return '<td>' + fmt(row[c.key], c.dp) + '</td>'; }).join('') + '</tr>';
  });
  el.innerHTML = h + '</tbody></table>';
}

// Plotted readings, as SVG strings. Size 5 suits a 300px-wide graph.
function expCross(cx, cy, s){ s = s || 5; return '<path d="M' + (cx - s) + ',' + (cy - s) + ' L' + (cx + s) + ',' + (cy + s) + ' M' + (cx + s) + ',' + (cy - s) + ' L' + (cx - s) + ',' + (cy + s) + '" stroke="var(--ink)" stroke-width="2"/>'; }
function expRing(cx, cy, r){ return '<circle cx="' + cx + '" cy="' + cy + '" r="' + (r || 4.5) + '" fill="none" stroke="var(--accent)" stroke-width="2"/>'; }
// A two-line key in the bottom-right corner of a graph: expKey(rightX, bottomY, 'loading', 'unloading')
function expKey(x, y, upLabel, downLabel){
  return '<text x="' + x + '" y="' + (y - 14) + '" text-anchor="end" font-size="10.5" fill="var(--ink)">× ' + upLabel + '</text>' +
         '<text x="' + x + '" y="' + y + '" text-anchor="end" font-size="10.5" fill="var(--accent)">○ ' + downLabel + '</text>';
}
/* ================= end of Experiment kit ================= */

  // ---- solid kit (the same block is in roller-coaster-energy.html, heat-transfer.html, density.html and liquid-pressure.html) ----
  function f1(n){ return (+n).toFixed(1); }
  function pts(list){ return list.map(function(p){ return f1(p[0])+','+f1(p[1]); }).join(' '); }
  function pl(list,col,w,extra){ return '<polyline points="'+pts(list)+'" fill="none" stroke="'+col+'" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round"'+(extra||'')+'/>'; }
  function pg(list,fill,extra){ return '<polygon points="'+pts(list)+'" fill="'+fill+'"'+(extra||'')+'/>'; }
  function ln(x1,y1,x2,y2,col,w,extra){ return '<line x1="'+f1(x1)+'" y1="'+f1(y1)+'" x2="'+f1(x2)+'" y2="'+f1(y2)+'" stroke="'+col+'" stroke-width="'+(w||1)+'"'+(extra||'')+'/>'; }
  function rect(x,y,w,h,fill,extra){ return '<rect x="'+f1(x)+'" y="'+f1(y)+'" width="'+f1(Math.max(0,w))+'" height="'+f1(Math.max(0,h))+'" fill="'+fill+'"'+(extra||'')+'/>'; }
  // text in clear space: halo:1 gives it a panel-coloured edge so a line passing behind never cuts a letter
  function txt(x,y,s,o){ o=o||{}; return '<text x="'+f1(x)+'" y="'+f1(y)+'"'+(o.a?' text-anchor="'+o.a+'"':'')+' font-size="'+(o.fs||12)+'" fill="'+(o.c||'var(--ink-soft)')+'"'+(o.w?' font-weight="'+o.w+'"':'')+(o.halo?' paint-order="stroke" stroke="var(--panel)" stroke-width="4" stroke-linejoin="round"':'')+(o.x||'')+'>'+s+'</text>'; }
  // a solid block: front face at (x, y), w wide and h tall, going back by (dx, dy). Lit top, plain front, darker side.
  function box(x,y,w,h,dx,dy,col,o){ o=o||{};
    return pg([[x,y],[x+w,y],[x+w+dx,y+dy],[x+dx,y+dy]],o.top||col)+(o.top?'':pg([[x,y],[x+w,y],[x+w+dx,y+dy],[x+dx,y+dy]],'#fff',' opacity=".38"'))+
      pg([[x+w,y],[x+w+dx,y+dy],[x+w+dx,y+h+dy],[x+w,y+h]],o.side||col)+(o.side?'':pg([[x+w,y],[x+w+dx,y+dy],[x+w+dx,y+h+dy],[x+w,y+h]],'#000',' opacity=".28"'))+
      rect(x,y,w,h,col); }
  // a round bar or post: a dark core with a lighter streak along it
  function tube(x1,y1,x2,y2,w,col,hi){ var L=Math.hypot(x2-x1,y2-y1)||1, nx=-(y2-y1)/L*w*0.22, ny=(x2-x1)/L*w*0.22; if(ny>0){ nx=-nx; ny=-ny; }
    return ln(x1,y1,x2,y2,col,w,' stroke-linecap="round"')+ln(x1+nx,y1+ny,x2+nx,y2+ny,hi,Math.max(0.8,w*0.3),' stroke-linecap="round"'); }
  function wrapLines(s,n){ var out=[], cur=''; String(s).split(' ').forEach(function(w){ if(cur && (cur+' '+w).length>n){ out.push(cur); cur=w; } else cur=cur?cur+' '+w:w; }); if(cur) out.push(cur); return out; }
  function onPick(svg, fn){
    svg.addEventListener('click', function(e){ var t=e.target.closest('.pick'); if(t){ fn(t.getAttribute('data-pick')); } });
    svg.addEventListener('keydown', function(e){ if(e.key!=='Enter' && e.key!==' ') return; var t=e.target.closest('.pick'); if(t){ e.preventDefault(); fn(t.getAttribute('data-pick')); } });
  }
  function setKeepFocus(el, html){ var f=document.activeElement, k=f && el.contains(f) ? f.getAttribute('data-pick') : null; el.innerHTML=html;
    if(k!==null){ var n=el.querySelector('.pick[data-pick="'+k+'"]'); if(n && n.focus) n.focus(); } }
  function ell(cx,cy,rx,ry,fill,extra){ return '<ellipse cx="'+f1(cx)+'" cy="'+f1(cy)+'" rx="'+f1(rx)+'" ry="'+f1(ry)+'" fill="'+fill+'"'+(extra||'')+'/>'; }
  // a solid arrow from (x1, y1) to its tip at (x2, y2)
  function arrow(x1,y1,x2,y2,col,w,extra){ var a=Math.atan2(y2-y1,x2-x1), s=w*2.2, bx=x2-Math.cos(a)*s*1.5, by=y2-Math.sin(a)*s*1.5;
    return '<g'+(extra||'')+'>'+ln(x1,y1,bx,by,col,w)+'<path d="M'+f1(x2)+','+f1(y2)+' L'+f1(bx-Math.sin(a)*s)+','+f1(by+Math.cos(a)*s)+' L'+f1(bx+Math.sin(a)*s)+','+f1(by-Math.cos(a)*s)+' z" fill="'+col+'"/></g>'; }
  // an upright cylinder (a can, a beaker of liquid): top ellipse at yt, bottom at yb. o.top fills the top; o.hi adds a streak of light.
  function cyl(cx,yt,yb,rx,ry,fill,o){ o=o||{};
    return '<path d="M'+f1(cx-rx)+','+f1(yt)+' L'+f1(cx-rx)+','+f1(yb)+' A'+f1(rx)+','+f1(ry)+' 0 0 0 '+f1(cx+rx)+','+f1(yb)+' L'+f1(cx+rx)+','+f1(yt)+' z" fill="'+fill+'"'+(o.extra||'')+'/>'+
      '<path d="M'+f1(cx+rx*0.45)+','+f1(yt)+' L'+f1(cx+rx*0.45)+','+f1(yb+ry*0.85)+' A'+f1(rx)+','+f1(ry)+' 0 0 0 '+f1(cx+rx)+','+f1(yb)+' L'+f1(cx+rx)+','+f1(yt)+' z" fill="#000" opacity="'+(o.shade==null?0.16:o.shade)+'"/>'+
      (o.hi?ln(cx-rx*0.62,yt+ry+4,cx-rx*0.62,yb-2,o.hi,Math.max(1.6,rx*0.11),' stroke-linecap="round" opacity="'+(o.hiop||0.7)+'"'):'')+
      ell(cx,yt,rx,ry,o.top||fill,o.topx||'')+(o.top?'':ell(cx,yt,rx,ry,'#fff',' opacity=".3"')); }
  // a glass thermometer standing upright: bulb at (x, yb); the scale runs from t0 at y0 up to t1 at y1, and the thread stands at T.
  // o.step: a tick every so many degrees; o.num: a number every so many; o.side: numbers on the right (1) or the left (-1); o.from: first tick;
  // o.nobulb: the bulb is out of sight, inside a can or a cube

    for(v=0; v<=a.y1+1e-9; v+=a.ys){ var Y=gy(a,v); g+=ln(G.x, Y, G.x+G.w, Y, 'var(--panel-border)', 1)+T(G.x-5, Y+4*FS, sn(v,a.dpy), {a:'end', fs:11, c:'var(--ink-faint)'}); }
    g+=ln(G.x, G.y, G.x, G.y+G.h, 'var(--ink-soft)', 2)+ln(G.x, G.y+G.h, G.x+G.w, G.y+G.h, 'var(--ink-soft)', 2);
    g+=T(G.x-30*FS, G.y-12*FS, a.yl, {fs:12}); g+=T(G.x+G.w/2, G.y+G.h+35*FS, a.xl, {a:'middle', fs:12});

      g+=T(gx(a,xe)-6, gy(a,k*xe)+18*FS, 'sound', {a:'end', fs:12, c:'var(--sound)', halo:1});
      if(m==='direct'){ g+=ln(G.x+2, G.y+G.h, G.x+2, G.y+2, 'var(--light)', 3.2); g+=T(G.x+9, G.y+14*FS, 'light', {fs:12, c:'var(--light-ink)', halo:1}); }
      var Y0=yOf(d()), X0=Y0/k;
      g+=ln(G.x, gy(a,Y0), gx(a,X0), gy(a,Y0), 'var(--ink-faint)', 1, ' stroke-dasharray="3 3"')+ln(gx(a,X0), gy(a,Y0), gx(a,X0), G.y+G.h, 'var(--ink-faint)', 1, ' stroke-dasharray="3 3"');
      // where the sound has got to now

      } else g+='<circle cx="'+gx(a,X0).toFixed(1)+'" cy="'+gy(a,Y0).toFixed(1)+'" r="5" fill="var(--sound)" stroke="var(--panel)" stroke-width="1.5"/>';

    } else {
      var rs=rowsNow();
      if(!rs.length) g+=T(G.x+G.w/2, G.y+G.h/2, 'readings appear here', {a:'middle', fs:12, c:'var(--ink-faint)'});
      rs.forEach(function(r){
        var ts=r.ts, mean=ts.reduce(function(s,x){ return s+x; },0)/ts.length, x=mean/N(), y=yOf(r.v);
        if(x<=a.x1 && y<=a.y1) g+=r.mean!==null ? expCross(+gx(a,x).toFixed(1), +gy(a,y).toFixed(1), 4.5) : '<circle cx="'+gx(a,x).toFixed(1)+'" cy="'+gy(a,y).toFixed(1)+'" r="2.2" fill="var(--ink-faint)"/>';

  }

  // ---- Questions (?show=predict; TODO 8h, 14 Nov 2026). The kinds come from the 4PH1 Paper 2 questions in the IGCSE Question Index:
  //   Direct: the speed from a distance and a stopwatch time (May 2015 1P Q13(b), Jan 2022 2PR Q3, Nov 2005 Q10(d));
  //   Echo: one echo (Nov 2024 2P Q8(b): 65 m, 0.35 s there and back) or 20 echoes in time with the claps (May 2024 2PR Q7(b)(iv));
  //   Two microphones: the time between the pulses read off the oscilloscope (Nov 2010 Q16(b)(i), Nov 2020 2PR Q4(a));
  //   Where to stand? the distance that gives the most accurate speed, because of the reaction time (Jan 2022 2PR Q3(b)(iii), May 2024 2PR Q7(a)).

  var qKind='mix', qLast='', qSaved=null, ansIn=$('#ss-ans');

  function rstep(lo, hi, st){ var n=Math.round((hi-lo)/st); return +(lo+st*Math.floor(Math.random()*(n+1))).toFixed(2); }

  function genQ(k){
    var v=rpick([320,325,330,335,340,345,350]), q={kind:k}, i;
    for(i=0;i<300;i++){
      if(k==='direct'){ q.d=rstep(100,400,10); q.t=+(q.d/v).toFixed(2); q.ans=q.d/q.t; }
      else if(k==='echo'){ q.n=Math.random()<0.5 ? 1 : 20; q.d=q.n>1 ? rstep(50,130,10) : rstep(40,130,5); q.t=+(2*q.d*q.n/v).toFixed(2); q.ans=2*q.d*q.n/q.t; }
      else if(k==='mics'){ q.d=rstep(0.3,1.5,0.05); q.div=rstep(1,8.8,0.2); q.dt=q.div*TB; q.ans=q.d/(q.dt/1000); if(q.ans<315 || q.ans>365) continue;
        q.lo=q.d/((q.div+0.1)*TB/1000); q.hi=q.d/((q.div-0.1)*TB/1000); }

    }

    return q;
  }
  // the run, as a still picture before Go (finished: the stopwatch shows the reading, the traces are drawn) or played on Go
  function qRun(still){
    var q=Q, o={kind:'q', mode:q.kind==='stand' ? 'direct' : q.kind, t:0, v:q.v, still:still};
    if(q.kind==='direct'){ o.tSound=q.d/q.v; o.start=0; o.stop=q.t; o.tEnd=q.t+0.35; o.rate=0.25; o.reading=q.t; }
    else if(q.kind==='echo'){ o.T=2*q.d/q.v; o.n=q.n; o.claps=q.n>1 ? q.n+1 : 1; o.start=0; o.stop=q.t; o.tEnd=q.t+0.25; o.rate=q.n>1 ? Math.max(1, o.tEnd/3.5) : 0.5; o.reading=q.t; }

    else { o.start=0; o.stop=0; o.tEnd=q.cands[2]/q.v+0.3; o.rate=0.3; }
    if(still){ o.t=o.tEnd; o.over=true; }
    return o;
  }
  function newQ(){
    stop();

    Q=genQ(k); qLast=Q.sig; Q.pick=null; Q.locked=false; Q.marked=false;
    modeSeg.pick(k==='stand' ? 'direct' : k);
    if(k!=='stand') dv[mode()]=Q.d;
    if(k==='echo') nSeg.pick(String(Q.n));

    gPicks.innerHTML=''; setAria(); draw();
  }
  function qText(){
    var tall=narrowQ.matches, s=Q.marked ? Q.verdict : (Q.kind==='stand' ? 'Where should Sophie stand: A, B or C?' : 'Find the speed of sound.'), g='';
    var x=tall ? 8 : 598, y=tall ? (Q.kind==='mics' ? 350 : (Q.kind==='echo' ? 40 : 22)*FS) : 40, lines=wrapLines(s, tall ? 34 : 30);
    lines.slice(0,3).forEach(function(l,i){ g+=T(x, y+i*17*FS, l, {fs:13.5, w:600, c:Q.marked ? (Q.ok ? 'var(--good)' : 'var(--bad)') : 'var(--ink)', halo:1}); });
    if(Q.kind==='stand' && Q.marked && !tall){
      var yy=y+lines.length*17+16;

      Q.cands.forEach(function(c,i){ g+=T(x, yy+18*(i+1), 'ABC'.charAt(i)+', '+c+' m: '+(c/Q.v).toFixed(2)+' s', {fs:12.5, c:'var(--ink)', w:i===2?600:400}); });
      g+=T(x, yy+18*4+6, 'Reaction time: about 0.2 s', {fs:12.5, c:'var(--ink-soft)'});

  }
  function drawPicks(){
    var g='';

      var fy=GY-5;
      Q.cands.forEach(function(c,i){ var k='ABC'.charAt(i), x=AX+c*PXd, on=Q.pick===k, top=fy-96*PK;
        var col = Q.marked ? (k===Q.ans ? 'var(--good)' : on ? 'var(--bad)' : '') : on ? 'var(--accent)' : '';
        g+='<g class="pick'+(Q.locked?' locked':'')+'" data-pick="'+k+'" tabindex="0" role="button" aria-pressed="'+on+'" aria-label="Place '+k+', '+c+' m from Ali'+(on?', your choice':'')+(Q.marked && k===Q.ans?', the right answer':'')+'">'+
          '<rect class="hit" x="'+f1(x-24)+'" y="'+f1(top-26*FS)+'" width="48" height="'+f1(fy-top+26*FS+14)+'"/>'+
          '<rect class="ring" x="'+f1(x-20)+'" y="'+f1(top-24*FS)+'" width="40" height="'+f1(fy-top+24*FS+10)+'" rx="8" stroke-width="2.5"/>'+
          (on ? '' : '<ellipse cx="'+f1(x)+'" cy="'+f1(fy)+'" rx="15" ry="4" fill="none" stroke="var(--ink-soft)" stroke-width="1.6" stroke-dasharray="4 3"/>')+
          (col ? '<rect x="'+f1(x-20)+'" y="'+f1(top-24*FS)+'" width="40" height="'+f1(fy-top+24*FS+10)+'" rx="8" fill="none" stroke="'+col+'" stroke-width="3"/>' : '')+
          T(x, top-8*FS, k+(Q.marked && (k===Q.ans || on) ? (k===Q.ans ? ' ✓' : ' ✗') : ''), {a:'middle', fs:15, w:700, c:col||'var(--ink)', halo:1})+'</g>';
      });
    }
    setKeepFocus(gPicks, g);
  }
  function readAns(){
    var t=ansIn.value.trim().replace(/[\s  ]/g,'').replace(/[−–]/g,'-');
    if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(t)) t=t.replace(/,/g,''); else t=t.replace(',','.');
    return t==='' || isNaN(+t) ? null : +t;
  }
  function near(a, b){ return Math.abs(a-b)<=Math.max(0.05, Math.abs(b)*0.02); }
  function qMark(){
    var q=Q, v=q.val, A=vTxt(q.ans)+' m/s', why;
    if(q.kind==='stand'){
      q.ok=q.pick===q.ans;
      var tA_=(q.cands[0]/q.v).toFixed(2), tC=(q.cands[2]/q.v).toFixed(2);
      q.verdict=(q.ok?'✓ ':'✗ ')+'C, the furthest';
      why=(q.ok ? '✓ Correct: C, the furthest place.' : '✗ The furthest place, C, gives the most accurate value.')+' Sophie’s reaction time is about 0.2 s wherever she stands. At A the sound takes only '+tA_+' s, so her reaction time is a large part of the time she measures; at C it takes '+tC+' s, so the reaction time matters much less.';
    } else {
      q.ok = q.kind==='mics' ? (v>=q.lo*0.99 && v<=q.hi*1.01) : near(v, q.ans);
      q.verdict=(q.ok?'✓ ':'✗ ')+'speed = '+A;
      if(q.kind==='direct'){
        why = q.ok ? '✓ Correct: speed = distance ÷ time = '+q.d+' ÷ '+q.t.toFixed(2)+' = '+A+'.' :
          near(v, q.t/q.d) ? '✗ That is time ÷ distance. Speed = distance ÷ time = '+q.d+' ÷ '+q.t.toFixed(2)+' = '+A+'.' :
          '✗ Not quite: speed = distance ÷ time = '+q.d+' ÷ '+q.t.toFixed(2)+' = '+A+'.';
      } else if(q.kind==='echo'){
        var dist=2*q.d*q.n;
        var tail = 'speed = '+dist+' ÷ '+q.t.toFixed(2)+' = '+A+'.', base = q.n>1 ? 'In '+q.t.toFixed(2)+' s the sound makes 20 trips to the wall and back: 20 × 2 × '+q.d+' = '+dist+' m, so speed = '+dist+' ÷ '+q.t.toFixed(2)+' = '+A+'.' : 'The sound goes to the wall and back: 2 × '+q.d+' = '+dist+' m, so speed = '+dist+' ÷ '+q.t.toFixed(2)+' = '+A+'.';
        why = q.ok ? '✓ Correct. '+base :
          near(v, q.ans/2) ? (q.n>1 ? '✗ Each echo is a trip to the wall and back, so count twice the distance to the wall. '+base : '✗ The sound goes to the wall and back, so it travels twice the distance to the wall: 2 × '+q.d+' = '+dist+' m, and '+tail) :
          (q.n>1 && (near(v, q.ans/20) || near(v, q.ans/40))) ? '✗ That time is for 20 echoes: divide it by 20 (or count all 20 trips). '+base :
          '✗ Not quite. '+base;
      } else {
        var dts=q.dt/1000, base2='The pulses are '+q.div+' divisions apart, so Δt = '+q.div+' × 0.5 ms = '+sig(q.dt,3)+' ms = '+sig(dts,3)+' s, and speed = '+sn(q.d,2)+' ÷ '+sig(dts,3)+' = '+A+'.';
        why = q.ok ? '✓ Correct. '+base2 :
          near(v, q.ans/1000) ? '✗ Change Δt to seconds before you divide. '+base2 :
          near(v, q.d/q.div) ? '✗ Multiply the divisions by the time base (0.5 ms per division) to get Δt. '+base2 :
          '✗ Not quite. '+base2;
      }
    }
    q.why=why; q.marked=true;
    if(q.kind!=='stand') $('#ss-ans-row').classList.add(q.ok ? 'ok' : 'no');
    draw();
  }
  function qWorking(){
    var q=Q;
    if(!q.marked) return ['', '', 'The working appears after you press Go.'];
    if(q.kind==='direct') return ['speed = [[distance|time]]<br>speed = [['+q.d+'|'+q.t.toFixed(2)+']]<br>speed = <b>'+vTxt(q.ans)+' m/s</b>', '', 'Light reaches Sophie almost at once, so the stopwatch time is the time the sound takes.'];
    if(q.kind==='echo'){ var dist=2*q.d*q.n;
      return [(q.n>1 ? 'distance = 20 × 2 × '+q.d : 'distance = 2 × '+q.d)+'<br>distance = '+dist+' m<br>speed = [[distance|time]]<br>speed = [['+dist+'|'+q.t.toFixed(2)+']]<br>speed = <b>'+vTxt(q.ans)+' m/s</b>', '',
        q.n>1 ? 'Timing 20 echoes makes the reaction time at the start and the stop a much smaller part of the time measured.' : 'One echo takes under a second, which is short to time by hand: timing 20 echoes is more accurate.']; }
    if(q.kind==='mics') return ['Δt = divisions × time base<br>Δt = '+q.div+' × 0.5<br>Δt = '+sig(q.dt,3)+' ms<br>Δt = '+sig(q.dt/1000,3)+' s', 'speed = [[distance|time]]<br>speed = [['+sn(q.d,2)+'|'+sig(q.dt/1000,3)+']]<br>speed = <b>'+vTxt(q.ans)+' m/s</b>', 'No one has to react, so there is no reaction time in this method.'];
    return ['', '', 'Time the sound over a long distance, so the reaction time is a small part of the time measured.'];
  }
  function qReadings(){
    var q=Q, busy=run && !run.still && !run.over, note;
    if(!q) return;
    if(q.marked) note=q.why;
    else if(busy) note = q.kind==='mics' ? 'The hammer hits the plate; the oscilloscope starts its trace when the sound reaches microphone A.' : q.kind==='stand' ? 'Ali bangs the blocks. Watch how long the sound takes to reach each place.' : q.kind==='echo' ? (q.n>1 ? 'Ali claps in time with the echoes. Sophie times 20 echoes.' : 'Sophie starts the stopwatch at the clap and stops it at the echo.') : 'Sophie starts the stopwatch when she sees the blocks hit, and stops it when she hears the bang.';
    else if(q.kind==='direct') note='Ali bangs two blocks together <b>'+q.d+' m</b> from Sophie. She starts her stopwatch when she sees the blocks hit and stops it when she hears the bang. The stopwatch reads <b>'+q.t.toFixed(2)+' s</b>. Calculate the speed of sound, then press <b>Go</b>.';
    else if(q.kind==='echo') note = q.n>1 ? 'Ali stands <b>'+q.d+' m</b> from a wall and claps so that each clap is at the same moment as the echo of the one before. Sophie times <b>20 echoes</b> (from the first clap to the 21st): <b>'+q.t.toFixed(2)+' s</b>. Calculate the speed of sound, then press <b>Go</b>.'
      : 'Ali stands <b>'+q.d+' m</b> from a large wall and claps. Sophie times from the clap to the echo: <b>'+q.t.toFixed(2)+' s</b>. Calculate the speed of sound, then press <b>Go</b>.';
    else if(q.kind==='mics') note='Microphones A and B are <b>'+sn(q.d,2)+' m</b> apart. The oscilloscope (time base <b>0.5 ms per division</b>) shows the pulse reaching A, then B. Read the time between the pulses and calculate the speed of sound, then press <b>Go</b>.';
    else note='Sophie will time the sound of Ali’s blocks with a stopwatch. She can stand at A, B or C. Where should she stand to get the most accurate value for the speed of sound? Click a place, then press <b>Go</b>.';
    var w=qWorking();
    $('#ss-eq1').innerHTML=FR(w[0]); $('#ss-eq1').hidden=!w[0]; $('#ss-eq2').innerHTML=FR(w[1]); $('#ss-eq2').hidden=!w[1]; $('#ss-eq3').innerHTML=FR(w[2]); $('#ss-eq3').hidden=!w[2];

  function qGo(){
    var q=Q; if(!q || (run && !run.still && !run.over)) return;

  }
  function setQM(on){
    if(on===QM) return;

  }
  $('#ss-tab').addEventListener('click', function(e){ var b=e.target.closest('button'); if(b) setQM(b.dataset.v==='predict'); });

  $('#ss-go').addEventListener('click', qGo);
  $('#ss-new').addEventListener('click', function(){ newQ(); if(Q.kind!=='stand') ansIn.focus(); });

  // ---- buttons
  playBtn.addEventListener('click', function(){

  // ---- drag the timer (direct), the people (echo) or microphone B along the bench, or use the arrow keys
  function lim(){ return LIM[mode()]; }

      m==='direct' ? 'A field: Ali bangs two blocks, Sophie times him from a distance d. Drag Sophie, or use the arrow keys, to change d. A distance–time graph is on the right.' :

/* Choice kit (12 Nov 2026): the same block on every animation page. See tools/ANIMATION-STYLE.md, "Choices".
   A group of choices with one chosen gets a track round it (class pick); a .to-q button opens the questions from Explore. */
(function(){
  function on(b){ return b.getAttribute('aria-pressed')==='true' || b.classList.contains('is-on'); }
  function each(sel, fn){ Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }
  function mark(s){
    if(!s.classList.contains('pick')){
      var n=0; Array.prototype.forEach.call(s.children, function(b){ if(b.tagName==='BUTTON' && on(b)) n++; });
      if(n===1) s.classList.add('pick');
    }
    if(s.classList.contains('pick') && !s.hasAttribute('data-fit')){
      var d=getComputedStyle(s).display;
      if(d!=='none'){ s.setAttribute('data-fit','1'); if(d.indexOf('flex')>=0) s.classList.add('fit'); }
    }
  }
  each('.seg:not(.tabs):not(.mode):not(.apps)', function(s){
    mark(s);
    if(window.MutationObserver) new MutationObserver(function(){ mark(s); }).observe(s, {childList:true, subtree:true, attributes:true, attributeFilter:['aria-pressed','class']});
  });
  // Choice rows: wrap each .rowlab and the control after it in a .cgroup (label above, groups side by side).
  // A group is hidden when everything in it is hidden, so pages that hide a row's label and control still work.
  function shown(e){ return !e.hidden && e.style.display!=='none'; }
  each('.cgrid:not(.kit)', function(g){
    var kids=Array.prototype.slice.call(g.children), groups=[];
    for(var i=0;i<kids.length;i++){
      var w=document.createElement('div'); w.className='cgroup';
      g.insertBefore(w, kids[i]); w.appendChild(kids[i]);
      if(kids[i].classList.contains('rowlab') && kids[i+1]){ w.appendChild(kids[i+1]); i++; }
      groups.push(w);
    }
    g.classList.add('kit'); if(groups.length===1) g.classList.add('one');
    groups.forEach(function(w){
      function sync(){ var any=false; Array.prototype.forEach.call(w.children, function(c){ if(shown(c)) any=true; }); w.hidden=!any; }
      sync();
      if(window.MutationObserver) Array.prototype.forEach.call(w.children, function(c){ new MutationObserver(sync).observe(c, {attributes:true, attributeFilter:['hidden','style']}); });
    });
  });
  each('.to-q[data-mode]', function(b){
    var seg=document.getElementById(b.getAttribute('data-mode')); if(!seg) return;
    var bs=seg.querySelectorAll('button');
    function sync(){ b.hidden=!on(bs[0]) || !seg.getClientRects().length; }   // hidden too when the page hides its mode switch (e.g. at a level with no questions)
    b.addEventListener('click', function(){ bs[1].click(); bs[1].focus(); });
    if(window.MutationObserver) new MutationObserver(sync).observe(seg, {subtree:true, attributes:true, attributeFilter:['aria-pressed']});
    document.addEventListener('click', function(){ setTimeout(sync, 0); });
    sync(); setTimeout(sync, 0);
  });
})();
