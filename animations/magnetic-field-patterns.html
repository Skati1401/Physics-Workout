<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magnetic Field Patterns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1f5; --bg-grid:rgba(29,41,61,0.055);
    --panel:#ffffff; --panel-border:#d7dce4;
    --ink:#182233; --ink-soft:#4c5668; --ink-faint:#8993a5;
    --accent:#d9720c; --accent-soft:#fdead2;
    --good:#15803d; --good-soft:#dcf5e3;
    --bad:#c0311a; --bad-soft:#fbe1db;
    --shadow:0 10px 26px -14px rgba(24,34,51,0.28);
    --topic:#0f7a86;   --topic-soft:#d6f1f3;
    --north:#d23b3b;   --north-soft:#fbdede;
    --south:#2f62d6;   --south-soft:#dde7fb;
    --copper:#b8651b;  --filing:#3b4352;
    --font-display:'Big Shoulders',system-ui,sans-serif;
    --font-body:'IBM Plex Sans',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12161f; --bg-grid:rgba(255,255,255,0.045);
      --panel:#1b212e; --panel-border:#2c3444;
      --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;
      --accent:#ff9a3d; --accent-soft:#3a2712;
      --good:#4ade80; --good-soft:#123321;
      --bad:#f27159; --bad-soft:#3a1712;
      --shadow:0 14px 30px -14px rgba(0,0,0,0.55);
      --topic:#4fd1dc; --topic-soft:#123236;
      --north:#ff7a7a; --north-soft:#3d1a1a;
      --south:#7da3ff; --south-soft:#1a2440;
      --copper:#f0a35e; --filing:#c3cad6;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12161f; --bg-grid:rgba(255,255,255,0.045);
    --panel:#1b212e; --panel-border:#2c3444;
    --ink:#eef1f6; --ink-soft:#b1bacb; --ink-faint:#707a8d;
    --accent:#ff9a3d; --accent-soft:#3a2712;
    --good:#4ade80; --good-soft:#123321;
    --bad:#f27159; --bad-soft:#3a1712;
    --shadow:0 14px 30px -14px rgba(0,0,0,0.55);
    --topic:#4fd1dc; --topic-soft:#123236;
    --north:#ff7a7a; --north-soft:#3d1a1a;
    --south:#7da3ff; --south-soft:#1a2440;
    --copper:#f0a35e; --filing:#c3cad6;
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      linear-gradient(var(--bg-grid) 1px,transparent 1px) 0 0/100% 34px,
      linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px) 0 0/34px 100%,
      var(--bg);
    color:var(--ink); font-family:var(--font-body); font-size:14px; -webkit-font-smoothing:antialiased;
  }
  [hidden]{display:none!important;}
  button{font:inherit;color:inherit;}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;}

  .page{max-width:1400px;margin-inline:auto;padding-inline:20px;padding-block:12px 40px;}
  h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:0.2px;text-wrap:balance;margin:0;}
  p{margin:0;line-height:1.55;}

  .home-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-bottom:4px;font:600 13px var(--font-mono);color:var(--ink-soft);text-decoration:none;}
  .home-link:hover{color:var(--accent);}
  .page-head{margin-bottom:12px;}
  .eyebrow{font-family:var(--font-mono);font-size:11.5px;color:var(--accent);font-weight:600;margin-bottom:6px;}
  .page-head h1{font-size:clamp(28px,5vw,38px);color:var(--ink);}

  .card{background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;box-shadow:var(--shadow);}
  .btn{
    font-family:var(--font-body);font-weight:600;font-size:13.5px;color:var(--ink);
    background:var(--panel);border:1px solid var(--panel-border);border-radius:9px;
    padding:9px 15px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  }
  .btn:hover{border-color:var(--ink-faint);}
  .btn:disabled{opacity:.45;cursor:default;}
  .btn-primary{background:var(--ink);border-color:var(--ink);color:var(--bg);}
  .btn-primary:hover{opacity:.88;border-color:var(--ink);}
  .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);}
  .btn-group{display:flex;flex-wrap:wrap;gap:10px;}

  /* picture on the left; controls, readings and working on the right */
  .stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);gap:18px 24px;align-items:start;padding:18px;}
  @media (max-width:860px){ .stage{grid-template-columns:minmax(0,1fr);} }
  .view-wrap{position:relative;}
  .view{display:block;width:100%;height:auto;max-height:max(260px,calc(100vh - 290px));touch-action:pan-y;}
  .view-wrap canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  .embed .view{max-height:460px;}
  .under{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;margin-top:12px;}
  .under .btn-group{flex:0 1 auto;}
  .sliders{flex:1 1 300px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px 20px;min-width:0;}
  .view text{font-family:var(--font-mono);}
  .side{display:flex;flex-direction:column;gap:12px;min-width:0;}
  .lab{display:flex;justify-content:space-between;gap:8px;font:12.5px var(--font-mono);color:var(--ink-soft);margin-bottom:6px;}
  .lab output{color:var(--ink);font-weight:600;}
  input[type=range]{width:100%;accent-color:var(--topic);min-height:28px;}
  .seg{display:flex;flex-wrap:wrap;gap:6px;}
  .seg button{font:12.5px var(--font-mono);padding:8px 12px;min-height:44px;border:1px solid var(--panel-border);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer;}
  .seg button[aria-pressed="true"]{background:var(--topic);border-color:var(--topic);color:var(--panel);}
  .seg button:disabled{opacity:.45;cursor:default;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px;}
  .stat{border:1px solid var(--panel-border);border-radius:8px;padding:5px 8px;}
  .stat small{display:block;font:10.5px var(--font-mono);color:var(--ink-faint);}
  .stat strong{font:600 15px var(--font-mono);color:var(--ink);white-space:nowrap;}
  .stat.hi strong{color:var(--accent);}
  .note{font-size:15px;line-height:1.5;color:var(--ink);padding:10px 12px;border-radius:8px;background:var(--bg);min-height:4.6em;}
  .note b{color:var(--topic);}
  .hint{font-size:12.5px;color:var(--ink-soft);}

  details.working summary{cursor:pointer;font:600 13px var(--font-mono);color:var(--topic);min-height:44px;display:flex;align-items:center;}
  .eq{font-family:var(--font-mono);font-size:14px;line-height:1.75;padding:8px 12px;border-left:3px solid var(--topic);background:var(--topic-soft);border-radius:6px;color:var(--ink);}
  .eq b{color:var(--topic);}
  .eqg{display:grid;grid-template-columns:auto auto minmax(0,1fr);column-gap:.45em;row-gap:.2em;align-items:center}
  .eqg-l{justify-self:end;text-align:right}
  .eqg-m{justify-self:center}
  .eqg-r{justify-self:start;min-width:0}
  .eqg-full{grid-column:1/-1}
  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1.25;}
  .frac>span{padding:0 .25em;white-space:nowrap;}
  .frac>span:first-child{border-bottom:1.5px solid currentColor;}
  .dragme{cursor:grab;}
  .dragme:focus{outline:none;}
  .dragme:focus-visible .focus-ring{stroke:var(--accent);stroke-width:3;}
  @media (max-width:560px){ .stage{padding:12px;} .eq{font-size:12.5px;padding:6px 8px;} .note{font-size:14px;} }

  .embed body{background:transparent;}
  .embed .page{padding:0;max-width:none;display:flow-root;}
  .embed .home-link,.embed .page-head{display:none;}
  .embed .hint{display:none;}
</style>

</head>
<body>
<div class="page" id="page">
  <a class="home-link" href="igcse.html">&larr; IGCSE animations</a>
  <header class="page-head">
    <div class="eyebrow">Animations &middot; magnetism</div>
    <h1>Magnetic Field Patterns</h1>
  </header>
  <section class="card stage">
    <div>
      <div class="view-wrap" id="fp-wrap">
        <svg class="view" id="fp-svg" viewBox="0 0 560 340" role="img" aria-label="Bar magnets on a card, with iron filings, field lines and a plotting compass"></svg>
        <canvas id="fp-canvas" aria-hidden="true"></canvas>
        <svg class="view" id="fp-top" viewBox="0 0 560 340" style="position:absolute;inset:0;" aria-hidden="false"></svg>
      </div>
      <div class="under">
        <div class="btn-group">
          <button class="btn btn-primary" id="fp-go" type="button">&#9654; Sprinkle filings</button>
          <button class="btn" id="fp-lines" type="button" aria-pressed="false">Field lines</button>
          <button class="btn" id="fp-compass" type="button" aria-pressed="false">Plotting compass</button>
          <button class="btn" id="fp-reset" type="button">&#8634; Reset</button>
          <button class="btn" id="fp-strong" type="button" aria-pressed="false">Stronger magnets</button>
        </div>
      </div>
      <p class="hint" style="margin-top:8px">Drag the compass around the magnets (or select it and use the arrow keys).</p>
    </div>
    <div class="side">
      <div>
        <div class="lab">Set-up</div>
        <div class="seg" id="fp-setup"><button type="button" data-v="bar" aria-pressed="true">One bar magnet</button><button type="button" data-v="like" aria-pressed="false">Like poles</button><button type="button" data-v="unlike" aria-pressed="false">Unlike poles</button><button type="button" data-v="close" aria-pressed="false">Unlike poles, close</button></div>
      </div>
      <p class="note" id="fp-note" aria-live="polite"></p>
      <div class="stats">
        <div class="stat"><small>Field at compass</small><strong id="fp-str">&ndash;</strong></div>
        <div class="stat"><small>Needle&rsquo;s north end points</small><strong id="fp-dir">&ndash;</strong></div>
      </div>
    </div>
  </section>

</div>
<script>
(function(){
  // magnetic-field-patterns.html is the one copy of this animation.
  // With ?embed the page drops its heading so a workout tab can show it in a frame, and tells that page its height.
  var EMBED = /[?&]embed\b/.test(location.search);
  if(EMBED){
    document.documentElement.classList.add('embed');
    var wk = document.querySelector('details.working'); if(wk) wk.open = true;
    var page = document.getElementById('page');
    var sendHeight = function(){ try{ parent.postMessage({animHeight: Math.ceil(page.getBoundingClientRect().height)}, '*'); }catch(e){} };
    if(window.ResizeObserver) new ResizeObserver(sendHeight).observe(page);
    window.addEventListener('load', sendHeight);
  }
  function $(sel){ return document.querySelector(sel); }
  function num(n, dp){   // round, drop trailing zeros, group thousands with a space from 10 000
    var f = Math.pow(10, dp||0), r = Math.round(n*f)/f, t = String(Math.abs(r));
    if(Math.abs(r)>=10000) t = t.replace(/\B(?=(\d{3})+(?!\d))/g,' ');
    return (r<0?'−':'')+t;
  }
  function FR(t){
    return String(t).replace(/(\d) (?=\d{3}\b)/g,'$1 ')
      .replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g,'<span class="frac"><span>$1</span><span>$2</span></span>');
  }
  function arrowHead(id, col){ return '<marker id="'+id+'" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="'+col+'"/></marker>'; }
  function alignEquals(el){
    if(el.querySelector('.eqg')) return;
    var rows = el.innerHTML.split(/<br\s*\/?>/i).map(function(line){
      var i = line.indexOf(' = ');
      if(i<0) return '<span class="eqg-full">'+line+'</span>';
      return '<span class="eqg-l">'+line.slice(0,i)+'</span><span class="eqg-m">=</span><span class="eqg-r">'+line.slice(i+3)+'</span>';
    });
    el.innerHTML = '<div class="eqg">'+rows.join('')+'</div>';
  }
  function watchEquals(el){ if(!el) return; alignEquals(el); new MutationObserver(function(){ alignEquals(el); }).observe(el, {childList:true}); }
  function pressed(b){ return b.getAttribute('aria-pressed')==='true'; }
  function toggle(b){ b.setAttribute('aria-pressed', String(!pressed(b))); }
  // a row of choice buttons that behaves like a radio group
  function segGroup(el, onPick){
    el.addEventListener('click', function(e){ var b=e.target.closest('button'); if(!b||b.disabled) return; pick(b.dataset.v); onPick(b.dataset.v); });
    function pick(v){ Array.prototype.forEach.call(el.querySelectorAll('button'), function(x){ x.setAttribute('aria-pressed', String(x.dataset.v===v)); }); }
    function value(){ var b=el.querySelector('[aria-pressed="true"]'); return b?b.dataset.v:null; }
    return {pick:pick, value:value};
  }
  // a pole of a magnet: coloured block with its letter
  function poleRect(x,y,w,h,pole,fs){
    var c = pole==='N' ? 'north' : 'south';
    return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="var(--'+c+'-soft)" stroke="var(--'+c+')" stroke-width="2"/>'+
      '<text x="'+(x+w/2)+'" y="'+(y+h/2+(fs||16)*0.36)+'" text-anchor="middle" font-size="'+(fs||16)+'" font-weight="600" fill="var(--'+c+')">'+pole+'</text>';
  }
  // a wire seen end-on: dot = current out of the page, cross = into the page
  function wireEnd(x,y,r,dir,col){
    var g='<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="var(--panel)" stroke="'+(col||'var(--copper)')+'" stroke-width="3"/>';
    if(dir>0) g+='<circle cx="'+x+'" cy="'+y+'" r="'+(r*0.28)+'" fill="var(--ink)"/>';
    else if(dir<0){ var d=r*0.55; g+='<path d="M'+(x-d)+','+(y-d)+' L'+(x+d)+','+(y+d)+' M'+(x+d)+','+(y-d)+' L'+(x-d)+','+(y+d)+'" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>'; }
    return g;
  }
  function line(x1,y1,x2,y2,col,w,extra){ return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+col+'" stroke-width="'+(w||2)+'"'+(extra||'')+'/>'; }
  function txt(x,y,s,o){ o=o||{}; return '<text x="'+x+'" y="'+y+'"'+(o.a?' text-anchor="'+o.a+'"':'')+' font-size="'+(o.fs||11.5)+'" fill="'+(o.c||'var(--ink-soft)')+'"'+(o.w?' font-weight="'+o.w+'"':'')+'>'+s+'</text>'; }
  // pointer position in SVG user units
  function svgPoint(svg, e){ var r=svg.getBoundingClientRect(), vb=svg.viewBox.baseVal; return {x:vb.x+(e.clientX-r.left)/r.width*vb.width, y:vb.y+(e.clientY-r.top)/r.height*vb.height}; }

  var W=560, H=340;
  var base=$('#fp-svg'), top=$('#fp-top'), cv=$('#fp-canvas'), wrap=$('#fp-wrap');
  top.style.height='100%';
  var strongBtn=$('#fp-strong'), linesBtn=$('#fp-lines'), compBtn=$('#fp-compass'), goBtn=$('#fp-go');

  // Each magnet: box, and which pole is on its left. Poles are modelled as rows of point poles across each end face.
  var SETUPS={
    bar:   {mags:[{x:190,y:150,w:180,h:40,left:'N'}], neutral:null,
            text:'Field lines leave the <b>north</b> pole and loop round to the <b>south</b> pole. They are closest together at the poles, where the field is <b>strongest</b>, and spread out further away, where it is weaker.'},
    like:  {mags:[{x:50,y:150,w:130,h:40,left:'S'},{x:380,y:150,w:130,h:40,left:'N'}], neutral:[280,170],
            text:'Two north poles facing: like poles <b>repel</b>. The field lines from the two poles push away from each other and never join, leaving a <b>neutral point</b> in the middle where the field is zero. Lines still go into the <b>south</b> pole at each outer end.'},
    unlike:{mags:[{x:50,y:150,w:130,h:40,left:'S'},{x:380,y:150,w:130,h:40,left:'S'}], neutral:null,
            text:'North facing south: unlike poles <b>attract</b>. Field lines go across the gap from the N pole to the S pole, and also come out of the N pole and go into the S pole at the <b>outer ends</b>.'},
    close: {mags:[{x:80,y:60,w:160,h:220,left:'S'},{x:320,y:60,w:160,h:220,left:'S'}], neutral:null,
            text:'Between two large unlike poles close together, the lines are <b>straight, parallel and evenly spaced</b>: a <b>uniform field</b>, the same strength and direction everywhere in the gap. The lines only curve at the <b>edges</b> of the gap.'}
  };
  var setup='bar', strength=1, poles=[], fieldLines=[], filings=[], t=0, running=false, done=false, raf=0, last=0, comp={x:280,y:70};

  function makePoles(){
    poles=[];
    SETUPS[setup].mags.forEach(function(m){
      var n=Math.max(3,Math.round(m.h/12)), inset=Math.min(10,m.w*0.08);
      for(var i=0;i<n;i++){
        var yy=m.y+m.h*(i+0.5)/n, q=1/n;
        poles.push({x:m.x+inset, y:yy, q:(m.left==='N'?q:-q)});
        poles.push({x:m.x+m.w-inset, y:yy, q:(m.left==='N'?-q:q)});
      }
    });
  }
  function field(x,y){
    var bx=0, by=0;
    for(var i=0;i<poles.length;i++){ var p=poles[i], dx=x-p.x, dy=y-p.y, r2=dx*dx+dy*dy+4, r3=r2*Math.sqrt(r2); bx+=p.q*dx/r3; by+=p.q*dy/r3; }
    return [bx*strength,by*strength];
  }
  function inMag(x,y,pad){ pad=pad||0; return SETUPS[setup].mags.some(function(m){ return x>m.x-pad && x<m.x+m.w+pad && y>m.y-pad && y<m.y+m.h+pad; }); }
  function trace(x,y,dir){
    var pts=[[x,y]], ds=3*(dir||1);
    for(var i=0;i<900;i++){
      var b=field(x,y), l=Math.hypot(b[0],b[1]); if(l<1e-12) break;
      var mx=x+b[0]/l*ds/2, my=y+b[1]/l*ds/2, b2=field(mx,my), l2=Math.hypot(b2[0],b2[1]); if(l2<1e-12) break;
      x+=b2[0]/l2*ds; y+=b2[1]/l2*ds; pts.push([x,y]);
      if(inMag(x,y) || x<-40 || x>W+40 || y<-40 || y>H+40) break;
    }
    return pts;
  }
  function makeLines(){
    fieldLines=[];
    var big=strength>1, close=setup==='close';
    SETUPS[setup].mags.forEach(function(m){
      // Lines start just outside each end face and along the top and bottom of each half.
      // From the N end they are traced along the field; from the S end, backwards, so lines that leave the picture
      // still show going into the S pole. A backward line that reaches a magnet is already drawn from its N end.
      [true,false].forEach(function(isN){
        var atLeft=(m.left==='N')===isN, fx=atLeft?m.x-2:m.x+m.w+2, starts=[], k;
        // side lines start near the ends only, so their loops stay well away from the magnet
        var nf=close?(big?15:9):(big?9:5), ne=close?0:(big?3:2), half=m.w*0.22;
        for(k=0;k<nf;k++){
          var yy=m.y+m.h*(k+0.5)/nf;
          // close unlike poles: the gap is a uniform field, so its lines are drawn straight across;
          // only the outermost one (two when stronger) is traced, to show the curve at the edges
          if(close && isN && fx>W/2-80 && fx<W/2 && k>=(big?2:1) && k<nf-(big?2:1)){
            var gx=fx, gEnd=SETUPS[setup].mags[1].x-2, line=[];
            for(; gx<=gEnd; gx+=3) line.push([gx,yy]);
            fieldLines.push(line); continue;
          }
          starts.push([fx, yy]);
        }
        for(k=0;k<ne;k++){ var xx=atLeft? m.x+half*(k+0.5)/ne : m.x+m.w-half*(k+0.5)/ne; starts.push([xx,m.y-2]); starts.push([xx,m.y+m.h+2]); }
        starts.forEach(function(s){
          var p=trace(s[0],s[1],isN?1:-1); if(p.length<=4) return;
          if(!isN){ var e=p[p.length-1]; if(inMag(e[0],e[1])) return; p.reverse(); }
          fieldLines.push(p);
        });
      });
    });
  }
  function makeFilings(){
    filings=[]; var n=window.innerWidth<600?650:950, tries=0, strengths=[];
    while(filings.length<n && tries<n*6){ tries++;
      var x=6+Math.random()*(W-12), y=6+Math.random()*(H-12); if(inMag(x,y,5)) continue;
      var b=field(x,y), s=Math.hypot(b[0],b[1]);
      filings.push({x:x,y:y,a0:Math.random()*Math.PI,target:Math.atan2(b[1],b[0]),s:s,delay:Math.random()*0.5,jit:(Math.random()*2-1)});
      strengths.push(s/strength);   // judge against normal magnets, so stronger ones line the filings up better
    }
    strengths.sort(function(a,b){return a-b;}); var ref=strengths[Math.floor(strengths.length*0.35)]||1;
    filings.forEach(function(f){
      var a=f.s/(f.s+ref);                        // weak field: the filing barely lines up
      f.af=f.target+(1-a)*f.jit*1.3;
      var d=((f.af-f.a0)%Math.PI+Math.PI*1.5)%Math.PI-Math.PI/2; f.af=f.a0+d;   // a filing has no direction: turn the short way
      f.settle=0.5+1.8*(1-a);
    });
  }

  function drawStatic(){
    var g='<defs>'+arrowHead('fp-ah','var(--topic)')+'</defs>';
    g+='<rect x="2" y="2" width="'+(W-4)+'" height="'+(H-4)+'" rx="10" fill="var(--panel)" stroke="var(--panel-border)"/>';
    base.innerHTML=g;
  }
  function drawTop(){
    var g='<defs>'+arrowHead('fp-lh','var(--topic)')+'<clipPath id="fp-clip"><rect x="2" y="2" width="'+(W-4)+'" height="'+(H-4)+'" rx="10"/></clipPath></defs><g clip-path="url(#fp-clip)">';
    if(pressed(linesBtn)){
      fieldLines.forEach(function(p){
        g+='<polyline points="'+p.map(function(q){return q[0].toFixed(1)+','+q[1].toFixed(1);}).join(' ')+'" fill="none" stroke="var(--topic)" stroke-width="1.6" opacity="0.9"/>';
        // arrow halfway along the longest stretch of the line that is inside the picture
        var run=0, best=0, bestEnd=-1; p.forEach(function(q,j){ if(q[0]>8&&q[0]<W-8&&q[1]>8&&q[1]<H-8){ run++; if(run>best){ best=run; bestEnd=j; } } else run=0; });
        var i=bestEnd-Math.floor(best/2); if(best>2 && i>0 && i<p.length-1){ var a=p[i-1], b=p[i+1];
          g+='<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" stroke="var(--topic)" stroke-width="2.4" marker-end="url(#fp-lh)"/>'; }
      });
      var nt=SETUPS[setup].neutral;
      if(nt){ g+='<path d="M'+(nt[0]-6)+','+(nt[1]-6)+' L'+(nt[0]+6)+','+(nt[1]+6)+' M'+(nt[0]+6)+','+(nt[1]-6)+' L'+(nt[0]-6)+','+(nt[1]+6)+'" stroke="var(--accent)" stroke-width="2.5"/>'+txt(nt[0],nt[1]-14,'neutral point',{a:'middle',c:'var(--accent)'}); }
    }
    g+='</g>';
    SETUPS[setup].mags.forEach(function(m){
      var fs=setup==='close'?28:16, l=m.left, r=l==='N'?'S':'N';
      g+=poleRect(m.x,m.y,m.w/2,m.h,l,fs)+poleRect(m.x+m.w/2,m.y,m.w/2,m.h,r,fs);
    });
    if(pressed(compBtn)){
      var b=field(comp.x,comp.y), a=Math.atan2(b[1],b[0])*180/Math.PI;
      g+='<g class="dragme" id="fp-comp" tabindex="0" role="button" aria-label="Plotting compass. Use the arrow keys to move it." transform="translate('+comp.x.toFixed(1)+','+comp.y.toFixed(1)+')">'+
        '<circle class="focus-ring" r="17" fill="var(--panel)" stroke="var(--ink-soft)" stroke-width="2"/>'+
        '<g transform="rotate('+a.toFixed(1)+')"><path d="M0,-4 L13,0 L0,4 Z" fill="var(--north)"/><path d="M0,-4 L-13,0 L0,4 Z" fill="var(--south)"/></g>'+
        '<circle r="2" fill="var(--ink)"/></g>';
    }
    top.innerHTML=g;
    var c=$('#fp-comp'); if(c){ hookCompass(c); if(focusComp){ c.focus(); } }
    readings();
  }
  var focusComp=false;
  function readings(){
    if(!pressed(compBtn)){ $('#fp-str').textContent='–'; $('#fp-dir').textContent='–'; return; }
    var b=field(comp.x,comp.y), s=Math.hypot(b[0],b[1]), atPole=field(SETUPS[setup].mags[0].x-12, SETUPS[setup].mags[0].y+SETUPS[setup].mags[0].h/2), ref=Math.hypot(atPole[0],atPole[1])/strength;
    var r=s/ref, word = r>0.7?'very strong':(r>0.35?'strong':(r>0.08?'medium':(r>0.012?'weak':'almost zero')));
    $('#fp-str').textContent=word;
    var ang=Math.atan2(-b[1],b[0])*180/Math.PI, dirs=['right','up and right','up','up and left','left','down and left','down','down and right'];
    $('#fp-dir').textContent= r>0.004 ? dirs[((Math.round(ang/45)%8)+8)%8] : 'any way';
  }

  // the filings: a canvas under the magnets
  var ctx=cv.getContext('2d');
  function fitCanvas(){
    var r=wrap.getBoundingClientRect(), d=window.devicePixelRatio||1;
    cv.width=Math.round(r.width*d); cv.height=Math.round(r.height*d);
    drawFilings();
  }
  function drawFilings(){
    var r=wrap.getBoundingClientRect(), d=window.devicePixelRatio||1, sc=Math.min(r.width/W, r.height/H), ox=(r.width-W*sc)/2, oy=(r.height-H*sc)/2;
    ctx.setTransform(d,0,0,d,0,0); ctx.clearRect(0,0,r.width,r.height);
    if(!filings.length) return;
    ctx.setTransform(d*sc,0,0,d*sc,d*ox,d*oy);
    ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--filing').trim()||'#3b4352';
    ctx.lineWidth=1.3; ctx.lineCap='round';
    var TAP=0.9;
    for(var i=0;i<filings.length;i++){
      var f=filings[i], since=t-f.delay; if(since<0) continue;
      var fall=Math.min(1,since/0.3), p=Math.max(0,Math.min(1,(t-TAP)/f.settle)), e=1-Math.pow(1-p,3);
      var a=f.a0+(f.af-f.a0)*e, y=f.y-(1-fall)*14, c=Math.cos(a)*3.6, s=Math.sin(a)*3.6;
      ctx.globalAlpha=fall*0.9;
      ctx.beginPath(); ctx.moveTo(f.x-c,y-s); ctx.lineTo(f.x+c,y+s); ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
  var TEND=0.9+2.4;
  function note(){
    var s;
    if(!filings.length && !pressed(linesBtn)) s='Predict the pattern the iron filings will make, then press <b>Sprinkle filings</b>.';
    else if(running && t<0.9) s='The filings land on the card facing every way.';
    else if(running) s='Tapping the card lets each filing turn to line up with the magnetic field. Where the field is strong they line up quickly; far away they hardly move.';
    else s=SETUPS[setup].text+(strength>1?' <b>Stronger magnets</b>: the same pattern, but the field is stronger everywhere, so the lines are closer together and the filings line up further from the magnets.':'');
    $('#fp-note').innerHTML=s;
  }
  function stop(){ running=false; cancelAnimationFrame(raf); goBtn.innerHTML=filings.length?'&#9654; Sprinkle again':'&#9654; Sprinkle filings'; }
  function frame(now){ if(!running) return; t+=Math.min(0.05,(now-last)/1000); last=now;
    if(t>=TEND){ t=TEND; done=true; drawFilings(); stop(); note(); return; }
    drawFilings(); note(); raf=requestAnimationFrame(frame); }
  function sprinkle(){ stop(); makeFilings(); t=0; done=false; running=true; goBtn.innerHTML='Sprinkling…'; last=performance.now(); note(); raf=requestAnimationFrame(frame); }
  function reset(){ stop(); filings=[]; t=0; done=false; linesBtn.setAttribute('aria-pressed','false'); goBtn.innerHTML='&#9654; Sprinkle filings'; drawFilings(); drawTop(); note(); }
  function newSetup(v){ setup=v; makePoles(); makeLines(); comp={x:280,y:setup==='close'?60:70}; reset(); }

  // dragging the compass (mouse, touch and keyboard)
  function hookCompass(c){
    c.addEventListener('pointerdown',function(e){ e.preventDefault(); c.setPointerCapture(e.pointerId); dragging=true; });
    c.addEventListener('pointermove',function(e){ if(!dragging) return; var p=svgPoint(top,e); moveComp(p.x,p.y); });
    c.addEventListener('pointerup',function(){ dragging=false; });
    c.addEventListener('keydown',function(e){ var k={ArrowLeft:[-8,0],ArrowRight:[8,0],ArrowUp:[0,-8],ArrowDown:[0,8]}[e.key]; if(!k) return; e.preventDefault(); focusComp=true; moveComp(comp.x+k[0],comp.y+k[1]); });
    c.addEventListener('blur',function(){ focusComp=false; });
  }
  var dragging=false;
  function moveComp(x,y){
    x=Math.max(18,Math.min(W-18,x)); y=Math.max(18,Math.min(H-18,y));
    if(inMag(x,y,16)) return;   // the compass can't sit on top of a magnet
    comp.x=x; comp.y=y;
    var c=$('#fp-comp'); if(!c) return;
    // update in place so a drag is not interrupted
    var b=field(x,y), a=Math.atan2(b[1],b[0])*180/Math.PI;
    c.setAttribute('transform','translate('+x.toFixed(1)+','+y.toFixed(1)+')');
    c.children[1].setAttribute('transform','rotate('+a.toFixed(1)+')');
    readings();
  }

  var seg=segGroup($('#fp-setup'), newSetup);
  goBtn.addEventListener('click',sprinkle);
  linesBtn.addEventListener('click',function(){ toggle(linesBtn); drawTop(); note(); });
  compBtn.addEventListener('click',function(){ toggle(compBtn); drawTop(); });
  strongBtn.addEventListener('click',function(){
    toggle(strongBtn); strength=pressed(strongBtn)?2:1; makeLines();
    if(filings.length) sprinkle(); else note();
    drawTop();
  });
  $('#fp-reset').addEventListener('click',reset);
  if(window.ResizeObserver) new ResizeObserver(fitCanvas).observe(wrap); else window.addEventListener('resize',fitCanvas);
  if(window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',drawFilings);
  drawStatic(); newSetup('bar'); fitCanvas();

})();
</script>
</body>
</html>
