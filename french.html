<script>
  // Visit counter (GoatCounter: no cookies, no personal data). Skipped when a page is embedded in a workout, so a visit counts once.
  // pwCountTab(tab, label): counts each workout tab once per visit as a GoatCounter event (path "page#tab"), skipped in frames the same way.
  (function(){
    var off = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var seen = {}, queue = [];
    function send(e){ try { window.goatcounter.count(e); } catch (x) {} }
    window.pwCountTab = function(tab, label){
      if (off || !tab || seen[tab]) return;
      seen[tab] = 1;
      var page = (location.pathname.split('/').pop() || 'index').replace(/\.html$/, '');
      var e = { path: page + '#' + tab, title: (label || tab) + ' \u00b7 ' + document.title, event: true };
      if (window.goatcounter && window.goatcounter.count) send(e); else queue.push(e);
    };
    if (off) return;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://gc.zgo.at/count.js';
    s.setAttribute('data-goatcounter', 'https://physics-workout.goatcounter.com/count');
    s.onload = function(){ var q = queue; queue = []; q.forEach(send); };
    document.head.appendChild(s);
  })();
</script>

<script>
  // Draft tags and Alex's reviewer button (tools/review/drafts.py writes this block; edit tools/review/snippet.html, then run drafts.py sync).
  // A page is Draft while its row in tools/REVIEW.md is not ✅: <meta name="pw-draft"> on the page, data-draft on its list cards.
  // ?reviewer (once, on any page) turns on reviewer mode in this browser; ?reviewer=off turns it off.
  (function(){
    var on = false, embed = /[?&]embed\b/.test(location.search) || window.self !== window.top;
    var m = /[?&]reviewer(?:=([^&]*))?/.exec(location.search);
    on = !!m && m[1] !== 'off';
    try {
      if (m) { if (m[1] === 'off') localStorage.removeItem('pw-reviewer'); else localStorage.setItem('pw-reviewer', '1'); }
      else on = localStorage.getItem('pw-reviewer') === '1';
    } catch (e) {}
    var CSS = '.pw-draft{display:inline-block;vertical-align:middle;margin-left:10px;font:600 11.5px/1.4 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:0;color:var(--bad,#b42318);border:1px dashed currentColor;border-radius:5px;padding:1px 7px;white-space:nowrap}'
      + '.act-top .pw-draft{margin-left:auto;flex:none}.act-top .pw-draft~.cp-tag,.act-top .pw-draft~.ta-tag{margin-left:0}'
      + 'a[data-draft]{position:relative}.pw-draft.pw-corner{position:absolute;top:10px;right:10px;margin:0;background:var(--panel,#fff)}'
      + 'summary .pw-draft{margin-left:0;flex:none}'
      + '.pw-check{display:inline-block;vertical-align:middle;margin-left:8px;font:600 13px/1.4 "IBM Plex Sans",system-ui,sans-serif;color:#fff;background:#1a7f37;border-radius:6px;padding:4px 10px;text-decoration:none;white-space:nowrap}'
      + '.pw-check:hover{background:#116329}.pw-check:focus-visible{outline:2px solid #1a7f37;outline-offset:2px}'
      + '.pw-reviewer{position:fixed;left:10px;bottom:10px;z-index:9999;font:500 12px/1.4 "IBM Plex Mono",ui-monospace,monospace;background:#1d2433;color:#fff;border-radius:6px;padding:4px 9px;opacity:.85}'
      + '.pw-reviewer a{color:#ffc83d}';
    function tag(){ var t = document.createElement('span'); t.className = 'pw-draft'; t.title = 'Not yet checked'; t.textContent = 'Draft'; return t; }
    function go(){
      var st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st);
      var meta = document.querySelector('meta[name="pw-draft"]'), h1 = document.querySelector('h1');
      if (meta && h1 && !embed) {
        h1.appendChild(tag());
        if (on) {
          var page = meta.getAttribute('content'), b = document.createElement('a');
          b.className = 'pw-check'; b.target = '_blank'; b.rel = 'noopener'; b.textContent = '✓ Checked';
          b.title = 'Opens a GitHub issue. Submit it and the Draft tag goes in a minute or two.';
          b.href = 'https://github.com/Skati1401/Physics-Workout/issues/new?title=' + encodeURIComponent('Checked: ' + page)
            + '&body=' + encodeURIComponent('Submit this issue to mark `' + page + '` as checked. The Draft tag goes in a minute or two, and the issue closes itself.');
          h1.appendChild(b);
        }
      }
      document.querySelectorAll('a[data-draft]').forEach(function(a){
        if (a.querySelector('.pw-draft')) return;
        var t = tag(), top = a.querySelector('.act-top');
        if (top) top.insertBefore(t, top.querySelector('.cp-tag,.ta-tag'));
        else { t.className += ' pw-corner'; a.appendChild(t); }
      });
      document.querySelectorAll('details.unit').forEach(function(d){
        var s = d.querySelector('summary');
        if (!s || s.querySelector('.pw-draft') || !d.querySelector('a[data-draft]')) return;
        var h2 = s.querySelector('h2'); if (h2) h2.parentNode.insertBefore(tag(), h2.nextSibling); else s.appendChild(tag());
      });
      if (on && !embed) {
        // Carry ?reviewer in every link to another page of the site, so reviewer mode survives
        // browsers that clear site storage (school Chromebooks) and pages cached from before.
        var carry = function(a){
          try {
            var u = new URL(a.href, location.href);
            if (u.origin !== location.origin || !/(\.html|\/)$/.test(u.pathname) || u.searchParams.has('reviewer')) return;
            u.searchParams.set('reviewer', ''); a.href = u.href.replace('reviewer=', 'reviewer');
          } catch (e) {}
        };
        document.querySelectorAll('a[href]').forEach(carry);
        ['click', 'auxclick', 'contextmenu'].forEach(function(ev){
          document.addEventListener(ev, function(e){ var a = e.target.closest && e.target.closest('a[href]'); if (a) carry(a); }, true);
        });
        var r = document.createElement('div'); r.className = 'pw-reviewer';
        r.innerHTML = 'Reviewer mode · <a href="' + location.pathname + '?reviewer=off">turn off</a>';
        document.body.appendChild(r);
      }
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
  })();
</script>

 <div class="row" style="justify-content:flex-start;margin:0"><button class="btn alt" id="rp">📋 My results for my teacher</button><button class="btn alt" id="cn">✏️ Not me? Change name</button></div>
 <div class="chips" role="group" aria-label="Choose a unit">${["Tout le vocabulaire",...UN].map((x,i)=>`<button class="chip ${unit==i-1?"on":""}" data-u="${i-1}">${i?i-1+" "+x:x}</button>`).join("")}</div>
 <div class="grid">${G.map(g=>`<button class="g" style="--c:${g.c}" data-g="${g.id}"><span class="lv">${g.l}</span><b>${g.n}</b><small>${g.d}</small><small>${"⭐".repeat(save[g.id]||0)||"☆☆☆"}</small></button>`).join("")}</div>`;
 app.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{unit=+b.dataset.u;home()});
 app.querySelectorAll(".g").forEach(b=>b.onclick=()=>start(G.find(g=>g.id==b.dataset.g)));
 $("#rp").onclick=report;$("#cn").onclick=()=>welcome(1)}
function bar(g,extra=""){return`<div class="bar"><button class="btn alt" id="back">← Menu</button><b>${g.n}</b><span id="sc">${extra}</span></div><div class="ch">🎯 ${g.ch}</div>`}
const FORM="https://docs.google.com/forms/d/e/1FAIpQLSckDe33SMEiTQvoEY363jBPGIHz9ABmz7Ke_Tpwf08QcOVfDA/formResponse";
const sendResult=(g,s,pct)=>{try{let b=new URLSearchParams({"entry.1356956956":me,"entry.2069686921":g.id+". "+g.n+" ("+(unit<0?"all units":"unit "+unit+" "+UN[unit])+")","entry.1011844281":s,"entry.921640406":Math.round(pct),"entry.458076943":new Date().toLocaleString("en-GB")});fetch(FORM,{method:"POST",mode:"no-cors",body:b}).catch(()=>{})}catch(e){}};
function finish(g,pct,chal,msg){let s=1+(pct>=70?1:0)+(chal?1:0);sendResult(g,s,pct);if(s>(save[g.id]||0))save[g.id]=s;let o=log[g.id];if(!o||s>o.s||(s==o.s&&pct>o.p))log[g.id]={s,p:Math.round(pct),d:new Date().toISOString().slice(0,10)};store();
 app.innerHTML=`<div class="panel res"><div class="big">${["","😊","🎉","🏆"][s]}</div><h2>${msg}</h2><p>${"⭐".repeat(s)}${"☆".repeat(3-s)}</p><p>${chal?"Challenge complete! 🎯":"Challenge not beaten yet. Try again!"}</p><div class="row"><button class="btn" id="again">Play again</button><button class="btn alt" id="back">Menu</button></div></div>`;
 $("#again").onclick=()=>start(g);$("#back").onclick=home}
function start(g){if(g.id==1)return flash(g);if(g.id==2)return memory(g);run(g)}
function flash(g){let d=pick(10),i=0,again=0,back=false,cur;
 const draw=()=>{if(i>=d.length)return finish(g,again<=3?100:60,again==0,"Fini ! "+again+" to repeat");cur=d[i];back=false;
 app.innerHTML=bar(g,`${i+1}/${d.length}`)+`<div class="panel"><div class="flip" id="f" tabindex="0" role="button">${cur.f}</div><p style="text-align:center;color:var(--mut)">Tap the card to flip it</p><div class="row"><button class="btn alt" id="s">🔊 Listen</button></div><div class="row" id="b" hidden><button class="btn red" id="a">↺ Again</button><button class="btn grn" id="k">✓ Got it</button></div></div>`;
 $("#back").onclick=home;$("#s").onclick=()=>speak(cur.f);
 $("#f").onclick=()=>{back=!back;$("#f").textContent=back?first(cur.e):cur.f;$("#b").hidden=false;if(!back)speak(cur.f)};
 $("#a").onclick=()=>{again++;d.push(cur);i++;draw()};$("#k").onclick=()=>{i++;draw()}};
 draw()}
function memory(g){let d=pick(8),cs=shuf(d.flatMap((x,k)=>[{k,t:x.f,fr:1},{k,t:first(x.e)}])),sel=[],mv=0,got=0,lock=0;
 app.innerHTML=bar(g,"Moves: 0")+`<div class="mem">${cs.map((c,i)=>`<button class="cd" data-i="${i}" aria-label="card">?</button>`).join("")}</div>`;
 $("#back").onclick=home;
 app.querySelectorAll(".cd").forEach(b=>b.onclick=()=>{let i=+b.dataset.i,c=cs[i];if(lock||b.classList.contains("up")||b.classList.contains("done"))return;
  b.classList.add("up");b.textContent=c.t;if(c.fr)speak(c.t);sel.push(i);
  if(sel.length==2){mv++;$("#sc").textContent="Moves: "+mv;let[a,z]=sel.map(x=>cs[x]);let B=app.querySelectorAll(".cd");
   if(a.k==z.k){sel.forEach(x=>{B[x].className="cd done"});got++;sel=[];if(got==8)setTimeout(()=>finish(g,mv<=18?100:60,mv<=14,"Solved in "+mv+" moves!"),600)}
   else{lock=1;setTimeout(()=>{sel.forEach(x=>{B[x].className="cd";B[x].textContent="?"});sel=[];lock=0},900)}}})}
function run(g){let i=0,sc=0,lives=g.lives||0,tm=g.time,iv,done=0,streak=0;
 const end=()=>{clearInterval(iv);if(g.boss)finish(g,Math.round(sc/g.n_*100),lives==3&&sc==11,lives>0?"Boss defeated! "+sc+"/11":"Game over: "+sc+"/11 rounds");
  else{let n=g.speedy?sc:sc,max=g.speedy?25:g.n_;finish(g,Math.min(100,Math.round(sc/(g.speedy?20:g.n_)*100)),sc>=g.need,g.speedy?sc+" correct in 60s!":sc+" / "+g.n_)}};
 const hud=()=>g.speedy?`⏱ ${tm}s · ✓ ${sc}`:g.boss?`${"❤️".repeat(lives)||"💔"} · ${i+1}/${g.n_}`:`${i+1}/${g.n_} · ✓ ${sc}`;
 const next=()=>{if(!g.speedy&&i>=g.n_)return end();let q=g.boss?bossQ(i):g.mk(),ans=false;
  app.innerHTML=bar(g,hud())+`<div class="prog"><i style="width:${g.speedy?0:i/g.n_*100}%"></i></div><div class="panel"><div class="q">${q.p}</div>${q.say?`<div class="row"><button class="btn alt" id="s">🔊 Hear it again</button></div>`:""}${q.hint?`<p style="text-align:center;color:var(--mut)">${q.hint}</p>`:""}
  ${q.mc?`<div class="opts">${q.mc.map(o=>`<button class="opt">${o}</button>`).join("")}</div>`:`<input class="t" id="in" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer"><div class="row"><button class="btn" id="ck">Check</button></div>`}
  <div class="fb" id="fb"></div><div class="row"><button class="btn" id="nx" hidden>Next</button></div></div>`;
  $("#back").onclick=()=>{clearInterval(iv);home()};
  if(q.say){$("#s").onclick=()=>speak(q.say);setTimeout(()=>speak(q.say),300)}
  const answer=(v,el)=>{if(ans)return;ans=true;let right=q.chk(v);if(right){sc++;streak++}else{streak=0;if(g.boss)lives--}
   if(el)el.classList.add(right?"ok":"no");if(q.mc)app.querySelectorAll(".opt").forEach(o=>{if(q.chk(o.textContent))o.classList.add("ok")});
   $("#fb").innerHTML=right?"✅ Bravo !"+(streak>2?" 🔥 "+streak+" in a row":""):"❌ Answer: "+q.ans;if(q.say)speak(q.ans.length<40&&!q.mc?q.ans:q.say);
   i++;$("#sc").textContent=hud();let go=()=>{if(g.boss&&lives<1)end();else next()};
   if(g.speedy&&q.mc){setTimeout(()=>{if(tm>0)go()},right?250:900)}else{$("#nx").hidden=false;$("#nx").focus();$("#nx").onclick=go}};
  if(q.mc)app.querySelectorAll(".opt").forEach(o=>o.onclick=()=>answer(o.textContent,o));
  else{let inp=$("#in");inp.focus();$("#ck").onclick=()=>answer(inp.value);inp.onkeydown=e=>{if(e.key=="Enter"){if(ans)$("#nx").click();else answer(inp.value)}}}};
 if(g.speedy)iv=setInterval(()=>{tm--;let s=$("#sc");if(s)s.textContent=hud();if(tm<=0)end()},1000);
 next()}
function welcome(chg){app.innerHTML=`<div class="panel res"><div class="big">👋</div><h2>${chg?"Who is playing?":"Bonjour !"}</h2><p>Type your first name and class (for example <b>Emma 7B</b>) so your teacher can see your stars.</p><input class="t" id="nm" maxlength="30" autocomplete="off" aria-label="Your name and class" value="${chg?"":esc(me)}"><div class="fb" id="fb"></div><div class="row"><button class="btn" id="go">C’est parti !</button>${me?`<button class="btn alt" id="cx">Cancel</button>`:""}</div></div>`;
 const nm=$("#nm");nm.focus();if($("#cx"))$("#cx").onclick=home;
 const go=()=>{let v=nm.value.trim().replace(/[,\t]/g," ");if(v.length<2){$("#fb").textContent="Please type your name.";return}
  if(v.toLowerCase()!=me.toLowerCase()){save={};log={}}me=v;store();home()};
 $("#go").onclick=go;nm.onkeydown=e=>{if(e.key=="Enter")go()}}
function report(){let rows=G.filter(g=>log[g.id]).map(g=>[me,g.id,log[g.id].s,log[g.id].p,log[g.id].d]);
 const tsv=rows.map(r=>r.join("\t")).join("\n"),csv="Pupil,Game,Stars,Score %,Date\n"+rows.map(r=>r.join(",")).join("\n");
 app.innerHTML=`<div class="bar"><button class="btn alt" id="back">← Menu</button><b>My results</b><span class="stars">⭐ ${stars()}</span></div><div class="panel"><h2>${esc(me)}</h2>${rows.length?`<table class="tbl"><tr><th>Game</th><th>Stars</th><th>Score</th><th>Date</th></tr>${rows.map(r=>`<tr><td>${r[1]}. ${G[r[1]-1].n}</td><td>${"⭐".repeat(r[2])}</td><td>${r[3]}%</td><td>${r[4]}</td></tr>`).join("")}</table><p>Send this to your teacher: download the file and attach it in Google Classroom, or copy the text and paste it in your private comment.</p><div class="row"><button class="btn" id="dl">⬇️ Download my results</button><button class="btn alt" id="cp">📋 Copy text</button></div><textarea class="t" id="tx" readonly aria-label="Results text"></textarea><div class="fb" id="fb"></div>`:`<p>No results yet. Play a game first!</p>`}</div>`;
 $("#back").onclick=home;if(!rows.length)return;$("#tx").value=tsv;
 $("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(tsv);$("#fb").textContent="✅ Copied!"}catch(e){$("#tx").select();$("#fb").textContent="Press Ctrl+C (or hold and copy) to copy the text."}};
 $("#dl").onclick=()=>{try{let a=document.createElement("a"),u=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.href=u;a.download="results-"+me.replace(/[^A-Za-z0-9]+/g,"-")+".csv";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);$("#fb").textContent="✅ Saved! Attach it in Classroom."}catch(e){$("#fb").textContent="Download not available here: use Copy text instead."}}}
home();
</script><footer class="pw-licence" style="max-width:1400px;margin:32px auto 0;padding:8px 20px 24px;font:13px/1.5 'IBM Plex Sans',system-ui,sans-serif;color:var(--ink-faint,#6b6b6b)">&copy; 2026 Physics Workout by Alexander Robson &middot; <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" rel="license" style="color:inherit;display:inline-block;padding:12px 0">CC BY-NC-SA 4.0</a>: share and adapt with credit, not for sale.<script>if(/[?&]embed\b/.test(location.search)||window.self!==window.top)document.currentScript.parentNode.hidden=true;</script></footer>
