# Rebuilds the Calculations and Graphs sets whenever a workout changes, so a fix
# to a workout reaches the sets a minute or two later. See tools/sets/build.py.
# Also keeps every page's Draft tag in step with tools/REVIEW.md (tools/review/drafts.py sync).
name: Build practice sets
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'animations/*.html'
      - 'tools/sitemap/**'
      - 'tools/sets/**'
      - 'tools/REVIEW.md'
      - 'tools/review/**'
      - '!calculations.html'
      - '!graphs.html'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-sets
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/sets/build.py
        continue-on-error: true  # a broken set must not stop the sitemap and Draft tags
      - run: python3 tools/sitemap/build.py
      - run: python3 tools/review/drafts.py sync
      - name: Commit rebuilt sets
        run: |
          git add -A -- '*.html' sitemap.xml
          if git diff --cached --quiet; then echo "Sets, sitemap and Draft tags already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild Calculations and Graphs sets, sitemap and Draft tags"
          git pull --rebase origin main
          git push origin HEAD:main
