# Rebuilds the Calculations and Graphs sets whenever a workout changes, so a fix
# to a workout reaches the sets a minute or two later. See tools/sets/build.py.
name: Build practice sets
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'tools/sets/**'
      - '!calculations.html'
      - '!graphs.html'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-sets
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/sets/build.py
      - name: Commit rebuilt sets
        run: |
          if git diff --quiet -- calculations.html graphs.html; then echo "Sets already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add calculations.html graphs.html
          git commit -m "Rebuild Calculations and Graphs sets from the workouts"
          git pull --rebase origin main
          git push origin HEAD:main
